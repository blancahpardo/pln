riaciones superficiales. Una de las operaciones más comunes es convertir todo el texto a minúsculas:"},{"type":"code","code":"texto_normalizado = texto.lower()"},{"type":"p","text":"El método .lower() devuelve una nueva cadena en la que las letras aparecen en minúscula. Esto permite tratar como equivalentes formas que solo difieren por mayúscula inicial:"},{"type":"table","rows":[["Forma original","Forma normalizada"],["Paciente","paciente"],["paciente","paciente"],["TRATAMIENTO","tratamiento"]],"title":"Forma original · Forma normalizada"},{"type":"p","text":"Esta operación es útil para contar frecuencias. Si no normalizamos, Paciente y paciente podrían contarse como formas distintas."},{"type":"p","text":"Pero en textos técnicos hay que ser prudentes. Algunas mayúsculas contienen información:"},{"type":"ul","items":["Siglas: AINE, VIH, ADN.","Nombres comerciales.","Unidades o códigos.","Nombres propios de instituciones."]},{"type":"p","text":"Convertir todo a minúsculas puede ser adecuado para un glosario preliminar, pero no siempre para una aplicación final. La decisión depende de la tarea."}]},{"id":"2-4-limpieza-de-puntuacion-con-expresiones-regulares","title":"2.4. Limpieza de puntuación con expresiones regulares","blocks":[{"type":"p","text":"Una forma habitual de eliminar signos de puntuación es usar re.sub():"},{"type":"code","code":"texto_sin_puntuacion = re.sub(r'[^\\w\\s]', '', texto_normalizado)"},{"type":"p","text":"Esta línea sustituye por una cadena vacía todo lo que coincida con el patrón."},{"type":"p","text":"El patrón es:"},{"type":"code","code":"r'[^\\w\\s]'"},{"type":"p","text":"Su significado puede desglosarse así:"},{"type":"table","rows":[["Parte","Significado"],["r''","Cadena raw"],["[...]","Clase de caracteres"],["^ dentro de corchetes","Negación: \"todo lo que no sea...\""],["\\w","Caracteres de palabra"],["\\s","Espacios en blanco"]],"title":"Su significado puede desglosarse así"},{"type":"p","text":"Por tanto, el patrón significa: busca todo carácter que no sea carácter de palabra ni espacio. En la práctica, elimina muchos signos de puntuación."},{"type":"p","text":"Esta limpieza puede facilitar recuentos y tokenización, pero también puede eliminar información útil:"},{"type":"ul","items":["Puntos que marcan final de oración.","Comas que indican estructura sintáctica.","Guiones en términos compuestos.","Porcentajes o símbolos en textos médicos."]},{"type":"p","text":"Ejemplo:"},{"type":"code","code":"10 mg/kg"},{"type":"p","text":"Si se eliminan símbolos sin cuidado, puede perderse la relación entre cantidad y unidad. En textos biomédicos, la puntuación y los símbolos pueden ser semánticamente importantes."}]},{"id":"2-5-tokenizacion-convertir-texto-en-unidades","title":"2.5. Tokenización: convertir texto en unidades","blocks":[{"type":"p","text":"La tokenización consiste en dividir un texto en unidades mínimas de análisis llamadas tokens. Un token puede ser una palabra, un número, un signo de puntuación o una unidad especial, según el tokenizador."},{"type":"p","text":"Con spaCy, se procesa el texto así:"},{"type":"code","code":"doc = nlp(texto_sin_puntuacion)\ntokens = [token.text for token in doc]"},{"type":"p","text":"doc es un objeto de spaCy que contiene el análisis lingüístico. Al recorrer doc, obtenemos objetos Token. Cada token tiene atributos."},{"type":"p","text":"El atributo token.text devuelve la forma textual del token:"},{"type":"code","code":"tokens = [token.text for token in doc]"},{"type":"p","text":"La tokenización es más que separar por espacios. Un tokenizador lingüístico puede reconocer signos, abreviaturas, contracciones, números y límites de una forma más sofisticada que un simple .split()."},{"type":"p","text":"En un pipeline profesional, tokenizar correctamente es esencial porque muchos pasos posteriores dependen de los tokens:"},{"type":"ul","items":["Eliminación de stopwords.","Lematización.","Conteo de frecuencias.","Etiquetado gramatical.","Extracción terminológica."]},{"type":"p","text":"Si la tokenización es mala, los pasos siguientes heredarán ese error."}]},{"id":"2-6-stopwords-palabras-vacias-y-decisiones-de-filtrado","title":"2.6. Stopwords: palabras vacías y decisiones de filtrado","blocks":[{"type":"p","text":"Las stopwords son palabras muy frecuentes que suelen aportar poca información léxica en ciertas tareas. En español, pueden incluir artículos, preposiciones, conjunciones y algunos pronombres."},{"type":"p","text":"Con NLTK se obtiene la lista así:"},{"type":"code","code":"stopwords_es = stopwords.words('spanish')"},{"type":"p","text":"Después se filtran los tokens:"},{"type":"code","code":"tokens_filtrados = [token for token in tokens if token not in stopwords_es]"},{"type":"p","text":"La lectura es:"},{"type":"code","code":"Conserva cada token si no está en la lista de stopwords en español."},{"type":"p","text":"Esta operación puede ser útil si queremos quedarnos con palabras de mayor carga léxica, como sustantivos, verbos o adjetivos relevantes."},{"type":"p","text":"Por ejemplo, en un texto farmacéutico puede interesar conservar:"},{"type":"code","code":"ibuprofeno, úlcera, gástrica, efectos, adversos, tratamiento"},{"type":"p","text":"y eliminar palabras como:"},{"type":"code","code":"la, de, con, en, los"},{"type":"p","text":"Pero esta decisión no es automática ni universal. En algunos contextos, palabras aparentemente funcionales son críticas."}]},{"id":"2-7-stopwords-en-textos-tecnicos-el-caso-de-la-negacion","title":"2.7. Stopwords en textos técnicos: el caso de la negación","blocks":[{"type":"p","text":"En textos médicos, algunas palabras que podrían considerarse funcionales tienen un valor semántico decisivo. La negación es el caso más claro."},{"type":"p","text":"Compara:"},{"type":"code","code":"Se recomienda su uso.\nNo se recomienda su uso."},{"type":"p","text":"La diferencia entre ambas frases depende de no. Si una lista de stopwords elimina no, el sistema puede perder una parte esencial del significado."},{"type":"p","text":"También son delicadas formas como:"},{"type":"ul","items":["sin","antes","después","durante","excepto","contra"]},{"type":"p","text":"En textos farmacéuticos, estas palabras pueden indicar condiciones, restricciones, secuencias temporales o contraindicaciones."},{"type":"p","text":"Por tanto, en contextos técnicos conviene revisar y adaptar la lista de stopwords. Una opción profesional sería crear una lista personalizada:"},{"type":"code","code":"stopwords_personalizadas = [w for w in stopwords_es if w not in [\"no\", \"sin\", \"antes\"]]"},{"type":"p","text":"Esta decisión muestra que el preprocesamiento no es solo técnico. Es lingüístico y profesional."}]},{"id":"2-8-lematizacion-reducir-variantes-a-una-forma-base","title":"2.8. Lematización: reducir variantes a una forma base","blocks":[{"type":"p","text":"La lematización consiste en obtener la forma canónica o de diccionario de una palabra. Esa forma se llama lema."},{"type":"p","text":"Ejemplos:"},{"type":"table","rows":[["Forma flexionada","Lema"],["pacientes","paciente"],["recomienda","recomendar"],["provocar","provocar"],["adversos","adverso"],["tratamientos","tratamiento"]],"title":"Ejemplos"},{"type":"p","text":"Con spaCy, el lema se obtiene mediante:"},{"type":"code","code":"token.lemma_"},{"type":"p","text":"Una lista de lemas filtrados puede construirse así:"},{"type":"code","code":"lemmas = [token.lemma_ for token in doc if token.text not in stopwords_es]"},{"type":"p","text":"La lematización es muy útil para análisis de frecuencia. Sin lematizar, paciente y pacientes se contarían como formas diferentes. Con lematización, pueden agruparse bajo una misma forma base."},{"type":"p","text":"Esto ayuda a construir glosarios más coherentes y a reducir dispersión morfológica en los datos."}]},{"id":"2-9-tokenizar-no-es-lematizar","title":"2.9. Tokenizar no es lematizar","blocks":[{"type":"p","text":"Es importante no confundir tokenización y lematización."},{"type":"table","rows":[["Proceso","Qué hace","Resultado"],["Tokenización","Divide el texto en unidades","pacientes, tratamientos, adversos"],["Lematización","Reduce cada unidad a su forma base","paciente, tratamiento, adverso"]],"title":"Proceso · Qué hace · Resultado"},{"type":"p","text":"Tokenizar responde a la pregunta:"},{"type":"code","code":"¿Cuáles son las unidades del texto?"},{"type":"p","text":"Lematizar responde a otra:"},{"type":"code","code":"¿Cuál es la forma canónica de cada unidad?"},{"type":"p","text":"Ambas operaciones son complementarias. Primero necesitamos unidades; después podemos obtener sus lemas."},{"type":"p","text":"En traducción automática y análisis terminológico, lematizar puede ayudar a detectar que varias formas pertenecen a la misma familia léxica o al mismo término base."}]},{"id":"2-10-frecuencias-con-counter","title":"2.10. Frecuencias con Counter","blocks":[{"type":"p","text":"Una vez obtenidos tokens o lemas, suele interesar contar cuántas veces aparece cada uno. Python ofrece Counter en el módulo collections:"},{"type":"code","code":"from collections import Counter\nfrecuencias = Counter(lemmas)"},{"type":"p","text":"Counter crea una estructura parecida a un diccionario:"},{"type":"code","code":"{\n    \"paciente\": 2,\n    \"tratamiento\": 1,\n    \"salud\": 1\n}"},{"type":"p","text":"Después se puede recorrer ordenando alfabéticamente:"},{"type":"code","code":"for palabra in sorted(frecuencias):\n    print(f\"- {palabra} ({frecuencias[palabra]})\")"},{"type":"p","text":"O por frecuencia:"},{"type":"code","code":"frecuencias.most_common()"},{"type":"p","text":"El recuento de frecuencias permite identificar términos recurrentes. En un corpus técnico, las palabras frecuentes pueden apuntar a conceptos centrales del dominio."}]},{"id":"2-11-glosario-preliminar-de-lemas","title":"2.11. Glosario preliminar de lemas","blocks":[{"type":"p","text":"Un glosario preliminar de lemas es una lista de formas canónicas con sus frecuencias. No es todavía un glosario terminológico validado, pero sirve como primera aproximación."},{"type":"p","text":"Ejemplo de salida:"},{"type":"code","code":"- adverso (1)\n- antecedente (1)\n- ibuprofeno (1)\n- paciente (2)\n- tratamiento (1)"},{"type":"p","text":"Este glosario ayuda a ver qué contenido léxico permanece después del filtrado. También permite detectar problemas:"},{"type":"ul","items":["Lemas incorrectos.","Términos partidos en varias unidades.","Palabras técnicas eliminadas por error.","Formas que deberían agruparse y no se han agrupado."]},{"type":"p","text":"En un proyecto real, este glosario debería revisarse por una persona con conocimiento lingüístico y terminológico."}]},{"id":"2-12-analisis-morfosintactico","title":"2.12. Análisis morfosintáctico","blocks":[{"type":"p","text":"El análisis morfosintáctico consiste en asignar información gramatical a las palabras de un texto. Una de sus tareas más habituales es el etiquetado PoS, del inglés *Part-of-Speech tagging*."},{"type":"p","text":"El etiquetado PoS asigna categorías como:"},{"type":"table","rows":[["Etiqueta","Categoría"],["NOUN","Sustantivo común"],["PROPN","Nombre propio"],["VERB","Verbo"],["ADJ","Adjetivo"],["ADV","Adverbio"],["ADP","Adposición o preposición"],["DET","Determinante"],["CCONJ","Conjunción coordinante"]],"title":"El etiquetado PoS asigna categorías como"},{"type":"p","text":"Con spaCy se accede a la categoría mediante:"},{"type":"code","code":"token.pos_"},{"type":"p","text":"Un recorrido básico sería:"},{"type":"code","code":"for token in doc:\n    print(token.text, token.pos_)"},{"type":"p","text":"Este análisis permite ir más allá de la forma superficial. Ya no solo vemos qué palabra aparece, sino qué papel gramatical general tiene."}]},{"id":"2-13-por-que-interesan-los-sustantivos-en-textos-tecnicos","title":"2.13. Por qué interesan los sustantivos en textos técnicos","blocks":[{"type":"p","text":"En textos médicos y farmacéuticos, muchos términos importantes son sustantivos o grupos nominales:"},{"type":"ul","items":["administración","ibuprofeno","pacientes","antecedentes","úlcera","efectos","tratamiento","sobredosis","farmacovigilancia"]},{"type":"p","text":"Por eso, una estrategia inicial para crear un glosario técnico consiste en extraer sustantivos:"},{"type":"code","code":"sustantivos = [token.text.lower() for token in doc if token.pos_ == \"NOUN\"]"},{"type":"p","text":"Esta línea conserva solo tokens cuya categoría gramatical sea NOUN."},{"type":"p","text":"Después se cuentan:"},{"type":"code","code":"frecuencia_sustantivos = Counter(sustantivos)"},{"type":"p","text":"Este procedimiento no captura toda la terminología, porque muchos términos técnicos son unidades multipalabra:"},{"type":"code","code":"úlcera gástrica\nefectos adversos\nprincipio activo\ninsuficiencia hepática\ncentro médico"},{"type":"p","text":"Aun así, la extracción de sustantivos es un primer paso útil para localizar núcleos terminológicos."}]},{"id":"2-14-frecuencia-por-categoria-gramatical","title":"2.14. Frecuencia por categoría gramatical","blocks":[{"type":"p","text":"También se puede contar cuántas veces aparece cada categoría gramatical:"},{"type":"code","code":"categorias = [token.pos_ for token in doc]\nconteo_categorias = Counter(categorias)"},{"type":"p","text":"Después se pueden mostrar solo algunas categorías:"},{"type":"code","code":"for categoria, freq in conteo_categorias.items():\n    if categoria in [\"NOUN\", \"VERB\", \"ADJ\"]:\n        print(f\"{categoria}: {freq}\")"},{"type":"p","text":"Este análisis da una visión general del tipo de texto. Un texto técnico suele tener una densidad importante de sustantivos y adjetivos especializados. Un texto instructivo puede tener muchos verbos en formas imperativas o perífrasis de obligación."},{"type":"p","text":"La distribución gramatical no es una interpretación completa, pero ayuda a caracterizar el corpus."}]},{"id":"2-15-glosario-tecnico-con-contexto","title":"2.15. Glosario técnico con contexto","blocks":[{"type":"p","text":"Un glosario útil no debería limitarse a listar palabras. Debe mostrar contexto. El contexto permite saber cómo se usa un término y si realmente es relevante."},{"type":"p","text":"Una estrategia consiste en recorrer las oraciones y mostrar cada sustantivo en su segmento:"},{"type":"code","code":"for sent in doc.sents:\n    for palabra in frecuencia_sustantivos:\n        if palabra in sent.text.lower():\n            print(f\"- [{palabra}] → {sent.text.strip()}\")"},{"type":"p","text":"La salida puede tener esta forma:"},{"type":"code","code":"- [ibuprofeno] → La administración de ibuprofeno debe realizarse con precaución...\n- [pacientes] → Los AINE pueden provocar efectos adversos..."},{"type":"p","text":"El contexto es fundamental para terminología. Una palabra aislada puede ser ambigua. En su oración, se ve su función, sus colocaciones y su relación con otros términos."},{"type":"p","text":"En traducción especializada, un glosario con contexto es mucho más útil que una lista descontextualizada."}]},{"id":"2-16-segmentacion-de-oraciones-con-spacy","title":"2.16. Segmentación de oraciones con spaCy","blocks":[{"type":"p","text":"spaCy permite acceder a las oraciones detectadas mediante:"},{"type":"code","code":"doc.sents"},{"type":"p","text":"Esto es útil para construir glosarios con contexto o para generar informes por oración."},{"type":"p","text":"Sin embargo, la segmentación depende de la puntuación y del modelo. Si antes eliminamos toda la puntuación, el sistema puede tener más dificultades para detectar límites oracionales. Por eso, para glosarios con contexto puede convenir procesar una versión que conserve la puntuación:"},{"type":"code","code":"doc_con_puntuacion = nlp(texto_normalizado)"},{"type":"p","text":"Esta decisión muestra de nuevo la importancia de conservar distintas versiones del texto. Una versión sin puntuación puede servir para contar palabras; una versión con puntuación puede servir para segmentar oraciones."}]},{"id":"2-17-versiones-del-texto-y-trazabilidad","title":"2.17. Versiones del texto y trazabilidad","blocks":[{"type":"p","text":"Un pipeline responsable conserva versiones intermedias del texto:"},{"type":"table","rows":[["Variable","Qué contiene","Para qué sirve"],["texto","Texto original","Referencia y comparación"],["texto_normalizado","Texto en minúsculas","Unificar formas"],["texto_sin_puntuacion","Texto sin signos","Recuento y filtrado básico"],["doc","Texto procesado por spaCy","Tokens, lemas, PoS"],["doc_con_puntuacion","Texto con puntuación procesado","Oraciones y contexto"]],"title":"Un pipeline responsable conserva versiones intermedias del texto"},{"type":"p","text":"Esta trazabilidad es muy importante en trabajos profesionales. Si un resultado parece extraño, podemos volver atrás y comprobar en qué paso se produjo el problema."},{"type":"p","text":"También ayuda a documentar decisiones. Un cliente o un equipo técnico puede preguntar por qué se eliminó la puntuación, por qué se conservaron ciertas palabras o por qué se extrajeron solo sustantivos. La respuesta debe poder reconstruirse."}]}],"navTitle":"Python para PLN"},{"id":"errores-frecuentes-de-aprendizaje","title":"Errores frecuentes de aprendizaje","blocks":[{"type":"errorlist","items":[{"term":"Pensar que limpiar siempre mejora el texto","desc":"Limpiar demasiado puede eliminar información crucial."},{"term":"Confundir token con palabra ortográfica","desc":"Un token depende del tokenizador. No siempre coincide con la intuición escolar de «palabra»."},{"term":"Eliminar stopwords sin revisar la lista","desc":"En textos técnicos, algunas stopwords pueden ser semánticamente importantes."},{"term":"Creer que lematizar es traducir","desc":"Lematizar obtiene una forma base dentro de la misma lengua. No produce equivalencias entre lenguas."},{"term":"Usar el texto sin puntuación para todo","desc":"Puede servir para algunas tareas, pero perjudicar la segmentación en oraciones."},{"term":"No revisar los errores del modelo","desc":"spaCy ofrece análisis automático, pero conviene revisar muestras, especialmente en dominios especializados."},{"term":"Extraer solo palabras aisladas","desc":"La terminología técnica suele estar formada por grupos de palabras."}]}],"subsections":[],"navTitle":"Errores frecuentes"},{"id":"sintesis-final","title":"Síntesis final","blocks":[{"type":"p","text":"El preprocesamiento es una fase decisiva en cualquier proyecto de PLN. En un corpus médico-farmacéutico, no basta con dividir el texto en palabras. Hay que decidir cómo normalizar, qué limpiar, qué conservar, qué filtrar y qué representar como unidad relevante."},{"type":"p","text":"spaCy permite procesar texto español y obtener tokens, lemas, categorías gramaticales y oraciones. NLTK aporta recursos como listas de stopwords. re permite limpiar mediante patrones. Counter ayuda a contar frecuencias. Juntas, estas herramientas permiten construir un pipeline inicial de análisis lingüístico."},{"type":"p","text":"Pero la herramienta más importante sigue siendo el criterio lingüístico. Un pipeline profesional no aplica reglas de forma ciega. Las adapta al dominio, revisa sus efectos y documenta sus decisiones."},{"type":"p","text":"En el escenario de la empresa de traducción automática biomédica, el objetivo no es producir una lista bonita de palabras. El objetivo es preparar datos fiables para que los sistemas posteriores trabajen con menos ruido y con más información útil."}],"subsections":[],"navTitle":"Síntesis"},{"id":"cierre-narrativo","title":"Cierre narrativo","blocks":[{"type":"p","text":"La empresa internacional no necesita únicamente más textos. Necesita textos preparados con criterio. En traducción automática biomédica, el corpus no es una materia prima neutra: contiene decisiones, riesgos y conocimiento especializado."},{"type":"p","text":"Tu papel como lingüista computacional consiste en transformar textos brutos en datos lingüísticamente útiles. Para ello combinas Python, spaCy, NLTK, expresiones regulares y análisis gramatical, pero sobre todo aplicas criterio: sabes qué se puede eliminar, qué se debe conservar y qué debe revisarse con cuidado."},{"type":"p","text":"Ese es el aprendizaje central de esta unidad: el preprocesamiento no es una tarea mecánica previa al verdadero análisis. Es ya análisis lingüístico aplicado. Cada paso del pipeline decide qué versión del texto verá la máquina y, por tanto, qué podrá aprender de él."}],"subsections":[],"navTitle":"Cierre narrativo"}],"references":[{"key":"chu2018","text":"Chu, C. y Wang, R. (2018). A survey of domain adaptation for neural machine translation. En Proceedings of the 27th International Conference on Computational Linguistics (pp. 1304–1319). Association for Computational Linguistics."},{"key":"demarneffe2021","text":"de Marneffe, M.-C., Manning, C. D., Nivre, J. y Zeman, D. (2021). Universal Dependencies. Computational Linguistics, 47(2), 255–308. https://doi.org/10.1162/coli_a_00402"},{"key":"gonzalezagirre2019","text":"González-Agirre, A., Marimon, M., Intxaurrondo, A., Rabal, O., Villegas, M. y Krallinger, M. (2019). PharmaCoNER: Pharmacological substances, compounds and proteins named entity recognition track. En Proceedings of the 5th Workshop on BioNLP Open Shared Tasks. Association for Computational Linguistics."},{"key":"kudo2018","text":"Kudo, T. y Richardson, J. (2018). SentencePiece: A simple and language independent subword tokenizer and detokenizer for neural text processing. En Proceedings of the 2018 Conference on Empirical Methods in Natural Language Processing: System Demonstrations. Association for Computational Linguistics."},{"key":"limalopez2020","text":"Lima López, S., Pérez, N., Cuadros, M. y Rigau, G. (2020). NUBes: A corpus of negation and uncertainty in Spanish clinical texts. En Proceedings of the Twelfth Language Resources and Evaluation Conference (pp. 5772–5781). European Language Resources Association."},{"key":"neumann2019","text":"Neumann, M., King, D., Beltagy, I. y Ammar, W. (2019). ScispaCy: Fast and robust models for biomedical natural language processing. En Proceedings of the 18th BioNLP Workshop and Shared Task. Association for Computational Linguistics."},{"key":"petrov2012","text":"Petrov, S., Das, D. y McDonald, R. (2012). A universal part-of-speech tagset. En Proceedings of the Eighth International Conference on Language Resources and Evaluation (LREC’12). European Language Resources Association."},{"key":"schmidt2024","text":"Schmidt, C. W., Reddy, V., Zhang, H., Alameddine, A., Uzan, O., Pinter, Y. y Tanner, C. (2024). Tokenization is more than compression. En Proceedings of the 2024 Conference on Empirical Methods in Natural Language Processing (pp. 678–702). Association for Computational Linguistics. https://doi.org/10.18653/v1/2024.emnlp-main.40"},{"key":"semenov2025","text":"Semenov, K., Huang, X., Zouhar, V., Berger, N., Zhu, D., Oncevay, A. y Chen, P. (2025). Findings of the WMT25 terminology translation task: Terminology is useful especially for good MTs. En Proceedings of the Tenth Conference on Machine Translation. Association for Computational Linguistics."},{"key":"sennrich2016","text":"Sennrich, R., Haddow, B. y Birch, A. (2016). Neural machine translation of rare words with subword units. En Proceedings of the 54th Annual Meeting of the Association for Computational Linguistics (Volume 1: Long Papers) (pp. 1715–1725). Association for Computational Linguistics. https://doi.org/10.18653/v1/P16-1162"},{"key":"toporkov2024","text":"Toporkov, O. y Agerri, R. (2024). On the role of morphological information for contextual lemmatization. Computational Linguistics, 50(1), 157–191. https://doi.org/10.1162/coli_a_00497"},{"key":"bird2009","text":"Bird, S., Klein, E. y Loper, E. (2009). Natural language processing with Python: Analyzing text with the Natural Language Toolkit. O’Reilly Media."},{"key":"loper2002","text":"Loper, E. y Bird, S. (2002). NLTK: The Natural Language Toolkit. Proceedings of the ACL Workshop on Effective Tools and Methodologies for Teaching Natural Language Processing and Computational Linguistics (pp. 63-70). Association for Computational Linguistics. https://aclanthology.org/W02-0109/"},{"key":"manning2008","text":"Manning, C. D., Raghavan, P. y Schütze, H. (2008). Introduction to information retrieval. Cambridge University Press."},{"key":"naturallanguagetoolk2026","text":"Natural Language Toolkit Project. (2026). Natural Language Toolkit. NLTK. https://www.nltk.org/"},{"key":"thepandasdevelopment2026a","text":"The pandas development team. (2026a). 10 minutes to pandas. pandas documentation. https://pandas.pydata.org/docs/user_guide/10min.html"},{"key":"thepandasdevelopment2026b","text":"The pandas development team. (2026b). pandas.DataFrame. pandas documentation. https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.html"},{"key":"thepandasdevelopment2026c","text":"The pandas development team. (2026c). pandas.DataFrame.to_csv. pandas documentation. https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.to_csv.html"},{"key":"wickham2014","text":"Wickham, H. (2014). Tidy data. Journal of Statistical Software, 59(10), 1–23. https://doi.org/10.18637/jss.v059.i10"}]}};

  function sha256Hex(text) {
    var enc = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", enc).then(function(buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function(b) {
        return b.toString(16).padStart(2, "0");
      }).join("");
    });
  }

  function showView(id) {
    document.querySelectorAll(".view").forEach(function(v) { v.hidden = true; });

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  var quizState = null;

  function renderQuizStart() {
    var root = document.getElementById("quiz-root");
    if (!root) return;
    root.innerHTML =
      '<div class="quiz-start">' +
      '<p>10 preguntas: 5 elegidas al azar del banco del manual y 5 del banco del cuaderno. Puedes repetir el intento tantas veces como quieras — cada vez se vuelven a elegir y reordenar las preguntas.</p>' +
      '<button class="quiz-btn" id="quiz-begin">Empezar</button>' +
      '</div>';
    document.getElementById("quiz-begin").addEventListener("click", startQuiz);
  }

  function startQuiz() {
    var fromManual = shuffle(QUIZ_MANUAL).slice(0, 5);
    var fromCuaderno = shuffle(QUIZ_CUADERNO).slice(0, 5);
    quizState = { questions: shuffle(fromManual.concat(fromCuaderno)), index: 0, score: 0 };
    renderQuizQuestion();
  }

  function renderQuizQuestion() {
    var root = document.getElementById("quiz-root");
    var total = quizState.questions.length;
    if (quizState.index >= total) {
      root.innerHTML =
        '<div class="quiz-result">' +
        '<div class="quiz-score">' + quizState.score + ' / ' + total + '</div>' +
        '<p>Puntuación de este intento.</p>' +
        '<button class="quiz-btn" id="quiz-retry">Volver a intentar</button>' +
        '</div>';
      document.getElementById("quiz-retry").addEventListener("click", startQuiz);
      return;
    }
    var q = quizState.questions[quizState.index];
    var opts = shuffle(q.answerOptions);
    var html = '<div class="quiz-progress">Pregunta ' + (quizState.index + 1) + ' de ' + total + ' · Puntuación provisional: ' + quizState.score + '</div>';
    html += '<div class="quiz-q"><h3>' + q.question + '</h3>';
    opts.forEach(function(opt, i) {
      html += '<button class="quiz-opt" data-idx="' + i + '">' + opt.text + '</button>';
    });
    html += '<div class="quiz-feedback" id="quiz-feedback" hidden></div>';
    html += '</div>';
    root.innerHTML = html;
    var buttons = root.querySelectorAll(".quiz-opt");
    buttons.forEach(function(btn, i) {
      btn.addEventListener("click", function() {
        buttons.forEach(function(b) { b.disabled = true; });
        var chosen = opts[i];
        if (chosen.isCorrect) { btn.classList.add("correct"); quizState.score++; }
        else {
          btn.classList.add("incorrect");
          buttons.forEach(function(b2, j) { if (opts[j].isCorrect) b2.classList.add("correct"); });
        }
        var fb = document.getElementById("quiz-feedback");
        fb.hidden = false;
        fb.textContent = chosen.rationale || (chosen.isCorrect ? "Correcto." : "Incorrecto.");
        var next = document.createElement("button");
        next.className = "quiz-btn";
        next.style.marginTop = "14px";
        next.textContent = quizState.index + 1 < total ? "Siguiente" : "Ver puntuación";
        next.addEventListener("click", function() { quizState.index++; renderQuizQuestion(); });
        root.querySelector(".quiz-q").appendChild(next);
      });
    });
  }

  function imEsc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function imEmph(t) {
    // **negrita**, ***negrita cursiva*** y *cursiva* (el texto ya viene escapado)
    return t.replace(/\*\*\*(?!\s)([^*]+?)\*\*\*/g, "<strong><em>$1</em></strong>")
            .replace(/\*\*(?!\s)([^*]+?)\*\*/g, "<strong>$1</strong>")
            .replace(/(^|[^\w*])\*(?![\s*])([^*]+?)\*(?![\w*])/g, "$1<em>$2</em>");
  }
  function imFormatBackticks(s) {
    var parts = s.split("`"), out = "";
    for (var i = 0; i < parts.length; i++) out += (i % 2 === 1) ? '<code class="im-inline">' + imEsc(parts[i]) + "</code>" : imEmph(imEsc(parts[i]));
    return out;
  }
  function imFormatInline(raw) {
    var re = /{{cite:([^}]*)}}([\s\S]*?){{\/cite}}/g;
    var out = "", last = 0, m;
    while ((m = re.exec(raw))) {
      out += imFormatBackticks(raw.slice(last, m.index));
      out += '<span class="im-cite" data-refs="' + m[1] + '">' + imFormatBackticks(m[2]) + ' <span aria-hidden="true">ⓘ</span></span>';
      last = re.lastIndex;
    }
    out += imFormatBackticks(raw.slice(last));
    return out;
  }
  function imLinkify(text) {
    var re = /(https?:\/\/[^\s]+)/g;
    var out = "", last = 0, m;
    while ((m = re.exec(text))) {
      out += imEsc(text.slice(last, m.index));
      var url = m[1].replace(/[.,;]+$/, "");
      out += '<a href="' + imEsc(url) + '" target="_blank" rel="noopener">' + imEsc(url) + "</a>";
      last = m.index + url.length;
    }
    out += imEsc(text.slice(last));
    return out;
  }
  function imBibText(text) {
    // *word* marks an APA-italicized container title (book/journal name+volume/etc.)
    return text.split(/(\*[^*]+\*)/g).map(function(part) {
      if (part.charAt(0) === "*" && part.charAt(part.length - 1) === "*" && part.length > 1) {
        return "<em>" + imLinkify(part.slice(1, -1)) + "</em>";
      }
      return imLinkify(part);
    }).join("");
  }

      else if (b.type === "image_modal") html += '<button class="im-img-btn" data-im-img-modal="' + key + '" data-im-img-title="' + imEsc(b.alt || "") + '">' +

        '<div class="im-reveal-box" id="im-reveal-' + key + '"><img src="' + imEsc(b.src) + '" alt="' + imEsc(b.alt || "") + '">' +
        (b.caption ? '<figcaption class="im-figure-caption">' + imFormatInline(b.caption) + "</figcaption>" : "") + "</div>";
      else if (b.type === "errorlist") html += '<p class="im-check-hint">Antes de abrir cada error, piensa por qué es un error. Después, toca la tarjeta para comprobarlo.</p>' +
        '<ul class="im-errorlist">' + b.items.map(function(it) {
        return '<li class="im-err-reveal"><span class="im-error-term">' + imFormatInline(it.term) + '</span><span class="im-err-cta">¿Por qué es un error? Toca para verlo ▸</span><span class="im-error-desc">' + imFormatInline(it.desc) + "</span></li>";
      }).join("") + "</ul>";
      else if (b.type === "docimg") html += '<figure class="im-docimg"><img class="im-docimg-img" src="' + imEsc(b.src) + '" alt="' + imEsc(b.alt || "") + '"' + (b.w ? ' style="width:' + b.w + 'px"' : "") + "></figure>";
      else if (b.type === "biblist") html += '<ul class="im-biblist">' + b.items.map(function(t) { return "<li>" + imBibText(t) + "</li>"; }).join("") + "</ul>";
    });
    return html;
  }
  function imWireCommon(root, data) {
    root.querySelectorAll(".im-err-reveal").forEach(function(li) {
      li.addEventListener("click", function() { li.classList.toggle("open"); });
    });
    root.querySelectorAll(".im-docimg-img").forEach(function(img) {
      img.addEventListener("click", function() { imOpenModal("Figura del manual", '<img src="' + img.src + '" alt="">', true); });
    });
    root.querySelectorAll("[data-im-check]").forEach(function(cb) {
      cb.addEventListener("change", function() {
        var key = cb.closest("[data-im-checklist]").dataset.imChecklist, saved = {};
        try { saved = JSON.parse(localStorage.getItem(key) || "{}"); } catch (e) {}
        if (cb.checked) saved[cb.dataset.imCheck] = 1; else delete saved[cb.dataset.imCheck];
        try { localStorage.setItem(key, JSON.stringify(saved)); } catch (e) {}
      });
    });
    root.querySelectorAll(".im-figure-img").forEach(function(img) {
      img.addEventListener("click", function() {
        imOpenModal(img.alt || "Infografía", '<img src="' + img.src + '" alt="' + img.alt.replace(/"/g, "&quot;") + '">', true);
      });
    });
    root.querySelectorAll("[data-im-img-modal]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var tpl = root.querySelector('[data-im-img-src="' + btn.dataset.imImgModal + '"]');
        if (tpl) imOpenModal(btn.dataset.imImgTitle || "Infografía", tpl.innerHTML, true);
      });
    });
    root.querySelectorAll("[data-im-reveal]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var box = document.getElementById("im-reveal-" + btn.dataset.imReveal);
        box.classList.toggle("open");
      });
    });
    root.querySelectorAll("[data-im-code]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var box = document.getElementById("im-code-" + btn.dataset.imCode);
        var open = box.classList.toggle("open");
        btn.textContent = open ? "🔽 Ocultar el código" : "🔎 Descubre el código";
      });
    });
    root.querySelectorAll("[data-im-table]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var tpl = root.querySelector('[data-im-table-src="' + btn.dataset.imTable + '"]');
        if (tpl) imOpenModal(btn.dataset.imTableTitle, tpl.innerHTML);
      });
    });
    root.querySelectorAll(".im-cite").forEach(function(span) {
      span.addEventListener("click", function() {
        var existing = span.nextElementSibling;
        if (existing && existing.classList && existing.classList.contains("im-cite-pop")) {
          existing.classList.toggle("open");
          return;
        }
        var refs = imRefLookup(data);
        var keys = span.dataset.refs.split(",");
        var pop = document.createElement("div");
        pop.className = "im-cite-pop open";
        pop.innerHTML = keys.map(function(k) { return "<p>" + imBibText(refs[k] || k) + "</p>"; }).join("") +
          '<p><a href="#" data-im-goto-bib="' + keys[0] + '">Ver en Bibliografía →</a></p>';
        span.parentNode.insertBefore(pop, span.nextSibling);
        pop.querySelector("[data-im-goto-bib]").addEventListener("click", function(e) {
          e.preventDefault();
          imShowBib(root, data, this.dataset.imGotoBib);
        });
      });
    });
  }
  function imRailHtml(data, activeIdx) {
    var items = '<button class="im-rail-btn" data-im-rail-home="1"><span class="im-rail-icon">🏠</span><span class="im-rail-label">Índice</span></button>';
    items += data.sections.map(function(sec, i) {
      var icon = IM_ICONS[sec.navTitle] || "📖";
      return '<button class="im-rail-btn' + (activeIdx === i ? " active" : "") + '" data-im-rail-chapter="' + i + '">' +
        '<span class="im-rail-icon">' + icon + '</span><span class="im-rail-label">' + imEsc(sec.navTitle) + "</span></button>";
    }).join("");
    if (data.references && data.references.length) {
      items += '<button class="im-rail-btn' + (activeIdx === "bib" ? " active" : "") + '" data-im-rail-bib="1">' +
        '<span class="im-rail-icon">📖</span><span class="im-rail-label">Bibliografía</span></button>';
    }
    items += '<button class="im-rail-btn im-fs-rail" data-im-fs-rail="1" title="Pantalla completa"><span class="im-rail-icon">⛶</span><span class="im-rail-label">' + (imFsElement() ? "Salir" : "Pantalla") + "</span></button>";
    return '<div class="im-rail">' + items + "</div>";
  }
  function imWireRail(root, data) {
    var homeBtn = root.querySelector("[data-im-rail-home]");
    if (homeBtn) homeBtn.addEventListener("click", function() { imShowIndex(root, data); });
    root.querySelectorAll("[data-im-rail-chapter]").forEach(function(btn) {
      btn.addEventListener("click", function() { imShowChapter(root, data, parseInt(btn.dataset.imRailChapter, 10)); });
    });
    var railBib = root.querySelector("[data-im-rail-bib]");
    if (railBib) railBib.addEventListener("click", function() { imShowBib(root, data, null); });
    var railFs = root.querySelector("[data-im-fs-rail]");
    if (railFs) railFs.addEventListener("click", function() { imToggleFullscreen(root); });
  }
  function imShowBib(root, data, highlightKey) {
    var html = imRailHtml(data, "bib");
    html += '<div class="im-chapter"><h3 class="im-chapter-title">📖 Bibliografía</h3>';
    html += '<h4 class="ref-intro">Referencias en formato APA (7ª edición)</h4>';
    html += '<div class="im-bib-list">' + data.references.map(function(r) {
      var cls = "ref-item im-bib-item" + (r.key === highlightKey ? " im-bib-highlight" : "");
      return '<p class="' + cls + '" id="im-bib-' + r.key + '">' + imBibText(r.text) + "</p>";
    }).join("") + "</div></div>";
    root.innerHTML = html;
    imWireRail(root, data);
    if (highlightKey) {
      var el = document.getElementById("im-bib-" + highlightKey);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }
  function imShowChapter(root, data, idx) {
    var sec = data.sections[idx];
    var icon = IM_ICONS[sec.navTitle] || "📖";
    var html = imRailHtml(data, idx);
    html += '<div class="im-chapter"><h3 class="im-chapter-title">' + icon + " " + imFormatInline(sec.title) + "</h3>";
    if (sec.navTitle === "Qué vas a aprender") html += '<div data-im-checklist="' + imCheckKey(root, idx) + '">' + imRenderChecklist(root, idx, sec.blocks) + "</div>";
    else html += imRenderBlocks(sec.blocks, idx + "-i");
    sec.subsections.forEach(function(sub, j) {
      html += '<div class="im-sub" data-im-sub="' + j + '">' +
        '<button class="im-sub-head"><span class="im-sub-title">' + imFormatInline(sub.title) + '</span><span class="im-sub-arrow">▶</span></button>' +
        '<div class="im-sub-body">' + imRenderBlocks(sub.blocks, idx + "-" + j) + "</div></div>";
    });
    var prev = data.sections[idx - 1], next = data.sections[idx + 1];
    html += '<div class="im-pager">' +
      (prev ? '<button class="im-prev" data-im-goto="' + (idx - 1) + '">← ' + imEsc(prev.navTitle) + "</button>" : "") +
      (next ? '<button class="im-next" data-im-goto="' + (idx + 1) + '">' + imEsc(next.navTitle) + " →</button>"
            : (data.references && data.references.length ? '<button class="im-next" data-im-goto="bib">Bibliografía →</button>' : "")) +
      "</div>";
    html += "</div>";
    root.innerHTML = html;
    imMarkVisited(root, idx);
    imScrollTop(root);
    root.querySelectorAll("[data-im-goto]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        if (btn.dataset.imGoto === "bib") imShowBib(root, data, null);
        else imShowChapter(root, data, parseInt(btn.dataset.imGoto, 10));
      });
    });
    imWireCommon(root, data);
    imWireRail(root, data);
    root.querySelectorAll(".im-sub-head").forEach(function(head) {
      head.addEventListener("click", function() {
        var thisSub = head.parentElement;
        var wasOpen = thisSub.classList.contains("open");
        root.querySelectorAll(".im-sub.open").forEach(function(s) { s.classList.remove("open"); });
        if (!wasOpen) thisSub.classList.add("open");
      });
    });
  }
  function imShowIndex(root, data) {
    var pdf = root.dataset.pdf;
    var visited = imGetVisited(root);
    var nVisited = data.sections.filter(function(s, i) { return visited[i]; }).length;
    var cards = data.sections.map(function(sec, i) {
      var icon = IM_ICONS[sec.navTitle] || "📖";
      return '<button class="im-card' + (visited[i] ? " visited" : "") + '" data-im-chapter="' + i + '" style="animation-delay:' + (i * 0.04) + 's">' +
        '<span class="im-card-icon">' + icon + '</span>' +
        '<span class="im-card-title">' + imEsc(sec.navTitle) + "</span>" +
        (sec.subsections.length ? '<span class="im-card-meta">' + sec.subsections.length + " apartados</span>" : "") +
        "</button>";
    }).join("");
    var bibCard = (data.references && data.references.length)
      ? '<button class="im-card im-card-bib" data-im-bib="1" style="animation-delay:' + (data.sections.length * 0.04) + 's">' +
        '<span class="im-card-icon">📖</span><span class="im-card-title">Bibliografía</span>' +
        '<span class="im-card-meta">' + data.references.length + ' referencias en APA 7ª ed.</span></button>'
      : "";
    var hero = '<div class="im-hero"><div class="im-hero-tools">' +
      '<button class="im-fs-btn">' + imFsLabel() + "</button>" +
      (pdf ? '<a class="im-hero-dl" href="' + imEsc(pdf) + '" download>⬇ Descargar manual en PDF</a>' : "") + "</div>" +
      '<div class="im-hero-kicker">' + imEsc(data.header.kicker) + " · " + imEsc(data.header.title) + "</div>" +
      '<h1 class="im-hero-title">' + imEsc(data.header.subtitle) + "</h1>" +
      (data.header.narrative ? '<p class="im-hero-lema">' + imEsc(data.header.narrative) + "</p>" : "") + "</div>";
    var progress = nVisited ? '<p class="im-progress">Has abierto ' + nVisited + " de " + data.sections.length + " capítulos.</p>" : "";
    root.innerHTML = hero + progress + '<div class="im-grid">' + cards + bibCard + "</div>";
    root.querySelector(".im-fs-btn").addEventListener("click", function() { imToggleFullscreen(root); });
    imScrollTop(root);
    root.querySelectorAll("[data-im-chapter]").forEach(function(btn) {
      btn.addEventListener("click", function() { imShowChapter(root, data, parseInt(btn.dataset.imChapter, 10)); });
    });
    var bibBtn = root.querySelector("[data-im-bib]");
    if (bibBtn) bibBtn.addEventListener("click", function() { imShowBib(root, data, null); });
  }
  function renderInteractiveManual(viewKey) {
    if (imRendered[viewKey]) return;
    imRendered[viewKey] = true;
    var data = IM_DATA[viewKey];
    if (!data) return;
    var root = document.getElementById("im-root-" + viewKey);
    if (!root) return;
    imShowIndex(root, data);
  }

  function wireNav() {
    document.querySelectorAll(".hub-btn").forEach(function(btn) {
      btn.addEventListener("click", function() {
        showView(btn.dataset.view);
        if (btn.dataset.view === "quiz") renderQuizStart();
        if (IM_DATA[btn.dataset.view]) renderInteractiveManual(btn.dataset.view);
      });
    });
    document.querySelectorAll("[data-back]").forEach(function(btn) {
      btn.addEventListener("click", function() { showView(btn.dataset.back); });
    });
  }

  function applyStudentVisibility(config) {
    document.querySelectorAll(".hub-btn[data-type]").forEach(function(btn) {
      var t = btn.dataset.type;
      btn.style.display = config[t] ? "" : "none";
    });
  }

  function applyTeacherHints(config) {
    document.querySelectorAll(".teacher-hint[data-hint]").forEach(function(span) {
      var t = span.dataset.hint;
      var on = !!config[t];
      span.textContent = on ? "visible" : "oculto";
      span.className = "teacher-hint " + (on ? "on" : "off");
    });
    document.querySelectorAll("#teacher-panel input[type=checkbox][data-type]").forEach(function(chk) {
      chk.checked = !!config[chk.dataset.type];
    });
  }

  function fetchConfig() {
    return fetch(LOCAL_CONFIG + "?t=" + Date.now()).then(function(r) { return r.json(); });
  }

  function ghHeaders(token) {
    return { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" };
  }

  function ghGetFile(token) {
    return fetch("https://api.github.com/repos/" + REPO + "/contents/" + GH_CONFIG_PATH, { headers: ghHeaders(token) })
      .then(function(r) {
        if (!r.ok) throw new Error("No se pudo leer el fichero (" + r.status + ")");
        return r.json();
      })
      .then(function(data) {
        configSha = data.sha;
        return JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\n/g, "")))));
      });
  }

  function ghSaveFile(token, configObj) {
    var content = btoa(unescape(encodeURIComponent(JSON.stringify(configObj, null, 2) + "\n")));
    return fetch("https://api.github.com/repos/" + REPO + "/contents/" + GH_CONFIG_PATH, {
      method: "PUT",
      headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders(token)),
      body: JSON.stringify({
        message: "Modo profesora: actualizar visibilidad de materiales (" + GH_CONFIG_PATH + ")",
        content: content,
        sha: configSha
      })
    }).then(function(r) {
      if (!r.ok) return r.text().then(function(t) { throw new Error("Error al guardar (" + r.status + "): " + t); });
      return r.json();
    }).then(function(data) {
      configSha = data.content.sha;
    });
  }

  function getToken() {
    try { return sessionStorage.getItem("gh_pat") || ""; } catch (e) { return ""; }
  }
  function setToken(t) {
    try { sessionStorage.setItem("gh_pat", t); } catch (e) {}
  }

  function setStatus(msg, isError) {
    var el = document.getElementById("teacher-status");
    if (!el) return;
    el.textContent = msg;
    el.style.color = isError ? "#FFB3B3" : "#9FE6A0";
  }

  function initTeacherPanel() {
    document.getElementById("teacher-panel").hidden = false;
    var tokenInput = document.getElementById("gh-token");
    tokenInput.value = getToken();

    document.getElementById("gh-token-save").addEventListener("click", function() {
      setToken(tokenInput.value.trim());
      setStatus(tokenInput.value.trim() ? "Token guardado para esta sesión." : "Token borrado.");
      refreshFromGithub();
    });

    document.querySelectorAll("#teacher-panel input[type=checkbox][data-type]").forEach(function(chk) {
      chk.addEventListener("change", function() {
        var token = getToken();
        if (!token) { setStatus("Pega primero tu token de GitHub.", true); chk.checked = !chk.checked; return; }
        setStatus("Guardando...");
        ghGetFile(token).then(function(current) {
          current[chk.dataset.type] = chk.checked;
          return ghSaveFile(token, current).then(function() { return current; });
        }).then(function(current) {
          applyTeacherHints(current);
          setStatus("Guardado ✓ — el alumnado lo verá en 1-2 minutos.");
        }).catch(function(err) {
          chk.checked = !chk.checked;
          setStatus(err.message, true);
        });
      });
    });

    refreshFromGithub();

    function refreshFromGithub() {
      var token = getToken();
      if (!token) { fetchConfig().then(applyTeacherHints); return; }
      setStatus("Cargando estado actual...");
      ghGetFile(token).then(function(current) {
        applyTeacherHints(current);
        setStatus("Conectado. Puedes marcar/desmarcar materiales.");
      }).catch(function(err) { setStatus(err.message, true); fetchConfig().then(applyTeacherHints); });
    }
  }

  function reveal(teacherMode) {
    isTeacher = teacherMode;
    document.getElementById("content").innerHTML = decodeURIComponent(escape(atob(PAYLOAD)));
    document.getElementById("gate").style.display = "none";
    document.getElementById("page").style.display = "block";
    wireNav();
    if (teacherMode) {
      document.querySelectorAll(".hub-btn[data-type]").forEach(function(btn) { btn.style.display = ""; });
      initTeacherPanel();
    } else {
      fetchConfig().then(applyStudentVisibility);
    }
    try { sessionStorage.setItem(SESSION_KEY, teacherMode ? "teacher" : "1"); } catch (e) {}
  }

  function tryUnlock() {
    var val = document.getElementById("pw").value;
    sha256Hex(val).then(function(hex) {
      if (hex === TEACHER_HASH) { reveal(true); return; }
      if (hex === HASH) {
        fetch(ROOT_CONFIG + "?t=" + Date.now()).then(function(r) { return r.json(); }).then(function(rootCfg) {
          if (rootCfg[TEMA_KEY] === false) {
            document.getElementById("err").textContent = "Este tema no está disponible por el momento.";
          } else {
            reveal(false);
          }
        }).catch(function() { reveal(false); });
        return;
      }
      document.getElementById("err").textContent = "Contraseña incorrecta.";
    });
  }

  document.getElementById("enter").addEventListener("click", tryUnlock);
  document.getElementById("pw").addEventListener("keydown", function(e) { if (e.key === "Enter") tryUnlock(); });

  try {
    var saved = sessionStorage.getItem(SESSION_KEY);
    if (saved === "teacher") reveal(true);
    else if (saved === "1") reveal(false);
  } catch (e) {}
})();
</script>
</body>
</html>
