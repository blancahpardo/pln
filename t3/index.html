<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tema 3 — PLN</title>
<style>

:root {
  --azul: #003B5C;
  --azul-d: #00283F;
  --amar: #F4C542;
  --gris: #34484F;
  --claro: #F3F3F4;
  --humo: #9FB1BA;
  --verde: #2E7D32;
  --rojo: #B00020;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: var(--gris); background:#fff; }
a { color: inherit; }

#gate { position:fixed; inset:0; background:var(--azul); display:flex; align-items:center; justify-content:center; padding:24px; z-index:999; }
#gate .box { max-width:380px; width:100%; text-align:center; }
#gate .kicker { color:var(--amar); font-size:12px; font-weight:bold; letter-spacing:2.5px; text-transform:uppercase; margin-bottom:10px; }
#gate h1 { color:#fff; font-size:26px; margin:0 0 10px; }
#gate p { color:var(--humo); font-size:14px; margin:0 0 26px; }
#gate input { width:100%; padding:13px 16px; border-radius:8px; border:none; font-size:15px; font-family:Arial,Helvetica,sans-serif; margin-bottom:14px; outline:2px solid transparent; }
#gate input:focus { outline:2px solid var(--amar); }
#gate button.submit { width:100%; padding:13px 16px; border-radius:8px; border:none; background:var(--amar); color:var(--azul-d); font-size:15px; font-weight:bold; font-family:Arial,Helvetica,sans-serif; cursor:pointer; }
#gate button.submit:hover { filter:brightness(1.06); }
#gate .error { color:#FFB3B3; font-size:13px; margin-top:12px; min-height:18px; }
#page { display:none; }
main { max-width:980px; margin:0 auto; padding:48px clamp(20px,6vw,48px) 60px; }
.kicker { color:var(--amar); font-size:12px; font-weight:bold; letter-spacing:2.5px; text-transform:uppercase; margin-bottom:8px; }
.view > h1 { color:var(--azul); font-size:32px; margin:0 0 34px; }
.hub-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; margin-bottom:30px; }
.hub-btn { display:flex; flex-direction:column; align-items:flex-start; gap:6px; background:var(--claro); border:none; border-radius:12px; padding:26px 22px; cursor:pointer; text-align:left; box-shadow:0 2px 10px rgba(159,177,186,.28); font-family:Arial,Helvetica,sans-serif; position:relative; }
.hub-btn:hover { background:#E9ECEE; }
.hub-icon { font-size:30px; margin-bottom:4px; }
.hub-label { font-size:17px; font-weight:bold; color:var(--azul); }
.hub-desc { font-size:12.5px; color:var(--humo); }
.back-home { font-size:13px; color:var(--humo); text-decoration:none; }
.back-home:hover { color:var(--azul); }
.sub-view h2 { color:var(--azul); font-size:24px; margin:18px 0 4px; }
.work-notice { background:#FFF7DD; border:1.5px solid var(--amar); border-radius:8px; padding:10px 14px; margin:0 0 14px; font-size:13.5px; color:var(--gris); line-height:1.5; }
.sub-view .section-note { font-size:13px; color:var(--humo); margin:0 0 24px; }
.back-btn { background:none; border:1.5px solid var(--azul); color:var(--azul); font-size:13px; font-weight:bold; padding:6px 14px; border-radius:20px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.back-btn:hover { background:var(--azul); color:#fff; }
.dl-big { display:inline-block; background:var(--amar); color:var(--azul-d); font-weight:bold; font-size:14px; text-decoration:none; padding:10px 20px; border-radius:20px; margin-bottom:18px; }
.pdf-frame { width:100%; height:78vh; border:none; border-radius:8px; box-shadow:0 2px 10px rgba(159,177,186,.28); }
.dl-row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
.dl-row .dl-big { margin-bottom:0; }
.dl-alt { background:#fff; color:var(--azul); border:2px solid var(--azul); padding:8px 18px; }
.pdf-frame-xl { width:min(1300px,96vw); margin-left:calc(50% - min(650px,48vw)); height:calc(100vh - 150px); min-height:560px; }
.img-frame { display:block; width:100%; height:auto; border-radius:8px; box-shadow:0 2px 10px rgba(159,177,186,.28); }
.img-caption { font-size:11px; color:var(--humo); text-align:center; margin-top:10px; font-style:italic; }
.img-caption em { font-style:italic; }
.img-caption a { color:var(--humo); }
.ref-intro { color:var(--azul); font-size:16px; margin:0 0 16px; }
.ref-item { font-size:13.5px; color:var(--gris); line-height:1.6; margin:0 0 16px; padding-left:28px; text-indent:-28px; }
.ref-item a { color:var(--azul); word-break:break-all; }
.ref-item em { font-style:italic; }
.ref-img-block { margin:0 0 16px; }
.ref-img-block .ref-img { display:block; width:100%; height:auto; border-radius:8px; box-shadow:0 2px 10px rgba(159,177,186,.28); margin-bottom:8px; }
.ref-img-block .ref-item { padding-left:0; text-indent:0; }
.notice { font-size:12px; color:var(--humo); font-style:italic; margin-top:10px; }
/* quiz */
.quiz-start { background:var(--claro); border-radius:12px; padding:26px; }
.quiz-start p { font-size:14px; margin:0 0 18px; }
.quiz-btn { background:var(--azul); color:#fff; border:none; border-radius:20px; padding:11px 22px; font-size:14px; font-weight:bold; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.quiz-btn:hover { filter:brightness(1.15); }
.quiz-progress { font-size:12px; color:var(--humo); margin-bottom:6px; }
.quiz-q { background:var(--claro); border-radius:12px; padding:24px; margin-bottom:18px; }
.quiz-q h3 { color:var(--azul); font-size:17px; margin:0 0 18px; }
.quiz-opt { display:block; width:100%; text-align:left; background:#fff; border:1.5px solid var(--humo); border-radius:8px; padding:12px 16px; margin-bottom:10px; font-size:14px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; color:var(--gris); }
.quiz-opt:hover { border-color:var(--azul); }
.quiz-opt.correct { border-color:var(--verde); background:#EAF6EB; font-weight:bold; }
.quiz-opt.incorrect { border-color:var(--rojo); background:#FBEAEC; }
.quiz-opt[disabled] { cursor:default; }
.quiz-feedback { font-size:13px; color:var(--gris); background:#fff; border-radius:8px; padding:12px 16px; margin-top:4px; margin-bottom:16px; border-left:3px solid var(--azul); }
.quiz-score { font-size:26px; font-weight:bold; color:var(--azul); margin-bottom:8px; }
.quiz-result { background:var(--claro); border-radius:12px; padding:30px; text-align:center; }
/* interactive manual */
.im-root { margin-top:0; }
.im-view .im-root { width:min(1320px, 96vw); margin-left:calc(50% - min(660px, 48vw)); }
.im-root:fullscreen { width:100%; margin:0; background:#fff; overflow:auto; padding:22px clamp(16px,4vw,56px) 40px; box-sizing:border-box; }
.im-root:-webkit-full-screen { width:100%; margin:0; background:#fff; overflow:auto; padding:22px clamp(16px,4vw,56px) 40px; box-sizing:border-box; }
.im-hero-tools { position:absolute; top:16px; right:16px; display:flex; gap:8px; z-index:1; flex-wrap:wrap; justify-content:flex-end; }
.im-hero-tools .im-hero-dl { position:static; }
.im-fs-btn { background:rgba(255,255,255,.14); color:#fff; border:1.5px solid rgba(255,255,255,.55); border-radius:20px; padding:8px 14px; font-size:12px; font-weight:bold; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.im-fs-btn:hover { background:rgba(255,255,255,.26); }
.im-rail .im-fs-rail { margin-left:auto; }
.im-hero-lema { color:#fff; opacity:.86; font-style:italic; font-size:14.5px; line-height:1.5; margin:12px 0 0; max-width:720px; position:relative; z-index:1; }
.im-card { position:relative; }
.im-card.visited::after { content:"✓ leído"; position:absolute; top:12px; right:12px; font-size:10.5px; font-weight:bold; color:var(--verde); background:#DFF3E0; border-radius:10px; padding:2px 8px; }
.im-progress { font-size:12.5px; color:var(--humo); margin:-8px 0 14px; }
.im-docimg { margin:8px 0 18px; text-align:center; }
.im-docimg img { max-width:100%; max-height:60vh; height:auto; cursor:zoom-in; border-radius:6px; }
.im-biblist { list-style:none; padding:0; margin:0 0 8px; }
.im-biblist li { background:var(--claro); border-left:3px solid var(--amar); border-radius:0 8px 8px 0; padding:10px 14px; margin-bottom:8px; font-size:13.5px; line-height:1.55; color:var(--gris); }
.im-biblist a { color:var(--azul); word-break:break-word; }
.im-check { list-style:none; padding:0; margin:0 0 14px; }
.im-check li { margin-bottom:8px; }
.im-check label { display:flex; gap:10px; align-items:flex-start; cursor:pointer; font-size:14.5px; line-height:1.55; color:var(--gris); background:var(--claro); border-radius:10px; padding:10px 14px; }
.im-check input { margin-top:4px; accent-color:var(--azul); width:16px; height:16px; flex:none; }
.im-check input:checked + span { text-decoration:line-through; text-decoration-color:var(--humo); color:var(--humo); }
.im-check-hint { font-size:12.5px; color:var(--humo); margin:0 0 10px; font-style:italic; }
.im-errorlist li.im-err-reveal { cursor:pointer; }
.im-errorlist li.im-err-reveal .im-error-desc { display:none; }
.im-errorlist li.im-err-reveal.open .im-error-desc { display:block; animation:imFadeIn .2s ease; }
.im-errorlist li.im-err-reveal .im-err-cta { display:inline-block; font-size:11.5px; font-weight:bold; color:var(--azul); margin-top:4px; }
.im-errorlist li.im-err-reveal.open .im-err-cta { display:none; }
.im-pager { display:flex; justify-content:space-between; gap:12px; margin:30px 0 6px; flex-wrap:wrap; }
.im-pager button { background:#fff; border:1.5px solid var(--azul); color:var(--azul); border-radius:22px; padding:9px 16px; font-size:13px; font-weight:bold; cursor:pointer; font-family:Arial,Helvetica,sans-serif; max-width:48%; }
.im-pager button:hover { background:var(--azul); color:#fff; }
.im-pager .im-next { margin-left:auto; }
.im-hero { position:relative; background:linear-gradient(135deg, var(--azul) 0%, var(--azul-d) 100%); border-radius:16px; padding:34px 26px 30px; margin-bottom:22px; overflow:hidden; }
.im-hero::before { content:""; position:absolute; top:-46px; right:-46px; width:190px; height:190px; border-radius:50%; background:rgba(244,197,66,.12); }
.im-hero::after { content:""; position:absolute; bottom:-60px; left:30%; width:160px; height:160px; border-radius:50%; background:rgba(255,255,255,.05); }
.im-hero-dl { position:absolute; top:16px; right:16px; background:var(--amar); color:var(--azul-d); border:none; border-radius:20px; padding:9px 16px; font-size:12px; font-weight:bold; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:6px; font-family:Arial,Helvetica,sans-serif; z-index:1; }
.im-hero-dl:hover { filter:brightness(1.08); }
.im-hero-kicker { color:var(--amar); font-size:12.5px; font-weight:bold; letter-spacing:.4px; margin:0 0 8px; position:relative; z-index:1; }
.im-hero-title { color:#fff; font-size:clamp(21px,3.2vw,30px); line-height:1.28; margin:0; max-width:620px; position:relative; z-index:1; }
@media (max-width:600px) {
  /* Absolute top-right placement overlaps the kicker/title on narrow
     screens (confirmed on a real phone-width viewport) -> drop it back into
     normal flow above them instead, full-width so it's easy to tap. */
  .im-hero-tools { position:static; margin:0 0 14px; justify-content:stretch; }
  .im-hero-tools > * { flex:1; text-align:center; justify-content:center; }
  .im-hero-dl { position:static; display:flex; justify-content:center; width:100%; margin:0 0 16px; box-sizing:border-box; }
}
.im-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
.im-card { text-align:left; background:var(--claro); border:none; border-radius:12px; padding:20px 20px 18px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; box-shadow:0 2px 10px rgba(159,177,186,.28); transition:transform .12s ease, background .12s ease; opacity:0; transform:translateY(10px); animation:imCardIn .35s ease forwards; }
.im-card:hover { background:#E9ECEE; transform:translateY(-2px); }
.im-card.im-card-bib { background:var(--azul); }
.im-card.im-card-bib .im-card-title, .im-card.im-card-bib .im-card-meta { color:#fff; }
.im-card-icon { font-size:24px; }
.im-card-title { display:block; font-size:16px; font-weight:bold; color:var(--azul); line-height:1.3; margin-top:10px; }
.im-card-meta { display:block; font-size:12px; color:var(--humo); margin-top:6px; }
@keyframes imCardIn { to { opacity:1; transform:translateY(0); } }
.im-rail { display:flex; gap:6px; overflow-x:auto; overflow-y:hidden; padding:12px 2px 16px; margin-bottom:18px; border-bottom:1px solid #E3E7E9; scrollbar-width:thin; scrollbar-color:var(--humo) transparent; }
.im-rail::-webkit-scrollbar { height:6px; }
.im-rail::-webkit-scrollbar-thumb { background:var(--humo); border-radius:3px; }
.im-rail::-webkit-scrollbar-track { background:transparent; }
.im-rail-btn { flex:none; display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; cursor:pointer; padding:6px 9px; border-radius:10px; font-family:Arial,Helvetica,sans-serif; opacity:.5; transition:opacity .15s ease, background .15s ease; }
.im-rail-btn:hover { opacity:.85; }
.im-rail-btn.active { opacity:1; background:var(--claro); }
.im-rail-icon { font-size:16px; line-height:1.4; }
.im-rail-label { font-size:9.5px; font-weight:bold; color:var(--gris); max-width:62px; text-align:center; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.im-rail-btn.active .im-rail-label { color:var(--azul); }
.im-chapter { animation:imFadeIn .25s ease; }
@keyframes imFadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
.im-crumb { background:none; border:none; color:var(--humo); font-size:13px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; padding:0; margin-bottom:16px; text-decoration:underline; }
.im-crumb:hover { color:var(--azul); }
.im-chapter-title { color:var(--azul); font-size:23px; margin:0 0 16px; }
.im-block-p { font-size:14.5px; line-height:1.7; color:var(--gris); margin:0 0 14px; }
.im-block-h4 { font-size:15px; font-weight:bold; color:var(--azul); margin:20px 0 8px; }
.im-sub-body .im-block-h4:first-child { margin-top:0; }
.im-block-ul, .im-block-ol { margin:0 0 14px; padding-left:22px; }
.im-block-ul li, .im-block-ol li { font-size:14.5px; line-height:1.65; color:var(--gris); margin-bottom:6px; }
.im-sub { border-top:1px solid #E3E7E9; }
.im-sub:first-child { border-top:none; }
.im-sub-head { width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; background:none; border:none; text-align:left; padding:16px 4px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.im-sub-head:hover .im-sub-title { color:var(--azul-d); }
.im-sub-title { font-size:15.5px; font-weight:bold; color:var(--azul); }
.im-sub-arrow { color:var(--humo); font-size:13px; transition:transform .15s ease; flex:none; }
.im-sub.open .im-sub-arrow { transform:rotate(90deg); }
.im-sub-body { max-height:0; overflow:hidden; padding:0 4px; transition:max-height .3s ease; }
.im-sub.open .im-sub-body { max-height:none; padding-bottom:14px; }
.im-code-toggle { display:inline-flex; align-items:center; gap:6px; background:#fff; border:1.5px dashed var(--humo); color:var(--azul); font-size:12.5px; font-weight:bold; border-radius:20px; padding:7px 14px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; margin:2px 0 14px; }
.im-code-toggle:hover { border-color:var(--azul); }
.im-code-box { display:none; background:#F2F4F5; border-radius:8px; padding:14px 16px; margin:0 0 14px; overflow-x:auto; animation:imFadeIn .2s ease; }
.im-code-box.open { display:block; }
.im-code-box pre { margin:0; font-family:"Courier New",monospace; font-size:13px; line-height:1.55; color:#1c2a30; white-space:pre-wrap; word-break:break-word; }
.im-table-toggle { display:inline-flex; align-items:center; gap:6px; background:#fff; border:1.5px solid var(--azul); color:var(--azul); font-size:12.5px; font-weight:bold; border-radius:20px; padding:7px 14px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; margin:2px 0 14px; }
.im-table-toggle:hover { background:var(--azul); color:#fff; }
.im-table-bare { overflow-x:auto; margin:0 0 16px; border-radius:8px; box-shadow:0 2px 10px rgba(159,177,186,.28); scrollbar-width:thin; scrollbar-color:var(--humo) transparent; }
.im-table-bare::-webkit-scrollbar, .im-code-box::-webkit-scrollbar, .im-modal table::-webkit-scrollbar { height:6px; }
.im-table-bare::-webkit-scrollbar-thumb, .im-code-box::-webkit-scrollbar-thumb { background:var(--humo); border-radius:3px; }
.im-table-bare::-webkit-scrollbar-track, .im-code-box::-webkit-scrollbar-track { background:transparent; }
.im-table-bare table, .im-modal table { border-collapse:collapse; width:100%; font-size:13px; }
.im-table-bare th, .im-modal th { background:var(--azul); color:#fff; text-align:left; padding:9px 12px; font-size:12.5px; }
.im-table-bare td, .im-modal td { padding:9px 12px; border-bottom:1px solid #E3E7E9; color:var(--gris); }
.im-table-bare tr:nth-child(even) td, .im-modal tr:nth-child(even) td { background:var(--claro); }
.im-modal-overlay { position:fixed; inset:0; background:rgba(10,20,26,.55); display:flex; align-items:center; justify-content:center; padding:5vh 4vw; z-index:500; animation:imFadeIn .15s ease; }
.im-modal { background:#fff; border-radius:14px; max-width:760px; width:100%; max-height:90vh; min-width:0; display:flex; flex-direction:column; box-shadow:0 12px 40px rgba(0,0,0,.3); }
.im-modal.im-modal-wide { max-width:min(1500px, 96vw); }
.im-modal-body img { display:block; max-width:100%; max-height:72vh; width:auto; height:auto; margin:0 auto; border-radius:8px; object-fit:contain; }
.im-modal-head { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid #E3E7E9; flex:none; }
.im-modal-head h4 { margin:0; color:var(--azul); font-size:15.5px; }
.im-modal-close { background:var(--claro); border:none; width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:14px; color:var(--gris); flex:none; }
.im-modal-close:hover { background:#E3E7E9; }
.im-modal-body { flex:1; min-height:0; min-width:0; overflow:auto; padding:16px 20px 20px; text-align:center; }
.im-modal-body table { min-width:max-content; }
.im-figure { margin:6px 0 20px; }
.im-figure-img { display:block; width:auto; max-width:100%; height:auto; max-height:82vh; margin:0 auto; border-radius:10px; box-shadow:0 4px 16px rgba(159,177,186,.35); cursor:zoom-in; }
.im-figure-caption { font-size:12px; color:var(--humo); text-align:center; margin-top:8px; font-style:italic; }
@media (min-width:860px) {
  .im-figure { width:min(1300px, 92vw); margin-left:calc(50% - min(650px, 46vw)); margin-right:calc(50% - min(650px, 46vw)); }
}
.im-img-btn { display:flex; align-items:center; gap:14px; width:100%; max-width:420px; background:var(--claro); border:none; border-radius:14px; padding:10px; margin:4px 0 20px; cursor:pointer; text-align:left; font-family:Arial,Helvetica,sans-serif; box-shadow:0 2px 10px rgba(159,177,186,.28); transition:transform .12s ease, background .12s ease; }
.im-img-btn:hover { background:#E9ECEE; transform:translateY(-2px); }
.im-img-btn-thumb { flex:none; width:64px; height:64px; border-radius:10px; background-size:cover; background-position:center; position:relative; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
.im-img-btn-thumb::after { content:"🔍"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:18px; background:rgba(11,44,66,.35); border-radius:10px; }
.im-img-btn-text { display:flex; flex-direction:column; gap:2px; }
.im-img-btn-label { font-size:13.5px; font-weight:bold; color:var(--azul); }
.im-img-btn-sub { font-size:11.5px; color:var(--humo); }
.im-reveal-toggle { display:inline-flex; align-items:center; gap:6px; background:#fff; border:1.5px dashed var(--humo); color:var(--azul); font-size:12.5px; font-weight:bold; border-radius:20px; padding:7px 14px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; margin:2px 0 14px; }
.im-reveal-toggle:hover { border-color:var(--azul); }
.im-reveal-box { display:none; margin:0 0 16px; }
.im-reveal-box.open { display:block; animation:imFadeIn .25s ease; }
.im-reveal-box img { display:block; width:100%; border-radius:10px; box-shadow:0 4px 16px rgba(159,177,186,.35); }
.im-errorlist { list-style:none; padding:0; margin:0 0 6px; }
.im-errorlist li { background:var(--claro); border-left:3px solid var(--rojo); border-radius:0 8px 8px 0; padding:12px 16px; margin-bottom:10px; }
.im-errorlist .im-error-term { display:block; font-weight:bold; color:var(--azul); font-size:14px; margin-bottom:4px; }
.im-errorlist .im-error-desc { font-size:13.5px; color:var(--gris); line-height:1.6; }
.im-cite { color:var(--azul); font-weight:bold; cursor:pointer; border-bottom:1.5px dotted var(--azul); white-space:normal; }
.im-cite:hover { color:var(--azul-d); }
.im-cite-pop { display:none; background:var(--azul-d); color:#fff; border-radius:8px; padding:12px 16px; font-size:12.5px; line-height:1.6; margin:6px 0 14px; }
.im-cite-pop.open { display:block; }
.im-cite-pop p { margin:0 0 8px; }
.im-cite-pop p:last-child { margin-bottom:0; }
.im-cite-pop a { color:var(--amar); }
.im-bib-list { margin-top:6px; }
.im-bib-item.im-bib-highlight { background:#FDF1C7; border-radius:8px; padding:10px 14px; margin-left:-14px; margin-right:-14px; }
code.im-inline { background:#F2F4F5; padding:1px 6px; border-radius:4px; font-family:"Courier New",monospace; font-size:.93em; }
/* teacher panel */
.teacher-banner { background:var(--azul-d); color:#fff; border-radius:12px; padding:18px 22px; margin-bottom:24px; }
.teacher-banner strong { color: var(--amar); }
.teacher-banner p { font-size:13px; margin:6px 0 0; color:var(--humo); }
.teacher-token-row { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
.teacher-token-row input { flex:1; min-width:220px; padding:9px 12px; border-radius:8px; border:none; font-size:13px; font-family:Arial,Helvetica,sans-serif; }
.teacher-token-row button { background:var(--amar); color:var(--azul-d); border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:bold; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.teacher-status { font-size:12px; margin-top:10px; min-height:16px; }
.teacher-toggle-list { list-style:none; padding:0; margin:16px 0 0; display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; }
.teacher-toggle-list li { background:rgba(255,255,255,.08); border-radius:8px; padding:10px 14px; display:flex; align-items:center; gap:10px; font-size:13px; }
.teacher-toggle-list input { width:18px; height:18px; }
.hub-btn .teacher-hint { position:absolute; top:10px; right:12px; font-size:10px; font-weight:bold; padding:2px 8px; border-radius:10px; }
.hub-btn .teacher-hint.on { background:#DFF3E0; color:var(--verde); }
.hub-btn .teacher-hint.off { background:#FBEAEC; color:var(--rojo); }
footer { text-align:center; padding:26px clamp(20px,6vw,48px) 40px; font-size:11px; color:var(--humo); font-style:italic; }
</style>
</head>

  var QUIZ_MANUAL = [{"question":"¿Cuál es la función principal de un pipeline lingüístico en el preprocesamiento de textos?","answerOptions":[{"text":"Ejecutar una secuencia ordenada de transformaciones para convertir texto bruto en datos estructurados.","isCorrect":true,"rationale":"Un pipeline se define como una cadena de pasos donde cada operación prepara la salida para el siguiente proceso, permitiendo una transformación coherente y reproducible."},{"text":"Eliminar automáticamente toda la información gramatical para simplificar el entrenamiento de modelos.","isCorrect":false,"rationale":"El objetivo no es destruir información gramatical, sino modelarla; de hecho, pasos como el PoS tagging añaden esta información."},{"text":"Traducir el texto de un dominio especializado a un lenguaje de dominio general.","isCorrect":false,"rationale":"El pipeline prepara el texto para tareas posteriores, como la traducción, pero su función central no es la traducción en sí misma."},{"text":"Garantizar que el sistema de PLN no necesite modelos estadísticos para funcionar.","isCorrect":false,"rationale":"El preprocesamiento suele ser el paso previo al uso de modelos estadísticos o neuronales, no un sustituto de estos."}],"hint":"Imagina una cadena de montaje donde cada estación realiza una tarea específica sobre el producto."},{"question":"En el contexto de un corpus farmacéutico, ¿qué riesgo conlleva aplicar la normalización con `.lower()` de forma indiscriminada?","answerOptions":[{"text":"La pérdida de distinción entre palabras comunes y siglas técnicas como AINE.","isCorrect":true,"rationale":"En textos médicos, las mayúsculas suelen diferenciar siglas, nombres comerciales o códigos institucionales que podrían confundirse con palabras comunes al pasar a minúsculas."},{"text":"Un aumento innecesario en la dispersión morfológica de los términos analizados en el corpus.","isCorrect":false,"rationale":"Al contrario, pasar a minúsculas suele reducir la dispersión al unificar variantes de la misma palabra."},{"text":"La imposibilidad de aplicar expresiones regulares en pasos posteriores.","isCorrect":false,"rationale":"Las expresiones regulares funcionan perfectamente con minúsculas; simplemente hay que ajustar el patrón de búsqueda."},{"text":"La eliminación de los saltos de línea y espacios en blanco del documento.","isCorrect":false,"rationale":"El método `.lower()` solo afecta a los caracteres alfabéticos, no a la estructura de espacios o puntuación."}],"hint":"Piensa en términos como 'AINE' (antiinflamatorios) frente a 'aine' como una posible cadena de texto sin sentido."},{"question":"Si utilizas el patrón de expresión regular `r'[^\\w\\s]'` en `re.sub()` para limpiar un texto médico, ¿cuál es el efecto principal?","answerOptions":[{"text":"Se eliminan todos los caracteres que no sean letras, números o espacios en blanco.","isCorrect":true,"rationale":"El símbolo `^` dentro de los corchetes niega la clase, afectando a todo lo que no sea un carácter de palabra (`\\w`) o espacio (`\\s`)."},{"text":"Se conservan únicamente los signos de puntuación y se eliminan las palabras.","isCorrect":false,"rationale":"Este sería el efecto si el patrón no incluyera la negación `^` dentro de la clase de caracteres."},{"text":"Se eliminan exclusivamente los números para evitar ruido en los datos clínicos.","isCorrect":false,"rationale":"El metacaracter `\\w` incluye números, por lo que este patrón los conservaría en lugar de eliminarlos."},{"text":"Se sustituyen los espacios en blanco por guiones bajos para facilitar la tokenización.","isCorrect":false,"rationale":"El patrón busca signos de puntuación y símbolos para eliminarlos, no realiza transformaciones sobre los espacios en blanco."}],"hint":"Analiza el significado del símbolo de intercalación `^` cuando aparece al principio de un conjunto entre corchetes."},{"question":"¿Por qué se afirma que la tokenización en spaCy es más compleja que simplemente dividir por espacios en blanco?","answerOptions":[{"text":"Porque reconoce unidades como abreviaturas, signos de puntuación, contracciones y números.","isCorrect":true,"rationale":"Un tokenizador lingüístico reconoce que una unidad como '10mg/kg' o una abreviatura no debe segmentarse igual que una frase simple separada por espacios."},{"text":"Porque requiere que el texto haya sido lematizado previamente para reconocer los límites de palabra.","isCorrect":false,"rationale":"La lematización es un paso posterior que depende de una tokenización ya realizada, no al revés."},{"text":"Porque convierte automáticamente cada palabra a su forma canónica de diccionario.","isCorrect":false,"rationale":"Esa es la definición de lematización, no de tokenización."},{"text":"Porque solo funciona si el texto se ha limpiado de signos de puntuación mediante expresiones regulares.","isCorrect":false,"rationale":"spaCy puede tokenizar texto con puntuación; de hecho, suele ser preferible para mantener la estructura oracional."}],"hint":"Considera cómo debería tratarse un punto al final de una frase o una unidad de medida como 'mg/kg'."},{"question":"En el preprocesamiento de un prospecto farmacéutico, ¿cuál es el principal argumento para NO eliminar la palabra 'no' de la lista de stopwords?","answerOptions":[{"text":"Su eliminación alteraría la polaridad de las advertencias y contraindicaciones médicas.","isCorrect":true,"rationale":"En medicina, la negación tiene un peso semántico decisivo; eliminar 'no' podría transformar una prohibición en una recomendación."},{"text":"Es una palabra de baja frecuencia que no afecta apenas al rendimiento general del sistema.","isCorrect":false,"rationale":"Al contrario, 'no' es una palabra de muy alta frecuencia, pero su importancia reside en su valor semántico, no en su frecuencia."},{"text":"spaCy no permite filtrar palabras de menos de tres letras en sus modelos estándar.","isCorrect":false,"rationale":"Las bibliotecas de PLN permiten filtrar cualquier palabra independientemente de su longitud; es una decisión del lingüista."},{"text":"La lematización de la palabra 'no' produce resultados inconsistentes en español.","isCorrect":false,"rationale":"La palabra 'no' es un adverbio invariable y su lematización es directa; el problema es su pérdida de significado contextual."}],"hint":"Piensa en la diferencia de seguridad clínica entre 'Se recomienda su uso' y 'No se recomienda su uso'."},{"question":"¿Cuál es la diferencia fundamental entre la lematización y la tokenización de un texto?","answerOptions":[{"text":"La tokenización identifica las unidades del texto, mientras que la lematización busca su forma base.","isCorrect":true,"rationale":"Son procesos complementarios: primero se divide el texto en unidades (tokens) y luego se asigna a cada una su forma canónica (lema)."},{"text":"La tokenización es exclusiva de NLTK y la lematización es exclusiva de spaCy.","isCorrect":false,"rationale":"Ambas bibliotecas pueden realizar ambas tareas, aunque spaCy las integra de forma más automática en su pipeline."},{"text":"La lematización elimina las stopwords y la tokenización limpia la puntuación.","isCorrect":false,"rationale":"Estas son tareas de filtrado y limpieza, diferentes de la segmentación en unidades o la reducción a formas base."},{"text":"La tokenización solo se aplica a sustantivos y la lematización a verbos.","isCorrect":false,"rationale":"Ambas operaciones se aplican a todas las categorías gramaticales relevantes del texto."}],"hint":"Una responde a '¿qué unidades hay?' y la otra a '¿cuál es la forma de diccionario de esta unidad?'."},{"question":"¿Qué utilidad ofrece el atributo `token.pos_` en el análisis de un corpus médico?","answerOptions":[{"text":"Permite identificar categorías gramaticales para extraer núcleos terminológicos como los sustantivos.","isCorrect":true,"rationale":"El etiquetado PoS (Part-of-Speech) facilita la extracción de términos técnicos, que frecuentemente son sustantivos o adjetivos."},{"text":"Indica la posición exacta del carácter inicial del token dentro del documento original.","isCorrect":false,"rationale":"Aunque spaCy registra la posición (offset), el atributo `.pos_` se refiere específicamente a la categoría gramatical (Part-of-Speech)."},{"text":"Calcula automáticamente la frecuencia de aparición del token en el conjunto del corpus.","isCorrect":false,"rationale":"La frecuencia se calcula con herramientas externas como `Counter`, no es un atributo intrínseco del objeto token en su análisis morfosintáctico."},{"text":"Determina si un token debe ser considerado como una stopword según el modelo cargado en la biblioteca spaCy en ese momento.","isCorrect":false,"rationale":"Esa función suele corresponder al atributo `.is_stop`, mientras que `.pos_` se ocupa de la gramática."}],"hint":"Las siglas PoS significan 'Part-of-Speech' (categoría gramatical)."},{"question":"En la organización de resultados con Pandas, ¿qué representa típicamente una fila en un DataFrame diseñado siguiendo el principio de 'tidy data' para PLN?","answerOptions":[{"text":"Una observación individual, como un token único con sus respectivos atributos.","isCorrect":true,"rationale":"En una tabla de anotación lingüística, cada fila suele corresponder a una unidad (token, lema o frase) y las columnas a sus propiedades (categoría, frecuencia, etc.)."},{"text":"El corpus completo transformado en una única cadena de texto normalizada.","isCorrect":false,"rationale":"Un DataFrame es una estructura tabular; una única cadena no aprovecharía las capacidades de organización por filas y columnas."},{"text":"Una lista de todas las stopwords que han sido filtradas durante el proceso.","isCorrect":false,"rationale":"Aunque se podría crear una tabla de stopwords, el uso principal es organizar los datos procesados que queremos analizar o exportar."},{"text":"Un comando de Python necesario para poder ejecutar correctamente el pipeline de spaCy.","isCorrect":false,"rationale":"Pandas es una herramienta de organización de datos, no un lenguaje de ejecución de comandos para otras bibliotecas."}],"hint":"Piensa en cómo se estructuraría una tabla de Excel donde cada fila es una palabra analizada."},{"question":"¿Por qué es recomendable conservar versiones intermedias del texto (ej. `texto_original`, `texto_sin_puntuacion`, `doc`) en un entorno profesional?","answerOptions":[{"text":"Para garantizar la trazabilidad y permitir que distintas tareas utilicen la versión más adecuada del texto.","isCorrect":true,"rationale":"Tareas como la segmentación de oraciones requieren puntuación, mientras que el conteo de frecuencias puede preferir un texto limpio; mantener versiones evita errores irreversibles."},{"text":"Para evitar que Python agote la memoria RAM al procesar archivos de gran tamaño.","isCorrect":false,"rationale":"Crear múltiples variables en realidad consume más memoria, pero se hace por rigor metodológico, no por eficiencia de hardware."},{"text":"Porque spaCy requiere obligatoriamente comparar el texto bruto con el procesado para validar el análisis.","isCorrect":false,"rationale":"spaCy no requiere esta comparación por defecto, es una buena práctica del lingüista para el control de calidad."},{"text":"Para asegurar que el modelo de traducción automática aprenda las reglas de las expresiones regulares.","isCorrect":false,"rationale":"Los modelos de traducción no aprenden código de Python (Regex), sino patrones lingüísticos a partir de los datos proporcionados."}],"hint":"Recuerda que algunas tareas necesitan los puntos y comas, mientras que otras los consideran ruido."},{"question":"¿Cuál es la principal diferencia metodológica entre NLTK y spaCy a la hora de trabajar con un pipeline de preprocesamiento?","answerOptions":[{"text":"NLTK es más transparente y pedagógico para tareas aisladas, mientras que spaCy es eficiente e integrado para pipelines industriales.","isCorrect":true,"rationale":"NLTK permite gestionar recursos como listas de stopwords de forma manual y directa, mientras que spaCy ofrece un flujo de trabajo optimizado y multilingüe."},{"text":"NLTK solo funciona para el idioma inglés y spaCy es exclusivo para el español, sin soporte para otras lenguas.","isCorrect":false,"rationale":"Ambas herramientas son multilingües, aunque spaCy destaca por sus modelos preentrenados específicos para diversos idiomas."},{"text":"NLTK es una biblioteca de visualización de datos y spaCy es un motor de base de datos.","isCorrect":false,"rationale":"Ambas son bibliotecas de procesamiento de lenguaje natural, no se dedican principalmente a la visualización o al almacenamiento de bases de datos."},{"text":"NLTK realiza el análisis morfosintáctico sin necesidad de cargar modelos de lengua.","isCorrect":false,"rationale":"Ambas bibliotecas requieren recursos lingüísticos o modelos para realizar análisis avanzados como el PoS tagging."}],"hint":"Considera cuál de las dos bibliotecas te permite ver y modificar más fácilmente una lista de palabras vacías."}];
  var QUIZ_CUADERNO = [{"question":"¿Cuál es el objetivo principal de la fase de normalización durante el preprocesamiento de textos en PLN?","answerOptions":[{"text":"Transformar el texto en bruto en representaciones limpias y homogéneas, como el uso de minúsculas.","isCorrect":true,"rationale":"La normalización busca eliminar inconsistencias como diferencias de mayúsculas/minúsculas para estandarizar el corpus."},{"text":"Dividir el texto en unidades mínimas llamadas tokens antes de cualquier otro análisis posterior.","isCorrect":false,"rationale":"Esta es la definición de tokenización, que ocurre después o paralelamente a la normalización."},{"text":"Asignar funciones sintácticas a cada palabra dentro de una oración.","isCorrect":false,"rationale":"La asignación de funciones sintácticas pertenece al análisis morfosintáctico avanzado, no a la normalización básica."},{"text":"Identificar y extraer únicamente los sustantivos técnicos del documento.","isCorrect":false,"rationale":"La extracción de terminología es una tarea posterior que se beneficia del preprocesamiento, pero no define la normalización."}],"hint":"Piensa en el proceso de uniformar el texto para que palabras como 'Medicamento' y 'medicamento' sean tratadas igual."},{"question":"En el contexto de un pipeline con spaCy, ¿qué representa el etiquetado PoS (Part-of-Speech)?","answerOptions":[{"text":"La asignación de la categoría gramatical a cada palabra, como sustantivo o verbo.","isCorrect":true,"rationale":"PoS tagging identifica la función gramatical de cada token basándose en su contexto."},{"text":"La eliminación de palabras que no aportan carga semántica.","isCorrect":false,"rationale":"Ese proceso se conoce específicamente como eliminación de stopwords."},{"text":"La reducción de una palabra a su forma canónica o lema.","isCorrect":false,"rationale":"Este proceso se denomina lematización."},{"text":"La corrección automática de errores ortográficos en el corpus.","isCorrect":false,"rationale":"El etiquetado PoS analiza la estructura gramatical existente, no corrige la ortografía del texto original."}],"hint":"Se refiere a la clasificación de las palabras según su función (nombre, adjetivo, etc.)."},{"question":"¿Qué atributo de spaCy se debe utilizar para acceder a la forma base (lema) de una palabra en lugar de su texto original?","answerOptions":[{"text":"token.lemma_","isCorrect":true,"rationale":"El guion bajo al final indica que se desea la representación en cadena del lema de la palabra."},{"text":"token.text","isCorrect":false,"rationale":"Este atributo devuelve la cadena de caracteres exacta tal como aparece en el texto original."},{"text":"token.pos_","isCorrect":false,"rationale":"Este atributo devuelve la etiqueta de la categoría gramatical en formato de cadena."},{"text":"token.dep_","isCorrect":false,"rationale":"Este atributo se utiliza para identificar las relaciones de dependencia sintáctica, no la forma base."}],"hint":"Busca el término técnico que se refiere a la forma canónica de una palabra."},{"question":"En la limpieza de textos mediante expresiones regulares, ¿qué función cumple el patrón `r'[^\\w\\s]'`?","answerOptions":[{"text":"Identifica cualquier carácter que no sea alfanumérico ni un espacio en blanco para eliminarlo.","isCorrect":true,"rationale":"El símbolo `^` dentro de los corchetes actúa como negación de caracteres alfanuméricos (`\\w`) y espacios (`\\s`)."},{"text":"Busca y mantiene únicamente los números del texto, eliminando letras y signos de puntuación.","isCorrect":false,"rationale":"Para mantener solo números se usaría un patrón diferente como `r'\\d+'`."},{"text":"Convierte automáticamente todos los caracteres a minúsculas.","isCorrect":false,"rationale":"La conversión a minúsculas se realiza con métodos de cadena como `.lower()`."},{"text":"Separa el texto en oraciones individuales basándose en los puntos.","isCorrect":false,"rationale":"La segmentación de oraciones es una tarea de tokenización de frases, no de limpieza de caracteres especiales."}],"hint":"Analiza el significado del símbolo de intercalación dentro de los corchetes de la expresión regular."},{"question":"¿Por qué es tan importante personalizar la lista de 'stopwords' al preprocesar textos de un ámbito técnico como el médico?","answerOptions":[{"text":"Porque palabras comunes como 'no' o 'sin' pueden alterar drásticamente el sentido de una instrucción médica.","isCorrect":true,"rationale":"En medicina, la negación es vital para las contraindicaciones; su eliminación podría causar traducciones peligrosas."},{"text":"Porque las listas estándar de NLTK son demasiado largas y ralentizan el sistema.","isCorrect":false,"rationale":"La velocidad del sistema es una preocupación secundaria frente a la integridad del significado lingüístico."},{"text":"Porque los términos técnicos siempre deben considerarse palabras vacías para simplificar el motor de IA.","isCorrect":false,"rationale":"Los términos técnicos son los que más carga informativa tienen y nunca deben ser tratados como palabras vacías."},{"text":"Porque spaCy no permite utilizar listas de stopwords externas a su propio modelo.","isCorrect":false,"rationale":"spaCy y NLTK permiten la personalización total de sus listas de palabras vacías."}],"hint":"Considera cómo cambiaría el significado de 'sin efectos secundarios' si eliminamos la palabra funcional."},{"question":"¿Qué ventaja ofrece la lematización sobre la tokenización simple en el entrenamiento de modelos de traducción automática?","answerOptions":[{"text":"Reduce el vocabulario al agrupar diferentes formas flexivas de una misma palabra.","isCorrect":true,"rationale":"Al tratar 'pacientes' y 'paciente' como una sola entidad (paciente), el modelo generaliza mejor el aprendizaje."},{"text":"Permite que el sistema conserve todos los signos de puntuación originales.","isCorrect":false,"rationale":"La lematización se ocupa de la morfología de las palabras, no de la puntuación del texto."},{"text":"Aumenta el número de palabras únicas en el corpus para darle más complejidad al modelo.","isCorrect":false,"rationale":"Al contrario, la lematización reduce la diversidad superficial de palabras para centrarse en los conceptos base."},{"text":"Es el único paso necesario para limpiar un corpus ruidoso sin necesidad de normalización.","isCorrect":false,"rationale":"La lematización es un paso avanzado que requiere que el texto haya sido previamente tokenizado y, preferiblemente, normalizado."}],"hint":"Piensa en cómo se buscan las palabras en un diccionario, independientemente de si están en plural o singular."},{"question":"Al construir un glosario técnico, ¿por qué se prioriza la extracción de palabras con la etiqueta PoS 'NOUN'?","answerOptions":[{"text":"Porque los sustantivos suelen representar los conceptos y entidades clave (terminología) del dominio especializado.","isCorrect":true,"rationale":"En textos científicos, los sustantivos cargan con la mayor parte del significado terminológico específico."},{"text":"Porque son las palabras más fáciles de traducir por los motores de IA.","isCorrect":false,"rationale":"La facilidad de traducción no es el criterio; lo es la relevancia conceptual del término."},{"text":"Porque spaCy no puede extraer verbos o adjetivos de manera fiable en textos médicos especializados.","isCorrect":false,"rationale":"spaCy es capaz de extraer cualquier categoría gramatical con alta precisión."},{"text":"Porque los sustantivos nunca actúan como 'ruido' en un pipeline de PLN.","isCorrect":false,"rationale":"Aunque suelen ser valiosos, algunos sustantivos comunes pueden ser irrelevantes dependiendo del objetivo del análisis."}],"hint":"Identifica qué tipo de palabras suelen nombrar a los medicamentos, órganos o síntomas."},{"question":"¿Qué herramienta de Python se utiliza en el cuaderno para contar la frecuencia de aparición de los lemas extraídos?","answerOptions":[{"text":"Counter de la biblioteca collections","isCorrect":true,"rationale":"Counter es una subclase de diccionario diseñada específicamente para contar objetos hashables como palabras."},{"text":"re.sub","isCorrect":false,"rationale":"Esta función se utiliza para realizar sustituciones basadas en expresiones regulares, no para contar."},{"text":"spacy.load","isCorrect":false,"rationale":"Esta función se utiliza para cargar modelos lingüísticos preentrenados."},{"text":"nltk.download","isCorrect":false,"rationale":"Esta función se usa para descargar recursos adicionales como corpus o listas de palabras."}],"hint":"Es un contenedor que almacena elementos como claves de diccionario y sus conteos como valores."},{"question":"Al preparar un corpus especializado para entrenar o alimentar un motor de traducción automática neuronal (NMT), ¿qué consecuencia tendría un preprocesamiento deficiente, con ambigüedades y ruido sin eliminar?","answerOptions":[{"text":"La traducción podría ser inexacta o peligrosa debido a ambigüedades y ruido no eliminado.","isCorrect":true,"rationale":"El ruido y las inconsistencias confunden al modelo, lo cual resulta especialmente grave en sectores sensibles como el sanitario."},{"text":"El sistema tardaría más tiempo en procesar el texto pero la calidad sería idéntica.","isCorrect":false,"rationale":"La calidad de salida depende directamente de la calidad de los datos de entrada en los modelos de IA."},{"text":"El motor NMT corregiría automáticamente todos los errores de puntuación durante el entrenamiento.","isCorrect":false,"rationale":"Los modelos NMT tienden a replicar el ruido presente en los datos de entrenamiento si no se limpian previamente."},{"text":"Se reduciría el costo de computación sin afectar la precisión terminológica.","isCorrect":false,"rationale":"Un preprocesamiento deficiente suele aumentar los errores terminológicos, invalidando el ahorro de recursos."}],"hint":"Considera el lema 'garbage in, garbage out' aplicado a la IA lingüística."},{"question":"¿Qué diferencia fundamental existe entre tokenizar y lematizar un texto?","answerOptions":[{"text":"Tokenizar divide el texto en piezas; lematizar busca la raíz o forma canónica de dichas piezas.","isCorrect":true,"rationale":"La tokenización es una segmentación estructural, mientras que la lematización es un análisis morfológico."},{"text":"Lematizar es un paso previo obligatorio para poder realizar la tokenización.","isCorrect":false,"rationale":"Es al revés: primero se debe tokenizar el texto para que el sistema pueda analizar cada palabra individualmente y lematizarla."},{"text":"Tokenizar elimina las mayúsculas; lematizar elimina los signos de puntuación.","isCorrect":false,"rationale":"Ambas tareas de limpieza mencionadas pertenecen generalmente a la fase de normalización y preprocesamiento básico."},{"text":"No existe diferencia; ambos términos se usan indistintamente para referirse a la limpieza de texto.","isCorrect":false,"rationale":"Son procesos distintos con objetivos lingüísticos diferentes dentro del pipeline de PLN."}],"hint":"Una técnica trata sobre 'cortar' el texto y la otra sobre 'entender' la base de la palabra."}];
  var IM_DATA = {"manual_interactivo":{"header":{"kicker":"Tema 3.","title":"Preprocesamiento y análisis morfosintáctico con spaCy","subtitle":"Preparar un corpus sanitario para traducción automática neuronal","meta":"Material teórico | Programación para PLN | Universidad Pontificia Comillas","narrative":"Preprocesamiento y análisis morfosintáctico de textos médico-farmacéuticos: preparar el corpus antes de analizarlo con Python"},"sections":[{"id":"contexto-profesional","title":"Contexto profesional","blocks":[{"type":"p","text":"Imagina que trabajas como lingüista computacional junior en una empresa internacional que desarrolla un sistema de traducción automática especializado en documentación médica y farmacéutica. La empresa ha recopilado miles de textos multilingües: prospectos de medicamentos, informes clínicos, artículos científicos, instrucciones de administración, fichas técnicas y materiales de farmacovigilancia."},{"type":"p","text":"El equipo de ingeniería quiere usar esos textos para mejorar un motor de traducción automática neuronal. Sin embargo, antes de entrenar o evaluar cualquier sistema, aparece un problema básico: los textos están en bruto. Tienen mayúsculas inconsistentes, signos de puntuación variables, palabras funcionales de alta frecuencia, formas flexionadas, duplicidades, terminología especializada y segmentos que no siempre están preparados para ser procesados por una máquina."},{"type":"p","text":"Tu tarea consiste en diseñar un pipeline de preprocesamiento lingüístico. Un pipeline es una secuencia ordenada de pasos que transforma un texto bruto en una representación más limpia, homogénea y útil para el análisis automático."},{"type":"p","text":"En este escenario profesional, preparar bien el corpus no es una tarea secundaria. En traducción médica y farmacéutica, una mala preparación de datos puede afectar a la terminología, a la detección de negaciones, a la calidad de los glosarios y, en última instancia, a la fiabilidad del sistema."},{"type":"p","text":"La idea central de esta unidad es que el procesamiento automático no empieza cuando aplicamos un modelo avanzado. Empieza mucho antes: cuando decidimos cómo normalizar, cómo tokenizar, qué eliminar, qué conservar, qué lematizar y cómo extraer las unidades lingüísticas relevantes."}],"subsections":[],"navTitle":"Contexto profesional"},{"id":"que-vas-a-aprender-en-esta-unidad","title":"Qué vas a aprender en esta unidad","blocks":[{"type":"p","text":"Al terminar este manual, deberías poder explicar y aplicar los siguientes conocimientos:"},{"type":"ol","items":["Qué es el preprocesamiento textual y por qué es imprescindible en PLN.","Qué significa construir un pipeline de procesamiento lingüístico.","Cómo se instala y utiliza una biblioteca lingüística como spaCy.","Para qué sirve NLTK en tareas de stopwords.","Qué es un modelo de lengua en spaCy y qué aporta es_core_news_sm.","Qué diferencia hay entre texto bruto, texto normalizado, tokens y lemas.","Qué implica convertir un texto a minúsculas con .lower().","Cómo se eliminan signos de puntuación mediante expresiones regulares.","Qué es la tokenización y por qué no equivale a \"separar por espacios\" sin más.","Qué son las stopwords y por qué eliminarlas puede ser útil.","Por qué en textos técnicos no todas las stopwords deben eliminarse automáticamente.","Qué es la lematización y por qué ayuda a agrupar variantes morfológicas.","Cómo se cuentan frecuencias con Counter.","Qué es el etiquetado morfosintáctico o PoS tagging.","Cómo se usan categorías como NOUN, VERB y ADJ.","Por qué los sustantivos suelen ser relevantes para glosarios técnicos.","Cómo se construye un glosario terminológico con contexto.","Qué decisiones lingüísticas deben documentarse en un pipeline profesional."]}],"subsections":[],"navTitle":"Qué vas a aprender"},{"id":"mapa-conceptual-de-la-unidad","title":"Mapa conceptual de la unidad","blocks":[{"type":"table","rows":[["Concepto","En Python","En PLN aplicado"],["Pipeline","Secuencia de instrucciones","Flujo ordenado de transformación textual"],["spaCy","Biblioteca de PLN","Tokenización, lematización y análisis morfosintáctico"],["NLTK","Biblioteca clásica de PLN","Listas de stopwords y recursos lingüísticos"],["Modelo es_core_news_sm","Modelo preentrenado para español","Analiza texto español con reglas y estadísticas aprendidas"],["Normalización",".lower() y otras transformaciones","Unifica variantes superficiales"],["Limpieza","re.sub()","Elimina ruido como puntuación no necesaria"],["Tokenización","nlp(texto) y token.text","Divide el texto en unidades analizables"],["Stopwords","stopwords.words('spanish')","Filtra palabras funcionales frecuentes"],["Lematización","token.lemma_","Reduce formas flexionadas a una forma base"],["Frecuencia","Counter","Cuenta términos, lemas o categorías"],["PoS","token.pos_","Etiqueta la categoría gramatical"],["Glosario técnico","Sustantivos + contexto","Extrae unidades terminológicas relevantes"]],"title":"Concepto · En Python · En PLN aplicado"}],"subsections":[],"navTitle":"Mapa conceptual"},{"id":"1-marco-teorico","title":"1. Marco teórico","blocks":[{"type":"p","text":"El marco teórico de esta unidad debe leerse como una secuencia: primero se entiende por qué el preprocesamiento es una fase decisiva del PLN; después se estudia cómo se ordena esa fase en un pipeline; a continuación se analizan las operaciones lingüísticas principales; y, finalmente, se sitúan esas decisiones en un contexto profesional médico-farmacéutico, con herramientas concretas como spaCy, NLTK {{cite:naturallanguagetoolk2026}}(Natural Language Toolkit, 2026){{/cite}} y pandas {{cite:thepandasdevelopment2026a,thepandasdevelopment2026b,thepandasdevelopment2026c}}(The pandas development team, 2026a, 2026b, 2026c){{/cite}}. El hilo conductor es que preparar un corpus no es una tarea secundaria, sino una forma de modelar lingüísticamente qué información verá después la máquina."}],"subsections":[{"id":"1-1-el-preprocesamiento-como-etapa-fundacional-del-pln","title":"1.1. El preprocesamiento como etapa fundacional del PLN","blocks":[{"type":"p","text":"El preprocesamiento textual es el conjunto de operaciones que transforma textos brutos en representaciones más regulares, comparables y explotables por un sistema computacional. Un texto real puede contener mayúsculas inconsistentes, puntuación variable, saltos de línea, abreviaturas, cifras, unidades de medida, formas flexionadas, palabras funcionales de alta frecuencia y terminología especializada. Antes de contar, clasificar, traducir o extraer información, es necesario decidir cómo se tratarán todos esos elementos."},{"type":"p","text":"En PLN, la calidad de los resultados posteriores depende en parte de la calidad de la representación inicial. Por eso preprocesar no significa «limpiar por limpiar», sino preparar el texto para una tarea concreta. Una representación adecuada para contar frecuencias no tiene por qué ser adecuada para segmentar oraciones, extraer terminología o alimentar un sistema de traducción automática neuronal. La misma operación puede ser útil en una tarea y perjudicial en otra."},{"type":"p","text":"Esta idea es especialmente importante para alumnado de lingüística. El preprocesamiento no es solo una operación técnica: es una decisión lingüística. Cada vez que se normaliza una forma, se elimina una palabra o se reduce una variante a su lema, se está decidiendo qué rasgos del texto se consideran relevantes y cuáles se consideran prescindibles."}]},{"id":"1-2-que-es-un-pipeline-linguistico","title":"1.2. Qué es un pipeline lingüístico","blocks":[{"type":"p","text":"Un pipeline lingüístico es una cadena ordenada de pasos en la que cada operación recibe una entrada, la transforma y produce una salida que será utilizada por el paso siguiente. En una unidad sobre preprocesamiento y análisis morfosintáctico, un pipeline básico puede incluir carga del texto, normalización, limpieza de puntuación, tokenización, filtrado de stopwords, lematización, recuento de frecuencias, etiquetado gramatical, extracción de sustantivos y construcción de un glosario preliminar."},{"type":"p","text":"El orden del pipeline importa. Si se elimina toda la puntuación antes de segmentar oraciones, pueden perderse marcas que ayudan a detectar límites oracionales. Si se eliminan stopwords antes de revisar negaciones, puede desaparecer información semántica crítica. Si se lematiza sin conservar el texto original, puede ser difícil volver al contexto real de uso."},{"type":"p","text":"Por eso una buena práctica consiste en conservar versiones intermedias del texto. En lugar de sobrescribir siempre la misma variable, conviene crear variables distintas para cada fase: texto original, texto normalizado, texto sin puntuación, documento procesado con spaCy y documento con puntuación conservada para segmentar oraciones. Esta trazabilidad permite comprobar errores, justificar decisiones y reproducir el análisis."},{"type":"table","rows":[["Fase","Pregunta lingüística","Riesgo si se aplica sin criterio"],["Normalización","¿Qué variantes formales quiero unificar?","Borrar siglas, nombres propios o marcas funcionales"],["Limpieza","¿Qué signos dificultan la tarea y cuáles informan?","Eliminar unidades, dosis, límites oracionales o contexto"],["Stopwords","¿Qué palabras frecuentes son realmente prescindibles?","Eliminar negación, temporalidad o restricción"],["Lematización","¿Qué variantes deben agruparse bajo una forma base?","Perder información morfológica útil"],["Extracción gramatical","¿Qué categorías interesan para la tarea?","Confundir núcleos terminológicos con palabras aisladas"]],"title":"Fase · Pregunta lingüística · Riesgo si se aplica sin criterio"},{"type":"image","src":"img/fig_pipeline.svg","alt":"El pipeline de preprocesamiento de la unidad, de la normalización al glosario técnico","caption":"Figura elaborada a partir del mapa conceptual de la unidad."}]},{"id":"1-3-preprocesar-es-modelar-reducir-ruido-sin-destruir-inform","title":"1.3. Preprocesar es modelar: reducir ruido sin destruir información","blocks":[{"type":"p","text":"Una de las ideas centrales de la unidad es que preprocesar equivale a modelar. No existe una limpieza universalmente correcta. Lo que suele llamarse «ruido» depende de la tarea, del dominio y de la pregunta de análisis. En recuperación de información puede interesar eliminar muchas palabras frecuentes; en textos médicos, en cambio, algunas palabras frecuentes pueden indicar contraindicación, temporalidad o restricción."},{"type":"p","text":"En un corpus médico-farmacéutico, elementos aparentemente pequeños pueden ser decisivos. La palabra «no» cambia el sentido de «se recomienda su uso» frente a «no se recomienda su uso». La forma «sin» puede introducir una condición clínica. Una cifra seguida de una unidad, como «10 mg/kg», no es un detalle tipográfico, sino información especializada. Por tanto, el pipeline ideal no es el más agresivo, sino el más adecuado al objetivo."},{"type":"p","text":"La literatura sobre adaptación de dominio en traducción neuronal y sobre procesamiento biomédico insiste en que los datos especializados requieren decisiones de representación propias. Un sistema que funciona aceptablemente en textos generales puede degradarse cuando se enfrenta a terminología médica, abreviaturas, negación clínica o unidades de medida. La preparación del corpus forma parte de esa adaptación de dominio, no solo de una limpieza previa {{cite:chu2018,neumann2019}}(Chu y Wang, 2018; Neumann et al., 2019){{/cite}}."}]},{"id":"1-4-normalizacion-textual-y-limpieza-de-puntuacion","title":"1.4. Normalización textual y limpieza de puntuación","blocks":[{"type":"p","text":"La normalización textual agrupa operaciones destinadas a reducir variación superficial: pasar a minúsculas, unificar caracteres, tratar puntuación, resolver espacios o estandarizar formas equivalentes. En el cuaderno se trabaja de forma inicial con lower, que convierte el texto a minúsculas y permite contar de forma conjunta variantes como «Paciente» y «paciente»."},{"type":"p","text":"Esta operación puede ser útil para análisis de frecuencias, pero tiene límites. En textos especializados, las mayúsculas pueden distinguir siglas como AINE, nombres comerciales, códigos, instituciones o entidades clínicas. Convertir todo a minúsculas puede ser razonable para un glosario exploratorio, pero no necesariamente para una versión final del corpus."},{"type":"p","text":"La limpieza de puntuación mediante expresiones regulares plantea una tensión parecida. Eliminar signos puede facilitar ciertos recuentos, pero también puede destruir información sintáctica o semántica. Los puntos ayudan a segmentar oraciones; las comas pueden delimitar incisos; los guiones pueden formar parte de términos compuestos; los símbolos y porcentajes pueden ser relevantes en textos médicos. La pregunta profesional no es «¿puedo eliminar esto?», sino «¿qué pierdo si lo elimino?»."}]},{"id":"1-5-tokenizacion-segmentar-no-es-solo-dividir-palabras","title":"1.5. Tokenización: segmentar no es solo dividir palabras","blocks":[{"type":"p","text":"La tokenización es el proceso por el que un flujo de caracteres se convierte en unidades manipulables por el sistema. Suele explicarse como dividir un texto en palabras, pero esa explicación se queda corta. Un token puede ser una palabra, un número, un signo de puntuación, una abreviatura, una unidad especial o una subunidad, según el tokenizador y la tarea."},{"type":"p","text":"En spaCy, al procesar un texto con `nlp(texto)`, se obtiene un objeto `Doc` que contiene objetos Token. Cada token conserva atributos como la forma textual, el lema, la categoría gramatical y, en su caso, información adicional. Esta estructura permite que los pasos posteriores del pipeline no trabajen solo con cadenas, sino con unidades lingüísticamente anotadas."},{"type":"p","text":"En traducción automática neuronal, la tokenización ha sido especialmente importante por el uso de subpalabras. Métodos como BPE o SentencePiece ayudan a tratar palabras raras y morfología productiva, pero también muestran que tokenizar no es una operación trivial. La forma en que se segmenta el texto condiciona qué regularidades puede aprender el sistema {{cite:kudo2018,schmidt2024,sennrich2016}}(Kudo y Richardson, 2018; Schmidt et al., 2024; Sennrich et al., 2016){{/cite}}."}]},{"id":"1-6-stopwords-una-categoria-util-pero-dependiente-de-la-tare","title":"1.6. Stopwords: una categoría útil, pero dependiente de la tarea","blocks":[{"type":"p","text":"Las stopwords o palabras vacías son unidades de alta frecuencia que, en algunas tareas, aportan poca información temática o discriminativa. En español suelen incluir artículos, preposiciones, conjunciones, pronombres y formas funcionales. Su eliminación ha sido clásica en recuperación de información, clasificación textual, análisis de frecuencias y representación vectorial basada en conteos {{cite:manning2008}}(Manning et al., 2008){{/cite}}."},{"type":"p","text":"Sin embargo, no existe una lista de stopwords universal. La utilidad de eliminar una palabra depende del género textual, del dominio, de la lengua y de la tarea. En textos médicos, palabras como «no», «sin», «antes», «después», «durante», «excepto» o «contra» pueden codificar negación, temporalidad, condición o contraindicación. Eliminarlas de manera automática puede alterar el significado del texto."},{"type":"p","text":"Por eso, en corpus especializados conviene entender la lista de stopwords como un punto de partida revisable. El criterio profesional puede exigir conservar negaciones, ajustar la lista general o construir una lista personalizada. En esta unidad, el caso de la negación funciona como advertencia metodológica: una palabra muy frecuente no siempre es irrelevante."}]},{"id":"1-7-spacy-y-nltk-dos-herramientas-complementarias","title":"1.7. spaCy y NLTK: dos herramientas complementarias","blocks":[{"type":"p","text":"spaCy y NLTK permiten trabajar con PLN en Python, pero responden a orientaciones distintas. NLTK es una biblioteca clásica, muy valiosa en docencia y en trabajo introductorio con corpus, porque permite ver de forma explícita recursos y operaciones: cargar una lista de stopwords, inspeccionarla, convertirla en conjunto y filtrarla. Su ventaja pedagógica es la transparencia del proceso {{cite:bird2009,loper2002}}(Bird et al., 2009; Loper y Bird, 2002){{/cite}}."},{"type":"p","text":"spaCy, en cambio, está orientada a pipelines lingüísticos eficientes e integrados. Un modelo de spaCy para español no funciona solo como diccionario: permite tokenizar, lematizar, etiquetar morfosintácticamente, segmentar oraciones y consultar atributos lingüísticos de cada token. En spaCy, las stopwords pueden consultarse como parte de los datos del modelo o mediante el atributo `token.is_stop`."},{"type":"p","text":"Las listas de stopwords de NLTK y spaCy no tienen por qué coincidir. Cada biblioteca mantiene recursos propios y criterios de inclusión distintos. Por eso, dos procedimientos que parecen equivalentes pueden producir salidas diferentes: conservarán o eliminarán conjuntos de tokens no idénticos. Esta diferencia no debe interpretarse como que una herramienta sea siempre mejor que la otra, sino como una decisión metodológica que debe documentarse."},{"type":"p","text":"Para una práctica inicial, NLTK ayuda a comprender el filtrado de forma explícita. Para un pipeline completo, spaCy resulta más natural porque integra el filtrado con tokenización, lematización, PoS tagging y segmentación. En proyectos profesionales, lo más riguroso es elegir la herramienta según la tarea, revisar sus efectos y justificar la decisión."},{"type":"p","text":"Para saber más, se recomienda leer el artículo complementario «Diferencias entre las stopwords de spaCy y NLTK en el preprocesamiento textual»."}]},{"id":"1-8-lematizacion-reducir-variacion-flexiva-sin-anular-la-gra","title":"1.8. Lematización: reducir variación flexiva sin anular la gramática","blocks":[{"type":"p","text":"La lematización asocia una forma flexionada con su forma canónica o lema. En español, esta operación permite agrupar formas como «paciente» y «pacientes», o relacionar ciertas formas verbales con su infinitivo. Para análisis de frecuencias y glosarios preliminares, lematizar puede reducir dispersión morfológica y facilitar la lectura de patrones."},{"type":"p","text":"Lematizar no equivale a tokenizar. Tokenizar responde a la pregunta «¿cuáles son las unidades del texto?». Lematizar responde a otra: «¿cuál es la forma de referencia de cada unidad?». Ambas operaciones son complementarias y ocupan lugares distintos en el pipeline. Primero se necesitan unidades; después puede decidirse si conviene reducirlas a lemas."},{"type":"p","text":"También conviene evitar una interpretación excesivamente automática. En dominios especializados, los modelos pueden producir lemas dudosos, sobre todo con abreviaturas, tecnicismos, formas raras o usos fuera de dominio. La lematización moderna se beneficia del contexto, pero sus resultados deben revisarse cuando el objetivo sea construir glosarios o preparar recursos terminológicos {{cite:toporkov2024}}(Toporkov y Agerri, 2024){{/cite}}."}]},{"id":"1-9-analisis-morfosintactico-de-las-categorias-gramaticales-","title":"1.9. Análisis morfosintáctico: de las categorías gramaticales a la terminología","blocks":[{"type":"p","text":"El análisis morfosintáctico añade a cada token información gramatical. Una de sus tareas principales es el etiquetado PoS, que asigna categorías como sustantivo, verbo, adjetivo, adverbio, determinante o preposición. Esta capa permite pasar de una simple lista de palabras a una representación más estructurada del texto."},{"type":"p","text":"En textos médicos y farmacéuticos, los sustantivos son especialmente relevantes porque muchos candidatos terminológicos son nombres o grupos nominales: «ibuprofeno», «tratamiento», «efectos adversos», «úlcera gástrica», «principio activo», «insuficiencia hepática» o «sistema nacional de farmacovigilancia». Extraer sustantivos individuales puede ser un primer paso, pero no basta para capturar toda la terminología."},{"type":"p","text":"De sustantivos a terminología hay un salto metodológico. La terminología especializada suele estar formada por unidades multipalabra, con patrones como sustantivo + adjetivo, sustantivo + preposición + sustantivo o grupos nominales más extensos. Por eso, la categoría gramatical no debe verse solo como etiqueta descriptiva: puede convertirse en una regla de búsqueda para localizar candidatos terminológicos."},{"type":"p","text":"El marco de Universal Dependencies y los tagsets universales ayudan a entender que estas etiquetas no son arbitrarias: responden a tradiciones de anotación lingüística formalizadas y comparables entre lenguas {{cite:demarneffe2021,petrov2012}}(de Marneffe et al., 2021; Petrov et al., 2012){{/cite}}."}]},{"id":"1-10-pandas-para-linguistas-organizar-revisar-y-exportar-res","title":"1.10. Pandas para lingüistas: organizar, revisar y exportar resultados","blocks":[{"type":"p","text":"spaCy y NLTK producen o facilitan análisis lingüísticos, pero muchas veces los resultados necesitan organizarse en una estructura consultable. Ahí aparece pandas. Pandas no analiza lingüísticamente el texto; su función es convertir resultados en datos tabulares: filas y columnas que pueden inspeccionarse, filtrarse, ordenarse, calcularse y exportarse."},{"type":"p","text":"La estructura central de pandas es el DataFrame. Para un perfil lingüístico, puede entenderse como una tabla de anotación: cada fila representa una unidad —un token, una oración, un documento, un lema o un candidato terminológico— y cada columna almacena una variable —forma textual, lema, categoría gramatical, frecuencia, documento de origen o contexto—. Esta forma de organización conecta con el principio de tidy data: cada variable en una columna, cada observación en una fila y cada tipo de unidad en una tabla {{cite:wickham2014}}(Wickham, 2014){{/cite}}."},{"type":"p","text":"En PLN aplicado, pandas aporta claridad y reproducibilidad. Permite revisar si los lemas son correctos, filtrar solo sustantivos, calcular frecuencias por categoría gramatical, ordenar resultados y exportar a CSV. El CSV es un archivo de texto plano que representa datos tabulares y puede abrirse en Excel, LibreOffice, Google Sheets, R o Python. Exportar resultados permite compartirlos, revisarlos fuera del cuaderno y conservar evidencias del análisis."},{"type":"p","text":"La distinción metodológica es importante: spaCy analiza; NLTK proporciona recursos; pandas organiza y exporta. En una práctica profesional, esta separación ayuda a documentar qué parte del código realiza análisis lingüístico y qué parte convierte ese análisis en un producto revisable."},{"type":"table","rows":[["Estructura","Qué representa","Utilidad en PLN"],["Lista","Elementos en orden","Guardar tokens o lemas de forma simple"],["Diccionario","Pares clave-valor","Describir una unidad con atributos"],["Lista de diccionarios","Muchas unidades anotadas","Preparar datos para una tabla"],["DataFrame","Tabla con filas y columnas","Revisar, filtrar, contar y exportar resultados"],["CSV","Archivo tabular en texto plano","Conservar y compartir los resultados"]],"title":"Estructura · Qué representa · Utilidad en PLN"},{"type":"p","text":"Para saber más, se recomienda leer el artículo complementario «Pandas para lingüistas»."}]},{"id":"1-11-el-caso-de-los-prospectos-farmaceuticos","title":"1.11. El caso de los prospectos farmacéuticos","blocks":[{"type":"p","text":"Los prospectos farmacéuticos son un buen escenario para esta unidad porque combinan instrucciones, advertencias, contraindicaciones, dosis, unidades, condiciones temporales, síntomas y terminología médica. Además, son textos en los que pequeños cambios pueden alterar el significado: una negación, una cifra, una unidad o una preposición pueden tener impacto interpretativo."},{"type":"p","text":"Un pipeline mal diseñado podría eliminar información crítica. Si elimina «no», cambia la polaridad de una recomendación. Si elimina puntuación indiscriminadamente, puede dificultar la segmentación de instrucciones y advertencias. Si no lematiza, puede dispersar formas relacionadas. Si extrae palabras sin contexto, puede producir un glosario pobre o ambiguo."},{"type":"p","text":"Por eso, en este dominio el preprocesamiento debe responder al texto y a la finalidad. No se trata de aplicar una receta general, sino de decidir qué transformaciones ayudan a preparar el corpus sin comprometer información clínica, terminológica o traductológica relevante. Recursos como PharmaCoNER o NUBes muestran que el español biomédico requiere atención específica a entidades farmacológicas, negación e incertidumbre {{cite:gonzalezagirre2019,limalopez2020}}(González-Agirre et al., 2019; Lima López et al., 2020){{/cite}}."}]},{"id":"1-12-preprocesamiento-y-traduccion-automatica-neuronal","title":"1.12. Preprocesamiento y traducción automática neuronal","blocks":[{"type":"p","text":"La traducción automática neuronal aprende patrones a partir de grandes cantidades de datos. Aunque los modelos actuales son más potentes que los enfoques clásicos, siguen siendo sensibles al dominio, a la cobertura terminológica y a la forma en que el texto se representa. Un corpus especializado mal preparado puede introducir ruido, dispersar términos o hacer que el sistema aprenda equivalencias poco fiables."},{"type":"p","text":"Un buen preprocesamiento puede ayudar a reducir variación superficial innecesaria, detectar términos frecuentes, preparar glosarios, localizar segmentos problemáticos y documentar decisiones. Pero también puede perjudicar si elimina demasiada información. Para traducción médica, por ejemplo, no siempre conviene alimentar un sistema final con texto excesivamente simplificado: puede ser útil preprocesar para analizar y depurar, pero conservar información rica para traducir."},{"type":"p","text":"La relación entre preprocesamiento y traducción automática debe entenderse así: el pipeline no sustituye al modelo, pero condiciona los datos que el modelo aprenderá o que el equipo humano revisará. En ámbitos de alto riesgo, la terminología no es un detalle estilístico, sino una condición de seguridad y adecuación {{cite:chu2018,semenov2025}}(Chu y Wang, 2018; Semenov et al., 2025){{/cite}}."}]},{"id":"1-13-buenas-practicas-y-limitaciones-del-pipeline","title":"1.13. Buenas prácticas y limitaciones del pipeline","blocks":[{"type":"p","text":"Un pipeline profesional debe ser reproducible, justificable y revisable. Esto implica conservar siempre una copia del texto original, crear variables para cada versión procesada, revisar muestras de salida, documentar la lista de stopwords utilizada, comprobar cómo se tratan siglas, cifras y unidades, y no eliminar negaciones sin una razón explícita."},{"type":"p","text":"También conviene reconocer las limitaciones de las herramientas. spaCy puede equivocarse al tokenizar, lematizar o etiquetar textos especializados. NLTK ofrece recursos útiles, pero sus listas generales no están diseñadas específicamente para corpus biomédicos. pandas organiza resultados, pero no decide si una etiqueta o un lema son lingüísticamente correctos."},{"type":"p","text":"Estas limitaciones no invalidan el uso de las herramientas; simplemente las sitúan en su lugar. El objetivo de la unidad no es confiar ciegamente en spaCy, NLTK o pandas, sino aprender a utilizarlos con criterio lingüístico: observar resultados, detectar errores, adaptar decisiones y justificar el pipeline."}]},{"id":"1-14-conclusiones-del-marco-teorico","title":"1.14. Conclusiones del marco teórico","blocks":[{"type":"p","text":"Antes de modelar el lenguaje, hay que decidir cómo representarlo. El preprocesamiento convierte un texto complejo en una estructura computable, pero esa conversión nunca es neutra. Normalizar, tokenizar, eliminar stopwords, lematizar, etiquetar categorías gramaticales, extraer sustantivos o exportar resultados son decisiones técnicas con consecuencias lingüísticas."},{"type":"p","text":"La secuencia conceptual de la unidad puede resumirse así: el texto bruto se convierte en versiones procesadas; esas versiones permiten obtener tokens, lemas, categorías y frecuencias; esos resultados pueden organizarse en tablas; y todo el proceso debe documentarse para que sea revisable. En corpus médico-farmacéuticos, esta cadena exige especial cuidado porque la terminología, la negación, la puntuación y las unidades pueden ser semánticamente críticas."},{"type":"p","text":"Por tanto, el objetivo formativo no es solo aprender a ejecutar código con spaCy, NLTK o pandas. El objetivo es aprender a diseñar, justificar y evaluar un pipeline lingüístico: una forma ordenada de transformar textos en datos sin perder de vista que esos datos siguen siendo lenguaje."}]}],"navTitle":"Marco teórico"},{"id":"2-preprocesamiento-y-analisis-morfosintactico-con-python","title":"2. Preprocesamiento y análisis morfosintáctico con Python","blocks":[],"subsections":[{"id":"2-1-instalacion-y-recursos-linguisticos","title":"2.1. Instalación y recursos lingüísticos","blocks":[{"type":"p","text":"Para trabajar con estas herramientas, es necesario instalar bibliotecas y descargar recursos. En un entorno como Google Colab puede hacerse con comandos de instalación:"},{"type":"code","code":"!pip install --quiet spacy nltk\n!python -m nltk.downloader stopwords\n!python -m spacy download es_core_news_sm"},{"type":"p","text":"Estos comandos cumplen tres funciones:"},{"type":"ul","items":["Instalan las bibliotecas spacy y nltk.","Descargan la lista de stopwords de NLTK.","Descargan el modelo pequeño de español de spaCy."]},{"type":"p","text":"Después, en Python se importan las bibliotecas necesarias:"},{"type":"code","code":"import spacy\nimport nltk\nfrom nltk.corpus import stopwords\nimport re\nfrom collections import Counter"},{"type":"p","text":"Cada importación responde a una necesidad:"},{"type":"table","rows":[["Importación","Para qué sirve"],["spacy","Procesar texto con modelos lingüísticos"],["nltk","Descargar y gestionar recursos"],["stopwords","Acceder a listas de palabras vacías"],["re","Usar expresiones regulares"],["Counter","Contar frecuencias de elementos"]],"title":"Cada importación responde a una necesidad"},{"type":"p","text":"El siguiente paso es cargar el modelo:"},{"type":"code","code":"nlp = spacy.load(\"es_core_news_sm\")"},{"type":"p","text":"nlp funciona como una herramienta de análisis. Cuando se aplica a un texto, devuelve un objeto Doc con información lingüística."}]},{"id":"2-2-cargar-un-texto-especializado","title":"2.2. Cargar un texto especializado","blocks":[{"type":"p","text":"Un corpus puede empezar como un fragmento de texto guardado en una variable:"},{"type":"code","code":"texto = \"\"\"\nLa administración de ibuprofeno debe realizarse con precaución en pacientes con antecedentes de úlcera gástrica.\nLos AINE pueden provocar efectos adversos, especialmente en pacientes de edad avanzada.\nSe recomienda consultar con un profesional de la salud antes de iniciar cualquier tratamiento.\n\"\"\""},{"type":"p","text":"Este texto pertenece al ámbito médico-farmacéutico. Contiene términos técnicos como:"},{"type":"ul","items":["administración","ibuprofeno","pacientes","antecedentes","úlcera gástrica","AINE","efectos adversos","tratamiento"]},{"type":"p","text":"Desde el punto de vista lingüístico, estos términos no deben perderse. Son precisamente las unidades que pueden formar parte de un glosario técnico o de un sistema de traducción especializada."},{"type":"p","text":"La carga del texto es el punto de partida. Todo lo que hagamos después transformará esta materia prima."}]},{"id":"2-3-normalizacion-convertir-a-minusculas","title":"2.3. Normalización: convertir a minúsculas","blocks":[{"type":"p","text":"La normalización busca reducir va
