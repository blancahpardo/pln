  var QUIZ_MANUAL = [{"question":"Cuando una lingüista escribe código para analizar un texto, tiene que traducir preguntas intuitivas -¿es este texto claro?, ¿es denso?- en operaciones concretas y medibles: contar palabras, estimar oraciones, buscar patrones. ¿Cuál de las siguientes opciones describe mejor el valor de esa traducción?","answerOptions":[{"text":"Permitir formular preguntas lingüísticas como una serie de operaciones controlables.","isCorrect":true,"rationale":"Python no sustituye el juicio lingüístico: obliga a precisarlo, convirtiendo categorías interpretativas en operaciones observables."},{"text":"Sustituir la interpretación humana por una verdad algorítmica absoluta.","isCorrect":false,"rationale":"Python no sustituye el juicio lingüístico, pero tampoco entrega una verdad algorítmica: obliga a precisarlo, no a reemplazarlo."},{"text":"Automatizar la lectura de textos para que no sea necesario el análisis experto.","isCorrect":false,"rationale":"La automatización es una herramienta, pero la interpretación crítica sigue siendo necesaria para evaluar el propósito comunicativo."},{"text":"Eliminar la necesidad de representar el texto como datos de tipo cadena de caracteres.","isCorrect":false,"rationale":"Representar el texto como 'str' es precisamente el punto de entrada necesario para cualquier manipulación computacional."}],"hint":"Relaciona la programación con el proceso de precisar las decisiones que un lingüista toma intuitivamente."},{"question":"Al realizar una tokenización básica con el método `.split()`, ¿cuál es una limitación lingüística importante de este método?","answerOptions":[{"text":"Conserva los signos de puntuación pegados a las palabras.","isCorrect":true,"rationale":"Al separar solo por espacios en blanco, signos como puntos o comas se mantienen como parte del token de la palabra precedente."},{"text":"Elimina automáticamente todas las mayúsculas del texto original.","isCorrect":false,"rationale":"El método `.split()` no modifica el contenido de los caracteres, solo divide la cadena basándose en espacios."},{"text":"No es capaz de procesar textos que contengan más de un párrafo.","isCorrect":false,"rationale":"Python puede procesar cadenas extensas con múltiples líneas si se usan delimitadores adecuados como las comillas triples."},{"text":"Divide las palabras basándose en su estructura morfológica interna.","isCorrect":false,"rationale":"Este método es puramente mecánico y no posee conocimiento sobre la morfología o gramática de la lengua."}],"hint":"Piensa en qué sucede con una palabra seguida inmediatamente por un punto y coma si solo nos fijamos en los espacios vacíos."},{"question":"En el contexto de Google Colab, ¿qué permite construir una 'narrativa computacional'?","answerOptions":[{"text":"La combinación de celdas de código ejecutable con celdas de texto explicativo.","isCorrect":true,"rationale":"Esta estructura permite justificar decisiones lingüísticas justo al lado del procedimiento técnico que las ejecuta."},{"text":"La ejecución de código de forma invisible para el usuario final.","isCorrect":false,"rationale":"Una narrativa computacional busca la transparencia, no la ocultación de los procesos."},{"text":"La capacidad de ejecutar celdas en cualquier orden sin afectar al resultado.","isCorrect":false,"rationale":"El orden de ejecución es fundamental en un notebook; alterar el orden visual puede generar resultados incoherentes si dependen de variables previas."},{"text":"La traducción automática de código Python a un lenguaje natural fácilmente comprensible.","isCorrect":false,"rationale":"Aunque el código sea legible, el notebook no traduce el código, sino que requiere que el humano documente el proceso."}],"hint":"Se refiere a la integración de la documentación y la ejecución técnica en un solo documento."},{"question":"Para contar oraciones en el prototipo, se utiliza `texto1.replace(\";\", \".\").split(\".\")`. ¿Qué implica esta operación desde el punto de vista del PLN?","answerOptions":[{"text":"Es una decisión lingüística que trata el punto y coma como frontera oracional.","isCorrect":true,"rationale":"Representa la elección de considerar ciertos signos como delimitadores de segmentos relevantes para el conteo de oraciones."},{"text":"Es una corrección automática de errores gramaticales cometidos por el autor original.","isCorrect":false,"rationale":"La operación no busca corregir gramática, sino preparar el texto para una medición específica de segmentación."},{"text":"Es una trampa técnica para aumentar artificialmente la longitud del texto.","isCorrect":false,"rationale":"No altera la longitud real, sino que subdivide las unidades para reflejar mejor la complejidad discursiva."},{"text":"Es un proceso de normalización para eliminar caracteres no deseados.","isCorrect":false,"rationale":"El objetivo no es limpiar el texto, sino identificar dónde terminan las unidades de sentido según un criterio propio."}],"hint":"Considera por qué un lingüista querría que un segmento tras un punto y coma cuente como una unidad independiente."},{"question":"Al estimar el número de sílabas con la expresión regular `r'[aeiouáéíóúü]+'`, ¿qué fenómeno del español podría causar una imprecisión?","answerOptions":[{"text":"La existencia de diptongos o triptongos.","isCorrect":true,"rationale":"El símbolo `+` agrupa vocales consecutivas como una sola coincidencia, lo cual no siempre refleja la división silábica real en hiatos."},{"text":"La presencia de mayúsculas al inicio de la oración.","isCorrect":false,"rationale":"El uso de `re.IGNORECASE` permite que el patrón detecte vocales sin importar si son mayúsculas o minúsculas."},{"text":"El uso de palabras monosílabas en el texto.","isCorrect":false,"rationale":"Las palabras monosílabas tienen un grupo vocálico que el patrón detectará y contará correctamente como una unidad."},{"text":"La inclusión de consonantes nasales en la cadena.","isCorrect":false,"rationale":"El patrón está diseñado específicamente para buscar vocales; las consonantes son ignoradas por la expresión regular definida."}],"hint":"Recuerda que el patrón busca uno o más caracteres vocálicos seguidos y cómo se comportan las vocales juntas en español."},{"question":"En la fórmula del índice de legibilidad didáctico, indice = (num_silabas / num_palabras) + (num_palabras / num_oraciones), ¿qué representa el segundo término?","answerOptions":[{"text":"Una aproximación a la complejidad sintáctica del texto.","isCorrect":true,"rationale":"Este término mide la longitud media de las oraciones; oraciones más largas suelen indicar una mayor carga sintáctica para el lector."},{"text":"Una aproximación a la dificultad léxica del vocabulario.","isCorrect":false,"rationale":"La dificultad léxica suele relacionarse con la longitud de las palabras (sílabas por palabra), no con la extensión de las oraciones."},{"text":"La densidad de signos de puntuación por cada párrafo.","isCorrect":false,"rationale":"La fórmula utiliza el conteo de palabras y oraciones, no el de signos de puntuación individuales."},{"text":"El promedio de caracteres por cada palabra del texto.","isCorrect":false,"rationale":"El primer término usa sílabas y el segundo usa palabras por oración, ninguno se enfoca directamente en el conteo de caracteres individuales."}],"hint":"Analiza qué relación existe entre la cantidad de palabras que contiene una sola oración y el esfuerzo de la memoria de trabajo."},{"question":"¿Por qué es importante filtrar fragmentos con `if s.strip()` después de dividir por puntos?","answerOptions":[{"text":"Para evitar contar cadenas vacías o espacios en blanco como si fueran oraciones.","isCorrect":true,"rationale":"Si un texto termina en punto, el método `.split()` genera un elemento vacío al final que no debe sumarse al conteo total de oraciones."},{"text":"Para asegurar que las palabras no contengan ningún signo de puntuación en formato ASCII.","isCorrect":false,"rationale":"El filtrado con `.strip()` actúa sobre los segmentos resultantes del split, no sobre la limpieza interna de cada palabra."},{"text":"Para convertir automáticamente todos los fragmentos a letras minúsculas.","isCorrect":false,"rationale":"`.strip()` solo elimina espacios en los extremos; para minúsculas se requeriría el método `.lower()`."},{"text":"Para detectar automáticamente errores ortográficos evidentes en todo el texto.","isCorrect":false,"rationale":"Esta es una operación de limpieza de estructura de datos, no una búsqueda de contenido léxico o terminológico."}],"hint":"Piensa en qué queda en una lista cuando separas una cadena por un carácter que está justo al final de la misma."},{"question":"Un análisis de PLN se considera reproducible cuando otra persona puede ejecutar el mismo procedimiento y entender cómo se obtuvo cada resultado. ¿Cuál de las siguientes prácticas contribuye directamente a esa reproducibilidad?","answerOptions":[{"text":"Garantizar que otra persona pueda ejecutar el procedimiento y entender cómo se obtuvo cada número.","isCorrect":true,"rationale":"La reproducibilidad permite que los resultados sean verificables y que las decisiones lingüísticas sean transparentes para otros investigadores."},{"text":"Utilizar nombres de variables genéricos como `x`, `y` o `z` para mayor brevedad.","isCorrect":false,"rationale":"Se recomiendan nombres descriptivos como `texto_original` para mantener la trazabilidad del análisis."},{"text":"Evitar el uso de la función `print()` para no saturar la salida del notebook.","isCorrect":false,"rationale":"`print()` es esencial para comunicar resultados intermedios y etiquetar salidas de forma comprensible."},{"text":"Confiar en que el orden visual de las celdas es siempre el orden en que se definieron las variables.","isCorrect":false,"rationale":"En notebooks, el estado de las variables depende del historial real de ejecución, lo cual exige cuidado al documentar el flujo de trabajo."}],"hint":"Se trata de permitir que el análisis sea repetible y comprensible para terceros."},{"question":"¿Cuál es la función del segundo argumento en la instrucción `round(indice, 2)`?","answerOptions":[{"text":"Indicar cuántas cifras decimales se desean conservar en la salida.","isCorrect":true,"rationale":"Redondear a dos decimales mejora la legibilidad de los informes técnicos y evita mostrar precisiones irrelevantes."},{"text":"Multiplicar el resultado por dos para obtener directamente un porcentaje final.","isCorrect":false,"rationale":"La función `round()` no realiza operaciones aritméticas de multiplicación, sino de precisión numérica."},{"text":"Dividir el índice entre dos para calcular una media ponderada.","isCorrect":false,"rationale":"El propósito es puramente estético y de claridad comunicativa en la presentación de datos numéricos."},{"text":"Sumar dos unidades al índice final para normalizar el resultado.","isCorrect":false,"rationale":"El segundo argumento define la posición de redondeo tras la coma decimal, no altera el valor base mediante sumas."}],"hint":"Relaciona este argumento con la presentación clara de resultados estadísticos a un cliente."},{"question":"En el procesamiento del lenguaje natural, decidir qué cuenta como palabra, como oración o como signo de puntuación no es un detalle técnico menor: condiciona directamente el resultado del análisis. ¿Cuál de las siguientes opciones describe mejor la relación entre el lenguaje y la programación que se deriva de esta idea?","answerOptions":[{"text":"Cada resultado computacional nace de una decisión lingüística previa convertida en una regla precisa y aplicable.","isCorrect":true,"rationale":"Programar en PLN implica traducir el conocimiento sobre la lengua (qué es una palabra, qué es una oración) en instrucciones operativas."},{"text":"La programación es un fin en sí mismo para automatizar tareas administrativas sin relación con la interpretación del lenguaje.","isCorrect":false,"rationale":"En PLN, la programación es una herramienta para observar fenómenos lingüísticos, no solo un fin administrativo."},{"text":"El conocimiento lingüístico es irrelevante si el código de Python funciona sin errores.","isCorrect":false,"rationale":"Un código puede funcionar técnicamente pero devolver resultados lingüísticamente absurdos si la lógica subyacente es incorrecta."},{"text":"Python posee una comprensión innata de la lengua española que el programador debe descubrir.","isCorrect":false,"rationale":"Python solo procesa símbolos; es el lingüista quien le otorga significado lingüístico a través de las reglas y bibliotecas que utiliza."}],"hint":"Reflexiona sobre quién tiene la responsabilidad de definir los criterios de análisis."}];
  var QUIZ_CUADERNO = [{"question":"¿Cuál es la principal razón por la que Python se ha convertido en el lenguaje predominante para el procesamiento del lenguaje natural?","answerOptions":[{"text":"Su simplicidad sintáctica y su ecosistema de librerías especializadas.","isCorrect":true,"rationale":"Estas características han consolidado a Python como el estándar en este campo."},{"text":"Su capacidad para ejecutarse sin necesidad de una conexión a internet.","isCorrect":false,"rationale":"Aunque Python puede ejecutarse localmente, en este curso se trabaja en la nube mediante Google Colab, que sí requiere conexión."},{"text":"Que es el único lenguaje compatible con el análisis de signos de puntuación.","isCorrect":false,"rationale":"Muchos lenguajes pueden analizar puntuación, pero Python se prefiere por su facilidad de uso en tareas lingüísticas."},{"text":"Su diseño exclusivo para alumnos que nunca han programado.","isCorrect":false,"rationale":"Si bien el cuaderno está diseñado para principiantes, Python es un lenguaje profesional de propósito general."}],"hint":"Observa los beneficios que facilitan la lectura y escritura del código para los lingüistas."},{"question":"Al utilizar el método `.split()` sin argumentos sobre una cadena de texto, ¿qué comportamiento por defecto realiza Python?","answerOptions":[{"text":"Divide la cadena de texto donde hay espacios en blanco.","isCorrect":true,"rationale":"Por defecto, .split() utiliza cualquier espacio en blanco como delimitador para crear una lista de subcadenas."},{"text":"Divide el texto en cada punto final encontrado.","isCorrect":false,"rationale":"Para dividir por puntos, hay que indicar el argumento \".\" dentro del método; sin él, .split() separa por espacios en blanco."},{"text":"Elimina todos los caracteres que no sean letras.","isCorrect":false,"rationale":"El método split se encarga de segmentar la cadena, no de limpiar caracteres específicos."},{"text":"Cuenta el número total de caracteres incluyendo espacios.","isCorrect":false,"rationale":"Contar caracteres es una función de len(), mientras que split segmenta el contenido."}],"hint":"Piensa en el elemento más común que separa las palabras en una oración escrita."},{"question":"Para contar los signos de puntuación de un texto usando el módulo `string`, ¿cuál es la constante que contiene los caracteres a filtrar?","answerOptions":[{"text":"string.punctuation","isCorrect":true,"rationale":"Esta constante contiene todos los caracteres de puntuación estándar definidos por Python."},{"text":"string.all_symbols","isCorrect":false,"rationale":"Esta constante no existe en el módulo string estándar de Python."},{"text":"string.signs","isCorrect":false,"rationale":"Aunque el nombre parece lógico, la biblioteca estándar utiliza un término más técnico para los signos."},{"text":"string.markers","isCorrect":false,"rationale":"La biblioteca string no utiliza el término 'markers' para referirse a la puntuación."}],"hint":"Busca el término en inglés que se refiere específicamente a la puntuación."},{"question":"Antes de dividir un texto en oraciones con .split(\".\"), puede sustituirse primero cada punto y coma por un punto mediante .replace(\";\", \".\"). ¿Por qué tiene sentido lingüístico hacer esa sustitución antes de dividir el texto?","answerOptions":[{"text":"Porque desde una perspectiva lingüística, el punto y coma suele delimitar unidades con sentido completo.","isCorrect":true,"rationale":"El reemplazo permite que el divisor de oraciones reconozca más de un tipo de signo como límite de oración."},{"text":"Porque el punto y coma consume demasiada memoria en Google Colab y ralentiza la ejecución de las celdas siguientes.","isCorrect":false,"rationale":"El reemplazo de caracteres no tiene un impacto significativo en el uso de memoria para estas tareas."},{"text":"Para evitar que el código confunda los signos de puntuación con variables.","isCorrect":false,"rationale":"Los signos dentro de una cadena de texto no se confunden con variables de código."},{"text":"Para eliminar los espacios en blanco innecesarios entre oraciones.","isCorrect":false,"rationale":"La eliminación de espacios se realiza con el método .strip(), no con el reemplazo de signos."}],"hint":"Considera cómo una máquina interpreta los límites de una idea frente a cómo lo hace un humano."},{"question":"Un índice de legibilidad aproximado puede construirse combinando dos promedios: uno basado en el número de sílabas por palabra y otro en el número de palabras por oración. ¿Cuál de las siguientes expresiones representa correctamente esa combinación?","answerOptions":[{"text":"indice = (num_silabas / num_palabras) + (num_palabras / num_oraciones)","isCorrect":true,"rationale":"El índice combina el promedio de complejidad de las palabras con el promedio de extensión de las oraciones."},{"text":"indice = num_silabas / num_oraciones, redondeado a dos decimales con round()","isCorrect":false,"rationale":"Esta fórmula ignoraría la relación necesaria entre sílabas y palabras individuales."},{"text":"indice = num_palabras * num_silabas","isCorrect":false,"rationale":"La multiplicación de estos valores no ofrece una métrica de promedio útil para la legibilidad."},{"text":"indice = num_signos / num_palabras","isCorrect":false,"rationale":"Aunque los signos importan, la métrica del cuaderno se centra en sílabas, palabras y oraciones."}],"hint":"El índice suma dos promedios: uno a nivel de palabra y otro a nivel de oración."},{"question":"Al usar la expresión regular `re.findall(r'[aeiouáéíóúü]+', texto, re.IGNORECASE)`, ¿qué representa el símbolo `+`?","answerOptions":[{"text":"Que el patrón busca una coincidencia de uno o más caracteres consecutivos del grupo anterior.","isCorrect":true,"rationale":"En expresiones regulares, el símbolo + indica que el elemento precedente debe aparecer al menos una vez para ser contado."},{"text":"Que solo se deben buscar vocales en mayúsculas, ignorando cualquier vocal acentuada o con diéresis.","isCorrect":false,"rationale":"La búsqueda de mayúsculas se gestiona con la bandera re.IGNORECASE, no con el símbolo plus."},{"text":"Que se sumará el valor numérico de cada vocal encontrada.","isCorrect":false,"rationale":"Las expresiones regulares identifican patrones de texto, no realizan operaciones aritméticas por sí solas."},{"text":"Que la búsqueda debe ser obligatoriamente en orden alfabético.","isCorrect":false,"rationale":"El orden de los resultados depende de su aparición en el texto, no del alfabeto."}],"hint":"Este símbolo es un cuantificador que permite detectar grupos como 'io' o 'ue' como una sola unidad."},{"question":"¿Por qué se utiliza `if s.strip()` dentro de la lista por comprensión al contar oraciones?","answerOptions":[{"text":"Para asegurar que solo se cuenten fragmentos que contienen texto real y no solo espacios vacíos.","isCorrect":true,"rationale":"Después de un split, pueden quedar fragmentos vacíos (como el espacio tras el punto final) que no deben contarse como oraciones."},{"text":"Para traducir las oraciones a un formato procesable por la máquina.","isCorrect":false,"rationale":"El método strip no realiza traducción, sino manipulación de espacios en blanco."},{"text":"Para convertir todas las letras de la oración en minúsculas antes de mostrarla por pantalla.","isCorrect":false,"rationale":"La conversión a minúsculas se realiza con .lower(), no con .strip()."},{"text":"Para añadir automáticamente un punto al final de cada frase.","isCorrect":false,"rationale":"El condicional filtra elementos existentes, no modifica el contenido añadiendo puntuación."}],"hint":"Considera qué sucede con el espacio que queda después del último punto de un párrafo."},{"question":"¿Cuál de las siguientes es una limitación importante de las métricas de legibilidad automatizadas más básicas, las que solo cuentan sílabas, palabras y oraciones?","answerOptions":[{"text":"No distinguen matices lingüísticos como la familiaridad del vocabulario o la complejidad sintáctica real.","isCorrect":true,"rationale":"Las métricas matemáticas basadas solo en conteos ignoran si una palabra es de uso común o si la estructura es difícil de seguir."},{"text":"No pueden procesar textos de más de 50 palabras.","isCorrect":false,"rationale":"El código puede procesar textos de cualquier longitud, siempre que la memoria lo permita."},{"text":"Requieren que el usuario sepa programar en lenguajes complejos como C++.","isCorrect":false,"rationale":"El análisis se realiza de forma sencilla en Python, como muestra el cuaderno."},{"text":"Solo funcionan con textos escritos en inglés, ya que las fórmulas se calibraron con corpus anglosajones.","isCorrect":false,"rationale":"Aunque hay diferencias, el cuaderno demuestra cómo adaptar el script para el español."}],"hint":"Piensa si un número puede detectar si una palabra es 'rara' o 'común' para un lector."},{"question":"¿Cuál es la función del prefijo `r` en una cadena de Python, como en `r'[aeiou]+'`?","answerOptions":[{"text":"Indica que es una cadena 'raw' (cruda) que trata los símbolos (como las barras invertidas) literalmente.","isCorrect":true,"rationale":"Esto es fundamental en expresiones regulares para evitar que Python interprete caracteres especiales de forma errónea."},{"text":"Indica que la cadena es de solo lectura (read-only) y no puede modificarse durante la ejecución.","isCorrect":false,"rationale":"El acceso de lectura o escritura depende de otros factores, no de este prefijo de cadena."},{"text":"Se utiliza para revertir el orden del texto en la cadena.","isCorrect":false,"rationale":"Para revertir texto se utilizan técnicas de rebanado (slicing) o funciones específicas."},{"text":"Indica que el texto debe ser procesado como una respuesta (response).","isCorrect":false,"rationale":"El prefijo 'r' tiene un significado técnico específico relacionado con el tratamiento de caracteres de escape."}],"hint":"Se usa mucho en expresiones regulares para evitar problemas con la barra invertida."},{"question":"¿Qué beneficio principal ofrece un entorno como Google Colab a quienes empiezan a programar para el procesamiento del lenguaje natural?","answerOptions":[{"text":"Permite trabajar en la nube sin instalar software adicional.","isCorrect":true,"rationale":"Es una ventaja clave de Colab para facilitar el acceso a alumnos sin experiencia técnica previa."},{"text":"Garantiza que el código escrito sea automáticamente perfecto gramaticalmente.","isCorrect":false,"rationale":"Colab es un entorno de ejecución; la lógica y corrección del código dependen del programador."},{"text":"Traduce automáticamente el código de Python a lenguaje humano.","isCorrect":false,"rationale":"Colab ejecuta código; la interpretación de los resultados sigue siendo una tarea humana."},{"text":"Es el único lugar donde se pueden usar expresiones regulares.","isCorrect":false,"rationale":"Las expresiones regulares son una característica del lenguaje Python y funcionan en cualquier entorno compatible."}],"hint":"Piensa en la comodidad de no tener que configurar nada en tu propio ordenador."}];
  var IM_DATA = {"manual_interactivo":{"header":{"kicker":"Tema 1.","title":"Fundamentos de Python para PLN","subtitle":"Primer prototipo en LinguaAdapt: medir la legibilidad de un texto con Python","meta":"Material teórico | Programación para PLN | Universidad Pontificia Comillas"},"sections":[{"id":"contexto-profesional","title":"Contexto profesional","blocks":[{"type":"p","text":"Imagina que te incorporas como estudiante en prácticas a LinguaAdapt, una agencia de localización que trabaja con organismos públicos, editoriales y equipos de comunicación institucional. Su especialidad es adaptar textos para que puedan ser comprendidos por públicos diversos: personas con dificultades lectoras, estudiantes que se enfrentan a documentos especializados, ciudadanía que necesita entender información administrativa o equipos que quieren revisar la claridad de sus mensajes."}],"subsections":[{"id":"encargo-primer-prototipo-de-legibilidad","title":"Encargo: primer prototipo de legibilidad","blocks":[{"type":"p","text":"El equipo no te pide todavía que construyas un sistema avanzado de inteligencia artificial. Tu primer encargo es más concreto y, precisamente por eso, muy formativo: crear un cuaderno en Google Colab que reciba un texto y calcule algunas medidas iniciales de legibilidad."}]},{"id":"el-caso-de-trabajo","title":"El caso de trabajo","blocks":[{"type":"p","text":"La petición del cliente es sencilla de formular:"},{"type":"ul","items":["Cuántas `palabras` tiene el texto.","Cuántos `signos` de puntuación aparecen.","Cuántas `oraciones` se pueden estimar.","Cuántas sílabas contiene aproximadamente.","Qué índice numérico orientativo puede resumir su dificultad."]},{"type":"p","text":"Detrás de esa lista hay una idea central para una lingüista de segundo curso: un texto puede leerse como discurso, pero también puede representarse como datos. Python no sustituye la interpretación lingüística. La obliga a hacerse más explícita. Si queremos decir que un texto es «largo», «denso», «poco accesible» o «formal», tenemos que decidir qué rasgos observables vamos a medir."},{"type":"p","text":"Esta unidad acompaña ese primer cambio de mirada: pasar de leer un texto como lectoras expertas a preparar un pequeño procedimiento computacional que nos ayude a describirlo."}]}],"navTitle":"Contexto profesional"},{"id":"que-vas-a-aprender-en-esta-unidad","title":"Qué vas a aprender en esta unidad","blocks":[{"type":"p","text":"Al terminar esta guía, deberías poder explicar y aplicar los siguientes conocimientos:"},{"type":"ol","items":["Qué es un notebook de Google Colab y por qué resulta útil para aprender PLN.","Cómo guardar un texto en una variable de Python.","Cómo convertir una cadena de texto en una lista de `palabras` con `.split()`.","Cómo contar elementos con `len()`.","Cómo importar módulos de la biblioteca estándar, como `string` y `re`.","Cómo detectar `signos` de puntuación recorriendo carácter por carácter.","Cómo estimar `oraciones` a partir de `signos` de puntuación.","Cómo usar una expresión regular sencilla para aproximar el número de sílabas.","Cómo combinar varias medidas en un índice de legibilidad aproximado.","Cómo interpretar los resultados con criterio lingüístico, sin convertir el número en una verdad absoluta."]}],"subsections":[],"navTitle":"Qué vas a aprender"},{"id":"mapa-conceptual-de-la-unidad","title":"Mapa conceptual de la unidad","blocks":[{"type":"table","rows":[["Pieza del cuaderno","Qué aporta a Python","Qué aporta al PLN"],["Google Colab","Permite ejecutar código por celdas","Facilita explicar un análisis paso a paso"],["Variable `texto1`","Guarda un objeto de tipo `string`","Representa un texto como dato manipulable"],["`.split()`","Divide una cadena en una lista","Hace una tokenización básica por espacios"],["`len()`","Cuenta elementos de una colección","Permite medir `palabras`, `signos` u `oraciones`"],["`string.punctuation`","Ofrece una lista de `signos` comunes","Ayuda a localizar puntuación"],["Listas por comprensión","Construyen listas filtradas","Permiten extraer rasgos del texto"],["`.replace()`","Sustituye fragmentos en una cadena","Normaliza `signos` para contar `oraciones`"],["`re.findall()`","Busca patrones mediante expresiones regulares","Aproxima grupos vocálicos y sílabas"],["Índice de legibilidad","Combina operaciones numéricas","Resume de forma orientativa la complejidad"]],"title":"Datos completos del mapa conceptual"},{"type":"image","caption":"Infografía generada con NotebookLM a partir del manual teórico elaborado por la Dr.ª Blanca Hernández Pardo.","src":"img/infografia_mapa_conceptual.jpg","alt":"Infografía: flujo de trabajo del prototipo de legibilidad, de Google Colab al índice de legibilidad"}],"subsections":[],"navTitle":"Mapa conceptual"},{"id":"1-marco-teorico","title":"1. Marco teórico","blocks":[{"type":"p","text":"Esta unidad introduce el primer gesto intelectual del procesamiento del lenguaje natural: pasar de leer un texto únicamente como discurso a representarlo también como dato manipulable. Para una lingüista, este cambio no significa abandonar la interpretación, sino hacer explícitas algunas decisiones que normalmente se toman de forma intuitiva: qué cuenta como palabra, qué se considera una oración, qué rasgos permiten aproximar la dificultad de lectura y qué límites tiene cualquier medición automática."},{"type":"p","text":"El objetivo del marco teórico es preparar la lectura del resto del manual y del cuaderno de trabajo. Antes de ejecutar código, conviene entender por qué Python, los notebooks, las cadenas de texto, las listas, las funciones de conteo y las expresiones regulares forman una primera caja de herramientas para observar fenómenos lingüísticos sencillos de forma reproducible."}],"subsections":[{"id":"1-1-python-como-herramienta-para-pensar-linguisticamente-con","title":"1.1. Python como herramienta para pensar lingüísticamente con datos","blocks":[{"type":"p","text":"Python es un lenguaje de programación de propósito general, pero en PLN se utiliza porque permite escribir procedimientos legibles, combinar bibliotecas especializadas y trabajar con datos textuales de forma progresiva. Para el alumnado de lingüística, su valor inicial no está en «automatizarlo todo», sino en aprender a formular una pregunta lingüística como una serie de operaciones controlables."},{"type":"p","text":"Cuando preguntamos si un texto es largo, claro, denso o accesible, estamos usando categorías interpretativas. Python obliga a traducir parte de esas categorías a operaciones observables: contar `palabras`, estimar `oraciones`, localizar `signos` de puntuación, buscar patrones vocálicos o combinar varias medidas. Esta traducción nunca es neutra. Cada línea de código presupone una definición operativa del fenómeno que se quiere observar {{cite:biber1998,gries2009}}(Biber, Conrad y Reppen, 1998; Gries, 2009){{/cite}}."}]},{"id":"1-2-notebooks-google-colab-y-narrativas-computacionales","title":"1.2. Notebooks, Google Colab y narrativas computacionales","blocks":[{"type":"p","text":"Un notebook combina código ejecutable, texto explicativo, resultados y documentación en una misma unidad de trabajo. Esta mezcla es especialmente adecuada para el aprendizaje de PLN porque permite justificar una decisión lingüística justo al lado de la celda que la ejecuta. En lugar de separar teoría, procedimiento y resultado en documentos inconexos, el notebook convierte el análisis en una narrativa computacional reproducible {{cite:kluyver2016}}(Kluyver et al., 2016){{/cite}}."},{"type":"p","text":"Google Colab es un servicio alojado que permite trabajar con notebooks sin instalar un entorno local. Para una primera unidad de programación, esto reduce la barrera técnica: el alumnado puede centrarse en entender variables, cadenas, listas y salidas antes de preocuparse por instalaciones, rutas o versiones. La ventaja didáctica es clara, pero también hay que recordar que un notebook depende del orden real de ejecución de sus celdas, no solo del orden visual en el que aparecen."},{"type":"table","rows":[["Elemento","Función didáctica","Riesgo que conviene controlar"],["Celda de código","Ejecuta instrucciones Python paso a paso","Ejecutar celdas desordenadas y obtener resultados incoherentes"],["Celda de texto","Documenta decisiones, hipótesis y conclusiones","Escribir explicaciones que no correspondan al código ejecutado"],["Salida","Muestra resultados intermedios o finales","Confundir un número con una interpretación completa"],["Historial de ejecución","Permite repetir el análisis","Olvidar que una variable puede proceder de una celda anterior"]],"title":"Piezas de un notebook"},{"type":"image_reveal","caption":"Infografía generada con NotebookLM a partir del manual teórico elaborado por la Dr.ª Blanca Hernández Pardo.","src":"img/infografia_notebook.jpg","alt":"Infografía: anatomía del notebook — celda de código, celda de texto, salida e historial de ejecución","labelClosed":"🔎 Descubre la anatomía del notebook"}]},{"id":"1-3-el-texto-como-dato-de-la-lectura-experta-a-la-cadena-de-","title":"1.3. El texto como dato: de la lectura experta a la cadena de caracteres","blocks":[{"type":"p","text":"En lingüística, un texto puede estudiarse como discurso, como acto comunicativo, como objeto retórico o como producto social. En Python, para poder manipularlo, primero se representa como una cadena de caracteres. Esa cadena no contiene por sí sola toda la riqueza lingüística del texto: contiene una secuencia ordenada de símbolos. El análisis computacional empieza cuando decidimos qué operaciones aplicar a esa secuencia."},{"type":"p","text":"La documentación de Python define el texto como datos de tipo `str`, es decir, cadenas o secuencias textuales. Esto significa que Python puede almacenar un fragmento institucional, recorrer sus caracteres, dividirlo, buscar patrones y calcular longitudes. Para PLN, esta representación es el punto de entrada a operaciones más avanzadas: tokenización, normalización, segmentación, análisis morfológico o extracción de rasgos {{cite:psf2026b}}(Python Software Foundation, 2026b){{/cite}}."}]},{"id":"1-4-variables-objetos-y-nombres-guardar-informacion-linguist","title":"1.4. Variables, objetos y nombres: guardar información lingüística","blocks":[{"type":"p","text":"Una variable es un nombre que apunta a un objeto. En la unidad, `texto1` es el nombre que se usa para guardar un texto institucional. La variable no es el texto en sentido lingüístico; es una etiqueta de programación que permite recuperar y manipular un objeto de tipo texto. Esta diferencia es fundamental para evitar errores: Python no interpreta `texto1` como una palabra española, sino como un identificador."},{"type":"p","text":"Nombrar bien las variables forma parte del trabajo profesional. En lingüística computacional, nombres como `texto_original`, `texto_adaptado` o `texto_traducido` ayudan a conservar trazabilidad. La trazabilidad permite saber qué versión del texto se está midiendo, qué transformación se ha aplicado y qué resultado corresponde a cada paso. El código legible no es un lujo estético; es una condición para que otra persona pueda revisar el análisis."}]},{"id":"1-5-strings-y-secuencias-como-ve-python-una-cadena-de-texto","title":"1.5. `Strings` y secuencias: cómo ve Python una cadena de texto","blocks":[{"type":"p","text":"Un `string` es una secuencia de caracteres. Esto implica que Python puede tratarlo como un conjunto ordenado: puede recorrerlo carácter por carácter, calcular su longitud o aplicar métodos que devuelven nuevas cadenas o listas. En esta unidad se usan comillas triples para almacenar un texto de más de una línea, porque permiten conservar fragmentos extensos sin partirlos en muchas instrucciones."},{"type":"p","text":"Para una lingüista, la idea de secuencia es familiar: las lenguas se realizan en cadenas lineales de formas. La diferencia es que Python no sabe qué es una palabra, una sílaba o una oración hasta que le damos una regla operativa. Por eso el trabajo inicial consiste en pasar de la secuencia de caracteres a unidades de análisis más útiles."}]},{"id":"1-6-tokenizacion-basica-dividir-por-espacios-no-es-comprende","title":"1.6. Tokenización básica: dividir por espacios no es comprender la lengua","blocks":[{"type":"p","text":"La tokenización es el proceso de dividir un texto en unidades de análisis llamadas tokens. En PLN profesional, un tokenizador puede separar `palabras`, `signos`, abreviaturas, números, contracciones o marcas especiales según reglas lingüísticas y estadísticas. En esta unidad se usa una tokenización inicial muy simple: aplicar el método `.split()`, que separa por espacios en blanco."},{"type":"p","text":"Esta estrategia es útil para aprender, pero tiene límites. Si el texto contiene informativa; o ciudadanos., `.split()` conserva la puntuación pegada a la palabra. Por tanto, el resultado no es una segmentación lingüística perfecta, sino una lista razonable para un primer conteo. Esta distinción prepara al alumnado para entender por qué las herramientas de PLN posteriores incorporan tokenizadores más sofisticados {{cite:bird2009,jurafsky2026}}(Bird, Klein y Loper, 2009; Jurafsky y Martin, 2026){{/cite}}."},{"type":"table","rows":[["Decisión","Regla simple de la unidad","Limitación lingüística"],["Palabra","Separar por espacios","No separa puntuación pegada ni resuelve abreviaturas"],["Oración","Dividir por puntos y algunos `signos` sustituidos","No distingue todos los usos discursivos de la puntuación"],["Sílaba","Contar grupos vocálicos","No resuelve hiatos, diptongos, sinalefas ni silabificación real"],["Legibilidad","Combinar promedios de longitud","No mide familiaridad léxica, coherencia ni conocimiento previo"]],"title":"Qué cuenta cada unidad lingüística"},{"type":"image","caption":"Infografía generada con NotebookLM a partir del manual teórico elaborado por la Dr.ª Blanca Hernández Pardo.","src":"img/infografia_tokenizacion.jpg","alt":"Infografía: tokenización básica frente a las unidades lingüísticas reales (palabra, oración, sílaba, legibilidad)"}]},{"id":"1-7-contar-como-operacion-linguistica-de-la-intuicion-a-la-m","title":"1.7. Contar como operación lingüística: de la intuición a la medida","blocks":[{"type":"p","text":"Contar `palabras`, `signos` u `oraciones` parece una operación elemental, pero en lingüística cuantitativa tiene consecuencias interpretativas. Un conteo convierte una propiedad textual en una variable comparable. Si un texto tiene 25 `palabras` y otro tiene 80, la diferencia de longitud deja de ser solo una impresión. Si un texto tiene muchas `palabras` por oración, podemos formular una hipótesis sobre su complejidad sintáctica."},{"type":"p","text":"La función `len()` permite contar elementos de una colección o caracteres de una cadena. Su aparente sencillez es didácticamente muy potente: enseña que una medida depende del objeto que se le entregue. `len(texto1)` cuenta caracteres; `len(palabras)` cuenta elementos de una lista; `len(signos)` cuenta `signos` filtrados. La misma función responde a preguntas distintas según cómo se haya preparado el dato {{cite:psf2026a}}(Python Software Foundation, 2026a){{/cite}}."}]},{"id":"1-8-puntuacion-y-segmentacion-contar-oraciones-exige-una-dec","title":"1.8. Puntuación y segmentación: contar `oraciones` exige una decisión","blocks":[{"type":"p","text":"La segmentación de `oraciones` no es una operación puramente mecánica. En un texto escrito, el punto suele marcar frontera oracional, pero también aparece en abreviaturas, cifras, direcciones electrónicas o usos tipográficos. El punto y coma, los dos puntos o los `signos` de interrogación y exclamación pueden separar unidades discursivas relevantes, pero no siempre equivalen a una oración independiente."},{"type":"p","text":"Por eso, cuando el cuaderno reemplaza un punto y coma por un punto antes de dividir el texto, no está haciendo una trampa técnica: está explicitando una decisión lingüística. En este caso, se decide que el punto y coma del ejemplo separa dos segmentos que interesa contar. La regla puede ser razonable para ese texto y demasiado simple para otros. Esta es una idea clave: en PLN, una regla siempre debe evaluarse frente al fenómeno lingüístico concreto."}]},{"id":"1-9-listas-pertenencia-y-filtrado","title":"1.9. Listas, pertenencia y filtrado","blocks":[{"type":"p","text":"Una lista permite almacenar varios elementos en orden. En la unidad se crea una lista de `palabras` y una lista de `signos` de puntuación. Esta forma de representación prepara el terreno para operaciones frecuentes en PLN: filtrar, contar, recorrer y comparar unidades. Cuando se escribe una lista por comprensión, Python crea una nueva lista a partir de una condición."},{"type":"p","text":"El operador `in` permite comprobar pertenencia. En el conteo de puntuación, la pregunta es si un carácter del texto pertenece al conjunto de `signos` definido por `string.punctuation`. Esta operación tiene una lectura lingüística sencilla: quedarse solo con los caracteres que se consideran puntuación. La limitación es que `string.punctuation` se basa en un conjunto ASCII de `signos`; en español y en textos reales pueden aparecer `signos` tipográficos que exijan una ampliación o normalización específica {{cite:psf2026c}}(Python Software Foundation, 2026c){{/cite}}."}]},{"id":"1-10-expresiones-regulares-buscar-patrones-formales-en-el-te","title":"1.10. Expresiones regulares: buscar patrones formales en el texto","blocks":[{"type":"p","text":"Las expresiones regulares son patrones formales para localizar secuencias de caracteres. En la unidad se introducen para estimar sílabas mediante grupos vocálicos. El patrón `r'[aeiouáéíóúü]+'` busca uno o más caracteres vocálicos consecutivos, incluyendo vocales acentuadas y u con diéresis. `re.findall()` devuelve todas las coincidencias y permite contarlas {{cite:psf2026d}}(Python Software Foundation, 2026d){{/cite}}."},{"type":"p","text":"La utilidad lingüística del patrón es clara: muchas sílabas tienen un núcleo vocálico, de modo que contar grupos de vocales puede aproximar el número de sílabas. Pero la aproximación no equivale a silabificación. En español hay diptongos, hiatos, triptongos, sinalefas y fenómenos prosódicos que un patrón tan simple no resuelve. El ejercicio, por tanto, no enseña a silabificar perfectamente; enseña a convertir una hipótesis lingüística en una regla computacional inicial."}]},{"id":"1-11-legibilidad-que-puede-medir-una-formula-y-que-no-puede-","title":"1.11. Legibilidad: qué puede medir una fórmula y qué no puede medir","blocks":[{"type":"p","text":"La legibilidad lingüística intenta estimar la facilidad de lectura a partir de rasgos observables del texto. Las fórmulas clásicas suelen combinar longitud media de palabra, número de sílabas y longitud media de oración. La tradición parte de trabajos como el de {{cite:flesch1948}}Flesch (1948){{/cite}} y, para español, de adaptaciones como {{cite:fernandezhuerta1959}}Fernández Huerta (1959){{/cite}} y {{cite:szigriszt1993}}Szigriszt Pazos (1993){{/cite}}."},{"type":"p","text":"La unidad no aplica una fórmula oficial validada, sino un índice aproximado construido con fines didácticos. Esto es importante: una fórmula de legibilidad validada necesita investigación empírica, corpus de referencia y escalas interpretativas. El índice de la unidad sirve para entender cómo se construye una métrica: primero se cuentan rasgos, después se combinan y finalmente se interpreta el resultado con cautela."},{"type":"p","text":"Un índice basado en sílabas por palabra y `palabras` por oración puede orientar, pero no captura toda la dificultad de un texto. No mide conocimiento previo del lector, familiaridad terminológica, cohesión, estructura informativa, ambigüedad, diseño visual ni carga conceptual. Por eso, en comunicación clara y accesibilidad, la medición automática debe acompañarse siempre de lectura experta y revisión con usuarios cuando sea posible."}]},{"id":"1-12-reproducibilidad-que-otra-persona-pueda-entender-y-repe","title":"1.12. Reproducibilidad: que otra persona pueda entender y repetir el análisis","blocks":[{"type":"p","text":"Un análisis reproducible no se limita a obtener un resultado correcto una vez. Debe permitir que otra persona ejecute el mismo procedimiento, revise el orden de las celdas, entienda el significado de las variables y compruebe cómo se obtuvo cada número. En notebooks, la reproducibilidad exige cuidar la secuencia de ejecución, documentar decisiones y evitar depender de variables invisibles o celdas ejecutadas fuera de orden."},{"type":"p","text":"La función `print()` tiene aquí un papel más importante de lo que parece: no solo muestra resultados, sino que ayuda a comunicar qué se está calculando. Etiquetar salidas, redondear valores con `round()` y explicar la interpretación de cada medida forma parte del trabajo profesional de una lingüista computacional."}]},{"id":"1-13-del-prototipo-a-la-funcion-por-que-reutilizar-codigo-im","title":"1.13. Del prototipo a la función: por qué reutilizar código importa","blocks":[{"type":"p","text":"Un prototipo es una primera versión operativa de una idea. En esta unidad, el prototipo calcula medidas de un texto concreto. Cuando el mismo procedimiento se quiere aplicar a muchos textos, surge la necesidad de convertirlo en una función. Una función encapsula una serie de pasos, recibe una entrada y devuelve una salida."},{"type":"p","text":"Aunque las funciones se trabajen más adelante con mayor profundidad, conviene anticipar su sentido: reducen repetición, disminuyen errores y permiten comparar textos de forma sistemática. En términos profesionales, pasar de un conjunto de celdas sueltas a una función es pasar de una demostración a una herramienta reutilizable."}]},{"id":"1-14-interpretacion-critica-el-numero-no-sustituye-el-juicio","title":"1.14. Interpretación crítica: el número no sustituye el juicio lingüístico","blocks":[{"type":"p","text":"El resultado numérico de una métrica debe leerse como una pista, no como una sentencia. Si un texto obtiene un índice alto de dificultad, puede deberse a `oraciones` largas, `palabras` polisilábicas o decisiones de segmentación. Pero también puede tratarse de un texto especializado bien escrito para un público experto. La interpretación depende del destinatario, del género discursivo y del propósito comunicativo."},{"type":"p","text":"Esta unidad, por tanto, no enseña solo Python. Enseña una forma de responsabilidad analítica: cada medida debe poder explicarse, cada regla debe poder justificarse y cada conclusión debe reconocer sus límites. Esa actitud será necesaria en todas las unidades posteriores de PLN."}]}],"navTitle":"Marco teórico"},{"id":"2-python-para-pln-del-texto-como-dato-al-primer-prototipo-de","title":"2. Python para PLN: del texto como dato al primer prototipo de legibilidad","blocks":[],"subsections":[{"id":"2-1-google-colab-el-laboratorio-de-trabajo","title":"2.1. Google Colab: el laboratorio de trabajo","blocks":[{"type":"p","text":"Comenzamos trabajando en el entorno virtual de Google Colab, que se compone de notebooks. Un notebook combina dos tipos de celdas:"},{"type":"ul","items":["Celdas de código, donde escribimos instrucciones Python.","Celdas de texto, donde explicamos qué estamos haciendo, formulamos hipótesis, documentamos resultados o redactamos conclusiones."]},{"type":"p","text":"Esta combinación es especialmente valiosa en PLN porque el análisis de textos no es solo técnico. Hay que justificar decisiones. Por ejemplo, si decides que un punto y coma cuenta como frontera entre `oraciones`, esa decisión no pertenece solo a Python: pertenece también a tu interpretación lingüística de la puntuación."},{"type":"p","text":"El primer código del cuaderno es mínimo:"},{"type":"code","code":"print(\"Bienvenido a tu primer cuaderno interactivo en Google Colab!\")"},{"type":"p","text":"La función `print()` muestra un mensaje en pantalla. Puede parecer un gesto pequeño, pero introduce una idea importante: un programa no solo calcula; también comunica resultados a una persona."},{"type":"p","text":"En un contexto profesional, un buen cuaderno no es el que «funciona en secreto», sino el que permite a otra persona del equipo entender qué hace cada celda, por qué se ejecuta en ese orden y cómo interpretar la salida."}]},{"id":"2-2-el-texto-como-dato-variables-y-strings","title":"2.2. El texto como dato: variables y `strings`","blocks":[{"type":"p","text":"Vamos a guardar un primer texto en una variable:"},{"type":"code","code":"texto1 = \"\"\"El lenguaje claro es una herramienta fundamental para garantizar la accesibilidad informativa;\ntodos los ciudadanos tienen derecho a comprender los mensajes institucionales sin barreras lingüísticas.\"\"\""},{"type":"p","text":"Una variable es un nombre que usamos para guardar un objeto. En este caso, el nombre es `texto1` y el objeto guardado es una cadena de texto, es decir, un `string`."},{"type":"p","text":"La elección del nombre importa. `texto1` indica que este fragmento será el primer texto de trabajo. En análisis lingüístico computacional, los nombres claros reducen errores. No es lo mismo trabajar con `x`, y y `z` que con `texto_original`, `texto_adaptado` y `texto_traducido`."},{"type":"p","text":"El texto aparece entre comillas triples:"},{"type":"code","code":"\"\"\"texto largo\"\"\""},{"type":"p","text":"Las comillas triples permiten escribir cadenas de varias líneas. Son útiles para guardar párrafos, transcripciones, textos institucionales, fragmentos literarios o ejemplos de corpus."},{"type":"p","text":"Después, el cuaderno imprime el texto:"},{"type":"code","code":"print(\"Texto original:\")\nprint(texto1)"},{"type":"p","text":"Aquí hay dos operaciones distintas:"},{"type":"ul","items":["`print(\"Texto original:\")` muestra una etiqueta para que la salida sea comprensible.","`print(texto1)` muestra el contenido almacenado en la variable."]},{"type":"p","text":"Esta costumbre de etiquetar las salidas es básica en trabajos reproducibles. Cuando el cuaderno crece, no basta con que aparezcan números en pantalla. Hay que saber qué significa cada número."}]},{"id":"2-3-de-texto-continuo-a-palabras-split","title":"2.3. De texto continuo a `palabras`: split()","blocks":[{"type":"p","text":"El primer análisis que vamos a hacer consiste en contar `palabras`. Para hacerlo, Python necesita convertir el texto continuo en unidades separadas."},{"type":"code","code":"palabras = texto1.split()"},{"type":"p","text":"El método `.split()` divide una cadena de texto en partes. Por defecto, separa donde encuentra espacios en blanco: espacios, saltos de línea o tabulaciones. El resultado es una lista."},{"type":"p","text":"Si `texto1` es un `string` completo, `palabras` pasa a ser una colección de unidades:"},{"type":"code","code":"[\"El\", \"lenguaje\", \"claro\", \"es\", \"una\", ...]"},{"type":"p","text":"Desde el punto de vista del PLN, esto es una tokenización básica. Tokenizar significa dividir un texto en unidades de análisis. En esta unidad usamos una versión sencilla: separar por espacios."},{"type":"p","text":"Conviene ser precisa: `.split()` no entiende la lengua. Solo aplica una regla mecánica. Por eso puede dejar pegados `signos` de puntuación a las `palabras`:"},{"type":"code","code":"\"informativa;\".split()"},{"type":"p","text":"El resultado conservaría informativa; como una unidad con punto y coma incluido. Para muchas tareas iniciales basta, pero para análisis más finos necesitaremos tokenizadores más sofisticados."},{"type":"p","text":"La pregunta importante para una lingüista no es solo «cómo lo separa Python», sino «si esa separación representa bien el fenómeno que quiero estudiar»."}]},{"id":"2-4-contar-elementos-con-len","title":"2.4. Contar elementos con `len()`","blocks":[{"type":"p","text":"Una vez que tenemos una lista de `palabras`, podemos contar sus elementos:"},{"type":"code","code":"num_palabras = len(palabras)\nprint(\"\\nNúmero de palabras:\", num_palabras)"},{"type":"p","text":"La función `len()` devuelve la longitud de un objeto. Si recibe una lista, cuenta cuántos elementos tiene. Si recibe un `string`, cuenta cuántos caracteres tiene. Si recibe un diccionario, cuenta cuántas entradas contiene."},{"type":"p","text":"En este caso:"},{"type":"code","code":"len(palabras)"},{"type":"p","text":"responde a la pregunta: cuántos elementos hay en la lista `palabras`."},{"type":"p","text":"Para el `texto1` del cuaderno, el resultado es:"},{"type":"table","rows":[["Medida","Resultado"],["Número de `palabras`","25"]],"title":"Resultado"},{"type":"p","text":"Este número parece muy simple, pero ya convierte una impresión lectora en una medida observable. A partir de aquí se puede comparar: un texto tiene 25 `palabras`, otro tiene 19, otro tiene 80. La comparación ya no depende solo de la sensación subjetiva de longitud."}]},{"id":"2-5-importar-herramientas-el-modulo-string","title":"2.5. Importar herramientas: el módulo `string`","blocks":[{"type":"p","text":"Python trae muchas funciones incorporadas, pero también permite importar módulos. Un módulo es un conjunto de herramientas ya preparadas."},{"type":"p","text":"Para contar `signos` de puntuación, el cuaderno importa `string`:"},{"type":"code","code":"import string"},{"type":"p","text":"El módulo `string` pertenece a la biblioteca estándar de Python. No hay que instalarlo. Dentro de él encontramos una constante muy útil:"},{"type":"code","code":"string.punctuation"},{"type":"p","text":"Esta constante contiene `signos` de puntuación comunes, como punto, coma, punto y coma, dos puntos, interrogación inglesa, paréntesis, comillas y otros símbolos."},{"type":"p","text":"La idea de fondo es profesional: no hace falta escribir siempre todo desde cero. Parte de programar consiste en saber qué herramientas existen, importarlas y usarlas de forma consciente."},{"type":"p","text":"Pero también hay que conocer sus límites. `string.punctuation` está pensado sobre todo para puntuación ASCII. En textos españoles puede que algunos `signos`, variantes tipográficas o caracteres especiales necesiten tratamiento adicional. Este detalle importa cuando trabajamos con corpus reales."}]},{"id":"2-6-recorrer-caracteres-y-detectar-puntuacion","title":"2.6. Recorrer caracteres y detectar puntuación","blocks":[{"type":"p","text":"Con esta línea detectamos los `signos` de puntuación:"},{"type":"code","code":"signos = [c for c in texto1 if c in string.punctuation]"},{"type":"p","text":"Esta construcción se llama lista por comprensión. Es una forma compacta de crear una lista a partir de otra secuencia."},{"type":"p","text":"Podemos leerla así:"},{"type":"ol","items":["Recorre cada carácter c dentro de `texto1`.","Comprueba si ese carácter está en `string.punctuation`.","Si lo está, guárdalo en la lista `signos`."]},{"type":"p","text":"La misma idea escrita en lenguaje natural sería:"},{"type":"code","code":"\"Dame todos los caracteres del texto que sean signos de puntuación.\""},{"type":"p","text":"En el `texto1`, la lista resultante es:"},{"type":"code","code":"[';', '.']"},{"type":"p","text":"Después se cuenta la lista:"},{"type":"code","code":"num_signos = len(signos)"},{"type":"p","text":"El resultado es:"},{"type":"table","rows":[["Medida","Resultado"],["`Signos` encontrados",";, ."],["Número de `signos` de puntuación","2"]],"title":"Resultado"},{"type":"p","text":"Este bloque introduce tres ideas esenciales para seguir aprendiendo Python:"},{"type":"ul","items":["Un `string` puede recorrerse carácter por carácter.","`in` permite comprobar su pertenencia.","Una lista por comprensión permite filtrar datos de manera concisa."]},{"type":"p","text":"En PLN, estas tres ideas aparecen continuamente: buscar caracteres, detectar `palabras`, filtrar etiquetas, quedarse con determinados tokens o extraer patrones."}]},{"id":"2-7-contar-oraciones-una-decision-linguistica-dentro-del-cod","title":"2.7. Contar `oraciones`: una decisión lingüística dentro del código","blocks":[{"type":"p","text":"Ahora vamos a contar `oraciones` de forma muy simple:"},{"type":"code","code":"oraciones = texto1.split(\".\")\nnum_oraciones = len([s for s in oraciones if s.strip()])\nprint(\"Número estimado de oraciones:\", num_oraciones)"},{"type":"p","text":"La primera línea divide el texto cada vez que encuentra un punto. Esto genera una lista de fragmentos."},{"type":"p","text":"La segunda línea filtra esos fragmentos:"},{"type":"code","code":"[s for s in oraciones if s.strip()]"},{"type":"p","text":"El método `.strip()` elimina espacios al principio y al final de un `string`. Si un fragmento queda vacío, no se cuenta. Esto evita sumar falsas `oraciones` cuando el texto termina en punto o contiene espacios sobrantes."},{"type":"p","text":"Hasta aquí, Python aplica una regla formal: «divide por puntos». El problema es que la lengua real usa más `signos` para organizar el discurso. En el `texto1` aparece un punto y coma:"},{"type":"code","code":"... accesibilidad informativa;\ntodos los ciudadanos ..."},{"type":"p","text":"Desde una lectura lingüística, ese punto y coma separa dos segmentos oracionales relevantes. Python no lo sabe. Por eso el cuaderno corrige el procedimiento:"},{"type":"code","code":"oraciones = texto1.replace(\";\", \".\").split(\".\")\nnum_oraciones = len([s for s in oraciones if s.strip()])"},{"type":"p","text":"Primero se reemplaza el punto y coma por un punto. Después se divide por puntos."},{"type":"p","text":"Esta celda es una de las más importantes de la unidad porque muestra que programar no es solo escribir instrucciones. Programar PLN es traducir una decisión lingüística a una operación computacional."},{"type":"p","text":"Si en otro texto quisiéramos tratar también los dos puntos como frontera, podríamos encadenar reemplazos:"},{"type":"code","code":"oraciones = texto.replace(\";\", \".\").replace(\":\", \".\").split(\".\")"},{"type":"p","text":"La regla mejora, pero no se vuelve perfecta. Abreviaturas como Sr., decimales como 3.14 o puntos suspensivos pueden complicar el conteo. Por eso hablamos de número estimado de `oraciones`, no de número definitivo."}]},{"id":"2-8-expresiones-regulares-buscar-patrones-de-vocales","title":"2.8. Expresiones regulares: buscar patrones de vocales","blocks":[{"type":"p","text":"Para estimar sílabas, introducimos el módulo `re`:"},{"type":"code","code":"import re"},{"type":"p","text":"`re` permite trabajar con expresiones regulares. Una expresión regular es una forma de describir patrones de texto. No busca una palabra concreta, sino una forma."},{"type":"p","text":"El patrón usado en el cuaderno es:"},{"type":"code","code":"r'[aeiouáéíóúü]+'"},{"type":"p","text":"Y se aplica así:"},{"type":"code","code":"silabas = re.findall(r'[aeiouáéíóúü]+', texto1, re.IGNORECASE)\nnum_silabas = len(silabas)"},{"type":"p","text":"Vamos por partes."},{"type":"p","text":"`re.findall()` busca todas las coincidencias de un patrón dentro de un texto y devuelve una lista."},{"type":"p","text":"El patrón contiene:"},{"type":"table","rows":[["Fragmento","Significado"],["r''","Cadena raw: Python interpreta el patrón de forma literal"],["[aeiouáéíóúü]","Cualquier vocal simple, acentuada o con diéresis"],["+","Uno o más caracteres del grupo anterior"],["`re.IGNORECASE`","Ignora mayúsculas y minúsculas"]],"title":"Partes del patrón regex"},{"type":"p","text":"La intuición lingüística es esta: muchas sílabas contienen un núcleo vocálico. Si buscamos grupos de vocales, podemos aproximar el número de sílabas."},{"type":"p","text":"Por ejemplo, en educación, el patrón detecta grupos vocálicos. Ese recuento no equivale siempre a una silabificación correcta, pero sirve para construir una primera medida automatizada."},{"type":"p","text":"Esta guía debe insistir en la palabra aproximada. El español tiene diptongos, hiatos, sinalefas, casos dialectales y fenómenos fonéticos que este patrón no resuelve. Aun así, el ejercicio es muy valioso porque enseña cómo pasar de una observación lingüística, «las sílabas dependen de vocales», a una regla computacional operativa."},{"type":"p","text":"Para el `texto1`, obtenemos:"},{"type":"table","rows":[["Medida","Resultado"],["Número aproximado de sílabas","69"]],"title":"Número de sílabas"},{"type":"image_modal","caption":"Infografía generada con NotebookLM a partir del manual teórico elaborado por la Dr.ª Blanca Hernández Pardo.","src":"img/infografia_regex.jpg","alt":"Infografía: anatomía de un patrón regex — cadena raw, clase de caracteres, cuantificador y re.IGNORECASE","label":"Ver la anatomía del patrón en infografía","sub":"Los 4 fragmentos explicados"}]},{"id":"2-9-construir-un-indice-de-legibilidad-aproximado","title":"2.9. Construir un índice de legibilidad aproximado","blocks":[{"type":"image_modal","caption":"Infografía generada con NotebookLM a partir del manual teórico elaborado por la Dr.ª Blanca Hernández Pardo.","src":"img/infografia_formula_indice.jpg","alt":"Infografía: las dos partes de la fórmula del índice de legibilidad aproximado y cómo se combinan","label":"Ver la fórmula en infografía","sub":"Cómo se combinan sus dos partes"},{"type":"p","text":"Una vez calculadas `palabras`, `oraciones` y sílabas, combinamos las medidas:"},{"type":"code","code":"indice = (num_silabas / num_palabras) + (num_palabras / num_oraciones)\nprint(\"\\nÍndice aproximado de legibilidad:\", round(indice, 2))"},{"type":"p","text":"La fórmula suma dos promedios:"},{"type":"table","rows":[["Parte de la fórmula","Qué mide","Interpretación"],["`num_silabas` / `num_palabras`","Promedio de sílabas por palabra","Aproximación a dificultad léxica"],["`num_palabras` / `num_oraciones`","Promedio de `palabras` por oración","Aproximación a complejidad sintáctica"]],"title":"Fórmula del índice de legibilidad"},{"type":"p","text":"El primer término se relaciona con la longitud fonológica media de las `palabras`. Si las `palabras` tienen muchas sílabas, es posible que el texto sea más complejo, aunque no siempre."},{"type":"p","text":"El segundo término se relaciona con la longitud media de las `oraciones`. Las `oraciones` muy largas suelen exigir más memoria de trabajo y pueden dificultar la comprensión."},{"type":"p","text":"Para el `texto1`, los valores son:"},{"type":"table","rows":[["Medida","Resultado"],["`Palabras`","25"],["Sílabas aproximadas","69"],["`Oraciones` estimadas","2"],["Índice aproximado","15.26"]],"title":"Resultado"},{"type":"p","text":"Este índice no es una fórmula oficial de legibilidad. Es un prototipo didáctico. Sirve para aprender a construir una métrica, no para certificar profesionalmente que un texto es accesible. Esta distinción es clave en segundo curso. Una métrica computacional puede orientar, comparar y detectar casos llamativos, pero no sustituye el juicio lingüístico. Un texto puede tener un índice alto y ser claro si usa vocabulario familiar. Otro puede tener frases cortas y ser difícil si contiene términos técnicos, ambigüedad o conceptos abstractos."}]},{"id":"2-10-redondear-resultados-con-round","title":"2.10. Redondear resultados con `round()`","blocks":[{"type":"p","text":"A continuación, mostramos el índice así:"},{"type":"code","code":"round(indice, 2)"},{"type":"p","text":"`round()` redondea un número. El segundo argumento indica cuántos decimales queremos conservar. En informes para clientes o actividades docentes, mostrar 15.2633333333 no aporta claridad. Mostrar 15.26 es más legible."},{"type":"p","text":"Este detalle conecta con una competencia profesional: presentar resultados de forma comprensible. El análisis no termina cuando Python calcula. Termina cuando una persona puede leer el resultado y entender qué significa."}]},{"id":"2-11-reutilizar-codigo-el-paso-previo-a-las-funciones","title":"2.11. Reutilizar código: el paso previo a las funciones","blocks":[{"type":"p","text":"Cuando un bloque se repite varias veces, aparece una pregunta profesional: por qué no convertirlo en una función. Todavía no desarrollaremos la función, pero una versión podría ser:"},{"type":"code","code":"def analizar_legibilidad(texto):\n    palabras = texto.split()\n    num_palabras = len(palabras)\n    signos = [c for c in texto if c in string.punctuation]\n    oraciones = texto.replace(\";\", \".\").replace(\":\", \".\").split(\".\")\n    num_oraciones = len([s for s in oraciones if s.strip()])\n    silabas = re.findall(r'[aeiouáéíóúü]+', texto, re.IGNORECASE)\n    num_silabas = len(silabas)\n    indice = (num_silabas / num_palabras) + (num_palabras / num_oraciones)\n    return round(indice, 2)"},{"type":"p","text":"Una función permite reutilizar el análisis sin copiar y pegar tantas líneas. En proyectos reales, esto reduce errores y facilita comparar muchos textos."}]},{"id":"2-12-como-mejoraria-linguaadapt-este-prototipo","title":"2.12. Cómo mejoraría LinguaAdapt este prototipo","blocks":[{"type":"p","text":"Si el cliente quisiera convertir el cuaderno en una herramienta profesional, el equipo podría ampliarlo de varias formas:"},{"type":"ul","items":["Usar un tokenizador lingüístico para separar `palabras` y `signos` con más precisión.","Aplicar un segmentador de `oraciones` en lugar de reemplazos manuales.","Incorporar un silabificador más fiable para español.","Calcular longitud media de palabra y longitud media de oración por separado.","Medir diversidad léxica con una relación tipo-token.","Detectar vocabulario especializado o poco frecuente.","Identificar estructuras sintácticas complejas, como subordinadas o pasivas.","Crear gráficos sencillos para comparar textos.","Exportar resultados a una tabla para analizar muchos documentos."]},{"type":"p","text":"Estas mejoras muestran hacia dónde se dirige el curso: de operaciones básicas sobre `strings` a procedimientos más robustos de análisis lingüístico computacional."}]}],"navTitle":"Python para PLN"},{"id":"errores-frecuentes-de-aprendizaje","title":"Errores frecuentes de aprendizaje","blocks":[{"type":"errorlist","items":[{"term":"Olvidar ejecutar celdas anteriores.","desc":"Si una variable como `texto1` no se ha definido, Python no puede usarla. En notebooks, el orden visual no siempre coincide con el orden real de ejecución."},{"term":"Confundir el texto con el nombre de la variable.","desc":"`texto1` no es la frase. Es el nombre que apunta al objeto `string` donde está guardada la frase."},{"term":"Pensar que ``.split()`` hace análisis lingüístico completo.","desc":"`.split()` separa por espacios. No interpreta morfología, puntuación ni sintaxis."},{"term":"Contar `oraciones` sin filtrar fragmentos vacíos.","desc":"Después de dividir por puntos, pueden quedar cadenas vacías. Por eso se usa `if` s`.strip()`."},{"term":"Interpretar el índice como diagnóstico absoluto.","desc":"El índice orienta, pero debe contrastarse con una lectura cualitativa."}]}],"subsections":[],"navTitle":"Errores frecuentes"},{"id":"sintesis-final","title":"Síntesis final","blocks":[{"type":"p","text":"En esta unidad has aprendido la base conceptual de un primer análisis de PLN con Python: representar un texto como cadena de caracteres, guardarlo en una variable, dividirlo en unidades, contar rasgos observables y combinar esos rasgos en una medida aproximada."},{"type":"p","text":"La idea central es que programar no consiste solo en escribir instrucciones, sino en convertir decisiones lingüísticas en operaciones explícitas. Decidir qué cuenta como palabra, oración, signo de puntuación o grupo vocálico forma parte del análisis."},{"type":"p","text":"El prototipo de legibilidad no pretende sustituir una evaluación experta de accesibilidad. Sirve para comprender cómo se construye una métrica, por qué hay que documentar sus supuestos y cómo Python puede ayudar a comparar textos de forma inicial y reproducible."}],"subsections":[],"navTitle":"Síntesis"},{"id":"cierre-narrativo","title":"Cierre narrativo","blocks":[{"type":"p","text":"Al cerrar esta unidad, tu primer encargo en LinguaAdapt ya tiene forma. Has partido de un texto institucional, lo has guardado como dato, lo has dividido en unidades, has contado rasgos observables y has construido una métrica sencilla para orientar una decisión de accesibilidad."},{"type":"p","text":"Lo más importante no es el número final. Lo importante es haber entendido el proceso: cada resultado computacional nace de una decisión previa. Decidir qué cuenta como palabra, qué cuenta como oración o qué patrón aproxima una sílaba son elecciones que conectan conocimiento lingüístico y programación. Ese es el punto de entrada al PLN: usar Python para hacer explícitas nuestras hipótesis sobre el lenguaje, probarlas sobre textos reales y revisar críticamente lo que la máquina devuelve."},{"type":"p","text":"Python no lee como una lingüista. Pero una lingüista que sabe Python puede enseñarle a observar patrones, medirlos y convertirlos en preguntas mejores."}],"subsections":[],"navTitle":"Cierre narrativo"}],"references":[{"key":"biber1998","text":"Biber, D., Conrad, S. y Reppen, R. (1998). *Corpus linguistics: Investigating language structure and use*. Cambridge University Press."},{"key":"bird2009","text":"Bird, S., Klein, E. y Loper, E. (2009). *Natural language processing with Python*. O'Reilly Media. https://www.nltk.org/book/"},{"key":"fernandezhuerta1959","text":"Fernández Huerta, J. (1959). Medidas sencillas de lecturabilidad. *Consigna, 214*, 29-32."},{"key":"flesch1948","text":"Flesch, R. (1948). A new readability yardstick. *Journal of Applied Psychology, 32*(3), 221-233. https://doi.org/10.1037/h0057532"},{"key":"google2026","text":"Google. (2026). *Colaboratory: Frequently asked questions*. https://research.google.com/colaboratory/faq.html"},{"key":"gries2009","text":"Gries, S. T. (2009). *Quantitative corpus linguistics with R: A practical introduction*. Routledge."},{"key":"jupyter2026","text":"Jupyter Notebook Team. (2026). *Jupyter Notebook documentation*. https://jupyter-notebook.readthedocs.io/"},{"key":"jurafsky2026","text":"Jurafsky, D. y Martin, J. H. (2026). *Speech and language processing* (3rd ed. draft). Stanford University. https://web.stanford.edu/~jurafsky/slp3/"},{"key":"kluyver2016","text":"Kluyver, T., Ragan-Kelley, B., Pérez, F., Granger, B., Bussonnier, M., Frederic, J., Kelley, K., Hamrick, J., Grout, J., Corlay, S., Ivanov, P., Avila, D., Abdalla, S., Willing, C. y Jupyter Development Team. (2016). Jupyter Notebooks: A publishing format for reproducible computational workflows. En F. Loizides y B. Schmidt (Eds.), *Positioning and power in academic publishing: Players, agents and agendas* (pp. 87-90). IOS Press. https://doi.org/10.3233/978-1-61499-649-1-87"},{"key":"psf2026a","text":"Python Software Foundation. (2026a). Built-in functions. *Python 3.14 documentation*. https://docs.python.org/3/library/functions.html"},{"key":"psf2026b","text":"Python Software Foundation. (2026b). Built-in types: Text sequence type str. *Python 3.14 documentation*. https://docs.python.org/3/library/stdtypes.html"},{"key":"psf2026c","text":"Python Software Foundation. (2026c). string: Common string operations. *Python 3.14 documentation*. https://docs.python.org/3/library/string.html"},{"key":"psf2026d","text":"Python Software Foundation. (2026d). re: Regular expression operations. *Python 3.14 documentation*. https://docs.python.org/3/library/re.html"},{"key":"szigriszt1993","text":"Szigriszt Pazos, F. (1993). *Sistemas predictivos de legibilidad del mensaje escrito: Fórmula de perspicuidad* [Tesis doctoral, Universidad Complutense de Madrid]. https://produccioncientifica.ucm.es/documentos/5d1df5fb29995204f765de7f"}]}};

  function sha256Hex(text) {
    var enc = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", enc).then(function(buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function(b) {
        return b.toString(16).padStart(2, "0");
      }).join("");
    });
  }

  function showView(id) {
    document.querySelectorAll(".view").forEach(function(v) { v.hidden = true; });
    var el = document.getElementById(id) || document.getElementById("view-" + id);
    if (el) el.hidden = false;
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  var quizState = null;

  function renderQuizStart() {
    var root = document.getElementById("quiz-root");
    if (!root) return;
    root.innerHTML =
      '<div class="quiz-start">' +
      '<p>10 preguntas: 5 elegidas al azar del banco del manual y 5 del banco del cuaderno. Puedes repetir el intento tantas veces como quieras — cada vez se vuelven a elegir y reordenar las preguntas.</p>' +
      '<button class="quiz-btn" id="quiz-begin">Empezar</button>' +
      '</div>';
    document.getElementById("quiz-begin").addEventListener("click", startQuiz);
  }

  function startQuiz() {
    var fromManual = shuffle(QUIZ_MANUAL).slice(0, 5);
    var fromCuaderno = shuffle(QUIZ_CUADERNO).slice(0, 5);
    quizState = { questions: shuffle(fromManual.concat(fromCuaderno)), index: 0, score: 0 };
    renderQuizQuestion();
  }

  function renderQuizQuestion() {
    var root = document.getElementById("quiz-root");
    var total = quizState.questions.length;
    if (quizState.index >= total) {
      root.innerHTML =
        '<div class="quiz-result">' +
        '<div class="quiz-score">' + quizState.score + ' / ' + total + '</div>' +
        '<p>Puntuación de este intento.</p>' +
        '<button class="quiz-btn" id="quiz-retry">Volver a intentar</button>' +
        '</div>';
      document.getElementById("quiz-retry").addEventListener("click", startQuiz);
      return;
    }
    var q = quizState.questions[quizState.index];
    var opts = shuffle(q.answerOptions);
    var html = '<div class="quiz-progress">Pregunta ' + (quizState.index + 1) + ' de ' + total + ' · Puntuación provisional: ' + quizState.score + '</div>';
    html += '<div class="quiz-q"><h3>' + q.question + '</h3>';
    opts.forEach(function(opt, i) {
      html += '<button class="quiz-opt" data-idx="' + i + '">' + opt.text + '</button>';
    });
    html += '<div class="quiz-feedback" id="quiz-feedback" hidden></div>';
    html += '</div>';
    root.innerHTML = html;
    var buttons = root.querySelectorAll(".quiz-opt");
    buttons.forEach(function(btn, i) {
      btn.addEventListener("click", function() {
        buttons.forEach(function(b) { b.disabled = true; });
        var chosen = opts[i];
        if (chosen.isCorrect) { btn.classList.add("correct"); quizState.score++; }
        else {
          btn.classList.add("incorrect");
          buttons.forEach(function(b2, j) { if (opts[j].isCorrect) b2.classList.add("correct"); });
        }
        var fb = document.getElementById("quiz-feedback");
        fb.hidden = false;
        fb.textContent = chosen.rationale || (chosen.isCorrect ? "Correcto." : "Incorrecto.");
        var next = document.createElement("button");
        next.className = "quiz-btn";
        next.style.marginTop = "14px";
        next.textContent = quizState.index + 1 < total ? "Siguiente" : "Ver puntuación";
        next.addEventListener("click", function() { quizState.index++; renderQuizQuestion(); });
        root.querySelector(".quiz-q").appendChild(next);
      });
    });
  }

  function imEsc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function imFormatBackticks(s) {
    var parts = s.split("`"), out = "";
    for (var i = 0; i < parts.length; i++) out += (i % 2 === 1) ? '<code class="im-inline">' + imEsc(parts[i]) + "</code>" : imEsc(parts[i]);
    return out;
  }
  function imFormatInline(raw) {
    var re = /{{cite:([^}]*)}}([\s\S]*?){{\/cite}}/g;
    var out = "", last = 0, m;
    while ((m = re.exec(raw))) {
      out += imFormatBackticks(raw.slice(last, m.index));
      out += '<span class="im-cite" data-refs="' + m[1] + '">' + imFormatBackticks(m[2]) + ' <span aria-hidden="true">ⓘ</span></span>';
      last = re.lastIndex;
    }
    out += imFormatBackticks(raw.slice(last));
    return out;
  }
  function imLinkify(text) {
    var re = /(https?:\/\/[^\s]+)/g;
    var out = "", last = 0, m;
    while ((m = re.exec(text))) {
      out += imEsc(text.slice(last, m.index));
      var url = m[1].replace(/[.,;]+$/, "");
      out += '<a href="' + imEsc(url) + '" target="_blank" rel="noopener">' + imEsc(url) + "</a>";
      last = m.index + url.length;
    }
    out += imEsc(text.slice(last));
    return out;
  }
  function imBibText(text) {
    // *word* marks an APA-italicized container title (book/journal name+volume/etc.)
    return text.split(/(\*[^*]+\*)/g).map(function(part) {
      if (part.charAt(0) === "*" && part.charAt(part.length - 1) === "*" && part.length > 1) {
        return "<em>" + imLinkify(part.slice(1, -1)) + "</em>";
      }
      return imLinkify(part);
    }).join("");
  }

  function imTableHtml(b) {
    var head = b.rows[0], body = b.rows.slice(1);
    return "<table><thead><tr>" + head.map(function(h) { return "<th>" + imFormatInline(h) + "</th>"; }).join("") + "</tr></thead><tbody>" +
      body.map(function(r) { return "<tr>" + r.map(function(c) { return "<td>" + imFormatInline(c) + "</td>"; }).join("") + "</tr>"; }).join("") +
      "</tbody></table>";
  }
  function imRenderTable(b, key, bare) {
    var t = imTableHtml(b);
    if (bare) return '<div class="im-table-bare">' + t + "</div>";
    var title = b.title || "Tabla";
    return '<button class="im-table-toggle" data-im-table="' + key + '" data-im-table-title="' + imEsc(title) + '">▤ Ver tabla: ' + imEsc(title) + "</button>" +
      '<template data-im-table-src="' + key + '">' + t + "</template>";
