<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tema 1 — PLN</title>
<style>

:root {
  --azul: #003B5C;
  --azul-d: #00283F;
  --amar: #F4C542;
  --gris: #34484F;
  --claro: #F3F3F4;
  --humo: #9FB1BA;
  --verde: #2E7D32;
  --rojo: #B00020;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: var(--gris); background:#fff; }
a { color: inherit; }

#gate { position:fixed; inset:0; background:var(--azul); display:flex; align-items:center; justify-content:center; padding:24px; z-index:999; }
#gate .box { max-width:380px; width:100%; text-align:center; }
#gate .kicker { color:var(--amar); font-size:12px; font-weight:bold; letter-spacing:2.5px; text-transform:uppercase; margin-bottom:10px; }
#gate h1 { color:#fff; font-size:26px; margin:0 0 10px; }
#gate p { color:var(--humo); font-size:14px; margin:0 0 26px; }
#gate input { width:100%; padding:13px 16px; border-radius:8px; border:none; font-size:15px; font-family:Arial,Helvetica,sans-serif; margin-bottom:14px; outline:2px solid transparent; }
#gate input:focus { outline:2px solid var(--amar); }
#gate button.submit { width:100%; padding:13px 16px; border-radius:8px; border:none; background:var(--amar); color:var(--azul-d); font-size:15px; font-weight:bold; font-family:Arial,Helvetica,sans-serif; cursor:pointer; }
#gate button.submit:hover { filter:brightness(1.06); }
#gate .error { color:#FFB3B3; font-size:13px; margin-top:12px; min-height:18px; }
#page { display:none; }
main { max-width:980px; margin:0 auto; padding:48px 6vw 60px; }
.kicker { color:var(--amar); font-size:12px; font-weight:bold; letter-spacing:2.5px; text-transform:uppercase; margin-bottom:8px; }
.view > h1 { color:var(--azul); font-size:32px; margin:0 0 34px; }
.hub-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; margin-bottom:30px; }
.hub-btn { display:flex; flex-direction:column; align-items:flex-start; gap:6px; background:var(--claro); border:none; border-radius:12px; padding:26px 22px; cursor:pointer; text-align:left; box-shadow:0 2px 10px rgba(159,177,186,.28); font-family:Arial,Helvetica,sans-serif; position:relative; }
.hub-btn:hover { background:#E9ECEE; }
.hub-icon { font-size:30px; margin-bottom:4px; }
.hub-label { font-size:17px; font-weight:bold; color:var(--azul); }
.hub-desc { font-size:12.5px; color:var(--humo); }
.back-home { font-size:13px; color:var(--humo); text-decoration:none; }
.back-home:hover { color:var(--azul); }
.sub-view h2 { color:var(--azul); font-size:24px; margin:18px 0 4px; }
.sub-view .section-note { font-size:13px; color:var(--humo); margin:0 0 24px; }
.back-btn { background:none; border:1.5px solid var(--azul); color:var(--azul); font-size:13px; font-weight:bold; padding:6px 14px; border-radius:20px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.back-btn:hover { background:var(--azul); color:#fff; }
.dl-big { display:inline-block; background:var(--amar); color:var(--azul-d); font-weight:bold; font-size:14px; text-decoration:none; padding:10px 20px; border-radius:20px; margin-bottom:18px; }
.pdf-frame { width:100%; height:78vh; border:none; border-radius:8px; box-shadow:0 2px 10px rgba(159,177,186,.28); }
.notice { font-size:12px; color:var(--humo); font-style:italic; margin-top:10px; }
/* quiz */
.quiz-start { background:var(--claro); border-radius:12px; padding:26px; }
.quiz-start p { font-size:14px; margin:0 0 18px; }
.quiz-btn { background:var(--azul); color:#fff; border:none; border-radius:20px; padding:11px 22px; font-size:14px; font-weight:bold; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.quiz-btn:hover { filter:brightness(1.15); }
.quiz-progress { font-size:12px; color:var(--humo); margin-bottom:6px; }
.quiz-q { background:var(--claro); border-radius:12px; padding:24px; margin-bottom:18px; }
.quiz-q h3 { color:var(--azul); font-size:17px; margin:0 0 18px; }
.quiz-opt { display:block; width:100%; text-align:left; background:#fff; border:1.5px solid var(--humo); border-radius:8px; padding:12px 16px; margin-bottom:10px; font-size:14px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; color:var(--gris); }
.quiz-opt:hover { border-color:var(--azul); }
.quiz-opt.correct { border-color:var(--verde); background:#EAF6EB; font-weight:bold; }
.quiz-opt.incorrect { border-color:var(--rojo); background:#FBEAEC; }
.quiz-opt[disabled] { cursor:default; }
.quiz-feedback { font-size:13px; color:var(--gris); background:#fff; border-radius:8px; padding:12px 16px; margin-top:4px; margin-bottom:16px; border-left:3px solid var(--azul); }
.quiz-score { font-size:26px; font-weight:bold; color:var(--azul); margin-bottom:8px; }
.quiz-result { background:var(--claro); border-radius:12px; padding:30px; text-align:center; }
/* teacher panel */
.teacher-banner { background:var(--azul-d); color:#fff; border-radius:12px; padding:18px 22px; margin-bottom:24px; }
.teacher-banner strong { color: var(--amar); }
.teacher-banner p { font-size:13px; margin:6px 0 0; color:var(--humo); }
.teacher-token-row { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
.teacher-token-row input { flex:1; min-width:220px; padding:9px 12px; border-radius:8px; border:none; font-size:13px; font-family:Arial,Helvetica,sans-serif; }
.teacher-token-row button { background:var(--amar); color:var(--azul-d); border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:bold; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.teacher-status { font-size:12px; margin-top:10px; min-height:16px; }
.teacher-toggle-list { list-style:none; padding:0; margin:16px 0 0; display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; }
.teacher-toggle-list li { background:rgba(255,255,255,.08); border-radius:8px; padding:10px 14px; display:flex; align-items:center; gap:10px; font-size:13px; }
.teacher-toggle-list input { width:18px; height:18px; }
.hub-btn .teacher-hint { position:absolute; top:10px; right:12px; font-size:10px; font-weight:bold; padding:2px 8px; border-radius:10px; }
.hub-btn .teacher-hint.on { background:#DFF3E0; color:var(--verde); }
.hub-btn .teacher-hint.off { background:#FBEAEC; color:var(--rojo); }
footer { text-align:center; padding:26px 6vw 40px; font-size:11px; color:var(--humo); font-style:italic; }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <div class="kicker">Tema 1</div>
    <h1>PLN</h1>
    <p>Contenido protegido. Introduce la contraseña facilitada en clase.</p>
    <input type="password" id="pw" placeholder="Contraseña" autofocus>
    <button class="submit" id="enter">Acceder</button>
    <div class="error" id="err"></div>
  </div>
</div>

<div id="page">
  <main id="content"></main>
  <footer>

  </footer>
</div>

  var QUIZ_MANUAL = [{"question":"Cuando una lingüista escribe código para analizar un texto, tiene que traducir preguntas intuitivas -¿es este texto claro?, ¿es denso?- en operaciones concretas y medibles: contar palabras, estimar oraciones, buscar patrones. ¿Cuál de las siguientes opciones describe mejor el valor de esa traducción?","answerOptions":[{"text":"Permitir formular preguntas lingüísticas como una serie de operaciones controlables.","isCorrect":true,"rationale":"Python no sustituye el juicio lingüístico: obliga a precisarlo, convirtiendo categorías interpretativas en operaciones observables."},{"text":"Sustituir la interpretación humana por una verdad algorítmica absoluta.","isCorrect":false,"rationale":"Python no sustituye el juicio lingüístico, pero tampoco entrega una verdad algorítmica: obliga a precisarlo, no a reemplazarlo."},{"text":"Automatizar la lectura de textos para que no sea necesario el análisis experto.","isCorrect":false,"rationale":"La automatización es una herramienta, pero la interpretación crítica sigue siendo necesaria para evaluar el propósito comunicativo."},{"text":"Eliminar la necesidad de representar el texto como datos de tipo cadena de caracteres.","isCorrect":false,"rationale":"Representar el texto como 'str' es precisamente el punto de entrada necesario para cualquier manipulación computacional."}],"hint":"Relaciona la programación con el proceso de precisar las decisiones que un lingüista toma intuitivamente."},{"question":"Al realizar una tokenización básica con el método `.split()`, ¿cuál es una limitación lingüística importante de este método?","answerOptions":[{"text":"Conserva los signos de puntuación pegados a las palabras.","isCorrect":true,"rationale":"Al separar solo por espacios en blanco, signos como puntos o comas se mantienen como parte del token de la palabra precedente."},{"text":"Elimina automáticamente todas las mayúsculas del texto original.","isCorrect":false,"rationale":"El método `.split()` no modifica el contenido de los caracteres, solo divide la cadena basándose en espacios."},{"text":"No es capaz de procesar textos que contengan más de un párrafo.","isCorrect":false,"rationale":"Python puede procesar cadenas extensas con múltiples líneas si se usan delimitadores adecuados como las comillas triples."},{"text":"Divide las palabras basándose en su estructura morfológica interna.","isCorrect":false,"rationale":"Este método es puramente mecánico y no posee conocimiento sobre la morfología o gramática de la lengua."}],"hint":"Piensa en qué sucede con una palabra seguida inmediatamente por un punto y coma si solo nos fijamos en los espacios vacíos."},{"question":"En el contexto de Google Colab, ¿qué permite construir una 'narrativa computacional'?","answerOptions":[{"text":"La combinación de celdas de código ejecutable con celdas de texto explicativo.","isCorrect":true,"rationale":"Esta estructura permite justificar decisiones lingüísticas justo al lado del procedimiento técnico que las ejecuta."},{"text":"La ejecución de código de forma invisible para el usuario final.","isCorrect":false,"rationale":"Una narrativa computacional busca la transparencia, no la ocultación de los procesos."},{"text":"La capacidad de ejecutar celdas en cualquier orden sin afectar al resultado.","isCorrect":false,"rationale":"El orden de ejecución es fundamental en un notebook; alterar el orden visual puede generar resultados incoherentes si dependen de variables previas."},{"text":"La traducción automática de código Python a un lenguaje natural fácilmente comprensible.","isCorrect":false,"rationale":"Aunque el código sea legible, el notebook no traduce el código, sino que requiere que el humano documente el proceso."}],"hint":"Se refiere a la integración de la documentación y la ejecución técnica en un solo documento."},{"question":"Para contar oraciones en el prototipo, se utiliza `texto1.replace(\";\", \".\").split(\".\")`. ¿Qué implica esta operación desde el punto de vista del PLN?","answerOptions":[{"text":"Es una decisión lingüística que trata el punto y coma como frontera oracional.","isCorrect":true,"rationale":"Representa la elección de considerar ciertos signos como delimitadores de segmentos relevantes para el conteo de oraciones."},{"text":"Es una corrección automática de errores gramaticales cometidos por el autor original.","isCorrect":false,"rationale":"La operación no busca corregir gramática, sino preparar el texto para una medición específica de segmentación."},{"text":"Es una trampa técnica para aumentar artificialmente la longitud del texto.","isCorrect":false,"rationale":"No altera la longitud real, sino que subdivide las unidades para reflejar mejor la complejidad discursiva."},{"text":"Es un proceso de normalización para eliminar caracteres no deseados.","isCorrect":false,"rationale":"El objetivo no es limpiar el texto, sino identificar dónde terminan las unidades de sentido según un criterio propio."}],"hint":"Considera por qué un lingüista querría que un segmento tras un punto y coma cuente como una unidad independiente."},{"question":"Al estimar el número de sílabas con la expresión regular `r'[aeiouáéíóúü]+'`, ¿qué fenómeno del español podría causar una imprecisión?","answerOptions":[{"text":"La existencia de diptongos o triptongos.","isCorrect":true,"rationale":"El símbolo `+` agrupa vocales consecutivas como una sola coincidencia, lo cual no siempre refleja la división silábica real en hiatos."},{"text":"La presencia de mayúsculas al inicio de la oración.","isCorrect":false,"rationale":"El uso de `re.IGNORECASE` permite que el patrón detecte vocales sin importar si son mayúsculas o minúsculas."},{"text":"El uso de palabras monosílabas en el texto.","isCorrect":false,"rationale":"Las palabras monosílabas tienen un grupo vocálico que el patrón detectará y contará correctamente como una unidad."},{"text":"La inclusión de consonantes nasales en la cadena.","isCorrect":false,"rationale":"El patrón está diseñado específicamente para buscar vocales; las consonantes son ignoradas por la expresión regular definida."}],"hint":"Recuerda que el patrón busca uno o más caracteres vocálicos seguidos y cómo se comportan las vocales juntas en español."},{"question":"En la fórmula del índice de legibilidad didáctico, indice = (num_silabas / num_palabras) + (num_palabras / num_oraciones), ¿qué representa el segundo término?","answerOptions":[{"text":"Una aproximación a la complejidad sintáctica del texto.","isCorrect":true,"rationale":"Este término mide la longitud media de las oraciones; oraciones más largas suelen indicar una mayor carga sintáctica para el lector."},{"text":"Una aproximación a la dificultad léxica del vocabulario.","isCorrect":false,"rationale":"La dificultad léxica suele relacionarse con la longitud de las palabras (sílabas por palabra), no con la extensión de las oraciones."},{"text":"La densidad de signos de puntuación por cada párrafo.","isCorrect":false,"rationale":"La fórmula utiliza el conteo de palabras y oraciones, no el de signos de puntuación individuales."},{"text":"El promedio de caracteres por cada palabra del texto.","isCorrect":false,"rationale":"El primer término usa sílabas y el segundo usa palabras por oración, ninguno se enfoca directamente en el conteo de caracteres individuales."}],"hint":"Analiza qué relación existe entre la cantidad de palabras que contiene una sola oración y el esfuerzo de la memoria de trabajo."},{"question":"¿Por qué es importante filtrar fragmentos con `if s.strip()` después de dividir por puntos?","answerOptions":[{"text":"Para evitar contar cadenas vacías o espacios en blanco como si fueran oraciones.","isCorrect":true,"rationale":"Si un texto termina en punto, el método `.split()` genera un elemento vacío al final que no debe sumarse al conteo total de oraciones."},{"text":"Para asegurar que las palabras no contengan ningún signo de puntuación en formato ASCII.","isCorrect":false,"rationale":"El filtrado con `.strip()` actúa sobre los segmentos resultantes del split, no sobre la limpieza interna de cada palabra."},{"text":"Para convertir automáticamente todos los fragmentos a letras minúsculas.","isCorrect":false,"rationale":"`.strip()` solo elimina espacios en los extremos; para minúsculas se requeriría el método `.lower()`."},{"text":"Para detectar automáticamente errores ortográficos evidentes en todo el texto.","isCorrect":false,"rationale":"Esta es una operación de limpieza de estructura de datos, no una búsqueda de contenido léxico o terminológico."}],"hint":"Piensa en qué queda en una lista cuando separas una cadena por un carácter que está justo al final de la misma."},{"question":"Un análisis de PLN se considera reproducible cuando otra persona puede ejecutar el mismo procedimiento y entender cómo se obtuvo cada resultado. ¿Cuál de las siguientes prácticas contribuye directamente a esa reproducibilidad?","answerOptions":[{"text":"Garantizar que otra persona pueda ejecutar el procedimiento y entender cómo se obtuvo cada número.","isCorrect":true,"rationale":"La reproducibilidad permite que los resultados sean verificables y que las decisiones lingüísticas sean transparentes para otros investigadores."},{"text":"Utilizar nombres de variables genéricos como `x`, `y` o `z` para mayor brevedad.","isCorrect":false,"rationale":"Se recomiendan nombres descriptivos como `texto_original` para mantener la trazabilidad del análisis."},{"text":"Evitar el uso de la función `print()` para no saturar la salida del notebook.","isCorrect":false,"rationale":"`print()` es esencial para comunicar resultados intermedios y etiquetar salidas de forma comprensible."},{"text":"Confiar en que el orden visual de las celdas es siempre el orden en que se definieron las variables.","isCorrect":false,"rationale":"En notebooks, el estado de las variables depende del historial real de ejecución, lo cual exige cuidado al documentar el flujo de trabajo."}],"hint":"Se trata de permitir que el análisis sea repetible y comprensible para terceros."},{"question":"¿Cuál es la función del segundo argumento en la instrucción `round(indice, 2)`?","answerOptions":[{"text":"Indicar cuántas cifras decimales se desean conservar en la salida.","isCorrect":true,"rationale":"Redondear a dos decimales mejora la legibilidad de los informes técnicos y evita mostrar precisiones irrelevantes."},{"text":"Multiplicar el resultado por dos para obtener directamente un porcentaje final.","isCorrect":false,"rationale":"La función `round()` no realiza operaciones aritméticas de multiplicación, sino de precisión numérica."},{"text":"Dividir el índice entre dos para calcular una media ponderada.","isCorrect":false,"rationale":"El propósito es puramente estético y de claridad comunicativa en la presentación de datos numéricos."},{"text":"Sumar dos unidades al índice final para normalizar el resultado.","isCorrect":false,"rationale":"El segundo argumento define la posición de redondeo tras la coma decimal, no altera el valor base mediante sumas."}],"hint":"Relaciona este argumento con la presentación clara de resultados estadísticos a un cliente."},{"question":"En el procesamiento del lenguaje natural, decidir qué cuenta como palabra, como oración o como signo de puntuación no es un detalle técnico menor: condiciona directamente el resultado del análisis. ¿Cuál de las siguientes opciones describe mejor la relación entre el lenguaje y la programación que se deriva de esta idea?","answerOptions":[{"text":"Cada resultado computacional nace de una decisión lingüística previa convertida en una regla precisa y aplicable.","isCorrect":true,"rationale":"Programar en PLN implica traducir el conocimiento sobre la lengua (qué es una palabra, qué es una oración) en instrucciones operativas."},{"text":"La programación es un fin en sí mismo para automatizar tareas administrativas sin relación con la interpretación del lenguaje.","isCorrect":false,"rationale":"En PLN, la programación es una herramienta para observar fenómenos lingüísticos, no solo un fin administrativo."},{"text":"El conocimiento lingüístico es irrelevante si el código de Python funciona sin errores.","isCorrect":false,"rationale":"Un código puede funcionar técnicamente pero devolver resultados lingüísticamente absurdos si la lógica subyacente es incorrecta."},{"text":"Python posee una comprensión innata de la lengua española que el programador debe descubrir.","isCorrect":false,"rationale":"Python solo procesa símbolos; es el lingüista quien le otorga significado lingüístico a través de las reglas y bibliotecas que utiliza."}],"hint":"Reflexiona sobre quién tiene la responsabilidad de definir los criterios de análisis."}];
  var QUIZ_CUADERNO = [{"question":"¿Cuál es la principal razón por la que Python se ha convertido en el lenguaje predominante para el procesamiento del lenguaje natural?","answerOptions":[{"text":"Su simplicidad sintáctica y su ecosistema de librerías especializadas.","isCorrect":true,"rationale":"Estas características han consolidado a Python como el estándar en este campo."},{"text":"Su capacidad para ejecutarse sin necesidad de una conexión a internet.","isCorrect":false,"rationale":"Aunque Python puede ejecutarse localmente, en este curso se trabaja en la nube mediante Google Colab, que sí requiere conexión."},{"text":"Que es el único lenguaje compatible con el análisis de signos de puntuación.","isCorrect":false,"rationale":"Muchos lenguajes pueden analizar puntuación, pero Python se prefiere por su facilidad de uso en tareas lingüísticas."},{"text":"Su diseño exclusivo para alumnos que nunca han programado.","isCorrect":false,"rationale":"Si bien el cuaderno está diseñado para principiantes, Python es un lenguaje profesional de propósito general."}],"hint":"Observa los beneficios que facilitan la lectura y escritura del código para los lingüistas."},{"question":"Al utilizar el método `.split()` sin argumentos sobre una cadena de texto, ¿qué comportamiento por defecto realiza Python?","answerOptions":[{"text":"Divide la cadena de texto donde hay espacios en blanco.","isCorrect":true,"rationale":"Por defecto, .split() utiliza cualquier espacio en blanco como delimitador para crear una lista de subcadenas."},{"text":"Divide el texto en cada punto final encontrado.","isCorrect":false,"rationale":"Para dividir por puntos, hay que indicar el argumento \".\" dentro del método; sin él, .split() separa por espacios en blanco."},{"text":"Elimina todos los caracteres que no sean letras.","isCorrect":false,"rationale":"El método split se encarga de segmentar la cadena, no de limpiar caracteres específicos."},{"text":"Cuenta el número total de caracteres incluyendo espacios.","isCorrect":false,"rationale":"Contar caracteres es una función de len(), mientras que split segmenta el contenido."}],"hint":"Piensa en el elemento más común que separa las palabras en una oración escrita."},{"question":"Para contar los signos de puntuación de un texto usando el módulo `string`, ¿cuál es la constante que contiene los caracteres a filtrar?","answerOptions":[{"text":"string.punctuation","isCorrect":true,"rationale":"Esta constante contiene todos los caracteres de puntuación estándar definidos por Python."},{"text":"string.all_symbols","isCorrect":false,"rationale":"Esta constante no existe en el módulo string estándar de Python."},{"text":"string.signs","isCorrect":false,"rationale":"Aunque el nombre parece lógico, la biblioteca estándar utiliza un término más técnico para los signos."},{"text":"string.markers","isCorrect":false,"rationale":"La biblioteca string no utiliza el término 'markers' para referirse a la puntuación."}],"hint":"Busca el término en inglés que se refiere específicamente a la puntuación."},{"question":"Antes de dividir un texto en oraciones con .split(\".\"), puede sustituirse primero cada punto y coma por un punto mediante .replace(\";\", \".\"). ¿Por qué tiene sentido lingüístico hacer esa sustitución antes de dividir el texto?","answerOptions":[{"text":"Porque desde una perspectiva lingüística, el punto y coma suele delimitar unidades con sentido completo.","isCorrect":true,"rationale":"El reemplazo permite que el divisor de oraciones reconozca más de un tipo de signo como límite de oración."},{"text":"Porque el punto y coma consume demasiada memoria en Google Colab y ralentiza la ejecución de las celdas siguientes.","isCorrect":false,"rationale":"El reemplazo de caracteres no tiene un impacto significativo en el uso de memoria para estas tareas."},{"text":"Para evitar que el código confunda los signos de puntuación con variables.","isCorrect":false,"rationale":"Los signos dentro de una cadena de texto no se confunden con variables de código."},{"text":"Para eliminar los espacios en blanco innecesarios entre oraciones.","isCorrect":false,"rationale":"La eliminación de espacios se realiza con el método .strip(), no con el reemplazo de signos."}],"hint":"Considera cómo una máquina interpreta los límites de una idea frente a cómo lo hace un humano."},{"question":"Un índice de legibilidad aproximado puede construirse combinando dos promedios: uno basado en el número de sílabas por palabra y otro en el número de palabras por oración. ¿Cuál de las siguientes expresiones representa correctamente esa combinación?","answerOptions":[{"text":"indice = (num_silabas / num_palabras) + (num_palabras / num_oraciones)","isCorrect":true,"rationale":"El índice combina el promedio de complejidad de las palabras con el promedio de extensión de las oraciones."},{"text":"indice = num_silabas / num_oraciones, redondeado a dos decimales con round()","isCorrect":false,"rationale":"Esta fórmula ignoraría la relación necesaria entre sílabas y palabras individuales."},{"text":"indice = num_palabras * num_silabas","isCorrect":false,"rationale":"La multiplicación de estos valores no ofrece una métrica de promedio útil para la legibilidad."},{"text":"indice = num_signos / num_palabras","isCorrect":false,"rationale":"Aunque los signos importan, la métrica del cuaderno se centra en sílabas, palabras y oraciones."}],"hint":"El índice suma dos promedios: uno a nivel de palabra y otro a nivel de oración."},{"question":"Al usar la expresión regular `re.findall(r'[aeiouáéíóúü]+', texto, re.IGNORECASE)`, ¿qué representa el símbolo `+`?","answerOptions":[{"text":"Que el patrón busca una coincidencia de uno o más caracteres consecutivos del grupo anterior.","isCorrect":true,"rationale":"En expresiones regulares, el símbolo + indica que el elemento precedente debe aparecer al menos una vez para ser contado."},{"text":"Que solo se deben buscar vocales en mayúsculas, ignorando cualquier vocal acentuada o con diéresis.","isCorrect":false,"rationale":"La búsqueda de mayúsculas se gestiona con la bandera re.IGNORECASE, no con el símbolo plus."},{"text":"Que se sumará el valor numérico de cada vocal encontrada.","isCorrect":false,"rationale":"Las expresiones regulares identifican patrones de texto, no realizan operaciones aritméticas por sí solas."},{"text":"Que la búsqueda debe ser obligatoriamente en orden alfabético.","isCorrect":false,"rationale":"El orden de los resultados depende de su aparición en el texto, no del alfabeto."}],"hint":"Este símbolo es un cuantificador que permite detectar grupos como 'io' o 'ue' como una sola unidad."},{"question":"¿Por qué se utiliza `if s.strip()` dentro de la lista por comprensión al contar oraciones?","answerOptions":[{"text":"Para asegurar que solo se cuenten fragmentos que contienen texto real y no solo espacios vacíos.","isCorrect":true,"rationale":"Después de un split, pueden quedar fragmentos vacíos (como el espacio tras el punto final) que no deben contarse como oraciones."},{"text":"Para traducir las oraciones a un formato procesable por la máquina.","isCorrect":false,"rationale":"El método strip no realiza traducción, sino manipulación de espacios en blanco."},{"text":"Para convertir todas las letras de la oración en minúsculas antes de mostrarla por pantalla.","isCorrect":false,"rationale":"La conversión a minúsculas se realiza con .lower(), no con .strip()."},{"text":"Para añadir automáticamente un punto al final de cada frase.","isCorrect":false,"rationale":"El condicional filtra elementos existentes, no modifica el contenido añadiendo puntuación."}],"hint":"Considera qué sucede con el espacio que queda después del último punto de un párrafo."},{"question":"¿Cuál de las siguientes es una limitación importante de las métricas de legibilidad automatizadas más básicas, las que solo cuentan sílabas, palabras y oraciones?","answerOptions":[{"text":"No distinguen matices lingüísticos como la familiaridad del vocabulario o la complejidad sintáctica real.","isCorrect":true,"rationale":"Las métricas matemáticas basadas solo en conteos ignoran si una palabra es de uso común o si la estructura es difícil de seguir."},{"text":"No pueden procesar textos de más de 50 palabras.","isCorrect":false,"rationale":"El código puede procesar textos de cualquier longitud, siempre que la memoria lo permita."},{"text":"Requieren que el usuario sepa programar en lenguajes complejos como C++.","isCorrect":false,"rationale":"El análisis se realiza de forma sencilla en Python, como muestra el cuaderno."},{"text":"Solo funcionan con textos escritos en inglés, ya que las fórmulas se calibraron con corpus anglosajones.","isCorrect":false,"rationale":"Aunque hay diferencias, el cuaderno demuestra cómo adaptar el script para el español."}],"hint":"Piensa si un número puede detectar si una palabra es 'rara' o 'común' para un lector."},{"question":"¿Cuál es la función del prefijo `r` en una cadena de Python, como en `r'[aeiou]+'`?","answerOptions":[{"text":"Indica que es una cadena 'raw' (cruda) que trata los símbolos (como las barras invertidas) literalmente.","isCorrect":true,"rationale":"Esto es fundamental en expresiones regulares para evitar que Python interprete caracteres especiales de forma errónea."},{"text":"Indica que la cadena es de solo lectura (read-only) y no puede modificarse durante la ejecución.","isCorrect":false,"rationale":"El acceso de lectura o escritura depende de otros factores, no de este prefijo de cadena."},{"text":"Se utiliza para revertir el orden del texto en la cadena.","isCorrect":false,"rationale":"Para revertir texto se utilizan técnicas de rebanado (slicing) o funciones específicas."},{"text":"Indica que el texto debe ser procesado como una respuesta (response).","isCorrect":false,"rationale":"El prefijo 'r' tiene un significado técnico específico relacionado con el tratamiento de caracteres de escape."}],"hint":"Se usa mucho en expresiones regulares para evitar problemas con la barra invertida."},{"question":"¿Qué beneficio principal ofrece un entorno como Google Colab a quienes empiezan a programar para el procesamiento del lenguaje natural?","answerOptions":[{"text":"Permite trabajar en la nube sin instalar software adicional.","isCorrect":true,"rationale":"Es una ventaja clave de Colab para facilitar el acceso a alumnos sin experiencia técnica previa."},{"text":"Garantiza que el código escrito sea automáticamente perfecto gramaticalmente.","isCorrect":false,"rationale":"Colab es un entorno de ejecución; la lógica y corrección del código dependen del programador."},{"text":"Traduce automáticamente el código de Python a lenguaje humano.","isCorrect":false,"rationale":"Colab ejecuta código; la interpretación de los resultados sigue siendo una tarea humana."},{"text":"Es el único lugar donde se pueden usar expresiones regulares.","isCorrect":false,"rationale":"Las expresiones regulares son una característica del lenguaje Python y funcionan en cualquier entorno compatible."}],"hint":"Piensa en la comodidad de no tener que configurar nada en tu propio ordenador."}];

  function sha256Hex(text) {
    var enc = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", enc).then(function(buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function(b) {
        return b.toString(16).padStart(2, "0");
      }).join("");
    });
  }

  function showView(id) {
    document.querySelectorAll(".view").forEach(function(v) { v.hidden = true; });
    var el = document.getElementById(id) || document.getElementById("view-" + id);
    if (el) el.hidden = false;
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  var quizState = null;

  function renderQuizStart() {
    var root = document.getElementById("quiz-root");
    if (!root) return;
    root.innerHTML =
      '<div class="quiz-start">' +
      '<p>10 preguntas: 5 elegidas al azar del banco del manual y 5 del banco del cuaderno. Puedes repetir el intento tantas veces como quieras — cada vez se vuelven a elegir y reordenar las preguntas.</p>' +
      '<button class="quiz-btn" id="quiz-begin">Empezar</button>' +
      '</div>';
    document.getElementById("quiz-begin").addEventListener("click", startQuiz);
  }

  function startQuiz() {
    var fromManual = shuffle(QUIZ_MANUAL).slice(0, 5);
    var fromCuaderno = shuffle(QUIZ_CUADERNO).slice(0, 5);
    quizState = { questions: shuffle(fromManual.concat(fromCuaderno)), index: 0, score: 0 };
    renderQuizQuestion();
  }

  function renderQuizQuestion() {
    var root = document.getElementById("quiz-root");
    var total = quizState.questions.length;
    if (quizState.index >= total) {
      root.innerHTML =
        '<div class="quiz-result">' +
        '<div class="quiz-score">' + quizState.score + ' / ' + total + '</div>' +
        '<p>Puntuación de este intento.</p>' +
        '<button class="quiz-btn" id="quiz-retry">Volver a intentar</button>' +
        '</div>';
      document.getElementById("quiz-retry").addEventListener("click", startQuiz);
      return;
    }
    var q = quizState.questions[quizState.index];
    var opts = shuffle(q.answerOptions);
    var html = '<div class="quiz-progress">Pregunta ' + (quizState.index + 1) + ' de ' + total + ' · Puntuación provisional: ' + quizState.score + '</div>';
    html += '<div class="quiz-q"><h3>' + q.question + '</h3>';
    opts.forEach(function(opt, i) {
      html += '<button class="quiz-opt" data-idx="' + i + '">' + opt.text + '</button>';
    });
    html += '<div class="quiz-feedback" id="quiz-feedback" hidden></div>';
    html += '</div>';
    root.innerHTML = html;
    var buttons = root.querySelectorAll(".quiz-opt");
    buttons.forEach(function(btn, i) {
      btn.addEventListener("click", function() {
        buttons.forEach(function(b) { b.disabled = true; });
        var chosen = opts[i];
        if (chosen.isCorrect) { btn.classList.add("correct"); quizState.score++; }
        else {
          btn.classList.add("incorrect");
          buttons.forEach(function(b2, j) { if (opts[j].isCorrect) b2.classList.add("correct"); });
        }
        var fb = document.getElementById("quiz-feedback");
        fb.hidden = false;
        fb.textContent = chosen.rationale || (chosen.isCorrect ? "Correcto." : "Incorrecto.");
        var next = document.createElement("button");
        next.className = "quiz-btn";
        next.style.marginTop = "14px";
        next.textContent = quizState.index + 1 < total ? "Siguiente" : "Ver puntuación";
        next.addEventListener("click", function() { quizState.index++; renderQuizQuestion(); });
        root.querySelector(".quiz-q").appendChild(next);
      });
    });
  }

  function wireNav() {
    document.querySelectorAll(".hub-btn").forEach(function(btn) {
      btn.addEventListener("click", function() {
        showView(btn.dataset.view);
        if (btn.dataset.view === "quiz") renderQuizStart();
      });
    });
    document.querySelectorAll("[data-back]").forEach(function(btn) {
      btn.addEventListener("click", function() { showView(btn.dataset.back); });
    });
  }

  function applyStudentVisibility(config) {
    document.querySelectorAll(".hub-btn[data-type]").forEach(function(btn) {
      var t = btn.dataset.type;
      btn.style.display = config[t] ? "" : "none";
    });
  }

  function applyTeacherHints(config) {
    document.querySelectorAll(".teacher-hint[data-hint]").forEach(function(span) {
      var t = span.dataset.hint;
      var on = !!config[t];
      span.textContent = on ? "visible" : "oculto";
      span.className = "teacher-hint " + (on ? "on" : "off");
    });
    document.querySelectorAll("#teacher-panel input[type=checkbox][data-type]").forEach(function(chk) {
      chk.checked = !!config[chk.dataset.type];
    });
  }

  function fetchConfig() {
    return fetch(LOCAL_CONFIG + "?t=" + Date.now()).then(function(r) { return r.json(); });
  }

  function ghHeaders(token) {
    return { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" };
  }

  function ghGetFile(token) {
    return fetch("https://api.github.com/repos/" + REPO + "/contents/" + GH_CONFIG_PATH, { headers: ghHeaders(token) })
      .then(function(r) {
        if (!r.ok) throw new Error("No se pudo leer el fichero (" + r.status + ")");
        return r.json();
      })
      .then(function(data) {
        configSha = data.sha;
        return JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\n/g, "")))));
      });
  }

  function ghSaveFile(token, configObj) {
    var content = btoa(unescape(encodeURIComponent(JSON.stringify(configObj, null, 2) + "\n")));
    return fetch("https://api.github.com/repos/" + REPO + "/contents/" + GH_CONFIG_PATH, {
      method: "PUT",
      headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders(token)),
      body: JSON.stringify({
        message: "Modo profesora: actualizar visibilidad de materiales (" + GH_CONFIG_PATH + ")",
        content: content,
        sha: configSha
      })
    }).then(function(r) {
      if (!r.ok) return r.text().then(function(t) { throw new Error("Error al guardar (" + r.status + "): " + t); });
      return r.json();
    }).then(function(data) {
      configSha = data.content.sha;
    });
  }

  function getToken() {
    try { return sessionStorage.getItem("gh_pat") || ""; } catch (e) { return ""; }
  }
  function setToken(t) {
    try { sessionStorage.setItem("gh_pat", t); } catch (e) {}
  }

  function setStatus(msg, isError) {
    var el = document.getElementById("teacher-status");
    if (!el) return;
    el.textContent = msg;
    el.style.color = isError ? "#FFB3B3" : "#9FE6A0";
  }

  function initTeacherPanel() {
    document.getElementById("teacher-panel").hidden = false;
    var tokenInput = document.getElementById("gh-token");
    tokenInput.value = getToken();

    document.getElementById("gh-token-save").addEventListener("click", function() {
      setToken(tokenInput.value.trim());
      setStatus(tokenInput.value.trim() ? "Token guardado para esta sesión." : "Token borrado.");
      refreshFromGithub();
    });

    document.querySelectorAll("#teacher-panel input[type=checkbox][data-type]").forEach(function(chk) {
      chk.addEventListener("change", function() {
        var token = getToken();
        if (!token) { setStatus("Pega primero tu token de GitHub.", true); chk.checked = !chk.checked; return; }
        setStatus("Guardando...");
        ghGetFile(token).then(function(current) {
          current[chk.dataset.type] = chk.checked;
          return ghSaveFile(token, current).then(function() { return current; });
        }).then(function(current) {
          applyTeacherHints(current);
          setStatus("Guardado ✓ — el alumnado lo verá en 1-2 minutos.");
        }).catch(function(err) {
          chk.checked = !chk.checked;
          setStatus(err.message, true);
        });
      });
    });

    refreshFromGithub();

    function refreshFromGithub() {
      var token = getToken();
      if (!token) { fetchConfig().then(applyTeacherHints); return; }
      setStatus("Cargando estado actual...");
      ghGetFile(token).then(function(current) {
        applyTeacherHints(current);
        setStatus("Conectado. Puedes marcar/desmarcar materiales.");
      }).catch(function(err) { setStatus(err.message, true); fetchConfig().then(applyTeacherHints); });
    }
  }

  function reveal(teacherMode) {
    isTeacher = teacherMode;
    document.getElementById("content").innerHTML = decodeURIComponent(escape(atob(PAYLOAD)));
    document.getElementById("gate").style.display = "none";
    document.getElementById("page").style.display = "block";
    wireNav();
    if (teacherMode) {
      document.querySelectorAll(".hub-btn[data-type]").forEach(function(btn) { btn.style.display = ""; });
      initTeacherPanel();
    } else {
      fetchConfig().then(applyStudentVisibility);
    }
    try { sessionStorage.setItem(SESSION_KEY, teacherMode ? "teacher" : "1"); } catch (e) {}
  }

  function tryUnlock() {
    var val = document.getElementById("pw").value;
    sha256Hex(val).then(function(hex) {
      if (hex === TEACHER_HASH) reveal(true);
      else if (hex === HASH) reveal(false);
      else document.getElementById("err").textContent = "Contraseña incorrecta.";
    });
  }

  document.getElementById("enter").addEventListener("click", tryUnlock);
  document.getElementById("pw").addEventListener("keydown", function(e) { if (e.key === "Enter") tryUnlock(); });

  try {
    var saved = sessionStorage.getItem(SESSION_KEY);
    if (saved === "teacher") reveal(true);
    else if (saved === "1") reveal(false);
  } catch (e) {}
})();
</script>
</body>
</html>
