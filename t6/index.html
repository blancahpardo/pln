<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tema 6 — PLN</title>
<style>

:root {
  --azul: #003B5C;
  --azul-d: #00283F;
  --amar: #F4C542;
  --gris: #34484F;
  --claro: #F3F3F4;
  --humo: #9FB1BA;
  --verde: #2E7D32;
  --rojo: #B00020;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: var(--gris); background:#fff; }
a { color: inherit; }

#gate { position:fixed; inset:0; background:var(--azul); display:flex; align-items:center; justify-content:center; padding:24px; z-index:999; }
#gate .box { max-width:380px; width:100%; text-align:center; }
#gate .kicker { color:var(--amar); font-size:12px; font-weight:bold; letter-spacing:2.5px; text-transform:uppercase; margin-bottom:10px; }
#gate h1 { color:#fff; font-size:26px; margin:0 0 10px; }
#gate p { color:var(--humo); font-size:14px; margin:0 0 26px; }
#gate input { width:100%; padding:13px 16px; border-radius:8px; border:none; font-size:15px; font-family:Arial,Helvetica,sans-serif; margin-bottom:14px; outline:2px solid transparent; }
#gate input:focus { outline:2px solid var(--amar); }
#gate button.submit { width:100%; padding:13px 16px; border-radius:8px; border:none; background:var(--amar); color:var(--azul-d); font-size:15px; font-weight:bold; font-family:Arial,Helvetica,sans-serif; cursor:pointer; }
#gate button.submit:hover { filter:brightness(1.06); }
#gate .error { color:#FFB3B3; font-size:13px; margin-top:12px; min-height:18px; }
#page { display:none; }
main { max-width:980px; margin:0 auto; padding:48px clamp(20px,6vw,48px) 60px; }
.kicker { color:var(--amar); font-size:12px; font-weight:bold; letter-spacing:2.5px; text-transform:uppercase; margin-bottom:8px; }
.view > h1 { color:var(--azul); font-size:32px; margin:0 0 34px; }
.hub-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; margin-bottom:30px; }
.hub-btn { display:flex; flex-direction:column; align-items:flex-start; gap:6px; background:var(--claro); border:none; border-radius:12px; padding:26px 22px; cursor:pointer; text-align:left; box-shadow:0 2px 10px rgba(159,177,186,.28); font-family:Arial,Helvetica,sans-serif; position:relative; }
.hub-btn:hover { background:#E9ECEE; }
.hub-icon { font-size:30px; margin-bottom:4px; }
.hub-label { font-size:17px; font-weight:bold; color:var(--azul); }
.hub-desc { font-size:12.5px; color:var(--humo); }
.back-home { font-size:13px; color:var(--humo); text-decoration:none; }
.back-home:hover { color:var(--azul); }
.sub-view h2 { color:var(--azul); font-size:24px; margin:18px 0 4px; }
.work-notice { background:#FFF7DD; border:1.5px solid var(--amar); border-radius:8px; padding:10px 14px; margin:0 0 14px; font-size:13.5px; color:var(--gris); line-height:1.5; }
.sub-view .section-note { font-size:13px; color:var(--humo); margin:0 0 24px; }
.back-btn { background:none; border:1.5px solid var(--azul); color:var(--azul); font-size:13px; font-weight:bold; padding:6px 14px; border-radius:20px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.back-btn:hover { background:var(--azul); color:#fff; }
.dl-big { display:inline-block; background:var(--amar); color:var(--azul-d); font-weight:bold; font-size:14px; text-decoration:none; padding:10px 20px; border-radius:20px; margin-bottom:18px; }
.pdf-frame { width:100%; height:78vh; border:none; border-radius:8px; box-shadow:0 2px 10px rgba(159,177,186,.28); }
.dl-row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
.dl-row .dl-big { margin-bottom:0; }
.dl-alt { background:#fff; color:var(--azul); border:2px solid var(--azul); padding:8px 18px; }
.pdf-frame-xl { width:min(1300px,96vw); margin-left:calc(50% - min(650px,48vw)); height:calc(100vh - 150px); min-height:560px; }
.img-frame { display:block; width:100%; height:auto; border-radius:8px; box-shadow:0 2px 10px rgba(159,177,186,.28); }
.img-caption { font-size:11px; color:var(--humo); text-align:center; margin-top:10px; font-style:italic; }
.img-caption em { font-style:italic; }
.img-caption a { color:var(--humo); }
.ref-intro { color:var(--azul); font-size:16px; margin:0 0 16px; }
.ref-item { font-size:13.5px; color:var(--gris); line-height:1.6; margin:0 0 16px; padding-left:28px; text-indent:-28px; }
.ref-item a { color:var(--azul); word-break:break-all; }
.ref-item em { font-style:italic; }
.ref-img-block { margin:0 0 16px; }
.ref-img-block .ref-img { display:block; width:100%; height:auto; border-radius:8px; box-shadow:0 2px 10px rgba(159,177,186,.28); margin-bottom:8px; }
.ref-img-block .ref-item { padding-left:0; text-indent:0; }
.notice { font-size:12px; color:var(--humo); font-style:italic; margin-top:10px; }
/* quiz */
.quiz-start { background:var(--claro); border-radius:12px; padding:26px; }
.quiz-start p { font-size:14px; margin:0 0 18px; }
.quiz-btn { background:var(--azul); color:#fff; border:none; border-radius:20px; padding:11px 22px; font-size:14px; font-weight:bold; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.quiz-btn:hover { filter:brightness(1.15); }
.quiz-progress { font-size:12px; color:var(--humo); margin-bottom:6px; }
.quiz-q { background:var(--claro); border-radius:12px; padding:24px; margin-bottom:18px; }
.quiz-q h3 { color:var(--azul); font-size:17px; margin:0 0 18px; }
.quiz-opt { display:block; width:100%; text-align:left; background:#fff; border:1.5px solid var(--humo); border-radius:8px; padding:12px 16px; margin-bottom:10px; font-size:14px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; color:var(--gris); }
.quiz-opt:hover { border-color:var(--azul); }
.quiz-opt.correct { border-color:var(--verde); background:#EAF6EB; font-weight:bold; }
.quiz-opt.incorrect { border-color:var(--rojo); background:#FBEAEC; }
.quiz-opt[disabled] { cursor:default; }
.quiz-feedback { font-size:13px; color:var(--gris); background:#fff; border-radius:8px; padding:12px 16px; margin-top:4px; margin-bottom:16px; border-left:3px solid var(--azul); }
.quiz-score { font-size:26px; font-weight:bold; color:var(--azul); margin-bottom:8px; }
.quiz-result { background:var(--claro); border-radius:12px; padding:30px; text-align:center; }
/* interactive manual */
.im-root { margin-top:0; }
.im-view .im-root { width:min(1320px, 96vw); margin-left:calc(50% - min(660px, 48vw)); }
.im-root:fullscreen { width:100%; margin:0; background:#fff; overflow:auto; padding:22px clamp(16px,4vw,56px) 40px; box-sizing:border-box; }
.im-root:-webkit-full-screen { width:100%; margin:0; background:#fff; overflow:auto; padding:22px clamp(16px,4vw,56px) 40px; box-sizing:border-box; }
.im-hero-tools { position:absolute; top:16px; right:16px; display:flex; gap:8px; z-index:1; flex-wrap:wrap; justify-content:flex-end; }
.im-hero-tools .im-hero-dl { position:static; }
.im-fs-btn { background:rgba(255,255,255,.14); color:#fff; border:1.5px solid rgba(255,255,255,.55); border-radius:20px; padding:8px 14px; font-size:12px; font-weight:bold; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.im-fs-btn:hover { background:rgba(255,255,255,.26); }
.im-rail .im-fs-rail { margin-left:auto; }
.im-hero-lema { color:#fff; opacity:.86; font-style:italic; font-size:14.5px; line-height:1.5; margin:12px 0 0; max-width:720px; position:relative; z-index:1; }
.im-card { position:relative; }
.im-card.visited::after { content:"✓ leído"; position:absolute; top:12px; right:12px; font-size:10.5px; font-weight:bold; color:var(--verde); background:#DFF3E0; border-radius:10px; padding:2px 8px; }
.im-progress { font-size:12.5px; color:var(--humo); margin:-8px 0 14px; }
.im-docimg { margin:8px 0 18px; text-align:center; }
.im-docimg img { max-width:100%; max-height:60vh; height:auto; cursor:zoom-in; border-radius:6px; }
.im-biblist { list-style:none; padding:0; margin:0 0 8px; }
.im-biblist li { background:var(--claro); border-left:3px solid var(--amar); border-radius:0 8px 8px 0; padding:10px 14px; margin-bottom:8px; font-size:13.5px; line-height:1.55; color:var(--gris); }
.im-biblist a { color:var(--azul); word-break:break-word; }
.im-check { list-style:none; padding:0; margin:0 0 14px; }
.im-check li { margin-bottom:8px; }
.im-check label { display:flex; gap:10px; align-items:flex-start; cursor:pointer; font-size:14.5px; line-height:1.55; color:var(--gris); background:var(--claro); border-radius:10px; padding:10px 14px; }
.im-check input { margin-top:4px; accent-color:var(--azul); width:16px; height:16px; flex:none; }
.im-check input:checked + span { text-decoration:line-through; text-decoration-color:var(--humo); color:var(--humo); }
.im-check-hint { font-size:12.5px; color:var(--humo); margin:0 0 10px; font-style:italic; }
.im-errorlist li.im-err-reveal { cursor:pointer; }
.im-errorlist li.im-err-reveal .im-error-desc { display:none; }
.im-errorlist li.im-err-reveal.open .im-error-desc { display:block; animation:imFadeIn .2s ease; }
.im-errorlist li.im-err-reveal .im-err-cta { display:inline-block; font-size:11.5px; font-weight:bold; color:var(--azul); margin-top:4px; }
.im-errorlist li.im-err-reveal.open .im-err-cta { display:none; }
.im-pager { display:flex; justify-content:space-between; gap:12px; margin:30px 0 6px; flex-wrap:wrap; }
.im-pager button { background:#fff; border:1.5px solid var(--azul); color:var(--azul); border-radius:22px; padding:9px 16px; font-size:13px; font-weight:bold; cursor:pointer; font-family:Arial,Helvetica,sans-serif; max-width:48%; }
.im-pager button:hover { background:var(--azul); color:#fff; }
.im-pager .im-next { margin-left:auto; }
.im-hero { position:relative; background:linear-gradient(135deg, var(--azul) 0%, var(--azul-d) 100%); border-radius:16px; padding:34px 26px 30px; margin-bottom:22px; overflow:hidden; }
.im-hero::before { content:""; position:absolute; top:-46px; right:-46px; width:190px; height:190px; border-radius:50%; background:rgba(244,197,66,.12); }
.im-hero::after { content:""; position:absolute; bottom:-60px; left:30%; width:160px; height:160px; border-radius:50%; background:rgba(255,255,255,.05); }
.im-hero-dl { position:absolute; top:16px; right:16px; background:var(--amar); color:var(--azul-d); border:none; border-radius:20px; padding:9px 16px; font-size:12px; font-weight:bold; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:6px; font-family:Arial,Helvetica,sans-serif; z-index:1; }
.im-hero-dl:hover { filter:brightness(1.08); }
.im-hero-kicker { color:var(--amar); font-size:12.5px; font-weight:bold; letter-spacing:.4px; margin:0 0 8px; position:relative; z-index:1; }
.im-hero-title { color:#fff; font-size:clamp(21px,3.2vw,30px); line-height:1.28; margin:0; max-width:620px; position:relative; z-index:1; }
@media (max-width:600px) {
  /* Absolute top-right placement overlaps the kicker/title on narrow
     screens (confirmed on a real phone-width viewport) -> drop it back into
     normal flow above them instead, full-width so it's easy to tap. */
  .im-hero-tools { position:static; margin:0 0 14px; justify-content:stretch; }
  .im-hero-tools > * { flex:1; text-align:center; justify-content:center; }
  .im-hero-dl { position:static; display:flex; justify-content:center; width:100%; margin:0 0 16px; box-sizing:border-box; }
}
.im-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
.im-card { text-align:left; background:var(--claro); border:none; border-radius:12px; padding:20px 20px 18px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; box-shadow:0 2px 10px rgba(159,177,186,.28); transition:transform .12s ease, background .12s ease; opacity:0; transform:translateY(10px); animation:imCardIn .35s ease forwards; }
.im-card:hover { background:#E9ECEE; transform:translateY(-2px); }
.im-card.im-card-bib { background:var(--azul); }
.im-card.im-card-bib .im-card-title, .im-card.im-card-bib .im-card-meta { color:#fff; }
.im-card-icon { font-size:24px; }
.im-card-title { display:block; font-size:16px; font-weight:bold; color:var(--azul); line-height:1.3; margin-top:10px; }
.im-card-meta { display:block; font-size:12px; color:var(--humo); margin-top:6px; }
@keyframes imCardIn { to { opacity:1; transform:translateY(0); } }
.im-rail { display:flex; gap:6px; overflow-x:auto; overflow-y:hidden; padding:12px 2px 16px; margin-bottom:18px; border-bottom:1px solid #E3E7E9; scrollbar-width:thin; scrollbar-color:var(--humo) transparent; }
.im-rail::-webkit-scrollbar { height:6px; }
.im-rail::-webkit-scrollbar-thumb { background:var(--humo); border-radius:3px; }
.im-rail::-webkit-scrollbar-track { background:transparent; }
.im-rail-btn { flex:none; display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; cursor:pointer; padding:6px 9px; border-radius:10px; font-family:Arial,Helvetica,sans-serif; opacity:.5; transition:opacity .15s ease, background .15s ease; }
.im-rail-btn:hover { opacity:.85; }
.im-rail-btn.active { opacity:1; background:var(--claro); }
.im-rail-icon { font-size:16px; line-height:1.4; }
.im-rail-label { font-size:9.5px; font-weight:bold; color:var(--gris); max-width:62px; text-align:center; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.im-rail-btn.active .im-rail-label { color:var(--azul); }
.im-chapter { animation:imFadeIn .25s ease; }
@keyframes imFadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
.im-crumb { background:none; border:none; color:var(--humo); font-size:13px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; padding:0; margin-bottom:16px; text-decoration:underline; }
.im-crumb:hover { color:var(--azul); }
.im-chapter-title { color:var(--azul); font-size:23px; margin:0 0 16px; }
.im-block-p { font-size:14.5px; line-height:1.7; color:var(--gris); margin:0 0 14px; }
.im-block-h4 { font-size:15px; font-weight:bold; color:var(--azul); margin:20px 0 8px; }
.im-sub-body .im-block-h4:first-child { margin-top:0; }
.im-block-ul, .im-block-ol { margin:0 0 14px; padding-left:22px; }
.im-block-ul li, .im-block-ol li { font-size:14.5px; line-height:1.65; color:var(--gris); margin-bottom:6px; }
.im-sub { border-top:1px solid #E3E7E9; }
.im-sub:first-child { border-top:none; }
.im-sub-head { width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; background:none; border:none; text-align:left; padding:16px 4px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.im-sub-head:hover .im-sub-title { color:var(--azul-d); }
.im-sub-title { font-size:15.5px; font-weight:bold; color:var(--azul); }
.im-sub-arrow { color:var(--humo); font-size:13px; transition:transform .15s ease; flex:none; }
.im-sub.open .im-sub-arrow { transform:rotate(90deg); }
.im-sub-body { max-height:0; overflow:hidden; padding:0 4px; transition:max-height .3s ease; }
.im-sub.open .im-sub-body { max-height:none; padding-bottom:14px; }
.im-code-toggle { display:inline-flex; align-items:center; gap:6px; background:#fff; border:1.5px dashed var(--humo); color:var(--azul); font-size:12.5px; font-weight:bold; border-radius:20px; padding:7px 14px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; margin:2px 0 14px; }
.im-code-toggle:hover { border-color:var(--azul); }
.im-code-box { display:none; background:#F2F4F5; border-radius:8px; padding:14px 16px; margin:0 0 14px; overflow-x:auto; animation:imFadeIn .2s ease; }
.im-code-box.open { display:block; }
.im-code-box pre { margin:0; font-family:"Courier New",monospace; font-size:13px; line-height:1.55; color:#1c2a30; white-space:pre-wrap; word-break:break-word; }
.im-table-toggle { display:inline-flex; align-items:center; gap:6px; background:#fff; border:1.5px solid var(--azul); color:var(--azul); font-size:12.5px; font-weight:bold; border-radius:20px; padding:7px 14px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; margin:2px 0 14px; }
.im-table-toggle:hover { background:var(--azul); color:#fff; }
.im-table-bare { overflow-x:auto; margin:0 0 16px; border-radius:8px; box-shadow:0 2px 10px rgba(159,177,186,.28); scrollbar-width:thin; scrollbar-color:var(--humo) transparent; }
.im-table-bare::-webkit-scrollbar, .im-code-box::-webkit-scrollbar, .im-modal table::-webkit-scrollbar { height:6px; }
.im-table-bare::-webkit-scrollbar-thumb, .im-code-box::-webkit-scrollbar-thumb { background:var(--humo); border-radius:3px; }
.im-table-bare::-webkit-scrollbar-track, .im-code-box::-webkit-scrollbar-track { background:transparent; }
.im-table-bare table, .im-modal table { border-collapse:collapse; width:100%; font-size:13px; }
.im-table-bare th, .im-modal th { background:var(--azul); color:#fff; text-align:left; padding:9px 12px; font-size:12.5px; }
.im-table-bare td, .im-modal td { padding:9px 12px; border-bottom:1px solid #E3E7E9; color:var(--gris); }
.im-table-bare tr:nth-child(even) td, .im-modal tr:nth-child(even) td { background:var(--claro); }
.im-modal-overlay { position:fixed; inset:0; background:rgba(10,20,26,.55); display:flex; align-items:center; justify-content:center; padding:5vh 4vw; z-index:500; animation:imFadeIn .15s ease; }
.im-modal { background:#fff; border-radius:14px; max-width:760px; width:100%; max-height:90vh; min-width:0; display:flex; flex-direction:column; box-shadow:0 12px 40px rgba(0,0,0,.3); }
.im-modal.im-modal-wide { max-width:min(1500px, 96vw); }
.im-modal-body img { display:block; max-width:100%; max-height:72vh; width:auto; height:auto; margin:0 auto; border-radius:8px; object-fit:contain; }
.im-modal-head { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid #E3E7E9; flex:none; }
.im-modal-head h4 { margin:0; color:var(--azul); font-size:15.5px; }
.im-modal-close { background:var(--claro); border:none; width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:14px; color:var(--gris); flex:none; }
.im-modal-close:hover { background:#E3E7E9; }
.im-modal-body { flex:1; min-height:0; min-width:0; overflow:auto; padding:16px 20px 20px; text-align:center; }
.im-modal-body table { min-width:max-content; }
.im-figure { margin:6px 0 20px; }
.im-figure-img { display:block; width:auto; max-width:100%; height:auto; max-height:82vh; margin:0 auto; border-radius:10px; box-shadow:0 4px 16px rgba(159,177,186,.35); cursor:zoom-in; }
.im-figure-caption { font-size:12px; color:var(--humo); text-align:center; margin-top:8px; font-style:italic; }
@media (min-width:860px) {
  .im-figure { width:min(1300px, 92vw); margin-left:calc(50% - min(650px, 46vw)); margin-right:calc(50% - min(650px, 46vw)); }
}
.im-img-btn { display:flex; align-items:center; gap:14px; width:100%; max-width:420px; background:var(--claro); border:none; border-radius:14px; padding:10px; margin:4px 0 20px; cursor:pointer; text-align:left; font-family:Arial,Helvetica,sans-serif; box-shadow:0 2px 10px rgba(159,177,186,.28); transition:transform .12s ease, background .12s ease; }
.im-img-btn:hover { background:#E9ECEE; transform:translateY(-2px); }
.im-img-btn-thumb { flex:none; width:64px; height:64px; border-radius:10px; background-size:cover; background-position:center; position:relative; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
.im-img-btn-thumb::after { content:"🔍"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:18px; background:rgba(11,44,66,.35); border-radius:10px; }
.im-img-btn-text { display:flex; flex-direction:column; gap:2px; }
.im-img-btn-label { font-size:13.5px; font-weight:bold; color:var(--azul); }
.im-img-btn-sub { font-size:11.5px; color:var(--humo); }
.im-reveal-toggle { display:inline-flex; align-items:center; gap:6px; background:#fff; border:1.5px dashed var(--humo); color:var(--azul); font-size:12.5px; font-weight:bold; border-radius:20px; padding:7px 14px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; margin:2px 0 14px; }
.im-reveal-toggle:hover { border-color:var(--azul); }
.im-reveal-box { display:none; margin:0 0 16px; }
.im-reveal-box.open { display:block; animation:imFadeIn .25s ease; }
.im-reveal-box img { display:block; width:100%; border-radius:10px; box-shadow:0 4px 16px rgba(159,177,186,.35); }
.im-errorlist { list-style:none; padding:0; margin:0 0 6px; }
.im-errorlist li { background:var(--claro); border-left:3px solid var(--rojo); border-radius:0 8px 8px 0; padding:12px 16px; margin-bottom:10px; }
.im-errorlist .im-error-term { display:block; font-weight:bold; color:var(--azul); font-size:14px; margin-bottom:4px; }
.im-errorlist .im-error-desc { font-size:13.5px; color:var(--gris); line-height:1.6; }
.im-cite { color:var(--azul); font-weight:bold; cursor:pointer; border-bottom:1.5px dotted var(--azul); white-space:normal; }
.im-cite:hover { color:var(--azul-d); }
.im-cite-pop { display:none; background:var(--azul-d); color:#fff; border-radius:8px; padding:12px 16px; font-size:12.5px; line-height:1.6; margin:6px 0 14px; }
.im-cite-pop.open { display:block; }
.im-cite-pop p { margin:0 0 8px; }
.im-cite-pop p:last-child { margin-bottom:0; }
.im-cite-pop a { color:var(--amar); }
.im-bib-list { margin-top:6px; }
.im-bib-item.im-bib-highlight { background:#FDF1C7; border-radius:8px; padding:10px 14px; margin-left:-14px; margin-right:-14px; }
code.im-inline { background:#F2F4F5; padding:1px 6px; border-radius:4px; font-family:"Courier New",monospace; font-size:.93em; }
/* teacher panel */
.teacher-banner { background:var(--azul-d); color:#fff; border-radius:12px; padding:18px 22px; margin-bottom:24px; }
.teacher-banner strong { color: var(--amar); }
.teacher-banner p { font-size:13px; margin:6px 0 0; color:var(--humo); }
.teacher-token-row { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
.teacher-token-row input { flex:1; min-width:220px; padding:9px 12px; border-radius:8px; border:none; font-size:13px; font-family:Arial,Helvetica,sans-serif; }
.teacher-token-row button { background:var(--amar); color:var(--azul-d); border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:bold; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.teacher-status { font-size:12px; margin-top:10px; min-height:16px; }
.teacher-toggle-list { list-style:none; padding:0; margin:16px 0 0; display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; }
.teacher-toggle-list li { background:rgba(255,255,255,.08); border-radius:8px; padding:10px 14px; display:flex; align-items:center; gap:10px; font-size:13px; }
.teacher-toggle-list input { width:18px; height:18px; }
.hub-btn .teacher-hint { position:absolute; top:10px; right:12px; font-size:10px; font-weight:bold; padding:2px 8px; border-radius:10px; }
.hub-btn .teacher-hint.on { background:#DFF3E0; color:var(--verde); }
.hub-btn .teacher-hint.off { background:#FBEAEC; color:var(--rojo); }
footer { text-align:center; padding:26px clamp(20px,6vw,48px) 40px; font-size:11px; color:var(--humo); font-style:italic; }
</style>
</head>

  var QUIZ_MANUAL = [{"question":"Dentro del contexto de Veridia Text Lab, ¿cuál es el objetivo primordial de una auditoría lingüística transparente?","answerOptions":[{"text":"Construir herramientas que ayuden a especialistas humanos a observar patrones lingüísticos interpretables.","isCorrect":true,"rationale":"El valor profesional reside en la transparencia y en proporcionar indicios para que el criterio experto realice la interpretación final."},{"text":"Dictaminar de forma automática si un texto tiene una intención discriminatoria absoluta.","isCorrect":false,"rationale":"Una auditoría lingüística transparente no debe automatizar juicios morales ni declarar intenciones psicológicas."},{"text":"Maximizar el rendimiento predictivo mediante modelos generativos de caja negra.","isCorrect":false,"rationale":"El objetivo en esta fase no es el rendimiento máximo, sino la explicabilidad y comprensión de la operacionalización lingüística."},{"text":"Sustituir el análisis crítico del discurso por una clasificación binaria de sesgo.","isCorrect":false,"rationale":"Este tipo de análisis es asistido por corpus, lo que significa que el conteo orienta la mirada pero no sustituye el análisis crítico."}],"hint":"Considera la relación entre la herramienta computacional y el papel del lingüista experto."},{"question":"¿Cuál es la diferencia principal entre el sesgo representacional y el sesgo asignativo en el ámbito del PLN?","answerOptions":[{"text":"El sesgo representacional afecta a cómo se visibiliza a un grupo, mientras que el asignativo afecta a la distribución de recursos o decisiones.","isCorrect":true,"rationale":"Esta distinción separa la forma en que se describe a las comunidades de las consecuencias prácticas en la asignación de oportunidades."},{"text":"El sesgo representacional es puramente técnico y el asignativo es exclusivamente social, sin ninguna conexión posible entre ambos niveles de análisis lingüístico.","isCorrect":false,"rationale":"Ambos tipos de sesgo tienen dimensiones sociales y técnicas entrelazadas en los sistemas de procesamiento de lenguaje."},{"text":"El sesgo asignativo se detecta con léxicos y el representacional solo con aprendizaje automático.","isCorrect":false,"rationale":"Ambos pueden ser objeto de estudio mediante diversos métodos, incluyendo el análisis léxico y de coocurrencias."},{"text":"No existe diferencia real, son sinónimos utilizados para describir errores de anotación en los datos.","isCorrect":false,"rationale":"Estos dos niveles se distinguen claramente para precisar qué comportamiento problemático se está analizando."}],"hint":"Piensa en la diferencia entre describir un estereotipo y tomar una decisión basada en él."},{"question":"En el preprocesamiento de textos, ¿cuál es una implicación lingüística de eliminar las 'stopwords' en un análisis de sesgo?","answerOptions":[{"text":"Permite que las tablas de coocurrencias sean más legibles al centrarse en palabras con contenido temático.","isCorrect":true,"rationale":"Al retirar palabras funcionales muy frecuentes, los términos con carga léxica relevante ganan visibilidad en los conteos de asociación."},{"text":"Garantiza que el sistema comprenda perfectamente la ironía y el sarcasmo del texto.","isCorrect":false,"rationale":"Las listas de palabras vacías no ayudan a la comprensión pragmática; de hecho, pueden dificultarla al eliminar marcas sutiles."},{"text":"Es una operación neutra que no afecta de ninguna manera a la interpretación discursiva.","isCorrect":false,"rationale":"Toda limpieza es una interpretación; eliminar conectores o negaciones puede borrar marcas pragmáticas esenciales."},{"text":"Es obligatorio para poder aplicar expresiones regulares sobre el corpus antes de cualquier otro análisis.","isCorrect":false,"rationale":"Las expresiones regulares funcionan sobre el texto original; la eliminación de stopwords es una decisión metodológica independiente."}],"hint":"Recuerda el equilibrio entre la limpieza de ruido y la conservación de marcas discursivas."},{"question":"¿Qué función cumple la técnica KWIC (Key Word In Context) en una auditoría lingüística?","answerOptions":[{"text":"Permite pasar de la observación de frecuencias globales al análisis del uso contextual de una palabra.","isCorrect":true,"rationale":"Al mostrar el término con sus palabras adyacentes, ayuda al analista a entender cómo se está empleando realmente la forma detectada."},{"text":"Calcula automáticamente la polaridad positiva o negativa de un documento entero.","isCorrect":false,"rationale":"KWIC es una herramienta de visualización de contexto, no una métrica de clasificación de sentimiento."},{"text":"Normaliza el texto eliminando URLs y menciones de usuario mediante regex.","isCorrect":false,"rationale":"La normalización es un paso previo; KWIC se aplica sobre los tokens resultantes para su exploración cualitativa."},{"text":"Sirve para lematizar automáticamente los verbos irregulares en español antes de construir las tablas.","isCorrect":false,"rationale":"La lematización es una tarea morfológica, mientras que KWIC es una técnica de visualización de concordancias."}],"hint":"Considera qué herramienta permite 'mirar' lo que hay a la izquierda y derecha de un término objetivo."},{"question":"Al construir un léxico valorativo con un 'score' simple (+1, -1), ¿cuál es la principal limitación que se debe reconocer?","answerOptions":[{"text":"Que el sistema no es capaz de captar la ironía, la negación compleja o el contexto pragmático.","isCorrect":true,"rationale":"Una palabra como 'brillante' sumará +1 incluso si se usa de forma sarcástica para criticar una mala decisión."},{"text":"Que las palabras positivas siempre tienen mayor peso estadístico general que las palabras negativas del diccionario.","isCorrect":false,"rationale":"El peso depende de la frecuencia en el corpus, no de una propiedad inherente a la polaridad en este sistema."},{"text":"Que Python no permite sumar valores enteros dentro de una comprensión de listas de este tipo.","isCorrect":false,"rationale":"Python permite realizar estas operaciones aritméticas de forma eficiente; la limitación es conceptual y lingüística."},{"text":"Que es imposible crear diccionarios que contengan tanto claves positivas como negativas.","isCorrect":false,"rationale":"El uso de diccionarios y el método `.update()` permite integrar múltiples listas de polaridad en una sola estructura."}],"hint":"Reflexiona sobre lo que sucede cuando alguien dice '¡Qué inteligente eres!' para burlarse."},{"question":"¿Por qué es importante el uso de `\\b` en las expresiones regulares utilizadas para detectar términos de género?","answerOptions":[{"text":"Para evitar que se detecten secuencias de letras dentro de palabras más largas (como 'mujer' en 'mujeriego').","isCorrect":true,"rationale":"El marcador `\\b` indica un límite de palabra, asegurando que el patrón coincida solo con palabras completas y aisladas."},{"text":"Para asegurar que la búsqueda ignore las mayúsculas y minúsculas automáticamente.","isCorrect":false,"rationale":"La ignorancia de mayúsculas se gestiona con `re.IGNORECASE`, no con el marcador de límite de palabra."},{"text":"Para eliminar automáticamente los espacios en blanco sobrantes al final de la frase.","isCorrect":false,"rationale":"La eliminación de espacios se realiza generalmente con `.strip()` o sustituciones de espacios repetidos con `\\s+`."},{"text":"Para indicar que el patrón debe buscarse únicamente al principio del documento y no en el resto del texto.","isCorrect":false,"rationale":"El ancla para el inicio de una cadena suele ser `^`, mientras que `\\b` se refiere a cualquier límite de palabra en el texto."}],"hint":"Imagina que buscas la palabra 'sol' y el sistema te devuelve también 'soldado' y 'soledad'."},{"question":"En un análisis de corpus que localiza qué palabras aparecen cerca de un término objetivo dentro de una ventana de palabras definida, ¿qué representa una 'coocurrencia'?","answerOptions":[{"text":"La aparición recurrente de ciertas palabras en la vecindad de un término objetivo dentro de una ventana definida.","isCorrect":true,"rationale":"Cuantifica qué términos aparecen cerca del objetivo, sugiriendo marcos discursivos o asociaciones de ideas."},{"text":"La frecuencia total de una palabra en todo el corpus analizado, sin distinguir su posición ni las palabras que la rodean.","isCorrect":false,"rationale":"La frecuencia total es un conteo absoluto; la coocurrencia es una medida de asociación relativa a otro término."},{"text":"El error que ocurre cuando dos procesos de Python intentan acceder al mismo archivo de texto.","isCorrect":false,"rationale":"Ese es un problema de concurrencia informática, no un concepto de lingüística de corpus."},{"text":"La coincidencia exacta entre la etiqueta de sentimiento original y el resultado del análisis léxico.","isCorrect":false,"rationale":"Esa coincidencia sería una medida de acuerdo o precisión, no una coocurrencia lingüística."}],"hint":"Se relaciona con la idea de que 'conocerás a una palabra por la compañía que mantiene'."},{"question":"Al interpretar resultados automáticos sobre sesgo lingüístico, ¿qué precaución debe tener una lingüista antes de redactar sus conclusiones?","answerOptions":[{"text":"Evitar afirmaciones concluyentes como 'el algoritmo demuestra que el texto es sexista'.","isCorrect":true,"rationale":"La responsabilidad profesional exige prudencia y presentar los resultados como indicios observables, no como veredictos morales."},{"text":"Asegurarse de que el sistema clasifique al menos el 90% de los textos como problemáticos.","isCorrect":false,"rationale":"El objetivo es la observación objetiva de patrones, no alcanzar una cuota de detección predeterminada."},{"text":"Ignorar el contexto original una vez que se han obtenido las tablas de resultados.","isCorrect":false,"rationale":"Volver al texto original es fundamental para validar si el patrón detectado tiene relevancia discursiva real."},{"text":"Confiar plenamente en que los datos de redes sociales son neutrales y representativos.","isCorrect":false,"rationale":"Los datos de redes sociales contienen ruido, sesgos de muestreo y problemas éticos que deben documentarse."}],"hint":"Piensa en cómo formular un informe que sea científicamente riguroso y éticamente responsable."},{"question":"¿Cuál es la función del bloque `try...except` al cargar spaCy en el entorno de trabajo?","answerOptions":[{"text":"Garantizar que el código siga funcionando incluso si la librería o el modelo de idioma no están instalados.","isCorrect":true,"rationale":"Permite que el pipeline use alternativas (como tokenización por regex) si el entorno no dispone de spaCy, evitando que el programa se detenga."},{"text":"Optimizar la velocidad de procesamiento de las expresiones regulares.","isCorrect":false,"rationale":"La velocidad de las regex no depende de la carga exitosa o fallida de modelos lingüísticos externos como spaCy."},{"text":"Detectar automáticamente el idioma del texto antes de normalizarlo y aplicar el modelo correspondiente.","isCorrect":false,"rationale":"La detección de idioma es una tarea distinta; este bloque gestiona la disponibilidad de recursos técnicos específicos."},{"text":"Eliminar de forma segura las filas del DataFrame que contienen valores nulos.","isCorrect":false,"rationale":"La gestión de valores nulos en pandas se realiza con métodos como `.dropna()`, no mediante la carga condicional de librerías."}],"hint":"Es una práctica de programación profesional relacionada con la portabilidad del código."},{"question":"Si un análisis de lematización convierte 'candidatas' y 'candidata' en el lema único 'candidata', ¿qué riesgo lingüístico se asume en un estudio de género?","answerOptions":[{"text":"Que se pierda información valiosa sobre las marcas morfológicas superficiales de género y número.","isCorrect":true,"rationale":"Al reducir las formas a un lema común (a menudo el masculino o la forma singular), se puede invisibilizar la distinción de género que se pretendía estudiar."},{"text":"Que el sistema tarde demasiado tiempo en procesar cada documento del corpus que se está analizando.","isCorrect":false,"rationale":"La lematización es rápida; el riesgo real es la pérdida de información morfológica específica."},{"text":"Que las expresiones regulares dejen de funcionar sobre el texto original.","isCorrect":false,"rationale":"La lematización crea una nueva representación; el texto original suele conservarse en otra columna del DataFrame."},{"text":"Que las palabras resultantes sean imposibles de contar con la herramienta `Counter`.","isCorrect":false,"rationale":"`Counter` funciona con cualquier lista de elementos, sean formas originales o lemas."}],"hint":"Considera qué sucede con la distinción entre masculino y femenino cuando todo se reduce a la raíz o lema."}];
  var QUIZ_CUADERNO = [{"question":"¿Cómo se manifiesta el sesgo lingüístico desde una perspectiva computacional en el procesamiento del lenguaje natural (PLN)?","answerOptions":[{"text":"A través de la identificación de patrones léxicos y frecuencias sistemáticas.","isCorrect":true,"rationale":"Desde el punto de vista del PLN, el sesgo se aborda identificando recurrencias en el uso de palabras y frecuencias de aparición."},{"text":"Mediante la detección automática de la intención maliciosa del autor.","isCorrect":false,"rationale":"El PLN no detecta la intención del autor directamente, sino que analiza las huellas léxicas dejadas en el texto."},{"text":"Únicamente mediante la corrección de errores gramaticales y sintácticos.","isCorrect":false,"rationale":"La corrección gramatical es una tarea de PLN, pero no define por sí misma el análisis de sesgo léxico o discursivo."},{"text":"Como una alucinación producida exclusivamente por modelos de inteligencia artificial generativa.","isCorrect":false,"rationale":"El sesgo puede analizarse mediante reglas definidas de antemano, sin necesidad de usar inteligencia artificial generativa."}],"hint":"Recuerda que el análisis se centra en lo que es medible a través de los términos utilizados en el corpus."},{"question":"En el contexto de la normalización de texto, ¿por qué se afirma que esta etapa no es 'neutra'?","answerOptions":[{"text":"Porque cada decisión de limpieza implica una hipótesis sobre qué información es relevante.","isCorrect":true,"rationale":"Decidir qué eliminar (como URLs o menciones) supone una interpretación previa sobre qué elementos aportan significado al análisis del sesgo."},{"text":"Porque requiere el uso obligatorio de modelos de Machine Learning muy complejos y costosos.","isCorrect":false,"rationale":"La normalización se basa en reglas, pero su falta de neutralidad reside en la toma de decisiones lingüísticas, no en la complejidad técnica."},{"text":"Porque el proceso de convertir a minúsculas altera el significado léxico de las palabras.","isCorrect":false,"rationale":"Aunque las mayúsculas pueden dar énfasis, la normalización a minúsculas es un paso técnico estándar para unificar tokens."},{"text":"Porque la eliminación de números impide realizar recuentos de frecuencia precisos.","isCorrect":false,"rationale":"La eliminación de números busca reducir el ruido, pero no es la razón principal por la cual la normalización se considera una decisión teórica."}],"hint":"Piensa en el impacto de descartar ciertos elementos del texto antes del análisis."},{"question":"Al trabajar con listas léxicas de género, ¿cuál es el objetivo de incluir términos como 'estudiante' o 'deportista'?","answerOptions":[{"text":"Servir como contraste para identificar términos neutrales y demostrar límites del sistema.","isCorrect":true,"rationale":"Se utilizan para mostrar que no todas las palabras que designan personas tienen una marca de género que el sistema pueda categorizar binariamente."},{"text":"Demostrar los límites de las palabras con género marcado frente a las que no llevan ninguna marca gramatical.","isCorrect":false,"rationale":"Estos términos son neutros, por lo que su función es mostrar precisamente la ausencia de marca de género visible."},{"text":"Facilitar la detección de insultos directos contra colectivos específicos.","isCorrect":false,"rationale":"Estos términos son sustantivos comunes que designan profesiones o roles, no términos ofensivos."},{"text":"Aumentar artificialmente el número de tokens positivos en el corpus.","isCorrect":false,"rationale":"La inclusión de términos neutrales busca precisión metodológica, no alterar los resultados de polaridad."}],"hint":"Considera cómo se comportan estos sustantivos frente a pares como 'jefe/jefa'."},{"question":"¿Qué problema estructural presenta la ironía para los métodos de análisis basados en diccionarios léxicos?","answerOptions":[{"text":"Puede invertir el sentido de un enunciado positivo sin cambiar las palabras utilizadas.","isCorrect":true,"rationale":"La ironía permite que un texto con términos positivos sea una crítica negativa, algo que un simple conteo de palabras no puede detectar."},{"text":"Requiere demasiada memoria RAM para procesar correctamente las oraciones sarcásticas.","isCorrect":false,"rationale":"La ironía es un problema de interpretación semántica y pragmática, no un problema de recursos de hardware."},{"text":"Los diccionarios no pueden contener palabras negativas usadas con intención irónica.","isCorrect":false,"rationale":"El problema no es el contenido del diccionario, sino la incapacidad de entender que el significado se invierte por el contexto."},{"text":"La ironía solo ocurre en textos de prensa formales y nunca en redes sociales como Twitter.","isCorrect":false,"rationale":"La ironía es sumamente frecuente en redes sociales, lo que la convierte en un desafío constante para el PLN."}],"hint":"Reflexiona sobre qué sucede cuando alguien dice algo 'bueno' para significar algo 'malo'."},{"question":"En el análisis comparativo entre 'jefa' y 'jefe', ¿qué fenómeno de sesgo se detecta si ambos exigen rigor pero solo una es llamada 'mandona'?","answerOptions":[{"text":"Una asimetría discursiva donde un mismo comportamiento se evalúa distinto según el género.","isCorrect":true,"rationale":"Este es el ejemplo canónico de sesgo, donde la misma conducta recibe una etiqueta negativa para las mujeres y neutra o positiva para los hombres."},{"text":"Un error en la tokenización de adjetivos calificativos que impide reconocer la forma femenina.","isCorrect":false,"rationale":"El sistema detecta los tokens correctamente; el problema reside en la asimetría de la evaluación social reflejada en el lenguaje."},{"text":"Un sesgo de confirmación por parte del algoritmo de Machine Learning.","isCorrect":false,"rationale":"El ejercicio utiliza reglas definidas de antemano, por lo que el sesgo proviene del texto original, no de un aprendizaje automático sesgado."},{"text":"La invisibilización absoluta del colectivo femenino en el entorno laboral.","isCorrect":false,"rationale":"En este caso no hay invisibilización (la palabra 'jefa' aparece), sino una evaluación peyorativa específica."}],"hint":"Fíjate en cómo cambia la valoración léxica para una misma acción."},{"question":"¿Cuál es la función principal de la técnica KWIC (Key Word In Context) en una auditoría lingüística?","answerOptions":[{"text":"Permitir al analista humano observar las palabras que rodean a un término específico.","isCorrect":true,"rationale":"El KWIC facilita la interpretación cualitativa al mostrar el contexto inmediato (izquierda y derecha) de una palabra de interés."},{"text":"Traducir automáticamente los términos sesgados a un lenguaje inclusivo.","isCorrect":false,"rationale":"El KWIC es una herramienta de visualización y análisis, no de traducción o corrección de textos."},{"text":"Eliminar las Stopwords del corpus para mejorar la velocidad de búsqueda.","isCorrect":false,"rationale":"Aunque se suele aplicar sobre texto limpio, su fin no es eliminar palabras sino mostrar el entorno de una palabra clave."},{"text":"Calcular la polaridad matemática total de un documento completo y ya procesado por el sistema.","isCorrect":false,"rationale":"La polaridad total se calcula con scores agregados; el KWIC se enfoca en la observación local de ocurrencias."}],"hint":"Esta técnica permite ver 'con quién se junta' una palabra en las oraciones."},{"question":"En un análisis de un subcorpus real de Twitter, se calcula para cada texto cuántos términos de género aparecen y cuántos términos valorativos (positivos o negativos) aparecen junto a ellos. ¿Qué significa que la métrica de términos de género sea alta pero el léxico valorativo sea casi nulo?","answerOptions":[{"text":"Que mencionar términos de género no equivale necesariamente a hablar sobre género.","isCorrect":true,"rationale":"En redes sociales, términos como 'chica' o 'chico' suelen usarse como vocativos o en contextos de fandom, sin tematizar problemas de género."},{"text":"Que el código tiene un error y no está detectando los adjetivos correctamente.","isCorrect":false,"rationale":"El código funciona; el resultado refleja que en muchos tweets el género se usa sin adjetivos valorativos del diccionario."},{"text":"Que los usuarios de Twitter siempre utilizan un lenguaje completamente neutral y objetivo.","isCorrect":false,"rationale":"Twitter es un entorno subjetivo, pero la valoración a menudo se transmite mediante emojis o ironía, no mediante el léxico del diccionario."},{"text":"Que el corpus es demasiado grande para que las métricas sean significativas.","isCorrect":false,"rationale":"Incluso en subcorpus pequeños (35 textos), estas discrepancias revelan la diferencia entre presencia léxica y carga discursiva."}],"hint":"Distingue entre la simple aparición de una palabra y el desarrollo de un tema o juicio."},{"question":"¿Por qué es recomendable realizar el análisis de co-ocurrencias sobre tokens o lemas en lugar de sobre el texto crudo?","answerOptions":[{"text":"Para evitar que el ruido de la plataforma (como URLs o símbolos) domine los resultados.","isCorrect":true,"rationale":"El preprocesamiento limpia el texto, permitiendo que las relaciones entre palabras con significado real sean más visibles y menos sesgadas por 'basura' digital."},{"text":"Porque el texto crudo es ilegal procesarlo debido a las políticas de privacidad.","isCorrect":false,"rationale":"El procesamiento de texto crudo es legalmente posible si se tiene acceso al dataset; el motivo de no usarlo es puramente metodológico."},{"text":"Para que el sistema pueda entender automáticamente la intención del sarcasmo del autor.","isCorrect":false,"rationale":"La lematización ayuda a unificar formas de palabras, pero no resuelve el problema de la detección de sarcasmo."},{"text":"Porque las co-ocurrencias solo funcionan si el texto está escrito en mayúsculas.","isCorrect":false,"rationale":"Al contrario, se normaliza a minúsculas para unificar ocurrencias de una misma palabra escrita de formas distintas."}],"hint":"Considera qué pasaría si términos como 'RT' o 'http' aparecieran en tu tabla de resultados."},{"question":"En el experimento con datos de Twitter, ¿qué función cumplen términos como 'sorteo', 'fandom' o 'One Direction' en las co-ocurrencias de género?","answerOptions":[{"text":"Representan el 'ruido' o contexto temático que domina el uso de estos términos en redes sociales.","isCorrect":true,"rationale":"Muestran que en Twitter, el léxico de género suele estar integrado en dinámicas de comunidad y cultura pop, no en debates ideológicos profundos."},{"text":"Indican un alto nivel de discurso político y activismo feminista en las publicaciones analizadas.","isCorrect":false,"rationale":"Estos términos se alejan de lo político y quedan más bien en el ámbito del entretenimiento y la promoción."},{"text":"Son palabras que el sistema debería clasificar siempre como polaridad negativa.","isCorrect":false,"rationale":"Estos términos suelen ser neutrales o positivos en el contexto de las interacciones de los fans."},{"text":"Demuestran que el PLN es capaz de identificar grupos musicales sin necesidad de diccionarios.","isCorrect":false,"rationale":"El sistema los identifica porque co-ocurren con los términos de búsqueda, no porque 'sepa' qué son grupos musicales por sí solo."}],"hint":"Piensa en el tipo de actividades que realizan los usuarios jóvenes en Twitter."},{"question":"¿Cuál es el papel del lingüista computacional frente a los resultados de un prototipo automático de detección de sesgo?","answerOptions":[{"text":"Interpretar críticamente los patrones detectados, ya que el PLN no sustituye a la interpretación.","isCorrect":true,"rationale":"El PLN actúa como apoyo para localizar fenómenos, pero la interpretación cualitativa y la detección de sesgos sutiles dependen del especialista humano."},{"text":"Delegar toda la responsabilidad ética en los resultados estadísticos generados automáticamente por el código.","isCorrect":false,"rationale":"La responsabilidad ética es humana; el código es solo una herramienta transparente que requiere supervisión."},{"text":"Ignorar los resultados del prototipo si estos no coinciden con su intuición personal.","isCorrect":false,"rationale":"El objetivo es usar los datos para informar la intuición y realizar una auditoría basada en evidencias, no descartar datos arbitrariamente."},{"text":"Modificar manualmente los textos originales para que el sistema no encuentre ningún sesgo.","isCorrect":false,"rationale":"La tarea es auditar y detectar el sesgo existente en los textos reales, no ocultarlo mediante la edición del corpus."}],"hint":"El PLN no sustituye la interpretación humana: la apoya, aportando indicios que hay que leer con criterio."}];
  var IM_DATA = {"manual_interactivo":{"header":{"kicker":"Tema 6.","title":"Análisis automático de sesgo léxico y discursivo","subtitle":"Sesgo lingüístico, léxicos transparentes, KWIC, coocurrencias y lectura atenta del discurso","meta":"Material teórico | Programación para PLN | Universidad Pontificia Comillas","narrative":"Auditar sesgos en textos: mirar el lenguaje con lupa computacional y criterio lingüístico."},"sections":[{"id":"contexto-profesional","title":"Contexto profesional","blocks":[],"subsections":[{"id":"encargo-una-auditoria-linguistica-transparente","title":"Encargo: una auditoría lingüística transparente","blocks":[{"type":"p","text":"Imagina que te incorporas como lingüista computacional júnior a **Veridia Text Lab**, una consultora especializada en auditoría lingüística, análisis crítico del discurso y prototipos explicables de PLN para instituciones, medios de comunicación y equipos de comunicación pública. La empresa no vende sistemas que «descubren la verdad» de un texto: su valor profesional consiste en construir herramientas transparentes que ayudan a observar patrones lingüísticos que después interpretan especialistas humanos."},{"type":"p","text":"Veridia recibe un encargo de un consorcio de medios digitales y organizaciones sociales. El cliente quiere revisar titulares, mensajes breves y comentarios procedentes de entornos digitales para detectar indicios de:"},{"type":"ul","items":["lenguaje excluyente;","sesgos de género;","exceso de léxico valorativo;","asociaciones discursivas repetidas alrededor de determinados grupos sociales;","posibles diferencias entre lo que una etiqueta de sentimiento dice y lo que el texto muestra lingüísticamente."]},{"type":"p","text":"El cliente no pide una sentencia automática, sino un primer prototipo de exploración que permita localizar zonas de atención. La diferencia pesa mucho: una herramienta de este tipo no debe declarar que una persona «tuvo intención discriminatoria», ni que un texto «es sesgado» de manera absoluta; debe mostrar indicios observables —palabras, frecuencias, concordancias, coocurrencias y medidas sencillas— que permitan formular preguntas mejores."}]},{"id":"el-caso-de-trabajo","title":"El caso de trabajo","blocks":[{"type":"p","text":"El equipo de Veridia propone una simulación profesional: construir un sistema básico de análisis automático de sesgo léxico y discursivo sobre textos breves en español. El sistema debe ser deliberadamente transparente y no utilizará aprendizaje automático complejo ni modelos generativos, porque en esta fase interesa comprender cómo se operacionaliza una pregunta lingüística, más que maximizar el rendimiento."},{"type":"p","text":"La simulación parte de una idea de fondo:"},{"type":"p","text":"Un sesgo discursivo va más allá de una palabra aislada, pero muchas formas de sesgo dejan huellas en patrones léxicos, asociaciones recurrentes y formas de valoración."},{"type":"p","text":"Por eso el prototipo trabajará con cuatro operaciones principales:"},{"type":"ol","items":["Preparar los textos para que puedan procesarse.","Detectar términos de género y léxico valorativo mediante listas definidas de antemano.","Resumir patrones con tablas, frecuencias y puntuaciones simples.","Explorar contexto mediante KWIC y coocurrencias."]},{"type":"p","text":"Más que actuar como una máquina de clasificación, tu papel consiste en aprender a construir una mirada computacional responsable: saber qué mide el código, qué no mide y por qué la interpretación lingüística sigue siendo imprescindible."}]}],"navTitle":"Contexto profesional"},{"id":"que-vas-a-aprender-en-esta-unidad","title":"Qué vas a aprender en esta unidad","blocks":[{"type":"p","text":"Al finalizar esta unidad, deberías ser capaz de:"},{"type":"ul","items":["explicar qué significa estudiar sesgo lingüístico desde una perspectiva computacional;","distinguir entre sesgo social, sesgo lingüístico, sesgo de datos y sesgo de sistema;","comprender por qué un enfoque basado en reglas definidas de antemano puede ser útil en una auditoría inicial;","preparar textos breves para análisis automático mediante normalización, tokenización, lematización y eliminación de *stopwords*;","construir listas léxicas de términos de género y vocabulario valorativo;","entender cómo funcionan las funciones de detección basadas en pertenencia a listas o diccionarios;","interpretar qué representa una tabla de resultados por documento;","calcular frecuencias globales con `Counter`;","comprender la lógica de una concordancia KWIC;","explicar qué es una coocurrencia y por qué depende de una ventana de contexto;","filtrar un subcorpus temático con expresiones regulares;","trabajar con un corpus real sin olvidar sus límites metodológicos y éticos;","justificar por qué los resultados automáticos deben leerse como indicios, y no como veredictos."]}],"subsections":[],"navTitle":"Qué vas a aprender"},{"id":"mapa-conceptual-de-la-unidad","title":"Mapa conceptual de la unidad","blocks":[{"type":"table","rows":[["**Bloque**","**Pregunta lingüística**","**Operación en Python**","**Resultado esperado**"],["Corpus","¿Qué textos vamos a analizar?","Crear un DataFrame y extraer una columna textual","Una colección organizada de documentos"],["Normalización","¿Qué rasgos conservamos y cuáles eliminamos?","Minúsculas, limpieza con `re.sub`, espacios","Textos más comparables"],["Tokenización","¿Cuáles son las unidades mínimas de análisis?","Separar palabras con regex o spaCy","Listas de *tokens*"],["Lematización","¿Conviene agrupar formas flexionadas?","Usar `lemma_` si hay modelo lingüístico","Formas más generales"],["Léxicos","¿Qué palabras consideramos relevantes?","Crear listas y diccionarios","Repertorios definidos"],["Detección","¿Aparecen esos términos en cada texto?","Comprensiones de listas y búsquedas en diccionarios","Marcas por documento"],["Agregación","¿Qué patrón se observa en el corpus?","`Counter`, DataFrame, ordenación","Frecuencias y resúmenes"],["KWIC","¿En qué contexto aparece una palabra?","Ventana izquierda y derecha","Concordancias"],["Coocurrencias","¿Qué palabras se asocian cerca de un término?","Conteo en ventanas de contexto","Listado de asociaciones"],["Interpretación","¿Qué podemos afirmar con rigor?","Comparar resultados y límites","Informe lingüístico prudente"]],"title":"Mapa conceptual de la unidad: bloques, preguntas lingüísticas y operaciones"},{"type":"image_modal","src":"img/fig_pipeline.svg","alt":"Del corpus a la interpretación crítica: resultado de cada paso","label":"Ver el recorrido completo en una figura","sub":"Diez pasos, del corpus a la interpretación crítica","caption":"Figura elaborada a partir del mapa conceptual de la unidad."}],"subsections":[],"navTitle":"Mapa conceptual"},{"id":"1-marco-teorico","title":"1. Marco teórico","blocks":[],"subsections":[{"id":"1-1-por-que-el-sesgo-linguistico-importa-en-pln","title":"1.1. Por qué el sesgo lingüístico importa en PLN","blocks":[{"type":"p","text":"El procesamiento del lenguaje natural trabaja con datos lingüísticos producidos por personas, instituciones, comunidades y plataformas, y esos datos no son neutrales: contienen hábitos expresivos, desigualdades sociales, convenciones culturales, estereotipos, silencios y formas de representación. Por eso, cuando un sistema computacional aprende o cuenta patrones en textos, opera sobre un lenguaje inscrito en un contexto social, nunca sobre una materia pura."},{"type":"p","text":"La investigación en PLN ha mostrado que los sistemas automáticos pueden reproducir y amplificar asociaciones presentes en los datos. Bolukbasi *et al.* (2016) pusieron en evidencia asociaciones estereotipadas en los *embeddings* distribucionales, y Caliskan *et al.* (2017) demostraron que los modelos entrenados sobre grandes corpus pueden recuperar sesgos humanos medibles. Estos trabajos no significan que todo análisis computacional sea dañino, pero obligan a preguntarse de dónde salen los datos, qué patrones contienen y qué consecuencias tendría automatizar esos patrones."},{"type":"p","text":"Blodgett *et al.* (2020) recuerdan que hablar de «sesgo» en PLN es, además de una cuestión técnica, una cuestión conceptual y normativa: hay que explicar qué comportamiento se considera problemático, para quién, en qué contexto y por qué. Esta idea pesa mucho para estudiantes de lingüística. El código puede contar palabras, comparar listas y construir tablas, pero la definición de lo que cuenta como exclusión, estereotipo o valoración injusta exige conocimiento lingüístico, sociocultural y ético."},{"type":"p","text":"En esta unidad, el análisis de sesgo se entiende como una práctica de observación. El sistema no detecta intenciones psicológicas ni decide si una comunidad «aparece bien» o «aparece mal» en un corpus; hace algo mucho más concreto: localiza formas léxicas, calcula frecuencias, observa contextos y organiza indicios. Esa modestia metodológica es una fortaleza, porque permite que el alumnado vea cada paso y pueda discutirlo."}]},{"id":"1-2-sesgo-social-sesgo-linguistico-sesgo-de-datos-y-sesgo-de","title":"1.2. Sesgo social, sesgo lingüístico, sesgo de datos y sesgo de sistema","blocks":[{"type":"p","text":"Conviene distinguir varios niveles que a menudo se mezclan:"},{"type":"table","rows":[["**Nivel**","**Definición**","**Ejemplo de pregunta**"],["Sesgo social","Desigualdad, estereotipo o jerarquía existente en una comunidad","¿Qué grupos aparecen asociados a autoridad, cuidado, amenaza o incompetencia?"],["Sesgo lingüístico","Forma concreta en que esa desigualdad se manifiesta en palabras, estructuras o marcos discursivos","¿Qué adjetivos se aplican a hombres y mujeres en posiciones de poder?"],["Sesgo de datos","Desequilibrio o patrón problemático dentro del corpus utilizado","¿El corpus representa de forma desigual a ciertos grupos?"],["Sesgo de anotación","Efecto de las decisiones humanas al etiquetar datos","¿Dos anotadores interpretarían igual un comentario irónico?"],["Sesgo de sistema","Resultado problemático producido o amplificado por un modelo o herramienta","¿Un clasificador marca como ofensivo un dialecto o variedad de forma desproporcionada?"]],"title":"Niveles de sesgo"},{"type":"p","text":"Sap *et al.* (2019) mostraron cómo la insensibilidad a la variación dialectal podía generar sesgos en la detección automática de discurso ofensivo. El problema iba más allá de la aparición de palabras «malas»: ciertos rasgos lingüísticos de una comunidad quedaban asociados a la toxicidad por la forma en que se habían anotado y modelado los datos. La enseñanza para esta unidad es clara: un patrón estadístico no equivale automáticamente a una interpretación social correcta."},{"type":"p","text":"También hay que distinguir entre sesgo representacional y sesgo asignativo. Un sesgo representacional afecta a cómo se describe, visibiliza o asocia a un grupo. Un sesgo asignativo afecta a decisiones o recursos: quién recibe una recomendación, una oportunidad o una clasificación favorable. En esta unidad trabajamos sobre todo con sesgo representacional: cómo aparecen ciertas palabras y qué vocabulario se acumula alrededor de determinados términos."}]},{"id":"1-3-del-analisis-critico-del-discurso-al-analisis-asistido-p","title":"1.3. Del análisis crítico del discurso al análisis asistido por corpus","blocks":[{"type":"p","text":"La lingüística de corpus y el análisis crítico del discurso ofrecen una base muy útil para esta unidad. {{cite:baker2006}}Baker (2006){{/cite}} explica que las técnicas de corpus permiten observar regularidades en grandes colecciones de textos: frecuencias, concordancias, colocaciones, palabras clave y patrones de distribución. Baker *et al.* (2008) defienden la utilidad de combinar métodos de corpus con análisis crítico del discurso, porque los conteos ayudan a localizar patrones, pero la interpretación crítica explica su relevancia social."},{"type":"p","text":"Esta combinación es exactamente la que necesita una lingüista computacional. Que una palabra aparezca muchas veces no dice todavía qué significa discursivamente: puede ser una marca de tema, un rasgo de género textual, una repetición banal o un indicio de representación problemática. La frecuencia orienta la mirada, pero no sustituye el análisis."},{"type":"p","text":"En el enfoque asistido por corpus, tres herramientas tienen un peso especial:"},{"type":"table","rows":[["**Herramienta**","**Qué muestra**","**Para qué sirve en análisis de sesgo**"],["Frecuencia","Cuántas veces aparece una forma","Detectar presencia, ausencia o sobrerrepresentación"],["KWIC","Una palabra con su contexto inmediato","Observar cómo se usa una forma en ejemplos concretos"],["Coocurrencia","Palabras que aparecen cerca de otra","Explorar asociaciones recurrentes"]],"title":"Herramientas del análisis asistido por corpus"},{"type":"p","text":"{{cite:mcenery2012}}McEnery y Hardie (2012){{/cite}} insisten en que el corpus debe analizarse con atención a su diseño: tamaño, origen, muestreo, género textual, representatividad y permisos. Esta cautela será importante cuando pasemos de un minicorpus didáctico a un subcorpus real de redes sociales."}]},{"id":"1-4-que-puede-medir-un-enfoque-lexico-y-que-no-puede-medir","title":"1.4. Qué puede medir un enfoque léxico y qué no puede medir","blocks":[{"type":"p","text":"Un enfoque léxico parte de una idea sencilla: si tenemos una lista de palabras relevantes, podemos buscar esas palabras en los textos y contar cuántas aparecen. En análisis de sentimiento, esta lógica se usa desde hace décadas para detectar vocabulario positivo o negativo. {{cite:hu2004}}Hu y Liu (2004){{/cite}} trabajaron con opiniones de clientes y polaridad, y {{cite:liu2012}}Liu (2012){{/cite}} consolidó el análisis de sentimiento y minería de opiniones como un área central del PLN aplicado. {{cite:mohammad2013}}Mohammad y Turney (2013){{/cite}} ampliaron esta tradición con recursos léxicos de emoción y polaridad."},{"type":"p","text":"La ventaja de un enfoque léxico es su transparencia: si el sistema ha marcado una palabra, se puede saber exactamente por qué. Esto es valioso en la docencia y en la auditoría, porque permite revisar el léxico, ampliarlo, eliminar términos problemáticos y explicar el resultado a personas no técnicas."},{"type":"p","text":"La limitación es igual de importante. Una lista no entiende de ironía, negación compleja, presuposiciones, metáforas, cambios de registro ni contexto pragmático. Si un texto dice «qué comentario tan brillante» de forma irónica, una lista puede interpretar *brillante* como positivo aunque el acto comunicativo sea negativo, y si un texto evalúa a una persona sin utilizar palabras del diccionario, el sistema no verá esa valoración. Por eso las medidas léxicas deben leerse como indicadores de superficie, y no como un diagnóstico completo."},{"type":"p","text":"En el análisis de sesgo, esta distinción es esencial. Una palabra como *madre*, *jefe* o *candidata* no es sesgada por sí misma: puede ser una mención neutra, una marca gramatical necesaria o parte de una construcción estereotipada. El análisis computacional ayuda a localizar dónde mirar; la lectura lingüística decide cómo interpretar."}]},{"id":"1-5-genero-representacion-y-sesgo-en-tecnologias-linguistica","title":"1.5. Género, representación y sesgo en tecnologías lingüísticas","blocks":[{"type":"p","text":"El sesgo de género en PLN se ha estudiado en distintos niveles: representación en corpus, asociaciones en *embeddings*, predicciones de modelos, generación automática y evaluación de plantillas. Bolukbasi *et al.* (2016) mostraron asociaciones de género en vectores de palabras; Caliskan *et al.* (2017) relacionaron esos patrones con sesgos humanos más amplios, y Sheng *et al.* (2019) analizaron sesgos en la generación de lenguaje a partir de menciones demográficas."},{"type":"p","text":"En español, el problema presenta rasgos específicos. La lengua tiene género gramatical en sustantivos, adjetivos, determinantes y participios, lo que no convierte toda marca de género en algo socialmente problemático, pero sí obliga a extremar el cuidado en el análisis automático. Palabras como *estudiante* o *deportista* pueden funcionar como comunes en cuanto al género, mientras que formas como *candidato*/*candidata* o *jefe*/*jefa* expresan una alternancia morfológica marcada. Garrido-Muñoz *et al.* (2024) estudian el sesgo de género en modelos de lengua para el español y muestran que su evaluación en esta lengua necesita métodos y recursos adaptados, y no simples traducciones de recursos en inglés."},{"type":"p","text":"Para una lingüista, esto tiene una consecuencia metodológica: no basta con preguntar «¿aparece una palabra masculina o femenina?», hay que mirar funciones discursivas, papeles semánticos, adjetivación, verbos asociados y contexto. Un análisis de listas puede detectar candidatos para revisar, pero no puede resolver por sí solo si existe invisibilización, estereotipo o asimetría de trato."}]},{"id":"1-6-lenguaje-valorativo-polaridad-y-carga-evaluativa","title":"1.6. Lenguaje valorativo, polaridad y carga evaluativa","blocks":[{"type":"p","text":"El léxico valorativo es el conjunto de palabras que expresan evaluación, afecto, juicio o intensidad: adjetivos como *excelente*, *terrible*, *agresivo* o *responsable*; sustantivos como *desastre* o *éxito*; verbos como *amenazar*, *apoyar* o *minimizar*, y expresiones fraseológicas más complejas. En esta unidad se trabaja con una versión simplificada: un diccionario que asigna polaridad positiva o negativa a determinadas palabras."},{"type":"p","text":"La polaridad es una etiqueta técnica (positivo, negativo o neutro), pero la valoración discursiva es más rica: una palabra positiva puede funcionar con ironía; una palabra aparentemente neutra puede adquirir carga negativa por el contexto, y una ausencia puede ser discursivamente significativa. Por eso la polaridad léxica sirve como primer filtro, nunca como interpretación definitiva."},{"type":"p","text":"En entornos de redes sociales esta dificultad aumenta. Los textos son breves, mezclan registros, omiten contexto, usan abreviaturas, emojis, *hashtags* y referencias culturales. Pérez *et al.* (2022), al presentar RoBERTuito para texto de redes sociales en español, muestran que el dominio importa: los textos de redes tienen características distintas de textos periodísticos, académicos o administrativos. Aunque en esta unidad no se entrena un modelo, sí se hereda esa lección: el tipo de corpus condiciona qué significa limpiar, tokenizar e interpretar."}]},{"id":"1-7-preprocesamiento-limpiar-tambien-es-interpretar","title":"1.7. Preprocesamiento: limpiar también es interpretar","blocks":[{"type":"p","text":"En PLN se llama preprocesamiento al conjunto de operaciones que transforman un texto bruto en una representación más manejable para el análisis. Puede incluir:"},{"type":"ul","items":["pasar a minúsculas;","eliminar URLs;","eliminar menciones de usuario;","limpiar *hashtags*;","quitar números;","retirar puntuación;","normalizar espacios;","tokenizar;","lematizar;","eliminar *stopwords*."]},{"type":"p","text":"Estas operaciones parecen técnicas, pero tienen implicaciones lingüísticas. Si se elimina el símbolo # de un *hashtag* y se conserva la palabra, se decide que el contenido léxico importa más que la marca de plataforma. Si se eliminan emojis, se puede perder información afectiva. Si se eliminan menciones de usuario, se protege privacidad y se reduce ruido, pero también se pierde información interactiva. Si se eliminan *stopwords*, se puede mejorar la lectura de coocurrencias, pero también desaparecerán conectores, negaciones o marcas pragmáticas relevantes."},{"type":"p","text":"{{cite:bender2018}}Bender y Friedman (2018){{/cite}} proponen documentar los datos lingüísticos para evitar generalizaciones indebidas, y Gebru *et al.* (2021) defienden las fichas técnicas de conjuntos de datos (*datasheets for datasets*) como práctica de transparencia. En una unidad como esta, esa idea puede trasladarse al aula: cada decisión de limpieza debería poder justificarse con una frase, porque limpiar responde a la decisión de qué parte del texto se quiere analizar, y no a un «hay que limpiar» genérico."}]},{"id":"1-8-tokenizacion-lematizacion-y-stopwords","title":"1.8. Tokenización, lematización y stopwords","blocks":[{"type":"p","text":"La tokenización separa el texto en unidades, que en un análisis sencillo suelen ser palabras. Pero incluso esta operación exige decisiones: ¿qué hacemos con los signos de puntuación?, ¿con los números?, ¿con los *hashtags*?, ¿con los emojis?, ¿con las palabras con tilde?, ¿con las formas compuestas?"},{"type":"p","text":"La lematización reduce una forma flexionada a su lema. Por ejemplo, *candidatas* y *candidata* pueden agruparse bajo una forma común si el analizador lingüístico funciona bien, algo útil en español para no tratar cada flexión como una palabra completamente distinta. Sin embargo, la lematización también puede ocultar información: si el objetivo es estudiar las marcas morfológicas de género, perder la forma superficial puede ser un problema. En esta unidad se acepta ese coste porque el objetivo es didáctico: comparar el funcionamiento de un *pipeline* con spaCy y sin él."},{"type":"p","text":"Las *stopwords* son palabras frecuentes que muchas veces aportan poca información temática: determinantes, preposiciones, conjunciones y algunas formas auxiliares. Eliminarlas puede hacer más legible una tabla de coocurrencias, pero no siempre conviene, porque en el análisis discursivo palabras pequeñas como *no*, *pero* o *aunque* pueden ser centrales. La regla profesional es sencilla: una *stopword* solo es irrelevante para una tarea concreta y bajo una justificación concreta, nunca por naturaleza."}]},{"id":"1-9-expresiones-regulares-como-herramienta-linguistica","title":"1.9. Expresiones regulares como herramienta lingüística","blocks":[{"type":"p","text":"Las expresiones regulares permiten buscar patrones formales en cadenas de texto, y en Python se usan mediante el módulo `re` {{cite:pythonsoftwarefounda2026}}(Python Software Foundation, 2026){{/cite}}. Para lingüistas, una regex puede entenderse como una microgramática de búsqueda: no describe toda la lengua, pero sí una familia de formas que queremos localizar. Por ejemplo, un patrón puede buscar URL, menciones, números o una lista de términos de género. El símbolo `\\b` marca límites de palabra y ayuda a evitar que una búsqueda encuentre una secuencia dentro de otra palabra; el operador `|` funciona como «o», y el prefijo `r` crea una cadena cruda, útil porque así las barras invertidas de una regex no se interpretan como escapes normales de Python."},{"type":"p","text":"Las regex son muy potentes, pero también frágiles, porque capturan formas y no significados. Si buscamos *mujer* y *mujeres*, encontraremos esas formas, pero si el texto habla de género mediante una perífrasis, no aparecerá; si contiene errores ortográficos, abreviaturas o variantes dialectales, el patrón puede fallar. Por eso las regex son excelentes para prototipos transparentes, siempre que se revisen lingüísticamente."}]},{"id":"1-10-kwic-y-coocurrencias-del-conteo-al-contexto","title":"1.10. KWIC y coocurrencias: del conteo al contexto","blocks":[{"type":"p","text":"Una concordancia KWIC (*Key Word In Context*) muestra una palabra clave con algunas palabras a su izquierda y a su derecha. Es una herramienta clásica de corpus porque permite pasar de la frecuencia al uso contextual: si una forma aparece veinte veces, el KWIC permite leer rápidamente en qué entornos lo hace."},{"type":"p","text":"Las coocurrencias cuantifican las palabras que aparecen cerca de una palabra objetivo. Si alrededor de una mención de género aparecen de forma recurrente adjetivos de competencia, emoción, amenaza o autoridad, esa asociación puede orientar una lectura discursiva. Pero la coocurrencia no prueba causalidad ni intención: solo dice que ciertas palabras aparecen cerca bajo una definición concreta de ventana."},{"type":"p","text":"La ventana es una decisión metodológica. Una ventana de dos *tokens* captura contexto muy inmediato; una de ocho *tokens* captura más material, pero también introduce más ruido. En textos breves de redes sociales, una ventana grande puede abarcar casi todo el mensaje. En textos largos, una ventana pequeña puede perder unidades sintácticas completas. Por eso, la ventana debe elegirse pensando en el género textual."}]},{"id":"1-11-datos-reales-redes-sociales-y-responsabilidad","title":"1.11. Datos reales, redes sociales y responsabilidad","blocks":[{"type":"p","text":"Trabajar con datos reales aumenta el valor formativo del análisis, pero también sus riesgos. Un minicorpus didáctico está controlado: permite que el alumnado comprenda el *pipeline* sin depender de descargas, licencias o fenómenos demasiado dispersos. Un corpus real introduce variación, ruido, errores, ambigüedad, desequilibrio y problemas éticos."},{"type":"p","text":"Los datos de redes sociales son muy delicados. Aunque un texto sea técnicamente accesible, puede contener información personal, lenguaje sensible o contextos que se pierden al aislar el mensaje, y la propia plataforma condiciona el lenguaje: abreviaturas, retuits, menciones, *hashtags*, emojis y fórmulas de interacción forman parte del significado. En una auditoría profesional no basta con descargar textos: hay que documentar procedencia, permisos, sesgos de muestreo, periodo temporal, idioma, anonimización y finalidad del análisis."},{"type":"p","text":"En esta unidad, el corpus real se usa como subcorpus manejable y filtrado, una elección que enseña una práctica profesional: en lugar de analizarlo todo indiscriminadamente, se formula una pregunta, se selecciona una muestra y se explican los límites."}]},{"id":"1-12-evaluar-sesgo-no-es-automatizar-juicio-moral","title":"1.12. Evaluar sesgo no es automatizar juicio moral","blocks":[{"type":"p","text":"El punto más importante de este marco teórico es ético y metodológico: detectar patrones no equivale a emitir un juicio moral automático. Gallegos *et al.* (2024) sintetizan la investigación reciente sobre sesgo y equidad en modelos de lenguaje y muestran lo complejo que resulta medir, evaluar y mitigar daños; incluso en sistemas mucho más avanzados que el de esta unidad, la medición del sesgo depende de definiciones, grupos, contextos, métricas y objetivos. Por eso un prototipo transparente de reglas tiene valor pedagógico: obliga a ver qué hace el sistema. Si detecta léxico de género, es porque ese léxico está en una lista; si calcula una puntuación de valoración, es porque se ha asignado +1 o −1 a determinadas palabras, y si muestra coocurrencias, es porque se ha definido una ventana. Nada queda escondido en una caja negra."},{"type":"p","text":"La responsabilidad lingüística consiste en escribir informes con prudencia. En lugar de decir «el texto es sesgado», conviene decir «el texto contiene léxico valorativo asociado a menciones de género» o «en este subcorpus se observan coocurrencias que conviene revisar cualitativamente». Esta diferencia de formulación es una diferencia profesional."}]}],"navTitle":"Marco teórico"},{"id":"2-analisis-automatico-de-sesgo-lexico-y-discursivo-con-pytho","title":"2. Análisis automático de sesgo léxico y discursivo con Python","blocks":[],"subsections":[{"id":"2-1-preparar-el-entorno-de-trabajo","title":"2.1. Preparar el entorno de trabajo","blocks":[{"type":"p","text":"La unidad utiliza un conjunto pequeño de bibliotecas, porque busca un *pipeline* que pueda ejecutarse en un aula y que se comprenda línea a línea, más que un sistema pesado."},{"type":"code","code":"import pandas as pd\nimport re\nfrom collections import Counter, defaultdict"},{"type":"p","text":"`pandas` permite organizar los textos y los resultados en tablas. Para una lingüista, un DataFrame puede entenderse como una hoja de cálculo programable, en la que cada fila representa un texto y cada columna, una propiedad de ese texto."},{"type":"p","text":"`re` permite trabajar con expresiones regulares; en esta unidad se usa para limpiar texto, tokenizar de forma básica y filtrar subcorpus por términos de interés."},{"type":"p","text":"`Counter` sirve para contar los elementos de una lista: si tenemos una lista de *tokens*, devuelve cuántas veces aparece cada uno. `defaultdict` se importa como herramienta de apoyo para estructuras de conteo o agrupación, aunque el núcleo de la unidad puede resolverse principalmente con `Counter`."},{"type":"p","text":"El entorno también intenta cargar spaCy de forma opcional:"},{"type":"code","code":"try:\n    import spacy\n    try:\n        nlp = spacy.load(\"es_core_news_sm\")\n    except Exception:\n        nlp = None\nexcept Exception:\n    spacy = None\n    nlp = None"},{"type":"p","text":"Este bloque enseña una práctica profesional muy útil: escribir código que resista los fallos. Si spaCy y el modelo de español están disponibles, el análisis puede usar la lematización y las *stopwords* del modelo {{cite:explosionai2026}}(Explosion AI, 2026){{/cite}}; si no lo están, el programa no se rompe y activa una alternativa basada en regex y listas de *stopwords*. En el contexto docente, esto evita que una dependencia técnica bloquee la comprensión conceptual."}]},{"id":"2-2-organizar-el-corpus-en-un-dataframe","title":"2.2. Organizar el corpus en un DataFrame","blocks":[{"type":"p","text":"El primer paso de cualquier análisis textual es decidir qué se considera documento. En esta unidad, cada texto breve se trata como un documento. Los documentos se guardan en una lista y después se convierten en una tabla:"},{"type":"code","code":"df = pd.DataFrame({\"text\": corpus})"},{"type":"p","text":"Esta línea crea una tabla con una columna llamada `text`, en la que cada fila contiene un texto. A partir de ese momento, el análisis puede añadir nuevas columnas: *tokens*, términ
