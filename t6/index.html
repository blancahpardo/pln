<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tema 6 — PLN</title>
<style>

:root {
  --azul: #003B5C;
  --azul-d: #00283F;
  --amar: #F4C542;
  --gris: #34484F;
  --claro: #F3F3F4;
  --humo: #9FB1BA;
  --verde: #2E7D32;
  --rojo: #B00020;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: var(--gris); background:#fff; }
a { color: inherit; }

#gate { position:fixed; inset:0; background:var(--azul); display:flex; align-items:center; justify-content:center; padding:24px; z-index:999; }
#gate .box { max-width:380px; width:100%; text-align:center; }
#gate .kicker { color:var(--amar); font-size:12px; font-weight:bold; letter-spacing:2.5px; text-transform:uppercase; margin-bottom:10px; }
#gate h1 { color:#fff; font-size:26px; margin:0 0 10px; }
#gate p { color:var(--humo); font-size:14px; margin:0 0 26px; }
#gate input { width:100%; padding:13px 16px; border-radius:8px; border:none; font-size:15px; font-family:Arial,Helvetica,sans-serif; margin-bottom:14px; outline:2px solid transparent; }
#gate input:focus { outline:2px solid var(--amar); }
#gate button.submit { width:100%; padding:13px 16px; border-radius:8px; border:none; background:var(--amar); color:var(--azul-d); font-size:15px; font-weight:bold; font-family:Arial,Helvetica,sans-serif; cursor:pointer; }
#gate button.submit:hover { filter:brightness(1.06); }
#gate .error { color:#FFB3B3; font-size:13px; margin-top:12px; min-height:18px; }
#page { display:none; }
main { max-width:980px; margin:0 auto; padding:48px 6vw 60px; }
.kicker { color:var(--amar); font-size:12px; font-weight:bold; letter-spacing:2.5px; text-transform:uppercase; margin-bottom:8px; }
.view > h1 { color:var(--azul); font-size:32px; margin:0 0 34px; }
.hub-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; margin-bottom:30px; }
.hub-btn { display:flex; flex-direction:column; align-items:flex-start; gap:6px; background:var(--claro); border:none; border-radius:12px; padding:26px 22px; cursor:pointer; text-align:left; box-shadow:0 2px 10px rgba(159,177,186,.28); font-family:Arial,Helvetica,sans-serif; position:relative; }
.hub-btn:hover { background:#E9ECEE; }
.hub-icon { font-size:30px; margin-bottom:4px; }
.hub-label { font-size:17px; font-weight:bold; color:var(--azul); }
.hub-desc { font-size:12.5px; color:var(--humo); }
.back-home { font-size:13px; color:var(--humo); text-decoration:none; }
.back-home:hover { color:var(--azul); }
.sub-view h2 { color:var(--azul); font-size:24px; margin:18px 0 4px; }
.sub-view .section-note { font-size:13px; color:var(--humo); margin:0 0 24px; }
.back-btn { background:none; border:1.5px solid var(--azul); color:var(--azul); font-size:13px; font-weight:bold; padding:6px 14px; border-radius:20px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.back-btn:hover { background:var(--azul); color:#fff; }
.dl-big { display:inline-block; background:var(--amar); color:var(--azul-d); font-weight:bold; font-size:14px; text-decoration:none; padding:10px 20px; border-radius:20px; margin-bottom:18px; }
.pdf-frame { width:100%; height:78vh; border:none; border-radius:8px; box-shadow:0 2px 10px rgba(159,177,186,.28); }
.img-frame { display:block; width:100%; height:auto; border-radius:8px; box-shadow:0 2px 10px rgba(159,177,186,.28); }
.ref-intro { color:var(--azul); font-size:16px; margin:0 0 16px; }
.ref-item { font-size:13.5px; color:var(--gris); line-height:1.6; margin:0 0 16px; padding-left:28px; text-indent:-28px; }
.ref-item a { color:var(--azul); word-break:break-all; }
.ref-item em { font-style:italic; }
.notice { font-size:12px; color:var(--humo); font-style:italic; margin-top:10px; }
/* quiz */
.quiz-start { background:var(--claro); border-radius:12px; padding:26px; }
.quiz-start p { font-size:14px; margin:0 0 18px; }
.quiz-btn { background:var(--azul); color:#fff; border:none; border-radius:20px; padding:11px 22px; font-size:14px; font-weight:bold; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.quiz-btn:hover { filter:brightness(1.15); }
.quiz-progress { font-size:12px; color:var(--humo); margin-bottom:6px; }
.quiz-q { background:var(--claro); border-radius:12px; padding:24px; margin-bottom:18px; }
.quiz-q h3 { color:var(--azul); font-size:17px; margin:0 0 18px; }
.quiz-opt { display:block; width:100%; text-align:left; background:#fff; border:1.5px solid var(--humo); border-radius:8px; padding:12px 16px; margin-bottom:10px; font-size:14px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; color:var(--gris); }
.quiz-opt:hover { border-color:var(--azul); }
.quiz-opt.correct { border-color:var(--verde); background:#EAF6EB; font-weight:bold; }
.quiz-opt.incorrect { border-color:var(--rojo); background:#FBEAEC; }
.quiz-opt[disabled] { cursor:default; }
.quiz-feedback { font-size:13px; color:var(--gris); background:#fff; border-radius:8px; padding:12px 16px; margin-top:4px; margin-bottom:16px; border-left:3px solid var(--azul); }
.quiz-score { font-size:26px; font-weight:bold; color:var(--azul); margin-bottom:8px; }
.quiz-result { background:var(--claro); border-radius:12px; padding:30px; text-align:center; }
/* interactive manual (prueba) */
.im-root { margin-top:0; }
.im-hero { position:relative; background:linear-gradient(135deg, var(--azul) 0%, var(--azul-d) 100%); border-radius:16px; padding:34px 26px 30px; margin-bottom:22px; overflow:hidden; }
.im-hero::before { content:""; position:absolute; top:-46px; right:-46px; width:190px; height:190px; border-radius:50%; background:rgba(244,197,66,.12); }
.im-hero::after { content:""; position:absolute; bottom:-60px; left:30%; width:160px; height:160px; border-radius:50%; background:rgba(255,255,255,.05); }
.im-hero-dl { position:absolute; top:16px; right:16px; background:var(--amar); color:var(--azul-d); border:none; border-radius:20px; padding:9px 16px; font-size:12px; font-weight:bold; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:6px; font-family:Arial,Helvetica,sans-serif; z-index:1; }
.im-hero-dl:hover { filter:brightness(1.08); }
.im-hero-pill { display:inline-block; background:rgba(255,255,255,.14); color:#fff; font-size:10.5px; font-weight:bold; letter-spacing:1px; text-transform:uppercase; padding:4px 10px; border-radius:20px; margin-bottom:14px; position:relative; z-index:1; }
.im-hero-kicker { color:var(--amar); font-size:12.5px; font-weight:bold; letter-spacing:.4px; margin:0 0 8px; position:relative; z-index:1; }
.im-hero-title { color:#fff; font-size:clamp(21px,3.2vw,30px); line-height:1.28; margin:0; max-width:620px; position:relative; z-index:1; }
.im-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
.im-card { text-align:left; background:var(--claro); border:none; border-radius:12px; padding:20px 20px 18px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; box-shadow:0 2px 10px rgba(159,177,186,.28); transition:transform .12s ease, background .12s ease; opacity:0; transform:translateY(10px); animation:imCardIn .35s ease forwards; }
.im-card:hover { background:#E9ECEE; transform:translateY(-2px); }
.im-card.im-card-bib { background:var(--azul); }
.im-card.im-card-bib .im-card-title, .im-card.im-card-bib .im-card-meta { color:#fff; }
.im-card-icon { font-size:24px; }
.im-card-title { display:block; font-size:16px; font-weight:bold; color:var(--azul); line-height:1.3; margin-top:10px; }
.im-card-meta { display:block; font-size:12px; color:var(--humo); margin-top:6px; }
@keyframes imCardIn { to { opacity:1; transform:translateY(0); } }
.im-rail { display:flex; gap:6px; overflow-x:auto; padding:2px 2px 14px; margin-bottom:18px; border-bottom:1px solid #E3E7E9; }
.im-rail-btn { flex:none; display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; cursor:pointer; padding:6px 9px; border-radius:10px; font-family:Arial,Helvetica,sans-serif; opacity:.5; transition:opacity .15s ease, background .15s ease; }
.im-rail-btn:hover { opacity:.85; }
.im-rail-btn.active { opacity:1; background:var(--claro); }
.im-rail-icon { font-size:16px; }
.im-rail-label { font-size:9.5px; font-weight:bold; color:var(--gris); max-width:62px; text-align:center; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.im-rail-btn.active .im-rail-label { color:var(--azul); }
.im-chapter { animation:imFadeIn .25s ease; }
@keyframes imFadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
.im-crumb { background:none; border:none; color:var(--humo); font-size:13px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; padding:0; margin-bottom:16px; text-decoration:underline; }
.im-crumb:hover { color:var(--azul); }
.im-chapter-title { color:var(--azul); font-size:23px; margin:0 0 16px; }
.im-block-p { font-size:14.5px; line-height:1.7; color:var(--gris); margin:0 0 14px; }
.im-block-ul, .im-block-ol { margin:0 0 14px; padding-left:22px; }
.im-block-ul li, .im-block-ol li { font-size:14.5px; line-height:1.65; color:var(--gris); margin-bottom:6px; }
.im-sub { border-top:1px solid #E3E7E9; }
.im-sub:first-child { border-top:none; }
.im-sub-head { width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; background:none; border:none; text-align:left; padding:16px 4px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.im-sub-head:hover .im-sub-title { color:var(--azul-d); }
.im-sub-title { font-size:15.5px; font-weight:bold; color:var(--azul); }
.im-sub-arrow { color:var(--humo); font-size:13px; transition:transform .15s ease; flex:none; }
.im-sub.open .im-sub-arrow { transform:rotate(90deg); }
.im-sub-body { max-height:0; overflow:hidden; padding:0 4px; transition:max-height .3s ease; }
.im-sub.open .im-sub-body { max-height:none; padding-bottom:14px; }
.im-code-toggle { display:inline-flex; align-items:center; gap:6px; background:#fff; border:1.5px dashed var(--humo); color:var(--azul); font-size:12.5px; font-weight:bold; border-radius:20px; padding:7px 14px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; margin:2px 0 14px; }
.im-code-toggle:hover { border-color:var(--azul); }
.im-code-box { display:none; background:#F2F4F5; border-radius:8px; padding:14px 16px; margin:0 0 14px; overflow-x:auto; animation:imFadeIn .2s ease; }
.im-code-box.open { display:block; }
.im-code-box pre { margin:0; font-family:"Courier New",monospace; font-size:13px; line-height:1.55; color:#1c2a30; white-space:pre-wrap; word-break:break-word; }
.im-table-toggle { display:inline-flex; align-items:center; gap:6px; background:#fff; border:1.5px solid var(--azul); color:var(--azul); font-size:12.5px; font-weight:bold; border-radius:20px; padding:7px 14px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; margin:2px 0 14px; }
.im-table-toggle:hover { background:var(--azul); color:#fff; }
.im-table-bare { overflow-x:auto; margin:0 0 16px; border-radius:8px; box-shadow:0 2px 10px rgba(159,177,186,.28); }
.im-table-bare table, .im-modal table { border-collapse:collapse; width:100%; font-size:13px; }
.im-table-bare th, .im-modal th { background:var(--azul); color:#fff; text-align:left; padding:9px 12px; font-size:12.5px; }
.im-table-bare td, .im-modal td { padding:9px 12px; border-bottom:1px solid #E3E7E9; color:var(--gris); }
.im-table-bare tr:nth-child(even) td, .im-modal tr:nth-child(even) td { background:var(--claro); }
.im-modal-overlay { position:fixed; inset:0; background:rgba(10,20,26,.55); display:flex; align-items:center; justify-content:center; padding:5vh 4vw; z-index:500; animation:imFadeIn .15s ease; }
.im-modal { background:#fff; border-radius:14px; max-width:760px; width:100%; max-height:88vh; display:flex; flex-direction:column; box-shadow:0 12px 40px rgba(0,0,0,.3); }
.im-modal.im-modal-wide { max-width:min(1500px, 96vw); }
.im-modal-body img { display:block; width:100%; border-radius:8px; }
.im-modal-head { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid #E3E7E9; flex:none; }
.im-modal-head h4 { margin:0; color:var(--azul); font-size:15.5px; }
.im-modal-close { background:var(--claro); border:none; width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:14px; color:var(--gris); flex:none; }
.im-modal-close:hover { background:#E3E7E9; }
.im-modal-body { overflow:auto; padding:16px 20px 20px; }
.im-figure { margin:6px 0 20px; }
.im-figure-img { display:block; width:100%; border-radius:10px; box-shadow:0 4px 16px rgba(159,177,186,.35); cursor:zoom-in; }
.im-figure-caption { font-size:12px; color:var(--humo); text-align:center; margin-top:8px; font-style:italic; }
@media (min-width:860px) {
  .im-figure { width:min(1300px, 92vw); margin-left:calc(50% - min(650px, 46vw)); margin-right:calc(50% - min(650px, 46vw)); }
}
.im-errorlist { list-style:none; padding:0; margin:0 0 6px; }
.im-errorlist li { background:var(--claro); border-left:3px solid var(--rojo); border-radius:0 8px 8px 0; padding:12px 16px; margin-bottom:10px; }
.im-errorlist .im-error-term { display:block; font-weight:bold; color:var(--azul); font-size:14px; margin-bottom:4px; }
.im-errorlist .im-error-desc { font-size:13.5px; color:var(--gris); line-height:1.6; }
.im-cite { color:var(--azul); font-weight:bold; cursor:pointer; border-bottom:1.5px dotted var(--azul); white-space:normal; }
.im-cite:hover { color:var(--azul-d); }
.im-cite-pop { display:none; background:var(--azul-d); color:#fff; border-radius:8px; padding:12px 16px; font-size:12.5px; line-height:1.6; margin:6px 0 14px; }
.im-cite-pop.open { display:block; }
.im-cite-pop p { margin:0 0 8px; }
.im-cite-pop p:last-child { margin-bottom:0; }
.im-cite-pop a { color:var(--amar); }
.im-bib-list { margin-top:6px; }
.im-bib-item.im-bib-highlight { background:#FDF1C7; border-radius:8px; padding:10px 14px; margin-left:-14px; margin-right:-14px; }
code.im-inline { background:#F2F4F5; padding:1px 6px; border-radius:4px; font-family:"Courier New",monospace; font-size:.93em; }
/* teacher panel */
.teacher-banner { background:var(--azul-d); color:#fff; border-radius:12px; padding:18px 22px; margin-bottom:24px; }
.teacher-banner strong { color: var(--amar); }
.teacher-banner p { font-size:13px; margin:6px 0 0; color:var(--humo); }
.teacher-token-row { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
.teacher-token-row input { flex:1; min-width:220px; padding:9px 12px; border-radius:8px; border:none; font-size:13px; font-family:Arial,Helvetica,sans-serif; }
.teacher-token-row button { background:var(--amar); color:var(--azul-d); border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:bold; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.teacher-status { font-size:12px; margin-top:10px; min-height:16px; }
.teacher-toggle-list { list-style:none; padding:0; margin:16px 0 0; display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; }
.teacher-toggle-list li { background:rgba(255,255,255,.08); border-radius:8px; padding:10px 14px; display:flex; align-items:center; gap:10px; font-size:13px; }
.teacher-toggle-list input { width:18px; height:18px; }
.hub-btn .teacher-hint { position:absolute; top:10px; right:12px; font-size:10px; font-weight:bold; padding:2px 8px; border-radius:10px; }
.hub-btn .teacher-hint.on { background:#DFF3E0; color:var(--verde); }
.hub-btn .teacher-hint.off { background:#FBEAEC; color:var(--rojo); }
footer { text-align:center; padding:26px 6vw 40px; font-size:11px; color:var(--humo); font-style:italic; }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <div class="kicker">Tema 6</div>
    <h1>PLN</h1>
    <p>Contenido protegido. Introduce la contraseña facilitada en clase.</p>
    <input type="password" id="pw" placeholder="Contraseña" autofocus>
    <button class="submit" id="enter">Acceder</button>
    <div class="error" id="err"></div>
  </div>
</div>

<div id="page">
  <main id="content"></main>
  <footer>
    © Dra. Blanca Hernández Pardo · Programación orientada a PLN · Tema 6<br>Queda prohibida la difusión, distribución o reproducción total o parcial de este material sin autorización expresa de la autora.
  </footer>
</div>

  var QUIZ_MANUAL = [{"question":"Dentro del contexto de Veridia Text Lab, ¿cuál es el objetivo primordial de una auditoría lingüística transparente?","answerOptions":[{"text":"Construir herramientas que ayuden a especialistas humanos a observar patrones lingüísticos interpretables.","isCorrect":true,"rationale":"El valor profesional reside en la transparencia y en proporcionar indicios para que el criterio experto realice la interpretación final."},{"text":"Dictaminar de forma automática si un texto tiene una intención discriminatoria absoluta.","isCorrect":false,"rationale":"Una auditoría lingüística transparente no debe automatizar juicios morales ni declarar intenciones psicológicas."},{"text":"Maximizar el rendimiento predictivo mediante modelos generativos de caja negra.","isCorrect":false,"rationale":"El objetivo en esta fase no es el rendimiento máximo, sino la explicabilidad y comprensión de la operacionalización lingüística."},{"text":"Sustituir el análisis crítico del discurso por una clasificación binaria de sesgo.","isCorrect":false,"rationale":"Este tipo de análisis es asistido por corpus, lo que significa que el conteo orienta la mirada pero no sustituye el análisis crítico."}],"hint":"Considera la relación entre la herramienta computacional y el papel del lingüista experto."},{"question":"¿Cuál es la diferencia principal entre el sesgo representacional y el sesgo asignativo en el ámbito del PLN?","answerOptions":[{"text":"El sesgo representacional afecta a cómo se visibiliza a un grupo, mientras que el asignativo afecta a la distribución de recursos o decisiones.","isCorrect":true,"rationale":"Esta distinción separa la forma en que se describe a las comunidades de las consecuencias prácticas en la asignación de oportunidades."},{"text":"El sesgo representacional es puramente técnico y el asignativo es exclusivamente social, sin ninguna conexión posible entre ambos niveles de análisis lingüístico.","isCorrect":false,"rationale":"Ambos tipos de sesgo tienen dimensiones sociales y técnicas entrelazadas en los sistemas de procesamiento de lenguaje."},{"text":"El sesgo asignativo se detecta con léxicos y el representacional solo con aprendizaje automático.","isCorrect":false,"rationale":"Ambos pueden ser objeto de estudio mediante diversos métodos, incluyendo el análisis léxico y de coocurrencias."},{"text":"No existe diferencia real, son sinónimos utilizados para describir errores de anotación en los datos.","isCorrect":false,"rationale":"Estos dos niveles se distinguen claramente para precisar qué comportamiento problemático se está analizando."}],"hint":"Piensa en la diferencia entre describir un estereotipo y tomar una decisión basada en él."},{"question":"En el preprocesamiento de textos, ¿cuál es una implicación lingüística de eliminar las 'stopwords' en un análisis de sesgo?","answerOptions":[{"text":"Permite que las tablas de coocurrencias sean más legibles al centrarse en palabras con contenido temático.","isCorrect":true,"rationale":"Al retirar palabras funcionales muy frecuentes, los términos con carga léxica relevante ganan visibilidad en los conteos de asociación."},{"text":"Garantiza que el sistema comprenda perfectamente la ironía y el sarcasmo del texto.","isCorrect":false,"rationale":"Las listas de palabras vacías no ayudan a la comprensión pragmática; de hecho, pueden dificultarla al eliminar marcas sutiles."},{"text":"Es una operación neutra que no afecta de ninguna manera a la interpretación discursiva.","isCorrect":false,"rationale":"Toda limpieza es una interpretación; eliminar conectores o negaciones puede borrar marcas pragmáticas esenciales."},{"text":"Es obligatorio para poder aplicar expresiones regulares sobre el corpus antes de cualquier otro análisis.","isCorrect":false,"rationale":"Las expresiones regulares funcionan sobre el texto original; la eliminación de stopwords es una decisión metodológica independiente."}],"hint":"Recuerda el equilibrio entre la limpieza de ruido y la conservación de marcas discursivas."},{"question":"¿Qué función cumple la técnica KWIC (Key Word In Context) en una auditoría lingüística?","answerOptions":[{"text":"Permite pasar de la observación de frecuencias globales al análisis del uso contextual de una palabra.","isCorrect":true,"rationale":"Al mostrar el término con sus palabras adyacentes, ayuda al analista a entender cómo se está empleando realmente la forma detectada."},{"text":"Calcula automáticamente la polaridad positiva o negativa de un documento entero.","isCorrect":false,"rationale":"KWIC es una herramienta de visualización de contexto, no una métrica de clasificación de sentimiento."},{"text":"Normaliza el texto eliminando URLs y menciones de usuario mediante regex.","isCorrect":false,"rationale":"La normalización es un paso previo; KWIC se aplica sobre los tokens resultantes para su exploración cualitativa."},{"text":"Sirve para lematizar automáticamente los verbos irregulares en español antes de construir las tablas.","isCorrect":false,"rationale":"La lematización es una tarea morfológica, mientras que KWIC es una técnica de visualización de concordancias."}],"hint":"Considera qué herramienta permite 'mirar' lo que hay a la izquierda y derecha de un término objetivo."},{"question":"Al construir un léxico valorativo con un 'score' simple (+1, -1), ¿cuál es la principal limitación que se debe reconocer?","answerOptions":[{"text":"Que el sistema no es capaz de captar la ironía, la negación compleja o el contexto pragmático.","isCorrect":true,"rationale":"Una palabra como 'brillante' sumará +1 incluso si se usa de forma sarcástica para criticar una mala decisión."},{"text":"Que las palabras positivas siempre tienen mayor peso estadístico general que las palabras negativas del diccionario.","isCorrect":false,"rationale":"El peso depende de la frecuencia en el corpus, no de una propiedad inherente a la polaridad en este sistema."},{"text":"Que Python no permite sumar valores enteros dentro de una comprensión de listas de este tipo.","isCorrect":false,"rationale":"Python permite realizar estas operaciones aritméticas de forma eficiente; la limitación es conceptual y lingüística."},{"text":"Que es imposible crear diccionarios que contengan tanto claves positivas como negativas.","isCorrect":false,"rationale":"El uso de diccionarios y el método `.update()` permite integrar múltiples listas de polaridad en una sola estructura."}],"hint":"Reflexiona sobre lo que sucede cuando alguien dice '¡Qué inteligente eres!' para burlarse."},{"question":"¿Por qué es importante el uso de `\\b` en las expresiones regulares utilizadas para detectar términos de género?","answerOptions":[{"text":"Para evitar que se detecten secuencias de letras dentro de palabras más largas (como 'mujer' en 'mujeriego').","isCorrect":true,"rationale":"El marcador `\\b` indica un límite de palabra, asegurando que el patrón coincida solo con palabras completas y aisladas."},{"text":"Para asegurar que la búsqueda ignore las mayúsculas y minúsculas automáticamente.","isCorrect":false,"rationale":"La ignorancia de mayúsculas se gestiona con `re.IGNORECASE`, no con el marcador de límite de palabra."},{"text":"Para eliminar automáticamente los espacios en blanco sobrantes al final de la frase.","isCorrect":false,"rationale":"La eliminación de espacios se realiza generalmente con `.strip()` o sustituciones de espacios repetidos con `\\s+`."},{"text":"Para indicar que el patrón debe buscarse únicamente al principio del documento y no en el resto del texto.","isCorrect":false,"rationale":"El ancla para el inicio de una cadena suele ser `^`, mientras que `\\b` se refiere a cualquier límite de palabra en el texto."}],"hint":"Imagina que buscas la palabra 'sol' y el sistema te devuelve también 'soldado' y 'soledad'."},{"question":"En un análisis de corpus que localiza qué palabras aparecen cerca de un término objetivo dentro de una ventana de palabras definida, ¿qué representa una 'coocurrencia'?","answerOptions":[{"text":"La aparición recurrente de ciertas palabras en la vecindad de un término objetivo dentro de una ventana definida.","isCorrect":true,"rationale":"Cuantifica qué términos aparecen cerca del objetivo, sugiriendo marcos discursivos o asociaciones de ideas."},{"text":"La frecuencia total de una palabra en todo el corpus analizado, sin distinguir su posición ni las palabras que la rodean.","isCorrect":false,"rationale":"La frecuencia total es un conteo absoluto; la coocurrencia es una medida de asociación relativa a otro término."},{"text":"El error que ocurre cuando dos procesos de Python intentan acceder al mismo archivo de texto.","isCorrect":false,"rationale":"Ese es un problema de concurrencia informática, no un concepto de lingüística de corpus."},{"text":"La coincidencia exacta entre la etiqueta de sentimiento original y el resultado del análisis léxico.","isCorrect":false,"rationale":"Esa coincidencia sería una medida de acuerdo o precisión, no una coocurrencia lingüística."}],"hint":"Se relaciona con la idea de que 'conocerás a una palabra por la compañía que mantiene'."},{"question":"Al interpretar resultados automáticos sobre sesgo lingüístico, ¿qué precaución debe tener una lingüista antes de redactar sus conclusiones?","answerOptions":[{"text":"Evitar afirmaciones concluyentes como 'el algoritmo demuestra que el texto es sexista'.","isCorrect":true,"rationale":"La responsabilidad profesional exige prudencia y presentar los resultados como indicios observables, no como veredictos morales."},{"text":"Asegurarse de que el sistema clasifique al menos el 90% de los textos como problemáticos.","isCorrect":false,"rationale":"El objetivo es la observación objetiva de patrones, no alcanzar una cuota de detección predeterminada."},{"text":"Ignorar el contexto original una vez que se han obtenido las tablas de resultados.","isCorrect":false,"rationale":"Volver al texto original es fundamental para validar si el patrón detectado tiene relevancia discursiva real."},{"text":"Confiar plenamente en que los datos de redes sociales son neutrales y representativos.","isCorrect":false,"rationale":"Los datos de redes sociales contienen ruido, sesgos de muestreo y problemas éticos que deben documentarse."}],"hint":"Piensa en cómo formular un informe que sea científicamente riguroso y éticamente responsable."},{"question":"¿Cuál es la función del bloque `try...except` al cargar spaCy en el entorno de trabajo?","answerOptions":[{"text":"Garantizar que el código siga funcionando incluso si la librería o el modelo de idioma no están instalados.","isCorrect":true,"rationale":"Permite que el pipeline use alternativas (como tokenización por regex) si el entorno no dispone de spaCy, evitando que el programa se detenga."},{"text":"Optimizar la velocidad de procesamiento de las expresiones regulares.","isCorrect":false,"rationale":"La velocidad de las regex no depende de la carga exitosa o fallida de modelos lingüísticos externos como spaCy."},{"text":"Detectar automáticamente el idioma del texto antes de normalizarlo y aplicar el modelo correspondiente.","isCorrect":false,"rationale":"La detección de idioma es una tarea distinta; este bloque gestiona la disponibilidad de recursos técnicos específicos."},{"text":"Eliminar de forma segura las filas del DataFrame que contienen valores nulos.","isCorrect":false,"rationale":"La gestión de valores nulos en pandas se realiza con métodos como `.dropna()`, no mediante la carga condicional de librerías."}],"hint":"Es una práctica de programación profesional relacionada con la portabilidad del código."},{"question":"Si un análisis de lematización convierte 'candidatas' y 'candidata' en el lema único 'candidata', ¿qué riesgo lingüístico se asume en un estudio de género?","answerOptions":[{"text":"Que se pierda información valiosa sobre las marcas morfológicas superficiales de género y número.","isCorrect":true,"rationale":"Al reducir las formas a un lema común (a menudo el masculino o la forma singular), se puede invisibilizar la distinción de género que se pretendía estudiar."},{"text":"Que el sistema tarde demasiado tiempo en procesar cada documento del corpus que se está analizando.","isCorrect":false,"rationale":"La lematización es rápida; el riesgo real es la pérdida de información morfológica específica."},{"text":"Que las expresiones regulares dejen de funcionar sobre el texto original.","isCorrect":false,"rationale":"La lematización crea una nueva representación; el texto original suele conservarse en otra columna del DataFrame."},{"text":"Que las palabras resultantes sean imposibles de contar con la herramienta `Counter`.","isCorrect":false,"rationale":"`Counter` funciona con cualquier lista de elementos, sean formas originales o lemas."}],"hint":"Considera qué sucede con la distinción entre masculino y femenino cuando todo se reduce a la raíz o lema."}];
  var QUIZ_CUADERNO = [{"question":"¿Cómo se manifiesta el sesgo lingüístico desde una perspectiva computacional en el procesamiento del lenguaje natural (PLN)?","answerOptions":[{"text":"A través de la identificación de patrones léxicos y frecuencias sistemáticas.","isCorrect":true,"rationale":"Desde el punto de vista del PLN, el sesgo se aborda identificando recurrencias en el uso de palabras y frecuencias de aparición."},{"text":"Mediante la detección automática de la intención maliciosa del autor.","isCorrect":false,"rationale":"El PLN no detecta la intención del autor directamente, sino que analiza las huellas léxicas dejadas en el texto."},{"text":"Únicamente mediante la corrección de errores gramaticales y sintácticos.","isCorrect":false,"rationale":"La corrección gramatical es una tarea de PLN, pero no define por sí misma el análisis de sesgo léxico o discursivo."},{"text":"Como una alucinación producida exclusivamente por modelos de inteligencia artificial generativa.","isCorrect":false,"rationale":"El sesgo puede analizarse mediante reglas definidas de antemano, sin necesidad de usar inteligencia artificial generativa."}],"hint":"Recuerda que el análisis se centra en lo que es medible a través de los términos utilizados en el corpus."},{"question":"En el contexto de la normalización de texto, ¿por qué se afirma que esta etapa no es 'neutra'?","answerOptions":[{"text":"Porque cada decisión de limpieza implica una hipótesis sobre qué información es relevante.","isCorrect":true,"rationale":"Decidir qué eliminar (como URLs o menciones) supone una interpretación previa sobre qué elementos aportan significado al análisis del sesgo."},{"text":"Porque requiere el uso obligatorio de modelos de Machine Learning muy complejos y costosos.","isCorrect":false,"rationale":"La normalización se basa en reglas, pero su falta de neutralidad reside en la toma de decisiones lingüísticas, no en la complejidad técnica."},{"text":"Porque el proceso de convertir a minúsculas altera el significado léxico de las palabras.","isCorrect":false,"rationale":"Aunque las mayúsculas pueden dar énfasis, la normalización a minúsculas es un paso técnico estándar para unificar tokens."},{"text":"Porque la eliminación de números impide realizar recuentos de frecuencia precisos.","isCorrect":false,"rationale":"La eliminación de números busca reducir el ruido, pero no es la razón principal por la cual la normalización se considera una decisión teórica."}],"hint":"Piensa en el impacto de descartar ciertos elementos del texto antes del análisis."},{"question":"Al trabajar con listas léxicas de género, ¿cuál es el objetivo de incluir términos como 'estudiante' o 'deportista'?","answerOptions":[{"text":"Servir como contraste para identificar términos neutrales y demostrar límites del sistema.","isCorrect":true,"rationale":"Se utilizan para mostrar que no todas las palabras que designan personas tienen una marca de género que el sistema pueda categorizar binariamente."},{"text":"Demostrar los límites de las palabras con género marcado frente a las que no llevan ninguna marca gramatical.","isCorrect":false,"rationale":"Estos términos son neutros, por lo que su función es mostrar precisamente la ausencia de marca de género visible."},{"text":"Facilitar la detección de insultos directos contra colectivos específicos.","isCorrect":false,"rationale":"Estos términos son sustantivos comunes que designan profesiones o roles, no términos ofensivos."},{"text":"Aumentar artificialmente el número de tokens positivos en el corpus.","isCorrect":false,"rationale":"La inclusión de términos neutrales busca precisión metodológica, no alterar los resultados de polaridad."}],"hint":"Considera cómo se comportan estos sustantivos frente a pares como 'jefe/jefa'."},{"question":"¿Qué problema estructural presenta la ironía para los métodos de análisis basados en diccionarios léxicos?","answerOptions":[{"text":"Puede invertir el sentido de un enunciado positivo sin cambiar las palabras utilizadas.","isCorrect":true,"rationale":"La ironía permite que un texto con términos positivos sea una crítica negativa, algo que un simple conteo de palabras no puede detectar."},{"text":"Requiere demasiada memoria RAM para procesar correctamente las oraciones sarcásticas.","isCorrect":false,"rationale":"La ironía es un problema de interpretación semántica y pragmática, no un problema de recursos de hardware."},{"text":"Los diccionarios no pueden contener palabras negativas usadas con intención irónica.","isCorrect":false,"rationale":"El problema no es el contenido del diccionario, sino la incapacidad de entender que el significado se invierte por el contexto."},{"text":"La ironía solo ocurre en textos de prensa formales y nunca en redes sociales como Twitter.","isCorrect":false,"rationale":"La ironía es sumamente frecuente en redes sociales, lo que la convierte en un desafío constante para el PLN."}],"hint":"Reflexiona sobre qué sucede cuando alguien dice algo 'bueno' para significar algo 'malo'."},{"question":"En el análisis comparativo entre 'jefa' y 'jefe', ¿qué fenómeno de sesgo se detecta si ambos exigen rigor pero solo una es llamada 'mandona'?","answerOptions":[{"text":"Una asimetría discursiva donde un mismo comportamiento se evalúa distinto según el género.","isCorrect":true,"rationale":"Este es el ejemplo canónico de sesgo, donde la misma conducta recibe una etiqueta negativa para las mujeres y neutra o positiva para los hombres."},{"text":"Un error en la tokenización de adjetivos calificativos que impide reconocer la forma femenina.","isCorrect":false,"rationale":"El sistema detecta los tokens correctamente; el problema reside en la asimetría de la evaluación social reflejada en el lenguaje."},{"text":"Un sesgo de confirmación por parte del algoritmo de Machine Learning.","isCorrect":false,"rationale":"El ejercicio utiliza reglas definidas de antemano, por lo que el sesgo proviene del texto original, no de un aprendizaje automático sesgado."},{"text":" ontextos de fandom, sin tematizar problemas de género."},{"text":"Que el código tiene un error y no está detectando los adjetivos correctamente.","isCorrect":false,"rationale":"El código funciona; el resultado refleja que en muchos tweets el género se usa sin adjetivos valorativos del diccionario."},{"text":"Que los usuarios de Twitter siempre utilizan un lenguaje completamente neutral y objetivo.","isCorrect":false,"rationale":"Twitter es un entorno subjetivo, pero la valoración a menudo se transmite mediante emojis o ironía, no mediante el léxico del diccionario."},{"text":"Que el corpus es demasiado grande para que las métricas sean significativas.","isCorrect":false,"rationale":"Incluso en subcorpus pequeños (35 textos), estas discrepancias revelan la diferencia entre presencia léxica y carga discursiva."}],"hint":"Distingue entre la simple aparición de una palabra y el desarrollo de un tema o juicio."},{"question":"¿Por qué es recomendable realizar el análisis de co-ocurrencias sobre tokens o lemas en lugar de sobre el texto crudo?","answerOptions":[{"text":"Para evitar que el ruido de la plataforma (como URLs o símbolos) domine los resultados.","isCorrect":true,"rationale":"El preprocesamiento limpia el texto, permitiendo que las relaciones entre palabras con significado real sean más visibles y menos sesgadas por 'basura' digital."},{"text":"Porque el texto crudo es ilegal procesarlo debido a las políticas de privacidad.","isCorrect":false,"rationale":"El procesamiento de texto crudo es legalmente posible si se tiene acceso al dataset; el motivo de no usarlo es puramente metodológico."},{"text":"Para que el sistema pueda entender automáticamente la intención del sarcasmo del autor.","isCorrect":false,"rationale":"La lematización ayuda a unificar formas de palabras, pero no resuelve el problema de la detección de sarcasmo."},{"text":"Porque las co-ocurrencias solo funcionan si el texto está escrito en mayúsculas.","isCorrect":false,"rationale":"Al contrario, se normaliza a minúsculas para unificar ocurrencias de una misma palabra escrita de formas distintas."}],"hint":"Considera qué pasaría si términos como 'RT' o 'http' aparecieran en tu tabla de resultados."},{"question":"En el experimento con datos de Twitter, ¿qué función cumplen términos como 'sorteo', 'fandom' o 'One Direction' en las co-ocurrencias de género?","answerOptions":[{"text":"Representan el 'ruido' o contexto temático que domina el uso de estos términos en redes sociales.","isCorrect":true,"rationale":"Muestran que en Twitter, el léxico de género suele estar integrado en dinámicas de comunidad y cultura pop, no en debates ideológicos profundos."},{"text":"Indican un alto nivel de discurso político y activismo feminista en las publicaciones analizadas.","isCorrect":false,"rationale":"Estos términos se alejan de lo político y quedan más bien en el ámbito del entretenimiento y la promoción."},{"text":"Son palabras que el sistema debería clasificar siempre como polaridad negativa.","isCorrect":false,"rationale":"Estos términos suelen ser neutrales o positivos en el contexto de las interacciones de los fans."},{"text":"Demuestran que el PLN es capaz de identificar grupos musicales sin necesidad de diccionarios.","isCorrect":false,"rationale":"El sistema los identifica porque co-ocurren con los términos de búsqueda, no porque 'sepa' qué son grupos musicales por sí solo."}],"hint":"Piensa en el tipo de actividades que realizan los usuarios jóvenes en Twitter."},{"question":"¿Cuál es el papel del lingüista computacional frente a los resultados de un prototipo automático de detección de sesgo?","answerOptions":[{"text":"Interpretar críticamente los patrones detectados, ya que el PLN no sustituye a la interpretación.","isCorrect":true,"rationale":"El PLN actúa como apoyo para localizar fenómenos, pero la interpretación cualitativa y la detección de sesgos sutiles dependen del especialista humano."},{"text":"Delegar toda la responsabilidad ética en los resultados estadísticos generados automáticamente por el código.","isCorrect":false,"rationale":"La responsabilidad ética es humana; el código es solo una herramienta transparente que requiere supervisión."},{"text":"Ignorar los resultados del prototipo si estos no coinciden con su intuición personal.","isCorrect":false,"rationale":"El objetivo es usar los datos para informar la intuición y realizar una auditoría basada en evidencias, no descartar datos arbitrariamente."},{"text":"Modificar manualmente los textos originales para que el sistema no encuentre ningún sesgo.","isCorrect":false,"rationale":"La tarea es auditar y detectar el sesgo existente en los textos reales, no ocultarlo mediante la edición del corpus."}],"hint":"El PLN no sustituye la interpretación humana: la apoya, aportando indicios que hay que leer con criterio."}];

  function sha256Hex(text) {
    var enc = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", enc).then(function(buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function(b) {
        return b.toString(16).padStart(2, "0");
      }).join("");
    });
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

          buttons.forEach(function(b2, j) { if (opts[j].isCorrect) b2.classList.add("correct"); });
        }
        var fb = document.getElementById("quiz-feedback");
        fb.hidden = false;
        fb.textContent = chosen.rationale || (chosen.isCorrect ? "Correcto." : "Incorrecto.");
        var next = document.createElement("button");
        next.className = "quiz-btn";
        next.style.marginTop = "14px";
        next.textContent = quizState.index + 1 < total ? "Siguiente" : "Ver puntuación";
        next.addEventListener("click", function() { quizState.index++; renderQuizQuestion(); });
        root.querySelector(".quiz-q").appendChild(next);
      });
    });
  }

  // ---- Interactive manual engine (self-contained mini-app rendered lazily into #im-root-<key>) ----
  var IM_ICONS = {
    "Contexto profesional": "💼", "Qué vas a aprender": "🎯", "Mapa conceptual": "🗺️",
    "Marco teórico": "📚", "Python para PLN": "🐍", "Errores frecuentes": "⚠️",
    "Síntesis": "✅", "Cierre narrativo": "🎬"
  };
  function imEsc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function imFormatBackticks(s) {
    var parts = s.split("`"), out = "";
    for (var i = 0; i < parts.length; i++) out += (i % 2 === 1) ? '<code class="im-inline">' + imEsc(parts[i]) + "</code>" : imEsc(parts[i]);
    return out;
  }
  function imFormatInline(raw) {
    var re = /{{cite:([^}]*)}}([\s\S]*?){{\/cite}}/g;
    var out = "", last = 0, m;
    while ((m = re.exec(raw))) {
      out += imFormatBackticks(raw.slice(last, m.index));
      out += '<span class="im-cite" data-refs="' + m[1] + '">' + imFormatBackticks(m[2]) + ' <span aria-hidden="true">ⓘ</span></span>';
      last = re.lastIndex;
    }
    out += imFormatBackticks(raw.slice(last));
    return out;
  }
  function imLinkify(text) {
    var re = /(https?:\/\/[^\s]+)/g;
    var out = "", last = 0, m;
    while ((m = re.exec(text))) {
      out += imEsc(text.slice(last, m.index));
      var url = m[1].replace(/[.,;]+$/, "");
      out += '<a href="' + imEsc(url) + '" target="_blank" rel="noopener">' + imEsc(url) + "</a>";
      last = m.index + url.length;
    }
    out += imEsc(text.slice(last));
    return out;
  }
  function imBibText(text) {
    // *word* marks an APA-italicized container title (book/journal name+volume/etc.)
    return text.split(/(\*[^*]+\*)/g).map(function(part) {
      if (part.charAt(0) === "*" && part.charAt(part.length - 1) === "*" && part.length > 1) {
        return "<em>" + imLinkify(part.slice(1, -1)) + "</em>";
      }
      return imLinkify(part);
    }).join("");
  }
  function imRefLookup(data) {
    var m = {};
    data.references.forEach(function(r) { m[r.key] = r.text; });
    return m;
  }
  function imOpenModal(title, bodyHtml, wide) {
    var overlay = document.createElement("div");
    overlay.className = "im-modal-overlay";
    overlay.innerHTML = '<div class="im-modal' + (wide ? " im-modal-wide" : "") + '"><div class="im-modal-head"><h4>' + imEsc(title) +
      '</h4><button class="im-modal-close" aria-label="Cerrar">✕</button></div><div class="im-modal-body">' + bodyHtml + "</div></div>";
    document.body.appendChild(overlay);
    function close() { overlay.remove(); document.removeEventListener("keydown", onKey); }
    overlay.addEventListener("click", function(e) { if (e.target === overlay) close(); });
    overlay.querySelector(".im-modal-close").addEventListener("click", close);
    function onKey(e) { if (e.key === "Escape") close(); }
    document.addEventListener("keydown", onKey);
  }
  function imTableHtml(b) {
    var head = b.rows[0], body = b.rows.slice(1);
    return "<table><thead><tr>" + head.map(function(h) { return "<th>" + imEsc(h) + "</th>"; }).join("") + "</tr></thead><tbody>" +
      body.map(function(r) { return "<tr>" + r.map(function(c) { return "<td>" + imEsc(c) + "</td>"; }).join("") + "</tr>"; }).join("") +
      "</tbody></table>";
  }
  function imRenderTable(b, key, bare) {
    var t = imTableHtml(b);
    if (bare) return '<div class="im-table-bare">' + t + "</div>";
    var title = b.title || "Tabla";
    return '<button class="im-table-toggle" data-im-table="' + key + '" data-im-table-title="' + imEsc(title) + '">▤ Ver tabla: ' + imEsc(title) + "</button>" +
      '<template data-im-table-src="' + key + '">' + t + "</template>";
  }
  function imRenderBlocks(blocks, keyPrefix) {
    var html = "";
    var bareTable = blocks.length === 1 && blocks[0].type === "table";
    blocks.forEach(function(b, i) {
      var key = keyPrefix + "-" + i;
      if (b.type === "p") html += '<p class="im-block-p">' + imFormatInline(b.text) + "</p>";
      else if (b.type === "ul") html += '<ul class="im-block-ul">' + b.items.map(function(t) { return "<li>" + imFormatInline(t) + "</li>"; }).join("") + "</ul>";
      else if (b.type === "ol") html += '<ol class="im-block-ol">' + b.items.map(function(t) { return "<li>" + imFormatInline(t) + "</li>"; }).join("") + "</ol>";
      else if (b.type === "code") html += '<button class="im-code-toggle" data-im-code="' + key + '">🔎 Descubre el código</button>' +
        '<div class="im-code-box" id="im-code-' + key + '"><pre>' + imEsc(b.code) + "</pre></div>";
      else if (b.type === "table") html += imRenderTable(b, key, bareTable);
      else if (b.type === "image") html += '<figure class="im-figure"><img class="im-figure-img" src="' + imEsc(b.src) + '" alt="' + imEsc(b.alt || "") + '">' +
        (b.caption ? '<figcaption class="im-figure-caption">' + imFormatInline(b.caption) + "</figcaption>" : "") + "</figure>";
      else if (b.type === "errorlist") html += '<ul class="im-errorlist">' + b.items.map(function(it) {
        return '<li><span class="im-error-term">' + imFormatInline(it.term) + '</span><span class="im-error-desc">' + imFormatInline(it.desc) + "</span></li>";
      }).join("") + "</ul>";
    });
    return html;
  }
  function imWireCommon(root, data) {
    root.querySelectorAll(".im-figure-img").forEach(function(img) {
      img.addEventListener("click", function() {
        imOpenModal(img.alt || "Infografía", '<img src="' + img.src + '" alt="' + img.alt.replace(/"/g, "&quot;") + '">', true);
      });
    });
    root.querySelectorAll("[data-im-code]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var box = document.getElementById("im-code-" + btn.dataset.imCode);
        var open = box.classList.toggle("open");
        btn.textContent = open ? "🔽 Ocultar el código" : "🔎 Descubre el código";
      });
    });
    root.querySelectorAll("[data-im-table]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var tpl = root.querySelector('[data-im-table-src="' + btn.dataset.imTable + '"]');
        if (tpl) imOpenModal(btn.dataset.imTableTitle, tpl.innerHTML);
      });
    });
    root.querySelectorAll(".im-cite").forEach(function(span) {
      span.addEventListener("click", function() {
        var existing = span.nextElementSibling;
        if (existing && existing.classList && existing.classList.contains("im-cite-pop")) {
          existing.classList.toggle("open");
          return;
        }
        var refs = imRefLookup(data);
        var keys = span.dataset.refs.split(",");
        var pop = document.createElement("div");
        pop.className = "im-cite-pop open";
        pop.innerHTML = keys.map(function(k) { return "<p>" + imBibText(refs[k] || k) + "</p>"; }).join("") +
          '<p><a href="#" data-im-goto-bib="' + keys[0] + '">Ver en Bibliografía →</a></p>';
        span.parentNode.insertBefore(pop, span.nextSibling);
        pop.querySelector("[data-im-goto-bib]").addEventListener("click", function(e) {
          e.preventDefault();
          imShowBib(root, data, this.dataset.imGotoBib);
        });
      });
    });
  }
  function imRailHtml(data, activeIdx) {
    var items = '<button class="im-rail-btn" data-im-rail-home="1"><span class="im-rail-icon">🏠</span><span class="im-rail-label">Índice</span></button>';
    items += data.sections.map(function(sec, i) {
      var icon = IM_ICONS[sec.navTitle] || "📖";
      return '<button class="im-rail-btn' + (activeIdx === i ? " active" : "") + '" data-im-rail-chapter="' + i + '">' +
        '<span class="im-rail-icon">' + icon + '</span><span class="im-rail-label">' + imEsc(sec.navTitle) + "</span></button>";
    }).join("");
    items += '<button class="im-rail-btn' + (activeIdx === "bib" ? " active" : "") + '" data-im-rail-bib="1">' +
      '<span class="im-rail-icon">📖</span><span class="im-rail-label">Bibliografía</span></button>';
    return '<div class="im-rail">' + items + "</div>";
  }
  function imWireRail(root, data) {
    var homeBtn = root.querySelector("[data-im-rail-home]");
    if (homeBtn) homeBtn.addEventListener("click", function() { imShowIndex(root, data); });
    root.querySelectorAll("[data-im-rail-chapter]").forEach(function(btn) {
      btn.addEventListener("click", function() { imShowChapter(root, data, parseInt(btn.dataset.imRailChapter, 10)); });
    });
    var railBib = root.querySelector("[data-im-rail-bib]");
    if (railBib) railBib.addEventListener("click", function() { imShowBib(root, data, null); });
  }
  function imShowBib(root, data, highlightKey) {
    var html = imRailHtml(data, "bib");
    html += '<div class="im-chapter"><h3 class="im-chapter-title">📖 Bibliografía</h3>';
    html += '<h4 class="ref-intro">Referencias en formato APA (7ª edición)</h4>';
    html += '<div class="im-bib-list">' + data.references.map(function(r) {
      var cls = "ref-item im-bib-item" + (r.key === highlightKey ? " im-bib-highlight" : "");
      return '<p class="' + cls + '" id="im-bib-' + r.key + '">' + imBibText(r.text) + "</p>";
    }).join("") + "</div></div>";
    root.innerHTML = html;
    imWireRail(root, data);
    if (highlightKey) {
      var el = document.getElementById("im-bib-" + highlightKey);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }
  function imShowChapter(root, data, idx) {
    var sec = data.sections[idx];
    var icon = IM_ICONS[sec.navTitle] || "📖";
    var html = imRailHtml(data, idx);
    html += '<div class="im-chapter"><h3 class="im-chapter-title">' + icon + " " + imEsc(sec.title) + "</h3>";
    html += imRenderBlocks(sec.blocks, idx + "-i");
    sec.subsections.forEach(function(sub, j) {
      html += '<div class="im-sub" data-im-sub="' + j + '">' +
        '<button class="im-sub-head"><span class="im-sub-title">' + imEsc(sub.title) + '</span><span class="im-sub-arrow">▶</span></button>' +
        '<div class="im-sub-body">' + imRenderBlocks(sub.blocks, idx + "-" + j) + "</div></div>";
    });
    html += "</div>";
    root.innerHTML = html;
    imWireCommon(root, data);
    imWireRail(root, data);
    root.querySelectorAll(".im-sub-head").forEach(function(head) {
      head.addEventListener("click", function() {
        var thisSub = head.parentElement;
        var wasOpen = thisSub.classList.contains("open");
        root.querySelectorAll(".im-sub.open").forEach(function(s) { s.classList.remove("open"); });
        if (!wasOpen) thisSub.classList.add("open");
      });
    });
  }
  function imShowIndex(root, data) {
    var pdf = root.dataset.pdf;
    var cards = data.sections.map(function(sec, i) {
      var icon = IM_ICONS[sec.navTitle] || "📖";
      return '<button class="im-card" data-im-chapter="' + i + '" style="animation-delay:' + (i * 0.04) + 's">' +
        '<span class="im-card-icon">' + icon + '</span>' +
        '<span class="im-card-title">' + imEsc(sec.navTitle) + "</span>" +
        (sec.subsections.length ? '<span class="im-card-meta">' + sec.subsections.length + " apartados</span>" : "") +
        "</button>";
    }).join("");
    var bibCard = '<button class="im-card im-card-bib" data-im-bib="1" style="animation-delay:' + (data.sections.length * 0.04) + 's">' +
      '<span class="im-card-icon">📖</span><span class="im-card-title">Bibliografía</span>' +
      '<span class="im-card-meta">' + data.references.length + ' referencias en APA 7ª ed.</span></button>';
    var hero = '<div class="im-hero">' +
      (pdf ? '<a class="im-hero-dl" href="' + imEsc(pdf) + '" download>⬇ Descargar manual en PDF</a>' : "") +
      '<div class="im-hero-pill">Versión interactiva · prueba</div>' +
      '<div class="im-hero-kicker">' + imEsc(data.header.kicker) + " · " + imEsc(data.header.title) + "</div>" +
      '<h1 class="im-hero-title">' + imEsc(data.header.subtitle) + "</h1></div>";
    root.innerHTML = hero + '<div class="im-grid">' + cards + bibCard + "</div>";
    root.querySelectorAll("[data-im-chapter]").forEach(function(btn) {
      btn.addEventListener("click", function() { imShowChapter(root, data, parseInt(btn.dataset.imChapter, 10)); });
    });
    var bibBtn = root.querySelector("[data-im-bib]");
    if (bibBtn) bibBtn.addEventListener("click", function() { imShowBib(root, data, null); });
  }
  function renderInteractiveManual(viewKey) {
    if (imRendered[viewKey]) return;
    imRendered[viewKey] = true;
    var data = IM_DATA[viewKey];
    if (!data) return;
    var root = document.getElementById("im-root-" + viewKey);
    if (!root) return;
    imShowIndex(root, data);
  }

  function wireNav() {
    document.querySelectorAll(".hub-btn").forEach(function(btn) {
      btn.addEventListener("click", function() {
        showView(btn.dataset.view);
        if (btn.dataset.view === "quiz") renderQuizStart();
        if (IM_DATA[btn.dataset.view]) renderInteractiveManual(btn.dataset.view);
      });
    });
    document.querySelectorAll("[data-back]").forEach(function(btn) {
      btn.addEventListener("click", function() { showView(btn.dataset.back); });
    });
  }

  function applyStudentVisibility(config) {
    document.querySelectorAll(".hub-btn[data-type]").forEach(function(btn) {
      var t = btn.dataset.type;
      btn.style.display = config[t] ? "" : "none";
    });
  }

  function applyTeacherHints(config) {
    document.querySelectorAll(".teacher-hint[data-hint]").forEach(function(span) {
      var t = span.dataset.hint;
      var on = !!config[t];
      span.textContent = on ? "visible" : "oculto";
      span.className = "teacher-hint " + (on ? "on" : "off");
    });
    document.querySelectorAll("#teacher-panel input[type=checkbox][data-type]").forEach(function(chk) {
      chk.checked = !!config[chk.dataset.type];
    });
  }

  function fetchConfig() {
    return fetch(LOCAL_CONFIG + "?t=" + Date.now()).then(function(r) { return r.json(); });
  }

  function ghHeaders(token) {
    return { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" };
  }

  function ghGetFile(token) {
    return fetch("https://api.github.com/repos/" + REPO + "/contents/" + GH_CONFIG_PATH, { headers: ghHeaders(token) })
      .then(function(r) {
        if (!r.ok) throw new Error("No se pudo leer el fichero (" + r.status + ")");
        return r.json();
      })
      .then(function(data) {
        configSha = data.sha;
        return JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\n/g, "")))));
      });
  }

  function ghSaveFile(token, configObj) {
    var content = btoa(unescape(encodeURIComponent(JSON.stringify(configObj, null, 2) + "\n")));
    return fetch("https://api.github.com/repos/" + REPO + "/contents/" + GH_CONFIG_PATH, {
      method: "PUT",
      headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders(token)),
      body: JSON.stringify({
        message: "Modo profesora: actualizar visibilidad de materiales (" + GH_CONFIG_PATH + ")",
        content: content,
        sha: configSha
      })
    }).then(function(r) {
      if (!r.ok) return r.text().then(function(t) { throw new Error("Error al guardar (" + r.status + "): " + t); });
      return r.json();
    }).then(function(data) {
      configSha = data.content.sha;
    });
  }

  function getToken() {
    try { return sessionStorage.getItem("gh_pat") || ""; } catch (e) { return ""; }
  }
  function setToken(t) {
    try { sessionStorage.setItem("gh_pat", t); } catch (e) {}
  }

  function setStatus(msg, isError) {
    var el = document.getElementById("teacher-status");
    if (!el) return;
    el.textContent = msg;
    el.style.color = isError ? "#FFB3B3" : "#9FE6A0";
  }

  function initTeacherPanel() {
    document.getElementById("teacher-panel").hidden = false;
    var tokenInput = document.getElementById("gh-token");
    tokenInput.value = getToken();

    document.getElementById("gh-token-save").addEventListener("click", function() {
      setToken(tokenInput.value.trim());
      setStatus(tokenInput.value.trim() ? "Token guardado para esta sesión." : "Token borrado.");
      refreshFromGithub();
    });

    document.querySelectorAll("#teacher-panel input[type=checkbox][data-type]").forEach(function(chk) {
      chk.addEventListener("change", function() {
        var token = getToken();
        if (!token) { setStatus("Pega primero tu token de GitHub.", true); chk.checked = !chk.checked; return; }
        setStatus("Guardando...");
        ghGetFile(token).then(function(current) {
          current[chk.dataset.type] = chk.checked;
          return ghSaveFile(token, current).then(function() { return current; });
        }).then(function(current) {
          applyTeacherHints(current);
          setStatus("Guardado ✓ — el alumnado lo verá en 1-2 minutos.");
        }).catch(function(err) {
          chk.checked = !chk.checked;
          setStatus(err.message, true);
        });
      });
    });

    refreshFromGithub();

    function refreshFromGithub() {
      var token = getToken();
      if (!token) { fetchConfig().then(applyTeacherHints); return; }
      setStatus("Cargando estado actual...");
      ghGetFile(token).then(function(current) {
        applyTeacherHints(current);
        setStatus("Conectado. Puedes marcar/desmarcar materiales.");
      }).catch(function(err) { setStatus(err.message, true); fetchConfig().then(applyTeacherHints); });
    }
  }

  function reveal(teacherMode) {
    isTeacher = teacherMode;
    document.getElementById("content").innerHTML = decodeURIComponent(escape(atob(PAYLOAD)));
    document.getElementById("gate").style.display = "none";
    document.getElementById("page").style.display = "block";
    wireNav();
    if (teacherMode) {
      document.querySelectorAll(".hub-btn[data-type]").forEach(function(btn) { btn.style.display = ""; });
      initTeacherPanel();
    } else {
      fetchConfig().then(applyStudentVisibility);
    }
    try { sessionStorage.setItem(SESSION_KEY, teacherMode ? "teacher" : "1"); } catch (e) {}
  }

  function tryUnlock() {
    var val = document.getElementById("pw").value;
    sha256Hex(val).then(function(hex) {
      if (hex === TEACHER_HASH) { reveal(true); return; }
      if (hex === HASH) {
        fetch(ROOT_CONFIG + "?t=" + Date.now()).then(function(r) { return r.json(); }).then(function(rootCfg) {
          if (rootCfg[TEMA_KEY] === false) {
            document.getElementById("err").textContent = "Este tema no está disponible por el momento.";
          } else {
            reveal(false);
          }
        }).catch(function() { reveal(false); });
        return;
      }
      document.getElementById("err").textContent = "Contraseña incorrecta.";
    });
  }

  document.getElementById("enter").addEventListener("click", tryUnlock);
  document.getElementById("pw").addEventListener("keydown", function(e) { if (e.key === "Enter") tryUnlock(); });

  try {
    var saved = sessionStorage.getItem(SESSION_KEY);
    if (saved === "teacher") reveal(true);
    else if (saved === "1") reveal(false);
  } catch (e) {}
})();
</script>
</body>
</html>
