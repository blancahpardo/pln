os de género encontrados, términos valorativos, puntuaciones o etiquetas."},{"type":"p","text":"El manual no necesita entrar en los casos concretos del corpus, que se discutirán en el aula. Lo importante antes de programar es entender la estructura: el texto original en una columna, las representaciones procesadas en columnas nuevas y los resultados en una tabla final."},{"type":"p","text":"Una operación habitual es extraer la columna textual como lista:"},{"type":"code","code":"textos = df[\"text\"].tolist()"},{"type":"p","text":"`df[\"text\"]` selecciona una columna y `.tolist()` la convierte en una lista de Python, una transformación útil porque muchas funciones de PLN reciben una lista de textos o recorren los textos uno a uno."}]},{"id":"2-3-normalizar-texto","title":"2.3. Normalizar texto","blocks":[{"type":"p","text":"La función de normalización transforma cada texto antes de tokenizarlo. Su objetivo es reducir variación superficial que puede impedir comparaciones."},{"type":"code","code":"def normalizar_texto(texto):\n    texto = texto.lower()\n    texto = re.sub(r\"http\\S+|www\\S+\", \"\", texto)\n    texto = re.sub(r\"@\\w+\", \"\", texto)\n    texto = re.sub(r\"#\", \"\", texto)\n    texto = re.sub(r\"\\d+\", \"\", texto)\n    texto = re.sub(r\"[^\\w\\s]\", \"\", texto)\n    texto = re.sub(r\"\\s+\", \" \", texto).strip()\n    return texto"},{"type":"p","text":"La primera línea, `texto.lower()`, convierte todo a minúsculas, de modo que *Mujer*, *mujer* y *MUJER* no se tratan como tres formas distintas. Esta decisión mejora el conteo, pero elimina la información sobre mayúsculas enfáticas o nombres propios."},{"type":"p","text":"Las llamadas a `re.sub` sustituyen patrones por una cadena vacía. El patrón `r\"http\\S+|www\\S+\"` localiza URL; `r\"@\\w+\"`, menciones de usuario; `r\"#\"` elimina el símbolo de *hashtag*, aunque no necesariamente la palabra que lo acompaña; `r\"\\d+\"` elimina números, y `r\"[^\\w\\s]\"`, la puntuación y los símbolos que no sean caracteres de palabra ni espacios. Por último, `r\"\\s+\"` agrupa los espacios repetidos y `.strip()` elimina los del principio y del final."},{"type":"p","text":"La normalización se aplica con una comprensión de listas:"},{"type":"code","code":"textos_norm = [normalizar_texto(t) for t in textos]"},{"type":"p","text":"Esta línea significa «para cada texto `t` dentro de `textos`, aplica la función `normalizar_texto` y guarda el resultado». La comprensión de listas es compacta, pero conceptualmente equivale a un bucle."}]},{"id":"2-4-obtener-stopwords-en-espanol","title":"2.4. Obtener stopwords en español","blocks":[{"type":"p","text":"La unidad define una función `get_stopwords_es()` que intenta conseguir *stopwords* en español siguiendo un orden de prioridad:"},{"type":"ol","items":["Primero intenta usar spaCy.","Si spaCy no está disponible, intenta usar NLTK.","Si tampoco se puede usar NLTK, recurre a una lista mínima interna."]},{"type":"p","text":"Este diseño enseña una idea importante: un buen código docente debe funcionar también fuera del ordenador ideal, previendo fallos razonables y ofreciendo alternativas."},{"type":"code","code":"def get_stopwords_es():\n    try:\n        from spacy.lang.es.stop_words import STOP_WORDS as SPACY_STOP\n        return set(SPACY_STOP)\n    except Exception:\n        pass\n\n    try:\n        import nltk\n        from nltk.corpus import stopwords\n        try:\n            return set(stopwords.words(\"spanish\"))\n        except LookupError:\n            try:\n                nltk.download(\"stopwords\", quiet=True)\n                return set(stopwords.words(\"spanish\"))\n            except Exception:\n                pass\n    except Exception:\n        pass\n\n    return {\"de\", \"la\", \"que\", \"el\", \"en\", \"y\", \"a\", \"los\"}"},{"type":"p","text":"La función devuelve un `set`, y no una lista, porque en Python buscar si una palabra está dentro de un conjunto suele ser más eficiente que buscarla dentro de una lista. Para esta unidad el tamaño no es enorme, pero la elección enseña una buena práctica."}]},{"id":"2-5-detectar-automaticamente-la-columna-de-texto","title":"2.5. Detectar automáticamente la columna de texto","blocks":[{"type":"p","text":"Los conjuntos de datos no siempre llaman igual a la columna textual: un archivo puede tener `text`; otro, `texto`; otro, `tweet`, y otro, `content`. Para evitar que el código dependa de un único nombre, se define una pequeña heurística:"},{"type":"code","code":"def detectar_columna_texto(df):\n    candidatos = [\"texto\", \"text\", \"tweet\", \"tweets\", \"content\", \"sentence\", \"review\"]\n    for c in candidatos:\n        if c in df.columns:\n            return c\n    obj_cols = [c for c in df.columns if df[c].dtype == \"object\"]\n    if obj_cols:\n        return obj_cols[0]\n    raise KeyError(\"No he encontrado una columna de texto en el DataFrame.\")"},{"type":"p","text":"La función revisa una lista de nombres probables y, si encuentra uno, lo devuelve. Si no, busca la primera columna de tipo `object`, que en pandas suele corresponder a texto, y si tampoco existe, lanza un error claro."},{"type":"p","text":"Esta función no es lingüísticamente profunda, pero sí profesional: hace que el *pipeline* sea reutilizable con distintos corpus y enseña que los datos reales rara vez llegan con nombres perfectos y homogéneos."}]},{"id":"2-6-tokenizar-y-lematizar","title":"2.6. Tokenizar y lematizar","blocks":[{"type":"p","text":"La unidad define una tokenización simple con regex:"},{"type":"code","code":"def tokenizar(texto: str):\n    return re.findall(r\"[a-záéíóúüñ]+\", str(texto).lower())"},{"type":"p","text":"El patrón busca secuencias de letras minúsculas, incluidas las vocales acentuadas, la diéresis y la *ñ*, una decisión adaptada al español que deja fuera emojis, signos y números. Para el objetivo de la unidad, esto facilita la lectura de las listas léxicas; para otros objetivos, podría resultar insuficiente."},{"type":"p","text":"Después aparece una función más completa:"},{"type":"code","code":"def tokenizar_y_lematizar(texto: str):\n    if nlp is None:\n        toks = tokenizar(texto)\n        return [t for t in toks if t not in STOPWORDS_ES and len(t) > 2]\n\n    doc = nlp(str(texto).lower())\n    return [\n        t.lemma_\n        for t in doc\n        if (not t.is_stop) and (not t.is_space) and (t.is_alpha) and len(t.lemma_) > 2\n    ]"},{"type":"p","text":"La función tiene dos caminos: si no hay modelo de spaCy, tokeniza con regex y elimina *stopwords* y *tokens* muy cortos; si lo hay, procesa el texto y devuelve lemas. En ambos casos se busca una representación más limpia que el texto original."},{"type":"p","text":"La línea final de aplicación es:"},{"type":"code","code":"tokens = [tokenizar_y_lematizar(t) for t in df[TEXT_COL].tolist()]\ndf[\"tokens\"] = tokens"},{"type":"p","text":"El resultado es una columna nueva llamada `tokens`, en la que cada fila contiene una lista de palabras procesadas, base de casi todo el análisis posterior."}]},{"id":"2-7-construir-un-lexico-de-genero-marcado","title":"2.7. Construir un léxico de género marcado","blocks":[{"type":"p","text":"El léxico de género se representa mediante un diccionario de pares:"},{"type":"code","code":"dic_genero = {\n    \"hombre\": \"mujer\",\n    \"mujer\": \"hombre\",\n    \"jefe\": \"jefa\",\n    \"jefa\": \"jefe\",\n    \"candidato\": \"candidata\",\n    \"candidata\": \"candidato\",\n    \"estudiante\": \"estudiante\",\n    \"deportista\": \"deportista\"\n}\n\nlexico_genero = sorted(set(dic_genero.keys()) | set(dic_genero.values()))"},{"type":"p","text":"El diccionario permite guardar relaciones entre formas: algunas son pares masculino/femenino, y otras, como *estudiante* o *deportista*, se mantienen como formas comunes. Después se combinan claves y valores con una unión de conjuntos, y el resultado, `lexico_genero`, es una lista ordenada de términos que se buscarán en los textos."},{"type":"p","text":"Desde el punto de vista lingüístico, este léxico no pretende resolver el género en español: es un recurso didáctico y ampliable, que sirve para aprender a formular una hipótesis con precisión («estas son las formas que voy a considerar relevantes en esta fase del análisis»)."}]},{"id":"2-8-construir-un-lexico-valorativo","title":"2.8. Construir un léxico valorativo","blocks":[{"type":"p","text":"El léxico valorativo se organiza en dos listas y un diccionario final:"},{"type":"code","code":"lexico_valorativo_positivo = [\"excelente\", \"bueno\", \"brillante\", \"responsable\"]\nlexico_valorativo_negativo = [\"terrible\", \"agresivo\", \"incompetente\", \"desastre\"]\n\ndic_valorativo = {w.lower(): \"positivo\" for w in lexico_valorativo_positivo}\ndic_valorativo.update({w.lower(): \"negativo\" for w in lexico_valorativo_negativo})"},{"type":"p","text":"La primera comprensión de diccionario asigna la etiqueta `positivo` a cada palabra de la lista positiva, y después `.update()` añade las palabras negativas con la etiqueta `negativo`."},{"type":"p","text":"El resultado es una estructura de consulta: si una palabra aparece como clave, el sistema puede recuperar su polaridad. Por ejemplo, `dic_valorativo[\"excelente\"]` devuelve `positivo`. Esta estructura es más útil que dos listas separadas cuando queremos calcular una puntuación."},{"type":"p","text":"La puntuación que se usará después es deliberadamente simple: +1 para los términos positivos y −1 para los negativos. Esta escala no mide la intensidad real; solo crea una señal inicial para ordenar y comparar textos."}]},{"id":"2-9-detectar-terminos-relevantes-en-cada-documento","title":"2.9. Detectar términos relevantes en cada documento","blocks":[{"type":"p","text":"Las funciones de detección son muy cortas:"},{"type":"code","code":"def detectar_lexico_genero(tokens_doc, lexico_genero):\n    return [t for t in tokens_doc if t in lexico_genero]\n\ndef detectar_lexico_valorativo(tokens_doc, dic_valorativo):\n    return [t for t in tokens_doc if t in dic_valorativo]"},{"type":"p","text":"Cada función recorre los *tokens* de un documento y conserva solo los que aparecen en el recurso correspondiente. La primera consulta una lista de términos de género. La segunda consulta las claves del diccionario valorativo."},{"type":"p","text":"Estas funciones no clasifican textos: no dicen «este texto es sesgado» ni «este texto es negativo», solo devuelven evidencias léxicas, esto es, qué términos de interés han aparecido. Esta diferencia debe quedar muy clara antes de interpretar resultados."}]},{"id":"2-10-construir-la-tabla-de-resultados-por-texto","title":"2.10. Construir la tabla de resultados por texto","blocks":[{"type":"p","text":"El bloque central recorre todos los textos tokenizados y genera un diccionario de resultados para cada documento:"},{"type":"code","code":"resultados = []\nfor i, texto_tokens in enumerate(tokens):\n    genero = detectar_lexico_genero(texto_tokens, lexico_genero)\n    valorativo = detectar_lexico_valorativo(texto_tokens, dic_valorativo)\n\n    score_valorativo = sum(1 if dic_valorativo[t] == \"positivo\" else -1 for t in valorativo)\n\n    resultados.append({\n        \"texto_id\": i + 1,\n        \"texto\": textos[i],\n        \"tokens\": texto_tokens,\n        \"lexico_genero\": genero,\n        \"n_genero\": len(genero),\n        \"lexico_valorativo\": valorativo,\n        \"n_valorativo\": len(valorativo),\n        \"score_valorativo\": score_valorativo\n    })\n\ndf_resultados = pd.DataFrame(resultados)"},{"type":"p","text":"`enumerate(tokens)` permite recorrer la lista de documentos y conservar a la vez el índice `i`, que se usa para recuperar el texto original y crear un identificador."},{"type":"p","text":"La variable `genero` guarda las marcas de género detectadas, y `valorativo`, las palabras valorativas. `len(genero)` y `len(valorativo)` cuentan cuántas marcas hay, y `score_valorativo` suma +1 o −1 según la polaridad."},{"type":"p","text":"El resultado final, `df_resultados`, es una tabla analítica en la que cada fila representa un texto y cada columna, una observación. Esta estructura permite ordenar, filtrar, agrupar y revisar ejemplos concretos sin perder el vínculo con el texto original."}]},{"id":"2-11-calcular-frecuencias-globales","title":"2.11. Calcular frecuencias globales","blocks":[{"type":"p","text":"Para observar el patrón global del corpus, se juntan todos los *tokens*:"},{"type":"code","code":"todos_tokens = [t for sublist in df_resultados[\"tokens\"].tolist() for t in sublist]\nfrecuencias = Counter(todos_tokens)"},{"type":"p","text":"La comprensión de listas tiene dos niveles: primero recorre cada lista de *tokens* y después cada *token* dentro de esa lista. El resultado es una lista plana con todos los *tokens* del corpus, y `Counter` cuenta cuántas veces aparece cada uno."},{"type":"p","text":"Después se construye una tabla solo con términos relevantes:"},{"type":"code","code":"frecuencias_sesgo = pd.DataFrame([\n    {\"palabra\": p,\n     \"frecuencia\": frecuencias[p],\n     \"tipo\": (\"género\" if p in lexico_genero else \"valorativo\"),\n     \"polaridad\": dic_valorativo.get(p, \"\")}\n    for p in sorted(set(lexico_genero) | set(dic_valorativo.keys()))\n    if frecuencias[p] > 0\n]).sort_values([\"tipo\", \"frecuencia\"], ascending=[True, False])"},{"type":"p","text":"Esta construcción combina tres ideas: selección de términos de interés, consulta de frecuencia y creación de filas para un DataFrame. La columna `tipo` distingue si la palabra pertenece al léxico de género o al valorativo, y la columna `polaridad` solo tendrá contenido cuando el término esté en el diccionario valorativo."},{"type":"p","text":"La ordenación final permite ver primero los grupos y, dentro de ellos, las palabras más frecuentes. Una vez más, la frecuencia no interpreta por sí sola: organiza la observación."}]},{"id":"2-12-ordenar-textos-por-densidad-de-marcas","title":"2.12. Ordenar textos por densidad de marcas","blocks":[{"type":"p","text":"Una operación frecuente en auditoría lingüística es seleccionar textos que merecen revisión cualitativa. Para eso se puede ordenar la tabla por número de marcas:"},{"type":"code","code":"top_genero = df_resultados.sort_values(\n    [\"n_genero\", \"n_valorativo\"],\n    ascending=False\n).head(8)"},{"type":"p","text":"Esta línea no identifica los textos «peores» ni «más sesgados»; selecciona los textos con más marcas según los criterios definidos. La diferencia importa, porque el código no sabe qué es un problema social y se limita a aplicar una estrategia de priorización."},{"type":"p","text":"El método `sort_values` ordena por una o varias columnas; `ascending=False` indica orden descendente, y `.head(8)` devuelve las ocho primeras filas. En una auditoría real, este tipo de selección permite decidir qué ejemplos revisar primero."}]},{"id":"2-13-construir-concordancias-kwic","title":"2.13. Construir concordancias KWIC","blocks":[{"type":"p","text":"La función KWIC crea una tabla con contexto izquierdo y derecho:"},{"type":"code","code":"def kwic(tokens_corpus, term, window=4, max_lines=12):\n    lines = []\n    for doc_id, toks in enumerate(tokens_corpus, start=1):\n        for i, t in enumerate(toks):\n            if t == term:\n                left = \" \".join(toks[max(0, i-window):i])\n                right = \" \".join(toks[i+1:i+1+window])\n                lines.append({\"texto_id\": doc_id, \"izq\": left, \"term\": term, \"dcha\": right})\n    return pd.DataFrame(lines).head(max_lines)"},{"type":"p","text":"La función recorre documento por documento y *token* por *token*, y cuando encuentra el término buscado, toma una ventana de palabras a su izquierda y a su derecha. `max(0, i-window)` evita que el índice izquierdo sea negativo cuando el término aparece al principio del texto."},{"type":"p","text":"`\" \".join(...)` reconstruye una secuencia de *tokens* como texto legible. La tabla resultante tiene cuatro columnas: identificador del texto, contexto izquierdo, término y contexto derecho."},{"type":"p","text":"El KWIC sirve para leer usos: es una herramienta puente, que parte de una búsqueda automática pero obliga a volver al contexto lingüístico."}]},{"id":"2-14-calcular-coocurrencias","title":"2.14. Calcular coocurrencias","blocks":[{"type":"p","text":"La coocurrencia cuenta qué palabras aparecen cerca de un término objetivo:"},{"type":"code","code":"def coocurrencias(tokens_corpus, target, window=4):\n    co = Counter()\n    for toks in tokens_corpus:\n        for i, t in enumerate(toks):\n            if t == target:\n                left = toks[max(0, i-window):i]\n                right = toks[i+1:i+1+window]\n                for w in left + right:\n                    if w != target:\n                        co[w] += 1\n    return co"},{"type":"p","text":"`co` empieza como un contador vacío. Cada vez que el sistema encuentra el término objetivo, recoge las palabras cercanas y suma una ocurrencia para cada una, y el resultado puede convertirse en una tabla con las palabras más frecuentes."},{"type":"p","text":"La coocurrencia no entiende de sintaxis: no sabe si una palabra modifica a otra, si pertenece a otra oración o si aparece por azar. Aun así, ayuda a detectar asociaciones recurrentes que después pueden revisarse con KWIC o con una lectura cualitativa."}]},{"id":"2-15-descargar-y-organizar-un-subcorpus-real","title":"2.15. Descargar y organizar un subcorpus real","blocks":[{"type":"p","text":"La unidad incorpora una fase con datos reales descargables. El código usa `os` para crear una carpeta y `urlretrieve` para descargar los archivos si no existen:"},{"type":"code","code":"import os\nfrom urllib.request import urlretrieve\n\nDATA_DIR = \"data_subcorpus_real\"\nos.makedirs(DATA_DIR, exist_ok=True)\n\nbase = \"https://raw.githubusercontent.com/garnachod/TwitterSentimentDataset/master/\"\narchivos = {\n    \"pos\": \"tweets_pos_clean.txt\",\n    \"neg\": \"tweets_neg_clean.txt\",\n    \"neu\": \"tweets_clean.txt\"\n}"},{"type":"p","text":"La estructura `archivos` es un diccionario en el que cada clave representa una etiqueta y cada valor, un nombre de archivo. Después, el código recorre ese diccionario, construye rutas locales y descarga solo lo necesario."},{"type":"p","text":"Esta parte enseña dos ideas profesionales. Primero, no conviene depender de descargas repetidas: si un archivo ya existe, se reutiliza. Segundo, un corpus real suele venir distribuido en archivos, carpetas y etiquetas; antes de analizarlo hay que convertirlo en una estructura de trabajo."}]},{"id":"2-16-leer-lineas-y-crear-una-muestra-manejable","title":"2.16. Leer líneas y crear una muestra manejable","blocks":[{"type":"p","text":"La función `leer_lineas` abre un archivo y devuelve una lista de líneas no vacías:"},{"type":"code","code":"def leer_lineas(path, max_lines=None):\n    lineas = []\n    with open(path, \"r\", encoding=\"utf-8\", errors=\"ignore\") as f:\n        for i, line in enumerate(f):\n            line = line.strip()\n            if line:\n                lineas.append(line)\n            if max_lines is not None and len(lineas) >= max_lines:\n                break\n    return lineas"},{"type":"p","text":"`with open(...) as f` abre el archivo de forma segura; `encoding=\"utf-8\"` indica la codificación; `errors=\"ignore\"` evita que un carácter problemático detenga toda la lectura, y `max_lines` permite limitar el número de líneas, algo muy útil en clase para que el análisis sea rápido."},{"type":"p","text":"Después se crea una tabla con textos y etiquetas:"},{"type":"code","code":"df_real = pd.DataFrame({\n    \"texto\": pos + neg + neu,\n    \"etiqueta\": ([\"pos\"] * len(pos)) + ([\"neg\"] * len(neg)) + ([\"neu\"] * len(neu))\n}).reset_index(drop=True)"},{"type":"p","text":"La columna `texto` contiene los mensajes, y la columna `etiqueta` conserva la clase original. Conviene no confundir esa etiqueta con el resultado del análisis léxico: la etiqueta viene del conjunto de datos, mientras que las medidas de la unidad se calculan después."}]},{"id":"2-17-crear-un-subcorpus-tematico-con-regex","title":"2.17. Crear un subcorpus temático con regex","blocks":[{"type":"p","text":"Para estudiar un fenómeno poco frecuente, a veces se filtra el corpus. En esta unidad se buscan textos que contienen términos de género concretos:"},{"type":"code","code":"pat = re.compile(\n    r\"\\b(?:mujer|mujeres|hombre|hombres|jefa|jefas|jefe|jefes|chica|chicas|chico|chicos)\\b\",\n    re.IGNORECASE\n)\n\ndf_sub = df_real[df_real[\"texto\"].astype(str).str.contains(pat, regex=True)].copy()"},{"type":"p","text":"`re.compile` prepara el patrón; `re.IGNORECASE` hace que la búsqueda no distinga mayúsculas y minúsculas; `(?:...)` agrupa alternativas sin crear un grupo de captura, y `\\b` marca los límites de palabra."},{"type":"p","text":"El método `str.contains` aplica el patrón a cada texto y devuelve una serie booleana (verdadero si el texto contiene alguna forma, falso si no), que se usa para filtrar `df_real`. `.copy()` crea una copia independiente y evita advertencias de pandas cuando más adelante se modifiquen columnas."},{"type":"p","text":"El subcorpus temático no es más representativo que el corpus general, sino más pertinente para una pregunta concreta, y esa distinción debe aparecer en cualquier informe."}]},{"id":"2-18-reutilizar-el-pipeline-en-datos-reales","title":"2.18. Reutilizar el pipeline en datos reales","blocks":[{"type":"p","text":"Una buena señal de diseño es que las funciones creadas al principio puedan reutilizarse:"},{"type":"code","code":"tokens_sub = [tokenizar_y_lematizar(t) for t in df_sub[\"texto\"].tolist()]\n\nresultados_sub = []\nfor i, texto_tokens in enumerate(tokens_sub):\n    genero = detectar_lexico_genero(texto_tokens, lexico_genero)\n    valorativo = detectar_lexico_valorativo(texto_tokens, dic_valorativo)\n    score = sum(1 if dic_valorativo.get(t) == \"positivo\" else -1\n                for t in valorativo if t in dic_valorativo)"},{"type":"p","text":"El mismo patrón se repite: tokenizar, detectar, contar, puntuar y guardar resultados, con la diferencia de que ahora los textos proceden de un corpus real y tienen una etiqueta externa."},{"type":"p","text":"La tabla final del subcorpus incluye columnas como `etiqueta`, `texto`, `tokens`, `genero_encontrado`, `valorativo_encontrado`, `n_genero`, `n_valorativo` y `score_valorativo`, una estructura que permite comparar dos capas:"},{"type":"ul","items":["la etiqueta original del conjunto de datos;","las marcas léxicas detectadas por nuestro sistema."]},{"type":"p","text":"Si ambas capas no coinciden, no significa necesariamente que una esté mal: significa que miden cosas distintas."}]},{"id":"2-19-agrupar-resultados-por-etiqueta","title":"2.19. Agrupar resultados por etiqueta","blocks":[{"type":"p","text":"Para resumir los resultados por clase se usa `groupby`:"},{"type":"code","code":"resumen = df_resultados_sub.groupby(\"etiqueta\")[\n    [\"n_genero\", \"n_valorativo\", \"score_valorativo\"]\n].mean().round(2)"},{"type":"p","text":"`groupby(\"etiqueta\")` divide la tabla según los valores de la columna `etiqueta`; después se seleccionan las columnas numéricas y se calcula la media, y `.round(2)` redondea a dos decimales."},{"type":"p","text":"Este resumen no debe interpretarse como una verdad psicológica sobre los tuits: solo muestra promedios dentro del subcorpus filtrado y bajo los léxicos definidos. En un informe habría que acompañarlo del tamaño de muestra, los criterios de filtrado y las advertencias sobre representatividad."}]},{"id":"2-20-mejorar-coocurrencias-en-redes-sociales","title":"2.20. Mejorar coocurrencias en redes sociales","blocks":[{"type":"p","text":"En el subcorpus real, las coocurrencias pueden llenarse de ruido, y por eso se define una función más cuidadosa:"},{"type":"code","code":"def tok_tweet(s):\n    return re.findall(r\"[a-záéíóúüñ]+\", str(s).lower())\n\ndef coocurrencias_df(texts, target_terms, window_tokens=6, top_n=20,\n                     stopwords=None, extra_stop=None, min_len=3):\n    targets = set(t.lower() for t in target_terms)\n    stop = set(stopwords or [])\n    stop |= set(extra_stop or [])\n    counts = Counter()"},{"type":"p","text":"La función convierte los términos objetivo y las *stopwords* en conjuntos; después recorre los textos, tokeniza, busca términos de género y cuenta las palabras próximas. Añade además filtros que eliminan los términos objetivo, los *tokens* demasiado cortos, las *stopwords* estándar y el ruido típico de Twitter, como *rt*, *dm*, *http*, *https* o *tco*."},{"type":"p","text":"Esta función enseña una idea avanzada: el análisis real exige adaptar la limpieza al dominio. Las *stopwords* generales no siempre bastan, pero limpiar demasiado puede borrar señales discursivas, porque toda decisión técnica tiene un coste interpretativo."}]},{"id":"2-21-como-escribir-una-interpretacion-responsable","title":"2.21. Cómo escribir una interpretación responsable","blocks":[{"type":"p","text":"La salida de este *pipeline* puede alimentar un informe, pero el informe debe formularse con precisión. Algunas formulaciones responsables serían:"},{"type":"ul","items":["«El sistema ha detectado términos de género marcados en este subconjunto de textos».","«El léxico valorativo aparece con mayor o menor frecuencia según las listas definidas».","«Las coocurrencias sugieren asociaciones que conviene revisar con KWIC».","«La etiqueta de sentimiento del conjunto de datos y la puntuación léxica no miden exactamente lo mismo».","«No se infiere intención comunicativa a partir de estos resultados automáticos»."]},{"type":"p","text":"Algunas formulaciones que conviene evitar:"},{"type":"ul","items":["«El algoritmo demuestra que el texto es sexista».","«Si no aparece léxico valorativo, no hay valoración».","«Una coocurrencia frecuente prueba una asociación discriminatoria».","«La limpieza del texto es neutra».","«La etiqueta del conjunto de datos es la verdad y nuestro análisis solo la confirma»."]},{"type":"p","text":"La competencia profesional reside precisamente en esta diferencia: programar es, además de obtener salidas, saber qué tipo de afirmación permite cada una."}]}],"navTitle":"Python para PLN"},{"id":"errores-frecuentes-de-aprendizaje","title":"Errores frecuentes de aprendizaje","blocks":[{"type":"ul","items":["Confundir detección léxica con interpretación completa del sesgo.","Pensar que una palabra de género es problemática por sí misma.","Olvidar que las listas léxicas son decisiones humanas y deben revisarse.","Interpretar una puntuación de polaridad como si midiera intención o ironía.","Eliminar *stopwords* sin pensar qué información discursiva se pierde.","Creer que un corpus filtrado representa todo el corpus original.","Confundir la etiqueta externa de sentimiento con la valoración detectada por el prototipo.","Leer una coocurrencia como prueba causal.","No volver al texto original después de mirar tablas.","Presentar resultados automáticos con lenguaje demasiado concluyente."]}],"subsections":[],"navTitle":"Errores frecuentes"},{"id":"sintesis-final","title":"Síntesis final","blocks":[{"type":"p","text":"Esta unidad presenta una forma responsable de usar Python para analizar el sesgo léxico y discursivo. Más que la promesa de una inteligencia artificial infalible, su punto de partida es una práctica lingüística transparente: definir qué se busca, preparar los textos, construir léxicos definidos de antemano, detectar marcas, contar patrones y volver al contexto."},{"type":"p","text":"El marco teórico muestra que el sesgo en PLN va más allá de un problema técnico, porque se relaciona con la representación social, los datos, la anotación, los modelos, los corpus y el poder. La investigación reciente insiste en que toda medición de sesgo requiere definiciones precisas, documentación de los datos y cautela interpretativa."},{"type":"p","text":"La parte de Python enseña el esqueleto de un *pipeline* reutilizable: DataFrame, normalización, tokenización, lematización opcional, *stopwords*, diccionarios, funciones de detección, tablas de resultados, frecuencias, KWIC, coocurrencias, descarga de datos reales, filtrado temático y agrupación. Cada operación produce una representación distinta del texto y, por tanto, una forma distinta de mirar el lenguaje."},{"type":"p","text":"El aprendizaje principal es que un análisis automático bien diseñado organiza la lectura humana en lugar de sustituirla: permite localizar indicios y formular preguntas, pero la interpretación lingüística sigue siendo el núcleo profesional del trabajo."}],"subsections":[],"navTitle":"Síntesis"},{"id":"cierre-narrativo","title":"Cierre narrativo","blocks":[{"type":"p","text":"Al terminar la simulación, Veridia Text Lab no entrega al cliente una lista de textos «culpables» o «inocentes», sino algo más serio: un prototipo explicable, un conjunto de criterios, una tabla de indicios y una guía de interpretación. El equipo puede mostrar qué palabras se han buscado, cómo se han limpiado los textos, qué frecuencia tiene cada término, qué coocurrencias aparecen y qué límites tiene el análisis."},{"type":"p","text":"Ese es el valor de una lingüista computacional en este tipo de proyecto: lejos de limitarse a ejecutar código o a repetir resultados, traduce entre tres mundos, el del lenguaje humano, el de la estructura computacional y el de la responsabilidad social de interpretar textos. Cuando el cliente pregunte si el sistema «detecta sesgo», la respuesta profesional será más precisa: detecta ciertos indicios léxicos y discursivos definidos de antemano, que deben revisarse con lectura experta."},{"type":"p","text":"En el aula, los casos prácticos permitirán aplicar este *pipeline* y discutir resultados concretos. Antes de llegar ahí, este manual te da la base conceptual y técnica para leer el código con criterio: saber qué hace cada bloque, qué presupone y qué tipo de conclusión permite."}],"subsections":[],"navTitle":"Cierre narrativo"}],"references":[{"key":"baker2006","text":"Baker, P. (2006). *Using corpora in discourse analysis*. Continuum."},{"key":"baker2008","text":"Baker, P., Gabrielatos, C., KhosraviNik, M., Krzyżanowski, M., McEnery, T. y Wodak, R. (2008). A useful methodological synergy? Combining critical discourse analysis and corpus linguistics to examine discourses of refugees and asylum seekers in the UK press. *Discourse & Society*, *19*(3), 273–306. https://doi.org/10.1177/0957926508088962"},{"key":"bender2018","text":"Bender, E. M. y Friedman, B. (2018). Data statements for natural language processing: Toward mitigating system bias and enabling better science. *Transactions of the Association for Computational Linguistics*, *6*, 587–604. https://doi.org/10.1162/tacl_a_00041"},{"key":"blodgett2020","text":"Blodgett, S. L., Barocas, S., Daumé III, H. y Wallach, H. (2020). Language (technology) is power: A critical survey of \"bias\" in NLP. En *Proceedings of the 58th Annual Meeting of the Association for Computational Linguistics* (pp. 5454–5476). Association for Computational Linguistics. https://doi.org/10.18653/v1/2020.acl-main.485"},{"key":"bolukbasi2016","text":"Bolukbasi, T., Chang, K.-W., Zou, J., Saligrama, V. y Kalai, A. (2016). Man is to computer programmer as woman is to homemaker? Debiasing word embeddings. En *Advances in Neural Information Processing Systems 29* (pp. 4349–4357). Curran Associates."},{"key":"caliskan2017","text":"Caliskan, A., Bryson, J. J. y Narayanan, A. (2017). Semantics derived automatically from language corpora contain human-like biases. *Science*, *356*(6334), 183–186. https://doi.org/10.1126/science.aal4230"},{"key":"explosionai2026","text":"Explosion AI. (2026). *Linguistic features*. spaCy Usage Documentation. https://spacy.io/usage/linguistic-features"},{"key":"gallegos2024","text":"Gallegos, I. O., Rossi, R. A., Barrow, J., Tanjim, M. M., Kim, S., Dernoncourt, F., Yu, T., Zhang, R. y Ahmed, N. K. (2024). Bias and fairness in large language models: A survey. *Computational Linguistics*, *50*(3), 1097–1179. https://doi.org/10.1162/coli_a_00524"},{"key":"garridomunoz2024","text":"Garrido-Muñoz, I., Martínez-Santiago, F. y Montejo-Ráez, A. (2024). MarIA and BETO are sexist: Evaluating gender bias in large language models for Spanish. *Language Resources and Evaluation*, *58*(4), 1387–1417. https://doi.org/10.1007/s10579-023-09670-3"},{"key":"gebru2021","text":"Gebru, T., Morgenstern, J., Vecchione, B., Vaughan, J. W., Wallach, H., Daumé III, H. y Crawford, K. (2021). Datasheets for datasets. *Communications of the ACM*, *64*(12), 86–92. https://doi.org/10.1145/3458723"},{"key":"hu2004","text":"Hu, M. y Liu, B. (2004). Mining and summarizing customer reviews. En *Proceedings of the Tenth ACM SIGKDD International Conference on Knowledge Discovery and Data Mining* (pp. 168–177). ACM. https://doi.org/10.1145/1014052.1014073"},{"key":"liu2012","text":"Liu, B. (2012). *Sentiment analysis and opinion mining*. Morgan & Claypool. https://doi.org/10.2200/S00416ED1V01Y201204HLT016"},{"key":"mcenery2012","text":"McEnery, T. y Hardie, A. (2012). *Corpus linguistics: Method, theory and practice*. Cambridge University Press."},{"key":"mohammad2013","text":"Mohammad, S. M. y Turney, P. D. (2013). Crowdsourcing a word-emotion association lexicon. *Computational Intelligence*, *29*(3), 436–465. https://doi.org/10.1111/j.1467-8640.2012.00460.x"},{"key":"perez2022","text":"Pérez, J. M., Furman, D. A., Alonso Alemany, L. y Luque, F. M. (2022). RoBERTuito: A pre-trained language model for social media text in Spanish. En *Proceedings of the Thirteenth Language Resources and Evaluation Conference* (pp. 7235–7243). European Language Resources Association. https://aclanthology.org/2022.lrec-1.785/"},{"key":"pythonsoftwarefounda2026","text":"Python Software Foundation. (2026). *re — Regular expression operations*. Python 3.14 Documentation. https://docs.python.org/3/library/   function sha256Hex(text) {
    var enc = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", enc).then(function(buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function(b) {
        return b.toString(16).padStart(2, "0");
      }).join("");
    });
  }

  function showView(id) {

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  var quizState = null;

  function renderQuizStart() {
    var root = document.getElementById("quiz-root");
    if (!root) return;
    root.innerHTML =
      '<div class="quiz-start">' +
      '<p>10 preguntas: 5 elegidas al azar del banco del manual y 5 del banco del cuaderno. Puedes repetir el intento tantas veces como quieras — cada vez se vuelven a elegir y reordenar las preguntas.</p>' +
      '<button class="quiz-btn" id="quiz-begin">Empezar</button>' +
      '</div>';
    document.getElementById("quiz-begin").addEventListener("click", startQuiz);
  }

  function startQuiz() {
    var fromManual = shuffle(QUIZ_MANUAL).slice(0, 5);
    var fromCuaderno = shuffle(QUIZ_CUADERNO).slice(0, 5);
    quizState = { questions: shuffle(fromManual.concat(fromCuaderno)), index: 0, score: 0 };
    renderQuizQuestion();
  }

  function renderQuizQuestion() {
    var root = document.getElementById("quiz-root");
    var total = quizState.questions.length;
    if (quizState.index >= total) {
      root.innerHTML =
        '<div class="quiz-result">' +
        '<div class="quiz-score">' + quizState.score + ' / ' + total + '</div>' +
        '<p>Puntuación de este intento.</p>' +
        '<button class="quiz-btn" id="quiz-retry">Volver a intentar</button>' +
        '</div>';
      document.getElementById("quiz-retry").addEventListener("click", startQuiz);
      return;
    }
    var q = quizState.questions[quizState.index];
    var opts = shuffle(q.answerOptions);
    var html = '<div class="quiz-progress">Pregunta ' + (quizState.index + 1) + ' de ' + total + ' · Puntuación provisional: ' + quizState.score + '</div>';
    html += '<div class="quiz-q"><h3>' + q.question + '</h3>';
    opts.forEach(function(opt, i) {
      html += '<button class="quiz-opt" data-idx="' + i + '">' + opt.text + '</button>';
    });
    html += '<div class="quiz-feedback" id="quiz-feedback" hidden></div>';
    html += '</div>';
    root.innerHTML = html;
    var buttons = root.querySelectorAll(".quiz-opt");
    buttons.forEach(function(btn, i) {
      btn.addEventListener("click", function() {
        buttons.forEach(function(b) { b.disabled = true; });
        var chosen = opts[i];
        if (chosen.isCorrect) { btn.classList.add("correct"); quizState.score++; }
        else {
          btn.classList.add("incorrect");
          buttons.forEach(function(b2, j) { if (opts[j].isCorrect) b2.classList.add("correct"); });
        }
        var fb = document.getElementById("quiz-feedback");
        fb.hidden = false;
        fb.textContent = chosen.rationale || (chosen.isCorrect ? "Correcto." : "Incorrecto.");
        var next = document.createElement("button");
        next.className = "quiz-btn";
        next.style.marginTop = "14px";
        next.textContent = quizState.index + 1 < total ? "Siguiente" : "Ver puntuación";
        next.addEventListener("click", function() { quizState.index++; renderQuizQuestion(); });
        root.querySelector(".quiz-q").appendChild(next);
      });
    });
  }

  function imEsc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function imEmph(t) {
    // **negrita**, ***negrita cursiva*** y *cursiva* (el texto ya viene escapado)
    return t.replace(/\*\*\*(?!\s)([^*]+?)\*\*\*/g, "<strong><em>$1</em></strong>")
            .replace(/\*\*(?!\s)([^*]+?)\*\*/g, "<strong>$1</strong>")
            .replace(/(^|[^\w*])\*(?![\s*])([^*]+?)\*(?![\w*])/g, "$1<em>$2</em>");
  }
  function imFormatBackticks(s) {
    var parts = s.split("`"), out = "";
    for (var i = 0; i < parts.length; i++) out += (i % 2 === 1) ? '<code class="im-inline">' + imEsc(parts[i]) + "</code>" : imEmph(imEsc(parts[i]));
    return out;
  }
  function imFormatInline(raw) {
    var re = /{{cite:([^}]*)}}([\s\S]*?){{\/cite}}/g;
    var out = "", last = 0, m;
    while ((m = re.exec(raw))) {
      out += imFormatBackticks(raw.slice(last, m.index));
      out += '<span class="im-cite" data-refs="' + m[1] + '">' + imFormatBackticks(m[2]) + ' <span aria-hidden="true">ⓘ</span></span>';
      last = re.lastIndex;
    }
    out += imFormatBackticks(raw.slice(last));
    return out;
  }
  function imLinkify(text) {
    var re = /(https?:\/\/[^\s]+)/g;
    var out = "", last = 0, m;
    while ((m = re.exec(text))) {
      out += imEsc(text.slice(last, m.index));
      var url = m[1].replace(/[.,;]+$/, "");
      out += '<a href="' + imEsc(url) + '" target="_blank" rel="noopener">' + imEsc(url) + "</a>";
      last = m.index + url.length;
    }
    out += imEsc(text.slice(last));
    return out;
  }
  function imBibText(text) {
    // *word* marks an APA-italicized container title (book/journal name+volume/etc.)
    return text.split(/(\*[^*]+\*)/g).map(function(part) {
      if (part.charAt(0) === "*" && part.charAt(part.length - 1) === "*" && part.length > 1) {
        return "<em>" + imLinkify(part.slice(1, -1)) + "</em>";
      }
      return imLinkify(part);
    }).join("");
  }

  function imRenderBlocks(blocks, keyPrefix) {
    var html = "";
    var bareTable = blocks.length === 1 && blocks[0].type === "table";
    blocks.forEach(function(b, i) {
      var key = keyPrefix + "-" + i;
      if (b.type === "p") html += '<p class="im-block-p">' + imFormatInline(b.text) + "</p>";
      else if (b.type === "h4") html += '<h4 class="im-block-h4">' + imFormatInline(b.text) + "</h4>";
      else if (b.type === "ul") html += '<ul class="im-block-ul">' + b.items.map(function(t) { return "<li>" + imFormatInline(t) + "</li>"; }).join("") + "</ul>";
      else if (b.type === "ol") html += '<ol class="im-block-ol">' + b.items.map(function(t) { return "<li>" + imFormatInline(t) + "</li>"; }).join("") + "</ol>";
      else if (b.type === "code") html += '<button class="im-code-toggle" data-im-code="' + key + '">🔎 Descubre el código</button>' +
        '<div class="im-code-box" id="im-code-' + key + '"><pre>' + imEsc(b.code) + "</pre></div>";
      else if (b.type === "table") html += imRenderTable(b, key, bareTable);
      else if (b.type === "image") html += '<figure class="im-figure"><img class="im-figure-img" src="' + imEsc(b.src) + '" alt="' + imEsc(b.alt || "") + '">' +
        (b.caption ? '<figcaption class="im-figure-caption">' + imFormatInline(b.caption) + "</figcaption>" : "") + "</figure>";
      else if (b.type === "image_modal") html += '<button class="im-img-btn" data-im-img-modal="' + key + '" data-im-img-title="' + imEsc(b.alt || "") + '">' +
        '<span class="im-img-btn-thumb" style="background-image:url(' + imEsc(b.src) + ')"></span>' +
        '<span class="im-img-btn-text"><span class="im-img-btn-label">' + imEsc(b.label || "Ver infografía") + '</span>' +
        (b.sub ? '<span class="im-img-btn-sub">' + imEsc(b.sub) + "</span>" : "") + "</span></button>" +
        '<template data-im-img-src="' + key + '"><img src="' + imEsc(b.src) + '" alt="' + imEsc(b.alt || "") + '">' +
        (b.caption ? '<figcaption class="im-figure-caption">' + imFormatInline(b.caption) + "</figcaption>" : "") + "</template>";
      else if (b.type === "image_reveal") html += '<button class="im-reveal-toggle" data-im-reveal="' + key + '">' + (b.labelClosed || "🔎 Descubre la infografía") + "</button>" +
        '<div class="im-reveal-box" id="im-reveal-' + key + '"><img src="' + imEsc(b.src) + '" alt="' + imEsc(b.alt || "") + '">' +
        (b.caption ? '<figcaption class="im-figure-caption">' + imFormatInline(b.caption) + "</figcaption>" : "") + "</div>";
      else if (b.type === "errorlist") html += '<p class="im-check-hint">Antes de abrir cada error, piensa por qué es un error. Después, toca la tarjeta para comprobarlo.</p>' +
        '<ul class="im-errorlist">' + b.items.map(function(it) {
        return '<li class="im-err-reveal"><span class="im-error-term">' + imFormatInline(it.term) + '</span><span class="im-err-cta">¿Por qué es un error? Toca para verlo ▸</span><span class="im-error-desc">' + imFormatInline(it.desc) + "</span></li>";
      }).join("") + "</ul>";
      else if (b.type === "docimg") html += '<figure class="im-docimg"><img class="im-docimg-img" src="' + imEsc(b.src) + '" alt="' + imEsc(b.alt || "") + '"' + (b.w ? ' style="width:' + b.w + 'px"' : "") + "></figure>";
      else if (b.type === "biblist") html += '<ul class="im-biblist">' + b.items.map(function(t) { return "<li>" + imBibText(t) + "</li>"; }).join("") + "</ul>";
    });
    return html;
  }
  function imWireCommon(root, data) {
    root.querySelectorAll(".im-err-reveal").forEach(function(li) {
      li.addEventListener("click", function() { li.classList.toggle("open"); });
    });
    root.querySelectorAll(".im-docimg-img").forEach(function(img) {
      img.addEventListener("click", function() { imOpenModal("Figura del manual", '<img src="' + img.src + '" alt="">', true); });
    });
    root.querySelectorAll("[data-im-check]").forEach(function(cb) {
      cb.addEventListener("change", function() {
        var key = cb.closest("[data-im-checklist]").dataset.imChecklist, saved = {};
        try { saved = JSON.parse(localStorage.getItem(key) || "{}"); } catch (e) {}
        if (cb.checked) saved[cb.dataset.imCheck] = 1; else delete saved[cb.dataset.imCheck];
        try { localStorage.setItem(key, JSON.stringify(saved)); } catch (e) {}
      });
    });
    root.querySelectorAll(".im-figure-img").forEach(function(img) {
      img.addEventListener("click", function() {
        imOpenModal(img.alt || "Infografía", '<img src="' + img.src + '" alt="' + img.alt.replace(/"/g, "&quot;") + '">', true);
      });
    });
    root.querySelectorAll("[data-im-img-modal]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var tpl = root.querySelector('[data-im-img-src="' + btn.dataset.imImgModal + '"]');
        if (tpl) imOpenModal(btn.dataset.imImgTitle || "Infografía", tpl.innerHTML, true);
      });
    });
    root.querySelectorAll("[data-im-reveal]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var box = document.getElementById("im-reveal-" + btn.dataset.imReveal);
        box.classList.toggle("open");
      });
    });
    root.querySelectorAll("[data-im-code]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var box = document.getElementById("im-code-" + btn.dataset.imCode);
        var open = box.classList.toggle("open");
        btn.textContent = open ? "🔽 Ocultar el código" : "🔎 Descubre el código";
      });
    });
    root.querySelectorAll("[data-im-table]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var tpl = root.querySelector('[data-im-table-src="' + btn.dataset.imTable + '"]');
        if (tpl) imOpenModal(btn.dataset.imTableTitle, tpl.innerHTML);
      });
    });
    root.querySelectorAll(".im-cite").forEach(function(span) {
      span.addEventListener("click", function() {
        var existing = span.nextElementSibling;
        if (existing && existing.classList && existing.classList.contains("im-cite-pop")) {
          existing.classList.toggle("open");
          return;
        }
        var refs = imRefLookup(data);
        var keys = span.dataset.refs.split(",");
        var pop = document.createElement("div");
        pop.className = "im-cite-pop open";
        pop.innerHTML = keys.map(function(k) { return "<p>" + imBibText(refs[k] || k) + "</p>"; }).join("") +
          '<p><a href="#" data-im-goto-bib="' + keys[0] + '">Ver en Bibliografía →</a></p>';
        span.parentNode.insertBefore(pop, span.nextSibling);
        pop.querySelector("[data-im-goto-bib]").addEventListener("click", function(e) {
          e.preventDefault();
          imShowBib(root, data, this.dataset.imGotoBib);
        });
      });
    });
  }
  function imRailHtml(data, activeIdx) {
    var items = '<button class="im-rail-btn" data-im-rail-home="1"><span class="im-rail-icon">🏠</span><span class="im-rail-label">Índice</span></button>';
    items += data.sections.map(function(sec, i) {
      var icon = IM_ICONS[sec.navTitle] || "📖";
      return '<button class="im-rail-btn' + (activeIdx === i ? " active" : "") + '" data-im-rail-chapter="' + i + '">' +
        '<span class="im-rail-icon">' + icon + '</span><span class="im-rail-label">' + imEsc(sec.navTitle) + "</span></button>";
    }).join("");
    if (data.references && data.references.length) {
      items += '<button class="im-rail-btn' + (activeIdx === "bib" ? " active" : "") + '" data-im-rail-bib="1">' +
        '<span class="im-rail-icon">📖</span><span class="im-rail-label">Bibliografía</span></button>';
    }
    items += '<button class="im-rail-btn im-fs-rail" data-im-fs-rail="1" title="Pantalla completa"><span class="im-rail-icon">⛶</span><span class="im-rail-label">' + (imFsElement() ? "Salir" : "Pantalla") + "</span></button>";
    return '<div class="im-rail">' + items + "</div>";
  }
  function imWireRail(root, data) {
    var homeBtn = root.querySelector("[data-im-rail-home]");
    if (homeBtn) homeBtn.addEventListener("click", function() { imShowIndex(root, data); });
    root.querySelectorAll("[data-im-rail-chapter]").forEach(function(btn) {
      btn.addEventListener("click", function() { imShowChapter(root, data, parseInt(btn.dataset.imRailChapter, 10)); });
    });
    var railBib = root.querySelector("[data-im-rail-bib]");
    if (railBib) railBib.addEventListener("click", function() { imShowBib(root, data, null); });
    var railFs = root.querySelector("[data-im-fs-rail]");
    if (railFs) railFs.addEventListener("click", function() { imToggleFullscreen(root); });
  }
  function imShowBib(root, data, highlightKey) {
    var html = imRailHtml(data, "bib");
    html += '<div class="im-chapter"><h3 class="im-chapter-title">📖 Bibliografía</h3>';
    html += '<h4 class="ref-intro">Referencias en formato APA (7ª edición)</h4>';
    html += '<div class="im-bib-list">' + data.references.map(function(r) {
      var cls = "ref-item im-bib-item" + (r.key === highlightKey ? " im-bib-highlight" : "");
      return '<p class="' + cls + '" id="im-bib-' + r.key + '">' + imBibText(r.text) + "</p>";
    }).join("") + "</div></div>";
    root.innerHTML = html;
    imWireRail(root, data);
    if (highlightKey) {
      var el = document.getElementById("im-bib-" + highlightKey);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }
  function imShowChapter(root, data, idx) {
    var sec = data.sections[idx];
    var icon = IM_ICONS[sec.navTitle] || "📖";
    var html = imRailHtml(data, idx);
    html += '<div class="im-chapter"><h3 class="im-chapter-title">' + icon + " " + imFormatInline(sec.title) + "</h3>";
    if (sec.navTitle === "Qué vas a aprender") html += '<div data-im-checklist="' + imCheckKey(root, idx) + '">' + imRenderChecklist(root, idx, sec.blocks) + "</div>";
    else html += imRenderBlocks(sec.blocks, idx + "-i");
    sec.subsections.forEach(function(sub, j) {
      html += '<div class="im-sub" data-im-sub="' + j + '">' +
        '<button class="im-sub-head"><span class="im-sub-title">' + imFormatInline(sub.title) + '</span><span class="im-sub-arrow">▶</span></button>' +
        '<div class="im-sub-body">' + imRenderBlocks(sub.blocks, idx + "-" + j) + "</div></div>";
    });
    var prev = data.sections[idx - 1], next = data.sections[idx + 1];
    html += '<div class="im-pager">' +
      (prev ? '<button class="im-prev" data-im-goto="' + (idx - 1) + '">← ' + imEsc(prev.navTitle) + "</button>" : "") +
      (next ? '<button class="im-next" data-im-goto="' + (idx + 1) + '">' + imEsc(next.navTitle) + " →</button>"
            : (data.references && data.references.length ? '<button class="im-next" data-im-goto="bib">Bibliografía →</button>' : "")) +
      "</div>";
    html += "</div>";
    root.innerHTML = html;
    imMarkVisited(root, idx);
    imScrollTop(root);
    root.querySelectorAll("[data-im-goto]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        if (btn.dataset.imGoto === "bib") imShowBib(root, data, null);
        else imShowChapter(root, data, parseInt(btn.dataset.imGoto, 10));
      });
    });
    imWireCommon(root, data);
    imWireRail(root, data);
    root.querySelectorAll(".im-sub-head").forEach(function(head) {
      head.addEventListener("click", function() {
        var thisSub = head.parentElement;
        var wasOpen = thisSub.classList.contains("open");
        root.querySelectorAll(".im-sub.open").forEach(function(s) { s.classList.remove("open"); });
        if (!wasOpen) thisSub.classList.add("open");
      });
    });
  }
  function imShowIndex(root, data) {
    var pdf = root.dataset.pdf;
    var visited = imGetVisited(root);
    var nVisited = data.sections.filter(function(s, i) { return visited[i]; }).length;
    var cards = data.sections.map(function(sec, i) {
      var icon = IM_ICONS[sec.navTitle] || "📖";
      return '<button class="im-card' + (visited[i] ? " visited" : "") + '" data-im-chapter="' + i + '" style="animation-delay:' + (i * 0.04) + 's">' +
        '<span class="im-card-icon">' + icon + '</span>' +
        '<span class="im-card-title">' + imEsc(sec.navTitle) + "</span>" +
        (sec.subsections.length ? '<span class="im-card-meta">' + sec.subsections.length + " apartados</span>" : "") +
        "</button>";
    }).join("");
    var bibCard = (data.references && data.references.length)
      ? '<button class="im-card im-card-bib" data-im-bib="1" style="animation-delay:' + (data.sections.length * 0.04) + 's">' +
        '<span class="im-card-icon">📖</span><span class="im-card-title">Bibliografía</span>' +
        '<span class="im-card-meta">' + data.references.length + ' referencias en APA 7ª ed.</span></button>'
      : "";
    var hero = '<div class="im-hero"><div class="im-hero-tools">' +
      '<button class="im-fs-btn">' + imFsLabel() + "</button>" +
      (pdf ? '<a class="im-hero-dl" href="' + imEsc(pdf) + '" download>⬇ Descargar manual en PDF</a>' : "") + "</div>" +
      '<div class="im-hero-kicker">' + imEsc(data.header.kicker) + " · " + imEsc(data.header.title) + "</div>" +
      '<h1 class="im-hero-title">' + imEsc(data.header.subtitle) + "</h1>" +
      (data.header.narrative ? '<p class="im-hero-lema">' + imEsc(data.header.narrative) + "</p>" : "") + "</div>";
    var progress = nVisited ? '<p class="im-progress">Has abierto ' + nVisited + " de " + data.sections.length + " capítulos.</p>" : "";
    root.innerHTML = hero + progress + '<div class="im-grid">' + cards + bibCard + "</div>";
    root.querySelector(".im-fs-btn").addEventListener("click", function() { imToggleFullscreen(root); });
    imScrollTop(root);
    root.querySelectorAll("[data-im-chapter]").forEach(function(btn) {
      btn.addEventListener("click", function() { imShowChapter(root, data, parseInt(btn.dataset.imChapter, 10)); });
    });
    var bibBtn = root.querySelector("[data-im-bib]");
    if (bibBtn) bibBtn.addEventListener("click", function() { imShowBib(root, data, null); });
  }
  function renderInteractiveManual(viewKey) {
    if (imRendered[viewKey]) return;
    imRendered[viewKey] = true;
    var data = IM_DATA[viewKey];
    if (!data) return;
    var root = document.getElementById("im-root-" + viewKey);
    if (!root) return;
    imShowIndex(root, data);
  }

  function wireNav() {
    document.querySelectorAll(".hub-btn").forEach(function(btn) {
      btn.addEventListener("click", function() {
        showView(btn.dataset.view);
        if (btn.dataset.view === "quiz") renderQuizStart();
        if (IM_DATA[btn.dataset.view]) renderInteractiveManual(btn.dataset.view);
      });
    });
    document.querySelectorAll("[data-back]").forEach(function(btn) {
      btn.addEventListener("click", function() { showView(btn.dataset.back); });
    });
  }

  function applyStudentVisibility(config) {
    document.querySelectorAll(".hub-btn[data-type]").forEach(function(btn) {
      var t = btn.dataset.type;
      btn.style.display = config[t] ? "" : "none";
    });
  }

  function applyTeacherHints(config) {
    document.querySelectorAll(".teacher-hint[data-hint]").forEach(function(span) {
      var t = span.dataset.hint;
      var on = !!config[t];
      span.textContent = on ? "visible" : "oculto";
      span.className = "teacher-hint " + (on ? "on" : "off");
    });
    document.querySelectorAll("#teacher-panel input[type=checkbox][data-type]").forEach(function(chk) {
      chk.checked = !!config[chk.dataset.type];
    });
  }

  function fetchConfig() {
    return fetch(LOCAL_CONFIG + "?t=" + Date.now()).then(function(r) { return r.json(); });
  }

  function ghHeaders(token) {
    return { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" };
  }

  function ghGetFile(token) {
    return fetch("https://api.github.com/repos/" + REPO + "/contents/" + GH_CONFIG_PATH, { headers: ghHeaders(token) })
      .then(function(r) {
        if (!r.ok) throw new Error("No se pudo leer el fichero (" + r.status + ")");
        return r.json();
      })
      .then(function(data) {
        configSha = data.sha;
        return JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\n/g, "")))));
      });
  }

  function ghSaveFile(token, configObj) {
    var content = btoa(unescape(encodeURIComponent(JSON.stringify(configObj, null, 2) + "\n")));
    return fetch("https://api.github.com/repos/" + REPO + "/contents/" + GH_CONFIG_PATH, {
      method: "PUT",
      headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders(token)),
      body: JSON.stringify({
        message: "Modo profesora: actualizar visibilidad de materiales (" + GH_CONFIG_PATH + ")",
        content: content,
        sha: configSha
      })
    }).then(function(r) {
      if (!r.ok) return r.text().then(function(t) { throw new Error("Error al guardar (" + r.status + "): " + t); });
      return r.json();
    }).then(function(data) {
      configSha = data.content.sha;
    });
  }

  function getToken() {
    try { return sessionStorage.getItem("gh_pat") || ""; } catch (e) { return ""; }
  }
  function setToken(t) {
    try { sessionStorage.setItem("gh_pat", t); } catch (e) {}
  }

  function setStatus(msg, isError) {
    var el = document.getElementById("teacher-status");
    if (!el) return;
    el.textContent = msg;
    el.style.color = isError ? "#FFB3B3" : "#9FE6A0";
  }

  function initTeacherPanel() {
    document.getElementById("teacher-panel").hidden = false;
    var tokenInput = document.getElementById("gh-token");
    tokenInput.value = getToken();

    document.getElementById("gh-token-save").addEventListener("click", function() {
      setToken(tokenInput.value.trim());
      setStatus(tokenInput.value.trim() ? "Token guardado para esta sesión." : "Token borrado.");
      refreshFromGithub();
    });

    document.querySelectorAll("#teacher-panel input[type=checkbox][data-type]").forEach(function(chk) {
      chk.addEventListener("change", function() {
        var token = getToken();
        if (!token) { setStatus("Pega primero tu token de GitHub.", true); chk.checked = !chk.checked; return; }
        setStatus("Guardando...");
        ghGetFile(token).then(function(current) {
          current[chk.dataset.type] = chk.checked;
          return ghSaveFile(token, current).then(function() { return current; });
        }).then(function(current) {
          applyTeacherHints(current);
          setStatus("Guardado ✓ — el alumnado lo verá en 1-2 minutos.");
        }).catch(function(err) {
          chk.checked = !chk.checked;
          setStatus(err.message, true);
        });
      });
    });

    refreshFromGithub();

    function refreshFromGithub() {
      var token = getToken();
      if (!token) { fetchConfig().then(applyTeacherHints); return; }
      setStatus("Cargando estado actual...");
      ghGetFile(token).then(function(current) {
        applyTeacherHints(current);
        setStatus("Conectado. Puedes marcar/desmarcar materiales.");
      }).catch(function(err) { setStatus(err.message, true); fetchConfig().then(applyTeacherHints); });
    }
  }

  function reveal(teacherMode) {
    isTeacher = teacherMode;
    document.getElementById("content").innerHTML = decodeURIComponent(escape(atob(PAYLOAD)));
    document.getElementById("gate").style.display = "none";
    document.getElementById("page").style.display = "block";
    wireNav();
    if (teacherMode) {
      document.querySelectorAll(".hub-btn[data-type]").forEach(function(btn) { btn.style.display = ""; });
      initTeacherPanel();
    } else {
      fetchConfig().then(applyStudentVisibility);
    }
    try { sessionStorage.setItem(SESSION_KEY, teacherMode ? "teacher" : "1"); } catch (e) {}
  }

  function tryUnlock() {
    var val = document.getElementById("pw").value;
    sha256Hex(val).then(function(hex) {
      if (hex === TEACHER_HASH) { reveal(true); return; }
      if (hex === HASH) {
        fetch(ROOT_CONFIG + "?t=" + Date.now()).then(function(r) { return r.json(); }).then(function(rootCfg) {
          if (rootCfg[TEMA_KEY] === false) {
            document.getElementById("err").textContent = "Este tema no está disponible por el momento.";
          } else {
            reveal(false);
          }
        }).catch(function() { reveal(false); });
        return;
      }
      document.getElementById("err").textContent = "Contraseña incorrecta.";
    });
  }

  document.getElementById("enter").addEventListener("click", tryUnlock);
  document.getElementById("pw").addEventListener("keydown", function(e) { if (e.key === "Enter") tryUnlock(); });

  try {
    var saved = sessionStorage.getItem(SESSION_KEY);
    if (saved === "teacher") reveal(true);
    else if (saved === "1") reveal(false);
  } catch (e) {}
})();
</script>
</body>
</html>
