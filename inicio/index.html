  var IM_DATA = {"vscode_interactivo":{"header":{"kicker":"Tema 0.","title":"Primer entorno de trabajo con Python y Visual Studio Code","subtitle":"Manual de iniciación para instalar, configurar y trabajar con proyectos Python","meta":"Material teórico | Programación para PLN | Universidad Pontificia Comillas"},"sections":[{"id":"1-introduccion","title":"1. Introducción","blocks":[{"type":"p","text":"Este manual acompaña los primeros pasos de trabajo con Python en Visual Studio Code. Está pensado para alumnado universitario que empieza a programar o que ha tenido un contacto muy limitado con la programación."},{"type":"p","text":"Visual Studio Code, que a partir de ahora llamaremos VS Code, es un editor de código. Sirve para escribir archivos de programación, organizar proyectos, abrir una terminal, instalar extensiones y ejecutar programas sin salir del mismo entorno de trabajo."},{"type":"p","text":"Python es un lenguaje de programación. Sirve para escribir instrucciones que el ordenador puede ejecutar. En asignaturas de análisis lingüístico, procesamiento del lenguaje natural o trabajo con datos, Python permite leer archivos, limpiar textos, crear tablas, calcular resultados, generar gráficos y automatizar tareas repetitivas."},{"type":"p","text":"Conviene distinguir tres ideas desde el principio:"},{"type":"ul","items":["Instalar Python significa colocar en el ordenador el programa que sabe interpretar y ejecutar código Python.","Escribir código significa crear archivos de texto, normalmente con extensión .py, que contienen instrucciones.","Ejecutar un programa significa pedirle a Python que lea ese archivo y realice las acciones que aparecen en él."]},{"type":"p","text":"Una carpeta de proyecto es una carpeta donde se guarda todo lo relacionado con una práctica o trabajo: archivos .py, datos, resultados, cuadernos, imágenes, documentación y archivo requirements.txt. La carpeta de proyecto es la unidad mínima de trabajo ordenado."},{"type":"p","text":"No conviene trabajar con archivos sueltos en Descargas o Escritorio porque esas carpetas suelen mezclar documentos distintos, capturas, instaladores y archivos temporales. Cuando se programa, muchos errores aparecen porque Python no encuentra un archivo, una tabla o una carpeta. Si todo está dentro de una carpeta de proyecto, es mucho más fácil saber dónde estamos y qué estamos ejecutando."},{"type":"p","text":"Advertencia importante: en programación, el orden de carpetas importa. Abrir un archivo suelto no es lo mismo que abrir una carpeta completa de proyecto."}],"subsections":[],"navTitle":"Introducción"},{"id":"2-instalacion-de-visual-studio-code","title":"2. Instalación de Visual Studio Code","blocks":[{"type":"p","text":"VS Code debe descargarse desde la web oficial de Visual Studio Code. No es recomendable descargarlo desde páginas de terceros."}],"subsections":[{"id":"windows","title":"Windows","blocks":[{"type":"ol","items":["Entra en la web oficial de Visual Studio Code.","Descarga el instalador para Windows.","Abre el instalador descargado.","Acepta la licencia y avanza por los pasos del asistente.","Puedes dejar las opciones por defecto."]},{"type":"ol","items":["Si aparece la opción de añadir VS Code al menú contextual, puede ser útil, pero no es imprescindible.","Finaliza la instalación."]},{"type":"p","text":"Para abrir VS Code por primera vez:"},{"type":"ol","items":["Abre el menú Inicio.","Escribe Visual Studio Code.","Pulsa sobre la aplicación."]}]},{"id":"macos","title":"macOS","blocks":[{"type":"ol","items":["Entra en la web oficial de Visual Studio Code.","Descarga la versión para macOS.","Abre el archivo descargado.","Arrastra Visual Studio Code a la carpeta Aplicaciones.","Abre VS Code desde Aplicaciones."]},{"type":"p","text":"Advertencia importante: en macOS no basta con abrir VS Code desde Descargas. Hay que moverlo a Aplicaciones para que quede instalado correctamente."}]},{"id":"abrir-una-carpeta-de-proyecto-desde-vs-code","title":"Abrir una carpeta de proyecto desde VS Code","blocks":[{"type":"p","text":"Cuando VS Code esté abierto:"},{"type":"ol","items":["Ve al menú File o Archivo.","Elige Open Folder... o Abrir carpeta....","Selecciona la carpeta del proyecto.","Confirma que confías en esa carpeta si VS Code lo pregunta."]},{"type":"p","text":"La práctica recomendada es abrir siempre la carpeta completa del proyecto, no solo un archivo .py."}]}],"navTitle":"Instalar VS Code"},{"id":"3-instalacion-de-python","title":"3. Instalación de Python","blocks":[{"type":"p","text":"Python debe instalarse desde la web oficial de Python. El objetivo es disponer de una versión moderna y estable de Python 3."},{"type":"p","text":"En julio de 2026, Python 3.14 aparece como versión estable en la página oficial de descargas de Python, y Python 3.13.x sigue disponible como rama estable ampliamente compatible. Para un curso inicial, la recomendación práctica es instalar la versión estable que indique el profesorado o, si no se especifica otra cosa, una versión moderna de Python 3; Python 3.13.x es una opción prudente cuando se busca compatibilidad con materiales docentes ya preparados."},{"type":"p","text":"No borres versiones de Python que ya vengan con el sistema. En macOS, por ejemplo, puede aparecer una versión antigua como Python 3.9 instalada por el sistema o por herramientas previas. No debe eliminarse."}],"subsections":[{"id":"windows","title":"Windows","blocks":[{"type":"ol","items":["Entra en la web oficial de Python.","Descarga el instalador de Python para Windows.","Abre el instalador.","Antes de pulsar Install Now, marca la casilla Add Python to PATH.","Continúa la instalación.","Cuando termine, cierra y vuelve a abrir PowerShell o VS Code para que el sistema reconozca Python."]},{"type":"p","text":"Advertencia importante: en Windows, marcar Add Python to PATH evita muchos errores iniciales. Si no se marca, puede aparecer el mensaje «Python no se reconoce como comando»."},{"type":"p","text":"Para comprobar la instalación en Windows, abre PowerShell o la Terminal integrada de VS Code y ejecuta:"},{"type":"code","code":"python --version"},{"type":"p","text":"También puedes comprobar el lanzador de Python para Windows:"},{"type":"code","code":"py --version"},{"type":"p","text":"Si todo está bien, verás una respuesta parecida a:"},{"type":"code","code":"Python 3.13.14"},{"type":"p","text":"o una versión moderna equivalente de Python 3."}]},{"id":"macos","title":"macOS","blocks":[{"type":"ol","items":["Entra en la web oficial de Python.","Descarga el instalador para macOS.","Abre el archivo .pkg.","Sigue los pasos del asistente.","Cuando termine, abre Terminal o la Terminal integrada de VS Code."]},{"type":"p","text":"En macOS, normalmente se usa el comando python3 para llamar a Python 3:"},{"type":"code","code":"python3 --version"},{"type":"p","text":"Si has instalado una versión concreta como Python 3.13, también puede funcionar:"},{"type":"code","code":"python3.13 --version"},{"type":"p","text":"Si aparece Python 3.9 al ejecutar algún comando, no significa necesariamente que la instalación nueva esté mal. Puede significar que el sistema está mostrando otra versión. Lo importante es identificar qué comando llama a la versión que vas a usar en el proyecto."}]}],"navTitle":"Instalar Python"},{"id":"4-instalacion-de-extensiones-de-vs-code","title":"4. Instalación de extensiones de VS Code","blocks":[{"type":"p","text":"Las extensiones son complementos que añaden funciones a VS Code. Para trabajar con Python, las extensiones ayudan a detectar errores, seleccionar el intérprete, ejecutar archivos, depurar código y trabajar con cuadernos."},{"type":"p","text":"Para instalar extensiones:"},{"type":"ol","items":["Abre VS Code.","Pulsa el icono de extensiones en la barra lateral izquierda.","Busca el nombre de la extensión.","Comprueba que el editor sea Microsoft cuando corresponda.","Pulsa Install."]},{"type":"p","text":"Instala o comprueba estas extensiones:"},{"type":"table","rows":[["Extensión","Editor","Para qué sirve"],["Python","Microsoft","Permite trabajar con archivos .py, seleccionar intérpretes, ejecutar código y depurar programas."],["Pylance","Microsoft","Mejora la ayuda mientras escribes: autocompletado, avisos y detección de errores."],["Jupyter","Microsoft","Permite abrir y ejecutar cuadernos .ipynb dentro de VS Code."]],"title":"Extensiones recomendadas"},{"type":"p","text":"La extensión Python suele instalar o sugerir extensiones relacionadas, como Pylance. Si Pylance ya aparece instalada, no hace falta instalarla de nuevo."},{"type":"p","text":"Jupyter solo es imprescindible si se van a usar cuadernos .ipynb. Si la asignatura trabaja solo con archivos .py, puede instalarse más adelante."}],"subsections":[],"navTitle":"Extensiones de VS Code"},{"id":"5-uso-de-la-terminal-integrada-de-vs-code","title":"5. Uso de la Terminal integrada de VS Code","blocks":[{"type":"p","text":"La Terminal integrada permite escribir comandos sin salir de VS Code. Un comando es una instrucción breve que se escribe en una línea para pedirle algo al sistema: mostrar la carpeta actual, crear un entorno virtual, instalar paquetes o ejecutar un archivo."},{"type":"p","text":"Para abrir la Terminal integrada:"},{"type":"ol","items":["Abre VS Code.","Ve al menú Terminal.","Pulsa New Terminal o Nueva terminal."]},{"type":"p","text":"En Windows, lo habitual es que aparezca PowerShell. PowerShell es una terminal: una ventana donde se escriben comandos. No necesitas aprender PowerShell en profundidad para empezar; basta con usar algunos comandos básicos."},{"type":"p","text":"En macOS, lo habitual es que aparezca una terminal con zsh. También es una ventana de comandos. Igual que en Windows, al principio solo necesitas unos pocos comandos."}],"subsections":[{"id":"comprobar-en-que-carpeta-estamos","title":"Comprobar en qué carpeta estamos","blocks":[{"type":"p","text":"En Windows, puedes usar:"},{"type":"code","code":"pwd"},{"type":"p","text":"También puedes usar:"},{"type":"code","code":"cd"},{"type":"p","text":"En macOS, usa:"},{"type":"code","code":"pwd"},{"type":"p","text":"El resultado muestra la carpeta actual. Esa carpeta es importante porque los comandos se ejecutan desde ahí."}]},{"id":"cambiar-de-carpeta","title":"Cambiar de carpeta","blocks":[{"type":"p","text":"Para entrar en una carpeta, se usa cd, que significa cambiar de directorio."},{"type":"p","text":"Ejemplo en Windows:"},{"type":"code","code":"cd Documents\\python-proyectos\\prueba-python"},{"type":"p","text":"Ejemplo en macOS:"},{"type":"code","code":"cd Documents/python-proyectos/prueba-python"},{"type":"p","text":"Si la ruta tiene espacios, conviene escribirla entre comillas."},{"type":"p","text":"Ejemplo en Windows:"},{"type":"code","code":"cd \"Documents\\Mis proyectos\\prueba-python\""},{"type":"p","text":"Ejemplo en macOS:"},{"type":"code","code":"cd \"Documents/Mis proyectos/prueba-python\""},{"type":"p","text":"Advertencia importante: muchos errores no se deben al código, sino a estar en la carpeta equivocada. Antes de instalar paquetes o ejecutar un archivo, comprueba la carpeta actual."}]}],"navTitle":"La Terminal de VS Code"},{"id":"6-creacion-de-una-carpeta-de-proyecto","title":"6. Creación de una carpeta de proyecto","blocks":[{"type":"p","text":"Cada práctica debe tener su propia carpeta. Una estructura ordenada ayuda a no perder archivos y a evitar errores."},{"type":"p","text":"Ejemplo recomendado en Windows:"},{"type":"code","code":"C:\\Users\\Nombre\\Documents\\python-proyectos\\prueba-python"},{"type":"p","text":"Ejemplo recomendado en macOS:"},{"type":"code","code":"/Users/nombre/Documents/python-proyectos/prueba-python"},{"type":"p","text":"Puedes crear la carpeta desde el explorador de archivos o desde la terminal."},{"type":"p","text":"En Windows:"},{"type":"code","code":"mkdir Documents\\python-proyectos\\prueba-python\ncd Documents\\python-proyectos\\prueba-python"},{"type":"p","text":"En macOS:"},{"type":"code","code":"mkdir -p Documents/python-proyectos/prueba-python\ncd Documents/python-proyectos/prueba-python"},{"type":"p","text":"Después, abre esa carpeta completa en VS Code:"},{"type":"ol","items":["File o Archivo.","Open Folder... o Abrir carpeta....","Selecciona prueba-python."]},{"type":"p","text":"La carpeta completa debe aparecer en la barra lateral izquierda de VS Code."}],"subsections":[],"navTitle":"Carpeta de proyecto"},{"id":"7-primer-archivo-python","title":"7. Primer archivo Python","blocks":[{"type":"p","text":"Dentro de la carpeta del proyecto, crea un archivo llamado:"},{"type":"code","code":"prueba.py"},{"type":"p","text":"Escribe este código:"},{"type":"code","code":"print(\"Hola, Python\")"},{"type":"p","text":"Guarda el archivo."},{"type":"p","text":"print() es una instrucción de Python que muestra texto en pantalla. En este caso, el texto que debe aparecer es:"},{"type":"code","code":"Hola, Python"}],"subsections":[{"id":"ejecutar-desde-vs-code","title":"Ejecutar desde VS Code","blocks":[{"type":"p","text":"Con el archivo prueba.py abierto, puedes pulsar el botón de ejecución de Python si aparece en la parte superior derecha. VS Code abrirá una terminal y ejecutará el archivo."}]},{"id":"ejecutar-desde-la-terminal","title":"Ejecutar desde la Terminal","blocks":[{"type":"p","text":"En Windows:"},{"type":"code","code":"python prueba.py"},{"type":"p","text":"Si ese comando no funciona, prueba:"},{"type":"code","code":"py prueba.py"},{"type":"p","text":"En macOS:"},{"type":"code","code":"python3 prueba.py"},{"type":"p","text":"El resultado esperado es:"},{"type":"code","code":"Hola, Python"},{"type":"p","text":"Si aparece un error indicando que no se encuentra el archivo, revisa dos cosas:"},{"type":"ul","items":["Que el archivo se llama exactamente prueba.py.","Que la Terminal está situada dentro de la carpeta del proyecto."]}]}],"navTitle":"Primer archivo Python"},{"id":"8-entornos-virtuales","title":"8. Entornos virtuales","blocks":[{"type":"p","text":"Un entorno virtual es una copia aislada de Python para un proyecto concreto. La metáfora más sencilla es pensar en una mochila de trabajo: cada proyecto tiene su propia mochila, con sus propios paquetes, versiones y herramientas."},{"type":"p","text":"Si instalas todos los paquetes en el Python global del sistema, con el tiempo unos proyectos pueden interferir con otros. Un proyecto puede necesitar una versión de una librería y otro proyecto puede necesitar otra. El entorno virtual evita esos conflictos."},{"type":"p","text":"Por eso se recomienda usar un entorno virtual por proyecto."},{"type":"p","text":"La carpeta habitual del entorno virtual se llama:"},{"type":"code","code":".venv"},{"type":"p","text":"El punto inicial indica que es una carpeta técnica del proyecto. No debes escribir código dentro de .venv, ni mover archivos manualmente dentro de ella. Python y pip la gestionan por ti."},{"type":"p","text":"Advertencia importante: no instales todos los paquetes en el Python global del sistema. Para las prácticas, activa primero el entorno virtual del proyecto."}],"subsections":[],"navTitle":"Entornos virtuales"},{"id":"9-crear-un-entorno-virtual-en-windows","title":"9. Crear un entorno virtual en Windows","blocks":[{"type":"p","text":"Primero, abre la carpeta del proyecto en VS Code. Después abre la Terminal integrada y comprueba que estás dentro de la carpeta correcta:"},{"type":"code","code":"pwd"},{"type":"p","text":"Para crear el entorno virtual:"},{"type":"code","code":"python -m venv .venv"},{"type":"p","text":"Si python no funciona, usa:"},{"type":"code","code":"py -m venv .venv"},{"type":"p","text":"Este comando crea una carpeta .venv dentro del proyecto."},{"type":"p","text":"Para activar el entorno virtual en Windows:"},{"type":"code","code":".venv\\Scripts\\activate"},{"type":"p","text":"Cuando esté activado, verás (.venv) al inicio de la línea de la terminal:"},{"type":"code","code":"(.venv) PS C:\\Users\\Nombre\\Documents\\python-proyectos\\prueba-python>"},{"type":"p","text":"Para comprobar qué Python se está usando:"},{"type":"code","code":"python --version"},{"type":"p","text":"Y para ver la ruta del ejecutable de Python:"},{"type":"code","code":"where python"},{"type":"p","text":"La ruta debería apuntar a la carpeta .venv del proyecto."},{"type":"p","text":"Si PowerShell bloquea la activación por política de ejecución, puede aparecer un mensaje sobre scripts deshabilitados. En ese caso, avisa al profesorado o consulta la guía específica de la asignatura antes de cambiar la configuración del sistema."}],"subsections":[],"navTitle":"Entorno virtual (Windows)"},{"id":"10-crear-un-entorno-virtual-en-macos","title":"10. Crear un entorno virtual en macOS","blocks":[{"type":"p","text":"Primero, abre la carpeta del proyecto en VS Code. Después abre la Terminal integrada y comprueba que estás dentro de la carpeta correcta:"},{"type":"code","code":"pwd"},{"type":"p","text":"Para crear el entorno virtual:"},{"type":"code","code":"python3 -m venv .venv"},{"type":"p","text":"Si quieres usar una versión concreta y está instalada, por ejemplo Python 3.13:"},{"type":"code","code":"python3.13 -m venv .venv"},{"type":"p","text":"Para activar el entorno virtual en macOS:"},{"type":"code","code":"source .venv/bin/activate"},{"type":"p","text":"Cuando esté activado, verás (.venv) al inicio de la línea de la terminal:"},{"type":"code","code":"(.venv) nombre@MacBook prueba-python %"},{"type":"p","text":"Para comprobar la versión de Python dentro del entorno:"},{"type":"code","code":"python --version"},{"type":"p","text":"Para ver qué ejecutable de Python se está usando:"},{"type":"code","code":"which python"},{"type":"p","text":"La ruta debería apuntar a la carpeta .venv del proyecto."}],"subsections":[],"navTitle":"Entorno virtual (macOS)"},{"id":"11-seleccionar-el-interprete-de-python-en-vs-code","title":"11. Seleccionar el intérprete de Python en VS Code","blocks":[{"type":"p","text":"El intérprete de Python es el programa concreto que VS Code usa para ejecutar tu código. Si tienes varios Python instalados, VS Code necesita saber cuál debe usar."},{"type":"p","text":"Cuando trabajas con un entorno virtual, debes seleccionar el intérprete que está dentro de .venv."},{"type":"p","text":"En Windows:"},{"type":"ol","items":["Pulsa Ctrl + Shift + P.","Escribe Python: Select Interpreter.","Elige la opción que contenga .venv."]},{"type":"p","text":"En macOS:"},{"type":"ol","items":["Pulsa Cmd + Shift + P.","Escribe Python: Select Interpreter.","Elige la opción que contenga .venv."]},{"type":"p","text":"Si VS Code usa otro Python, puede ocurrir esto:"},{"type":"ul","items":["instalas pandas en .venv;","ejecutas el archivo desde VS Code;","VS Code usa el Python global;","aparece ModuleNotFoundError: No module named 'pandas'."]},{"type":"p","text":"El paquete sí está instalado, pero en otro entorno. Por eso seleccionar el intérprete correcto es tan importante."}],"subsections":[],"navTitle":"Seleccionar intérprete"},{"id":"12-instalacion-de-paquetes-con-pip","title":"12. Instalación de paquetes con pip","blocks":[{"type":"p","text":"pip es la herramienta que instala paquetes de Python. Un paquete es código ya preparado por otras personas o equipos para realizar tareas concretas."},{"type":"p","text":"Antes de instalar paquetes, activa el entorno virtual."},{"type":"p","text":"En Windows:"},{"type":"code","code":".venv\\Scripts\\activate"},{"type":"p","text":"En macOS:"},{"type":"code","code":"source .venv/bin/activate"},{"type":"p","text":"Después, instala paquetes con:"},{"type":"code","code":"python -m pip install nombre_paquete"},{"type":"p","text":"Usar python -m pip ayuda a que el paquete se instale en el Python activo, no en otro Python del sistema."},{"type":"p","text":"Para instalar paquetes básicos de trabajo con datos y cuadernos:"},{"type":"code","code":"python -m pip install pandas numpy matplotlib jupyter"},{"type":"p","text":"Para comprobar qué paquetes hay instalados:"},{"type":"code","code":"python -m pip list"},{"type":"p","text":"Advertencia importante: no uses sudo pip install para este manual inicial. Si necesitas permisos de administrador para instalar paquetes, probablemente estás instalando en el lugar equivocado."}],"subsections":[],"navTitle":"Instalar paquetes con pip"},{"id":"13-prueba-completa-con-pandas","title":"13. Prueba completa con pandas","blocks":[{"type":"p","text":"Vamos a comprobar que el entorno virtual, VS Code y los paquetes funcionan correctamente."},{"type":"p","text":"Crea un archivo llamado:"},{"type":"code","code":"test_pandas.py"},{"type":"p","text":"Escribe este código:"},{"type":"code","code":"import pandas as pd\n\ndatos = {\n    \"nombre\": [\"Ana\", \"Luis\", \"Marta\"],\n    \"nota\": [8.5, 7.0, 9.25],\n}\n\ntabla = pd.DataFrame(datos)\n\nprint(\"Tabla de notas:\")\nprint(tabla)\n\nmedia = tabla[\"nota\"].mean()\nprint(\"Nota media:\", media)"},{"type":"p","text":"Este programa hace cuatro cosas:"},{"type":"ul","items":["importa la librería pandas;","crea unos datos sencillos con nombres y notas;","convierte esos datos en una tabla;","calcula la media de la columna nota."]},{"type":"p","text":"Antes de ejecutarlo, asegúrate de que el entorno está activado y de que pandas está instalado."},{"type":"p","text":"En Windows:"},{"type":"code","code":"python test_pandas.py"},{"type":"p","text":"Si es necesario:"},{"type":"code","code":"py test_pandas.py"},{"type":"p","text":"En macOS:"},{"type":"code","code":"python test_pandas.py"},{"type":"p","text":"Si no has activado el entorno y estás usando el Python del sistema, puede que tengas que revisar la activación. Dentro de .venv, el comando python debería funcionar en ambos sistemas."},{"type":"p","text":"El resultado esperado será parecido a:"},{"type":"code","code":"Tabla de notas:\n  nombre  nota\n0    Ana  8.50\n1   Luis  7.00\n2  Marta  9.25\nNota media: 8.25"},{"type":"p","text":"Si aparece ModuleNotFoundError, revisa la sección de errores frecuentes."}],"subsections":[],"navTitle":"Prueba con pandas"},{"id":"14-archivo-requirements-txt","title":"14. Archivo requirements.txt","blocks":[{"type":"p","text":"El archivo requirements.txt sirve para guardar la lista de paquetes que necesita un proyecto. Es una forma sencilla de dejar constancia del entorno usado."},{"type":"p","text":"Para crear o actualizar requirements.txt, con el entorno virtual activado:"},{"type":"code","code":"python -m pip freeze > requirements.txt"},{"type":"p","text":"Este comando escribe en requirements.txt los paquetes instalados y sus versiones."},{"type":"p","text":"Para reinstalar dependencias en otro ordenador o en otro entorno virtual:"},{"type":"code","code":"python -m pip install -r requirements.txt"},{"type":"p","text":"Esto es importante en trabajos académicos, proyectos compartidos y repositorios de GitHub porque permite que otra persona reconstruya el entorno de trabajo."},{"type":"p","text":"Advertencia importante: requirements.txt no guarda tus archivos de código ni tus datos. Solo guarda la lista de paquetes."}],"subsections":[],"navTitle":"requirements.txt"},{"id":"15-que-subir-y-que-no-subir-a-github","title":"15. Qué subir y qué no subir a GitHub","blocks":[{"type":"p","text":"GitHub se usa para guardar y compartir proyectos de código. No todo lo que hay dentro de una carpeta de proyecto debe subirse."},{"type":"p","text":"No conviene subir la carpeta .venv porque puede ocupar mucho espacio, depende del sistema operativo y se puede reconstruir con requirements.txt."},{"type":"p","text":"Sí conviene subir:"},{"type":"ul","items":["archivos .py;","cuadernos .ipynb si forman parte de la entrega;","archivos de datos permitidos por la práctica;","README.md;","requirements.txt;","documentación necesaria del proyecto."]},{"type":"p","text":"Un archivo .gitignore indica qué archivos o carpetas no deben subirse a GitHub."},{"type":"p","text":"Propuesta básica de .gitignore:"},{"type":"code","code":".venv/\n__pycache__/\n.DS_Store"},{"type":"p","text":"Qué significa cada entrada:"},{"type":"table","rows":[["Entrada","Significado"],[".venv/","No subir el entorno virtual del proyecto."],["__pycache__/","No subir archivos internos que Python genera automáticamente."],[".DS_Store","No subir archivos ocultos que macOS crea en carpetas."]],"title":"Qué subir y qué no subir"}],"subsections":[],"navTitle":"Qué subir a GitHub"},{"id":"16-estructura-recomendada-de-un-proyecto","title":"16. Estructura recomendada de un proyecto","blocks":[{"type":"p","text":"Una estructura sencilla para empezar puede ser:"},{"type":"code","code":"mi-proyecto/\n├── .venv/\n├── datos/\n├── notebooks/\n├── src/\n├── resultados/\n├── README.md\n├── requirements.txt\n└── main.py"},{"type":"p","text":"Qué se guarda en cada lugar:"},{"type":"table","rows":[["Elemento","Uso recomendado"],[".venv/","Entorno virtual del proyecto. No se edita manualmente y no se sube a GitHub."],["datos/","Archivos de entrada: CSV, TXT, JSON u otros datos de trabajo."],["notebooks/","Cuadernos .ipynb, si la práctica usa Jupyter."],["src/","Código fuente organizado en módulos o scripts."],["resultados/","Tablas, gráficos o archivos generados por el programa."],["README.md","Descripción del proyecto, instrucciones de ejecución y notas de entrega."],["requirements.txt","Lista de paquetes necesarios."],["main.py","Archivo principal del proyecto cuando se usa un script único."]],"title":"Estructura de carpetas y ficheros"},{"type":"p","text":"Para una primera práctica, puede bastar con:"},{"type":"code","code":"prueba-python/\n├── .venv/\n├── prueba.py\n├── test_pandas.py\n└── requirements.txt"},{"type":"p","text":"La estructura puede crecer cuando el proyecto lo necesite."}],"subsections":[],"navTitle":"Estructura de proyecto"},{"id":"17-errores-frecuentes-y-soluciones","title":"17. Errores frecuentes y soluciones","blocks":[],"subsections":[{"id":"python-no-se-reconoce-como-comando-en-windows","title":"«Python no se reconoce como comando» en Windows","blocks":[{"type":"p","text":"Este error suele significar que Windows no encuentra Python."},{"type":"p","text":"Prueba:"},{"type":"code","code":"py --version"},{"type":"p","text":"Si py funciona, puedes usar:"},{"type":"code","code":"py -m venv .venv"},{"type":"p","text":"Si ni python ni py funcionan, probablemente Python no está bien instalado o no se añadió al PATH. Reinstala Python desde la web oficial y marca Add Python to PATH."}]},{"id":"en-macos-aparece-python-3-9-aunque-he-instalado-python-3-13","title":"En macOS aparece Python 3.9 aunque he instalado Python 3.13","blocks":[{"type":"p","text":"No borres Python 3.9. Puede pertenecer al sistema o a una herramienta instalada previamente."},{"type":"p","text":"Comprueba:"},{"type":"code","code":"python3 --version"},{"type":"p","text":"Y, si procede:"},{"type":"code","code":"python3.13 --version"},{"type":"p","text":"Para crear el entorno con Python 3.13:"},{"type":"code","code":"python3.13 -m venv .venv"},{"type":"p","text":"Después de activar .venv, comprueba:"},{"type":"code","code":"python --version"}]},{"id":"vs-code-no-encuentra-pandas","title":"VS Code no encuentra pandas","blocks":[{"type":"p","text":"Puede que pandas esté instalado en un entorno, pero VS Code esté usando otro."},{"type":"p","text":"Comprueba en la Terminal integrada:"},{"type":"code","code":"python -m pip show pandas"},{"type":"p","text":"Después selecciona el intérprete correcto:"},{"type":"code","code":"Python: Select Interpreter"},{"type":"p","text":"Elige el que contenga .venv."}]},{"id":"he-instalado-un-paquete-pero-mi-script-dice-modulenotfounder","title":"He instalado un paquete pero mi script dice ModuleNotFoundError","blocks":[{"type":"p","text":"Este error significa que Python no encuentra el paquete."},{"type":"p","text":"Comprueba que el entorno está activado:"},{"type":"code","code":"python -m pip list"},{"type":"p","text":"Si el paquete no aparece, instálalo:"},{"type":"code","code":"python -m pip install pandas"},{"type":"p","text":"Si aparece en la lista pero el script falla, probablemente VS Code está usando otro intérprete."}]},{"id":"no-aparece-venv-en-la-terminal","title":"No aparece (.venv) en la Terminal","blocks":[{"type":"p","text":"El entorno virtual no está activado."},{"type":"p","text":"En Windows:"},{"type":"code","code":".venv\\Scripts\\activate"},{"type":"p","text":"En macOS:"},{"type":"code","code":"source .venv/bin/activate"},{"type":"p","text":"Si activas el entorno y aun así no aparece (.venv), cierra la Terminal integrada y abre una nueva."}]},{"id":"he-creado-venv-en-la-carpeta-equivocada","title":"He creado .venv en la carpeta equivocada","blocks":[{"type":"p","text":"Si creas .venv fuera de la carpeta del proyecto, VS Code puede confundirse."},{"type":"p","text":"Primero comprueba dónde estás:"},{"type":"code","code":"pwd"},{"type":"p","text":"Si .venv se creó en otra carpeta y todavía no has instalado nada importante, puedes borrarla desde el explorador de archivos y volver a crearla dentro de la carpeta correcta. No borres carpetas si no tienes claro qué contienen."}]},{"id":"estoy-ejecutando-el-archivo-desde-una-carpeta-incorrecta","title":"Estoy ejecutando el archivo desde una carpeta incorrecta","blocks":[{"type":"p","text":"Si Python dice que no encuentra prueba.py, comprueba:"},{"type":"code","code":"pwd"},{"type":"p","text":"Después lista los archivos."},{"type":"p","text":"En Windows:"},{"type":"code","code":"dir"},{"type":"p","text":"En macOS:"},{"type":"code","code":"ls"},{"type":"p","text":"El archivo que quieres ejecutar debe aparecer en esa lista."}]},{"id":"vs-code-ha-seleccionado-otro-interprete","title":"VS Code ha seleccionado otro intérprete","blocks":[{"type":"p","text":"Abre la paleta de comandos:"},{"type":"p","text":"Windows:"},{"type":"code","code":"Ctrl + Shift + P"},{"type":"p","text":"macOS:"},{"type":"code","code":"Cmd + Shift + P"},{"type":"p","text":"Busca:"},{"type":"code","code":"Python: Select Interpreter"},{"type":"p","text":"Selecciona el intérprete que contenga .venv."}]},{"id":"diferencia-entre-python-python3-python3-13-y-py","title":"Diferencia entre python, python3, python3.13 y py","blocks":[{"type":"table","rows":[["Comando","Uso habitual"],["python","En Windows suele llamar a Python. Dentro de .venv, debe llamar al Python del entorno en ambos sistemas."],["python3","En macOS suele llamar a Python 3."],["python3.13","Llama a una versión concreta si está instalada."],["py","Lanzador de Python en Windows. Sirve para localizar y ejecutar versiones instaladas."]],"title":"Comandos python, python3 y py"},{"type":"p","text":"Regla práctica:"},{"type":"ul","items":["En Windows, prueba primero python; si falla, usa py.","En macOS, antes de crear .venv, usa python3 o python3.13.","Dentro del entorno virtual activado, usa python."]}]}],"navTitle":"Errores frecuentes"},{"id":"18-flujo-de-trabajo-recomendado-para-cada-practica","title":"18. Flujo de trabajo recomendado para cada práctica","blocks":[{"type":"p","text":"Cada vez que empieces una práctica, sigue este orden:"},{"type":"ol","items":["Abre VS Code.","Abre la carpeta completa del proyecto.","Abre la Terminal integrada.","Activa el entorno virtual.","Comprueba la versión de Python.","Ejecuta el archivo principal.","Instala paquetes si hacen falta.","Actualiza requirements.txt."]},{"type":"p","text":"En Windows:"},{"type":"code","code":".venv\\Scripts\\activate\npython --version\npython main.py\npython -m pip install nombre_paquete\npython -m pip freeze > requirements.txt"},{"type":"p","text":"En macOS:"},{"type":"code","code":"source .venv/bin/activate\npython --version\npython main.py\npython -m pip install nombre_paquete\npython -m pip freeze > requirements.txt"},{"type":"p","text":"Si el proyecto todavía no tiene entorno virtual, créalo antes."},{"type":"p","text":"Windows:"},{"type":"code","code":"python -m venv .venv"},{"type":"p","text":"macOS:"},{"type":"code","code":"python3 -m venv .venv"},{"type":"p","text":"Después actívalo y selecciona el intérprete .venv en VS Code."}],"subsections":[],"navTitle":"Flujo de trabajo"},{"id":"19-resumen-final","title":"19. Resumen final","blocks":[{"type":"p","text":"Trabajar con Python de forma ordenada no consiste solo en escribir código. También implica saber dónde está el proyecto, qué Python se está usando, qué paquetes están instalados y cómo puede otra persona reproducir el entorno."},{"type":"p","text":"La secuencia básica es:"},{"type":"ol","items":["Crear una carpeta de proyecto.","Abrir esa carpeta completa en VS Code.","Crear un entorno virtual .venv.","Activar el entorno virtual.","Seleccionar el intérprete correcto en VS Code.","Instalar paquetes con python -m pip.","Ejecutar los archivos .py.","Guardar dependencias en requirements.txt."]}],"subsections":[{"id":"comandos-esenciales-para-windows","title":"Comandos esenciales para Windows","blocks":[{"type":"code","code":"python --version\npy --version\npython -m venv .venv\n.venv\\Scripts\\activate\npython -m pip install pandas numpy matplotlib jupyter\npython prueba.py\npython -m pip freeze > requirements.txt\npython -m pip install -r requirements.txt\nwhere python"}]},{"id":"comandos-esenciales-para-macos","title":"Comandos esenciales para macOS","blocks":[{"type":"code","code":"python3 --version\npython3.13 --version\npython3 -m venv .venv\nsource .venv/bin/activate\npython -m pip install pandas numpy matplotlib jupyter\npython prueba.py\npython -m pip freeze > requirements.txt\npython -m pip install -r requirements.txt\nwhich python"}]},{"id":"tabla-comparativa-de-comandos-principales","title":"Tabla comparativa de comandos principales","blocks":[{"type":"table","rows":[["Tarea","Windows","macOS"],["Crear entorno","python -m venv .venv o py -m venv .venv","python3 -m venv .venv o python3.13 -m venv .venv"],["Activar entorno",".venv\\Scripts\\activate","source .venv/bin/activate"],["Comprobar Python","python --version o py --version","python3 --version; dentro de .venv, python --version"],["Instalar paquete","python -m pip install nombre_paquete","python -m pip install nombre_paquete"],["Ejecutar archivo","python prueba.py o py prueba.py","python prueba.py dentro de .venv; antes de activarlo, python3 prueba.py"],["Crear requirements.txt","python -m pip freeze > requirements.txt","python -m pip freeze > requirements.txt"],["Reinstalar dependencias","python -m pip install -r requirements.txt","python -m pip install -r requirements.txt"],["Localizar Python activo","where python","which python"]],"title":"Comandos: Windows frente a macOS"},{"type":"p","text":"Nota final: existen herramientas más avanzadas para gestionar entornos y proyectos, como Conda, Poetry, uv o Docker. No se tratan en este manual inicial porque el objetivo es dominar primero el flujo básico con Python, VS Code, venv y pip."}]}],"navTitle":"Resumen final"}],"references":[{"key":"ms_getting_started","text":"Microsoft. (s. f.). Getting started with Python in VS Code. *Visual Studio Code Documentation*. https://code.visualstudio.com/docs/python/python-tutorial"},{"key":"ms_python_vscode","text":"Microsoft. (s. f.). Python in Visual Studio Code. *Visual Studio Code Documentation*. https://code.visualstudio.com/docs/languages/python"},{"key":"ms_download_vscode","text":"Microsoft. (s. f.). *Download Visual Studio Code*. https://code.visualstudio.com/download"},{"key":"psf_download_python","text":"Python Software Foundation. (s. f.). *Download Python*. https://www.python.org/downloads/"},{"key":"psf_venv","text":"Python Software Foundation. (s. f.). venv: Creation of virtual environments. *Python Documentation*. https://docs.python.org/3/library/venv.html"}]},"ipynb_interactivo":{"header":{"kicker":"Tema introductorio","title":"Trabajar con ficheros .ipynb","subtitle":"Guía paso a paso para abrir, ejecutar y guardar cuadernos en Google Colab y Visual Studio Code","meta":"Material complementario | Programación para PLN | Universidad Pontificia Comillas"},"sections":[{"id":"titulo-narrativo","title":"Título narrativo","blocks":[],"subsections":[{"id":"del-fichero-recibido-al-cuaderno-listo-para-trabajar","title":"Del fichero recibido al cuaderno listo para trabajar","blocks":[{"type":"p","text":"Imagina que recibes por correo o por el campus virtual un fichero llamado practica_tokenizacion.ipynb. El contenido está completo, pero el fichero no se comporta como un documento de texto convencional: al hacer doble clic, el sistema puede no saber con qué programa abrirlo. La tarea consiste en elegir un entorno de trabajo, abrir el cuaderno sin alterar su estructura y dejarlo preparado para leer, editar y ejecutar sus celdas."}]}],"navTitle":"Del fichero al cuaderno"},{"id":"contexto-profesional","title":"Contexto profesional","blocks":[{"type":"p","text":"Los cuadernos Jupyter se utilizan con frecuencia en programación, análisis de datos y procesamiento del lenguaje natural porque permiten reunir en un mismo archivo explicaciones, código ejecutable, fórmulas, imágenes y resultados. Esta combinación facilita que un procedimiento técnico sea reproducible y que otra persona pueda seguirlo paso a paso."},{"type":"p","text":"En una asignatura de Programación para PLN, un fichero .ipynb puede contener la explicación de una técnica, ejemplos en Python, ejercicios y resultados parciales. Abrirlo correctamente es el primer requisito para trabajar con él: si se abre como texto sin formato, se verá su representación interna en JSON; si se abre en un entorno de cuadernos, aparecerá organizado en celdas legibles y ejecutables."}],"subsections":[],"navTitle":"Contexto profesional"},{"id":"encargo","title":"Encargo","blocks":[{"type":"p","text":"Debes abrir un fichero .ipynb por dos vías distintas:"},{"type":"ol","items":["En Google Colab, dentro del navegador y con la ejecución alojada en los servidores de Google.","En Visual Studio Code, como archivo local y con un entorno de Python instalado o seleccionado en el equipo."]},{"type":"p","text":"El objetivo no es solo conseguir que el fichero «se vea». Al terminar, debes saber comprobar que el cuaderno está en el entorno correcto, distinguir entre abrir y ejecutar, seleccionar un núcleo cuando sea necesario y guardar los cambios sin perder el archivo original."}],"subsections":[],"navTitle":"Encargo"},{"id":"caso-de-trabajo-inicial","title":"Caso de trabajo inicial","blocks":[{"type":"p","text":"Supongamos que el fichero se llama introduccion_pln.ipynb y está guardado en la carpeta Descargas. Puede proceder del campus virtual, de un mensaje de correo o de una carpeta compartida. Antes de empezar, conviene verificar tres datos:"},{"type":"ul","items":["El nombre termina realmente en .ipynb.","El fichero se ha descargado por completo y no tiene un tamaño de 0 KB.","Se conoce su ubicación, por ejemplo, Descargas, Documentos o una carpeta de la asignatura."]},{"type":"p","text":"> Idea clave. Abrir un cuaderno y ejecutar un cuaderno son acciones diferentes. Se puede leer un .ipynb sin ejecutar ninguna celda. La ejecución comienza únicamente cuando se pulsa el botón correspondiente o se utiliza un atajo de teclado."}],"subsections":[],"navTitle":"Caso de trabajo"},{"id":"que-vas-a-aprender-en-esta-unidad","title":"Qué vas a aprender en esta unidad","blocks":[{"type":"p","text":"Al finalizar este manual podrás:"},{"type":"ul","items":["Reconocer qué información contiene un fichero .ipynb.","Decidir cuándo conviene usar Google Colab y cuándo Visual Studio Code.","Importar un cuaderno local en Google Colab.","Abrir un cuaderno local con Visual Studio Code.","Instalar o comprobar las extensiones necesarias en Visual Studio Code.","Seleccionar un núcleo de Python para ejecutar las celdas.","Guardar una copia y localizar el fichero modificado.","Resolver los errores iniciales más frecuentes."]}],"subsections":[],"navTitle":"Qué vas a aprender"},{"id":"mapa-conceptual-de-la-unidad","title":"Mapa conceptual de la unidad","blocks":[{"type":"table","rows":[["Punto de decisión","Google Colab","Visual Studio Code"],["Lugar de trabajo","Navegador web","Aplicación instalada"],["Ubicación habitual del fichero","Se sube a la sesión o se abre desde Drive","Permanece en una carpeta local"],["Python en el equipo","No es imprescindible para comenzar","Debe existir un entorno de Python para ejecutar"],["Extensiones","No se instalan","Se recomiendan Python y Jupyter"],["Núcleo","Colab prepara el entorno de ejecución","El usuario suele seleccionarlo"],["Guardado","Drive o descarga de una copia","Guardado directo en el sistema de archivos"],["Uso recomendado","Inicio rápido, equipos compartidos, trabajo en la nube","Proyectos locales, control de archivos y entornos"]],"title":"Mapa de decisión: Colab o VS Code"}],"subsections":[],"navTitle":"Mapa conceptual"},{"id":"1-marco-teorico-comprender-el-fichero-ipynb","title":"1. Marco teórico: comprender el fichero `.ipynb`","blocks":[],"subsections":[{"id":"1-1-que-es-un-cuaderno-jupyter","title":"1.1. Qué es un cuaderno Jupyter","blocks":[{"type":"p","text":"Un cuaderno Jupyter es un documento interactivo dividido en celdas. Las más habituales son:"},{"type":"ul","items":["Celdas de texto o Markdown: contienen títulos, explicaciones, enlaces, listas, fórmulas e instrucciones.","Celdas de código: contienen instrucciones, normalmente escritas en Python en esta asignatura.","Salidas: muestran texto, tablas, gráficos, advertencias o mensajes de error producidos al ejecutar una celda."]},{"type":"p","text":"La extensión .ipynb significa Interactive Python Notebook. Aunque el nombre conserva la referencia a Python, el formato también puede utilizar otros lenguajes si se instala el núcleo correspondiente."}]},{"id":"1-2-que-ocurre-al-abrirlo-correctamente","title":"1.2. Qué ocurre al abrirlo correctamente","blocks":[{"type":"p","text":"Un entorno compatible interpreta la estructura interna del fichero y presenta las celdas en orden. Cada celda puede editarse por separado. Las celdas de código suelen mostrar un botón de ejecución y, tras ejecutarse, un indicador como [1], [2] o una marca equivalente."},{"type":"p","text":"El número de ejecución no es el número de posición de la celda. Indica el orden en el que se han ejecutado instrucciones durante la sesión. Por ello, un cuaderno puede producir resultados incoherentes si las celdas se ejecutan desordenadamente."}]},{"id":"1-3-abrir-confiar-ejecutar-y-guardar","title":"1.3. Abrir, confiar, ejecutar y guardar","blocks":[{"type":"p","text":"Estas cuatro acciones no deben confundirse:"},{"type":"table","rows":[["Acción","Significado"],["Abrir","Mostrar la estructura del cuaderno para leerla o editarla"],["Confiar","Autorizar la presentación de ciertos resultados guardados; no convierte el código en seguro"],["Ejecutar","Enviar el código de una celda al núcleo seleccionado"],["Guardar","Escribir los cambios en Drive o en el fichero local"]],"title":"Acciones al abrir un cuaderno"},{"type":"p","text":"Un .ipynb puede contener código capaz de leer, modificar o borrar archivos accesibles para el entorno de ejecución. Antes de ejecutar un cuaderno recibido de otra persona, conviene revisar sus celdas y confirmar que la procedencia es fiable."}]},{"id":"1-4-como-elegir-el-entorno","title":"1.4. Cómo elegir el entorno","blocks":[{"type":"p","text":"Google Colab suele ser la vía más rápida cuando se quiere empezar sin configurar Python en el equipo. También resulta útil en ordenadores compartidos o cuando el cuaderno requiere recursos disponibles en la nube. Sin embargo, el fichero subido desde el equipo puede ser una copia temporal y la sesión puede desconectarse."},{"type":"p","text":"Visual Studio Code resulta apropiado cuando se trabaja con una carpeta de proyecto, se necesitan otros archivos locales o se desea controlar versiones, paquetes y entornos. La configuración inicial exige más pasos, pero después permite mantener el cuaderno junto con los demás materiales del proyecto."}]}],"navTitle":"Marco teórico"},{"id":"2-abrir-un-fichero-ipynb-en-google-colab","title":"2. Abrir un fichero `.ipynb` en Google Colab","blocks":[],"subsections":[{"id":"2-1-requisitos-previos","title":"2.1. Requisitos previos","blocks":[{"type":"p","text":"Para seguir este procedimiento necesitas:"},{"type":"ul","items":["Un navegador actualizado.","Conexión a Internet.","El fichero .ipynb localizado en el equipo.","Una cuenta de Google para guardar con normalidad en Google Drive."]},{"type":"p","text":"Es posible acceder a la pantalla de Colab sin instalar ningún programa. Google Colab se ejecuta en el navegador y ofrece un entorno de cuadernos alojado."}]},{"id":"2-2-procedimiento-principal-subir-el-fichero-desde-el-equipo","title":"2.2. Procedimiento principal: subir el fichero desde el equipo","blocks":[{"type":"h4","text":"Paso 1. Abrir Google Colab"},{"type":"p","text":"Abre el navegador y escribe https://colab.research.google.com/. Espera a que aparezca la página de Colab. Si Google solicita iniciar sesión, utiliza la cuenta con la que quieras trabajar y guardar el cuaderno."},{"type":"h4","text":"Paso 2. Mostrar el selector de cuadernos"},{"type":"p","text":"Al entrar puede aparecer directamente una ventana para abrir un cuaderno. Si ya hay otro cuaderno abierto o no aparece esa ventana, utiliza el menú Archivo y elige Abrir cuaderno. La denominación puede variar ligeramente con cambios de interfaz, pero la acción se mantiene en el menú de archivo."},{"type":"h4","text":"Paso 3. Elegir la pestaña de subida"},{"type":"p","text":"En la ventana Abrir cuaderno, selecciona la pestaña Subir. Esta opción indica que el archivo está en tu equipo, no en Google Drive ni en un repositorio de GitHub."},{"type":"h4","text":"Paso 4. Seleccionar el fichero `.ipynb`"},{"type":"p","text":"Pulsa Examinar o Seleccionar archivo. Se abrirá el selector de archivos del sistema operativo. Ve a la carpeta donde está introduccion_pln.ipynb, selecciónalo y pulsa Abrir."},{"type":"p","text":"También puede ser posible arrastrar el fichero desde una ventana del explorador hasta el área de subida de Colab. Para un primer uso, el botón de selección suele ser más claro porque permite confirmar la ubicación y el nombre exacto."},{"type":"h4","text":"Paso 5. Esperar a que termine la carga"},{"type":"p","text":"Colab subirá el fichero y abrirá el cuaderno en una nueva pestaña o en la pestaña actual. No cierres la ventana mientras se realiza la carga. Un cuaderno con muchas imágenes o salidas guardadas puede tardar más."},{"type":"h4","text":"Paso 6. Comprobar que el cuaderno se ha abierto bien"},{"type":"p","text":"Verifica lo siguiente:"},{"type":"ul","items":["El título superior coincide con el nombre del fichero.","El contenido aparece dividido en celdas, no como una larga secuencia de llaves y comillas.","Las celdas de texto muestran títulos y párrafos con formato.","Las celdas de código muestran un botón de ejecución a la izquierda."]},{"type":"h4","text":"Paso 7. Revisar antes de ejecutar"},{"type":"p","text":"Desplázate por el cuaderno y lee las primeras celdas. Comprueba qué paquetes importa, qué archivos intenta abrir y si solicita credenciales o claves. No ejecutes código que no comprendas cuando la fuente no sea fiable."},{"type":"h4","text":"Paso 8. Conectar el entorno de ejecución"},{"type":"p","text":"Para ejecutar código, pulsa Conectar en la zona superior derecha si Colab todavía no ha asignado un entorno. Cuando la conexión esté lista, el estado cambiará y podrán ejecutarse las celdas."},{"type":"h4","text":"Paso 9. Ejecutar una primera celda de forma controlada"},{"type":"p","text":"Selecciona una celda de código sencilla y pulsa el botón triangular situado a su izquierda. También puedes usar Mayús + Intro: se ejecuta la celda y se avanza a la siguiente. Espera a que termine antes de continuar."},{"type":"h4","text":"Paso 10. Guardar el trabajo"},{"type":"p","text":"Si el cuaderno se ha subido desde el equipo, comprueba dónde se guardarán los cambios. Una opción segura es utilizar Archivo > Guardar una copia en Drive al comenzar. Se creará una copia en Google Drive que podrás volver a abrir más tarde."},{"type":"p","text":"Para conservar además un fichero local, utiliza Archivo > Descargar > Descargar .ipynb al terminar. El navegador guardará una nueva copia, normalmente en Descargas."}]},{"id":"2-3-abrir-un-cuaderno-que-ya-esta-en-google-drive","title":"2.3. Abrir un cuaderno que ya está en Google Drive","blocks":[{"type":"p","text":"Si el .ipynb está guardado en Drive, abre el selector mediante Archivo > Abrir cuaderno, entra en la pestaña Google Drive y localiza el documento. También puedes abrir Google Drive, hacer clic con el botón derecho sobre el fichero y elegir Abrir con > Google Colaboratory si esa integración está disponible en la cuenta."},{"type":"p","text":"Si Google Colaboratory no aparece en Abrir con, puede añadirse desde la opción para conectar más aplicaciones. En cuentas institucionales, esta posibilidad puede estar limitada por la administración."}]},{"id":"2-4-abrir-un-cuaderno-desde-github","title":"2.4. Abrir un cuaderno desde GitHub","blocks":[{"type":"p","text":"En Archivo > Abrir cuaderno, la pestaña GitHub permite buscar un repositorio o pegar una URL. Este procedimiento abre el contenido del repositorio, pero no concede automáticamente permiso para escribir cambios en él. Para conservar las modificaciones, guarda una copia en Drive, descarga el .ipynb o utiliza un flujo de GitHub configurado expresamente."}]},{"id":"2-5-que-significa-la-sesion-temporal-de-colab","title":"2.5. Qué significa la sesión temporal de Colab","blocks":[{"type":"p","text":"El cuaderno y el entorno de ejecución no son lo mismo. El documento puede estar guardado en Drive, mientras que la memoria, las variables y algunos archivos cargados pertenecen a una máquina virtual temporal. Si la sesión se reinicia o se desconecta:"},{"type":"ul","items":["Se pierden las variables que estaban en memoria.","Pueden perderse archivos subidos únicamente a la sesión.","Deben volver a ejecutarse las celdas de instalación e importación.","El texto y el código guardados en el cuaderno permanecen si se guardaron correctamente."]}]},{"id":"2-6-lista-de-comprobacion-para-colab","title":"2.6. Lista de comprobación para Colab","blocks":[{"type":"ul","items":["El cuaderno muestra celdas de texto y código.","El nombre del fichero es el esperado.","Se ha revisado el código antes de ejecutarlo.","El entorno indica que está conectado.","Se ha guardado una copia en Drive o se sabe cómo descargar el .ipynb.","Los archivos auxiliares necesarios también están disponibles en la sesión o en Drive."]}]}],"navTitle":"Abrir en Google Colab"},{"id":"3-abrir-un-fichero-ipynb-en-visual-studio-code","title":"3. Abrir un fichero .ipynb en Visual Studio Code","blocks":[],"subsections":[{"id":"3-1-requisitos-previos","title":"3.1. Requisitos previos","blocks":[{"type":"p","text":"Para abrir y ejecutar un cuaderno local con Visual Studio Code se recomienda disponer de:"},{"type":"ul","items":["Visual Studio Code instalado.","Python instalado en el equipo o accesible mediante un entorno del proyecto.","La extensión Python, publicada por Microsoft.","La extensión Jupyter, publicada por Microsoft.","El fichero .ipynb guardado en una carpeta conocida."]},{"type":"p","text":"Visual Studio Code puede mostrar el cuaderno gracias a la extensión Jupyter. Para ejecutar sus celdas necesita además un núcleo asociado a un entorno que contenga Python y, normalmente, el paquete ipykernel."}]},{"id":"3-2-comprobar-o-instalar-las-extensiones","title":"3.2. Comprobar o instalar las extensiones","blocks":[{"type":"h4","text":"Paso 1. Abrir Visual Studio Code"},{"type":"p","text":"Inicia la aplicación desde el menú del sistema, el Dock o el acceso directo correspondiente."},{"type":"h4","text":"Paso 2. Abrir la vista de extensiones"},{"type":"p","text":"Pulsa el icono de Extensiones de la barra lateral izquierda. El atajo habitual es Ctrl + Mayús + X en Windows y Linux, o Cmd + Mayús + X en macOS."},{"type":"h4","text":"Paso 3. Instalar la extensión Python"},{"type":"p","text":"Escribe Python en el buscador. Elige la extensión Python cuyo editor es Microsoft y pulsa Instalar. Evita instalar extensiones de nombre parecido sin comprobar el editor."},{"type":"h4","text":"Paso 4. Instalar la extensión Jupyter"},{"type":"p","text":"Busca Jupyter, selecciona la extensión Jupyter de Microsoft y pulsa Instalar. Puede instalarse también un paquete de extensiones relacionadas; la pieza esencial para los cuadernos es Jupyter."},{"type":"h4","text":"Paso 5. Recargar si se solicita"},{"type":"p","text":"Si Visual Studio Code muestra Reload, Recargar o solicita reiniciar la ventana, acepta. Así se activan correctamente las extensiones."}]},{"id":"3-3-procedimiento-recomendado-abrir-la-carpeta-y-despues-el-","title":"3.3. Procedimiento recomendado: abrir la carpeta y después el cuaderno","blocks":[{"type":"h4","text":"Paso 1. Preparar una carpeta de trabajo"},{"type":"p","text":"Mueve el fichero a una carpeta estable, por ejemplo, Documentos/Programacion_PLN/Tema_1. Evita trabajar directamente dentro de un archivo comprimido .zip o desde una ubicación temporal del navegador."},{"type":"h4","text":"Paso 2. Abrir la carpeta en Visual Studio Code"},{"type":"p","text":"En Visual Studio Code, selecciona Archivo > Abrir carpeta. Elige la carpeta que contiene el cuaderno y confirma. En macOS, el texto puede aparecer como Open Folder si la aplicación está en inglés."},{"type":"p","text":"Abrir la carpeta completa es preferible a abrir solo el fichero porque permite que las rutas relativas, los datos y otros módulos del proyecto se resuelvan desde un contexto coherente."},{"type":"h4","text":"Paso 3. Aceptar o revisar la confianza del espacio de trabajo"},{"type":"p","text":"Visual Studio Code puede preguntar si confías en los autores de los archivos de la carpeta. La confianza del espacio de trabajo habilita determinadas funciones, pero no garantiza que el código sea inocuo. Si conoces la procedencia, confirma la confianza. Si no, utiliza el modo restringido y revisa los archivos antes de ejecutar."},{"type":"h4","text":"Paso 4. Localizar el `.ipynb` en el Explorador"},{"type":"p","text":"En la barra lateral, abre el Explorador y busca introduccion_pln.ipynb. Haz clic una vez sobre él. La extensión Jupyter debería abrirlo en el editor de cuadernos, con las celdas separadas."},{"type":"h4","text":"Paso 5. Confirmar el modo de visualización"},{"type":"p","text":"El cuaderno debe mostrar celdas de texto y de código. Si aparece como JSON con claves como cells, metadata y nbformat, el fichero se ha abierto en el editor de texto. Haz clic con el botón derecho en la pestaña del archivo, selecciona Reabrir editor con... y elige Jupyter Notebook."}]},{"id":"3-4-procedimiento-alternativo-abrir-directamente-el-fichero","title":"3.4. Procedimiento alternativo: abrir directamente el fichero","blocks":[{"type":"p","text":"También puedes elegir Archivo > Abrir archivo, seleccionar el .ipynb y pulsar Abrir. Otra posibilidad es hacer clic con el botón derecho sobre el fichero en el explorador del sistema y elegir Abrir con Visual Studio Code."},{"type":"p","text":"Este método es válido para una consulta rápida. Si el cuaderno utiliza archivos como datos.csv, carpetas como corpus/ o módulos propios, abre después la carpeta completa para evitar problemas con rutas relativas."}]},{"id":"3-5-seleccionar-el-nucleo-de-python","title":"3.5. Seleccionar el núcleo de Python","blocks":[{"type":"p","text":"Abrir el documento permite leerlo, pero la ejecución requiere un núcleo. Sigue estos pasos:"},{"type":"h4","text":"Paso 1. Localizar el selector de núcleo"},{"type":"p","text":"En la parte superior derecha del editor del cuaderno busca Seleccionar núcleo, Select Kernel o el nombre de un entorno ya elegido."},{"type":"h4","text":"Paso 2. Abrir la lista de núcleos"},{"type":"p","text":"Pulsa el selector. Visual Studio Code puede ofrecer categorías como Entornos de Python o Jupyter Kernel. Elige la opción de entornos de Python si vas a ejecutar código Python local."},{"type":"h4","text":"Paso 3. Elegir el entorno adecuado"},{"type":"p","text":"Selecciona el entorno que corresponde al proyecto. Puede aparecer como una versión global, por ejemplo Python 3.12, o como un entorno virtual, por ejemplo .venv. Si el profesorado ha indicado un entorno concreto, utiliza ese."},{"type":"h4","text":"Paso 4. Esperar al inicio del núcleo"},{"type":"p","text":"La primera conexión puede tardar unos segundos. Visual Studio Code puede pedir instalar ipykernel en el entorno seleccionado. Acepta la instalación solo si ese es el entorno en el que quieres trabajar."},{"type":"h4","text":"Paso 5. Ejecutar una celda de prueba"},{"type":"p","text":"Pulsa el triángulo de una celda o usa Mayús + Intro. Observa la salida debajo de la celda. Una prueba sencilla es ejecutar una celda que importe una biblioteca utilizada por el cuaderno."}]},{"id":"3-6-si-no-aparece-ningun-entorno-de-python","title":"3.6. Si no aparece ningún entorno de Python","blocks":[{"type":"p","text":"Comprueba en este orden:"},{"type":"ol","items":["Abre la paleta de comandos con Ctrl + Mayús + P o Cmd + Mayús + P.","Escribe Python: Select Interpreter.","Selecciona un intérprete detectado.","Si no hay ninguno, instala Python desde una fuente oficial o crea el entorno indicado para la asignatura.","Vuelve al cuaderno y repite Seleccionar núcleo."]},{"type":"p","text":"En proyectos docentes es frecuente utilizar un entorno virtual. Desde una terminal situada en la carpeta del proyecto, un ejemplo habitual es:"},{"type":"code","code":"python -m venv .venv"},{"type":"p","text":"Después se activa el entorno según el sistema operativo y se instalan los paquetes necesarios. No ejecutes estos comandos a ciegas si el proyecto ya incluye instrucciones o un entorno preparado."}]},{"id":"3-7-guardar-el-cuaderno-en-visual-studio-code","title":"3.7. Guardar el cuaderno en Visual Studio Code","blocks":[{"type":"p","text":"Utiliza Ctrl + S en Windows y Linux o Cmd + S en macOS. El guardado modifica el fichero local que está abierto. Si quieres preservar una copia original:"},{"type":"ol","items":["Antes de editar, duplica el fichero en el explorador del sistema; o","Utiliza Archivo > Guardar como y añade un nombre, por ejemplo, introduccion_pln_resuelto.ipynb."]},{"type":"p","text":"Los resultados de las celdas pueden quedar incorporados al .ipynb y aumentar su tamaño. Antes de entregar un cuaderno, sigue las instrucciones de la asignatura sobre si deben conservarse o borrarse las salidas."}]},{"id":"3-8-reiniciar-y-ejecutar-todo","title":"3.8. Reiniciar y ejecutar todo","blocks":[{"type":"p","text":"Cuando las celdas se han ejecutado en un orden irregular, utiliza las opciones del cuaderno para Reiniciar el núcleo y Ejecutar todo. Esta comprobación permite verificar si el cuaderno funciona desde un estado limpio."},{"type":"p","text":"Reiniciar borra variables y objetos de la memoria, pero no elimina el código ni el texto guardados. Después de reiniciar, las celdas deben ejecutarse desde el principio."}]},{"id":"3-9-lista-de-comprobacion-para-visual-studio-code","title":"3.9. Lista de comprobación para Visual Studio Code","blocks":[{"type":"ul","items":["Las extensiones Python y Jupyter están instaladas y habilitadas.","Se ha abierto la carpeta de trabajo correcta.","El .ipynb aparece como cuaderno, no como JSON.","El núcleo seleccionado corresponde al entorno del proyecto.","Una primera celda se ejecuta sin error.","El archivo se guarda en la ubicación prevista.","Los datos y módulos auxiliares están dentro de rutas accesibles."]}]}],"navTitle":"Abrir en VS Code"},{"id":"4-comparacion-del-flujo-completo","title":"4. Comparación del flujo completo","blocks":[{"type":"table","rows":[["Momento","Google Colab","Visual Studio Code"],["Inicio","Abrir una dirección web","Iniciar una aplicación instalada"],["Incorporación del archivo","Subir, abrir desde Drive o enlazar GitHub","Abrir archivo o carpeta local"],["Preparación para ejecutar","Conectar a un entorno alojado","Seleccionar un núcleo local o remoto"],["Dependencias","Pueden instalarse en la sesión","Se instalan en el entorno del proyecto"],["Persistencia de variables","Se pierde al finalizar o reiniciar la sesión","Se pierde al reiniciar el núcleo"],["Persistencia de archivos auxiliares","Depende de Drive o de la sesión temporal","Permanece en el sistema de archivos"],["Copia final","Guardar en Drive o descargar","Guardar o Guardar como"]],"title":"Comparación completa del flujo"}],"subsections":[{"id":"4-1-decision-rapida","title":"4.1. Decisión rápida","blocks":[{"type":"p","text":"Usa Google Colab si necesitas empezar de inmediato, no puedes instalar programas o quieres compartir un enlace. Usa Visual Studio Code si el cuaderno forma parte de un proyecto con varios archivos, quieres controlar el entorno o necesitas trabajar estrechamente con Git y el sistema de archivos local."},{"type":"p","text":"No existe una opción universalmente mejor. Lo importante es saber dónde está el fichero, dónde se ejecuta el código y dónde se guardan los cambios."}]}],"navTitle":"Comparación de flujos"},{"id":"errores-frecuentes-de-aprendizaje","title":"Errores frecuentes de aprendizaje","blocks":[{"type":"errorlist","items":[]}],"subsections":[{"id":"el-fichero-se-abre-como-texto-json","title":"El fichero se abre como texto JSON","blocks":[{"type":"p","text":"El programa no ha utilizado un editor de cuadernos. En Visual Studio Code, usa Reabrir editor con... > Jupyter Notebook y comprueba la extensión Jupyter. En otros programas, abre el fichero desde Colab o desde un entorno compatible."}]},{"id":"colab-abre-el-cuaderno-pero-despues-desaparecen-los-archivos","title":"Colab abre el cuaderno, pero después desaparecen los archivos cargados","blocks":[{"type":"p","text":"Los archivos se subieron a la máquina virtual temporal, no a Drive. Vuelve a cargarlos o monta Google Drive si el ejercicio lo requiere. Guarda siempre el cuaderno y los datos importantes en un almacenamiento persistente."}]},{"id":"en-visual-studio-code-aparece-seleccionar-nucleo-y-no-se-pue","title":"En Visual Studio Code aparece «Seleccionar núcleo» y no se puede ejecutar","blocks":[{"type":"p","text":"Todavía no se ha elegido un entorno. Selecciona un intérprete de Python y, si se solicita, instala ipykernel en ese entorno."}]},{"id":"una-importacion-produce-modulenotfounderror","title":"Una importación produce `ModuleNotFoundError`","blocks":[{"type":"p","text":"El paquete no está instalado en el núcleo seleccionado o se ha elegido otro entorno. Comprueba el nombre del núcleo antes de instalar nada. Instalar el paquete en un Python distinto no resolverá el error del cuaderno actual."}]},{"id":"el-cuaderno-funcionaba-pero-ahora-las-variables-no-existen","title":"El cuaderno funcionaba, pero ahora las variables no existen","blocks":[{"type":"p","text":"La sesión o el núcleo se reinició. Ejecuta de nuevo las celdas desde el principio. El código guardado permanece, pero la memoria de ejecución se ha vaciado."}]},{"id":"las-celdas-producen-resultados-distintos-al-ejecutarlas-en-o","title":"Las celdas producen resultados distintos al ejecutarlas en orden","blocks":[{"type":"p","text":"Probablemente existía estado oculto: una variable se creó o modificó en una celda ejecutada anteriormente. Reinicia el núcleo y ejecuta todo desde arriba para comprobar la reproducibilidad."}]},{"id":"se-ha-sobrescrito-el-fichero-original","title":"Se ha sobrescrito el fichero original","blocks":[{"type":"p","text":"En Visual Studio Code, Guardar modifica el archivo abierto. En Colab, una copia guardada en Drive puede adoptar un nombre similar. Antes de resolver ejercicios, crea una copia con un nombre inequívoco."}]},{"id":"el-cuaderno-no-encuentra-un-archivo-de-datos","title":"El cuaderno no encuentra un archivo de datos","blocks":[{"type":"p","text":"Revisa la ruta utilizada por el código. En Colab, el archivo debe subirse a la sesión o estar accesible desde Drive. En Visual Studio Code, abre la carpeta correcta y conserva la estructura de subcarpetas esperada."}]},{"id":"se-ejecuta-codigo-sin-revisar-su-procedencia","title":"Se ejecuta código sin revisar su procedencia","blocks":[{"type":"p","text":"Un cuaderno no es inocuo por el hecho de tener explicaciones y botones. Lee el código, identifica accesos a archivos, red y credenciales, y ejecuta únicamente materiales de confianza."}]}],"navTitle":"Errores frecuentes"},{"id":"sintesis-final","title":"Síntesis final","blocks":[{"type":"p","text":"Un fichero .ipynb es un cuaderno interactivo compuesto por celdas de texto, código y resultados. Para abrirlo correctamente se necesita un entorno que interprete el formato Jupyter."},{"type":"p","text":"En Google Colab, el flujo básico consiste en entrar en Colab, abrir el selector de cuadernos, elegir Subir, seleccionar el fichero y guardar después una copia persistente. La ejecución se realiza en una sesión alojada que puede reiniciarse o desconectarse."},{"type":"p","text":"En Visual Studio Code, el flujo recomendado consiste en instalar las extensiones Python y Jupyter, abrir la carpeta del proyecto, seleccionar el .ipynb, elegir un núcleo de Python y guardar el fichero local. El entorno seleccionado determina qué versión de Python y qué paquetes utiliza el cuaderno."},{"type":"p","text":"En ambos casos, abrir no significa ejecutar. Antes de pulsar los controles de ejecución, hay que revisar el código, conocer su procedencia y confirmar dónde se guardarán los cambios y los archivos auxiliares."}],"subsections":[],"navTitle":"Síntesis"},{"id":"cierre-narrativo","title":"Cierre narrativo","blocks":[{"type":"p","text":"El fichero introduccion_pln.ipynb ya no es un documento desconocido. Puedes abrirlo en la nube para comenzar con rapidez o integrarlo en una carpeta de proyecto local para controlar el entorno y sus dependencias. En ambos recorridos, sabes identificar el editor de cuadernos, preparar la ejecución, conservar una copia y recuperar el trabajo cuando se reinicia la sesión."},{"type":"p","text":"La decisión profesional no consiste solo en elegir una herramienta. Consiste en mantener claras tres ubicaciones: dónde está el cuaderno, dónde se ejecuta el código y dónde permanecen los resultados. Esa distinción permite trabajar con cuadernos Jupyter de forma ordenada, reproducible y segura."}],"subsections":[],"navTitle":"Cierre narrativo"}],"references":[{"key":"google_colab_faq","text":"Google. (s. f.). *Google Colaboratory: preguntas frecuentes*. https://research.google.com/colaboratory/faq.html"},{"key":"ms_jupyter_vscode","text":"Microsoft. (s. f.). Jupyter Notebooks in Visual Studio Code. *Visual Studio Code Documentation*. https://code.visualstudio.com/docs/datascience/jupyter-notebooks"},{"key":"ms_kernels_vscode","text":"Microsoft. (s. f.). Manage Jupyter Kernels in Visual Studio Code. *Visual Studio Code Documentation*. https://code.visualstudio.com/docs/datascience/jupyter-kernel-management"},{"key":"jupyter_notebook","text":"Project Jupyter. (s. f.). *The Jupyter Notebook*. https://jupyter-notebook.readthedocs.io/"}]}};
  var imRendered = {};
