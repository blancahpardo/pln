e cadena raw."},{"text":"Para que el patrón solo busque palabras que estén en formato de texto crudo sin formato.","isCorrect":false,"rationale":"'Raw string' se refiere al tratamiento de los caracteres de escape en el código, no al formato del texto de entrada."},{"text":"Para optimizar la velocidad de ejecución del módulo re al procesar corpus de gran tamaño con miles de documentos.","isCorrect":false,"rationale":"Aunque es una buena práctica, su función principal es la claridad sintáctica y evitar errores de escape, no el rendimiento del motor."}],"hint":"Piensa en cómo trata Python el carácter de la barra invertida (backslash)."},{"question":"Si se desea identificar la palabra completa 'actual' y evitar que se capture dentro de 'actually', ¿qué elemento de la expresión regular es imprescindible?","answerOptions":[{"text":"El uso de límites de palabra representados por `\\b`.","isCorrect":true,"rationale":"El símbolo \\b marca la frontera entre caracteres de palabra y espacios o signos, garantizando que se capture la palabra exacta."},{"text":"El uso del cuantificador '+' al final del patrón.","isCorrect":false,"rationale":"El cuantificador '+' busca una o más repeticiones, lo que no ayuda a delimitar fronteras de palabra."},{"text":"La inclusión de un punto al final del patrón léxico.","isCorrect":false,"rationale":"En regex, el punto es un comodín que representa cualquier carácter, lo que aumentaría las capturas no deseadas."},{"text":"El empleo de paréntesis para crear un grupo de captura cerrado.","isCorrect":false,"rationale":"Los grupos de captura organizan subpatrones, pero no impiden que se encuentren coincidencias dentro de palabras más largas."}],"hint":"Busca el símbolo que define las fronteras o límites de una unidad léxica."},{"question":"En un sistema que revisa segmentos bilingües en busca de posibles errores léxicos, se puede usar `re.findall()` para contar cuántas veces aparece un patrón, o `re.search()` para comprobar si aparece al menos una vez en una línea concreta. ¿Cuál es la diferencia fundamental entre ambas funciones en ese tipo de flujo de control de calidad?","answerOptions":[{"text":"`re.findall()` se usa para contar todas las ocurrencias y `re.search()` para decidir si un segmento se incluye en un informe.","isCorrect":true,"rationale":"Findall localiza todas las apariciones para métricas, mientras que search filtra líneas basándose en la primera coincidencia encontrada."},{"text":"`re.findall()` devuelve objetos de coincidencia y `re.search()` devuelve una lista de strings.","isCorrect":false,"rationale":"Es al revés: findall() devuelve una lista de strings y search() devuelve un objeto de coincidencia (Match object)."},{"text":"`re.search()` es obligatorio para usar el flag `re.IGNORECASE`, mientras que `re.findall()` no lo admite.","isCorrect":false,"rationale":"Ambas funciones aceptan el argumento flags para modificar el comportamiento de la búsqueda."},{"text":"`re.findall()` solo funciona con strings simples y `re.search()` únicamente con textos multilínea completos.","isCorrect":false,"rationale":"Ambas funciones pueden operar sobre cualquier objeto de tipo string, independientemente de si tiene saltos de línea."}],"hint":"Considera qué función es mejor para estadísticas y cuál para validación condicional."},{"question":"En un sistema de detección de falsos amigos, un primer tipo de informe puede limitarse a listar los segmentos sospechosos, mientras que un segundo tipo distingue los casos con más evidencia. ¿Cómo se define un 'error probable' en ese segundo tipo de informe?","answerOptions":[{"text":"Cuando coinciden simultáneamente la forma inglesa sospechosa y la traducción literal problemática en el segmento.","isCorrect":true,"rationale":"La doble coincidencia en el par TO-TM aporta evidencia estadística de que la transferencia errónea ha ocurrido."},{"text":"Cuando el sistema detecta un término inglés que no existe en el diccionario médico especializado del glosario.","isCorrect":false,"rationale":"Eso sería un error ortográfico o de vocabulario, no necesariamente relacionado con la lógica de falsos amigos TO-TM."},{"text":"Cuando aparece el falso amigo en el texto origen, independientemente de su traducción.","isCorrect":false,"rationale":"Eso se define como 'riesgo', pero no confirma que el error se haya cometido en la traducción."},{"text":"Cuando el sistema de traducción automática devuelve un segmento vacío o mal segmentado.","isCorrect":false,"rationale":"Este es un error de procesamiento técnico, no una cuestión de transferencia léxica de falsos amigos."}],"hint":"Recuerda la distinción entre riesgo (origen) y evidencia (origen + meta)."},{"question":"En el desarrollo de un pipeline con Python, ¿cuál es la utilidad de aplicar `.strip()` a cada línea después de usar `.split('\\n')`?","answerOptions":[{"text":"Eliminar espacios en blanco y saltos de línea residuales al principio y al final de la cadena.","isCorrect":true,"rationale":"Esto asegura que no se procesen líneas vacías y que el contenido del segmento esté limpio para el análisis."},{"text":"Eliminar caracteres especiales como tildes y eñes para facilitar la búsqueda.","isCorrect":false,"rationale":"Strip no modifica caracteres internos del string; solo elimina espacios y saltos de línea en los extremos."},{"text":"Convertir todo el texto a minúsculas para que coincida con el glosario.","isCorrect":false,"rationale":"Esa tarea se realiza con el método .lower() o mediante flags en el módulo re."},{"text":"Separar el Texto Origen (TO) del Texto Meta (TM) automáticamente.","isCorrect":false,"rationale":"Strip no separa partes de una cadena basándose en su contenido lingüístico, solo limpia los bordes."}],"hint":"Piensa en la limpieza de los extremos de un string."},{"question":"¿Qué limitación técnica presentan las expresiones regulares frente a variantes morfológicas como 'assist', 'assisted' y 'assisting'?","answerOptions":[{"text":"Un patrón exacto como `r\"\\bassist\\b\"` no detectará automáticamente las formas flexionadas o derivadas.","isCorrect":true,"rationale":"Al exigir límites de palabra estrictos, cualquier sufijo como -ed o -ing rompe la coincidencia con la raíz exacta."},{"text":"Las expresiones regulares no pueden procesar verbos en inglés por restricciones del módulo re.","isCorrect":false,"rationale":"El módulo re puede procesar cualquier secuencia de caracteres, incluidos verbos, si el patrón está bien definido."},{"text":"El uso de `re.IGNORECASE` impide que el sistema reconozca terminaciones verbales.","isCorrect":false,"rationale":"IGNORECASE solo afecta a la distinción entre mayúsculas y minúsculas, no a la morfología de la palabra."},{"text":"Las expresiones regulares solo funcionan con sustantivos y no con categorías gramaticales variables.","isCorrect":false,"rationale":"Regex es agnóstico a la categoría gramatical; busca patrones de caracteres sin importar la función lingüística."}],"hint":"Considera qué ocurre cuando buscas una cadena exacta frente a una palabra que cambia sus terminaciones."},{"question":"¿Qué representa un 'falso negativo' en este sistema de detección de calidad léxica?","answerOptions":[{"text":"Un error de traducción real que el sistema no ha sido capaz de detectar.","isCorrect":true,"rationale":"Ocurre cuando el sistema omite un problema, generalmente porque el patrón es muy estricto o el término no está en el glosario."},{"text":"Un segmento que el sistema marca como error, pero cuya traducción es realmente correcta.","isCorrect":false,"rationale":"Esa es la definición de un falso positivo (ruido innecesario)."},{"text":"Un error en el código de Python que impide la ejecución del bucle for.","isCorrect":false,"rationale":"Los falsos negativos son fallos de cobertura lingüística, no necesariamente errores de sintaxis en el código."},{"text":"Un caso donde la palabra inglesa y la española coinciden plenamente en significado.","isCorrect":false,"rationale":"Si el significado coincide, no hay error de traducción y, por tanto, el sistema no debería marcarlo."}],"hint":"Es el caso en el que el sistema 'no ve' un error que sí existe."},{"question":"Al construir dinámicamente un patrón de expresión regular a partir de una lista de términos de un glosario, se puede combinar una f-string con una cadena raw, como en `fr\"\\b{palabra}\\b\"`. ¿Cuál es la ventaja de esta combinación?","answerOptions":[{"text":"Permiten insertar variables del glosario dentro de un patrón que respeta las barras invertidas de regex.","isCorrect":true,"rationale":"Combina la capacidad de interpolación de variables ({palabra}) con el tratamiento literal de los caracteres de escape (\\b)."},{"text":"Hacen que la búsqueda sea automáticamente bilingüe sin necesidad de usar diccionarios.","isCorrect":false,"rationale":"La lógica bilingüe depende de cómo se use la variable, no del formato fr del string por sí mismo."},{"text":"Son la única forma de que Python reconozca el final de un segmento bilingüe.","isCorrect":false,"rationale":"El final de un segmento suele identificarse por saltos de línea (\\n), no por el tipo de string usado en el patrón."},{"text":"Evitan que el programa consuma demasiada memoria RAM al recorrer el bucle sobre el glosario completo.","isCorrect":false,"rationale":"El formato del string no tiene un impacto significativo en la gestión de memoria comparado con otras estructuras."}],"hint":"Piensa en la necesidad de buscar diferentes palabras dinámicamente usando el mismo patrón estructural."},{"question":"¿Por qué el dominio biomédico hace que la detección de falsos amigos sea un problema de 'seguridad comunicativa'?","answerOptions":[{"text":"Porque una mala equivalencia puede alterar la interpretación de síntomas o instrucciones de tratamiento.","isCorrect":true,"rationale":"En medicina, un error léxico (como confundir sensible con sensato) puede llevar a decisiones clínicas erróneas o peligrosas."},{"text":"Porque los falsos amigos suelen provocar que el sistema de traducción automática se detenga.","isCorrect":false,"rationale":"Los falsos amigos no detienen el sistema; de hecho, producen frases fluidas que parecen correctas pero contienen errores graves."},{"text":"Porque los textos biomédicos están protegidos por leyes de propiedad intelectual muy estrictas.","isCorrect":false,"rationale":"Aunque es cierto, la seguridad comunicativa se refiere a la precisión del mensaje transmitido al paciente o médico."},{"text":"Porque el uso de expresiones regulares está prohibido en la industria farmacéutica.","isCorrect":false,"rationale":"Al contrario, son herramientas comunes para el control de calidad y la validación de textos técnicos."}],"hint":"Reflexiona sobre las consecuencias de un error terminológico en una receta o informe clínico."}];
  var QUIZ_CUADERNO = [{"question":"¿Cuál es la función principal del límite de palabra `\\b` en una expresión regular de Python?","answerOptions":[{"text":"Asegurar que el patrón coincida únicamente con palabras completas y no con partes de otras.","isCorrect":true,"rationale":"El límite de palabra marca la frontera entre caracteres de palabra y espacios o signos, evitando coincidencias parciales."},{"text":"Indicar que la búsqueda debe comenzar exclusivamente al principio de una línea de texto.","isCorrect":false,"rationale":"Esa función la cumple el símbolo `^`, no el límite de palabra."},{"text":"Convertir automáticamente la cadena de texto completa en un formato crudo (raw string) antes de procesarla.","isCorrect":false,"rationale":"El formato raw se indica con el prefijo `r` antes de la cadena, no con `\\b`."},{"text":"Eliminar los espacios en blanco al inicio y al final de una oración procesada.","isCorrect":false,"rationale":"Esa tarea la realiza el método `.strip()`, no un límite de palabra dentro de una expresión regular."}],"hint":"Piensa en cómo evitar que, al buscar 'asistir', el sistema encuentre también 'desasistir'."},{"question":"¿Qué diferencia fundamental existe entre usar `re.findall()` y `re.search()` al analizar un texto en busca de un patrón?","answerOptions":[{"text":"`re.findall()` devuelve una lista con todas las apariciones, mientras que `re.search()` solo verifica la existencia de la primera.","isCorrect":true,"rationale":"findall() recorre todo el texto y devuelve todas las coincidencias; search() se detiene en la primera que encuentra."},{"text":"`re.search()` permite ignorar mayúsculas y minúsculas, pero `re.findall()` es siempre sensible a ellas.","isCorrect":false,"rationale":"Ambas funciones aceptan el flag re.IGNORECASE."},{"text":"`re.findall()` modifica el texto original resaltando en color las coincidencias encontradas durante la búsqueda.","isCorrect":false,"rationale":"Ninguna de las dos funciones modifica el texto original; solo lo analizan."},{"text":"`re.search()` solo funciona con cadenas simples y no admite expresiones regulares complejas.","isCorrect":false,"rationale":"re.search() admite cualquier patrón válido de expresión regular, igual que re.findall()."}],"hint":"Considera si necesitas saber cuántas veces aparece un error o simplemente si el error está presente."},{"question":"Al construir un patrón dinámico como `fr\"\\b{palabra}\\b\"`, ¿qué función cumple específicamente el prefijo `r`?","answerOptions":[{"text":"Permite que las barras invertidas se traten como caracteres literales y no como secuencias de escape de Python.","isCorrect":true,"rationale":"El prefijo r evita que Python interprete \\b como un carácter de retroceso antes de que llegue al motor de expresiones regulares."},{"text":"Indica a Python que debe formatear la variable entre llaves dentro de la cadena.","isCorrect":false,"rationale":"Esa función la cumple el prefijo f, no el prefijo r."},{"text":"Obliga a la expresión regular a realizar una búsqueda recursiva en todos los archivos de una carpeta.","isCorrect":false,"rationale":"Las expresiones regulares operan sobre cadenas de texto ya cargadas, no sobre sistemas de archivos."},{"text":"Activa un modo de compatibilidad para procesar textos en alfabetos no latinos, como el cirílico o el árabe.","isCorrect":false,"rationale":"El prefijo r no tiene relación con el alfabeto o la codificación del texto."}],"hint":"Tiene que ver con cómo interpreta Python el carácter de la barra invertida."},{"question":"En traducción biomédica del inglés al español, un 'falso amigo' es una palabra que se parece a una palabra española pero tiene un significado distinto, lo que puede provocar errores graves de interpretación clínica. ¿Cuál de las siguientes es un ejemplo de falso amigo en este ámbito?","answerOptions":[{"text":"Traducir el término inglés 'sensible' como el español 'sensible' en lugar de 'sensato'.","isCorrect":true,"rationale":"'Sensible' en inglés significa 'sensato' o 'razonable'; traducirlo literalmente altera el sentido de la frase."},{"text":"Traducir 'drug' como 'medicamento' en un informe oficial dirigido a las autoridades de farmacovigilancia.","isCorrect":false,"rationale":"Esa es una traducción correcta en ese contexto; no hay transferencia errónea de significado."},{"text":"Confundir las unidades de medida 'mg' con 'ml' al transcribir una receta.","isCorrect":false,"rationale":"Es un error de transcripción de unidades, no un problema de falso amigo léxico entre dos lenguas."},{"text":"Utilizar la palabra 'actual' en inglés para referirse a algo que es 'real' en español.","isCorrect":false,"rationale":"Esta frase describe el uso correcto en inglés, no la traducción errónea al español que constituiría el falso amigo."}],"hint":"Busca un par de palabras que suenan parecido en los dos idiomas pero significan cosas muy distintas al describir a una persona."},{"question":"En un pipeline que detecta traducciones incorrectas mediante falsos amigos, ¿por qué conviene comprobar la presencia de la palabra sospechosa tanto en el texto origen (TO) como en el texto meta (TM)?","answerOptions":[{"text":"Para evitar falsos positivos en oraciones donde el traductor humano ya corrigió el término correctamente.","isCorrect":true,"rationale":"Si la forma inglesa aparece en el origen pero la traducción es correcta, no debe marcarse como error."},{"text":"Para duplicar el recuento de errores y aumentar la precisión estadística del informe.","isCorrect":false,"rationale":"El objetivo no es duplicar recuentos, sino distinguir el riesgo (solo en el origen) del error confirmado (en ambos)."},{"text":"Porque el módulo `re` requiere obligatoriamente dos entradas de texto para poder ejecutarse.","isCorrect":false,"rationale":"El módulo re puede aplicarse a una sola cadena de texto sin ningún problema."},{"text":"Para verificar que el número de palabras en inglés sea exactamente igual al número de palabras en español.","isCorrect":false,"rationale":"La longitud de las dos versiones no tiene relación directa con la detección de falsos amigos."}],"hint":"Recuerda el caso de 'Eventually', que puede aparecer en el origen y, aun así, estar bien traducido como 'Al final'."},{"question":"Al recorrer un diccionario de Python con un bucle `for` sin especificar más, como en `for palabra in falsos_amigos:`, ¿qué sucede?","answerOptions":[{"text":"Python itera por defecto sobre las claves del diccionario.","isCorrect":true,"rationale":"Por defecto, iterar sobre un diccionario recorre sus claves; para obtener también los valores hace falta usar .items()."},{"text":"Python genera un error de ejecución porque los diccionarios no son objetos iterables.","isCorrect":false,"rationale":"Los diccionarios sí son iterables en Python; se puede recorrer sus claves directamente con un bucle for."},{"text":"Se obtienen simultáneamente la clave y el valor en una tupla de dos elementos.","isCorrect":false,"rationale":"Eso solo ocurre si se usa el método .items() en el bucle."},{"text":"El bucle se ejecuta en orden alfabético inverso de forma automática.","isCorrect":false,"rationale":"Python recorre los diccionarios en el orden en que se insertaron sus claves, no en orden alfabético."}],"hint":"Observa que, en el código, 'palabra' se usa después para acceder a la traducción errónea mediante 'falsos_amigos[palabra]'."},{"question":"¿Cuál es una limitación importante de las expresiones regulares a la hora de detectar errores de traducción?","answerOptions":[{"text":"Carecen de comprensión del contexto gramatical o semántico más amplio.","isCorrect":true,"rationale":"Una expresión regular reconoce formas, no significados; no distingue si una palabra concreta encaja bien en su contexto."},{"text":"Son incapaces de procesar archivos que contengan más de 100 oraciones.","isCorrect":false,"rationale":"El módulo re no tiene ningún límite de este tipo sobre la longitud del texto."},{"text":"No pueden integrarse con herramientas de traducción asistida por ordenador (TAO).","isCorrect":false,"rationale":"Las expresiones regulares pueden aplicarse sobre el texto extraído de cualquier herramienta, incluidas las TAO."},{"text":"Solo funcionan si el texto está escrito enteramente en mayúsculas.","isCorrect":false,"rationale":"El flag re.IGNORECASE permite trabajar sin distinguir mayúsculas de minúsculas."}],"hint":"Piensa en si una máquina puede saber si 'asistir' se refiere a 'ayudar' o a 'estar presente' solo con mirar la palabra."},{"question":"En un sistema de detección de falsos amigos, ¿qué información aporta un diccionario como `falsos_amigos_corr`, que asocia cada forma sospechosa con una alternativa en español?","answerOptions":[{"text":"Sugiere términos correctos en español para reemplazar la traducción literal incorrecta.","isCorrect":true,"rationale":"Este diccionario permite que el informe no solo señale el error, sino que proponga una corrección concreta."},{"text":"Contiene una lista de todas las palabras prohibidas por la empresa de traducción para sus clientes.","isCorrect":false,"rationale":"No se trata de una lista de prohibiciones, sino de equivalencias correctas para cada falso amigo detectado."},{"text":"Almacena las reglas de puntuación necesarias para separar las oraciones en inglés.","isCorrect":false,"rationale":"La segmentación de oraciones se resuelve con otras operaciones, no con este diccionario de correcciones."},{"text":"Es una base de datos de nombres propios de médicos y hospitales para su extracción.","isCorrect":false,"rationale":"El diccionario recoge pares de términos léxicos, no nombres propios de personas o instituciones."}],"hint":"Es la herramienta que permite al sistema sugerir una traducción correcta junto al error detectado."},{"question":"¿Cuál es la consecuencia principal de una mala traducción de un falso amigo en un informe clínico?","answerOptions":[{"text":"Podría modificar el sentido de un diagnóstico o confundir dosis de medicamentos.","isCorrect":true,"rationale":"Un error léxico en un contexto clínico puede alterar la interpretación de síntomas, tratamientos o instrucciones de dosis."},{"text":"Aumenta únicamente el coste de impresión de los documentos finales.","isCorrect":false,"rationale":"La consecuencia relevante es de seguridad clínica, no de coste material del documento."},{"text":"Hace que el software de Python deje de funcionar de manera permanente e irreversible.","isCorrect":false,"rationale":"Un error de traducción no afecta a la ejecución del programa; es un problema de contenido, no de código."},{"text":"Impide que el paciente pueda leer el informe en su idioma nativo.","isCorrect":false,"rationale":"El informe sigue siendo legible en el idioma de destino; el problema es que su contenido puede ser incorrecto."}],"hint":"Piensa en la gravedad que tiene para la seguridad del paciente un error de precisión terminológica."},{"question":"Si un texto bilingüe está organizado con cada línea conteniendo una oración en inglés seguida de su traducción al español, y se aplica `texto.split('\\n')`, ¿qué unidad textual se está intentando aislar para el análisis?","answerOptions":[{"text":"Cada línea o par de oraciones del corpus multilingüe.","isCorrect":true,"rationale":"Dividir por saltos de línea separa el texto en los pares origen-meta que se van a analizar uno a uno."},{"text":"Las palabras individuales separadas por espacios en blanco.","isCorrect":false,"rationale":"Para aislar palabras se usaría .split() sin argumentos, no .split('\\n')."},{"text":"Únicamente los signos de puntuación al final de cada párrafo.","isCorrect":false,"rationale":"Dividir por saltos de línea no aísla signos de puntuación, sino líneas completas de texto."},{"text":"Solo las palabras que están escritas en inglés.","isCorrect":false,"rationale":"La división por saltos de línea no distingue el idioma del contenido de cada línea."}],"hint":"Observa que el texto de entrada tiene una oración en inglés seguida de su traducción en la misma línea."}];
  var IM_DATA = {"manual_interactivo":{"header":{"kicker":"Tema 2.","title":"Patrones léxicos y detección de falsos amigos","subtitle":"Control de calidad léxica en traducción automática biomédica","meta":"Material teórico | Programación para PLN | Universidad Pontificia Comillas"},"sections":[{"id":"contexto-profesional","title":"Contexto profesional","blocks":[{"type":"p","text":"Imagina que trabajas como lingüista computacional en una empresa tecnológica que desarrolla un motor de traducción automática especializado en textos biomédicos. El equipo recibe documentos bilingües inglés-español procedentes de artículos científicos, registros clínicos, informes técnicos, patentes farmacéuticas y materiales de comunicación sanitaria."},{"type":"p","text":"El sistema de traducción automática produce versiones bastante fluidas, pero el equipo de calidad ha detectado un problema recurrente: algunos segmentos parecen correctos a primera vista y, sin embargo, contienen errores léxicos graves. Son errores que no siempre rompen la gramática de la frase, pero sí alteran el significado. En traducción biomédica, ese matiz importa. Una mala equivalencia puede afectar a la interpretación de un síntoma, a la descripción de un tratamiento, a la lectura de una contraindicación o a la confianza del destinatario."},{"type":"p","text":"Tu tarea consiste en diseñar una primera capa automática de vigilancia lingüística. No vas a sustituir a la persona revisora. Vas a construir una herramienta que le ayude a encontrar antes los segmentos sospechosos. El objetivo es automatizar lo repetitivo para que la revisión humana pueda concentrarse en lo que exige criterio experto."},{"type":"p","text":"En esta unidad aprenderás a usar expresiones regulares en Python para detectar patrones léxicos, localizar posibles falsos amigos, contar ocurrencias, generar informes por segmento y distinguir entre un término simplemente sospechoso y un falso amigo realmente cometido en la traducción."},{"type":"p","text":"La historia profesional de fondo es esta: el conocimiento lingüístico no se queda en una intuición. Se transforma en estructuras de datos, patrones de búsqueda y reglas de decisión."}],"subsections":[],"navTitle":"Contexto profesional"},{"id":"que-vas-a-aprender-en-esta-unidad","title":"Qué vas a aprender en esta unidad","blocks":[{"type":"p","text":"Al terminar este manual, deberías poder explicar y aplicar los siguientes conocimientos:"},{"type":"ol","items":["Qué son las expresiones regulares y para qué sirven en procesamiento del lenguaje natural.","Cómo se usa el módulo re de Python.","Qué significa trabajar con textos bilingües en pares TO-TM.","Qué es un falso amigo y por qué puede ser crítico en traducción biomédica.","Cómo se construye un patrón para buscar una palabra exacta.","Qué función cumplen los límites de palabra \\b.","Por qué conviene usar cadenas raw, como r\"\\bactual\\b\".","Qué diferencia hay entre re.findall() y re.search().","Cómo se usa re.IGNORECASE para ignorar mayúsculas y minúsculas.","Cómo se organiza un glosario de falsos amigos mediante diccionarios.","Cómo se recorre un diccionario con un bucle for.","Cómo se construyen patrones dinámicos con f-strings raw.","Cómo se divide un texto multilínea con .split('\\n').","Cómo se filtran líneas vacías con .strip().","Cómo se genera un informe automático de segmentos sospechosos.","Cómo se reduce el ruido exigiendo una coincidencia doble en texto origen y texto meta.","Qué limitaciones tiene una solución basada en expresiones regulares.","Cómo podría integrarse esta técnica en un flujo profesional de posedición y control de calidad."]}],"subsections":[],"navTitle":"Qué vas a aprender"},{"id":"mapa-conceptual-de-la-unidad","title":"Mapa conceptual de la unidad","blocks":[{"type":"table","rows":[["Concepto","En Python","En PLN y traducción"],["Expresión regular","Patrón formal de búsqueda","Permite localizar formas lingüísticas recurrentes"],["Módulo re","Biblioteca estándar de Python","Herramienta básica para búsqueda y validación textual"],["Texto multilínea","String entre comillas triples","Simula segmentos bilingües de revisión"],["TO-TM","Dos partes de un segmento","Texto origen y texto meta"],["Falso amigo","Par léxico problemático","Error de transferencia entre lenguas"],["\\b","Límite de palabra","Evita capturar palabras dentro de otras"],["re.findall()","Lista de coincidencias","Recuento de términos sospechosos"],["re.search()","Primera coincidencia o None","Filtro para decidir si mostrar un segmento"],["Diccionario","Pares clave-valor","Glosario de riesgo o glosario de corrección"],["Bucle for","Repetición sobre elementos","Revisión sistemática de muchos términos"],["and","Condición doble","Detecta coincidencia en origen y traducción"],["Informe automático","Salida estructurada con `print()`","Apoyo a la revisión humana"]],"title":"Datos completos del mapa conceptual"}],"subsections":[],"navTitle":"Mapa conceptual"},{"id":"1-marco-teorico","title":"1. Marco teórico","blocks":[{"type":"p","text":"Esta unidad se apoya en una idea central: algunos errores léxicos de la traducción automática pueden parecer formalmente correctos, pero ser semánticamente peligrosos. Para detectarlos de forma sistemática, el conocimiento lingüístico se convierte en patrones explícitos, glosarios y reglas de decisión. El marco teórico organiza esa transición desde la revisión humana hasta una primera capa automática de vigilancia léxica."}],"subsections":[{"id":"1-1-de-la-lectura-humana-a-la-vigilancia-automatica","title":"1.1. De la lectura humana a la vigilancia automática","blocks":[{"type":"p","text":"Una persona revisora puede detectar un falso amigo leyendo un segmento completo, pero cuando el corpus contiene cientos o miles de segmentos la lectura manual íntegra se vuelve lenta y propensa a omisiones. La programación permite transformar parte de ese conocimiento experto en un procedimiento repetible: buscar formas sospechosas, localizar segmentos, comprobar si aparece una traducción problemática y producir una alerta para revisión."},{"type":"p","text":"Esta automatización no sustituye la posedición ni la revisión terminológica. Su función es priorizar. En lugar de preguntar al sistema si una traducción es correcta, se le pide algo más limitado y verificable: localizar patrones de riesgo. Esa diferencia es importante porque evita atribuir al código una comprensión semántica que no tiene."}]},{"id":"1-2-fundamentos-de-las-expresiones-regulares","title":"1.2. Fundamentos de las expresiones regulares","blocks":[{"type":"p","text":"Las expresiones regulares tienen su base en la teoría de lenguajes formales y en la representación de conjuntos de cadenas mediante operadores como concatenación, alternativa y repetición {{cite:kleene1956}}(Kleene, 1956){{/cite}}. En términos prácticos, una expresión regular es un patrón formal que permite buscar secuencias de caracteres en un texto."},{"type":"p","text":"En PLN, las expresiones regulares resultan útiles para tareas de limpieza, validación, extracción y detección de patrones recurrentes. Su fuerza está en la precisión formal: si el patrón está bien definido, el sistema puede aplicarlo de manera rápida y consistente sobre muchos textos. Su límite está en que la coincidencia formal no equivale a interpretación lingüística."},{"type":"table","rows":[["Elemento","Función","Ejemplo en la unidad"],["Patrón léxico","Describe una forma o secuencia que se quiere localizar","`r\"\\bactual\\b\"`"],["Límite de palabra","Evita capturar fragmentos dentro de otras palabras","`\\b`"],["Búsqueda insensible a mayúsculas","Agrupa Actual, ACTUAL y actual","`re.IGNORECASE`"],["Coincidencia doble","Exige evidencia en origen y meta","actually + actualmente"]],"title":"Elementos de una expresión regular"}]},{"id":"1-3-patrones-lexicos-en-pln","title":"1.3. Patrones léxicos en PLN","blocks":[{"type":"p","text":"Un patrón léxico captura unidades lingüísticas de interés mediante una forma formalizable: una palabra completa, una familia de variantes, una secuencia recurrente o una relación entre dos formas. En esta unidad, el patrón más importante es la palabra completa delimitada por fronteras, porque se busca detectar falsos amigos sin confundirlos con fragmentos de palabras más largas."},{"type":"p","text":"Los patrones léxicos se sitúan en una zona intermedia entre la lingüística y la programación. La lingüística decide qué forma es relevante y por qué; la programación define cómo localizarla de manera automática. Por ejemplo, saber que actual y actually no equivalen exige conocimiento contrastivo. Expresar esa alerta como `r\"\\bactual\\b\"` o `r\"\\bactually\\b\"` exige conocimiento técnico."}]},{"id":"1-4-falsos-amigos-problema-linguistico-y-problema-computacio","title":"1.4. Falsos amigos: problema lingüístico y problema computacional","blocks":[{"type":"p","text":"Un falso amigo es una forma de una lengua que se parece a una forma de otra lengua, pero cuyo significado no coincide, o no coincide en el contexto de uso. La semejanza formal aumenta el riesgo de transferencia literal. En traducción inglés-español, pares como actually/actualmente, library/librería o condition/condición pueden activar errores si se traducen sin atender al contexto."},{"type":"p","text":"Desde el punto de vista computacional, el falso amigo se puede representar como una relación entre dos señales: una forma sospechosa en el texto origen y una forma problemática en el texto meta. Detectar solo la forma inglesa indica riesgo; detectar además la traducción literal problemática permite hablar de error probable. Esta distinción entre riesgo y evidencia es una de las decisiones teóricas más importantes de la unidad {{cite:chamizo2008}}(Chamizo Domínguez, 2008){{/cite}}."},{"type":"table","rows":[["Nivel de detección","Qué busca","Interpretación"],["Riesgo","Aparece la forma origen sospechosa","Conviene revisar el segmento"],["Error probable","Aparecen forma origen y traducción problemática","Hay más evidencia para priorizar la revisión"],["Corrección orientativa","Se añade una propuesta terminológica","El sistema ayuda, pero no decide por la revisora"]],"title":"Niveles de detección de falsos amigos"}]},{"id":"1-5-el-dominio-biomedico-precision-lexica-y-seguridad-comuni","title":"1.5. El dominio biomédico: precisión léxica y seguridad comunicativa","blocks":[{"type":"p","text":"En traducción biomédica, los falsos amigos son especialmente delicados porque pueden afectar a síntomas, tratamientos, contraindicaciones, instrucciones clínicas o descripciones de estado. Una traducción que suena natural puede ser inadecuada si altera una relación terminológica o si usa una palabra general donde se requiere una equivalencia especializada."},{"type":"p","text":"Por eso, una capa de vigilancia léxica puede funcionar como una medida inicial de seguridad lingüística. No garantiza la calidad final, pero ayuda a señalar errores repetitivos que pueden pasar desapercibidos cuando el sistema de traducción automática produce una frase fluida."}]},{"id":"1-6-textos-bilingues-y-segmentos-to-tm","title":"1.6. Textos bilingües y segmentos TO-TM","blocks":[{"type":"p","text":"En un flujo profesional de traducción y posedición, el texto se organiza a menudo en segmentos: unidades alineadas que contienen un texto origen y un texto meta. En esta unidad se usa la distinción TO-TM: TO es el texto origen, en inglés; TM es el texto meta, en español."},{"type":"p","text":"Separar TO y TM mejora la precisión de la detección, porque permite buscar actually en el origen y actualmente en la traducción. En un prototipo didáctico, ambos pueden aparecer en una misma línea bilingüe; en una herramienta profesional, convendría separarlos en campos distintos, por ejemplo en una tabla, archivo XLIFF, TMX o base de datos."}]},{"id":"1-7-expresiones-regulares-en-python","title":"1.7. Expresiones regulares en Python","blocks":[{"type":"p","text":"Python incorpora las expresiones regulares mediante el módulo re. Funciones como `re.findall()` y `re.search()` permiten aplicar patrones a cadenas de texto. `re.findall()` devuelve todas las coincidencias y resulta útil para contar; `re.search() `se detiene en la primera coincidencia y resulta útil para filtrar segmentos {{cite:psf2026}}(Python Software Foundation, 2026){{/cite}}."},{"type":"p","text":"Los patrones suelen escribirse como cadenas raw, por ejemplo `r\"\\bactual\\b\"`, porque las expresiones regulares usan barras invertidas y Python también les asigna significados especiales. La r inicial evita que Python interprete esas barras antes de que lleguen al motor regex. Esta buena práctica reduce errores invisibles al escribir patrones."}]},{"id":"1-8-glosarios-como-representacion-de-conocimiento-linguistic","title":"1.8. Glosarios como representación de conocimiento lingüístico","blocks":[{"type":"p","text":"Un glosario de falsos amigos no es solo una lista de palabras: es una representación de conocimiento contrastivo. En Python puede organizarse como un diccionario donde la clave sea la forma inglesa sospechosa y el valor sea la traducción literal problemática. Un segundo diccionario puede almacenar alternativas recomendadas."},{"type":"p","text":"Este diseño permite pasar de búsquedas aisladas a un sistema escalable. Si se añade una nueva entrada al glosario, el bucle de detección no cambia. La calidad del sistema depende entonces tanto del código como de la calidad lingüística del glosario: selección de términos, contexto, dominio de uso, ejemplos y notas terminológicas."}]},{"id":"1-9-informes-de-revision-falsos-positivos-y-falsos-negativos","title":"1.9. Informes de revisión, falsos positivos y falsos negativos","blocks":[{"type":"p","text":"Un informe automático debe ayudar a decidir. El primer nivel de informe puede listar segmentos sospechosos; el segundo puede mostrar errores probables cuando coinciden forma origen y traducción problemática; un tercer nivel puede añadir una propuesta de corrección. Cuanto más estructurado sea el informe, más útil será para la revisión humana."},{"type":"p","text":"Todo sistema de detección debe asumir falsos positivos y falsos negativos. Un falso positivo aparece cuando el sistema marca un caso que no es error; un falso negativo aparece cuando no marca un error real. En control de calidad, el equilibrio entre cobertura y precisión depende del objetivo. Si se quiere no dejar escapar errores, se aceptará más ruido. Si se quiere priorizar revisión, se exigirá más evidencia."}]},{"id":"1-10-integracion-en-un-pipeline-de-posedicion","title":"1.10. Integración en un pipeline de posedición","blocks":[{"type":"p","text":"En un flujo profesional, las expresiones regulares no actúan de forma aislada. Pueden integrarse en un pipeline de control de calidad: recibir segmentos bilingües desde una herramienta TAO, normalizar codificación y saltos de línea, separar TO y TM, aplicar glosarios, generar alertas, revisar humanamente, validar terminología y actualizar el glosario."},{"type":"p","text":"Esta integración muestra que una solución sencilla puede tener valor profesional si está bien situada. Python no entrega una traducción final; entrega una lista priorizada de lugares donde mirar. Esa lista puede ahorrar tiempo, mejorar trazabilidad y reforzar la seguridad comunicativa en dominios sensibles."}]},{"id":"1-11-ventajas-limitaciones-y-buenas-practicas","title":"1.11. Ventajas, limitaciones y buenas prácticas","blocks":[{"type":"p","text":"Las expresiones regulares ofrecen precisión, velocidad y transparencia. Son adecuadas para patrones concretos, errores recurrentes y comprobaciones de superficie. Además, son explicables: una revisora puede entender qué busca el patrón y por qué se activa una alerta."},{"type":"p","text":"Pero también tienen límites claros. No entienden significado, no resuelven contexto completo, dependen del patrón y dependen del glosario. Si un falso amigo no está incluido, no se detectará. Si el patrón es demasiado estrecho, perderá variantes. Si es demasiado amplio, generará ruido."},{"type":"p","text":"Por eso conviene empezar con patrones simples, probarlos con ejemplos controlados, usar límites de palabra, ignorar mayúsculas cuando proceda, separar origen y meta, documentar el glosario, guardar ejemplos de falsos positivos y falsos negativos, y mantener siempre una fase de revisión humana."}]},{"id":"1-12-conclusiones-del-marco-teorico","title":"1.12. Conclusiones del marco teórico","blocks":[{"type":"p","text":"La unidad demuestra cómo una pregunta lingüística puede convertirse en un procedimiento computacional. El punto de partida es un riesgo de traducción: falsos amigos en textos biomédicos. El punto de llegada es una herramienta inicial de control de calidad que localiza patrones, organiza glosarios y genera informes de revisión."},{"type":"p","text":"La clave conceptual es que las expresiones regulares no sustituyen el criterio traductológico. Lo amplifican cuando se usan para tareas concretas, delimitadas y documentadas. Una buena alerta automática nace de una buena hipótesis lingüística; una buena hipótesis necesita después ser revisada en contexto."}]}],"navTitle":"Marco teórico"},{"id":"2-deteccion-de-patrones-lexicos-y-falsos-amigos-con-python","title":"2. Detección de patrones léxicos y falsos amigos con Python","blocks":[],"subsections":[{"id":"2-1-representar-un-texto-multilinea-en-python","title":"2.1. Representar un texto multilínea en Python","blocks":[{"type":"p","text":"Para trabajar con varios segmentos, Python permite guardar un bloque de texto completo en una variable. Se usan comillas triples:"},{"type":"code","code":"texto = \"\"\"\nThe patient is actually very sensible to the drug. El paciente es actualmente muy sensible al medicamento.\nEventually, the physician decided to assist the patient. Eventualmente, el médico decidió asistir al paciente.\nThe current treatment has no effect. El tratamiento actual no tiene efecto.\nThis is an actual problem that needs attention. Este es un problema actual que requiere atención.\nEventually, the patient decided to look for a second opinion. Al final, el paciente decidió buscar una segunda opinión.\n\"\"\""},{"type":"p","text":"Este objeto es un string. La diferencia respecto a una frase corta es que contiene saltos de línea. Los saltos de línea forman parte del texto y pueden usarse después para separar segmentos."},{"type":"p","text":"La variable texto contiene todo el material que se va a revisar. Esta idea es importante: antes de analizar un corpus, hay que representarlo de alguna forma en memoria. En un prototipo inicial puede ser un string. En proyectos profesionales puede ser un archivo .txt, una hoja de cálculo, un archivo .tmx, un .xliff o una base de datos."}]},{"id":"2-2-el-modulo-re-expresiones-regulares-en-python","title":"2.2. El módulo re: expresiones regulares en Python","blocks":[{"type":"p","text":"Python tiene muchas funciones incorporadas, pero las expresiones regulares se gestionan mediante el módulo re."},{"type":"code","code":"import re"},{"type":"p","text":"Un módulo es un conjunto de herramientas ya preparadas. re pertenece a la biblioteca estándar de Python, así que no hace falta instalarlo."},{"type":"p","text":"Una expresión regular es un patrón de búsqueda. Puede ser muy simple, como una palabra:"},{"type":"code","code":"\"actual\""},{"type":"p","text":"O puede incluir instrucciones especiales:"},{"type":"code","code":"r\"\\bactual\\b\""},{"type":"p","text":"Las expresiones regulares permiten buscar más allá de una coincidencia literal simple. Pueden expresar ideas como:"},{"type":"ul","items":["Busca esta palabra solo si aparece completa.","Busca esta forma aunque esté en mayúsculas.","Busca uno o más dígitos.","Busca una secuencia que tenga este formato.","Busca una palabra al principio o al final de una línea."]},{"type":"p","text":"En PLN son especialmente útiles para tareas de limpieza, extracción, validación y detección de patrones recurrentes."}]},{"id":"2-3-cadenas-raw-por-que-escribimos-r-bactual-b","title":"2.3. Cadenas raw: por qué escribimos r\"\\bactual\\b\"","blocks":[{"type":"p","text":"En Python, una barra invertida \\ puede tener significados especiales. Por ejemplo, \\n representa un salto de línea. En expresiones regulares también se usan barras invertidas para símbolos especiales, como \\b."},{"type":"p","text":"Para evitar que Python interprete esas barras antes de que lleguen al motor de expresiones regulares, se usa una cadena raw:"},{"type":"code","code":"r\"\\bactual\\b\""},{"type":"p","text":"La r inicial significa raw, es decir, «cruda». Indica a Python que trate las barras invertidas de forma literal."},{"type":"p","text":"Sin la r, algunos patrones pueden funcionar, pero otros pueden comportarse de forma inesperada. Por eso, como buena práctica, los patrones regex suelen escribirse como cadenas raw."},{"type":"p","text":"La lectura del patrón es:"},{"type":"code","code":"\\b   límite de palabra\nactual   secuencia literal\n\\b   límite de palabra"},{"type":"p","text":"Este patrón no dice «busca cualquier cosa parecida a actual». Dice: busca exactamente la palabra actual, delimitada por fronteras de palabra."}]},{"id":"2-4-limites-de-palabra-evitar-capturas-falsas","title":"2.4. Límites de palabra: evitar capturas falsas","blocks":[{"type":"p","text":"El símbolo \\b indica un límite de palabra. Sirve para marcar una frontera entre caracteres de palabra y caracteres que no son de palabra."},{"type":"p","text":"Esto es fundamental cuando se buscan términos léxicos. Si buscamos:"},{"type":"code","code":"\"actual\""},{"type":"p","text":"podríamos encontrar esa secuencia dentro de otras palabras. En cambio, con:"},{"type":"code","code":"r\"\\bactual\\b\""},{"type":"p","text":"se busca la palabra completa."},{"type":"p","text":"La diferencia es lingüísticamente relevante:"},{"type":"table","rows":[["Forma","Debe coincidir con \\bactual\\b","Motivo"],["actual","Sí","Es la palabra completa"],["Actual","Sí, si usamos IGNORECASE","Es la misma palabra con mayúscula"],["actually","No","Contiene más letras después"],["factually","No","actual está dentro de otra palabra"]],"title":"Ejemplos del patrón \\bactual\\b"},{"type":"p","text":"Este detalle evita ruido. En detección de falsos amigos, no queremos que actual se confunda con actually. Son problemas distintos y requieren equivalencias distintas."}]},{"id":"2-5-buscar-todas-las-coincidencias-con-re-findall","title":"2.5. Buscar todas las coincidencias con re.findall()","blocks":[{"type":"p","text":"re.findall() busca todas las apariciones de un patrón dentro de un texto y devuelve una lista."},{"type":"code","code":"patron = r\"\\bactual\\b\"\ncoincidencias = re.findall(patron, texto, flags=re.IGNORECASE)"},{"type":"p","text":"Si el patrón aparece tres veces, la lista tendrá tres elementos. Por eso se puede contar así:"},{"type":"code","code":"len(coincidencias)"},{"type":"p","text":"La opción flags=re.IGNORECASE hace que la búsqueda ignore mayúsculas y minúsculas. Así, Actual, ACTUAL y actual se detectan como la misma forma."},{"type":"p","text":"En un texto bilingüe de prueba, el recuento puede producir resultados como:"},{"type":"table","rows":[["Término buscado","Ocurrencias"],["actual","3"],["actually","1"],["sensible","2"],["eventually","2"],["assist","1"],["library","0"]],"title":"Ocurrencias encontradas"},{"type":"p","text":"Este tipo de tabla responde a una primera pregunta cuantitativa: qué términos sospechosos aparecen y con qué frecuencia."},{"type":"p","text":"Pero el recuento no basta. Saber que una palabra aparece no dice todavía si hay un error. Para revisar, necesitamos contexto."}]},{"id":"2-6-localizar-segmentos-con-split-n","title":"2.6. Localizar segmentos con split('\\n')","blocks":[{"type":"p","text":"Si el texto contiene varios segmentos separados por saltos de línea, se puede dividir así:"},{"type":"code","code":"oraciones = texto.split('\\n')"},{"type":"p","text":"El resultado es una lista. Cada elemento corresponde a una línea del texto original."},{"type":"p","text":"Por ejemplo:"},{"type":"code","code":"[\n    \"The patient is actually very sensible to the drug. El paciente es actualmente muy sensible al medicamento.\",\n    \"Eventually, the physician decided to assist the patient. Eventualmente, el médico decidió asistir al paciente.\",\n    ...\n]"},{"type":"p","text":"Esta estrategia funciona porque cada línea representa un segmento bilingüe. En lugar de revisar todo el bloque como una unidad, podemos analizar segmento por segmento."},{"type":"p","text":"En PLN, segmentar correctamente es una decisión importante. Aquí no usamos .split('.') porque un punto aparece dentro de cada segmento y separaría de forma demasiado agresiva. Usamos .split('\\n') porque el salto de línea marca la unidad de revisión que nos interesa."}]},{"id":"2-7-limpiar-lineas-con-strip","title":"2.7. Limpiar líneas con strip()","blocks":[{"type":"p","text":"Cuando un texto multilínea empieza o termina con saltos de línea, pueden aparecer elementos vacíos en la lista. Por eso se usa:"},{"type":"code","code":"oracion = oracion.strip()"},{"type":"p","text":".strip() elimina espacios, tabulaciones y saltos de línea al principio y al final de una cadena."},{"type":"p","text":"Después se puede comprobar:"},{"type":"code","code":"if oracion:\n    ..."},{"type":"p","text":"En Python, una cadena vacía se interpreta como False; una cadena con contenido se interpreta como True. Por tanto, if oracion: significa: \"solo continúa si esta línea tiene texto\"."},{"type":"p","text":"Esta limpieza evita que el programa intente analizar líneas vacías y genere salidas innecesarias."}]},{"id":"2-8-comprobar-presencia-con-re-search","title":"2.8. Comprobar presencia con re.search()","blocks":[{"type":"p","text":"re.search() busca un patrón dentro de una cadena y se detiene cuando encuentra la primera coincidencia. Si encuentra algo, devuelve un objeto de coincidencia. Si no encuentra nada, devuelve None."},{"type":"p","text":"Por eso se usa dentro de una condición:"},{"type":"code","code":"if re.search(patron, oracion, flags=re.IGNORECASE):\n    print(oracion)"},{"type":"p","text":"La lectura es:"},{"type":"code","code":"Si esta línea contiene el patrón, muéstrala."},{"type":"p","text":"La diferencia con findall() es fundamental:"},{"type":"table","rows":[["Función","Qué devuelve","Para qué se usa"],["re.findall()","Lista de todas las coincidencias","Contar ocurrencias"],["re.search()","Primera coincidencia o None","Decidir si una línea se incluye en el informe"]],"title":"Funciones del módulo re"},{"type":"p","text":"En control de calidad, findall() ayuda a medir. search() ayuda a filtrar."}]},{"id":"2-9-glosarios-como-diccionarios","title":"2.9. Glosarios como diccionarios","blocks":[{"type":"p","text":"Un diccionario de Python guarda pares clave-valor. Para detectar falsos amigos, podemos usar un diccionario donde:"},{"type":"ul","items":["La clave sea la forma inglesa que queremos vigilar.","El valor sea la traducción literal problemática en español."]},{"type":"p","text":"Ejemplo:"},{"type":"code","code":"falsos_amigos = {\n    \"actual\": \"actual\",\n    \"actually\": \"actualmente\",\n    \"sensible\": \"sensible\",\n    \"eventually\": \"eventualmente\",\n    \"assist\": \"asistir\",\n    \"library\": \"librería\"\n}"},{"type":"p","text":"Este diccionario representa conocimiento lingüístico contrastivo. No es una lista cualquiera. Es una hipótesis de revisión: «si aparece esta forma inglesa y además aparece esta forma española, puede haberse producido una transferencia errónea»."},{"type":"p","text":"Conviene distinguir entre dos tipos de glosario:"},{"type":"table","rows":[["Tipo de glosario","Qué almacena","Ejemplo"],["Glosario de riesgo","Traducción literal problemática","actually -> actualmente"],["Glosario de corrección","Equivalencia recomendada","actually -> en realidad"]],"title":"Tipos de glosario"},{"type":"p","text":"El primer glosario ayuda a detectar. El segundo ayuda a proponer."}]},{"id":"2-10-recorrer-el-glosario-con-un-bucle-for","title":"2.10. Recorrer el glosario con un bucle for","blocks":[{"type":"p","text":"Si hay seis falsos amigos, podríamos escribir seis búsquedas manuales. Pero eso sería poco eficiente. Un bucle permite repetir la misma operación para cada entrada del glosario."},{"type":"code","code":"for palabra in falsos_amigos:\n    resultados = re.findall(fr\"\\b{palabra}\\b\", texto, flags=re.IGNORECASE)\n    print(palabra, len(resultados))"},{"type":"p","text":"Cuando se recorre un diccionario directamente, Python recorre sus claves. En este ejemplo, palabra irá tomando valores como:"},{"type":"code","code":"\"actual\"\n\"actually\"\n\"sensible\"\n\"eventually\"\n\"assist\"\n\"library\""},{"type":"p","text":"La ventaja es que el código se vuelve escalable. Si se añaden nuevos falsos amigos al diccionario, el bucle no cambia."},{"type":"p","text":"Desde el punto de vista profesional, esta es la diferencia entre un truco puntual y una herramienta reutilizable."}]},{"id":"2-11-patrones-dinamicos-con-f-strings-raw","title":"2.11. Patrones dinámicos con f-strings raw","blocks":[{"type":"p","text":"Dentro del bucle necesitamos construir un patrón diferente para cada palabra. Para eso se usa:"},{"type":"code","code":"fr\"\\b{palabra}\\b\""},{"type":"p","text":"Este string combina dos propiedades:"},{"type":"table","rows":[["Prefijo","Función"],["f","Permite insertar el valor de una variable"],["r","Mantiene las barras invertidas como literales"]],"title":"Prefijos de cadena en Python"},{"type":"p","text":"Si palabra vale actually, el patrón final será:"},{"type":"code","code":"\\bactually\\b"},{"type":"p","text":"Si palabra vale library, el patrón final será:"},{"type":"code","code":"\\blibrary\\b"},{"type":"p","text":"Esta técnica es muy potente porque permite convertir un glosario en una serie automática de búsquedas."}]},{"id":"2-12-primer-tipo-de-informe-segmentos-sospechosos","title":"2.12. Primer tipo de informe: segmentos sospechosos","blocks":[{"type":"p","text":"El primer informe útil consiste en mostrar todos los segmentos donde aparece una palabra del glosario."},{"type":"p","text":"La lógica es:"},{"type":"ol","items":["Dividir el texto en líneas.","Recorrer cada línea.","Recorrer cada palabra del glosario.","Comprobar si esa palabra aparece en la línea.","Mostrar una advertencia."]},{"type":"p","text":"Un esquema de código sería:"},{"type":"code","code":"oraciones = texto.split('\\n')\n\nfor oracion in oraciones:\n    if oracion.strip():\n        for palabra in falsos_amigos:\n            if re.search(fr\"\\b{palabra}\\b\", oracion, flags=re.IGNORECASE):\n                print(\"Segmento con posible falso amigo:\", palabra)\n                print(oracion)"},{"type":"p","text":"Este informe detecta riesgos. Es útil para una primera criba, pero todavía puede generar falsos positivos."},{"type":"p","text":"Por ejemplo:"},{"type":"code","code":"Eventually, the patient decided to look for a second opinion. Al final, el paciente decidió buscar una segunda opinión."},{"type":"p","text":"El segmento contiene Eventually, pero la traducción Al final es correcta. Si el informe solo detecta la palabra inglesa, marcará un segmento que no contiene error."},{"type":"p","text":"Por eso se necesita una regla más precisa."}]},{"id":"2-13-segundo-tipo-de-informe-error-probable-en-to-y-tm","title":"2.13. Segundo tipo de informe: error probable en TO y TM","blocks":[{"type":"p","text":"Para reducir falsos positivos, se puede exigir una condición doble:"},{"type":"ol","items":["Que aparezca la palabra inglesa sospechosa.","Que aparezca también la traducción literal problemática en español."]},{"type":"p","text":"En Python se expresa con and:"},{"type":"code","code":"if (\n    re.search(fr\"\\b{palabra}\\b\", oracion, flags=re.IGNORECASE)\n    and re.search(fr\"\\b{traduccion_erronea}\\b\", oracion, flags=re.IGNORECASE)\n):\n    print(oracion)"},{"type":"p","text":"Esta condición dice:"},{"type":"code","code":"Muestra el segmento solo si contiene la forma inglesa y la forma española problemática."},{"type":"p","text":"Por ejemplo:"},{"type":"code","code":"Actually, I wanted to visit the library. Actualmente, quería visitar la librería."},{"type":"p","text":"Este segmento cumple dos relaciones problemáticas:"},{"type":"table","rows":[["Inglés","Español detectado","Motivo"],["Actually","Actualmente","Falso amigo"],["library","librería","Falso amigo"]],"title":"Ejemplo de falso amigo detectado"},{"type":"p","text":"En cambio:"},{"type":"code","code":"The nurse was eventually informed about the side effects. La enfermera fue informada finalmente sobre los efectos secundarios."},{"type":"p","text":"contiene eventually, pero no contiene eventualmente. Por tanto, no debería aparecer en el informe de errores probables."},{"type":"p","text":"Esta diferencia es esencial: no todo riesgo detectado es un error cometido."}]},{"id":"2-14-glosario-de-correccion-no-solo-avisar-tambien-orientar","title":"2.14. Glosario de corrección: no solo avisar, también orientar","blocks":[{"type":"p","text":"Un informe profesional debe intentar ser útil para la persona revisora. No basta con decir «aquí hay algo». Conviene indicar qué se ha detectado y qué alternativa podría valorarse."},{"type":"p","text":"Para eso se define un segundo diccionario:"},{"type":"code","code":"falsos_amigos_corr = {\n    \"actual\": \"real\",\n    \"actually\": \"en realidad, realmente\",\n    \"sensible\": \"sensato\",\n    \"eventually\": \"al final, finalmente\",\n    \"assist\": \"ayudar\",\n    \"library\": \"biblioteca\"\n}"},{"type":"p","text":"Con los dos diccionarios, el informe puede mostrar:"},{"type":"code","code":"Falso amigo detectado: actually ↔ actualmente\nTraducción correcta sugerida: en realidad, realmente"},{"type":"p","text":"El símbolo ↔ no tiene valor computacional especial en este caso; se usa para presentar visualmente la relación entre la forma origen y la forma problemática en la traducción."},{"type":"p","text":"El sistema no impone una corrección única. Propone una equivalencia posible. En traducción, la solución depende del contexto, del género textual y de las convenciones terminológicas."}]},{"id":"2-15-que-ocurre-con-variantes-morfologicas","title":"2.15. Qué ocurre con variantes morfológicas","blocks":[{"type":"p","text":"Un patrón como:"},{"type":"code","code":"r\"\\bassist\\b\""},{"type":"p","text":"detecta assist, pero no detecta necesariamente:"},{"type":"code","code":"assisted\nassisting\nassistance"},{"type":"p","text":"Esto es coherente con el patrón: hemos pedido una palabra exacta. Si queremos detectar una familia morfológica, necesitamos otra estrategia."},{"type":"p","text":"Una opción básica sería ampliar el patrón:"},{"type":"code","code":"r\"\\bassist(ed|ing|ance)?\\b\""},{"type":"p","text":"Pero esta solución ya introduce más complejidad. Además, no todas las familias léxicas se comportan de forma tan sencilla."},{"type":"p","text":"Otra opción profesional sería usar herramientas de análisis morfológico o lematización. Un lematizador intenta reducir formas flexionadas a una forma base. Así, assisted podría relacionarse con el lema assist."},{"type":"p","text":"Esta limitación muestra una frontera importante: las expresiones regulares son muy útiles para patrones superficiales, pero no sustituyen un análisis lingüístico más profundo."}]},{"id":"2-16-falsos-positivos-y-falsos-negativos","title":"2.16. Falsos positivos y falsos negativos","blocks":[{"type":"p","text":"En detección automática conviene distinguir dos tipos de error del sistema:"},{"type":"table","rows":[["Tipo","Qué ocurre","Ejemplo"],["Falso positivo","El sistema marca un caso que no es error","eventually traducido correctamente como finalmente"],["Falso negativo","El sistema no marca un error real","assisted no detectado por buscar solo assist"]],"title":"Tipos de error en la detección"},{"type":"p","text":"Un buen sistema intenta reducir ambos, pero siempre hay una tensión:"},{"type":"ul","items":["Si el patrón es muy amplio, detecta más casos, pero genera más ruido.","Si el patrón es muy estricto, genera menos ruido, pero puede dejar escapar errores."]},{"type":"p","text":"En control de calidad lingüística, esta tensión se parece a la relación entre cobertura y precisión:"},{"type":"ul","items":["Cobertura: cuántos errores potenciales alcanza a detectar el sistema.","Precisión: cuántos de los casos detectados son realmente relevantes."]},{"type":"p","text":"La condición doble TO-TM mejora la precisión, porque exige más evidencia antes de mostrar un segmento. Pero puede reducir la cobertura si el error aparece con una variante no prevista en el glosario."}]}],"navTitle":"Python y falsos amigos"},{"id":"errores-frecuentes-de-aprendizaje","title":"Errores frecuentes de aprendizaje","blocks":[{"type":"errorlist","items":[{"term":"Confundir coincidencia con error: Que aparezca una palabra sospechosa no significa automáticamente que la traducción sea incorrecta.","desc":"Olvidar `\\b`: Sin límites de palabra, se pueden capturar fragmentos dentro de palabras más largas."},{"term":"Olvidar `re.IGNORECASE`: Si no se ignoran mayúsculas, el sistema puede no detectar términos al inicio de oración.","desc":"Confundir `findall()` y `search()`: findall() sirve para contar. search() sirve para filtrar."},{"term":"No revisar variantes flexionadas: Buscar assist no basta para detectar assisted.","desc":"Usar variables antiguas en entornos interactivos: En un entorno interactivo, una variable definida antes puede seguir activa. Eso puede ocultar errores si se reutilizan nombres sin cuidado."}]}],"subsections":[],"navTitle":"Errores frecuentes"},{"id":"sintesis-final","title":"Síntesis final","blocks":[{"type":"p","text":"En esta unidad has visto cómo una tarea lingüística puede convertirse en un procedimiento computacional. El punto de partida es un problema real: detectar falsos amigos en traducción automática biomédica. El punto de llegada es una primera herramienta de control de calidad capaz de buscar patrones, contar ocurrencias, localizar segmentos y proponer alternativas."},{"type":"p","text":"La idea central es que Python no «sabe» traducción. Lo que hace Python es ejecutar reglas. La parte lingüística consiste en decidir qué reglas merece la pena formular: qué términos son peligrosos, qué traducciones son sospechosas, qué contexto hay que mostrar y qué nivel de evidencia necesitamos antes de marcar un segmento."},{"type":"p","text":"Las expresiones regulares ofrecen una entrada muy poderosa al PLN aplicado porque permiten convertir observaciones lingüísticas en patrones verificables. Aun así, su potencia depende de la precisión del análisis previo. Una buena regex nace de una buena pregunta lingüística."},{"type":"p","text":"En el escenario de la empresa biomédica, esta herramienta no entrega una traducción final. Entrega algo igual de importante en un flujo profesional: una lista priorizada de lugares donde mirar. Esa lista ahorra tiempo, mejora la coherencia y añade una capa de seguridad lingüística antes de que el texto llegue al cliente o al usuario final."}],"subsections":[],"navTitle":"Síntesis"},{"id":"cierre-narrativo","title":"Cierre narrativo","blocks":[{"type":"p","text":"La empresa tecnológica no necesita solo más datos ni más modelos. Necesita mejores mecanismos de control. En traducción automática biomédica, la fluidez no basta: hay que vigilar la precisión léxica, la adecuación terminológica y la seguridad comunicativa."},{"type":"p","text":"Tu papel como lingüista computacional consiste en tender un puente entre conocimiento experto y automatización. Sabes qué errores son peligrosos, sabes cómo se manifiestan en los textos y aprendes a convertir ese conocimiento en reglas ejecutables."},{"type":"p","text":"Esa es la competencia de fondo de esta unidad: diseñar pequeñas herramientas que hagan visible lo que, en un corpus grande, podría quedar oculto. Python busca; la lingüista decide qué buscar, por qué importa y cómo debe interpretarse el resultado."}],"subsections":[],"navTitle":"Cierre narrativo"}],"references":[{"key":"bird2009","text":"Bird, S., Klein, E. y Loper, E. (2009). *Natural language processing with Python*. O'Reilly Media. https://www.nltk.org/book/"},{"key":"chamizo2008","text":"Chamizo Domínguez, P. J. (2008). *Semantics and pragmatics of false friends*. Routledge."},{"key":"friedl2006","text":"Friedl, J. E. F. (2006). *Mastering regular expressions* (3rd ed.). O'Reilly Media. https://www.oreilly.com/library/view/mastering-regular-expressions/0596528124/"},{"key":"goyvaerts2009","text":"Goyvaerts, J. y Levithan, S. (2009). *Regular expressions cookbook*. O'Reilly Media."},{"key":"jurafsky2026","text":"Jurafsky, D. y Martin, J. H. (2026). *Speech and language processing* (3rd ed. draft). Stanford University. https://web.stanford.edu/~jurafsky/slp3/"},{"key":"kleene1956","text":"Kleene, S. C. (1956). Representation of events in nerve nets and finite automata. In C. E. Shannon & J. McCarthy (Eds.), *Automata studies* (pp. 3-42). Princeton University Press."},{"key":"psf2026","text":"Python Software Foundation. (2026). re: Regular expression operations. *Python 3.14 documentation*. https://docs.python.org/3/library/re.html"}]}};

  function sha256Hex(text) {
    var enc = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", enc).then(function(buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function(b) {
        return b.toString(16).padStart(2, "0");
      }).join("");
    });
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function renderQuizQuestion() {

    if (quizState.index >= total) {
      root.innerHTML =
        '<div class="quiz-result">' +
        '<div class="quiz-score">' + quizState.score + ' / ' + total + '</div>' +
        '<p>Puntuación de este intento.</p>' +

    }

    var html = '<div class="quiz-progress">Pregunta ' + (quizState.index + 1) + ' de ' + total + ' · Puntuación provisional: ' + quizState.score + '</div>';
    html += '<div class="quiz-q"><h3>' + q.question + '</h3>';
    opts.forEach(function(opt, i) {
      html += '<button class="quiz-opt" data-idx="' + i + '">' + opt.text + '</button>';

    html += '<div class="quiz-feedback" id="quiz-feedback" hidden></div>';

    var buttons = root.querySelectorAll(".quiz-opt");
    buttons.forEach(function(btn, i) {
      btn.addEventListener("click", function() {
        buttons.forEach(function(b) { b.disabled = true; });

        if (chosen.isCorrect) { btn.classList.add("correct"); quizState.score++; }
        else {

        next.textContent = quizState.index + 1 < total ? "Siguiente" : "Ver puntuación";

      });

  function imEsc(s) {

  function imFormatBackticks(s) {
    var parts = s.split("`"), out = "";
    for (var i = 0; i < parts.length; i++) out += (i % 2 === 1) ? '<code class="im-inline">' + imEsc(parts[i]) + "</code>" : imEsc(parts[i]);
    return out;
  }
  function imFormatInline(raw) {
    var re = /{{cite:([^}]*)}}([\s\S]*?){{\/cite}}/g;
    var out = "", last = 0, m;
    while ((m = re.exec(raw))) {
      out += imFormatBackticks(raw.slice(last, m.index));
      out += '<span class="im-cite" data-refs="' + m[1] + '">' + imFormatBackticks(m[2]) + ' <span aria-hidden="true">ⓘ</span></span>';
      last = re.lastIndex;
    }
    out += imFormatBackticks(raw.slice(last));
    return out;
  }
  function imLinkify(text) {
    var re = /(https?:\/\/[^\s]+)/g;
    var out = "", last = 0, m;
    while ((m = re.exec(text))) {
      out += imEsc(text.slice(last, m.index));
      var url = m[1].replace(/[.,;]+$/, "");
      out += '<a href="' + imEsc(url) + '" target="_blank" rel="noopener">' + imEsc(url) + "</a>";
      last = m.index + url.length;
    }
    out += imEsc(text.slice(last));
    return out;
  }
  function imBibText(text) {
    // *word* marks an APA-italicized container title (book/journal name+volume/etc.)
    return text.split(/(\*[^*]+\*)/g).map(function(part) {
      if (part.charAt(0) === "*" && part.charAt(part.length - 1) === "*" && part.length > 1) {
        return "<em>" + imLinkify(part.slice(1, -1)) + "</em>";
      }
      return imLinkify(part);
    }).join("");
  }

      head.addEventListener("click", function() {
        var thisSub = head.parentElement;
        var wasOpen = thisSub.classList.contains("open");
        root.querySelectorAll(".im-sub.open").forEach(function(s) { s.classList.remove("open"); });
        if (!wasOpen) thisSub.classList.add("open");
      });
    });
  }
  function imShowIndex(root, data) {
    var pdf = root.dataset.pdf;
    var cards = data.sections.map(function(sec, i) {
      var icon = IM_ICONS[sec.navTitle] || "📖";
      return '<button class="im-card" data-im-chapter="' + i + '" style="animation-delay:' + (i * 0.04) + 's">' +
        '<span class="im-card-icon">' + icon + '</span>' +
        '<span class="im-card-title">' + imEsc(sec.navTitle) + "</span>" +
        (sec.subsections.length ? '<span class="im-card-meta">' + sec.subsections.length + " apartados</span>" : "") +
        "</button>";
    }).join("");
    var bibCard = (data.references && data.references.length)
      ? '<button class="im-card im-card-bib" data-im-bib="1" style="animation-delay:' + (data.sections.length * 0.04) + 's">' +
        '<span class="im-card-icon">📖</span><span class="im-card-title">Bibliografía</span>' +
        '<span class="im-card-meta">' + data.references.length + ' referencias en APA 7ª ed.</span></button>'
      : "";
    var hero = '<div class="im-hero">' +
      (pdf ? '<a class="im-hero-dl" href="' + imEsc(pdf) + '" download>⬇ Descargar manual en PDF</a>' : "") +
      '<div class="im-hero-kicker">' + imEsc(data.header.kicker) + " · " + imEsc(data.header.title) + "</div>" +
      '<h1 class="im-hero-title">' + imEsc(data.header.subtitle) + "</h1></div>";
    root.innerHTML = hero + '<div class="im-grid">' + cards + bibCard + "</div>";
    root.querySelectorAll("[data-im-chapter]").forEach(function(btn) {
      btn.addEventListener("click", function() { imShowChapter(root, data, parseInt(btn.dataset.imChapter, 10)); });
    });
    var bibBtn = root.querySelector("[data-im-bib]");
    if (bibBtn) bibBtn.addEventListener("click", function() { imShowBib(root, data, null); });
  }
  function renderInteractiveManual(viewKey) {
    if (imRendered[viewKey]) return;
    imRendered[viewKey] = true;
    var data = IM_DATA[viewKey];
    if (!data) return;
    var root = document.getElementById("im-root-" + viewKey);
    if (!root) return;
    imShowIndex(root, data);
  }

  function wireNav() {
    document.querySelectorAll(".hub-btn").forEach(function(btn) {
      btn.addEventListener("click", function() {
        showView(btn.dataset.view);
        if (btn.dataset.view === "quiz") renderQuizStart();
        if (IM_DATA[btn.dataset.view]) renderInteractiveManual(btn.dataset.view);
      });
    });
    document.querySelectorAll("[data-back]").forEach(function(btn) {
      btn.addEventListener("click", function() { showView(btn.dataset.back); });
    });
  }

  function applyStudentVisibility(config) {
    document.querySelectorAll(".hub-btn[data-type]").forEach(function(btn) {
      var t = btn.dataset.type;
      btn.style.display = config[t] ? "" : "none";
    });
  }

  function applyTeacherHints(config) {
    document.querySelectorAll(".teacher-hint[data-hint]").forEach(function(span) {
      var t = span.dataset.hint;
      var on = !!config[t];
      span.textContent = on ? "visible" : "oculto";
      span.className = "teacher-hint " + (on ? "on" : "off");
    });
    document.querySelectorAll("#teacher-panel input[type=checkbox][data-type]").forEach(function(chk) {
      chk.checked = !!config[chk.dataset.type];
    });
  }

  function fetchConfig() {
    return fetch(LOCAL_CONFIG + "?t=" + Date.now()).then(function(r) { return r.json(); });
  }

  function ghHeaders(token) {
    return { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" };
  }

  function ghGetFile(token) {
    return fetch("https://api.github.com/repos/" + REPO + "/contents/" + GH_CONFIG_PATH, { headers: ghHeaders(token) })
      .then(function(r) {
        if (!r.ok) throw new Error("No se pudo leer el fichero (" + r.status + ")");
        return r.json();
      })
      .then(function(data) {
        configSha = data.sha;
        return JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\n/g, "")))));
      });
  }

  function ghSaveFile(token, configObj) {
    var content = btoa(unescape(encodeURIComponent(JSON.stringify(configObj, null, 2) + "\n")));
    return fetch("https://api.github.com/repos/" + REPO + "/contents/" + GH_CONFIG_PATH, {
      method: "PUT",
      headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders(token)),
      body: JSON.stringify({
        message: "Modo profesora: actualizar visibilidad de materiales (" + GH_CONFIG_PATH + ")",
        content: content,
        sha: configSha
      })
    }).then(function(r) {
      if (!r.ok) return r.text().then(function(t) { throw new Error("Error al guardar (" + r.status + "): " + t); });
      return r.json();
    }).then(function(data) {
      configSha = data.content.sha;
    });
  }

  function getToken() {
    try { return sessionStorage.getItem("gh_pat") || ""; } catch (e) { return ""; }
  }
  function setToken(t) {
    try { sessionStorage.setItem("gh_pat", t); } catch (e) {}
  }

  function setStatus(msg, isError) {
    var el = document.getElementById("teacher-status");
    if (!el) return;
    el.textContent = msg;
    el.style.color = isError ? "#FFB3B3" : "#9FE6A0";
  }

  function initTeacherPanel() {
    document.getElementById("teacher-panel").hidden = false;
    var tokenInput = document.getElementById("gh-token");
    tokenInput.value = getToken();

    document.getElementById("gh-token-save").addEventListener("click", function() {
      setToken(tokenInput.value.trim());
      setStatus(tokenInput.value.trim() ? "Token guardado para esta sesión." : "Token borrado.");
      refreshFromGithub();
    });

    document.querySelectorAll("#teacher-panel input[type=checkbox][data-type]").forEach(function(chk) {
      chk.addEventListener("change", function() {
        var token = getToken();
        if (!token) { setStatus("Pega primero tu token de GitHub.", true); chk.checked = !chk.checked; return; }
        setStatus("Guardando...");
        ghGetFile(token).then(function(current) {
          current[chk.dataset.type] = chk.checked;
          return ghSaveFile(token, current).then(function() { return current; });
        }).then(function(current) {
          applyTeacherHints(current);
          setStatus("Guardado ✓ — el alumnado lo verá en 1-2 minutos.");
        }).catch(function(err) {
          chk.checked = !chk.checked;
          setStatus(err.message, true);
        });
      });
    });

    refreshFromGithub();

    function refreshFromGithub() {
      var token = getToken();
      if (!token) { fetchConfig().then(applyTeacherHints); return; }
      setStatus("Cargando estado actual...");
      ghGetFile(token).then(function(current) {
        applyTeacherHints(current);
        setStatus("Conectado. Puedes marcar/desmarcar materiales.");
      }).catch(function(err) { setStatus(err.message, true); fetchConfig().then(applyTeacherHints); });
    }
  }

  function reveal(teacherMode) {
    isTeacher = teacherMode;
    document.getElementById("content").innerHTML = decodeURIComponent(escape(atob(PAYLOAD)));
    document.getElementById("gate").style.display = "none";
    document.getElementById("page").style.display = "block";
    wireNav();
    if (teacherMode) {
      document.querySelectorAll(".hub-btn[data-type]").forEach(function(btn) { btn.style.display = ""; });
      initTeacherPanel();
    } else {
      fetchConfig().then(applyStudentVisibility);
    }
    try { sessionStorage.setItem(SESSION_KEY, teacherMode ? "teacher" : "1"); } catch (e) {}
  }

  function tryUnlock() {
    var val = document.getElementById("pw").value;
    sha256Hex(val).then(function(hex) {
      if (hex === TEACHER_HASH) { reveal(true); return; }
      if (hex === HASH) {
        fetch(ROOT_CONFIG + "?t=" + Date.now()).then(function(r) { return r.json(); }).then(function(rootCfg) {
          if (rootCfg[TEMA_KEY] === false) {
            document.getElementById("err").textContent = "Este tema no está disponible por el momento.";
          } else {
            reveal(false);
          }
        }).catch(function() { reveal(false); });
        return;
      }
      document.getElementById("err").textContent = "Contraseña incorrecta.";
    });
  }

  document.getElementById("enter").addEventListener("click", tryUnlock);
  document.getElementById("pw").addEventListener("keydown", function(e) { if (e.key === "Enter") tryUnlock(); });

  try {
    var saved = sessionStorage.getItem(SESSION_KEY);
    if (saved === "teacher") reveal(true);
    else if (saved === "1") reveal(false);
  } catch (e) {}
})();
</script>
</body>
</html>
