<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tema 2 — PLN</title>
<style>

:root {
  --azul: #003B5C;
  --azul-d: #00283F;
  --amar: #F4C542;
  --gris: #34484F;
  --claro: #F3F3F4;
  --humo: #9FB1BA;
  --verde: #2E7D32;
  --rojo: #B00020;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: var(--gris); background:#fff; }
a { color: inherit; }

#gate { position:fixed; inset:0; background:var(--azul); display:flex; align-items:center; justify-content:center; padding:24px; z-index:999; }
#gate .box { max-width:380px; width:100%; text-align:center; }
#gate .kicker { color:var(--amar); font-size:12px; font-weight:bold; letter-spacing:2.5px; text-transform:uppercase; margin-bottom:10px; }
#gate h1 { color:#fff; font-size:26px; margin:0 0 10px; }
#gate p { color:var(--humo); font-size:14px; margin:0 0 26px; }
#gate input { width:100%; padding:13px 16px; border-radius:8px; border:none; font-size:15px; font-family:Arial,Helvetica,sans-serif; margin-bottom:14px; outline:2px solid transparent; }
#gate input:focus { outline:2px solid var(--amar); }
#gate button.submit { width:100%; padding:13px 16px; border-radius:8px; border:none; background:var(--amar); color:var(--azul-d); font-size:15px; font-weight:bold; font-family:Arial,Helvetica,sans-serif; cursor:pointer; }
#gate button.submit:hover { filter:brightness(1.06); }
#gate .error { color:#FFB3B3; font-size:13px; margin-top:12px; min-height:18px; }
#page { display:none; }
main { max-width:980px; margin:0 auto; padding:48px 6vw 60px; }
.kicker { color:var(--amar); font-size:12px; font-weight:bold; letter-spacing:2.5px; text-transform:uppercase; margin-bottom:8px; }
.view > h1 { color:var(--azul); font-size:32px; margin:0 0 34px; }
.hub-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; margin-bottom:30px; }
.hub-btn { display:flex; flex-direction:column; align-items:flex-start; gap:6px; background:var(--claro); border:none; border-radius:12px; padding:26px 22px; cursor:pointer; text-align:left; box-shadow:0 2px 10px rgba(159,177,186,.28); font-family:Arial,Helvetica,sans-serif; position:relative; }
.hub-btn:hover { background:#E9ECEE; }
.hub-icon { font-size:30px; margin-bottom:4px; }
.hub-label { font-size:17px; font-weight:bold; color:var(--azul); }
.hub-desc { font-size:12.5px; color:var(--humo); }
.back-home { font-size:13px; color:var(--humo); text-decoration:none; }
.back-home:hover { color:var(--azul); }
.sub-view h2 { color:var(--azul); font-size:24px; margin:18px 0 4px; }
.sub-view .section-note { font-size:13px; color:var(--humo); margin:0 0 24px; }
.back-btn { background:none; border:1.5px solid var(--azul); color:var(--azul); font-size:13px; font-weight:bold; padding:6px 14px; border-radius:20px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.back-btn:hover { background:var(--azul); color:#fff; }
.dl-big { display:inline-block; background:var(--amar); color:var(--azul-d); font-weight:bold; font-size:14px; text-decoration:none; padding:10px 20px; border-radius:20px; margin-bottom:18px; }
.pdf-frame { width:100%; height:78vh; border:none; border-radius:8px; box-shadow:0 2px 10px rgba(159,177,186,.28); }
.img-frame { display:block; width:100%; height:auto; border-radius:8px; box-shadow:0 2px 10px rgba(159,177,186,.28); }
.ref-intro { color:var(--azul); font-size:16px; margin:0 0 16px; }
.ref-item { font-size:13.5px; color:var(--gris); line-height:1.6; margin:0 0 16px; padding-left:28px; text-indent:-28px; }
.ref-item a { color:var(--azul); word-break:break-all; }
.ref-item em { font-style:italic; }
.notice { font-size:12px; color:var(--humo); font-style:italic; margin-top:10px; }
/* quiz */
.quiz-start { background:var(--claro); border-radius:12px; padding:26px; }
.quiz-start p { font-size:14px; margin:0 0 18px; }
.quiz-btn { background:var(--azul); color:#fff; border:none; border-radius:20px; padding:11px 22px; font-size:14px; font-weight:bold; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.quiz-btn:hover { filter:brightness(1.15); }
.quiz-progress { font-size:12px; color:var(--humo); margin-bottom:6px; }
.quiz-q { background:var(--claro); border-radius:12px; padding:24px; margin-bottom:18px; }
.quiz-q h3 { color:var(--azul); font-size:17px; margin:0 0 18px; }
.quiz-opt { display:block; width:100%; text-align:left; background:#fff; border:1.5px solid var(--humo); border-radius:8px; padding:12px 16px; margin-bottom:10px; font-size:14px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; color:var(--gris); }
.quiz-opt:hover { border-color:var(--azul); }
.quiz-opt.correct { border-color:var(--verde); background:#EAF6EB; font-weight:bold; }
.quiz-opt.incorrect { border-color:var(--rojo); background:#FBEAEC; }
.quiz-opt[disabled] { cursor:default; }
.quiz-feedback { font-size:13px; color:var(--gris); background:#fff; border-radius:8px; padding:12px 16px; margin-top:4px; margin-bottom:16px; border-left:3px solid var(--azul); }
.quiz-score { font-size:26px; font-weight:bold; color:var(--azul); margin-bottom:8px; }
.quiz-result { background:var(--claro); border-radius:12px; padding:30px; text-align:center; }
/* teacher panel */
.teacher-banner { background:var(--azul-d); color:#fff; border-radius:12px; padding:18px 22px; margin-bottom:24px; }
.teacher-banner strong { color: var(--amar); }
.teacher-banner p { font-size:13px; margin:6px 0 0; color:var(--humo); }
.teacher-token-row { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
.teacher-token-row input { flex:1; min-width:220px; padding:9px 12px; border-radius:8px; border:none; font-size:13px; font-family:Arial,Helvetica,sans-serif; }
.teacher-token-row button { background:var(--amar); color:var(--azul-d); border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:bold; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.teacher-status { font-size:12px; margin-top:10px; min-height:16px; }
.teacher-toggle-list { list-style:none; padding:0; margin:16px 0 0; display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; }
.teacher-toggle-list li { background:rgba(255,255,255,.08); border-radius:8px; padding:10px 14px; display:flex; align-items:center; gap:10px; font-size:13px; }
.teacher-toggle-list input { width:18px; height:18px; }
.hub-btn .teacher-hint { position:absolute; top:10px; right:12px; font-size:10px; font-weight:bold; padding:2px 8px; border-radius:10px; }
.hub-btn .teacher-hint.on { background:#DFF3E0; color:var(--verde); }
.hub-btn .teacher-hint.off { background:#FBEAEC; color:var(--rojo); }
footer { text-align:center; padding:26px 6vw 40px; font-size:11px; color:var(--humo); font-style:italic; }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <div class="kicker">Tema 2</div>
    <h1>PLN</h1>
    <p>Contenido protegido. Introduce la contraseña facilitada en clase.</p>
    <input type="password" id="pw" placeholder="Contraseña" autofocus>
    <button class="submit" id="enter">Acceder</button>
    <div class="error" id="err"></div>
  </div>
</div>

<div id="page">
  <main id="content"></main>
  <footer>

  </footer>
</div>

  var QUIZ_MANUAL = [{"question":"En un flujo de traducción automática de textos biomédicos, se puede añadir una capa automática que revise los segmentos ya traducidos en busca de patrones léxicos de riesgo, antes de que un revisor humano los lea. ¿Cuál es la función principal de esa capa de vigilancia lingüística?","answerOptions":[{"text":"Localizar patrones de riesgo para que la revisión humana se concentre en los casos de mayor riesgo.","isCorrect":true,"rationale":"El objetivo es automatizar lo repetitivo para permitir que el lingüista se enfoque en lo que exige criterio experto."},{"text":"Sustituir íntegramente la labor del revisor humano para agilizar el pipeline.","isCorrect":false,"rationale":"La herramienta no sustituye el criterio experto: ayuda a priorizar los segmentos que requieren atención."},{"text":"Detectar errores gramaticales complejos mediante el análisis sintáctico del texto.","isCorrect":false,"rationale":"La herramienta se centra en patrones léxicos y falsos amigos, no en la estructura gramatical o sintáctica de la frase."},{"text":"Garantizar que la traducción automática sea semánticamente perfecta antes de la revisión.","isCorrect":false,"rationale":"Las expresiones regulares tienen límites y no comprenden el significado semántico profundo del texto."}],"hint":"Considera si la herramienta es un reemplazo o un apoyo para el profesional."},{"question":"En el contexto de las expresiones regulares en Python, ¿por qué es una buena práctica usar cadenas 'raw' como `r\"\\bactual\\b\"`?","answerOptions":[{"text":"Para que Python interprete las barras invertidas de forma literal y no como caracteres especiales.","isCorrect":true,"rationale":"La r inicial evita que Python procese secuencias como \\b o \\n antes de que lleguen al motor de expresiones regulares."},{"text":"Para obligar al motor de búsqueda a ignorar la distinción entre mayúsculas y minúsculas.","isCorrect":false,"rationale":"Esa función la cumple el flag re.IGNORECASE, no el prefijo de cadena raw."},{"text":"Para que el patrón solo busque palabras que estén en formato de texto crudo sin formato.","isCorrect":false,"rationale":"'Raw string' se refiere al tratamiento de los caracteres de escape en el código, no al formato del texto de entrada."},{"text":"Para optimizar la velocidad de ejecución del módulo re al procesar corpus de gran tamaño con miles de documentos.","isCorrect":false,"rationale":"Aunque es una buena práctica, su función principal es la claridad sintáctica y evitar errores de escape, no el rendimiento del motor."}],"hint":"Piensa en cómo trata Python el carácter de la barra invertida (backslash)."},{"question":"Si se desea identificar la palabra completa 'actual' y evitar que se capture dentro de 'actually', ¿qué elemento de la expresión regular es imprescindible?","answerOptions":[{"text":"El uso de límites de palabra representados por `\\b`.","isCorrect":true,"rationale":"El símbolo \\b marca la frontera entre caracteres de palabra y espacios o signos, garantizando que se capture la palabra exacta."},{"text":"El uso del cuantificador '+' al final del patrón.","isCorrect":false,"rationale":"El cuantificador '+' busca una o más repeticiones, lo que no ayuda a delimitar fronteras de palabra."},{"text":"La inclusión de un punto al final del patrón léxico.","isCorrect":false,"rationale":"En regex, el punto es un comodín que representa cualquier carácter, lo que aumentaría las capturas no deseadas."},{"text":"El empleo de paréntesis para crear un grupo de captura cerrado.","isCorrect":false,"rationale":"Los grupos de captura organizan subpatrones, pero no impiden que se encuentren coincidencias dentro de palabras más largas."}],"hint":"Busca el símbolo que define las fronteras o límites de una unidad léxica."},{"question":"En un sistema que revisa segmentos bilingües en busca de posibles errores léxicos, se puede usar `re.findall()` para contar cuántas veces aparece un patrón, o `re.search()` para comprobar si aparece al menos una vez en una línea concreta. ¿Cuál es la diferencia fundamental entre ambas funciones en ese tipo de flujo de control de calidad?","answerOptions":[{"text":"`re.findall()` se usa para contar todas las ocurrencias y `re.search()` para decidir si un segmento se incluye en un informe.","isCorrect":true,"rationale":"Findall localiza todas las apariciones para métricas, mientras que search filtra líneas basándose en la primera coincidencia encontrada."},{"text":"`re.findall()` devuelve objetos de coincidencia y `re.search()` devuelve una lista de strings.","isCorrect":false,"rationale":"Es al revés: findall() devuelve una lista de strings y search() devuelve un objeto de coincidencia (Match object)."},{"text":"`re.search()` es obligatorio para usar el flag `re.IGNORECASE`, mientras que `re.findall()` no lo admite.","isCorrect":false,"rationale":"Ambas funciones aceptan el argumento flags para modificar el comportamiento de la búsqueda."},{"text":"`re.findall()` solo funciona con strings simples y `re.search()` únicamente con textos multilínea completos.","isCorrect":false,"rationale":"Ambas funciones pueden operar sobre cualquier objeto de tipo string, independientemente de si tiene saltos de línea."}],"hint":"Considera qué función es mejor para estadísticas y cuál para validación condicional."},{"question":"En un sistema de detección de falsos amigos, un primer tipo de informe puede limitarse a listar los segmentos sospechosos, mientras que un segundo tipo distingue los casos con más evidencia. ¿Cómo se define un 'error probable' en ese segundo tipo de informe?","answerOptions":[{"text":"Cuando coinciden simultáneamente la forma inglesa sospechosa y la traducción literal problemática en el segmento.","isCorrect":true,"rationale":"La doble coincidencia en el par TO-TM aporta evidencia estadística de que la transferencia errónea ha ocurrido."},{"text":"Cuando el sistema detecta un término inglés que no existe en el diccionario médico especializado del glosario.","isCorrect":false,"rationale":"Eso sería un error ortográfico o de vocabulario, no necesariamente relacionado con la lógica de falsos amigos TO-TM."},{"text":"Cuando aparece el falso amigo en el texto origen, independientemente de su traducción.","isCorrect":false,"rationale":"Eso se define como 'riesgo', pero no confirma que el error se haya cometido en la traducción."},{"text":"Cuando el sistema de traducción automática devuelve un segmento vacío o mal segmentado.","isCorrect":false,"rationale":"Este es un error de procesamiento técnico, no una cuestión de transferencia léxica de falsos amigos."}],"hint":"Recuerda la distinción entre riesgo (origen) y evidencia (origen + meta)."},{"question":"En el desarrollo de un pipeline con Python, ¿cuál es la utilidad de aplicar `.strip()` a cada línea después de usar `.split('\\n')`?","answerOptions":[{"text":"Eliminar espacios en blanco y saltos de línea residuales al principio y al final de la cadena.","isCorrect":true,"rationale":"Esto asegura que no se procesen líneas vacías y que el contenido del segmento esté limpio para el análisis."},{"text":"Eliminar caracteres especiales como tildes y eñes para facilitar la búsqueda.","isCorrect":false,"rationale":"Strip no modifica caracteres internos del string; solo elimina espacios y saltos de línea en los extremos."},{"text":"Convertir todo el texto a minúsculas para que coincida con el glosario.","isCorrect":false,"rationale":"Esa tarea se realiza con el método .lower() o mediante flags en el módulo re."},{"text":"Separar el Texto Origen (TO) del Texto Meta (TM) automáticamente.","isCorrect":false,"rationale":"Strip no separa partes de una cadena basándose en su contenido lingüístico, solo limpia los bordes."}],"hint":"Piensa en la limpieza de los extremos de un string."},{"question":"¿Qué limitación técnica presentan las expresiones regulares frente a variantes morfológicas como 'assist', 'assisted' y 'assisting'?","answerOptions":[{"text":"Un patrón exacto como `r\"\\bassist\\b\"` no det ón asistida por ordenador (TAO).","isCorrect":false,"rationale":"Las expresiones regulares pueden aplicarse sobre el texto extraído de cualquier herramienta, incluidas las TAO."},{"text":"Solo funcionan si el texto está escrito enteramente en mayúsculas.","isCorrect":false,"rationale":"El flag re.IGNORECASE permite trabajar sin distinguir mayúsculas de minúsculas."}],"hint":"Piensa en si una máquina puede saber si 'asistir' se refiere a 'ayudar' o a 'estar presente' solo con mirar la palabra."},{"question":"En un sistema de detección de falsos amigos, ¿qué información aporta un diccionario como `falsos_amigos_corr`, que asocia cada forma sospechosa con una alternativa en español?","answerOptions":[{"text":"Sugiere términos correctos en español para reemplazar la traducción literal incorrecta.","isCorrect":true,"rationale":"Este diccionario permite que el informe no solo señale el error, sino que proponga una corrección concreta."},{"text":"Contiene una lista de todas las palabras prohibidas por la empresa de traducción para sus clientes.","isCorrect":false,"rationale":"No se trata de una lista de prohibiciones, sino de equivalencias correctas para cada falso amigo detectado."},{"text":"Almacena las reglas de puntuación necesarias para separar las oraciones en inglés.","isCorrect":false,"rationale":"La segmentación de oraciones se resuelve con otras operaciones, no con este diccionario de correcciones."},{"text":"Es una base de datos de nombres propios de médicos y hospitales para su extracción.","isCorrect":false,"rationale":"El diccionario recoge pares de términos léxicos, no nombres propios de personas o instituciones."}],"hint":"Es la herramienta que permite al sistema sugerir una traducción correcta junto al error detectado."},{"question":"¿Cuál es la consecuencia principal de una mala traducción de un falso amigo en un informe clínico?","answerOptions":[{"text":"Podría modificar el sentido de un diagnóstico o confundir dosis de medicamentos.","isCorrect":true,"   function sha256Hex(text) {
    var enc = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", enc).then(function(buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function(b) {
        return b.toString(16).padStart(2, "0");
      }).join("");
    });
  }

  function showView(id) {
    document.querySelectorAll(".view").forEach(function(v) { v.hidden = true; });
    var el = document.getElementById(id) || document.getElementById("view-" + id);
    if (el) el.hidden = false;
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  var quizState = null;

  function renderQuizStart() {
    var root = document.getElementById("quiz-root");
    if (!root) return;
    root.innerHTML =
      '<div class="quiz-start">' +
      '<p>10 preguntas: 5 elegidas al azar del banco del manual y 5 del banco del cuaderno. Puedes repetir el intento tantas veces como quieras — cada vez se vuelven a elegir y reordenar las preguntas.</p>' +
      '<button class="quiz-btn" id="quiz-begin">Empezar</button>' +
      '</div>';
    document.getElementById("quiz-begin").addEventListener("click", startQuiz);
  }

  function startQuiz() {
    var fromManual = shuffle(QUIZ_MANUAL).slice(0, 5);
    var fromCuaderno = shuffle(QUIZ_CUADERNO).slice(0, 5);
    quizState = { questions: shuffle(fromManual.concat(fromCuaderno)), index: 0, score: 0 };
    renderQuizQuestion();
  }

  function renderQuizQuestion() {
    var root = document.getElementById("quiz-root");
    var total = quizState.questions.length;
    if (quizState.index >= total) {
      root.innerHTML =
        '<div class="quiz-result">' +
        '<div class="quiz-score">' + quizState.score + ' / ' + total + '</div>' +
        '<p>Puntuación de este intento.</p>' +
        '<button class="quiz-btn" id="quiz-retry">Volver a intentar</button>' +
        '</div>';
      document.getElementById("quiz-retry").addEventListener("click", startQuiz);
      return;
    }
    var q = quizState.questions[quizState.index];
    var opts = shuffle(q.answerOptions);
    var html = '<div class="quiz-progress">Pregunta ' + (quizState.index + 1) + ' de ' + total + ' · Puntuación provisional: ' + quizState.score + '</div>';
    html += '<div class="quiz-q"><h3>' + q.question + '</h3>';
    opts.forEach(function(opt, i) {
      html += '<button class="quiz-opt" data-idx="' + i + '">' + opt.text + '</button>';
    });
    html += '<div class="quiz-feedback" id="quiz-feedback" hidden></div>';
    html += '</div>';
    root.innerHTML = html;
    var buttons = root.querySelectorAll(".quiz-opt");
    buttons.forEach(function(btn, i) {
      btn.addEventListener("click", function() {
        buttons.forEach(function(b) { b.disabled = true; });
        var chosen = opts[i];
        if (chosen.isCorrect) { btn.classList.add("correct"); quizState.score++; }
        else {
          btn.classList.add("incorrect");
          buttons.forEach(function(b2, j) { if (opts[j].isCorrect) b2.classList.add("correct"); });
        }
        var fb = document.getElementById("quiz-feedback");
        fb.hidden = false;
        fb.textContent = chosen.rationale || (chosen.isCorrect ? "Correcto." : "Incorrecto.");
        var next = document.createElement("button");
        next.className = "quiz-btn";
        next.style.marginTop = "14px";
        next.textContent = quizState.index + 1 < total ? "Siguiente" : "Ver puntuación";
        next.addEventListener("click", function() { quizState.index++; renderQuizQuestion(); });
        root.querySelector(".quiz-q").appendChild(next);
      });
    });
  }

      .then(function(data) {
        configSha = data.sha;
        return JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\n/g, "")))));
      });
  }

  function ghSaveFile(token, configObj) {
    var content = btoa(unescape(encodeURIComponent(JSON.stringify(configObj, null, 2) + "\n")));
    return fetch("https://api.github.com/repos/" + REPO + "/contents/" + GH_CONFIG_PATH, {
      method: "PUT",
      headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders(token)),
      body: JSON.stringify({
        message: "Modo profesora: actualizar visibilidad de materiales (" + GH_CONFIG_PATH + ")",
        content: content,
        sha: configSha
      })
    }).then(function(r) {
      if (!r.ok) return r.text().then(function(t) { throw new Error("Error al guardar (" + r.status + "): " + t); });
      return r.json();
    }).then(function(data) {
      configSha = data.content.sha;
    });
  }

  function getToken() {
    try { return sessionStorage.getItem("gh_pat") || ""; } catch (e) { return ""; }
  }
  function setToken(t) {
    try { sessionStorage.setItem("gh_pat", t); } catch (e) {}
  }

  function setStatus(msg, isError) {
    var el = document.getElementById("teacher-status");
    if (!el) return;
    el.textContent = msg;
    el.style.color = isError ? "#FFB3B3" : "#9FE6A0";
  }

  function initTeacherPanel() {
    document.getElementById("teacher-panel").hidden = false;
    var tokenInput = document.getElementById("gh-token");
    tokenInput.value = getToken();

    document.getElementById("gh-token-save").addEventListener("click", function() {
      setToken(tokenInput.value.trim());
      setStatus(tokenInput.value.trim() ? "Token guardado para esta sesión." : "Token borrado.");
      refreshFromGithub();
    });

    document.querySelectorAll("#teacher-panel input[type=checkbox][data-type]").forEach(function(chk) {
      chk.addEventListener("change", function() {
        var token = getToken();
        if (!token) { setStatus("Pega primero tu token de GitHub.", true); chk.checked = !chk.checked; return; }
        setStatus("Guardando...");
        ghGetFile(token).then(function(current) {
          current[chk.dataset.type] = chk.checked;
          return ghSaveFile(token, current).then(function() { return current; });
        }).then(function(current) {
          applyTeacherHints(current);
          setStatus("Guardado ✓ — el alumnado lo verá en 1-2 minutos.");
        }).catch(function(err) {
          chk.checked = !chk.checked;
          setStatus(err.message, true);
        });
      });
    });

    refreshFromGithub();

    function refreshFromGithub() {
      var token = getToken();
      if (!token) { fetchConfig().then(applyTeacherHints); return; }
      setStatus("Cargando estado actual...");
      ghGetFile(token).then(function(current) {
        applyTeacherHints(current);
        setStatus("Conectado. Puedes marcar/desmarcar materiales.");
      }).catch(function(err) { setStatus(err.message, true); fetchConfig().then(applyTeacherHints); });
    }
  }

  function reveal(teacherMode) {
    isTeacher = teacherMode;
    document.getElementById("content").innerHTML = decodeURIComponent(escape(atob(PAYLOAD)));
    document.getElementById("gate").style.display = "none";
    document.getElementById("page").style.display = "block";
    wireNav();
    if (teacherMode) {
      document.querySelectorAll(".hub-btn[data-type]").forEach(function(btn) { btn.style.display = ""; });
      initTeacherPanel();
    } else {
      fetchConfig().then(applyStudentVisibility);
    }
    try { sessionStorage.setItem(SESSION_KEY, teacherMode ? "teacher" : "1"); } catch (e) {}
  }

  function tryUnlock() {
    var val = document.getElementById("pw").value;
    sha256Hex(val).then(function(hex) {
      if (hex === TEACHER_HASH) { reveal(true); return; }
      if (hex === HASH) {
        fetch(ROOT_CONFIG + "?t=" + Date.now()).then(function(r) { return r.json(); }).then(function(rootCfg) {
          if (rootCfg[TEMA_KEY] === false) {
            document.getElementById("err").textContent = "Este tema no está disponible por el momento.";
          } else {
            reveal(false);
          }
        }).catch(function() { reveal(false); });
        return;
      }
      document.getElementById("err").textContent = "Contraseña incorrecta.";
    });
  }

  document.getElementById("enter").addEventListener("click", tryUnlock);
  document.getElementById("pw").addEventListener("keydown", function(e) { if (e.key === "Enter") tryUnlock(); });

  try {
    var saved = sessionStorage.getItem(SESSION_KEY);
    if (saved === "teacher") reveal(true);
    else if (saved === "1") reveal(false);
  } catch (e) {}
})();
</script>
</body>
</html>
