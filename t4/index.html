<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tema 4 — PLN</title>
<style>

:root {
  --azul: #003B5C;
  --azul-d: #00283F;
  --amar: #F4C542;
  --gris: #34484F;
  --claro: #F3F3F4;
  --humo: #9FB1BA;
  --verde: #2E7D32;
  --rojo: #B00020;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: var(--gris); background:#fff; }
a { color: inherit; }

#gate { position:fixed; inset:0; background:var(--azul); display:flex; align-items:center; justify-content:center; padding:24px; z-index:999; }
#gate .box { max-width:380px; width:100%; text-align:center; }
#gate .kicker { color:var(--amar); font-size:12px; font-weight:bold; letter-spacing:2.5px; text-transform:uppercase; margin-bottom:10px; }
#gate h1 { color:#fff; font-size:26px; margin:0 0 10px; }
#gate p { color:var(--humo); font-size:14px; margin:0 0 26px; }
#gate input { width:100%; padding:13px 16px; border-radius:8px; border:none; font-size:15px; font-family:Arial,Helvetica,sans-serif; margin-bottom:14px; outline:2px solid transparent; }
#gate input:focus { outline:2px solid var(--amar); }
#gate button.submit { width:100%; padding:13px 16px; border-radius:8px; border:none; background:var(--amar); color:var(--azul-d); font-size:15px; font-weight:bold; font-family:Arial,Helvetica,sans-serif; cursor:pointer; }
#gate button.submit:hover { filter:brightness(1.06); }
#gate .error { color:#FFB3B3; font-size:13px; margin-top:12px; min-height:18px; }
#page { display:none; }
main { max-width:980px; margin:0 auto; padding:48px 6vw 60px; }
.kicker { color:var(--amar); font-size:12px; font-weight:bold; letter-spacing:2.5px; text-transform:uppercase; margin-bottom:8px; }
.view > h1 { color:var(--azul); font-size:32px; margin:0 0 34px; }
.hub-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; margin-bottom:30px; }
.hub-btn { display:flex; flex-direction:column; align-items:flex-start; gap:6px; background:var(--claro); border:none; border-radius:12px; padding:26px 22px; cursor:pointer; text-align:left; box-shadow:0 2px 10px rgba(159,177,186,.28); font-family:Arial,Helvetica,sans-serif; position:relative; }
.hub-btn:hover { background:#E9ECEE; }
.hub-icon { font-size:30px; margin-bottom:4px; }
.hub-label { font-size:17px; font-weight:bold; color:var(--azul); }
.hub-desc { font-size:12.5px; color:var(--humo); }
.back-home { font-size:13px; color:var(--humo); text-decoration:none; }
.back-home:hover { color:var(--azul); }
.sub-view h2 { color:var(--azul); font-size:24px; margin:18px 0 4px; }
.sub-view .section-note { font-size:13px; color:var(--humo); margin:0 0 24px; }
.back-btn { background:none; border:1.5px solid var(--azul); color:var(--azul); font-size:13px; font-weight:bold; padding:6px 14px; border-radius:20px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.back-btn:hover { background:var(--azul); color:#fff; }
.dl-big { display:inline-block; background:var(--amar); color:var(--azul-d); font-weight:bold; font-size:14px; text-decoration:none; padding:10px 20px; border-radius:20px; margin-bottom:18px; }
.pdf-frame { width:100%; height:78vh; border:none; border-radius:8px; box-shadow:0 2px 10px rgba(159,177,186,.28); }
.img-frame { display:block; width:100%; height:auto; border-radius:8px; box-shadow:0 2px 10px rgba(159,177,186,.28); }
.ref-intro { color:var(--azul); font-size:16px; margin:0 0 16px; }
.ref-item { font-size:13.5px; color:var(--gris); line-height:1.6; margin:0 0 16px; padding-left:28px; text-indent:-28px; }
.ref-item a { color:var(--azul); word-break:break-all; }
.ref-item em { font-style:italic; }
.notice { font-size:12px; color:var(--humo); font-style:italic; margin-top:10px; }
/* quiz */
.quiz-start { background:var(--claro); border-radius:12px; padding:26px; }
.quiz-start p { font-size:14px; margin:0 0 18px; }
.quiz-btn { background:var(--azul); color:#fff; border:none; border-radius:20px; padding:11px 22px; font-size:14px; font-weight:bold; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.quiz-btn:hover { filter:brightness(1.15); }
.quiz-progress { font-size:12px; color:var(--humo); margin-bottom:6px; }
.quiz-q { background:var(--claro); border-radius:12px; padding:24px; margin-bottom:18px; }
.quiz-q h3 { color:var(--azul); font-size:17px; margin:0 0 18px; }
.quiz-opt { display:block; width:100%; text-align:left; background:#fff; border:1.5px solid var(--humo); border-radius:8px; padding:12px 16px; margin-bottom:10px; font-size:14px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; color:var(--gris); }
.quiz-opt:hover { border-color:var(--azul); }
.quiz-opt.correct { border-color:var(--verde); background:#EAF6EB; font-weight:bold; }
.quiz-opt.incorrect { border-color:var(--rojo); background:#FBEAEC; }
.quiz-opt[disabled] { cursor:default; }
.quiz-feedback { font-size:13px; color:var(--gris); background:#fff; border-radius:8px; padding:12px 16px; margin-top:4px; margin-bottom:16px; border-left:3px solid var(--azul); }
.quiz-score { font-size:26px; font-weight:bold; color:var(--azul); margin-bottom:8px; }
.quiz-result { background:var(--claro); border-radius:12px; padding:30px; text-align:center; }
/* interactive manual (prueba) */
.im-badge { display:inline-block; background:var(--amar); color:var(--azul-d); font-size:11px; font-weight:bold; letter-spacing:1px; text-transform:uppercase; padding:4px 10px; border-radius:20px; margin-bottom:10px; }
.im-root { margin-top:10px; }
.im-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
.im-card { text-align:left; background:var(--claro); border:none; border-radius:12px; padding:20px 20px 18px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; box-shadow:0 2px 10px rgba(159,177,186,.28); transition:transform .12s ease, background .12s ease; }
.im-card:hover { background:#E9ECEE; transform:translateY(-2px); }
.im-card.im-card-bib { background:var(--azul); }
.im-card.im-card-bib .im-card-title, .im-card.im-card-bib .im-card-meta { color:#fff; }
.im-card-icon { font-size:22px; }
.im-card-num { display:block; font-size:11px; font-weight:bold; color:var(--humo); letter-spacing:1px; text-transform:uppercase; margin:8px 0 4px; }
.im-card-title { display:block; font-size:16px; font-weight:bold; color:var(--azul); line-height:1.3; }
.im-card-meta { display:block; font-size:12px; color:var(--humo); margin-top:6px; }
.im-chapter { }
.im-crumb { background:none; border:none; color:var(--humo); font-size:13px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; padding:0; margin-bottom:16px; text-decoration:underline; }
.im-crumb:hover { color:var(--azul); }
.im-chapter-title { color:var(--azul); font-size:23px; margin:0 0 16px; }
.im-block-p { font-size:14.5px; line-height:1.7; color:var(--gris); margin:0 0 14px; }
.im-block-ul, .im-block-ol { margin:0 0 14px; padding-left:22px; }
.im-block-ul li, .im-block-ol li { font-size:14.5px; line-height:1.65; color:var(--gris); margin-bottom:6px; }
.im-sub { border-top:1px solid #E3E7E9; }
.im-sub:first-child { border-top:none; }
.im-sub-head { width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; background:none; border:none; text-align:left; padding:16px 4px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.im-sub-head:hover .im-sub-title { color:var(--azul-d); }
.im-sub-title { font-size:15.5px; font-weight:bold; color:var(--azul); }
.im-sub-arrow { color:var(--humo); font-size:13px; transition:transform .15s ease; flex:none; }
.im-sub.open .im-sub-arrow { transform:rotate(90deg); }
.im-sub-body { max-height:0; overflow:hidden; padding:0 4px; transition:max-height .25s ease; }
.im-sub.open .im-sub-body { max-height:none; padding-bottom:14px; }
.im-code-toggle { display:inline-flex; align-items:center; gap:6px; background:#fff; border:1.5px dashed var(--humo); color:var(--azul); font-size:12.5px; font-weight:bold; border-radius:20px; padding:7px 14px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; margin:2px 0 14px; }
.im-code-toggle:hover { border-color:var(--azul); }
.im-code-box { display:none; background:#F2F4F5; border-radius:8px; padding:14px 16px; margin:0 0 14px; overflow-x:auto; }
.im-code-box.open { display:block; }
.im-code-box pre { margin:0; font-family:"Courier New",monospace; font-size:13px; line-height:1.55; color:#1c2a30; white-space:pre-wrap; word-break:break-word; }
.im-table-toggle { display:inline-flex; align-items:center; gap:6px; background:#fff; border:1.5px solid var(--azul); color:var(--azul); font-size:12.5px; font-weight:bold; border-radius:20px; padding:7px 14px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; margin:2px 0 14px; }
.im-table-toggle:hover { background:var(--azul); color:#fff; }
.im-table-wrap { display:none; overflow-x:auto; margin:0 0 16px; border-radius:8px; box-shadow:0 2px 10px rgba(159,177,186,.28); }
.im-table-wrap.open { display:block; }
.im-table-wrap table { border-collapse:collapse; width:100%; font-size:13px; }
.im-table-wrap th { background:var(--azul); color:#fff; text-align:left; padding:9px 12px; font-size:12.5px; }
.im-table-wrap td { padding:9px 12px; border-bottom:1px solid #E3E7E9; color:var(--gris); }
.im-table-wrap tr:nth-child(even) td { background:var(--claro); }
.im-errorlist { list-style:none; padding:0; margin:0 0 6px; }
.im-errorlist li { background:var(--claro); border-left:3px solid var(--rojo); border-radius:0 8px 8px 0; padding:12px 16px; margin-bottom:10px; }
.im-errorlist .im-error-term { display:block; font-weight:bold; color:var(--azul); font-size:14px; margin-bottom:4px; }
.im-errorlist .im-error-desc { font-size:13.5px; color:var(--gris); line-height:1.6; }
.im-cite { color:var(--azul); font-weight:bold; cursor:pointer; border-bottom:1.5px dotted var(--azul); white-space:normal; }
.im-cite:hover { color:var(--azul-d); }
.im-cite-pop { display:none; background:var(--azul-d); color:#fff; border-radius:8px; padding:12px 16px; font-size:12.5px; line-height:1.6; margin:6px 0 14px; }
.im-cite-pop.open { display:block; }
.im-cite-pop p { margin:0 0 8px; }
.im-cite-pop p:last-child { margin-bottom:0; }
.im-cite-pop a { color:var(--amar); }
.im-bib-list { margin-top:6px; }
.im-bib-item.im-bib-highlight { background:#FDF1C7; border-radius:8px; padding:10px 14px; margin-left:-14px; margin-right:-14px; }
code.im-inline { background:#F2F4F5; padding:1px 6px; border-radius:4px; font-family:"Courier New",monospace; font-size:.93em; }
/* teacher panel */
.teacher-banner { background:var(--azul-d); color:#fff; border-radius:12px; padding:18px 22px; margin-bottom:24px; }
.teacher-banner strong { color: var(--amar); }
.teacher-banner p { font-size:13px; margin:6px 0 0; color:var(--humo); }
.teacher-token-row { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
.teacher-token-row input { flex:1; min-width:220px; padding:9px 12px; border-radius:8px; border:none; font-size:13px; font-family:Arial,Helvetica,sans-serif; }
.teacher-token-row button { background:var(--amar); color:var(--azul-d); border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:bold; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.teacher-status { font-size:12px; margin-top:10px; min-height:16px; }
.teacher-toggle-list { list-style:none; padding:0; margin:16px 0 0; display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; }
.teacher-toggle-list li { background:rgba(255,255,255,.08); border-radius:8px; padding:10px 14px; display:flex; align-items:center; gap:10px; font-size:13px; }
.teacher-toggle-list input { width:18px; height:18px; }
.hub-btn .teacher-hint { position:absolute; top:10px; right:12px; font-size:10px; font-weight:bold; padding:2px 8px; border-radius:10px; }
.hub-btn .teacher-hint.on { background:#DFF3E0; color:var(--verde); }
.hub-btn .teacher-hint.off { background:#FBEAEC; color:var(--rojo); }
footer { text-align:center; padding:26px 6vw 40px; font-size:11px; color:var(--humo); font-style:italic; }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <div class="kicker">Tema 4</div>
    <h1>PLN</h1>
    <p>Contenido protegido. Introduce la contraseña facilitada en clase.</p>
    <input type="password" id="pw" placeholder="Contraseña" autofocus>
    <button class="submit" id="enter">Acceder</button>
    <div class="error" id="err"></div>
  </div>
</div>

<div id="page">
  <main id="content"></main>
  <footer>

  </footer>
</div>

  var QUIZ_MANUAL = [{"question":"En un proyecto de revisión lingüística donde se comparan varias versiones de un mismo documento institucional redactadas por distintos proveedores, ¿cuál es la característica principal de los llamados 'textos paralelos monolingües'?","answerOptions":[{"text":"Son versiones en la misma lengua que representan un mismo contenido o función comunicativa.","isCorrect":true,"rationale":"El concepto se refiere a la comparación de diferentes variantes (como las de distintos proveedores) de un mismo documento en español."},{"text":"Son traducciones directas de una lengua origen a una lengua meta distinta.","isCorrect":false,"rationale":"Eso describe un corpus paralelo tradicional, no la variante monolingüe utilizada para comparar versiones en el mismo idioma."},{"text":"Son textos de diferentes géneros literarios que comparten un mismo autor.","isCorrect":false,"rationale":"El paralelismo en este caso es de contenido y función, no necesariamente de autoría o género literario diverso."},{"text":"Son textos en lenguas diferentes que no guardan relación de traducción entre sí.","isCorrect":false,"rationale":"Esto se ajustaría más a la definición de un corpus comparable multilingüe, no paralelo monolingüe."}],"hint":"Observa el término «monolingüe» y cómo se aplican a la comparación de versiones de un mismo documento."},{"question":"Al leer archivos en Python para el procesamiento de textos en español, ¿por qué es fundamental especificar `encoding=\"utf-8\"`?","answerOptions":[{"text":"Para asegurar la correcta interpretación de caracteres como tildes y eñes.","isCorrect":true,"rationale":"UTF-8 es el estándar que permite representar correctamente los caracteres especiales del español, evitando errores de lectura."},{"text":"Para comprimir el tamaño del archivo de texto en la memoria RAM.","isCorrect":false,"rationale":"La codificación define cómo se representan los caracteres, no es un método de compresión de datos."},{"text":"Para convertir automáticamente el texto de formato `.pdf` a `.txt`.","isCorrect":false,"rationale":"La función 'open' con codificación no realiza conversiones de formato de archivo, solo lee el flujo de bytes del archivo plano."},{"text":"Para que Python pueda ejecutar funciones matemáticas complejas sobre el texto.","isCorrect":false,"rationale":"La codificación de caracteres no tiene relación con la capacidad de ejecución de funciones lógicas o matemáticas del lenguaje."}],"hint":"Piensa en las dificultades que presentan los caracteres especiales del español si se usa una codificación por defecto errónea."},{"question":"¿Qué limitación principal presenta el uso de `texto.split(\".\")` para segmentar oraciones en español?","answerOptions":[{"text":"No distingue entre un punto final de oración y un punto de abreviatura o cifra.","isCorrect":true,"rationale":"El punto se usa en abreviaturas (Sr.), decimales o siglas, lo que genera cortes incorrectos en unidades que no son oraciones."},{"text":"Produce un error de sintaxis si el texto contiene más de diez puntos.","isCorrect":false,"rationale":"Python puede manejar cualquier cantidad de separadores; el límite no es técnico, sino lingüístico."},{"text":"Elimina automáticamente todas las palabras que están escritas justo junto al punto.","isCorrect":false,"rationale":"El método 'split' solo elimina el carácter separador, conservando el resto de las palabras intactas."},{"text":"Solo funciona si el texto está escrito íntegramente en letras mayúsculas.","isCorrect":false,"rationale":"La segmentación por caracteres es independiente de la capitalización de las letras en la cadena de texto."}],"hint":"Considera otros usos del punto en la escritura normal que no implican el cierre de una idea completa."},{"question":"En el análisis de frecuencias, ¿qué ventaja aporta aplicar `.lower()` antes de usar `.count()`?","answerOptions":[{"text":"Agrupa variantes de capitalización para contar 'Empresa' e 'empresa' como la misma unidad.","isCorrect":true,"rationale":"Al normalizar a minúsculas, se ignoran las diferencias de mayúsculas iniciales, facilitando el recuento léxico global."},{"text":"Permite que Python cuente palabras de diferentes idiomas simultáneamente.","isCorrect":false,"rationale":"La normalización a minúsculas solo afecta a la grafía de los caracteres, no a la detección del idioma."},{"text":"Elimina los espacios en blanco innecesarios al final de las oraciones.","isCorrect":false,"rationale":"La eliminación de espacios se realiza con el método 'strip', mientras que 'lower' solo afecta a la caja de las letras."},{"text":"Identifica automáticamente los sinónimos del término buscado.","isCorrect":false,"rationale":"El método 'count' busca secuencias de caracteres exactas y no posee conocimiento semántico de la lengua."}],"hint":"Recuerda que para Python, 'A' y 'a' son caracteres totalmente distintos si no se normalizan."},{"question":"La expresión regular `r\"[.,][^\\\\s]\"` se utiliza específicamente para localizar:","answerOptions":[{"text":"La ausencia de un espacio después de un signo de puntuación.","isCorrect":true,"rationale":"El patrón detecta un punto o coma seguido inmediatamente de un carácter que no es un espacio en blanco."},{"text":"Cualquier punto o coma que esté al final de un párrafo.","isCorrect":false,"rationale":"El patrón busca específicamente un carácter que NO sea un espacio después del signo, no el final de un bloque."},{"text":"Palabras que contienen un punto o coma en su interior, como direcciones web.","isCorrect":false,"rationale":"Aunque podría detectarlas, su propósito en revisión lingüística es hallar errores tipográficos de espaciado."},{"text":"Todos los espacios dobles que aparecen entre dos oraciones.","isCorrect":false,"rationale":"Para los dobles espacios se buscaría una secuencia de dos caracteres de espacio, no signos de puntuación."}],"hint":"Analiza el significado del metacarácter `[^\\\\s]`, que representa la negación de un espacio en blanco."},{"question":"Desde un punto de vista metodológico, ¿cuál es la diferencia entre un indicio automático y un diagnóstico lingüístico?","answerOptions":[{"text":"El indicio es una señal mecánica localizada por el código; el diagnóstico es la interpretación profesional.","isCorrect":true,"rationale":"La máquina localiza patrones sospechosos (indicios), pero solo la lingüista decide si es un error basándose en el contexto."},{"text":"No hay diferencia; si el programa detecta un patrón, es un error confirmado.","isCorrect":false,"rationale":"Las reglas automáticas pueden generar falsos positivos que requieren validación humana experta."},{"text":"El indicio se refiere a errores gramaticales y el diagnóstico a errores de formato.","isCorrect":false,"rationale":"Ambos términos se aplican a cualquier tipo de fenómeno detectado, independientemente de su categoría lingüística o formal."},{"text":"El diagnóstico es lo que hace Python de forma automática y el indicio es lo que entrega finalmente el cliente.","isCorrect":false,"rationale":"Es al revés: la herramienta automatizada provee indicios y la especialista realiza el diagnóstico."}],"hint":"Considera quién tiene la responsabilidad final de decidir si un cambio es necesario."},{"question":"¿Qué ocurre si una función de revisión lingüística en Python termina sus operaciones sin una instrucción `return`?","answerOptions":[{"text":"La función devuelve automáticamente el valor `None` y el resultado no se puede guardar en una variable.","isCorrect":true,"rationale":"Sin 'return', la función ejecuta sus procesos pero no entrega nada al flujo principal del programa para su uso posterior."},{"text":"El programa se detiene y muestra un error de tipo 'MemoryLeak' que interrumpe toda la ejecución.","isCorrect":false,"rationale":"La falta de un 'return' no detiene el programa con un error grave; simplemente la función no devuelve datos."},{"text":"La función borra el archivo de texto original para liberar espacio.","isCorrect":false,"rationale":"Python nunca realiza acciones destructivas sobre archivos a menos que se programen para ello."},{"text":"La función imprime automáticamente todos los resultados en la consola por defecto.","isCorrect":false,"rationale":"Imprimir y devolver son acciones distintas; si no hay 'print' ni 'return', el resultado se pierde en el ámbito local."}],"hint":"Diferencia entre ver un resultado en la pantalla y poder procesar ese dato en otra parte del código."},{"question":"¿Por qué se consideran «candidatos a revisión» las estructuras de `a + infinitivo` detectadas por un patrón como `r\"(\\\\w+)\\\\s+a\\\\s+(\\\\w+(ar|er|ir))\\\\b\"`?","answerOptions":[{"text":"Porque el patrón no puede distinguir entre usos legítimos como perífrasis y posibles galicismos.","isCorrect":true,"rationale":"Muchas estructuras correctas (empezó a leer) comparten la misma forma superficial que los usos desaconsejados (temas a tratar)."},{"text":"Porque la preposición 'a' siempre es incorrecta antes de cualquier verbo en infinitivo en español.","isCorrect":false,"rationale":"Existen numerosas construcciones en español que requieren obligatoriamente la preposición 'a' antes del infinitivo."},{"text":"Porque Python solo puede detectar verbos que terminen en '-ar', ignorando '-er' e '-ir'.","isCorrect":false,"rationale":"El patrón de la expresión regular incluye las tres terminaciones del infinitivo español."},{"text":"Porque esas estructuras solo aparecen en textos traducidos del inglés, nunca del francés.","isCorrect":false,"rationale":"Estas estructuras (a + infinitivo) suelen analizarse como posibles calcos del francés, no específicamente del inglés."}],"hint":"Reflexiona sobre si la forma externa de una frase es suficiente para juzgar su corrección gramatical sin conocer su función sintáctica."},{"question":"En el desarrollo de un informe de revisión, ¿cuál es la utilidad de la función `enumerate(lista, start=1)`?","answerOptions":[{"text":"Permite recorrer los elementos obteniendo simultáneamente un índice legible para humanos.","isCorrect":true,"rationale":"Al usar 'start=1', facilitamos la creación de informes donde las versiones u oraciones se numeran desde el 1 en lugar del 0 de Python."},{"text":"Ordena alfabéticamente los textos de la lista completa antes de empezar a procesarlos uno por uno.","isCorrect":false,"rationale":"La función 'enumerate' no altera el orden de los elementos; solo genera un contador asociado a ellos."},{"text":"Multiplica el contenido del texto por el número de versión indicado.","isCorrect":false,"rationale":"La función no realiza operaciones aritméticas sobre el contenido del texto, solo gestiona el conteo de iteraciones."},{"text":"Filtra la lista para eliminar los elementos que no contengan números.","isCorrect":false,"rationale":"No es una función de filtrado; actúa sobre todos los elementos de la lista proporcionando un índice correlativo."}],"hint":"Piensa en cómo facilitarías la lectura de un informe técnico a una persona que no sabe programación."},{"question":"Al buscar gerundios con expresiones regulares para revisión, ¿cuál es la ventaja de capturar palabras anteriores y posteriores al gerundio?","answerOptions":[{"text":"Proporciona el contexto necesario para que el lingüista evalúe la corrección del uso detectado.","isCorrect":true,"rationale":"Sin el contexto (las palabras de alrededor), es imposible decidir si un gerundio es correcto o constituye un error de estilo."},{"text":"Permite que Python aprenda automáticamente si el gerundio es de simultaneidad o de posterioridad.","isCorrect":false,"rationale":"Las reglas de expresiones regulares no poseen capacidad de aprendizaje semántico ni de análisis lógico-temporal autónomo."},{"text":"Aumenta la velocidad de ejecución del programa al reducir el número de búsquedas.","isCorrect":false,"rationale":"Capturar más información suele aumentar ligeramente el tiempo de procesamiento, no reducirlo."},{"text":"Garantiza que el gerundio se convierta automáticamente en un parti   var QUIZ_CUADERNO = [{"question":"En un proyecto de revisión lingüística donde se comparan varias versiones de un mismo documento institucional redactadas por distintos proveedores, ¿qué define a los llamados 'textos paralelos monolingües'?","answerOptions":[{"text":"Dos o más versiones de un mismo contenido redactadas en el mismo idioma por diferentes traductores o agencias.","isCorrect":true,"rationale":"El texto define específicamente el trabajo con versiones en un mismo idioma para evaluar la coherencia entre distintos proveedores de traducción."},{"text":"Documentos oficiales de las Naciones Unidas traducidos a múltiples lenguas para mantener la coherencia internacional.","isCorrect":false,"rationale":"Aunque se mencionan estas instituciones, el término 'monolingüe' se refiere específicamente a versiones en una sola lengua, no a la traducción multilingüe general."},{"text":"Glosarios técnicos que comparan términos de un idioma origen con sus equivalentes en un idioma destino.","isCorrect":false,"rationale":"Los glosarios son herramientas resultantes del análisis, pero no definen la naturaleza de los textos paralelos monolingües."},{"text":"Un corpus de textos que incluye únicamente el idioma original antes de ser enviado a traducción.","isCorrect":false,"rationale":"Los textos paralelos requieren al menos dos versiones comparables del mismo contenido, no una versión única."}],"hint":"Piensa en el significado del término 'monolingüe' y quiénes producen esas versiones en un entorno profesional."},{"question":"¿Cuál es una de las razones principales por las que la segmentación por oraciones mejora la calidad del procesamiento automático de textos?","answerOptions":[{"text":"Permite que algoritmos de PLN realicen tareas como el etiquetado morfosintáctico o el análisis sintáctico con mayor precisión.","isCorrect":true,"rationale":"La segmentación divide el texto en unidades fundamentales manejables que son necesarias para que las herramientas de procesamiento identifiquen estructuras lingüísticas."},{"text":"Elimina automáticamente los dobles espacios y los errores de puntuación presentes en el documento original.","isCorrect":false,"rationale":"La segmentación detecta límites de oraciones basándose en la puntuación, pero no corrige automáticamente los errores de formato por sí sola."},{"text":"Reduce drásticamente el espacio de almacenamiento necesario para guardar corpus de gran volumen en disco, algo especialmente relevante en proyectos institucionales.","isCorrect":false,"rationale":"El objetivo de la segmentación es el análisis lingüístico y la organización lógica, no la optimización del almacenamiento físico de los archivos."},{"text":"Sustituye la necesidad de utilizar expresiones regulares para detectar patrones como gerundios o galicismos.","isCorrect":false,"rationale":"La segmentación es un paso previo que facilita el uso de expresiones regulares, no una tecnología que las reemplace."}],"hint":"Recuerda que la oración es considerada la unidad básica para analizar fenómenos como la sintaxis o la semántica."},{"question":"En el análisis de frecuencia de palabras con Python, ¿qué función cumple el método `.lower()`?","answerOptions":[{"text":"Normaliza el texto a minúsculas para que el conteo no distinga entre palabras con diferentes cajas (ej. 'Empresa' vs 'empresa').","isCorrect":true,"rationale":"La normalización es un paso fundamental en PLN para asegurar que las variaciones de capitalización no resulten en conteos inexactos de un mismo término."},{"text":"Detecta y marca automáticamente los términos que han sido mal escritos por falta de tildes.","isCorrect":false,"rationale":"Este método solo afecta a la caja (mayúsculas/minúsculas) de los caracteres y no realiza corrección ortográfica o de acentuación."},{"text":"Identifica las palabras que se encuentran al final de una oración justo antes de un punto o signo de cierre.","isCorrect":false,"rationale":"La identificación de la posición de una palabra requiere métodos de indexación o búsqueda de patrones, no simplemente el cambio a minúsculas."},{"text":"Elimina los espacios en blanco innecesarios al principio y al final de cada cadena de texto.","isCorrect":false,"rationale":"La eliminación de espacios en blanco en los extremos suele realizarse con el método `.strip()`, no con `.lower()`."}],"hint":"Considera cómo Python trata por defecto las cadenas de texto según si tienen letras mayúsculas o minúsculas."},{"question":"Al utilizar la expresión regular `r'[.,][^\\s]'`, ¿qué tipo de error se busca detectar en los textos?","answerOptions":[{"text":"La ausencia de un espacio obligatorio después de un punto o una coma.","isCorrect":true,"rationale":"El patrón busca un signo de puntuación (punto o coma) seguido de cualquier carácter que no sea un espacio en blanco."},{"text":"La presencia de dos o más espacios seguidos entre palabras dentro de una misma oración.","isCorrect":false,"rationale":"Para detectar dobles espacios se buscaría una cadena fija de dos espacios (`\"  \"`), no una combinación de puntuación."},{"text":"El uso incorrecto de la coma antes de la conjunción 'y' en enumeraciones simples.","isCorrect":false,"rationale":"Este patrón detecta problemas de espaciado tipográfico general, no reglas sintácticas específicas sobre el uso de la coma."},{"text":"Palabras que han sido separadas incorrectamente por un guion al final de una línea.","isCorrect":false,"rationale":"La expresión regular mencionada no incluye el guion como carácter de búsqueda ni analiza saltos de línea."}],"hint":"Fíjate en los caracteres dentro de los corchetes y en lo que representa el símbolo `^` seguido de `\\s`."},{"question":"¿Por qué puede ser útil que un lingüista aprenda a definir funciones (`def`) al preparar informes de revisión con Python?","answerOptions":[{"text":"Para organizar el código en tareas separadas y facilitar la reutilización del análisis en otros documentos futuros.","isCorrect":true,"rationale":"Las funciones actúan como cajas de herramientas que permiten ejecutar procesos repetitivos de forma limpia y eficiente sin reescribir código."},{"text":"Porque las funciones son el único método que permite exportar resultados automáticamente a formato Excel.","isCorrect":false,"rationale":"Aunque las funciones pueden contener lógica para exportar datos, existen otras formas de hacerlo en Python sin necesidad de definir funciones personalizadas."},{"text":"Para garantizar que el sistema de traducción automática aprenda nuevas reglas gramaticales sin intervención humana.","isCorrect":false,"rationale":"La definición de funciones en un cuaderno de análisis es para la organización del código del analista, no para el aprendizaje autónomo de una IA."},{"text":"Porque el uso de funciones elimina la necesidad de conocer expresiones regulares complejas.","isCorrect":false,"rationale":"Las funciones suelen contener expresiones regulares dentro de su lógica; no son conceptos que se excluyan entre sí."}],"hint":"Recuerda la analogía de las 'cajas ordenadas' frente a tener las herramientas sueltas por la mesa."},{"question":"¿Qué limitación presenta la detección automática de gerundios basada en patrones como `r'\\w+(ando|iendo|yendo)'`?","answerOptions":[{"text":"Identifica la forma verbal pero no puede determinar si su uso es gramaticalmente correcto o incorrecto sin análisis de contexto.","isCorrect":true,"rationale":"El código detecta la terminación, pero discernir entre un gerundio de modo (correcto) y uno de posterioridad (incorrecto) requiere juicio humano o análisis semántico profundo."},{"text":"Es incapaz de encontrar gerundios que pertenezcan a verbos de la tercera conjugación (-ir).","isCorrect":false,"rationale":"Los gerundios de verbos en -ir terminan en -iendo o -yendo, ambos incluidos en el patrón de búsqueda."},{"text":"Solo funciona si el texto ha sido previamente traducido por un motor de inteligencia artificial.","isCorrect":false,"rationale":"El análisis de patrones funciona sobre cualquier texto plano, independientemente de su origen humano o automático."},{"text":"No permite extraer la palabra anterior o posterior para ver el contexto del gerundio detectado en el texto.","isCorrect":false,"rationale":"Es posible capturar palabras circundantes ajustando el patrón o los índices de los resultados encontrados."}],"hint":"Piensa en la diferencia entre reconocer una palabra por su terminación y entender su función dentro de la oración."},{"question":"En el ámbito empresarial, ¿para qué se utiliza principalmente la comparación automática entre términos como 'empresa' o 'compañía'?","answerOptions":[{"text":"Para asegurar la coherencia terminológica y el respeto a la imagen de marca (branding).","isCorrect":true,"rationale":"Mantener una terminología estable en todas las comunicaciones es vital para la claridad institucional y la identidad corporativa."},{"text":"Para determinar cuál de los dos términos tiene un origen etimológico más prestigioso.","isCorrect":false,"rationale":"La comparación automática busca patrones de uso y consistencia, no realiza análisis lingüístico histórico o etimológico."},{"text":"Para reducir el coste de la traducción eliminando sinónimos innecesarios del documento fuente.","isCorrect":false,"rationale":"Aunque la consistencia puede ayudar, el análisis automático aquí descrito se aplica principalmente a la revisión de textos ya producidos."},{"text":"Para sustituir los diccionarios de sinónimos tradicionales por una tabla de frecuencias dinámica.","isCorrect":false,"rationale":"El objetivo es evaluar cómo se han usado los términos en versiones paralelas, no crear una herramienta de referencia léxica general."}],"hint":"Relaciona la consistencia en el uso de palabras clave con la imagen que una empresa proyecta al exterior."},{"question":"¿A qué se refiere el concepto de \"falso positivo\" en el contexto de la revisión lingüística automatizada?","answerOptions":[{"text":"A una estructura marcada por el sistema como error que, tras la revisión humana, resulta ser correcta en su contexto.","isCorrect":true,"rationale":"Por ejemplo, detectar 'a + infinitivo' puede señalar un galicismo erróneo o una estructura válida como 'tendencia a mejorar', siendo este último un falso positivo."},{"text":"A un error gramatical real que el programa de análisis no fue capaz de detectar durante la revisión automática.","isCorrect":false,"rationale":"Eso se denomina falso negativo; el programa 'cree' que no hay error cuando sí lo hay."},{"text":"A un código de Python que se ejecuta correctamente pero produce resultados numéricos negativos e inesperados.","isCorrect":false,"rationale":"Un falso positivo es un concepto de evaluación de precisión lingüística, no un tipo de resultado matemático o error de programación."},{"text":"A la detección de un doble espacio que el autor del texto introdujo intencionadamente por motivos puramente estéticos o de formato.","isCorrect":false,"rationale":"Si el sistema detecta un doble espacio, la detección es correcta (positivo); el hecho de que sea intencionado es una cuestión de estilo, no de error de detección."}],"hint":"Piensa en un caso donde el sistema aplica una regla de forma demasiado rígida y se equivoca al juzgar la calidad."},{"question":"Al reportar errores de espaciado detectados automáticamente, ¿qué ventaja tiene mostrar un fragmento de contexto (10-20 caracteres) alrededor de cada error?","answerOptions":[{"text":"Permite al lingüista localizar y validar rápidamente el error sin tener que buscar manualmente en todo el documento original.","isCorrect":true,"rationale":"Visualizar el texto circundante permite confirmar de inmediato si se trata de un error tipográfico real o una excepción justificada."},{"text":"Sirve para que el sistema de Python aprenda automáticamente a corregir el error en la siguiente ejecución.","isCorrect":false,"rationale":"El código proporcionado en el cuaderno es de análisis y visualización, no implementa aprendizaje automático para corrección autónoma."},{"text":"Reduce la cantidad de memoria RAM utilizada por Google Colab durante el procesamiento del texto.","isCorrect":false,"rationale":"Imprimir fragmentos adicionales de texto en realidad consume una cantidad mínima y despreciable de recursos adicionales."},{"text":"Ayuda a ocultar información confidencial del texto que no debería aparecer en el informe final entregado al cliente.","isCorrect":false,"rationale":"Al contrario, mostrar fragmentos del texto podría revelar contenido; su propósito es estrictamente facilitar la revisión manual."}],"hint":"Recuerda ejemplos como '...temporales.Utilizando métodos...' y para qué sirven al ojo humano."},{"question":"¿Cuál es la función fundamental de la sentencia `return` dentro de una función de Python?","answerOptions":[{"text":"Devolver un valor o resultado generado dentro de la función para que pueda ser utilizado por otras partes del programa.","isCorrect":true,"rationale":"Sin el `return`, los cálculos realizados dentro de la función se pierden al finalizar su ejecución y no pueden ser asignados a variables externas."},{"text":"Imprimir el resultado final en la consola para que el usuario pueda leerlo inmediatamente.","isCorrect":false,"rationale":"La impresión en consola se realiza con `print()`; el `return` se encarga de la transferencia de datos entre bloques de código."},{"text":"Reiniciar la función desde el principio si los datos de entrada son incorrectos, generando así un resultado completamente nuevo.","isCorrect":false,"rationale":"El `return` finaliza la ejecución de la función y entrega un valor; no funciona como un bucle de reinicio."},{"text":"Validar si el texto cumple con las normas ortográficas de la RAE antes de procesarlo.","isCorrect":false,"rationale":"Python es un lenguaje de programación general; las reglas lingüísticas deben programarse aparte, y el `return` solo devuelve el resultado de dicha lógica."}],"hint":"Usa la analogía de la calculadora: una cosa es hacer la cuenta y otra es que el resultado aparezca en el 'ticket' para usarlo después."}];

  function sha256Hex(text) {
    var enc = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", enc).then(function(buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function(b) {
        return b.toString(16).padStart(2, "0");
      }).join("");
    });
  }

  function showView(id) {
    document.querySelectorAll(".view").forEach(function(v) { v.hidden = true; });
    var el = document.getElementById(id) || document.getElementById("view-" + id);
    if (el) el.hidden = false;
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

      html += '<button class="quiz-opt" data-idx="' + i + '">' + opt.text + '</button>';
    });
    html += '<div class="quiz-feedback" id="quiz-feedback" hidden></div>';
    html += '</div>';
    root.innerHTML = html;
    var buttons = root.querySelectorAll(".quiz-opt");
    buttons.forEach(function(btn, i) {
      btn.addEventListener("click", function() {
        buttons.forEach(function(b) { b.disabled = true; });
        var chosen = opts[i];
        if (chosen.isCorrect) { btn.classList.add("correct"); quizState.score++; }
        else {
          btn.classList.add("incorrect");
          buttons.forEach(function(b2, j) { if (opts[j].isCorrect) b2.classList.add("correct"); });
        }
        var fb = document.getElementById("quiz-feedback");
        fb.hidden = false;
        fb.textContent = chosen.rationale || (chosen.isCorrect ? "Correcto." : "Incorrecto.");
        var next = document.createElement("button");
        next.className = "quiz-btn";
        next.style.marginTop = "14px";
        next.textContent = quizState.index + 1 < total ? "Siguiente" : "Ver puntuación";
        next.addEventListener("click", function() { quizState.index++; renderQuizQuestion(); });
        root.querySelector(".quiz-q").appendChild(next);
      });
    });
  }

  // ---- Interactive manual engine (self-contained mini-app rendered lazily into #im-root-<key>) ----
  function imEsc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function imFormatBackticks(s) {
    var parts = s.split("`"), out = "";
    for (var i = 0; i < parts.length; i++) out += (i % 2 === 1) ? '<code class="im-inline">' + imEsc(parts[i]) + "</code>" : imEsc(parts[i]);
    return out;
  }
  function imFormatInline(raw) {
    var re = /{{cite:([^}]*)}}([\s\S]*?){{\/cite}}/g;
    var out = "", last = 0, m;
    while ((m = re.exec(raw))) {
      out += imFormatBackticks(raw.slice(last, m.index));
      out += '<span class="im-cite" data-refs="' + m[1] + '">' + imFormatBackticks(m[2]) + ' <span aria-hidden="true">ⓘ</span></span>';
      last = re.lastIndex;
    }
    out += imFormatBackticks(raw.slice(last));
    return out;
  }
  function imBibText(text) {
    var re = /(https?:\/\/[^\s]+)/g;
    var out = "", last = 0, m;
    while ((m = re.exec(text))) {
      out += imEsc(text.slice(last, m.index));
      var url = m[1].replace(/[.,;]+$/, "");
      out += '<a href="' + imEsc(url) + '" target="_blank" rel="noopener">' + imEsc(url) + "</a>";
      last = m.index + url.length;
    }
    out += imEsc(text.slice(last));
    return out;
  }
  function imRefLookup(data) {
    var m = {};
    data.references.forEach(function(r) { m[r.key] = r.text; });
    return m;
  }
  function imRenderTable(rows, key) {
    var head = rows[0], body = rows.slice(1);
    var t = "<table><thead><tr>" + head.map(function(h) { return "<th>" + imEsc(h) + "</th>"; }).join("") + "</tr></thead><tbody>";
    body.forEach(function(r) { t += "<tr>" + r.map(function(c) { return "<td>" + imEsc(c) + "</td>"; }).join("") + "</tr>"; });
    t += "</tbody></table>";
    return '<button class="im-table-toggle" data-im-table="' + key + '">▤ Ver tabla (' + body.length + ' filas)</button>' +
      '<div class="im-table-wrap" id="im-table-' + key + '">' + t + "</div>";
  }
  function imRenderBlocks(blocks, keyPrefix) {
    var html = "";
    blocks.forEach(function(b, i) {
      var key = keyPrefix + "-" + i;
      if (b.type === "p") html += '<p class="im-block-p">' + imFormatInline(b.text) + "</p>";
      else if (b.type === "ul") html += '<ul class="im-block-ul">' + b.items.map(function(t) { return "<li>" + imFormatInline(t) + "</li>"; }).join("") + "</ul>";
      else if (b.type === "ol") html += '<ol class="im-block-ol">' + b.items.map(function(t) { return "<li>" + imFormatInline(t) + "</li>"; }).join("") + "</ol>";
      else if (b.type === "code") html += '<button class="im-code-toggle" data-im-code="' + key + '">🔎 Descubre el código</button>' +
        '<div class="im-code-box" id="im-code-' + key + '"><pre>' + imEsc(b.code) + "</pre></div>";
      else if (b.type === "table") html += imRenderTable(b.rows, key);
      else if (b.type === "errorlist") html += '<ul class="im-errorlist">' + b.items.map(function(it) {
        return '<li><span class="im-error-term">' + imFormatInline(it.term) + '</span><span class="im-error-desc">' + imFormatInline(it.desc) + "</span></li>";
      }).join("") + "</ul>";
    });
    return html;
  }
  function imWireCommon(root, data) {
    root.querySelectorAll("[data-im-code]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var box = document.getElementById("im-code-" + btn.dataset.imCode);
        var open = box.classList.toggle("open");
        btn.textContent = open ? "🔽 Ocultar el código" : "🔎 Descubre el código";
      });
    });
    root.querySelectorAll("[data-im-table]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        document.getElementById("im-table-" + btn.dataset.imTable).classList.toggle("open");
      });
    });
    root.querySelectorAll(".im-cite").forEach(function(span) {
      span.addEventListener("click", function() {
        var existing = span.nextElementSibling;
        if (existing && existing.classList && existing.classList.contains("im-cite-pop")) {
          existing.classList.toggle("open");
          return;
        }
        var refs = imRefLookup(data);
        var keys = span.dataset.refs.split(",");
        var pop = document.createElement("div");
        pop.className = "im-cite-pop open";
        pop.innerHTML = keys.map(function(k) { return "<p>" + imBibText(refs[k] || k) + "</p>"; }).join("") +
          '<p><a href="#" data-im-goto-bib="' + keys[0] + '">Ver en Bibliografía →</a></p>';
        span.parentNode.insertBefore(pop, span.nextSibling);
        pop.querySelector("[data-im-goto-bib]").addEventListener("click", function(e) {
          e.preventDefault();
          imShowBib(root, data, this.dataset.imGotoBib);
        });
      });
    });
  }
  function imShowBib(root, data, highlightKey) {
    var html = '<button class="im-crumb" data-im-back="1">← Índice del manual</button>';
    html += '<h3 class="im-chapter-title">Bibliografía</h3>';
    html += '<h4 class="ref-intro">Referencias en formato APA (7ª edición)</h4>';
    html += '<div class="im-bib-list">' + data.references.map(function(r) {
      var cls = "ref-item im-bib-item" + (r.key === highlightKey ? " im-bib-highlight" : "");
      return '<p class="' + cls + '" id="im-bib-' + r.key + '">' + imBibText(r.text) + "</p>";
    }).join("") + "</div>";
    root.innerHTML = html;
    root.querySelector("[data-im-back]").addEventListener("click", function() { imShowIndex(root, data); });
    if (highlightKey) {
      var el = document.getElementById("im-bib-" + highlightKey);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }
  function imShowChapter(root, data, idx) {
    var sec = data.sections[idx];
    var html = '<button class="im-crumb" data-im-back="1">← Índice del manual</button>';
    html += '<h3 class="im-chapter-title">' + imEsc(sec.title) + "</h3>";
    html += imRenderBlocks(sec.blocks, idx + "-i");
    sec.subsections.forEach(function(sub, j) {
      html += '<div class="im-sub" data-im-sub="' + j + '">' +
        '<button class="im-sub-head"><span class="im-sub-title">' + imEsc(sub.title) + '</span><span class="im-sub-arrow">▶</span></button>' +
        '<div class="im-sub-body">' + imRenderBlocks(sub.blocks, idx + "-" + j) + "</div></div>";
    });
    root.innerHTML = html;
    imWireCommon(root, data);
    root.querySelector("[data-im-back]").addEventListener("click", function() { imShowIndex(root, data); });
    root.querySelectorAll(".im-sub-head").forEach(function(head) {
      head.addEventListener("click", function() { head.parentElement.classList.toggle("open"); });
    });
  }
  function imShowIndex(root, data) {
    var cards = data.sections.map(function(sec, i) {
      return '<button class="im-card" data-im-chapter="' + i + '">' +
        '<span class="im-card-icon">📖</span>' +
        '<span class="im-card-num">Capítulo ' + (i + 1) + "</span>" +
        '<span class="im-card-title">' + imEsc(sec.title) + "</span>" +
        (sec.subsections.length ? '<span class="im-card-meta">' + sec.subsections.length + " apartados</span>" : "") +
        "</button>";
    }).join("");
    var bibCard = '<button class="im-card im-card-bib" data-im-bib="1">' +
      '<span class="im-card-icon">📚</span><span class="im-card-num">Referencias</span>' +
      '<span class="im-card-title">Bibliografía</span>' +
      '<span class="im-card-meta">' + data.references.length + ' referencias en APA 7ª ed.</span></button>';
    root.innerHTML = '<div class="im-grid">' + cards + bibCard + "</div>";
    root.querySelectorAll("[data-im-chapter]").forEach(function(btn) {
      btn.addEventListener("click", function() { imShowChapter(root, data, parseInt(btn.dataset.imChapter, 10)); });
    });
    var bibBtn = root.querySelector("[data-im-bib]");
    if (bibBtn) bibBtn.addEventListener("click", function() { imShowBib(root, data, null); });
  }
  function renderInteractiveManual(viewKey) {
    if (imRendered[viewKey]) return;
    imRendered[viewKey] = true;
    var data = IM_DATA[viewKey];
    if (!data) return;
    var root = document.getElementById("im-root-" + viewKey);
    if (!root) return;
    imShowIndex(root, data);
  }

  function wireNav() {
    document.querySelectorAll(".hub-btn").forEach(function(btn) {
      btn.addEventListener("click", function() {
        showView(btn.dataset.view);
        if (btn.dataset.view === "quiz") renderQuizStart();
        if (IM_DATA[btn.dataset.view]) renderInteractiveManual(btn.dataset.view);
      });
    });
    document.querySelectorAll("[data-back]").forEach(function(btn) {
      btn.addEventListener("click", function() { showView(btn.dataset.back); });
    });
  }

  function applyStudentVisibility(config) {
    document.querySelectorAll(".hub-btn[data-type]").forEach(function(btn) {
      var t = btn.dataset.type;
      btn.style.display = config[t] ? "" : "none";
    });
  }

  function applyTeacherHints(config) {
    document.querySelectorAll(".teacher-hint[data-hint]").forEach(function(span) {
      var t = span.dataset.hint;
      var on = !!config[t];
      span.textContent = on ? "visible" : "oculto";
      span.className = "teacher-hint " + (on ? "on" : "off");
    });
    document.querySelectorAll("#teacher-panel input[type=checkbox][data-type]").forEach(function(chk) {
      chk.checked = !!config[chk.dataset.type];
    });
  }

  function fetchConfig() {
    return fetch(LOCAL_CONFIG + "?t=" + Date.now()).then(function(r) { return r.json(); });
  }

  function ghHeaders(token) {
    return { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" };
  }

  function ghGetFile(token) {
    return fetch("https://api.github.com/repos/" + REPO + "/contents/" + GH_CONFIG_PATH, { headers: ghHeaders(token) })
      .then(function(r) {
        if (!r.ok) throw new Error("No se pudo leer el fichero (" + r.status + ")");
        return r.json();
      })
      .then(function(data) {
        configSha = data.sha;
        return JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\n/g, "")))));
      });
  }

  function ghSaveFile(token, configObj) {
    var content = btoa(unescape(encodeURIComponent(JSON.stringify(configObj, null, 2) + "\n")));
    return fetch("https://api.github.com/repos/" + REPO + "/contents/" + GH_CONFIG_PATH, {
      method: "PUT",
      headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders(token)),
      body: JSON.stringify({
        message: "Modo profesora: actualizar visibilidad de materiales (" + GH_CONFIG_PATH + ")",
        content: content,
        sha: configSha
      })
    }).then(function(r) {
      if (!r.ok) return r.text().then(function(t) { throw new Error("Error al guardar (" + r.status + "): " + t); });
      return r.json();
    }).then(function(data) {
      configSha = data.content.sha;
    });
  }

  function getToken() {
    try { return sessionStorage.getItem("gh_pat") || ""; } catch (e) { return ""; }
  }
  function setToken(t) {
    try { sessionStorage.setItem("gh_pat", t); } catch (e) {}
  }

  function setStatus(msg, isError) {
    var el = document.getElementById("teacher-status");
    if (!el) return;
    el.textContent = msg;
    el.style.color = isError ? "#FFB3B3" : "#9FE6A0";
  }

  function initTeacherPanel() {
    document.getElementById("teacher-panel").hidden = false;
    var tokenInput = document.getElementById("gh-token");
    tokenInput.value = getToken();

    document.getElementById("gh-token-save").addEventListener("click", function() {
      setToken(tokenInput.value.trim());
      setStatus(tokenInput.value.trim() ? "Token guardado para esta sesión." : "Token borrado.");
      refreshFromGithub();
    });

    document.querySelectorAll("#teacher-panel input[type=checkbox][data-type]").forEach(function(chk) {
      chk.addEventListener("change", function() {
        var token = getToken();
        if (!token) { setStatus("Pega primero tu token de GitHub.", true); chk.checked = !chk.checked; return; }
        setStatus("Guardando...");
        ghGetFile(token).then(function(current) {
          current[chk.dataset.type] = chk.checked;
          return ghSaveFile(token, current).then(function() { return current; });
        }).then(function(current) {
          applyTeacherHints(current);
          setStatus("Guardado ✓ — el alumnado lo verá en 1-2 minutos.");
        }).catch(function(err) {
          chk.checked = !chk.checked;
          setStatus(err.message, true);
        });
      });
    });

    refreshFromGithub();

    function refreshFromGithub() {
      var token = getToken();
      if (!token) { fetchConfig().then(applyTeacherHints); return; }
      setStatus("Cargando estado actual...");
      ghGetFile(token).then(function(current) {
        applyTeacherHints(current);
        setStatus("Conectado. Puedes marcar/desmarcar materiales.");
      }).catch(function(err) { setStatus(err.message, true); fetchConfig().then(applyTeacherHints); });
    }
  }

  function reveal(teacherMode) {
    isTeacher = teacherMode;
    document.getElementById("content").innerHTML = decodeURIComponent(escape(atob(PAYLOAD)));
    document.getElementById("gate").style.display = "none";
    document.getElementById("page").style.display = "block";
    wireNav();
    if (teacherMode) {
      document.querySelectorAll(".hub-btn[data-type]").forEach(function(btn) { btn.style.display = ""; });
      initTeacherPanel();
    } else {
      fetchConfig().then(applyStudentVisibility);
    }
    try { sessionStorage.setItem(SESSION_KEY, teacherMode ? "teacher" : "1"); } catch (e) {}
  }

  function tryUnlock() {
    var val = document.getElementById("pw").value;
    sha256Hex(val).then(function(hex) {
      if (hex === TEACHER_HASH) { reveal(true); return; }
      if (hex === HASH) {
        fetch(ROOT_CONFIG + "?t=" + Date.now()).then(function(r) { return r.json(); }).then(function(rootCfg) {
          if (rootCfg[TEMA_KEY] === false) {
            document.getElementById("err").textContent = "Este tema no está disponible por el momento.";
          } else {
            reveal(false);
          }
        }).catch(function() { reveal(false); });
        return;
      }
      document.getElementById("err").textContent = "Contraseña incorrecta.";
    });
  }

  document.getElementById("enter").addEventListener("click", tryUnlock);
  document.getElementById("pw").addEventListener("keydown", function(e) { if (e.key === "Enter") tryUnlock(); });

  try {
    var saved = sessionStorage.getItem(SESSION_KEY);
    if (saved === "teacher") reveal(true);
    else if (saved === "1") reveal(false);
  } catch (e) {}
})();
</script>
</body>
</html>
