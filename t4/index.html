"text":"El gerundio en español es una forma no personal del verbo que puede expresar simultaneidad, modo, causa u otras relaciones, según el contexto. La gramática académica describe usos aceptables y usos problemáticos, entre ellos ciertos gerundios de posterioridad o usos adjetivales no asentados {{cite:realacademiaespanola2009}}(Real Academia Española & ASALE, 2009){{/cite}}. En revisión lingüística, los gerundios suelen revisarse porque pueden generar ambigüedad, encadenamiento excesivo o interferencias de estilo."},{"type":"p","text":"Detectar gerundios automáticamente parece fácil: muchas formas terminan en -ando, -iendo o -yendo. Sin embargo, una búsqueda por terminación no basta para valorar el uso. «El equipo revisó el informe, incorporando las observaciones» puede requerir lectura contextual; «entró sonriendo» no plantea el mismo tipo de problema; «leyendo el documento, encontró una incoherencia» funciona de otra manera. La forma no determina por completo la función."},{"type":"p","text":"La unidad usa expresiones regulares para localizar posibles gerundios y recuperar palabras cercanas. Esto tiene una razón didáctica: el contexto inmediato ayuda a que la revisión sea más útil. No es lo mismo devolver solo utilizando que mostrar «temporales utilizando una herramienta». Cuanto mejor se preserve el contexto, más fácil será decidir si el candidato exige corrección."},{"type":"p","text":"El enfoque conecta con una idea general del PLN basado en reglas: muchas tareas empiezan con patrones simples y mejoran cuando incorporan más información. El alumnado debe aprender a valorar ese equilibrio. Una regla muy amplia encuentra muchos casos, pero obliga a revisar más falsos positivos. Una regla muy estrecha encuentra menos ruido, pero puede dejar fuera casos relevantes."}]},{"id":"1-12-falsos-positivos-falsos-negativos-y-criterio-linguistic","title":"1.12. Falsos positivos, falsos negativos y criterio lingüístico","blocks":[{"type":"p","text":"Un falso positivo aparece cuando el sistema señala un caso que no es realmente problemático. Un falso negativo aparece cuando no señala un caso que sí habría convenido revisar. Estos dos conceptos proceden de la evaluación de sistemas de clasificación, pero son muy útiles para pensar cualquier detector basado en reglas. Si el patrón es muy general, aumentan los falsos positivos. Si el patrón es demasiado restrictivo, aumentan los falsos negativos."},{"type":"p","text":"En revisión lingüística, los falsos positivos no son necesariamente un fracaso. Si el volumen es pequeño y el objetivo es no dejar escapar posibles problemas, puede aceptarse una lista más amplia. En cambio, si el volumen es grande y el equipo tiene poco tiempo, conviene diseñar patrones más precisos. La calidad de la herramienta depende de la finalidad del encargo."},{"type":"docimg","src":"img/doc_01.jpg","alt":"Figura del manual","w":460},{"type":"table","rows":[["Situación","Ejemplo","Consecuencia"],["Falso positivo","El sistema señala «empezó a revisar» como sospechoso","La persona revisora descarta el caso"],["Falso negativo","El sistema no detecta una incoherencia terminológica expresada con sinónimo","El problema queda fuera del informe"],["Regla amplia","Busca cualquier a + infinitivo","Mayor cobertura, más ruido"],["Regla estrecha","Busca solo una lista de verbos problemáticos","Menos ruido, menor cobertura"]],"title":"Situación · Ejemplo · Consecuencia"},{"type":"p","text":"La competencia lingüística consiste también en saber diseñar preguntas razonables para la máquina. Python no debe recibir la orden vaga de «encuentra errores». Debe recibir tareas observables: cuenta este término, busca este patrón, devuelve este contexto, compara estas versiones. Cuanto mejor formulada esté la pregunta, más útil será la respuesta."}]},{"id":"1-13-funciones-informes-y-trazabilidad","title":"1.13. Funciones, informes y trazabilidad","blocks":[{"type":"p","text":"En programación, una función permite encapsular una tarea: recibe datos, aplica una operación y puede devolver un resultado. En una revisión lingüística, las funciones aportan orden y trazabilidad. En lugar de copiar el mismo código varias veces, se crea una comprobación reutilizable: una función para contar términos, otra para detectar espacios dobles, otra para buscar patrones de puntuación, otra para generar un resumen."},{"type":"p","text":"La trazabilidad es especialmente importante en entornos profesionales. Si una revisora pregunta cómo se detectaron los casos, el equipo debe poder responder: se usó este patrón, sobre estos textos, con esta normalización. Si el cliente pide repetir la comprobación en una versión nueva, la función permite hacerlo sin rediseñar todo el proceso."},{"type":"p","text":"El informe final es la forma comunicativa de esa trazabilidad. No basta con que el código funcione; el resultado debe ser comprensible para una persona que toma decisiones. Un informe útil no solo lista números: explica qué se ha buscado, qué se ha encontrado, dónde aparece y qué cautela interpretativa debe aplicarse."},{"type":"p","text":"En Verba Pública, el informe no pretende reemplazar una revisión de estilo completa. Su finalidad es preparar una primera lectura asistida: reducir incertidumbre, ordenar prioridades y documentar indicios. Ese es un uso profesional realista de Python en lingüística aplicada."}]},{"id":"1-14-limites-de-los-metodos-basados-en-reglas","title":"1.14. Límites de los métodos basados en reglas","blocks":[{"type":"p","text":"Los métodos basados en reglas son transparentes, fáciles de enseñar y útiles para fenómenos con forma reconocible. Pero tienen límites. El lenguaje natural es variable, ambiguo y dependiente del contexto. Una palabra puede pertenecer a varias categorías; una construcción puede ser aceptable en un contexto y discutible en otro; un sinónimo puede ser deseable o problemático según la política terminológica."},{"type":"p","text":"Frente a modelos estadísticos o neuronales, las reglas simples no aprenden de datos ni generalizan semánticamente. Sin embargo, esa limitación también puede ser una ventaja en ciertos encargos. Si se necesita comprobar una convención formal muy concreta, una regla explícita puede ser más adecuada que un sistema opaco. En PLN profesional conviven enfoques distintos: reglas, recursos lingüísticos, corpus, aprendizaje automático y revisión humana."},{"type":"p","text":"La unidad se centra deliberadamente en reglas y operaciones básicas porque construyen una base conceptual sólida. Antes de usar bibliotecas avanzadas, conviene entender qué significa leer un texto, dividirlo, recorrerlo, contar, buscar y devolver resultados. Esos fundamentos seguirán siendo necesarios cuando el alumnado trabaje con herramientas más complejas."}]}],"navTitle":"Marco teórico"},{"id":"2-analisis-automatico-de-textos-para-revision-linguistica-co","title":"2. Análisis automático de textos para revisión lingüística con Python","blocks":[],"subsections":[{"id":"2-1-leer-textos-como-datos","title":"2.1. Leer textos como datos","blocks":[{"type":"p","text":"Para que Python pueda analizar un documento, primero debe leerlo como texto. En la práctica, eso significa abrir un archivo y convertir su contenido en una cadena de caracteres. La cadena es el tipo de dato básico para trabajar con texto: permite buscar palabras, contar secuencias, dividir por signos, extraer fragmentos y aplicar expresiones regulares."},{"type":"p","text":"Un detalle técnico decisivo es la codificación. En español aparecen tildes, eñes, comillas angulares y otros caracteres que deben interpretarse correctamente. Por eso se indica encoding=\"utf-8\". UTF-8 es una codificación estándar ampliamente usada que permite representar caracteres de muchas lenguas. Si se omite la codificación, el sistema puede elegir una por defecto y producir errores o caracteres dañados."},{"type":"code","code":"with open(\"texto1.txt\", encoding=\"utf-8\") as archivo:\n    texto1 = archivo.read()"},{"type":"p","text":"El bloque with abre el archivo y se encarga de cerrarlo al terminar. La variable texto1 guarda todo el contenido como una cadena. Desde ese momento, el texto ya puede tratarse como dato lingüístico procesable."},{"type":"p","text":"Antes de analizar un documento, Python debe poder leerlo. Un archivo .txt contiene texto plano: caracteres sin estilos, sin tablas internas y sin formatos complejos. Por eso resulta muy útil para aprender PLN. Reduce el ruido técnico y permite concentrarse en el contenido lingüístico."},{"type":"p","text":"Una forma sencilla de leer un archivo es:"},{"type":"code","code":"texto_a = open(\"version_a.txt\", encoding=\"utf-8\").read()\ntexto_b = open(\"version_b.txt\", encoding=\"utf-8\").read()"},{"type":"p","text":"Aquí ocurren varias cosas importantes:"},{"type":"ul","items":["open(...) abre el archivo.","\"version_a.txt\" indica el nombre del archivo.","encoding=\"utf-8\" le dice a Python cómo interpretar caracteres como á, ñ, ü o ¿.",".read() lee todo el contenido y lo convierte en una cadena de texto.","texto_a y texto_b son variables que guardan cada versión."]},{"type":"p","text":"En español, la codificación es especialmente importante. Si se lee mal un archivo, pueden aparecer caracteres extraños: implementaciÃ³n en lugar de implementación. Ese problema no es lingüístico, pero afecta directamente al análisis. Si Python no reconoce bien las tildes, los conteos pueden fallar."}]},{"id":"2-2-rutas-de-archivos-y-pathlib","title":"2.2. Rutas de archivos y pathlib","blocks":[{"type":"p","text":"Cuando los documentos están en una carpeta local, conviene trabajar con rutas claras. El módulo pathlib permite representar rutas de forma más legible y menos dependiente de detalles del sistema operativo {{cite:pythonsoftwarefounda2026b}}(Python Software Foundation, 2026b){{/cite}}. En lugar de escribir una ruta como una cadena larga, se crea un objeto Path."},{"type":"code","code":"from pathlib import Path\n\ncarpeta_trabajo = Path(\"ruta/a/la/carpeta/de/textos\")\n\nruta_a = carpeta_trabajo / \"version_a.txt\"\nruta_b = carpeta_trabajo / \"version_b.txt\"\n\nwith open(ruta_a, encoding=\"utf-8\") as f:\n    texto_a = f.read()\n\nwith open(ruta_b, encoding=\"utf-8\") as f:\n    texto_b = f.read()"},{"type":"p","text":"Esta forma tiene dos ventajas. La primera es que separa la carpeta de trabajo del nombre de cada archivo. La segunda es que usa with open(...) as f, una estructura que abre el archivo, permite leerlo y lo cierra automáticamente al terminar."},{"type":"p","text":"Desde el punto de vista del PLN, lo relevante es que cada documento queda representado como un string. Un string es una cadena de caracteres. Para Python, un informe institucional, una frase corta o un discurso entero son objetos manipulables siempre que estén guardados como texto."}]},{"id":"2-3-cadenas-listas-y-corpus-pequeno","title":"2.3. Cadenas, listas y corpus pequeño","blocks":[{"type":"p","text":"Cuando solo hay dos versiones, es tentador crear variables separadas y repetir el mismo código para cada una:"},{"type":"code","code":"texto_a_lower = texto_a.lower()\ntexto_b_lower = texto_b.lower()"},{"type":"p","text":"Esto funciona, pero escala mal. Si mañana llegan cincuenta versiones, repetir cincuenta líneas parecidas sería incómodo y propenso a errores."},{"type":"p","text":"Una idea fundamental en programación es agrupar elementos relacionados en una lista:"},{"type":"code","code":"textos = [texto_a, texto_b]"},{"type":"p","text":"La lista textos contiene todas las versiones que queremos analizar. A partir de ese momento, podemos recorrerlas con un bucle:"},{"type":"code","code":"for i, texto in enumerate(textos, start=1):\n    print(f\"Analizando versión {i}\")"},{"type":"p","text":"La función enumerate() permite recorrer una lista y, al mismo tiempo, obtener un número de orden. El argumento start=1 indica que queremos empezar a contar en 1, no en 0. Esto es más natural para informes destinados a personas: versión 1, versión 2, versión 3."},{"type":"p","text":"Esta estructura cambia la forma de pensar el análisis. Ya no escribimos una solución para un archivo concreto, sino una solución para cualquier conjunto de textos:"},{"type":"code","code":"textos = [texto_a, texto_b, texto_c]\n\nfor i, texto in enumerate(textos, start=1):\n    longitud = len(texto)\n    print(f\"Versión {i}: {longitud} caracteres\")"},{"type":"p","text":"En proyectos de revisión, esta generalización es muy valiosa. La misma lógica sirve para dos versiones de una traducción, tres discursos institucionales o cien documentos de una licitación."}]},{"id":"2-4-segmentar-en-oraciones-con-split-y-strip","title":"2.4. Segmentar en oraciones con split y strip","blocks":[{"type":"p","text":"La oración es una unidad lingüística central. En revisión automática, segmentar un texto en oraciones permite observar el contenido en fragmentos manejables. No es lo mismo detectar que una palabra aparece en un documento entero que saber en qué oración aparece."},{"type":"p","text":"Una estrategia inicial consiste en dividir el texto cada vez que aparece un punto:"},{"type":"code","code":"oraciones_a = texto_a.split(\".\")\noraciones_b = texto_b.split(\".\")"},{"type":"p","text":"El método .split(\".\") corta la cadena cada vez que encuentra el carácter \".\". El resultado es una lista:"},{"type":"code","code":"for i, oracion in enumerate(oraciones_a[:3], start=1):\n    print(f\"{i}. {oracion.strip()}\")"},{"type":"p","text":"El método .strip() elimina espacios al principio y al final del fragmento. Es útil porque, después de cortar por puntos, muchas oraciones empiezan con un espacio."},{"type":"p","text":"Esta segmentación es sencilla y comprensible, pero no perfecta. En español, el punto no siempre marca el final de una oración. Puede aparecer en abreviaturas, cifras, iniciales, direcciones web o enumeraciones:"},{"type":"table","rows":[["Caso","Problema"],["Sr. García","El punto no cierra una oración"],["art. 15","El punto pertenece a una abreviatura"],["3.2 millones","El punto puede formar parte de una cifra o sección"],["www.ejemplo.org","El punto aparece dentro de una dirección"]],"title":"Caso · Problema"},{"type":"p","text":"Para un primer análisis de control de calidad, split(\".\") puede ser suficiente. Para herramientas profesionales más precisas, convendría usar segmentadores especializados, como los que ofrecen bibliotecas de PLN."},{"type":"p","text":"Lo importante es entender la decisión lingüística que hay detrás: segmentar es elegir qué cuenta como unidad de análisis."}]},{"id":"2-5-contar-palabras-y-normalizar-con-minusculas","title":"2.5. Contar palabras y normalizar con minúsculas","blocks":[{"type":"p","text":"Contar palabras es una de las operaciones más simples y, al mismo tiempo, más útiles del análisis textual. En un contexto de revisión, la frecuencia permite detectar preferencias terminológicas, cambios de estilo o posibles incoherencias."},{"type":"p","text":"Supongamos que queremos saber cuántas veces aparece la palabra implementación en dos versiones:"},{"type":"code","code":"texto_a_lower = texto_a.lower()\ntexto_b_lower = texto_b.lower()\n\nconteo_a = texto_a_lower.count(\"implementación\")\nconteo_b = texto_b_lower.count(\"implementación\")\n\nprint(f\"Versión A: {conteo_a} apariciones\")\nprint(f\"Versión B: {conteo_b} apariciones\")"},{"type":"p","text":"El método .lower() convierte todo el texto a minúsculas. Así, Implementación al inicio de una oración y implementación en medio de una frase se cuentan igual."},{"type":"p","text":"Sin esta normalización, Python distinguiría entre:"},{"type":"ul","items":["Implementación","implementación","IMPLEMENTACIÓN"]},{"type":"p","text":"Desde el punto de vista lingüístico, pueden ser la misma unidad léxica. Desde el punto de vista computacional, son cadenas distintas. Normalizar el texto permite acercar la representación computacional a la pregunta lingüística."},{"type":"p","text":"Ahora bien, .count(\"implementación\") tiene límites. Cuenta apariciones exactas de esa secuencia de caracteres. Eso significa que no agrupa automáticamente variantes como:"},{"type":"ul","items":["implementar","implementado","implementaciones","implementativa"]},{"type":"p","text":"Para agrupar formas relacionadas haría falta lematización o análisis morfológico. En esta unidad trabajamos con conteo exacto porque es transparente y fácil de interpretar."}]},{"id":"2-6-recorrer-varias-versiones-con-enumerate","title":"2.6. Recorrer varias versiones con enumerate","blocks":[{"type":"p","text":"El análisis mejora cuando dejamos de pensar en una pareja fija de textos y empezamos a pensar en un conjunto variable de versiones:"},{"type":"code","code":"textos = [texto_a, texto_b, texto_c]\npalabra = \"implementación\"\n\nfor i, texto in enumerate(textos, start=1):\n    texto_lower = texto.lower()\n    conteo = texto_lower.count(palabra)\n    print(f\"Versión {i}: {conteo} apariciones de '{palabra}'\")"},{"type":"p","text":"Esta estructura contiene tres ideas esenciales:"},{"type":"ul","items":["textos agrupa todos los documentos.","for repite el mismo análisis para cada documento.","enumerate() permite etiquetar cada salida con un número de versión."]},{"type":"p","text":"El resultado puede servir para detectar diferencias llamativas:"},{"type":"table","rows":[["Versión","Apariciones de implementación","Interpretación inicial"],["1","8","Alta preferencia por el término"],["2","1","Posible uso de alternativa terminológica"],["3","0","Puede haber sustitución por otro concepto o paráfrasis"]],"title":"El resultado puede servir para detectar diferencias llamativas"},{"type":"p","text":"La interpretación no debe precipitarse. Que una versión use menos un término no significa necesariamente que sea peor. Puede ser más concisa, haber reformulado el contenido o emplear un término recomendado. El conteo solo abre una pregunta."}]},{"id":"2-7-detectar-ausencia-de-espacio-despues-de-puntuacion","title":"2.7. Detectar ausencia de espacio después de puntuación","blocks":[{"type":"p","text":"Uno de los problemas formales más fáciles de detectar automáticamente es la ausencia de espacio después de punto o coma:"},{"type":"table","rows":[["Fragmento","Problema"],["El informe fue aprobado.La comisión lo publicó.","Falta espacio tras punto"],["El proyecto incluye formación,seguimiento y evaluación.","Falta espacio tras coma"]],"title":"Fragmento · Problema"},{"type":"p","text":"Estos errores parecen pequeños, pero en documentos institucionales afectan a la calidad percibida. También pueden dificultar procesos automáticos posteriores, como la segmentación o la tokenización."},{"type":"p","text":"Para detectarlos, se puede usar una expresión regular:"},{"type":"code","code":"import re\n\nerrores = [m.start() for m in re.finditer(r\"[.,][^\\s]\", texto_a)]\nprint(f\"Número de signos sin espacio después: {len(errores)}\")"},{"type":"p","text":"La expresión r\"[.,][^\\s]\" se lee así:"},{"type":"table","rows":[["Parte","Significado"],["r\"...\"","Cadena cruda, útil para escribir patrones de expresiones regulares"],["[.,]","Un punto o una coma"],["[^\\s]","Un carácter que no sea espacio"]],"title":"La expresión r\"[.,][^\\s]\" se lee así"},{"type":"p","text":"Por tanto, el patrón busca un punto o una coma seguidos inmediatamente de un carácter que no sea espacio."},{"type":"p","text":"El método re.finditer() devuelve coincidencias con información de posición. Por eso podemos usar m.start() para saber en qué índice del texto empieza cada caso."}]},{"id":"2-8-recuperar-contexto-con-indices-y-slicing","title":"2.8. Recuperar contexto con índices y slicing","blocks":[{"type":"p","text":"Un informe que solo dice «hay 12 errores» no es suficiente. La persona que revisa necesita saber dónde están. Para eso se extraen fragmentos de contexto:"},{"type":"code","code":"for pos in errores:\n    inicio = max(pos - 20, 0)\n    fin = pos + 20\n    fragmento = texto_a[inicio:fin]\n    print(f\"...{fragmento}...\")"},{"type":"p","text":"Este fragmento introduce varias ideas:"},{"type":"ul","items":["pos es la posición donde se detectó el patrón.","pos - 20 toma veinte caracteres anteriores.","pos + 20 toma veinte caracteres posteriores.","max(pos - 20, 0) evita que el índice inicial sea negativo.","texto_a[inicio:fin] extrae una porción del texto."]},{"type":"p","text":"El resultado permite ver algo como:"},{"type":"code","code":"...evaluación.La comisión aprobó...\n...formación,seguimiento y apoyo..."},{"type":"p","text":"La extracción de contexto es una práctica habitual en revisión automática. No basta con encontrar el error; hay que mostrarlo de forma útil."}]},{"id":"2-9-localizar-dobles-espacios","title":"2.9. Localizar dobles espacios","blocks":[{"type":"p","text":"Los dobles espacios son otro problema formal frecuente. Suelen aparecer al editar, copiar y pegar o combinar fragmentos procedentes de distintas fuentes:"},{"type":"code","code":"La institución  publicará el informe final."},{"type":"p","text":"Una detección mínima puede hacerse con el operador in:"},{"type":"code","code":"hay_dobles_espacios = \"  \" in texto_a\nprint(hay_dobles_espacios)"},{"type":"p","text":"La expresión \"  \" in texto_a pregunta si la secuencia de dos espacios aparece en el texto. Devuelve True o False."},{"type":"p","text":"Para contar cuántas veces aparece:"},{"type":"code","code":"total = texto_a.count(\"  \")\nprint(f\"Dobles espacios detectados: {total}\")"},{"type":"p","text":"Y para saber en qué oraciones se encuentran:"},{"type":"code","code":"dobles = [\n    i + 1\n    for i, oracion in enumerate(oraciones_a)\n    if \"  \" in oracion\n]\n\nprint(f\"Aparecen en las oraciones: {dobles}\")"},{"type":"p","text":"Esta estructura es una lista por comprensión. Construye una lista nueva a partir de una condición. En este caso, guarda los números de las oraciones que contienen dobles espacios."},{"type":"p","text":"La parte i + 1 se usa porque Python empieza a contar en 0, pero en un informe para personas suele ser más natural empezar por 1."}]},{"id":"2-10-comparacion-terminologica-basica","title":"2.10. Comparación terminológica básica","blocks":[{"type":"p","text":"Cuando se trabaja con varios textos, también conviene guardar las oraciones de cada texto en una lista:"},{"type":"code","code":"textos = [texto_a, texto_b, texto_c]\noraciones_textos = [oraciones_a, oraciones_b, oraciones_c]"},{"type":"p","text":"Para recorrer al mismo tiempo cada texto y su lista de oraciones, se puede usar zip():"},{"type":"code","code":"for i, (texto, oraciones) in enumerate(zip(textos, oraciones_textos), start=1):\n    dobles = [\n        n + 1\n        for n, oracion in enumerate(oraciones)\n        if \"  \" in oracion\n    ]\n    print(f\"Versión {i}: {texto.count('  ')} dobles espacios\")\n    print(f\"Oraciones afectadas: {dobles}\")"},{"type":"p","text":"zip(textos, oraciones_textos) empareja los elementos de ambas listas:"},{"type":"table","rows":[["Elemento de textos","Elemento de oraciones_textos"],["texto_a","oraciones_a"],["texto_b","oraciones_b"],["texto_c","oraciones_c"]],"title":"zip(textos, oraciones_textos) empareja los elementos de ambas listas"},{"type":"p","text":"Esta técnica es muy útil cuando varias estructuras de datos representan distintos niveles del mismo corpus: texto completo, oraciones, metadatos, proveedor, fecha de entrega o estado de revisión."},{"type":"p","text":"La comparación terminológica es el corazón profesional de esta unidad. En textos paralelos monolingües, muchas divergencias no son errores gramaticales, sino diferencias de elección léxica."},{"type":"p","text":"Supongamos que queremos comparar estas parejas:"},{"type":"code","code":"parejas_terminos = [\n    (\"equipo\", \"grupo\"),\n    (\"compañía\", \"empresa\"),\n    (\"gerente\", \"director\"),\n    (\"procesos\", \"procedimientos\"),\n]"},{"type":"p","text":"Cada pareja representa dos formas que pueden competir dentro de una misma política terminológica. Una institución puede considerar que ambas son aceptables en contextos distintos, o puede preferir una."},{"type":"p","text":"Un análisis sencillo cuenta cada término en cada versión:"},{"type":"code","code":"texto_a_lower = texto_a.lower()\ntexto_b_lower = texto_b.lower()\n\nfor termino_1, termino_2 in parejas_terminos:\n    c1_a = texto_a_lower.count(termino_1)\n    c2_a = texto_a_lower.count(termino_2)\n    c1_b = texto_b_lower.count(termino_1)\n    c2_b = texto_b_lower.count(termino_2)\n\n    print(f\"{termino_1}: versión A={c1_a}, versión B={c1_b}\")\n    print(f\"{termino_2}: versión A={c2_a}, versión B={c2_b}\")"},{"type":"p","text":"El resultado puede revelar situaciones como estas:"},{"type":"table","rows":[["Situación","Posible interpretación"],["Una versión usa equipo y otra grupo","Divergencia terminológica entre proveedores"],["Una versión alterna empresa y compañía","Falta de uniformidad interna"],["Un término recomendado no aparece","Posible incumplimiento de glosario"],["Un término aparece en exceso","Puede haber traducción literal, repetición o preferencia estilística"]],"title":"El resultado puede revelar situaciones como estas"},{"type":"p","text":"La tabla no decide por sí sola qué término es mejor. Proporciona evidencia para discutirlo."}]},{"id":"2-11-tablas-de-resultados","title":"2.11. Tablas de resultados","blocks":[{"type":"p","text":"En revisión profesional, la forma de presentar los resultados importa. Una salida desordenada puede ser difícil de interpretar. Python permite alinear texto y números mediante cadenas formateadas."},{"type":"code","code":"print(f\"{'Término':<20} | {'Versión 1':^10} | {'Versión 2':^10}\")\nprint(\"-\" * 48)\n\nfor termino_1, termino_2 in parejas_terminos:\n    print(f\"{termino_1:<20} | {c1_a:^10} | {c1_b:^10}\")\n    print(f\"{termino_2:<20} | {c2_a:^10} | {c2_b:^10}\")\n    print(\"-\" * 48)"},{"type":"p","text":"Las expresiones entre llaves controlan el formato:"},{"type":"table","rows":[["Código","Significado"],["{termino_1:<20}","Escribe el término alineado a la izquierda en 20 caracteres"],["{c1_a:^10}","Centra el número en 10 caracteres"],["\"-\" * 48","Repite el guion 48 veces para crear una línea separadora"]],"title":"Las expresiones entre llaves controlan el formato"},{"type":"p","text":"Este tipo de formato no es solo estético. Ayuda a leer la comparación como una tabla. Cuando los resultados se entregan a un equipo editorial, claridad visual y precisión técnica van juntas."}]},{"id":"2-12-comparar-terminos-en-muchas-versiones","title":"2.12. Comparar términos en muchas versiones","blocks":[{"type":"p","text":"La comparación puede generalizarse a cualquier número de textos:"},{"type":"code","code":"textos = [texto_a, texto_b, texto_c]\ntextos_lower = [texto.lower() for texto in textos]\n\ncabecera = \"Término\".ljust(20)\nfor i in range(len(textos_lower)):\n    cabecera += f\" | Versión {i + 1:^8}\"\nprint(cabecera)\n\nfor pareja in parejas_terminos:\n    for termino in pareja:\n        fila = f\"{termino:<20}\"\n        for texto in textos_lower:\n            fila += f\" | {texto.count(termino):^10}\"\n        print(fila)"},{"type":"p","text":"Aquí aparece una nueva lista por comprensión:"},{"type":"code","code":"textos_lower = [texto.lower() for texto in textos]"},{"type":"p","text":"Esta línea crea una lista con todas las versiones en minúsculas. Es una forma compacta de preparar los datos antes de contarlos."},{"type":"p","text":"La comparación en muchas versiones permite detectar patrones más ricos:"},{"type":"table","rows":[["Término","Versión 1","Versión 2","Versión 3"],["adquirir","4","0","1"],["obtener","0","5","2"],["conseguir","1","0","6"],["trabajador","8","1","0"],["empleado","0","6","2"],["asalariado","0","0","5"]],"title":"Término · Versión 1 · Versión 2 · Versión 3"},{"type":"p","text":"Una tabla así invita a formular hipótesis:"},{"type":"ul","items":["Quizá cada proveedor tiene una preferencia léxica estable.","Quizá una versión es más técnica y otra más general.","Quizá se están usando términos que no pertenecen al mismo registro.","Quizá hay que consolidar un glosario antes de publicar."]},{"type":"p","text":"El análisis cuantitativo no cierra la interpretación; la abre de forma ordenada."}]},{"id":"2-13-posibles-galicismos-buscar-candidatos-a-infinitivo","title":"2.13. Posibles galicismos: Buscar candidatos a + infinitivo","blocks":[{"type":"p","text":"En español normativo, una construcción como temas a tratar suele citarse como posible calco del francés cuando funciona como sustantivo + a + infinitivo. En muchos contextos se recomienda reformular con estructuras como:"},{"type":"table","rows":[["Construcción revisable","Posible alternativa"],["asuntos a debatir","asuntos que se deben debatir"],["tareas a realizar","tareas que hay que realizar"],["documentos a presentar","documentos que deben presentarse"]],"title":"Construcción revisable · Posible alternativa"},{"type":"p","text":"No obstante, el diagnóstico no puede automatizarse con una regla tan simple como «toda secuencia a + infinitivo es incorrecta». En español hay muchísimas construcciones correctas con a + infinitivo:"},{"type":"ul","items":["vamos a revisar","empezó a trabajar","aprendió a programar","ayuda a entender"]},{"type":"p","text":"Por eso conviene hablar de posibles galicismos o candidatos a revisión, no de errores automáticos."},{"type":"p","text":"Un patrón inicial puede localizar secuencias de palabra + a + infinitivo:"},{"type":"code","code":"import re\n\npatron = r\"(\\w+)\\s+a\\s+(\\w+(ar|er|ir))\\b\"\nresultados = re.findall(patron, texto_a.lower())\n\npares = [(anterior, verbo) for anterior, verbo, _ in resultados]\n\nfor anterior, verbo in pares:\n    print(f\"{anterior} a {verbo}\")"},{"type":"p","text":"La lista pares conserva solo la palabra anterior y el verbo. El tercer elemento de cada coincidencia, la terminación ar, er o ir, se descarta con _ porque no nos interesa para el informe."},{"type":"p","text":"Este análisis es útil como filtro inicial. Si aparecen muchos casos, la lingüista puede revisar el contexto y distinguir:"},{"type":"table","rows":[["Caso detectado","Lectura posible"],["documentos a presentar","Candidato a revisión"],["vamos a presentar","Construcción verbal correcta"],["ayuda a presentar","Régimen verbal correcto"],["aspectos a considerar","Candidato a revisión según estilo"]],"title":"Caso detectado · Lectura posible"},{"type":"p","text":"Para automatizar mejor esta tarea haría falta combinar varias técnicas: tokenización, lematización y etiquetado morfosintáctico. En particular, habría que comprobar si la palabra anterior es un sustantivo y si la secuencia forma realmente una construcción nominal."}]},{"id":"2-14-buscar-gerundios-y-contexto-inmediato","title":"2.14. Buscar gerundios y contexto inmediato","blocks":[{"type":"p","text":"El gerundio en español tiene usos correctos y usos problemáticos. Puede expresar simultaneidad, modo o proceso:"},{"type":"ul","items":["El equipo revisó el informe siguiendo las instrucciones.","La comisión analizó los datos comparando las dos versiones."]},{"type":"p","text":"Pero también puede aparecer en usos desaconsejados, como el gerundio de posterioridad o ciertos gerundios especificativos:"},{"type":"table","rows":[["Tipo","Fragmento revisable","Motivo"],["Posterioridad","Se aprobó el informe, publicándose al día siguiente.","El gerundio expresa una acción posterior"],["Especificativo","Se envió una carta informando del cambio.","Puede funcionar como modificador poco natural"]],"title":"Tipo · Fragmento revisable · Motivo"},{"type":"p","text":"Una regla formal inicial consiste en buscar palabras terminadas en -ando, -iendo o -yendo:"},{"type":"code","code":"import re\n\npatron = r\"(\\w+)?\\s*(\\w+(ando|iendo|yendo))\\s*(\\w+)?\"\ncoincidencias = re.findall(patron, texto_a.lower())\n\ngerundios = [\n    (anterior if anterior else \"\", gerundio, siguiente if siguiente else \"\")\n    for anterior, gerundio, _, siguiente in coincidencias\n]\n\nfor anterior, gerundio, siguiente in gerundios:\n    print(anterior, gerundio, siguiente)"},{"type":"p","text":"Este patrón busca el gerundio y captura, si existen, una palabra anterior y una palabra siguiente. El contexto mínimo ayuda a decidir si el caso requiere revisión."},{"type":"p","text":"De nuevo, la herramienta no declara automáticamente que un gerundio sea incorrecto. Solo localiza formas que una persona puede evaluar. La diferencia entre detectar y diagnosticar es central:"},{"type":"table","rows":[["Detección automática","Diagnóstico lingüístico"],["Encuentra palabras terminadas en -ando, -iendo, -yendo","Decide si el uso del gerundio es aceptable"],["Muestra contexto inmediato","Interpreta relación temporal, sintáctica y semántica"],["Cuenta ocurrencias","Valora si hay patrón estilístico problemático"]],"title":"Detección automática · Diagnóstico lingüístico"},{"type":"p","text":"Como se explicó en el marco teórico, un falso positivo es un caso que la herramienta marca como sospechoso, pero que no constituye realmente un problema."},{"type":"p","text":"En análisis de revisión lingüística, los falsos positivos son inevitables cuando usamos reglas simples. Por ejemplo:"},{"type":"code","code":"patron = r\"(\\w+)\\s+a\\s+(\\w+(ar|er|ir))\\b\""},{"type":"p","text":"Este patrón puede detectar:"},{"type":"ul","items":["vamos a revisar","ayuda a entender","documentos a presentar"]},{"type":"p","text":"Solo algunos casos serán revisables como posible calco. El patrón no sabe si la palabra anterior es un sustantivo, un verbo conjugado o una forma auxiliar. Tampoco conoce el régimen verbal."},{"type":"p","text":"Esto no invalida el análisis. Al contrario: enseña una lección metodológica importante. En PLN, muchas herramientas funcionan por aproximación. Una buena herramienta no es necesariamente la que no se equivoca nunca, sino la que reduce el trabajo humano sin ocultar sus límites."},{"type":"p","text":"Para una lingüista, el objetivo no es aceptar ciegamente la salida del programa. El objetivo es aprender a preguntar:"},{"type":"ul","items":["¿Qué está detectando exactamente esta regla?","¿Qué casos deja fuera?","¿Qué casos marca indebidamente?","¿Qué conocimiento lingüístico haría falta añadir?","¿Qué coste tendría mejorar la precisión?"]},{"type":"p","text":"Esta actitud crítica diferencia el uso superficial de Python de un verdadero análisis lingüístico computacional."}]},{"id":"2-15-organizar-el-analisis-con-funciones","title":"2.15. Organizar el análisis con funciones","blocks":[{"type":"p","text":"Cuando un análisis crece, conviene organizarlo en funciones. Una función es un bloque de código con nombre que realiza una tarea concreta."},{"type":"p","text":"Por ejemplo:"},{"type":"code","code":"def contar_palabra(texto, palabra):\n    texto_lower = texto.lower()\n    return texto_lower.count(palabra)"},{"type":"p","text":"Esta función recibe un texto y una palabra. Convierte el texto a minúsculas y devuelve el número de apariciones."},{"type":"p","text":"Podemos usarla así:"},{"type":"code","code":"conteo = contar_palabra(texto_a, \"implementación\")\nprint(conteo)"},{"type":"p","text":"Las funciones aportan varias ventajas:"},{"type":"table","rows":[["Ventaja","Explicación"],["Organización","Cada tarea tiene un nombre claro"],["Reutilización","La misma función sirve para otros textos"],["Legibilidad","El informe final puede llamar funciones en orden"],["Mantenimiento","Si se mejora una regla, se cambia en un solo lugar"],["Escalabilidad","Es más fácil añadir nuevas comprobaciones"]],"title":"Las funciones aportan varias ventajas"},{"type":"p","text":"Sin funciones, el código puede convertirse en una sucesión larga de instrucciones repetidas. Con funciones, el análisis se parece más a un conjunto ordenado de herramientas."},{"type":"p","text":"Un sistema básico de revisión puede organizarse en funciones como estas:"},{"type":"code","code":"def contar_palabra(texto, palabra):\n    return texto.lower().count(palabra)"},{"type":"code","code":"def buscar_falta_espacio(texto):\n    import re\n    return [m.start() for m in re.finditer(r\"[.,][^\\s]\", texto)]"},{"type":"code","code":"def detectar_dobles_espacios(texto, oraciones):\n    posiciones = [\n        i + 1\n        for i, oracion in enumerate(oraciones)\n        if \"  \" in oracion\n    ]\n    return texto.count(\"  \"), posiciones"},{"type":"code","code":"def analizar_a_infinitivo(texto):\n    import re\n    patron = r\"(\\w+)\\s+a\\s+(\\w+(ar|er|ir))\\b\"\n    resultados = re.findall(patron, texto.lower())\n    return [(anterior, verbo) for anterior, verbo, _ in resultados]"},{"type":"code","code":"def buscar_gerundios(texto):\n    import re\n    patron = r\"(\\w+)?\\s*(\\w+(ando|iendo|yendo))\\s*(\\w+)?\"\n    coincidencias = re.findall(patron, texto.lower())\n    return [\n        (anterior if anterior else \"\", gerundio, siguiente if siguiente else \"\")\n        for anterior, gerundio, _, siguiente in coincidencias\n    ]"},{"type":"p","text":"Cada función resuelve una pregunta concreta:"},{"type":"table","rows":[["Función","Pregunta que responde"],["contar_palabra()","¿Cuántas veces aparece este término?"],["buscar_falta_espacio()","¿Dónde falta espacio tras punto o coma?"],["detectar_dobles_espacios()","¿Cuántos dobles espacios hay y en qué oraciones?"],["analizar_a_infinitivo()","¿Qué secuencias pueden requerir revisión como a + infinitivo?"],["buscar_gerundios()","¿Qué gerundios aparecen y con qué contexto mínimo?"]],"title":"Cada función resuelve una pregunta concreta"},{"type":"p","text":"El nombre de una función debe ser transparente. Una persona que lea buscar_gerundios(texto) entiende la intención sin tener que estudiar cada línea interna."}]},{"id":"2-16-devolver-resultados-con-return","title":"2.16. Devolver resultados con `return`","blocks":[{"type":"p","text":"Una función puede imprimir algo en pantalla o puede devolver un resultado. No es lo mismo."},{"type":"p","text":"Observa esta función:"},{"type":"code","code":"def sumar(a, b):\n    resultado = a + b"},{"type":"p","text":"Calcula a + b, pero no devuelve el resultado. Si se intenta guardar la salida:"},{"type":"code","code":"x = sumar(3, 4)\nprint(x)"},{"type":"p","text":"Python imprimirá:"},{"type":"code","code":"None"},{"type":"p","text":"None significa que la función no ha devuelto ningún valor."},{"type":"p","text":"Para que el resultado pueda usarse fuera de la función, necesitamos return:"},{"type":"code","code":"def sumar(a, b):\n    resultado = a + b\n    return resultado"},{"type":"p","text":"O, de forma más breve:"},{"type":"code","code":"def sumar(a, b):\n    return a + b"},{"type":"p","text":"Entonces:"},{"type":"code","code":"x = sumar(3, 4)\nprint(x)"},{"type":"p","text":"produce:"},{"type":"code","code":"7"},{"type":"p","text":"En un informe de revisión lingüística, return es importante porque permite combinar resultados. Una función puede contar términos y devolver números; otra puede detectar errores y devolver posiciones; otra puede construir una tabla. Si solo imprimen, los resultados se ven en pantalla, pero es más difícil reutilizarlos."}]},{"id":"2-17-generar-un-informe-final","title":"2.17. Generar un informe final","blocks":[{"type":"p","text":"El objetivo práctico no es acumular fragmentos de código, sino producir un informe ordenado. Un informe final puede organizarse por secciones:"},{"type":"ol","items":["Frecuencia de términos clave.","Ausencias de espacio tras puntuación.","Dobles espacios.","Comparación terminológica.","Posibles estructuras a + infinitivo.","Gerundios localizados.","Observaciones para revisión humana."]},{"type":"p","text":"Un esquema simplificado podría ser:"},{"type":"code","code":"textos = [texto_a, texto_b]\noraciones_textos = [oraciones_a, oraciones_b]\n\nprint(\"INFORME DE REVISIÓN LINGÜÍSTICA\")\nprint(\"=\" * 40)\n\nfor i, texto in enumerate(textos, start=1):\n    print(f\"\\nVERSIÓN {i}\")\n    print(\"-\" * 20)\n\n    conteo = contar_palabra(texto, \"implementación\")\n    print(f\"Frecuencia de 'implementación': {conteo}\")\n\n    errores = buscar_falta_espacio(texto)\n    print(f\"Signos sin espacio después: {len(errores)}\")\n\n    total_dobles, oraciones = detectar_dobles_espacios(\n        texto,\n        oraciones_textos[i - 1]\n    )\n    print(f\"Dobles espacios: {total_dobles}\")\n    print(f\"Oraciones afectadas: {oraciones}\")\n\n    candidatos = analizar_a_infinitivo(texto)\n    print(f\"Posibles casos de 'a + infinitivo': {len(candidatos)}\")\n\n    gerundios = buscar_gerundios(texto)\n    print(f\"Gerundios encontrados: {len(gerundios)}\")"},{"type":"p","text":"Este informe no pretende ser el documento final que se entregaría a una institución. Es una base. A partir de él, se podrían añadir:"},{"type":"ul","items":["Exportación a .csv o .xlsx.","Resúmenes por proveedor.","Fragmentos de contexto para cada hallazgo.","Clasificación manual de casos correctos e incorrectos.","Gráficos de distribución terminológica.","Integración con glosarios institucionales."]},{"type":"p","text":"La idea clave es que Python organiza la evidencia. La decisión profesional sigue perteneciendo a la especialista."}]},{"id":"2-18-como-leer-los-resultados-antes-de-corregir","title":"2.18. Cómo leer los resultados antes de corregir","blocks":[{"type":"p","text":"Una buena práctica consiste en leer los resultados con tres preguntas:"},{"type":"ul","items":["¿Qué regla produjo este hallazgo?","¿Qué parte del texto se muestra como contexto?","¿Qué decisión humana hace falta ahora?"]},{"type":"p","text":"Estas preguntas evitan una confianza excesiva en la salida automática. También ayudan a documentar el trabajo. Si una incidencia se descarta, puede anotarse por qué. Si se confirma, puede corregirse con una justificación. En entornos profesionales, esta trazabilidad puede ser tan importante como la corrección misma."}]}],"navTitle":"Python para PLN"},{"id":"reglas-simples-frente-a-analisis-linguistico-avanzado","title":"Reglas simples frente a análisis lingüístico avanzado","blocks":[{"type":"p","text":"Las técnicas de esta unidad se basan en reglas simples:"},{"type":"ul","items":["Cortar por puntos.","Contar cadenas exactas.","Buscar patrones con expresiones regulares.","Identificar terminaciones como -ando, -iendo o -yendo."]},{"type":"p","text":"Estas reglas son transparentes. Podemos explicar exactamente qué hacen. Esa transparencia es una virtud en formación y en revisión profesional. Sin embargo, también tienen límites:"},{"type":"table","rows":[["Regla simple","Límite"],["split(\".\")","Confunde puntos de abreviaturas con finales de oración"],[".count(\"empresa\")","Puede contar partes de palabras o no agrupar variantes flexivas"],["Patrón a + infinitivo","No distingue sustantivos de verbos conjugados"],["Terminaciones de gerundio","No interpreta la función sintáctica del gerundio"],["Conteo de sinónimos","No sabe si dos términos son equivalentes en contexto"]],"title":"Regla simple · Límite"},{"type":"p","text":"Para mejorar la precisión, se pueden incorporar técnicas más avanzadas:"},{"type":"ul","items":["Tokenización, para separar el texto en unidades lingüísticas más precisas.","Lematización, para agrupar formas como trabaja, trabajó, trabajar.","Etiquetado morfosintáctico, para saber si una palabra es sustantivo, verbo, adjetivo, etc.","Análisis de dependencias, para estudiar relaciones sintácticas.","Reconocimiento de entidades, para detectar instituciones, lugares o personas.","Modelos estadísticos o neuronales, para capturar patrones no formulados manualmente."]},{"type":"p","text":"La progresión natural en PLN consiste en empezar por reglas simples, comprender sus límites y avanzar hacia herramientas más sofisticadas cuando la pregunta lo requiere."}],"subsections":[],"navTitle":"Reglas y análisis avanzado"},{"id":"buenas-practicas-para-revisar-textos-con-python","title":"Buenas prácticas para revisar textos con Python","blocks":[{"type":"p","text":"Un análisis automático de revisión lingüística debe ser claro, reproducible y prudente. Algunas buenas prácticas son:"},{"type":"ol","items":["Nombrar bien las variables. texto_a es más claro que x.","Guardar juntos los textos relacionados. Una lista facilita el análisis conjunto.","Normalizar cuando sea necesario. .lower() evita diferencias irrelevantes entre mayúsculas y minúsculas.","Conservar contexto. Un hallazgo sin fragmento puede ser difícil de corregir.","Distinguir detección de diagnóstico. Que una regla encuentre algo no significa que sea un error.","Presentar resultados con etiquetas claras. El informe debe poder leerlo otra persona.","Evitar copiar y pegar bloques repetidos. Las funciones reducen errores y mejoran la reutilización.","Documentar los límites. Toda herramienta debe decir qué detecta y qué no.","Mantener el criterio lingüístico en el centro. Python apoya la revisión; no sustituye la interpretación."]},{"type":"p","text":"Estas prácticas son tan importantes como la sintaxis. En entornos profesionales, un análisis útil no es solo el que produce números, sino el que permite tomar decisiones con confianza."}],"subsections":[],"navTitle":"Buenas prácticas"},{"id":"errores-frecuentes-de-aprendizaje","title":"Errores frecuentes de aprendizaje","blocks":[{"type":"ul","items":["Confundir una coincidencia automática con un error lingüístico confirmado.","Pensar que split(\".\") segmenta siempre oraciones correctamente.","Olvidar encoding=\"utf-8\" al leer textos con tildes, eñes o comillas españolas.","Contar términos sin normalizar mayúsculas y minúsculas cuando la comparación lo requiere.","Usar count sin recordar que busca secuencias, no necesariamente palabras completas.","Interpretar una divergencia terminológica como error sin consultar el glosario o el contexto.","Creer que una expresión regular comprende gramática, régimen verbal o estilo.","Diseñar patrones demasiado amplios y no prever falsos positivos.","Diseñar patrones demasiado estrechos y dejar fuera casos relevantes.","Usar print dentro de todo el código y luego no poder reutilizar los resultados.","Repetir bloques casi idénticos en lugar de crear funciones.","Presentar un informe sin contexto suficiente para que una revisora pueda decidir."]}],"subsections":[],"navTitle":"Errores frecuentes"},{"id":"sintesis-final","title":"Síntesis final","blocks":[{"type":"p","text":"Esta unidad muestra cómo Python puede apoyar la revisión lingüística de textos paralelos monolingües. El objetivo no es automatizar el juicio experto, sino construir una cadena de análisis que convierta los textos en datos observables: se leen archivos, se guardan versiones, se segmentan oraciones, se cuentan términos, se buscan patrones formales y se generan resultados interpretables."},{"type":"p","text":"El marco teórico de la unidad conecta tres ámbitos: la revisión y evaluación de calidad en servicios lingüísticos, la lingüística de corpus y el PLN basado en reglas. De la revisión profesional se toma la importancia del criterio y de la trazabilidad. De la lingüística de corpus se toma la idea de observar patrones en colecciones de textos. Del PLN se toman herramientas como cadenas, listas, bucles, expresiones regulares y funciones."},{"type":"p","text":"El aprendizaje más importante es metodológico: el código debe formular preguntas concretas. Python puede ayudar a responder «cuántas veces aparece este término», «dónde hay una coma sin espacio posterior» o «qué segmentos contienen una forma terminada en gerundio». No puede responder por sí solo «qué versión es mejor» sin un marco de decisión humano."},{"type":"p","text":"Para una alumna o un alumno lingüista, esta unidad ofrece una base profesional muy valiosa. Permite pasar de la lectura lineal a la lectura asistida por evidencias, y de la intuición individual a un procedimiento más documentable. Esa es una competencia central en PLN aplicado a revisión, traducción, edición y control de calidad textual."}],"subsections":[],"navTitle":"Síntesis"},{"id":"cierre-narrativo","title":"Cierre narrativo","blocks":[{"type":"p","text":"Al final de la simulación, Verba Pública no entrega a la institución una sentencia automática. Entrega un informe preliminar de revisión: términos que conviene unificar, patrones formales que deben comprobarse, estructuras candidatas a lectura lingüística y una explicación clara de las cautelas. La revisora sénior conserva la última palabra, pero ya no parte de una página en blanco."},{"type":"p","text":"La institución gana tiempo y transparencia. El equipo lingüístico gana una forma de justificar mejor sus recomendaciones. Y el alumnado aprende una lección clave: programar para PLN no consiste solo en escribir código que funcione, sino en diseñar procedimientos que respeten la complejidad del lenguaje y ayuden a tomar mejores decisiones."}],"subsections":[],"navTitle":"Cierre narrativo"}],"references":[{"key":"bird2009","text":"Bird, S., Klein, E. y Loper, E. (2009). *Natural language processing with Python*. O'Reilly Media. https://www.nltk.org/book/"},{"key":"bowker2002","text":"Bowker, L. (2002). *Computer-aided translation technology: A practical introduction*. University of Ottawa Press."},{"key":"friedl2006","text":"Friedl, J. E. F. (2006). *Mastering regular expressions* (3rd ed.). O'Reilly Media."},{"key":"internationalorganiz2015","text":"International Organization for Standardization. (2015). *ISO 17100:2015. Translation services: Requirements for translation services*. https://www.iso.org/standard/59149.html"},{"key":"internationalorganiz2024","text":"International Organization for Standardization. (2024). *ISO 5060:2024. Translation services: Evaluation of translation output*. https://www.iso.org/standard/80786.html"},{"key":"jurafsky2025","text":"Jurafsky, D. y Martin, J. H. (2025). *Speech and language processing* (3rd ed. draft). Stanford University. https://web.stanford.edu/~jurafsky/slp3/"},{"key":"kiss2006","text":"Kiss, T. y Strunk, J. (2006). Unsupervised multilingual sentence boundary detection. *Computational Linguistics, 32*(4), 485-525. https://doi.org/10.1162/coli.2006.32.4.485"},{"key":"lommel2014","text":"Lommel, A., Burchardt, A. y Uszkoreit, H. (2014). Multidimensional Quality Metrics: A flexible system for assessing translation quality. *Tradumàtica, 12*, 455-463. https://doi.org/10.5565/rev/tradumatica.77"},{"key":"mcenery2012","text":"McEnery, T. y Hardie, A. (2012). *Corpus linguistics: Method, theory and practice*. Cambridge University Press."},{"key":"olohan2004","text":"Olohan, M. (2004). *Introducing corpora in translation studies*. Routledge."},{"key":"pythonsoftwarefounda2026a","text":"Python Software Foundation. (2026a). *re: Regular expression operations*. Python 3.14 documentation. https://docs.python.org/3/library/re.html"},{"key":"pythonsoftwarefounda2026b","text":"Python Software Foundation. (2026b). *pathlib: Object-oriented filesystem paths*. Python 3.14 documentation. https://docs.python.org/3/library/pathlib.html"},{"key":"pythonsoftwarefounda2026c","text":"Python Software Foundation. (2026c). *Built-in functions: open*. Python 3.14 documentation. https://docs.python.org/3/library/functions.html#open"},{"key":"realacademiaespanola2005","text":"Real Academia Española & Asociación de Academias de la Lengua Española. (2005/2023). *Diccionario panhispánico de dudas*. https://www.rae.es/dpd/"},{"key":"realacademiaespanola2009","text":"Real Academia Española & Asociación de Academias de la Lengua Española. (2009). *Nueva gramática de la lengua española*. Espasa."},{"key":"zanettin2012","text":"Zanettin, F. (2012). *Translation-driven corpora: Corpus resources for descriptive and applied translation studies*. Routledge."}]}};

  function sha256Hex(text) {
    var enc = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", enc).then(function(buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function(b) {
        return b.toString(16).padStart(2, "0");
      }).join("");
    });
  }

  function showView(id) {

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  var quizState = null;

  function renderQuizStart() {
    var root = document.getElementById("quiz-root");
    if (!root) return;
    root.innerHTML =
      '<div class="quiz-start">' +
      '<p>10 preguntas: 5 elegidas al azar del banco del manual y 5 del banco del cuaderno. Puedes repetir el intento tantas veces como quieras — cada vez se vuelven a elegir y reordenar las preguntas.</p>' +
      '<button class="quiz-btn" id="quiz-begin">Empezar</button>' +
      '</div>';
    document.getElementById("quiz-begin").addEventListener("click", startQuiz);
  }

  function startQuiz() {
    var fromManual = shuffle(QUIZ_MANUAL).slice(0, 5);
    var fromCuaderno = shuffle(QUIZ_CUADERNO).slice(0, 5);
    quizState = { questions: shuffle(fromManual.concat(fromCuaderno)), index: 0, score: 0 };
    renderQuizQuestion();
  }

  function renderQuizQuestion() {
    var root = document.getElementById("quiz-root");
    var total = quizState.questions.length;
    if (quizState.index >= total) {
      root.innerHTML =
        '<div class="quiz-result">' +
        '<div class="quiz-score">' + quizState.score + ' / ' + total + '</div>' +
        '<p>Puntuación de este intento.</p>' +
        '<button class="quiz-btn" id="quiz-retry">Volver a intentar</button>' +
        '</div>';
      document.getElementById("quiz-retry").addEventListener("click", startQuiz);
      return;
    }
    var q = quizState.questions[quizState.index];
    var opts = shuffle(q.answerOptions);
    var html = '<div class="quiz-progress">Pregunta ' + (quizState.index + 1) + ' de ' + total + ' · Puntuación provisional: ' + quizState.score + '</div>';
    html += '<div class="quiz-q"><h3>' + q.question + '</h3>';
    opts.forEach(function(opt, i) {
      html += '<button class="quiz-opt" data-idx="' + i + '">' + opt.text + '</button>';
    });
    html += '<div class="quiz-feedback" id="quiz-feedback" hidden></div>';
    html += '</div>';
    root.innerHTML = html;
    var buttons = root.querySelectorAll(".quiz-opt");
    buttons.forEach(function(btn, i) {
      btn.addEventListener("click", function() {
        buttons.forEach(function(b) { b.disabled = true; });
        var chosen = opts[i];
        if (chosen.isCorrect) { btn.classList.add("correct"); quizState.score++; }
        else {
          btn.classList.add("incorrect");
          buttons.forEach(function(b2, j) { if (opts[j].isCorrect) b2.classList.add("correct"); });
        }
        var fb = document.getElementById("quiz-feedback");
        fb.hidden = false;
        fb.textContent = chosen.rationale || (chosen.isCorrect ? "Correcto." : "Incorrecto.");
        var next = document.createElement("button");
        next.className = "quiz-btn";
        next.style.marginTop = "14px";
        next.textContent = quizState.index + 1 < total ? "Siguiente" : "Ver puntuación";
        next.addEventListener("click", function() { quizState.index++; renderQuizQuestion(); });
        root.querySelector(".quiz-q").appendChild(next);
      });
    });
  }

  function imEsc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function imFormatBackticks(s) {
    var parts = s.split("`"), out = "";
    for (var i = 0; i < parts.length; i++) out += (i % 2 === 1) ? '<code class="im-inline">' + imEsc(parts[i]) + "</code>" : imEsc(parts[i]);
    return out;
  }
  function imFormatInline(raw) {
    var re = /{{cite:([^}]*)}}([\s\S]*?){{\/cite}}/g;
    var out = "", last = 0, m;
    while ((m = re.exec(raw))) {
      out += imFormatBackticks(raw.slice(last, m.index));
      out += '<span class="im-cite" data-refs="' + m[1] + '">' + imFormatBackticks(m[2]) + ' <span aria-hidden="true">ⓘ</span></span>';
      last = re.lastIndex;
    }
    out += imFormatBackticks(raw.slice(last));
    return out;
  }
  function imLinkify(text) {
    var re = /(https?:\/\/[^\s]+)/g;
    var out = "", last = 0, m;
    while ((m = re.exec(text))) {
      out += imEsc(text.slice(last, m.index));
      var url = m[1].replace(/[.,;]+$/, "");
      out += '<a href="' + imEsc(url) + '" target="_blank" rel="noopener">' + imEsc(url) + "</a>";
      last = m.index + url.length;
    }
    out += imEsc(text.slice(last));
    return out;
  }
  function imBibText(text) {
    // *word* marks an APA-italicized container title (book/journal name+volume/etc.)
    return text.split(/(\*[^*]+\*)/g).map(function(part) {
      if (part.charAt(0) === "*" && part.charAt(part.length - 1) === "*" && part.length > 1) {
        return "<em>" + imLinkify(part.slice(1, -1)) + "</em>";
      }
      return imLinkify(part);
    }).join("");
  }

  function imTableHtml(b) {

      body.map(function(r) { return "<tr>" + r.map(function(c) { return "<td>" + imFormatInline(c) + "</td>"; }).join("") + "</tr>"; }).join("") +

      else if (b.type === "ol") html += '<ol class="im-block-ol">' + b.items.map(function(t) { return "<li>" + imFormatInline(t) + "</li>"; }).join("") + "</ol>";
      else if (b.type === "code") html += '<button class="im-code-toggle" data-im-code="' + key + '">🔎 Descubre el código</button>' +
        '<div class="im-code-box" id="im-code-' + key + '"><pre>' + imEsc(b.code) + "</pre></div>";
      else if (b.type === "table") html += imRenderTable(b, key, bareTable);

      }).join("") + "</ul>";
      else if (b.type === "docimg") html += '<figure class="im-docimg"><img class="im-docimg-img" src="' + imEsc(b.src) + '" alt="' + imEsc(b.alt || "") + '"' + (b.w ? ' style="width:' + b.w + 'px"' : "") + "></figure>";
      else if (b.type === "biblist") html += '<ul class="im-biblist">' + b.items.map(function(t) { return "<li>" + imBibText(t) + "</li>"; }).join("") + "</ul>";

        var key = cb.closest("[data-im-checklist]").dataset.imChecklist, saved = {};
        try { saved = JSON.parse(localStorage.getItem(key) || "{}"); } catch (e) {}
        if (cb.checked) saved[cb.dataset.imCheck] = 1; else delete saved[cb.dataset.imCheck];
        try { localStorage.setItem(key, JSON.stringify(saved)); } catch (e) {}
      });
    });
    root.querySelectorAll(".im-figure-img").forEach(function(img) {
      img.addEventListener("click", function() {
        imOpenModal(img.alt || "Infografía", '<img src="' + img.src + '" alt="' + img.alt.replace(/"/g, "&quot;") + '">', true);
      });
    });
    root.querySelectorAll("[data-im-img-modal]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var tpl = root.querySelector('[data-im-img-src="' + btn.dataset.imImgModal + '"]');
        if (tpl) imOpenModal(btn.dataset.imImgTitle || "Infografía", tpl.innerHTML, true);
      });
    });
    root.querySelectorAll("[data-im-reveal]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var box = document.getElementById("im-reveal-" + btn.dataset.imReveal);
        box.classList.toggle("open");
      });
    });
    root.querySelectorAll("[data-im-code]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var box = document.getElementById("im-code-" + btn.dataset.imCode);
        var open = box.classList.toggle("open");
        btn.textContent = open ? "🔽 Ocultar el código" : "🔎 Descubre el código";
      });
    });
    root.querySelectorAll("[data-im-table]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var tpl = root.querySelector('[data-im-table-src="' + btn.dataset.imTable + '"]');
        if (tpl) imOpenModal(btn.dataset.imTableTitle, tpl.innerHTML);
      });
    });
    root.querySelectorAll(".im-cite").forEach(function(span) {
      span.addEventListener("click", function() {
        var existing = span.nextElementSibling;
        if (existing && existing.classList && existing.classList.contains("im-cite-pop")) {
          existing.classList.toggle("open");
          return;
        }
        var refs = imRefLookup(data);
        var keys = span.dataset.refs.split(",");
        var pop = document.createElement("div");
        pop.className = "im-cite-pop open";
        pop.innerHTML = keys.map(function(k) { return "<p>" + imBibText(refs[k] || k) + "</p>"; }).join("") +
          '<p><a href="#" data-im-goto-bib="' + keys[0] + '">Ver en Bibliografía →</a></p>';
        span.parentNode.insertBefore(pop, span.nextSibling);
        pop.querySelector("[data-im-goto-bib]").addEventListener("click", function(e) {
          e.preventDefault();
          imShowBib(root, data, this.dataset.imGotoBib);
        });
      });
    });
  }
  function imRailHtml(data, activeIdx) {
    var items = '<button class="im-rail-btn" data-im-rail-home="1"><span class="im-rail-icon">🏠</span><span class="im-rail-label">Índice</span></button>';
    items += data.sections.map(function(sec, i) {
      var icon = IM_ICONS[sec.navTitle] || "📖";
      return '<button class="im-rail-btn' + (activeIdx === i ? " active" : "") + '" data-im-rail-chapter="' + i + '">' +
        '<span class="im-rail-icon">' + icon + '</span><span class="im-rail-label">' + imEsc(sec.navTitle) + "</span></button>";
    }).join("");
    if (data.references && data.references.length) {
      items += '<button class="im-rail-btn' + (activeIdx === "bib" ? " active" : "") + '" data-im-rail-bib="1">' +
        '<span class="im-rail-icon">📖</span><span class="im-rail-label">Bibliografía</span></button>';
    }
    items += '<button class="im-rail-btn im-fs-rail" data-im-fs-rail="1" title="Pantalla completa"><span class="im-rail-icon">⛶</span><span class="im-rail-label">' + (imFsElement() ? "Salir" : "Pantalla") + "</span></button>";
    return '<div class="im-rail">' + items + "</div>";
  }
  function imWireRail(root, data) {
    var homeBtn = root.querySelector("[data-im-rail-home]");
    if (homeBtn) homeBtn.addEventListener("click", function() { imShowIndex(root, data); });
    root.querySelectorAll("[data-im-rail-chapter]").forEach(function(btn) {
      btn.addEventListener("click", function() { imShowChapter(root, data, parseInt(btn.dataset.imRailChapter, 10)); });
    });
    var railBib = root.querySelector("[data-im-rail-bib]");
    if (railBib) railBib.addEventListener("click", function() { imShowBib(root, data, null); });
    var railFs = root.querySelector("[data-im-fs-rail]");
    if (railFs) railFs.addEventListener("click", function() { imToggleFullscreen(root); });
  }
  function imShowBib(root, data, highlightKey) {
    var html = imRailHtml(data, "bib");
    html += '<div class="im-chapter"><h3 class="im-chapter-title">📖 Bibliografía</h3>';
    html += '<h4 class="ref-intro">Referencias en formato APA (7ª edición)</h4>';
    html += '<div class="im-bib-list">' + data.references.map(function(r) {
      var cls = "ref-item im-bib-item" + (r.key === highlightKey ? " im-bib-highlight" : "");
      return '<p class="' + cls + '" id="im-bib-' + r.key + '">' + imBibText(r.text) + "</p>";
    }).join("") + "</div></div>";
    root.innerHTML = html;
    imWireRail(root, data);
    if (highlightKey) {
      var el = document.getElementById("im-bib-" + highlightKey);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }
  function imShowChapter(root, data, idx) {
    var sec = data.sections[idx];
    var icon = IM_ICONS[sec.navTitle] || "📖";
    var html = imRailHtml(data, idx);
    html += '<div class="im-chapter"><h3 class="im-chapter-title">' + icon + " " + imFormatInline(sec.title) + "</h3>";
    if (sec.navTitle === "Qué vas a aprender") html += '<div data-im-checklist="' + imCheckKey(root, idx) + '">' + imRenderChecklist(root, idx, sec.blocks) + "</div>";
    else html += imRenderBlocks(sec.blocks, idx + "-i");
    sec.subsections.forEach(function(sub, j) {
      html += '<div class="im-sub" data-im-sub="' + j + '">' +
        '<button class="im-sub-head"><span class="im-sub-title">' + imFormatInline(sub.title) + '</span><span class="im-sub-arrow">▶</span></button>' +
        '<div class="im-sub-body">' + imRenderBlocks(sub.blocks, idx + "-" + j) + "</div></div>";
    });
    var prev = data.sections[idx - 1], next = data.sections[idx + 1];
    html += '<div class="im-pager">' +
      (prev ? '<button class="im-prev" data-im-goto="' + (idx - 1) + '">← ' + imEsc(prev.navTitle) + "</button>" : "") +
      (next ? '<button class="im-next" data-im-goto="' + (idx + 1) + '">' + imEsc(next.navTitle) + " →</button>"
            : (data.references && data.references.length ? '<button class="im-next" data-im-goto="bib">Bibliografía →</button>' : "")) +
      "</div>";
    html += "</div>";
    root.innerHTML = html;
    imMarkVisited(root, idx);
    imScrollTop(root);
    root.querySelectorAll("[data-im-goto]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        if (btn.dataset.imGoto === "bib") imShowBib(root, data, null);
        else imShowChapter(root, data, parseInt(btn.dataset.imGoto, 10));
      });
    });
    imWireCommon(root, data);
    imWireRail(root, data);
    root.querySelectorAll(".im-sub-head").forEach(function(head) {
      head.addEventListener("click", function() {
        var thisSub = head.parentElement;
        var wasOpen = thisSub.classList.contains("open");
        root.querySelectorAll(".im-sub.open").forEach(function(s) { s.classList.remove("open"); });
        if (!wasOpen) thisSub.classList.add("open");
      });
    });
  }
  function imShowIndex(root, data) {
    var pdf = root.dataset.pdf;
    var visited = imGetVisited(root);
    var nVisited = data.sections.filter(function(s, i) { return visited[i]; }).length;
    var cards = data.sections.map(function(sec, i) {
      var icon = IM_ICONS[sec.navTitle] || "📖";
      return '<button class="im-card' + (visited[i] ? " visited" : "") + '" data-im-chapter="' + i + '" style="animation-delay:' + (i * 0.04) + 's">' +
        '<span class="im-card-icon">' + icon + '</span>' +
        '<span class="im-card-title">' + imEsc(sec.navTitle) + "</span>" +
        (sec.subsections.length ? '<span class="im-card-meta">' + sec.subsections.length + " apartados</span>" : "") +
        "</button>";
    }).join("");
    var bibCard = (data.references && data.references.length)
      ? '<button class="im-card im-card-bib" data-im-bib="1" style="animation-delay:' + (data.sections.length * 0.04) + 's">' +
        '<span class="im-card-icon">📖</span><span class="im-card-title">Bibliografía</span>' +
        '<span class="im-card-meta">' + data.references.length + ' referencias en APA 7ª ed.</span></button>'
      : "";
    var hero = '<div class="im-hero"><div class="im-hero-tools">' +
      '<button class="im-fs-btn">' + imFsLabel() + "</button>" +
      (pdf ? '<a class="im-hero-dl" href="' + imEsc(pdf) + '" download>⬇ Descargar manual en PDF</a>' : "") + "</div>" +
      '<div class="im-hero-kicker">' + imEsc(data.header.kicker) + " · " + imEsc(data.header.title) + "</div>" +
      '<h1 class="im-hero-title">' + imEsc(data.header.subtitle) + "</h1>" +
      (data.header.narrative ? '<p class="im-hero-lema">' + imEsc(data.header.narrative) + "</p>" : "") + "</div>";
    var progress = nVisited ? '<p class="im-progress">Has abierto ' + nVisited + " de " + data.sections.length + " capítulos.</p>" : "";
    root.innerHTML = hero + progress + '<div class="im-grid">' + cards + bibCard + "</div>";
    root.querySelector(".im-fs-btn").addEventListener("click", function() { imToggleFullscreen(root); });
    imScrollTop(root);
    root.querySelectorAll("[data-im-chapter]").forEach(function(btn) {
      btn.addEventListener("click", function() { imShowChapter(root, data, parseInt(btn.dataset.imChapter, 10)); });
    });
    var bibBtn = root.querySelector("[data-im-bib]");
    if (bibBtn) bibBtn.addEventListener("click", function() { imShowBib(root, data, null); });
  }
  function renderInteractiveManual(viewKey) {
    if (imRendered[viewKey]) return;
    imRendered[viewKey] = true;
    var data = IM_DATA[viewKey];
    if (!data) return;
    var root = document.getElementById("im-root-" + viewKey);
    if (!root) return;
    imShowIndex(root, data);
  }

  function wireNav() {
    document.querySelectorAll(".hub-btn").forEach(function(btn) {
      btn.addEventListener("click", function() {
        showView(btn.dataset.view);
        if (btn.dataset.view === "quiz") renderQuizStart();
        if (IM_DATA[btn.dataset.view]) renderInteractiveManual(btn.dataset.view);
      });
    });
    document.querySelectorAll("[data-back]").forEach(function(btn) {
      btn.addEventListener("click", function() { showView(btn.dataset.back); });
    });
  }

  function applyStudentVisibility(config) {
    document.querySelectorAll(".hub-btn[data-type]").forEach(function(btn) {
      var t = btn.dataset.type;
      btn.style.display = config[t] ? "" : "none";
    });
  }

  function applyTeacherHints(config) {
    document.querySelectorAll(".teacher-hint[data-hint]").forEach(function(span) {
      var t = span.dataset.hint;
      var on = !!config[t];
      span.textContent = on ? "visible" : "oculto";
      span.className = "teacher-hint " + (on ? "on" : "off");
    });
    document.querySelectorAll("#teacher-panel input[type=checkbox][data-type]").forEach(function(chk) {
      chk.checked = !!config[chk.dataset.type];
    });
  }

  function fetchConfig() {
    return fetch(LOCAL_CONFIG + "?t=" + Date.now()).then(function(r) { return r.json(); });
  }

  function ghHeaders(token) {
    return { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" };
  }

  function ghGetFile(token) {
    return fetch("https://api.github.com/repos/" + REPO + "/contents/" + GH_CONFIG_PATH, { headers: ghHeaders(token) })
      .then(function(r) {
        if (!r.ok) throw new Error("No se pudo leer el fichero (" + r.status + ")");
        return r.json();
      })
      .then(function(data) {
        configSha = data.sha;
        return JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\n/g, "")))));
      });
  }

  function ghSaveFile(token, configObj) {
    var content = btoa(unescape(encodeURIComponent(JSON.stringify(configObj, null, 2) + "\n")));
    return fetch("https://api.github.com/repos/" + REPO + "/contents/" + GH_CONFIG_PATH, {
      method: "PUT",
      headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders(token)),
      body: JSON.stringify({
        message: "Modo profesora: actualizar visibilidad de materiales (" + GH_CONFIG_PATH + ")",
        content: content,
        sha: configSha
      })
    }).then(function(r) {
      if (!r.ok) return r.text().then(function(t) { throw new Error("Error al guardar (" + r.status + "): " + t); });
      return r.json();
    }).then(function(data) {
      configSha = data.content.sha;
    });
  }

  function getToken() {
    try { return sessionStorage.getItem("gh_pat") || ""; } catch (e) { return ""; }
  }
  function setToken(t) {
    try { sessionStorage.setItem("gh_pat", t); } catch (e) {}
  }

  function setStatus(msg, isError) {
    var el = document.getElementById("teacher-status");
    if (!el) return;
    el.textContent = msg;
    el.style.color = isError ? "#FFB3B3" : "#9FE6A0";
  }

  function initTeacherPanel() {
    document.getElementById("teacher-panel").hidden = false;
    var tokenInput = document.getElementById("gh-token");
    tokenInput.value = getToken();

    document.getElementById("gh-token-save").addEventListener("click", function() {
      setToken(tokenInput.value.trim());
      setStatus(tokenInput.value.trim() ? "Token guardado para esta sesión." : "Token borrado.");
      refreshFromGithub();
    });

    document.querySelectorAll("#teacher-panel input[type=checkbox][data-type]").forEach(function(chk) {
      chk.addEventListener("change", function() {
        var token = getToken();
        if (!token) { setStatus("Pega primero tu token de GitHub.", true); chk.checked = !chk.checked; return; }
        setStatus("Guardando...");
        ghGetFile(token).then(function(current) {
          current[chk.dataset.type] = chk.checked;
          return ghSaveFile(token, current).then(function() { return current; });
        }).then(function(current) {
          applyTeacherHints(current);
          setStatus("Guardado ✓ — el alumnado lo verá en 1-2 minutos.");
        }).catch(function(err) {
          chk.checked = !chk.checked;
          setStatus(err.message, true);
        });
      });
    });

    refreshFromGithub();

    function refreshFromGithub() {
      var token = getToken();
      if (!token) { fetchConfig().then(applyTeacherHints); return; }
      setStatus("Cargando estado actual...");
      ghGetFile(token).then(function(current) {
        applyTeacherHints(current);
        setStatus("Conectado. Puedes marcar/desmarcar materiales.");
      }).catch(function(err) { setStatus(err.message, true); fetchConfig().then(applyTeacherHints); });
    }
  }

  function reveal(teacherMode) {
    isTeacher = teacherMode;
    document.getElementById("content").innerHTML = decodeURIComponent(escape(atob(PAYLOAD)));
    document.getElementById("gate").style.display = "none";
    document.getElementById("page").style.display = "block";
    wireNav();
    if (teacherMode) {
      document.querySelectorAll(".hub-btn[data-type]").forEach(function(btn) { btn.style.display = ""; });
      initTeacherPanel();
    } else {
      fetchConfig().then(applyStudentVisibility);
    }
    try { sessionStorage.setItem(SESSION_KEY, teacherMode ? "teacher" : "1"); } catch (e) {}
  }

  function tryUnlock() {
    var val = document.getElementById("pw").value;
    sha256Hex(val).then(function(hex) {
      if (hex === TEACHER_HASH) { reveal(true); return; }
      if (hex === HASH) {
        fetch(ROOT_CONFIG + "?t=" + Date.now()).then(function(r) { return r.json(); }).then(function(rootCfg) {
          if (rootCfg[TEMA_KEY] === false) {
            document.getElementById("err").textContent = "Este tema no está disponible por el momento.";
          } else {
            reveal(false);
          }
        }).catch(function() { reveal(false); });
        return;
      }
      document.getElementById("err").textContent = "Contraseña incorrecta.";
    });
  }

  document.getElementById("enter").addEventListener("click", tryUnlock);
  document.getElementById("pw").addEventListener("keydown", function(e) { if (e.key === "Enter") tryUnlock(); });

  try {
    var saved = sessionStorage.getItem(SESSION_KEY);
    if (saved === "teacher") reveal(true);
    else if (saved === "1") reveal(false);
  } catch (e) {}
})();
</script>
</body>
</html>
