<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tema 4 — PLN</title>
<style>

:root {
  --azul: #003B5C;
  --azul-d: #00283F;
  --amar: #F4C542;
  --gris: #34484F;
  --claro: #F3F3F4;
  --humo: #9FB1BA;
  --verde: #2E7D32;
  --rojo: #B00020;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: var(--gris); background:#fff; }
a { color: inherit; }

#gate { position:fixed; inset:0; background:var(--azul); display:flex; align-items:center; justify-content:center; padding:24px; z-index:999; }
#gate .box { max-width:380px; width:100%; text-align:center; }
#gate .kicker { color:var(--amar); font-size:12px; font-weight:bold; letter-spacing:2.5px; text-transform:uppercase; margin-bottom:10px; }
#gate h1 { color:#fff; font-size:26px; margin:0 0 10px; }
#gate p { color:var(--humo); font-size:14px; margin:0 0 26px; }
#gate input { width:100%; padding:13px 16px; border-radius:8px; border:none; font-size:15px; font-family:Arial,Helvetica,sans-serif; margin-bottom:14px; outline:2px solid transparent; }
#gate input:focus { outline:2px solid var(--amar); }
#gate button.submit { width:100%; padding:13px 16px; border-radius:8px; border:none; background:var(--amar); color:var(--azul-d); font-size:15px; font-weight:bold; font-family:Arial,Helvetica,sans-serif; cursor:pointer; }
#gate button.submit:hover { filter:brightness(1.06); }
#gate .error { color:#FFB3B3; font-size:13px; margin-top:12px; min-height:18px; }
#page { display:none; }
main { max-width:980px; margin:0 auto; padding:48px clamp(20px,6vw,48px) 60px; }
.kicker { color:var(--amar); font-size:12px; font-weight:bold; letter-spacing:2.5px; text-transform:uppercase; margin-bottom:8px; }
.view > h1 { color:var(--azul); font-size:32px; margin:0 0 34px; }
.hub-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; margin-bottom:30px; }
.hub-btn { display:flex; flex-direction:column; align-items:flex-start; gap:6px; background:var(--claro); border:none; border-radius:12px; padding:26px 22px; cursor:pointer; text-align:left; box-shadow:0 2px 10px rgba(159,177,186,.28); font-family:Arial,Helvetica,sans-serif; position:relative; }
.hub-btn:hover { background:#E9ECEE; }
.hub-icon { font-size:30px; margin-bottom:4px; }
.hub-label { font-size:17px; font-weight:bold; color:var(--azul); }
.hub-desc { font-size:12.5px; color:var(--humo); }
.back-home { font-size:13px; color:var(--humo); text-decoration:none; }
.back-home:hover { color:var(--azul); }
.sub-view h2 { color:var(--azul); font-size:24px; margin:18px 0 4px; }
.work-notice { background:#FFF7DD; border:1.5px solid var(--amar); border-radius:8px; padding:10px 14px; margin:0 0 14px; font-size:13.5px; color:var(--gris); line-height:1.5; }
.sub-view .section-note { font-size:13px; color:var(--humo); margin:0 0 24px; }
.back-btn { background:none; border:1.5px solid var(--azul); color:var(--azul); font-size:13px; font-weight:bold; padding:6px 14px; border-radius:20px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.back-btn:hover { background:var(--azul); color:#fff; }
.dl-big { display:inline-block; background:var(--amar); color:var(--azul-d); font-weight:bold; font-size:14px; text-decoration:none; padding:10px 20px; border-radius:20px; margin-bottom:18px; }
.pdf-frame { width:100%; height:78vh; border:none; border-radius:8px; box-shadow:0 2px 10px rgba(159,177,186,.28); }
.dl-row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
.dl-row .dl-big { margin-bottom:0; }
.dl-alt { background:#fff; color:var(--azul); border:2px solid var(--azul); padding:8px 18px; }
.pdf-frame-xl { width:min(1300px,96vw); margin-left:calc(50% - min(650px,48vw)); height:calc(100vh - 150px); min-height:560px; }
.img-frame { display:block; width:100%; height:auto; border-radius:8px; box-shadow:0 2px 10px rgba(159,177,186,.28); }
.img-caption { font-size:11px; color:var(--humo); text-align:center; margin-top:10px; font-style:italic; }
.img-caption em { font-style:italic; }
.img-caption a { color:var(--humo); }
.ref-intro { color:var(--azul); font-size:16px; margin:0 0 16px; }
.ref-item { font-size:13.5px; color:var(--gris); line-height:1.6; margin:0 0 16px; padding-left:28px; text-indent:-28px; }
.ref-item a { color:var(--azul); word-break:break-all; }
.ref-item em { font-style:italic; }
.ref-img-block { margin:0 0 16px; }
.ref-img-block .ref-img { display:block; width:100%; height:auto; border-radius:8px; box-shadow:0 2px 10px rgba(159,177,186,.28); margin-bottom:8px; }
.ref-img-block .ref-item { padding-left:0; text-indent:0; }
.notice { font-size:12px; color:var(--humo); font-style:italic; margin-top:10px; }
/* quiz */
.quiz-start { background:var(--claro); border-radius:12px; padding:26px; }
.quiz-start p { font-size:14px; margin:0 0 18px; }
.quiz-btn { background:var(--azul); color:#fff; border:none; border-radius:20px; padding:11px 22px; font-size:14px; font-weight:bold; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.quiz-btn:hover { filter:brightness(1.15); }
.quiz-progress { font-size:12px; color:var(--humo); margin-bottom:6px; }
.quiz-q { background:var(--claro); border-radius:12px; padding:24px; margin-bottom:18px; }
.quiz-q h3 { color:var(--azul); font-size:17px; margin:0 0 18px; }
.quiz-opt { display:block; width:100%; text-align:left; background:#fff; border:1.5px solid var(--humo); border-radius:8px; padding:12px 16px; margin-bottom:10px; font-size:14px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; color:var(--gris); }
.quiz-opt:hover { border-color:var(--azul); }
.quiz-opt.correct { border-color:var(--verde); background:#EAF6EB; font-weight:bold; }
.quiz-opt.incorrect { border-color:var(--rojo); background:#FBEAEC; }
.quiz-opt[disabled] { cursor:default; }
.quiz-feedback { font-size:13px; color:var(--gris); background:#fff; border-radius:8px; padding:12px 16px; margin-top:4px; margin-bottom:16px; border-left:3px solid var(--azul); }
.quiz-score { font-size:26px; font-weight:bold; color:var(--azul); margin-bottom:8px; }
.quiz-result { background:var(--claro); border-radius:12px; padding:30px; text-align:center; }
/* interactive manual */
.im-root { margin-top:0; }
.im-view .im-root { width:min(1320px, 96vw); margin-left:calc(50% - min(660px, 48vw)); }
.im-root:fullscreen { width:100%; margin:0; background:#fff; overflow:auto; padding:22px clamp(16px,4vw,56px) 40px; box-sizing:border-box; }
.im-root:-webkit-full-screen { width:100%; margin:0; background:#fff; overflow:auto; padding:22px clamp(16px,4vw,56px) 40px; box-sizing:border-box; }
.im-hero-tools { position:absolute; top:16px; right:16px; display:flex; gap:8px; z-index:1; flex-wrap:wrap; justify-content:flex-end; }
.im-hero-tools .im-hero-dl { position:static; }
.im-fs-btn { background:rgba(255,255,255,.14); color:#fff; border:1.5px solid rgba(255,255,255,.55); border-radius:20px; padding:8px 14px; font-size:12px; font-weight:bold; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.im-fs-btn:hover { background:rgba(255,255,255,.26); }
.im-rail .im-fs-rail { margin-left:auto; }
.im-hero-lema { color:#fff; opacity:.86; font-style:italic; font-size:14.5px; line-height:1.5; margin:12px 0 0; max-width:720px; position:relative; z-index:1; }
.im-card { position:relative; }
.im-card.visited::after { content:"✓ leído"; position:absolute; top:12px; right:12px; font-size:10.5px; font-weight:bold; color:var(--verde); background:#DFF3E0; border-radius:10px; padding:2px 8px; }
.im-progress { font-size:12.5px; color:var(--humo); margin:-8px 0 14px; }
.im-docimg { margin:8px 0 18px; text-align:center; }
.im-docimg img { max-width:100%; max-height:60vh; height:auto; cursor:zoom-in; border-radius:6px; }
.im-biblist { list-style:none; padding:0; margin:0 0 8px; }
.im-biblist li { background:var(--claro); border-left:3px solid var(--amar); border-radius:0 8px 8px 0; padding:10px 14px; margin-bottom:8px; font-size:13.5px; line-height:1.55; color:var(--gris); }
.im-biblist a { color:var(--azul); word-break:break-word; }
.im-check { list-style:none; padding:0; margin:0 0 14px; }
.im-check li { margin-bottom:8px; }
.im-check label { display:flex; gap:10px; align-items:flex-start; cursor:pointer; font-size:14.5px; line-height:1.55; color:var(--gris); background:var(--claro); border-radius:10px; padding:10px 14px; }
.im-check input { margin-top:4px; accent-color:var(--azul); width:16px; height:16px; flex:none; }
.im-check input:checked + span { text-decoration:line-through; text-decoration-color:var(--humo); color:var(--humo); }
.im-check-hint { font-size:12.5px; color:var(--humo); margin:0 0 10px; font-style:italic; }
.im-errorlist li.im-err-reveal { cursor:pointer; }
.im-errorlist li.im-err-reveal .im-error-desc { display:none; }
.im-errorlist li.im-err-reveal.open .im-error-desc { display:block; animation:imFadeIn .2s ease; }
.im-errorlist li.im-err-reveal .im-err-cta { display:inline-block; font-size:11.5px; font-weight:bold; color:var(--azul); margin-top:4px; }
.im-errorlist li.im-err-reveal.open .im-err-cta { display:none; }
.im-pager { display:flex; justify-content:space-between; gap:12px; margin:30px 0 6px; flex-wrap:wrap; }
.im-pager button { background:#fff; border:1.5px solid var(--azul); color:var(--azul); border-radius:22px; padding:9px 16px; font-size:13px; font-weight:bold; cursor:pointer; font-family:Arial,Helvetica,sans-serif; max-width:48%; }
.im-pager button:hover { background:var(--azul); color:#fff; }
.im-pager .im-next { margin-left:auto; }
.im-hero { position:relative; background:linear-gradient(135deg, var(--azul) 0%, var(--azul-d) 100%); border-radius:16px; padding:34px 26px 30px; margin-bottom:22px; overflow:hidden; }
.im-hero::before { content:""; position:absolute; top:-46px; right:-46px; width:190px; height:190px; border-radius:50%; background:rgba(244,197,66,.12); }
.im-hero::after { content:""; position:absolute; bottom:-60px; left:30%; width:160px; height:160px; border-radius:50%; background:rgba(255,255,255,.05); }
.im-hero-dl { position:absolute; top:16px; right:16px; background:var(--amar); color:var(--azul-d); border:none; border-radius:20px; padding:9px 16px; font-size:12px; font-weight:bold; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:6px; font-family:Arial,Helvetica,sans-serif; z-index:1; }
.im-hero-dl:hover { filter:brightness(1.08); }
.im-hero-kicker { color:var(--amar); font-size:12.5px; font-weight:bold; letter-spacing:.4px; margin:0 0 8px; position:relative; z-index:1; }
.im-hero-title { color:#fff; font-size:clamp(21px,3.2vw,30px); line-height:1.28; margin:0; max-width:620px; position:relative; z-index:1; }
@media (max-width:600px) {
  /* Absolute top-right placement overlaps the kicker/title on narrow
     screens (confirmed on a real phone-width viewport) -> drop it back into
     normal flow above them instead, full-width so it's easy to tap. */
  .im-hero-tools { position:static; margin:0 0 14px; justify-content:stretch; }
  .im-hero-tools > * { flex:1; text-align:center; justify-content:center; }
  .im-hero-dl { position:static; display:flex; justify-content:center; width:100%; margin:0 0 16px; box-sizing:border-box; }
}
.im-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
.im-card { text-align:left; background:var(--claro); border:none; border-radius:12px; padding:20px 20px 18px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; box-shadow:0 2px 10px rgba(159,177,186,.28); transition:transform .12s ease, background .12s ease; opacity:0; transform:translateY(10px); animation:imCardIn .35s ease forwards; }
.im-card:hover { background:#E9ECEE; transform:translateY(-2px); }
.im-card.im-card-bib { background:var(--azul); }
.im-card.im-card-bib .im-card-title, .im-card.im-card-bib .im-card-meta { color:#fff; }
.im-card-icon { font-size:24px; }
.im-card-title { display:block; font-size:16px; font-weight:bold; color:var(--azul); line-height:1.3; margin-top:10px; }
.im-card-meta { display:block; font-size:12px; color:var(--humo); margin-top:6px; }
@keyframes imCardIn { to { opacity:1; transform:translateY(0); } }
.im-rail { display:flex; gap:6px; overflow-x:auto; overflow-y:hidden; padding:12px 2px 16px; margin-bottom:18px; border-bottom:1px solid #E3E7E9; scrollbar-width:thin; scrollbar-color:var(--humo) transparent; }
.im-rail::-webkit-scrollbar { height:6px; }
.im-rail::-webkit-scrollbar-thumb { background:var(--humo); border-radius:3px; }
.im-rail::-webkit-scrollbar-track { background:transparent; }
.im-rail-btn { flex:none; display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; cursor:pointer; padding:6px 9px; border-radius:10px; font-family:Arial,Helvetica,sans-serif; opacity:.5; transition:opacity .15s ease, background .15s ease; }
.im-rail-btn:hover { opacity:.85; }
.im-rail-btn.active { opacity:1; background:var(--claro); }
.im-rail-icon { font-size:16px; line-height:1.4; }
.im-rail-label { font-size:9.5px; font-weight:bold; color:var(--gris); max-width:62px; text-align:center; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.im-rail-btn.active .im-rail-label { color:var(--azul); }
.im-chapter { animation:imFadeIn .25s ease; }
@keyframes imFadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
.im-crumb { background:none; border:none; color:var(--humo); font-size:13px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; padding:0; margin-bottom:16px; text-decoration:underline; }
.im-crumb:hover { color:var(--azul); }
.im-chapter-title { color:var(--azul); font-size:23px; margin:0 0 16px; }
.im-block-p { font-size:14.5px; line-height:1.7; color:var(--gris); margin:0 0 14px; }
.im-block-h4 { font-size:15px; font-weight:bold; color:var(--azul); margin:20px 0 8px; }
.im-sub-body .im-block-h4:first-child { margin-top:0; }
.im-block-ul, .im-block-ol { margin:0 0 14px; padding-left:22px; }
.im-block-ul li, .im-block-ol li { font-size:14.5px; line-height:1.65; color:var(--gris); margin-bottom:6px; }
.im-sub { border-top:1px solid #E3E7E9; }
.im-sub:first-child { border-top:none; }
.im-sub-head { width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; background:none; border:none; text-align:left; padding:16px 4px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.im-sub-head:hover .im-sub-title { color:var(--azul-d); }
.im-sub-title { font-size:15.5px; font-weight:bold; color:var(--azul); }
.im-sub-arrow { color:var(--humo); font-size:13px; transition:transform .15s ease; flex:none; }
.im-sub.open .im-sub-arrow { transform:rotate(90deg); }
.im-sub-body { max-height:0; overflow:hidden; padding:0 4px; transition:max-height .3s ease; }
.im-sub.open .im-sub-body { max-height:none; padding-bottom:14px; }
.im-code-toggle { display:inline-flex; align-items:center; gap:6px; background:#fff; border:1.5px dashed var(--humo); color:var(--azul); font-size:12.5px; font-weight:bold; border-radius:20px; padding:7px 14px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; margin:2px 0 14px; }
.im-code-toggle:hover { border-color:var(--azul); }
.im-code-box { display:none; background:#F2F4F5; border-radius:8px; padding:14px 16px; margin:0 0 14px; overflow-x:auto; animation:imFadeIn .2s ease; }
.im-code-box.open { display:block; }
.im-code-box pre { margin:0; font-family:"Courier New",monospace; font-size:13px; line-height:1.55; color:#1c2a30; white-space:pre-wrap; word-break:break-word; }
.im-table-toggle { display:inline-flex; align-items:center; gap:6px; background:#fff; border:1.5px solid var(--azul); color:var(--azul); font-size:12.5px; font-weight:bold; border-radius:20px; padding:7px 14px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; margin:2px 0 14px; }
.im-table-toggle:hover { background:var(--azul); color:#fff; }
.im-table-bare { overflow-x:auto; margin:0 0 16px; border-radius:8px; box-shadow:0 2px 10px rgba(159,177,186,.28); scrollbar-width:thin; scrollbar-color:var(--humo) transparent; }
.im-table-bare::-webkit-scrollbar, .im-code-box::-webkit-scrollbar, .im-modal table::-webkit-scrollbar { height:6px; }
.im-table-bare::-webkit-scrollbar-thumb, .im-code-box::-webkit-scrollbar-thumb { background:var(--humo); border-radius:3px; }
.im-table-bare::-webkit-scrollbar-track, .im-code-box::-webkit-scrollbar-track { background:transparent; }
.im-table-bare table, .im-modal table { border-collapse:collapse; width:100%; font-size:13px; }
.im-table-bare th, .im-modal th { background:var(--azul); color:#fff; text-align:left; padding:9px 12px; font-size:12.5px; }
.im-table-bare td, .im-modal td { padding:9px 12px; border-bottom:1px solid #E3E7E9; color:var(--gris); }
.im-table-bare tr:nth-child(even) td, .im-modal tr:nth-child(even) td { background:var(--claro); }
.im-modal-overlay { position:fixed; inset:0; background:rgba(10,20,26,.55); display:flex; align-items:center; justify-content:center; padding:5vh 4vw; z-index:500; animation:imFadeIn .15s ease; }
.im-modal { background:#fff; border-radius:14px; max-width:760px; width:100%; max-height:90vh; min-width:0; display:flex; flex-direction:column; box-shadow:0 12px 40px rgba(0,0,0,.3); }
.im-modal.im-modal-wide { max-width:min(1500px, 96vw); }
.im-modal-body img { display:block; max-width:100%; max-height:72vh; width:auto; height:auto; margin:0 auto; border-radius:8px; object-fit:contain; }
.im-modal-head { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid #E3E7E9; flex:none; }
.im-modal-head h4 { margin:0; color:var(--azul); font-size:15.5px; }
.im-modal-close { background:var(--claro); border:none; width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:14px; color:var(--gris); flex:none; }
.im-modal-close:hover { background:#E3E7E9; }
.im-modal-body { flex:1; min-height:0; min-width:0; overflow:auto; padding:16px 20px 20px; text-align:center; }
.im-modal-body table { min-width:max-content; }
.im-figure { margin:6px 0 20px; }
.im-figure-img { display:block; width:auto; max-width:100%; height:auto; max-height:82vh; margin:0 auto; border-radius:10px; box-shadow:0 4px 16px rgba(159,177,186,.35); cursor:zoom-in; }
.im-figure-caption { font-size:12px; color:var(--humo); text-align:center; margin-top:8px; font-style:italic; }
@media (min-width:860px) {
  .im-figure { width:min(1300px, 92vw); margin-left:calc(50% - min(650px, 46vw)); margin-right:calc(50% - min(650px, 46vw)); }
}
.im-img-btn { display:flex; align-items:center; gap:14px; width:100%; max-width:420px; background:var(--claro); border:none; border-radius:14px; padding:10px; margin:4px 0 20px; cursor:pointer; text-align:left; font-family:Arial,Helvetica,sans-serif; box-shadow:0 2px 10px rgba(159,177,186,.28); transition:transform .12s ease, background .12s ease; }
.im-img-btn:hover { background:#E9ECEE; transform:translateY(-2px); }
.im-img-btn-thumb { flex:none; width:64px; height:64px; border-radius:10px; background-size:cover; background-position:center; position:relative; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
.im-img-btn-thumb::after { content:"🔍"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:18px; background:rgba(11,44,66,.35); border-radius:10px; }
.im-img-btn-text { display:flex; flex-direction:column; gap:2px; }
.im-img-btn-label { font-size:13.5px; font-weight:bold; color:var(--azul); }
.im-img-btn-sub { font-size:11.5px; color:var(--humo); }
.im-reveal-toggle { display:inline-flex; align-items:center; gap:6px; background:#fff; border:1.5px dashed var(--humo); color:var(--azul); font-size:12.5px; font-weight:bold; border-radius:20px; padding:7px 14px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; margin:2px 0 14px; }
.im-reveal-toggle:hover { border-color:var(--azul); }
.im-reveal-box { display:none; margin:0 0 16px; }
.im-reveal-box.open { display:block; animation:imFadeIn .25s ease; }
.im-reveal-box img { display:block; width:100%; border-radius:10px; box-shadow:0 4px 16px rgba(159,177,186,.35); }
.im-errorlist { list-style:none; padding:0; margin:0 0 6px; }
.im-errorlist li { background:var(--claro); border-left:3px solid var(--rojo); border-radius:0 8px 8px 0; padding:12px 16px; margin-bottom:10px; }
.im-errorlist .im-error-term { display:block; font-weight:bold; color:var(--azul); font-size:14px; margin-bottom:4px; }
.im-errorlist .im-error-desc { font-size:13.5px; color:var(--gris); line-height:1.6; }
.im-cite { color:var(--azul); font-weight:bold; cursor:pointer; border-bottom:1.5px dotted var(--azul); white-space:normal; }
.im-cite:hover { color:var(--azul-d); }
.im-cite-pop { display:none; background:var(--azul-d); color:#fff; border-radius:8px; padding:12px 16px; font-size:12.5px; line-height:1.6; margin:6px 0 14px; }
.im-cite-pop.open { display:block; }
.im-cite-pop p { margin:0 0 8px; }
.im-cite-pop p:last-child { margin-bottom:0; }
.im-cite-pop a { color:var(--amar); }
.im-bib-list { margin-top:6px; }
.im-bib-item.im-bib-highlight { background:#FDF1C7; border-radius:8px; padding:10px 14px; margin-left:-14px; margin-right:-14px; }
code.im-inline { background:#F2F4F5; padding:1px 6px; border-radius:4px; font-family:"Courier New",monospace; font-size:.93em; }
/* teacher panel */
.teacher-banner { background:var(--azul-d); color:#fff; border-radius:12px; padding:18px 22px; margin-bottom:24px; }
.teacher-banner strong { color: var(--amar); }
.teacher-banner p { font-size:13px; margin:6px 0 0; color:var(--humo); }
.teacher-token-row { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
.teacher-token-row input { flex:1; min-width:220px; padding:9px 12px; border-radius:8px; border:none; font-size:13px; font-family:Arial,Helvetica,sans-serif; }
.teacher-token-row button { background:var(--amar); color:var(--azul-d); border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:bold; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.teacher-status { font-size:12px; margin-top:10px; min-height:16px; }
.teacher-toggle-list { list-style:none; padding:0; margin:16px 0 0; display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; }
.teacher-toggle-list li { background:rgba(255,255,255,.08); border-radius:8px; padding:10px 14px; display:flex; align-items:center; gap:10px; font-size:13px; }
.teacher-toggle-list input { width:18px; height:18px; }
.hub-btn .teacher-hint { position:absolute; top:10px; right:12px; font-size:10px; font-weight:bold; padding:2px 8px; border-radius:10px; }
.hub-btn .teacher-hint.on { background:#DFF3E0; color:var(--verde); }
.hub-btn .teacher-hint.off { background:#FBEAEC; color:var(--rojo); }
footer { text-align:center; padding:26px clamp(20px,6vw,48px) 40px; font-size:11px; color:var(--humo); font-style:italic; }
</style>
</head>

  var QUIZ_MANUAL = [{"question":"En un proyecto de revisión lingüística donde se comparan varias versiones de un mismo documento institucional redactadas por distintos proveedores, ¿cuál es la característica principal de los llamados 'textos paralelos monolingües'?","answerOptions":[{"text":"Son versiones en la misma lengua que representan un mismo contenido o función comunicativa.","isCorrect":true,"rationale":"El concepto se refiere a la comparación de diferentes variantes (como las de distintos proveedores) de un mismo documento en español."},{"text":"Son traducciones directas de una lengua origen a una lengua meta distinta.","isCorrect":false,"rationale":"Eso describe un corpus paralelo tradicional, no la variante monolingüe utilizada para comparar versiones en el mismo idioma."},{"text":"Son textos de diferentes géneros literarios que comparten un mismo autor.","isCorrect":false,"rationale":"El paralelismo en este caso es de contenido y función, no necesariamente de autoría o género literario diverso."},{"text":"Son textos en lenguas diferentes que no guardan relación de traducción entre sí.","isCorrect":false,"rationale":"Esto se ajustaría más a la definición de un corpus comparable multilingüe, no paralelo monolingüe."}],"hint":"Observa el término «monolingüe» y cómo se aplican a la comparación de versiones de un mismo documento."},{"question":"Al leer archivos en Python para el procesamiento de textos en español, ¿por qué es fundamental especificar `encoding=\"utf-8\"`?","answerOptions":[{"text":"Para asegurar la correcta interpretación de caracteres como tildes y eñes.","isCorrect":true,"rationale":"UTF-8 es el estándar que permite representar correctamente los caracteres especiales del español, evitando errores de lectura."},{"text":"Para comprimir el tamaño del archivo de texto en la memoria RAM.","isCorrect":false,"rationale":"La codificación define cómo se representan los caracteres, no es un método de compresión de datos."},{"text":"Para convertir automáticamente el texto de formato `.pdf` a `.txt`.","isCorrect":false,"rationale":"La función 'open' con codificación no realiza conversiones de formato de archivo, solo lee el flujo de bytes del archivo plano."},{"text":"Para que Python pueda ejecutar funciones matemáticas complejas sobre el texto.","isCorrect":false,"rationale":"La codificación de caracteres no tiene relación con la capacidad de ejecución de funciones lógicas o matemáticas del lenguaje."}],"hint":"Piensa en las dificultades que presentan los caracteres especiales del español si se usa una codificación por defecto errónea."},{"question":"¿Qué limitación principal presenta el uso de `texto.split(\".\")` para segmentar oraciones en español?","answerOptions":[{"text":"No distingue entre un punto final de oración y un punto de abreviatura o cifra.","isCorrect":true,"rationale":"El punto se usa en abreviaturas (Sr.), decimales o siglas, lo que genera cortes incorrectos en unidades que no son oraciones."},{"text":"Produce un error de sintaxis si el texto contiene más de diez puntos.","isCorrect":false,"rationale":"Python puede manejar cualquier cantidad de separadores; el límite no es técnico, sino lingüístico."},{"text":"Elimina automáticamente todas las palabras que están escritas justo junto al punto.","isCorrect":false,"rationale":"El método 'split' solo elimina el carácter separador, conservando el resto de las palabras intactas."},{"text":"Solo funciona si el texto está escrito íntegramente en letras mayúsculas.","isCorrect":false,"rationale":"La segmentación por caracteres es independiente de la capitalización de las letras en la cadena de texto."}],"hint":"Considera otros usos del punto en la escritura normal que no implican el cierre de una idea completa."},{"question":"En el análisis de frecuencias, ¿qué ventaja aporta aplicar `.lower()` antes de usar `.count()`?","answerOptions":[{"text":"Agrupa variantes de capitalización para contar 'Empresa' e 'empresa' como la misma unidad.","isCorrect":true,"rationale":"Al normalizar a minúsculas, se ignoran las diferencias de mayúsculas iniciales, facilitando el recuento léxico global."},{"text":"Permite que Python cuente palabras de diferentes idiomas simultáneamente.","isCorrect":false,"rationale":"La normalización a minúsculas solo afecta a la grafía de los caracteres, no a la detección del idioma."},{"text":"Elimina los espacios en blanco innecesarios al final de las oraciones.","isCorrect":false,"rationale":"La eliminación de espacios se realiza con el método 'strip', mientras que 'lower' solo afecta a la caja de las letras."},{"text":"Identifica automáticamente los sinónimos del término buscado.","isCorrect":false,"rationale":"El método 'count' busca secuencias de caracteres exactas y no posee conocimiento semántico de la lengua."}],"hint":"Recuerda que para Python, 'A' y 'a' son caracteres totalmente distintos si no se normalizan."},{"question":"La expresión regular `r\"[.,][^\\\\s]\"` se utiliza específicamente para localizar:","answerOptions":[{"text":"La ausencia de un espacio después de un signo de puntuación.","isCorrect":true,"rationale":"El patrón detecta un punto o coma seguido inmediatamente de un carácter que no es un espacio en blanco."},{"text":"Cualquier punto o coma que esté al final de un párrafo.","isCorrect":false,"rationale":"El patrón busca específicamente un carácter que NO sea un espacio después del signo, no el final de un bloque."},{"text":"Palabras que contienen un punto o coma en su interior, como direcciones web.","isCorrect":false,"rationale":"Aunque podría detectarlas, su propósito en revisión lingüística es hallar errores tipográficos de espaciado."},{"text":"Todos los espacios dobles que aparecen entre dos oraciones.","isCorrect":false,"rationale":"Para los dobles espacios se buscaría una secuencia de dos caracteres de espacio, no signos de puntuación."}],"hint":"Analiza el significado del metacarácter `[^\\\\s]`, que representa la negación de un espacio en blanco."},{"question":"Desde un punto de vista metodológico, ¿cuál es la diferencia entre un indicio automático y un diagnóstico lingüístico?","answerOptions":[{"text":"El indicio es una señal mecánica localizada por el código; el diagnóstico es la interpretación profesional.","isCorrect":true,"rationale":"La máquina localiza patrones sospechosos (indicios), pero solo la lingüista decide si es un error basándose en el contexto."},{"text":"No hay diferencia; si el programa detecta un patrón, es un error confirmado.","isCorrect":false,"rationale":"Las reglas automáticas pueden generar falsos positivos que requieren validación humana experta."},{"text":"El indicio se refiere a errores gramaticales y el diagnóstico a errores de formato.","isCorrect":false,"rationale":"Ambos términos se aplican a cualquier tipo de fenómeno detectado, independientemente de su categoría lingüística o formal."},{"text":"El diagnóstico es lo que hace Python de forma automática y el indicio es lo que entrega finalmente el cliente.","isCorrect":false,"rationale":"Es al revés: la herramienta automatizada provee indicios y la especialista realiza el diagnóstico."}],"hint":"Considera quién tiene la responsabilidad final de decidir si un cambio es necesario."},{"question":"¿Qué ocurre si una función de revisión lingüística en Python termina sus operaciones sin una instrucción `return`?","answerOptions":[{"text":"La función devuelve automáticamente el valor `None` y el resultado no se puede guardar en una variable.","isCorrect":true,"rationale":"Sin 'return', la función ejecuta sus procesos pero no entrega nada al flujo principal del programa para su uso posterior."},{"text":"El programa se detiene y muestra un error de tipo 'MemoryLeak' que interrumpe toda la ejecución.","isCorrect":false,"rationale":"La falta de un 'return' no detiene el programa con un error grave; simplemente la función no devuelve datos."},{"text":"La función borra el archivo de texto original para liberar espacio.","isCorrect":false,"rationale":"Python nunca realiza acciones destructivas sobre archivos a menos que se programen para ello."},{"text":"La función imprime automáticamente todos los resultados en la consola por defecto.","isCorrect":false,"rationale":"Imprimir y devolver son acciones distintas; si no hay 'print' ni 'return', el resultado se pierde en el ámbito local."}],"hint":"Diferencia entre ver un resultado en la pantalla y poder procesar ese dato en otra parte del código."},{"question":"¿Por qué se consideran «candidatos a revisión» las estructuras de `a + infinitivo` detectadas por un patrón como `r\"(\\\\w+)\\\\s+a\\\\s+(\\\\w+(ar|er|ir))\\\\b\"`?","answerOptions":[{"text":"Porque el patrón no puede distinguir entre usos legítimos como perífrasis y posibles galicismos.","isCorrect":true,"rationale":"Muchas estructuras correctas (empezó a leer) comparten la misma forma superficial que los usos desaconsejados (temas a tratar)."},{"text":"Porque la preposición 'a' siempre es incorrecta antes de cualquier verbo en infinitivo en español.","isCorrect":false,"rationale":"Existen numerosas construcciones en español que requieren obligatoriamente la preposición 'a' antes del infinitivo."},{"text":"Porque Python solo puede detectar verbos que terminen en '-ar', ignorando '-er' e '-ir'.","isCorrect":false,"rationale":"El patrón de la expresión regular incluye las tres terminaciones del infinitivo español."},{"text":"Porque esas estructuras solo aparecen en textos traducidos del inglés, nunca del francés.","isCorrect":false,"rationale":"Estas estructuras (a + infinitivo) suelen analizarse como posibles calcos del francés, no específicamente del inglés."}],"hint":"Reflexiona sobre si la forma externa de una frase es suficiente para juzgar su corrección gramatical sin conocer su función sintáctica."},{"question":"En el desarrollo de un informe de revisión, ¿cuál es la utilidad de la función `enumerate(lista, start=1)`?","answerOptions":[{"text":"Permite recorrer los elementos obteniendo simultáneamente un índice legible para humanos.","isCorrect":true,"rationale":"Al usar 'start=1', facilitamos la creación de informes donde las versiones u oraciones se numeran desde el 1 en lugar del 0 de Python."},{"text":"Ordena alfabéticamente los textos de la lista completa antes de empezar a procesarlos uno por uno.","isCorrect":false,"rationale":"La función 'enumerate' no altera el orden de los elementos; solo genera un contador asociado a ellos."},{"text":"Multiplica el contenido del texto por el número de versión indicado.","isCorrect":false,"rationale":"La función no realiza operaciones aritméticas sobre el contenido del texto, solo gestiona el conteo de iteraciones."},{"text":"Filtra la lista para eliminar los elementos que no contengan números.","isCorrect":false,"rationale":"No es una función de filtrado; actúa sobre todos los elementos de la lista proporcionando un índice correlativo."}],"hint":"Piensa en cómo facilitarías la lectura de un informe técnico a una persona que no sabe programación."},{"question":"Al buscar gerundios con expresiones regulares para revisión, ¿cuál es la ventaja de capturar palabras anteriores y posteriores al gerundio?","answerOptions":[{"text":"Proporciona el contexto necesario para que el lingüista evalúe la corrección del uso detectado.","isCorrect":true,"rationale":"Sin el contexto (las palabras de alrededor), es imposible decidir si un gerundio es correcto o constituye un error de estilo."},{"text":"Permite que Python aprenda automáticamente si el gerundio es de simultaneidad o de posterioridad.","isCorrect":false,"rationale":"Las reglas de expresiones regulares no poseen capacidad de aprendizaje semántico ni de análisis lógico-temporal autónomo."},{"text":"Aumenta la velocidad de ejecución del programa al reducir el número de búsquedas.","isCorrect":false,"rationale":"Capturar más información suele aumentar ligeramente el tiempo de procesamiento, no reducirlo."},{"text":"Garantiza que el gerundio se convierta automáticamente en un participio si es incorrecto.","isCorrect":false,"rationale":"La detección de patrones no implica la corrección o sustitución automática del texto a menos que se use una función de reemplazo."}],"hint":"Recuerda que la decisión final de revisión depende de la relación del gerundio con el resto de la frase."}];
  var QUIZ_CUADERNO = [{"question":"En un proyecto de revisión lingüística donde se comparan varias versiones de un mismo documento institucional redactadas por distintos proveedores, ¿qué define a los llamados 'textos paralelos monolingües'?","answerOptions":[{"text":"Dos o más versiones de un mismo contenido redactadas en el mismo idioma por diferentes traductores o agencias.","isCorrect":true,"rationale":"El texto define específicamente el trabajo con versiones en un mismo idioma para evaluar la coherencia entre distintos proveedores de traducción."},{"text":"Documentos oficiales de las Naciones Unidas traducidos a múltiples lenguas para mantener la coherencia internacional.","isCorrect":false,"rationale":"Aunque se mencionan estas instituciones, el término 'monolingüe' se refiere específicamente a versiones en una sola lengua, no a la traducción multilingüe general."},{"text":"Glosarios técnicos que comparan términos de un idioma origen con sus equivalentes en un idioma destino.","isCorrect":false,"rationale":"Los glosarios son herramientas resultantes del análisis, pero no definen la naturaleza de los textos paralelos monolingües."},{"text":"Un corpus de textos que incluye únicamente el idioma original antes de ser enviado a traducción.","isCorrect":false,"rationale":"Los textos paralelos requieren al menos dos versiones comparables del mismo contenido, no una versión única."}],"hint":"Piensa en el significado del término 'monolingüe' y quiénes producen esas versiones en un entorno profesional."},{"question":"¿Cuál es una de las razones principales por las que la segmentación por oraciones mejora la calidad del procesamiento automático de textos?","answerOptions":[{"text":"Permite que algoritmos de PLN realicen tareas como el etiquetado morfosintáctico o el análisis sintáctico con mayor precisión.","isCorrect":true,"rationale":"La segmentación divide el texto en unidades fundamentales manejables que son necesarias para que las herramientas de procesamiento identifiquen estructuras lingüísticas."},{"text":"Elimina automáticamente los dobles espacios y los errores de puntuación presentes en el documento original.","isCorrect":false,"rationale":"La segmentación detecta límites de oraciones basándose en la puntuación, pero no corrige automáticamente los errores de formato por sí sola."},{"text":"Reduce drásticamente el espacio de almacenamiento necesario para guardar corpus de gran volumen en disco, algo especialmente relevante en proyectos institucionales.","isCorrect":false,"rationale":"El objetivo de la segmentación es el análisis lingüístico y la organización lógica, no la optimización del almacenamiento físico de los archivos."},{"text":"Sustituye la necesidad de utilizar expresiones regulares para detectar patrones como gerundios o galicismos.","isCorrect":false,"rationale":"La segmentación es un paso previo que facilita el uso de expresiones regulares, no una tecnología que las reemplace."}],"hint":"Recuerda que la oración es considerada la unidad básica para analizar fenómenos como la sintaxis o la semántica."},{"question":"En el análisis de frecuencia de palabras con Python, ¿qué función cumple el método `.lower()`?","answerOptions":[{"text":"Normaliza el texto a minúsculas para que el conteo no distinga entre palabras con diferentes cajas (ej. 'Empresa' vs 'empresa').","isCorrect":true,"rationale":"La normalización es un paso fundamental en PLN para asegurar que las variaciones de capitalización no resulten en conteos inexactos de un mismo término."},{"text":"Detecta y marca automáticamente los términos que han sido mal escritos por falta de tildes.","isCorrect":false,"rationale":"Este método solo afecta a la caja (mayúsculas/minúsculas) de los caracteres y no realiza corrección ortográfica o de acentuación."},{"text":"Identifica las palabras que se encuentran al final de una oración justo antes de un punto o signo de cierre.","isCorrect":false,"rationale":"La identificación de la posición de una palabra requiere métodos de indexación o búsqueda de patrones, no simplemente el cambio a minúsculas."},{"text":"Elimina los espacios en blanco innecesarios al principio y al final de cada cadena de texto.","isCorrect":false,"rationale":"La eliminación de espacios en blanco en los extremos suele realizarse con el método `.strip()`, no con `.lower()`."}],"hint":"Considera cómo Python trata por defecto las cadenas de texto según si tienen letras mayúsculas o minúsculas."},{"question":"Al utilizar la expresión regular `r'[.,][^\\s]'`, ¿qué tipo de error se busca detectar en los textos?","answerOptions":[{"text":"La ausencia de un espacio obligatorio después de un punto o una coma.","isCorrect":true,"rationale":"El patrón busca un signo de puntuación (punto o coma) seguido de cualquier carácter que no sea un espacio en blanco."},{"text":"La presencia de dos o más espacios seguidos entre palabras dentro de una misma oración.","isCorrect":false,"rationale":"Para detectar dobles espacios se buscaría una cadena fija de dos espacios (`\"  \"`), no una combinación de puntuación."},{"text":"El uso incorrecto de la coma antes de la conjunción 'y' en enumeraciones simples.","isCorrect":false,"rationale":"Este patrón detecta problemas de espaciado tipográfico general, no reglas sintácticas específicas sobre el uso de la coma."},{"text":"Palabras que han sido separadas incorrectamente por un guion al final de una línea.","isCorrect":false,"rationale":"La expresión regular mencionada no incluye el guion como carácter de búsqueda ni analiza saltos de línea."}],"hint":"Fíjate en los caracteres dentro de los corchetes y en lo que representa el símbolo `^` seguido de `\\s`."},{"question":"¿Por qué puede ser útil que un lingüista aprenda a definir funciones (`def`) al preparar informes de revisión con Python?","answerOptions":[{"text":"Para organizar el código en tareas separadas y facilitar la reutilización del análisis en otros documentos futuros.","isCorrect":true,"rationale":"Las funciones actúan como cajas de herramientas que permiten ejecutar procesos repetitivos de forma limpia y eficiente sin reescribir código."},{"text":"Porque las funciones son el único método que permite exportar resultados automáticamente a formato Excel.","isCorrect":false,"rationale":"Aunque las funciones pueden contener lógica para exportar datos, existen otras formas de hacerlo en Python sin necesidad de definir funciones personalizadas."},{"text":"Para garantizar que el sistema de traducción automática aprenda nuevas reglas gramaticales sin intervención humana.","isCorrect":false,"rationale":"La definición de funciones en un cuaderno de análisis es para la organización del código del analista, no para el aprendizaje autónomo de una IA."},{"text":"Porque el uso de funciones elimina la necesidad de conocer expresiones regulares complejas.","isCorrect":false,"rationale":"Las funciones suelen contener expresiones regulares dentro de su lógica; no son conceptos que se excluyan entre sí."}],"hint":"Recuerda la analogía de las 'cajas ordenadas' frente a tener las herramientas sueltas por la mesa."},{"question":"¿Qué limitación presenta la detección automática de gerundios basada en patrones como `r'\\w+(ando|iendo|yendo)'`?","answerOptions":[{"text":"Identifica la forma verbal pero no puede determinar si su uso es gramaticalmente correcto o incorrecto sin análisis de contexto.","isCorrect":true,"rationale":"El código detecta la terminación, pero discernir entre un gerundio de modo (correcto) y uno de posterioridad (incorrecto) requiere juicio humano o análisis semántico profundo."},{"text":"Es incapaz de encontrar gerundios que pertenezcan a verbos de la tercera conjugación (-ir).","isCorrect":false,"rationale":"Los gerundios de verbos en -ir terminan en -iendo o -yendo, ambos incluidos en el patrón de búsqueda."},{"text":"Solo funciona si el texto ha sido previamente traducido por un motor de inteligencia artificial.","isCorrect":false,"rationale":"El análisis de patrones funciona sobre cualquier texto plano, independientemente de su origen humano o automático."},{"text":"No permite extraer la palabra anterior o posterior para ver el contexto del gerundio detectado en el texto.","isCorrect":false,"rationale":"Es posible capturar palabras circundantes ajustando el patrón o los índices de los resultados encontrados."}],"hint":"Piensa en la diferencia entre reconocer una palabra por su terminación y entender su función dentro de la oración."},{"question":"En el ámbito empresarial, ¿para qué se utiliza principalmente la comparación automática entre términos como 'empresa' o 'compañía'?","answerOptions":[{"text":"Para asegurar la coherencia terminológica y el respeto a la imagen de marca (branding).","isCorrect":true,"rationale":"Mantener una terminología estable en todas las comunicaciones es vital para la claridad institucional y la identidad corporativa."},{"text":"Para determinar cuál de los dos términos tiene un origen etimológico más prestigioso.","isCorrect":false,"rationale":"La comparación automática busca patrones de uso y consistencia, no realiza análisis lingüístico histórico o etimológico."},{"text":"Para reducir el coste de la traducción eliminando sinónimos innecesarios del documento fuente.","isCorrect":false,"rationale":"Aunque la consistencia puede ayudar, el análisis automático aquí descrito se aplica principalmente a la revisión de textos ya producidos."},{"text":"Para sustituir los diccionarios de sinónimos tradicionales por una tabla de frecuencias dinámica.","isCorrect":false,"rationale":"El objetivo es evaluar cómo se han usado los términos en versiones paralelas, no crear una herramienta de referencia léxica general."}],"hint":"Relaciona la consistencia en el uso de palabras clave con la imagen que una empresa proyecta al exterior."},{"question":"¿A qué se refiere el concepto de \"falso positivo\" en el contexto de la revisión lingüística automatizada?","answerOptions":[{"text":"A una estructura marcada por el sistema como error que, tras la revisión humana, resulta ser correcta en su contexto.","isCorrect":true,"rationale":"Por ejemplo, detectar 'a + infinitivo' puede señalar un galicismo erróneo o una estructura válida como 'tendencia a mejorar', siendo este último un falso positivo."},{"text":"A un error gramatical real que el programa de análisis no fue capaz de detectar durante la revisión automática.","isCorrect":false,"rationale":"Eso se denomina falso negativo; el programa 'cree' que no hay error cuando sí lo hay."},{"text":"A un código de Python que se ejecuta correctamente pero produce resultados numéricos negativos e inesperados.","isCorrect":false,"rationale":"Un falso positivo es un concepto de evaluación de precisión lingüística, no un tipo de resultado matemático o error de programación."},{"text":"A la detección de un doble espacio que el autor del texto introdujo intencionadamente por motivos puramente estéticos o de formato.","isCorrect":false,"rationale":"Si el sistema detecta un doble espacio, la detección es correcta (positivo); el hecho de que sea intencionado es una cuestión de estilo, no de error de detección."}],"hint":"Piensa en un caso donde el sistema aplica una regla de forma demasiado rígida y se equivoca al juzgar la calidad."},{"question":"Al reportar errores de espaciado detectados automáticamente, ¿qué ventaja tiene mostrar un fragmento de contexto (10-20 caracteres) alrededor de cada error?","answerOptions":[{"text":"Permite al lingüista localizar y validar rápidamente el error sin tener que buscar manualmente en todo el documento original.","isCorrect":true,"rationale":"Visualizar el texto circundante permite confirmar de inmediato si se trata de un error tipográfico real o una excepción justificada."},{"text":"Sirve para que el sistema de Python aprenda automáticamente a corregir el error en la siguiente ejecución.","isCorrect":false,"rationale":"El código proporcionado en el cuaderno es de análisis y visualización, no implementa aprendizaje automático para corrección autónoma."},{"text":"Reduce la cantidad de memoria RAM utilizada por Google Colab durante el procesamiento del texto.","isCorrect":false,"rationale":"Imprimir fragmentos adicionales de texto en realidad consume una cantidad mínima y despreciable de recursos adicionales."},{"text":"Ayuda a ocultar información confidencial del texto que no debería aparecer en el informe final entregado al cliente.","isCorrect":false,"rationale":"Al contrario, mostrar fragmentos del texto podría revelar contenido; su propósito es estrictamente facilitar la revisión manual."}],"hint":"Recuerda ejemplos como '...temporales.Utilizando métodos...' y para qué sirven al ojo humano."},{"question":"¿Cuál es la función fundamental de la sentencia `return` dentro de una función de Python?","answerOptions":[{"text":"Devolver un valor o resultado generado dentro de la función para que pueda ser utilizado por otras partes del programa.","isCorrect":true,"rationale":"Sin el `return`, los cálculos realizados dentro de la función se pierden al finalizar su ejecución y no pueden ser asignados a variables externas."},{"text":"Imprimir el resultado final en la consola para que el usuario pueda leerlo inmediatamente.","isCorrect":false,"rationale":"La impresión en consola se realiza con `print()`; el `return` se encarga de la transferencia de datos entre bloques de código."},{"text":"Reiniciar la función desde el principio si los datos de entrada son incorrectos, generando así un resultado completamente nuevo.","isCorrect":false,"rationale":"El `return` finaliza la ejecución de la función y entrega un valor; no funciona como un bucle de reinicio."},{"text":"Validar si el texto cumple con las normas ortográficas de la RAE antes de procesarlo.","isCorrect":false,"rationale":"Python es un lenguaje de programación general; las reglas lingüísticas deben programarse aparte, y el `return` solo devuelve el resultado de dicha lógica."}],"hint":"Usa la analogía de la calculadora: una cosa es hacer la cuenta y otra es que el resultado aparezca en el 'ticket' para usarlo después."}];
  var IM_DATA = {"manual_interactivo":{"header":{"kicker":"Tema 4.","title":"Análisis automático de textos para revisión lingüística","subtitle":"Informe automático de divergencias en textos paralelos monolingües","meta":"Material teórico | Programación para PLN | Universidad Pontificia Comillas","narrative":"Revisar dos versiones de un mismo texto ya no consiste solo en leer con atención: consiste en saber convertir el texto en datos, detectar indicios y devolver al equipo humano una lista razonada de lugares que merecen revisión. En esta unidad, la revisión lingüística se plantea como una tarea profesional híbrida: el criterio sigue siendo humano, pero Python ayuda a localizar de forma rápida patrones repetitivos, incoherencias terminológicas y señales formales que pueden pasar inadvertidas cuando el volumen de texto crece."},"sections":[{"id":"contexto-profesional","title":"Contexto profesional","blocks":[{"type":"p","text":"Imagina que te incorporas al equipo lingüístico de una institución multilateral, un organismo público o una gran empresa que trabaja con documentación institucional en varias lenguas: Verba Pública. La institución ha encargado la traducción de un documento oficial a varios proveedores. Las versiones llegan en el mismo idioma, pero no son idénticas: una habla de equipo donde otra habla de grupo; una prefiere compañía y otra empresa; una mantiene una puntuación impecable y otra acumula pequeños problemas de espaciado."},{"type":"p","text":"La pregunta profesional no es únicamente cuál de las versiones «suena mejor». El equipo necesita tomar decisiones justificables:"},{"type":"ul","items":["Qué versión puede validarse como base.","Qué términos deben incorporarse a un glosario consolidado.","Qué proveedor respeta mejor la política terminológica de la institución.","Qué problemas formales conviene corregir antes de publicar el documento.","Qué patrones lingüísticos necesitan revisión humana especializada."]},{"type":"p","text":"La institución no quiere una lectura subjetiva aislada, sino un procedimiento repetible que ayude a responder preguntas concretas:"},{"type":"ul","items":["¿Hay divergencias terminológicas entre versiones?","¿Aparecen patrones formales que sugieran falta de revisión, como espacios dobles o ausencia de espacio tras puntuación?","¿Se repiten estructuras que podrían requerir criterio lingüístico, como ciertos usos de a + infinitivo o gerundios?","¿Puede generarse un pequeño informe que reúna los hallazgos sin tener que revisar manualmente todo el corpus desde cero?"]},{"type":"p","text":"En una revisión manual tradicional, una lingüista tendría que leer las versiones una al lado de la otra, oración por oración, y marcar diferencias. Esa lectura sigue siendo imprescindible, porque interpretar un texto exige criterio lingüístico. Sin embargo, cuando el volumen crece, la revisión exclusivamente manual se vuelve lenta, costosa y difícil de documentar."},{"type":"p","text":"Python permite construir una primera capa de revisión automática. Esa capa no reemplaza la lectura profesional, pero ayuda a organizarla. Localiza indicios, cuenta fenómenos, compara usos y genera un informe preliminar que orienta el trabajo humano. La idea central de este tema es muy importante para el PLN: un texto puede leerse como discurso, pero también puede representarse como dato."},{"type":"p","text":"Este manual desarrolla esa mirada: cómo preparar un pequeño sistema de análisis textual para revisar versiones paralelas monolingües, detectar divergencias terminológicas y localizar posibles problemas de estilo, puntuación y gramática."}],"subsections":[],"navTitle":"Contexto profesional"},{"id":"que-vas-a-aprender-en-esta-unidad","title":"Qué vas a aprender en esta unidad","blocks":[{"type":"p","text":"Al terminar esta unidad deberías poder explicar, antes de ejecutar código, por qué cada operación es relevante para una tarea de revisión lingüística. En concreto, aprenderás a:"},{"type":"ul","items":["entender qué son los textos paralelos monolingües en el contexto de una revisión comparativa;","distinguir entre indicio automático, error lingüístico y decisión profesional;","leer archivos de texto en Python controlando la codificación;","representar un corpus pequeño como una lista de textos;","segmentar textos en oraciones con procedimientos simples y reconocer sus limitaciones;","normalizar texto con operaciones como minúsculas para facilitar comparaciones;","contar palabras o expresiones como primera aproximación a la coherencia terminológica;","recorrer muchos textos con bucles y enumerate;","usar expresiones regulares para localizar patrones formales;","recuperar contexto alrededor de una coincidencia;","comparar versiones paralelas oración a oración;","organizar comprobaciones en funciones reutilizables;","diferenciar entre mostrar un resultado con print y devolverlo con return;","reunir varios análisis parciales en un informe final interpretable."]}],"subsections":[],"navTitle":"Qué vas a aprender"},{"id":"mapa-conceptual-de-la-unidad","title":"Mapa conceptual de la unidad","blocks":[{"type":"table","rows":[["Bloque","Pregunta lingüística","Herramienta de Python","Resultado esperado"],["Textos paralelos monolingües","¿Cómo comparo dos versiones españolas de un mismo contenido?","Listas, índices, zip","Correspondencia entre segmentos"],["Lectura de archivos","¿Cómo convierto documentos externos en texto procesable?","open, encoding=\"utf-8\", pathlib.Path","Cadenas de texto cargadas en memoria"],["Segmentación","¿Dónde empieza y termina cada unidad revisable?","split, strip, listas por comprensión","Lista de oraciones o segmentos"],["Frecuencia léxica","¿Qué términos se repiten y en qué versiones?","lower, count, bucles","Recuentos comparables"],["Patrones formales","¿Dónde hay señales mecánicas de posible error?","in, finditer, índices, slicing","Posiciones y contexto"],["Expresiones regulares","¿Cómo busco estructuras textuales flexibles?","Módulo re, patrones, grupos","Coincidencias interpretables"],["Funciones","¿Cómo evito repetir análisis manualmente?","def, parámetros, return","Comprobaciones reutilizables"],["Informe","¿Cómo convierto hallazgos dispersos en evidencia?","Funciones combinadas, tablas, texto formateado","Informe de revisión preliminar"]],"title":"Bloque · Pregunta lingüística · Herramienta de Python · Resultado esperado"}],"subsections":[],"navTitle":"Mapa conceptual"},{"id":"1-marco-teorico","title":"1. Marco teórico","blocks":[],"subsections":[{"id":"1-1-textos-paralelos-monolingues","title":"1.1. Textos paralelos monolingües","blocks":[{"type":"p","text":"En corpus lingüísticos y estudios de traducción, un corpus paralelo suele entenderse como un conjunto de textos alineados en dos o más lenguas, normalmente un original y su traducción. Un corpus comparable, en cambio, reúne textos que comparten rasgos relevantes, como dominio, género o periodo, pero no necesariamente son traducciones directas entre sí {{cite:olohan2004,zanettin2012}}(Olohan, 2004; Zanettin, 2012){{/cite}}. La unidad trabaja con una adaptación pedagógica de esa lógica: textos paralelos monolingües, es decir, versiones en la misma lengua que representan un mismo contenido o una misma función comunicativa y que pueden compararse por secciones, párrafos u oraciones."},{"type":"p","text":"La expresión «paralelo monolingüe» debe entenderse aquí con cuidado. No significa que exista una categoría universal cerrada con ese nombre en todas las tradiciones de corpus, sino que la unidad aprovecha la idea de paralelismo textual para una tarea profesional concreta: comparar versiones españolas de un mismo documento. En revisión institucional esto es habitual. Puede haber dos proveedores que traducen o adaptan un texto, dos versiones sucesivas de un informe, una versión revisada y otra sin revisar, o variantes regionales de un mismo contenido."},{"type":"p","text":"El interés lingüístico de estos textos está en la divergencia. Si dos versiones dicen exactamente lo mismo con las mismas palabras, la comparación automática aporta poco. Si difieren, en cambio, esas diferencias pueden revelar decisiones de estilo, terminología, registro, puntuación o estructura sintáctica. La tarea no consiste en asumir que toda diferencia es mala. La variación es normal y, en muchos casos, legítima. Lo importante es distinguir entre variación aceptable, incoherencia terminológica y posible error."},{"type":"table","rows":[["Tipo de divergencia","Ejemplo","Interpretación posible"],["Terminológica","«equipo» frente a «grupo»","Puede ser variación aceptable o falta de glosario común"],["Ortográfica o mecánica","«empresa,el»","Probable problema formal por ausencia de espacio"],["Estilística","«llevar a cabo» frente a «realizar»","Puede responder a preferencias de estilo"],["Sintáctica","«decidió a revisar»","Puede ser candidato a revisión según contexto"],["Discursiva","Una versión divide en dos oraciones y otra en una","Puede afectar claridad o ritmo"]],"title":"Tipo de divergencia · Ejemplo · Interpretación posible"},{"type":"p","text":"Para una lingüista computacional en formación, el punto clave es que el texto se convierte en un objeto analizable. Una versión puede representarse como una cadena de caracteres; varias versiones pueden guardarse en una lista; cada oración puede ocupar una posición; cada término puede contarse; cada patrón puede buscarse. Esa representación no agota el análisis lingüístico, pero lo hace operativo."}]},{"id":"1-2-por-que-automatizar-parte-de-la-revision","title":"1.2. Por qué automatizar parte de la revisión","blocks":[{"type":"p","text":"La revisión lingüística y la revisión de traducción son tareas expertas que requieren comprensión, competencia textual, conocimiento del dominio y criterio profesional. Las normas de servicios de traducción insisten en procesos de revisión y verificación que no se reducen a una comprobación mecánica {{cite:internationalorganiz2015}}(ISO, 2015){{/cite}}. La evaluación de la calidad de una traducción también exige criterios definidos y categorías de error o adecuación, no solo impresiones generales {{cite:internationalorganiz2024,lommel2014}}(ISO, 2024; Lommel et al., 2014){{/cite}}."},{"type":"p","text":"Automatizar parte de la revisión no significa automatizar la decisión final. Significa delegar en el programa las operaciones que son repetitivas, sistemáticas y fácilmente verificables. Python puede contar cuántas veces aparece un término, localizar dobles espacios, detectar una coma sin espacio posterior o listar estructuras candidatas a revisión. La persona especialista conserva la responsabilidad de interpretar esos hallazgos."},{"type":"p","text":"Este reparto de tareas tiene varias ventajas. En primer lugar, reduce la carga de búsqueda manual. En un texto largo, encontrar todas las ocurrencias de una palabra o todos los espacios dobles es una tarea tediosa y propensa a omisiones. En segundo lugar, aumenta la trazabilidad: si se usa el mismo patrón de búsqueda, el procedimiento puede repetirse en otra versión o en otro corpus. En tercer lugar, facilita la documentación de decisiones: un informe con recuentos, ejemplos y posiciones permite discutir con más precisión."},{"type":"p","text":"También existen riesgos. Un detector basado en reglas puede producir falsos positivos, es decir, casos señalados por el programa que no son errores reales. También puede producir falsos negativos, casos problemáticos que no se detectan porque no cumplen el patrón previsto. Por eso conviene hablar de candidatos a revisión y no de errores automáticos. El lenguaje es demasiado variable para que una regla simple capture todos los matices."},{"type":"p","text":"En Verba Pública, esta idea se traduce en una regla profesional clara: el informe automático no se entrega como veredicto, sino como mapa de lectura. La revisora sénior no recibe una lista de «fallos», sino una lista de «lugares que conviene mirar». Esa diferencia protege la calidad del trabajo lingüístico y evita que la herramienta aparente más certeza de la que realmente tiene."}]},{"id":"1-3-del-corpus-al-informe-una-cadena-de-analisis","title":"1.3. Del corpus al informe: una cadena de análisis","blocks":[{"type":"p","text":"Una tarea de PLN no empieza con el informe final, sino con una cadena de decisiones. En esta unidad, esa cadena puede resumirse así: recopilar textos, leerlos correctamente, normalizarlos cuando sea necesario, segmentarlos, aplicar comprobaciones, guardar resultados, interpretarlos y comunicarlos. Cada eslabón condiciona los siguientes."},{"type":"table","rows":[["Fase","Pregunta","Decisión técnica","Riesgo si se descuida"],["Entrada","¿De dónde viene el texto?","Leer archivos .txt con codificación explícita","Caracteres dañados o errores de lectura"],["Representación","¿Cómo guardo una o varias versiones?","Cadenas, listas, diccionarios si procede","Datos desordenados o difíciles de comparar"],["Normalización","¿Qué diferencias quiero ignorar?","Pasar a minúsculas, limpiar espacios","Comparaciones injustas o pérdida de información"],["Segmentación","¿Qué unidad reviso?","Oraciones, párrafos, líneas","Coincidencias sin contexto"],["Análisis","¿Qué busco?","Recuentos, patrones, regex, funciones","Resultados irrelevantes"],["Interpretación","¿Qué significa el hallazgo?","Criterio lingüístico","Confundir señal con error"],["Informe","¿Cómo lo comunico?","Tablas, ejemplos, resumen","Evidencia difícil de usar"]],"title":"Fase · Pregunta · Decisión técnica · Riesgo si se descuida"},{"type":"p","text":"La literatura de corpus insiste en que el corpus no es una colección neutra de textos, sino un recurso construido para responder preguntas concretas {{cite:mcenery2012}}(McEnery y Hardie, 2012){{/cite}}. En una revisión profesional, esa idea es especialmente importante: no se recopilan versiones porque sí, sino porque se quiere verificar coherencia, detectar divergencias y justificar decisiones."},{"type":"p","text":"El informe final debe preservar la relación entre dato y contexto. Un recuento aislado puede ser útil, pero no basta. Saber que «implementación» aparece cinco veces en una versión y una vez en otra puede sugerir divergencia terminológica, pero la revisión necesita mirar dónde aparece, qué función cumple y si existe una alternativa aceptada por el glosario. Por eso el análisis automático debe tender a producir resultados contextualizados."},{"type":"p","text":"Por ejemplo, si una herramienta detecta diez casos de a + infinitivo, no puede afirmar automáticamente que todos sean galicismos. Algunos serán correctos. Otros dependerán del sustantivo anterior, del régimen preposicional o de la construcción completa. La herramienta reduce el espacio de búsqueda; la lingüista interpreta."},{"type":"p","text":"Esta relación entre automatización y revisión humana es esencial en entornos profesionales:"},{"type":"table","rows":[["Tarea automática","Decisión lingüística posterior"],["Contar ocurrencias de empresa y compañía","Decidir cuál debe incorporarse al glosario"],["Detectar ., seguido de una letra sin espacio","Confirmar si hay error tipográfico real"],["Localizar gerundios","Clasificar usos correctos, de posterioridad o especificativos"],["Comparar términos por versión","Valorar consistencia, estilo y adecuación al cliente"],["Generar un informe preliminar","Priorizar la revisión humana"]],"title":"Tarea automática · Decisión lingüística posterior"},{"type":"p","text":"Para una lingüista de segundo curso, esta unidad introduce una idea muy poderosa: programar no consiste solo en «hacer que algo funcione». Programar para PLN consiste en formalizar una pregunta lingüística."},{"type":"image_reveal","src":"img/fig_cadena.svg","alt":"Del corpus al informe: resultado de cada paso","labelClosed":"🔎 Descubre la cadena de análisis paso a paso","caption":"Figura elaborada a partir del mapa conceptual de la unidad."}]},{"id":"1-4-revision-linguistica-calidad-y-evidencia","title":"1.4. Revisión lingüística, calidad y evidencia","blocks":[{"type":"p","text":"La calidad textual no es una propiedad única. En traducción y comunicación especializada suele relacionarse con adecuación al encargo, fidelidad funcional, coherencia terminológica, corrección lingüística, legibilidad y cumplimiento de convenciones del cliente o institución. Las normas profesionales, como ISO 17100 para servicios de traducción, subrayan la importancia de procesos definidos, competencias profesionales y revisión por una persona distinta cuando procede {{cite:internationalorganiz2015}}(ISO, 2015){{/cite}}."},{"type":"p","text":"La evaluación de calidad también puede apoyarse en marcos de categorías. MQM, por ejemplo, propone describir problemas de calidad mediante dimensiones y tipos de error, lo que permite pasar de una impresión global a una anotación más sistemática {{cite:lommel2014}}(Lommel et al., 2014){{/cite}}. ISO 5060 actualiza este terreno al ofrecer una norma para evaluar resultados de traducción, con atención a criterios, especificaciones y finalidad de la evaluación {{cite:internationalorganiz2024}}(ISO, 2024){{/cite}}."},{"type":"p","text":"La unidad no pretende que el alumnado aplique una taxonomía completa de calidad, sino que entienda una idea fundamental: un buen análisis automático debe estar al servicio de una pregunta de revisión. No se busca «todo lo raro»; se buscan indicios relacionados con una necesidad profesional. En el caso de Verba Pública, la necesidad es comparar versiones españolas para detectar divergencias antes de consolidar una versión final."},{"type":"p","text":"Esta perspectiva evita dos errores frecuentes. El primero es tecnicista: creer que si Python detecta algo, ese algo ya es un error. El segundo es antitécnico: pensar que, como el criterio final es humano, la automatización no aporta valor. Entre ambos extremos está la práctica profesional madura: usar herramientas para observar mejor y decidir con más fundamento."}]},{"id":"1-5-corpus-texto-y-unidad-de-analisis","title":"1.5. Corpus, texto y unidad de análisis","blocks":[{"type":"p","text":"Un corpus es un conjunto de textos reunidos con un propósito. Puede ser grande o pequeño, especializado o general, monolingüe o multilingüe, equilibrado o diseñado para una tarea muy concreta. Lo importante es que permite estudiar patrones de uso a partir de datos. En PLN, un corpus pequeño puede ser suficiente para aprender procedimientos; en investigación o producción profesional, el tamaño y diseño del corpus deben justificarse con más cuidado {{cite:mcenery2012,olohan2004}}(McEnery y Hardie, 2012; Olohan, 2004){{/cite}}."},{"type":"p","text":"En esta unidad, el corpus es pequeño y controlado: varias versiones de textos de trabajo. Esa escala es didáctica, pero no trivial. Muchas tareas profesionales reales comienzan con corpus modestos: un contrato, un informe, una guía de estilo, una batería de páginas web o un conjunto de documentos institucionales. En esos casos, Python no se usa para descubrir leyes generales de la lengua, sino para apoyar una revisión concreta."},{"type":"p","text":"La unidad de análisis puede cambiar. A veces interesa el texto completo, por ejemplo para contar cuántas veces aparece un término. Otras veces interesa la oración, porque permite localizar un problema en contexto. En otros proyectos podrían interesar párrafos, segmentos alineados, títulos, notas al pie o unidades terminológicas. Elegir la unidad de análisis es una decisión lingüística antes que técnica."},{"type":"table","rows":[["Unidad","Ventaja","Limitación"],["Texto completo","Permite recuentos globales","Puede ocultar dónde ocurre el fenómeno"],["Párrafo","Mantiene contexto discursivo","Puede ser demasiado amplio para revisión puntual"],["Oración","Facilita localización y comparación","La segmentación automática puede fallar"],["Palabra","Permite frecuencias y concordancias","No capta siempre expresiones complejas"],["Patrón","Localiza estructuras específicas","Depende de una formulación precisa"]],"title":"Unidad · Ventaja · Limitación"}]},{"id":"1-6-segmentacion-en-oraciones","title":"1.6. Segmentación en oraciones","blocks":[{"type":"p","text":"Segmentar un texto consiste en dividirlo en unidades menores. En la unidad se trabaja con una segmentación muy simple basada en el punto: texto.split(\".\"). Este procedimiento es comprensible para empezar, pero tiene limitaciones evidentes. No todos los puntos cierran oraciones: pueden aparecer en abreviaturas, números, siglas, iniciales o direcciones. Además, una oración puede terminar con signos de interrogación, exclamación o puntos suspensivos."},{"type":"p","text":"La segmentación de oraciones es una tarea clásica del procesamiento del lenguaje natural. {{cite:kiss2006}}Kiss y Strunk (2006){{/cite}} mostraron que incluso la detección de límites oracionales puede tratarse con métodos no supervisados y multilingües, precisamente porque no es tan simple como buscar puntos. Los manuales generales de PLN también la presentan como parte de la normalización y el preprocesamiento textual {{cite:bird2009,jurafsky2025}}(Bird et al., 2009; Jurafsky & Martin, 2025){{/cite}}."},{"type":"p","text":"En una unidad inicial de programación para lingüistas, usar split(\".\") tiene valor didáctico: permite ver que una cadena puede convertirse en una lista de segmentos y que cada segmento puede limpiarse con strip. Lo importante es acompañar el procedimiento con una advertencia: es una aproximación, no un segmentador robusto. Cuando el proyecto sea real y de mayor escala, convendrá usar herramientas especializadas o reglas más cuidadosas."},{"type":"p","text":"La segmentación también afecta a la interpretación. Si el programa localiza un doble espacio dentro de la oración 4, la revisora puede ir directamente a esa zona. Si solo se informa de que hay tres dobles espacios en todo el texto, el dato es menos útil. Por eso segmentar no es solo dividir: es hacer que los resultados sean revisables."}]},{"id":"1-7-frecuencia-lexica-y-coherencia-terminologica","title":"1.7. Frecuencia léxica y coherencia terminológica","blocks":[{"type":"p","text":"La frecuencia léxica mide cuántas veces aparece una palabra o expresión. En corpus lingüísticos, las frecuencias permiten observar patrones de uso, comparar variedades, estudiar colocaciones o identificar rasgos de un dominio. En revisión lingüística, los recuentos pueden funcionar como indicios de coherencia o divergencia terminológica."},{"type":"p","text":"Si una versión usa «equipo» diez veces y otra usa «grupo» diez veces para referirse a la misma entidad, puede haber una diferencia de criterio. Si dentro de una misma versión alternan «compañía», «empresa» y «sociedad» sin justificación, puede haber un problema de coherencia terminológica. Sin embargo, el recuento no decide por sí solo. Puede haber sinónimos legítimos, diferencias de contexto o términos que no sean equivalentes."},{"type":"p","text":"La normalización a minúsculas con lower facilita comparaciones básicas, porque permite contar «Empresa» y «empresa» como la misma forma. Pero también implica una decisión: se ignora la diferencia entre mayúscula y minúscula. En muchos recuentos esto es útil; en otros puede ser problemático, por ejemplo si se comparan nombres propios, siglas o usos institucionales."},{"type":"table","rows":[["Decisión","Ejemplo","Efecto"],["Contar con mayúsculas","texto.count(\"Empresa\")","Distingue entre mayúscula y minúscula"],["Contar en minúsculas","texto.lower().count(\"empresa\")","Agrupa variantes de capitalización"],["Contar una palabra aislada","«empresa»","Puede incluir parte de formas si no se controla el contexto"],["Contar expresión","«equipo técnico»","Más preciso para unidades pluriverbales"]],"title":"Decisión · Ejemplo · Efecto"},{"type":"p","text":"En proyectos profesionales, la coherencia terminológica suele relacionarse con glosarios, memorias de traducción, bases terminológicas y guías de estilo. Python no sustituye esos recursos, pero puede ayudar a comprobar si una versión respeta una lista de términos o si dos versiones toman decisiones divergentes."}]},{"id":"1-8-patrones-formales-espacios-puntuacion-y-normalizacion","title":"1.8. Patrones formales: espacios, puntuación y normalización","blocks":[{"type":"p","text":"Los patrones formales son señales de superficie: espacios dobles, puntuación pegada, saltos de línea extraños, caracteres invisibles o inconsistencias de formato. A menudo no requieren un análisis lingüístico profundo para detectarse, pero sí afectan a la calidad percibida del texto y a su preparación para otros procesos."},{"type":"p","text":"Un ejemplo claro es la ausencia de espacio después de coma o punto: empresa,el o temporales.Utilizando. En español escrito, lo normal es que después de una coma o un punto haya un espacio si continúa otra palabra, salvo contextos específicos como números, direcciones web, abreviaturas o ciertos formatos técnicos. La detección automática debe tener en cuenta que una regla demasiado simple puede señalar casos legítimos."},{"type":"p","text":"Los espacios dobles son otro ejemplo. En muchas versiones finales de documentos, un doble espacio entre palabras es una señal mecánica de falta de limpieza. Sin embargo, en algunos contextos preformateados, tablas o código puede haber espacios intencionales. De nuevo, la regla detecta una señal; la revisión decide."},{"type":"p","text":"La normalización textual puede incluir pasar a minúsculas, eliminar espacios sobrantes, sustituir saltos de línea o unificar comillas. Pero normalizar demasiado puede borrar información relevante. En revisión lingüística conviene distinguir entre normalización para analizar y corrección del texto original. Una cosa es crear una copia en minúsculas para contar; otra muy distinta es modificar el documento final."}]},{"id":"1-9-expresiones-regulares-como-reglas-transparentes","title":"1.9. Expresiones regulares como reglas transparentes","blocks":[{"type":"p","text":"Las expresiones regulares son patrones formales que permiten buscar secuencias de caracteres con cierta flexibilidad. El módulo re de Python implementa operaciones de búsqueda, coincidencia, sustitución y extracción basadas en estos patrones {{cite:pythonsoftwarefounda2026a}}(Python Software Foundation, 2026a){{/cite}}. En PLN, las expresiones regulares se usan para tareas como localizar fechas, abreviaturas, formatos, terminaciones, espacios anómalos o construcciones textuales relativamente previsibles {{cite:bird2009,friedl2006}}(Bird et al., 2009; Friedl, 2006){{/cite}}."},{"type":"p","text":"Una expresión regular no «comprende» el texto. Lo que hace es comprobar si una secuencia encaja con una forma. Por ejemplo, el patrón [.,][^\\s] busca un punto o una coma seguido de un carácter que no sea espacio. Eso puede localizar casos como texto.Sin o empresa,el. El patrón es transparente: podemos explicar qué significa cada parte. Esa transparencia es valiosa en contextos docentes y profesionales, porque la regla puede discutirse, corregirse y documentarse."},{"type":"table","rows":[["Elemento","Significado aproximado","Ejemplo"],["[.,]","Un punto o una coma",". o ,"],["\\s","Un espacio o carácter de espacio en blanco","espacio, tabulación, salto de línea"],["[^\\s]","Un carácter que no es espacio","a, E, 5"],["\\w+","Una o más letras, números o guiones bajos","revisar, texto1"],["\\b","Límite de palabra","Final de revisar"],["`(ar | er | ir)`","Una de varias terminaciones","ar, er, ir"]],"title":"Elemento · Significado aproximado · Ejemplo"},{"type":"p","text":"La ventaja de las expresiones regulares es su precisión formal. La limitación es que esa precisión no equivale a interpretación lingüística. Un patrón puede encontrar todas las formas acabadas en ando o iendo, pero no puede decidir automáticamente si el gerundio está bien usado en cada contexto. Por eso la unidad las presenta como herramientas para generar candidatos a revisión, no como jueces gramaticales."}]},{"id":"1-10-posibles-calcos-y-estructuras-con-a-infinitivo","title":"1.10. Posibles calcos y estructuras con a + infinitivo","blocks":[{"type":"p","text":"En español, ciertas secuencias de sustantivo seguido de a + infinitivo, como «temas a tratar» o «problemas a resolver», han sido tradicionalmente comentadas en obras normativas y de estilo. La valoración depende del contexto, de la estructura exacta y del grado de asentamiento de la expresión. Las obras académicas panhispánicas recomiendan evitar usos innecesarios cuando exista una alternativa más natural, pero no toda aparición de a + infinitivo es incorrecta {{cite:realacademiaespanola2005}}(Real Academia Española & ASALE, 2005/2023){{/cite}}."},{"type":"p","text":"La unidad trabaja con un patrón más amplio, por ejemplo formas como «decidió a revisar» o «intentó a implementar», que pueden sonar anómalas en español estándar según el verbo y el régimen exigido. Desde el punto de vista computacional, lo relevante es que muchas de estas secuencias comparten una forma superficial: una palabra, la preposición a y un infinitivo. Ese parecido formal permite buscarlas con una expresión regular."},{"type":"p","text":"Ahora bien, el patrón no debe confundirse con una norma. El español tiene muchas construcciones legítimas con a + infinitivo: «empezó a revisar», «volvió a leer», «ayudó a preparar», «salió a comprar». Un detector automático que busque cualquier palabra seguida de a y un infinitivo encontrará tanto casos aceptables como casos dudosos. Por eso el resultado debe llamarse candidato."},{"type":"p","text":"Esta distinción es fundamental para estudiantes de lingüística. El programa no sabe régimen verbal, estructura argumental ni aceptabilidad contextual. Solo observa forma. La persona lingüista interpreta si esa forma merece revisión a partir de gramática, uso, estilo y finalidad comunicativa."}]},{"id":"1-11-gerundios-como-candidatos-a-revision","title":"1.11. Gerundios como candidatos a revisión","blocks":[{"type":"p",
