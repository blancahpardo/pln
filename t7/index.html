  var QUIZ_MANUAL = [{"question":"¿Cuál es la distinción fundamental entre un término y una palabra de uso general según la teoría de Cabré?","answerOptions":[{"text":"Un término designa un concepto específico dentro de un dominio de conocimiento especializado.","isCorrect":true,"rationale":"La terminología se define por la conexión entre la unidad lingüística y un campo de especialidad concreto."},{"text":"Un término es necesariamente una unidad léxica de baja frecuencia en cualquier tipo de texto.","isCorrect":false,"rationale":"La frecuencia absoluta no define el estatus terminológico; un término puede ser muy frecuente dentro de su dominio especializado."},{"text":"Los términos solo existen en forma de expresiones multipalabra complejas.","isCorrect":false,"rationale":"Los términos pueden ser unigramas (una sola palabra) o multipalabra (n-gramas)."},{"text":"Un término es cualquier palabra que resulta difícil de entender para un hablante no nativo.","isCorrect":false,"rationale":"La dificultad de comprensión no es el criterio técnico, sino la designación de un concepto en un área profesional o científica."}],"hint":"Considere la relación entre el lenguaje y el ámbito de especialidad."},{"question":"En el contexto de la extracción terminológica, ¿qué mide específicamente el concepto de 'termhood'?","answerOptions":[{"text":"La probabilidad de que una unidad sea propia o relevante para un dominio especializado.","isCorrect":true,"rationale":"El termhood cuantifica la especificidad de una unidad respecto a un campo temático frente a un corpus general."},{"text":"El grado de estabilidad sintáctica de una combinación específica de palabras en una oración.","isCorrect":false,"rationale":"Esta descripción corresponde a la unithood, que se centra en la cohesión de la unidad."},{"text":"La cantidad de variantes gramaticales que presenta un término en un corpus.","isCorrect":false,"rationale":"La variación es un fenómeno terminológico, pero no es lo que define el grado de pertenencia al dominio."},{"text":"La velocidad con la que un sistema de PLN procesa los tokens de un documento.","isCorrect":false,"rationale":"La eficiencia del procesamiento es una cuestión técnica de computación, no una propiedad lingüística de los términos."}],"hint":"Piense en la relevancia de una palabra para un área del conocimiento específica."},{"question":"Si un corpus especializado tiene 10 000 tokens en total y el término 'tokenización' aparece 50 veces, ¿cuál es su frecuencia relativa?","answerOptions":[{"text":"0.005","isCorrect":true,"rationale":"La frecuencia relativa se calcula dividiendo la frecuencia absoluta entre el total de tokens: 50 / 10000 = 0.005."},{"text":"200","isCorrect":false,"rationale":"Este resultado se obtiene dividiendo el total de tokens por la frecuencia, lo cual es el proceso inverso al cálculo de la frecuencia relativa."},{"text":"0.05","isCorrect":false,"rationale":"Este valor implicaría una frecuencia absoluta de 500 apariciones en lugar de 50 para el tamaño de corpus dado."},{"text":"500.000","isCorrect":false,"rationale":"Este valor es el producto de la frecuencia por el tamaño del corpus, no su proporción."}],"hint":"Aplique la fórmula de normalización por tamaño de corpus."},{"question":"En la fórmula de 'weirdness' aplicada en la unidad, ¿cuál es la función del parámetro epsilon?","answerOptions":[{"text":"Evitar el error de división por cero cuando un candidato no aparece en el corpus general.","isCorrect":true,"rationale":"Si la frecuencia relativa en el corpus general es cero, añadir un valor mínimo permite realizar la división sin romper el programa."},{"text":"Aumentar artificialmente la frecuencia de los términos en el corpus general.","isCorrect":false,"rationale":"No busca alterar las frecuencias, sino proteger la integridad del cálculo matemático."},{"text":"Eliminar automáticamente las stopwords del ranking final.","isCorrect":false,"rationale":"El filtrado de stopwords es un proceso de preprocesamiento independiente de la fórmula de especificidad."},{"text":"Calcular el logaritmo natural de la frecuencia absoluta antes de aplicar cualquier otro filtro.","isCorrect":false,"rationale":"Epsilon es una constante de suavizado, no un operador logarítmico."}],"hint":"Piense en qué sucede matemáticamente si el denominador de una fracción es cero."},{"question":"¿Por qué se utilizan tuplas en Python para representar n-gramas antes de contarlos con un objeto Counter?","answerOptions":[{"text":"Porque las tuplas son inmutables y, por lo tanto, pueden usarse como claves en un diccionario o Counter.","isCorrect":true,"rationale":"En Python, los objetos mutables como las listas no pueden ser claves de diccionarios; se requiere una estructura inmutable como la tupla."},{"text":"Porque las tuplas permiten almacenar más información que las listas simples.","isCorrect":false,"rationale":"El problema no es la capacidad de almacenamiento, sino las propiedades de la estructura de datos."},{"text":"Porque las tuplas eliminan automáticamente los espacios en blanco al construir cada secuencia de tokens.","isCorrect":false,"rationale":"La limpieza de espacios se realiza durante la tokenización, no por el simple hecho de usar tuplas."},{"text":"Porque facilitan la conversión de todos los tokens a minúsculas.","isCorrect":false,"rationale":"La conversión a minúsculas es un paso previo que se aplica a los strings antes de generar los n-gramas."}],"hint":"Considere los requisitos técnicos para que un objeto sea 'hashable' en Python."},{"question":"Al extraer términos multipalabra en español, ¿cuál es el riesgo de eliminar todas las stopwords antes de generar los n-gramas?","answerOptions":[{"text":"Que se pierdan conectores internos esenciales, produciendo candidatos incompletos como 'modelo lenguaje' en lugar de 'modelo de lenguaje'.","isCorrect":true,"rationale":"Muchas unidades terminológicas en español dependen de preposiciones internas; eliminarlas deforma el término natural."},{"text":"Que el sistema no pueda contar la frecuencia absoluta correctamente en ningún nivel del corpus, incluidos unigramas, bigramas y trigramas.","isCorrect":false,"rationale":"La frecuencia se puede contar igual, el problema reside en la integridad estructural del término."},{"text":"Que el corpus especializado se vuelva más grande que el corpus general.","isCorrect":false,"rationale":"El filtrado de palabras funcionales reduce el tamaño de ambos corpus, pero no invierte su relación de tamaño."},{"text":"Que las expresiones regulares dejen de funcionar para la limpieza de URLs.","isCorrect":false,"rationale":"La limpieza de URLs ocurre normalmente antes de la gestión de stopwords y n-gramas."}],"hint":"Piense en cómo se forman los términos técnicos en nuestra lengua."},{"question":"¿Cuál es la utilidad primordial de una herramienta KWIC (Key Word In Context) para una persona terminóloga?","answerOptions":[{"text":"Permitir la validación de un candidato al observar cómo se utiliza en su entorno lingüístico real.","isCorrect":true,"rationale":"El contexto proporcionado por el KWIC ayuda a decidir si una unidad es un concepto estable o una combinación casual."},{"text":"Sustituir la necesidad de un corpus general de contraste.","isCorrect":false,"rationale":"El KWIC no sustituye el contraste estadístico; sirve para la validación cualitativa posterior."},{"text":"Calcular automáticamente el valor de precisión y recall del sistema.","isCorrect":false,"rationale":"La evaluación de precisión y recall requiere una comparación con un estándar de oro, no solo la visualización de contextos."},{"text":"Reducir el tiempo de ejecución de la función de tokenización sobre corpus de gran tamaño.","isCorrect":false,"rationale":"El KWIC es una función de visualización y análisis, no un optimizador del rendimiento del código."}],"hint":"Imagine que tiene una lista de palabras y necesita saber si realmente funcionan como términos."},{"question":"Al aplicar una 'lista negra' (blacklist) en el refinamiento de candidatos, ¿qué criterio se sugiere para eliminar una unidad?","answerOptions":[{"text":"Eliminar candidatos compuestos exclusivamente por palabras consideradas demasiado generales o ruidosas por el analista.","isCorrect":true,"rationale":"Las listas negras permiten descartar unidades como 'sistema' o 'uso' que, aunque frecuentes, no aportan valor específico al glosario."},{"text":"Eliminar cualquier palabra que aparezca más de diez veces en el corpus especializado.","isCorrect":false,"rationale":"La alta frecuencia suele ser un indicador de termhood; eliminarla por sistema sería contraproducente."},{"text":"Descartar términos que tengan menos de cinco caracteres, sin importar su frecuencia real ni su relevancia en el dominio.","isCorrect":false,"rationale":"La longitud del string no determina su valor terminológico; hay términos cortos muy importantes."},{"text":"Filtrar todos los términos que ya existan en un diccionario de la Real Academia Española.","isCorrect":false,"rationale":"Muchos términos especializados están en diccionarios generales, pero siguen siendo relevantes para el dominio estudiado."}],"hint":"Considere cómo reducir el ruido provocado por palabras procedimentales comunes."},{"question":"Al construir la lista de tokens de un corpus en Python, ¿cuál es la diferencia clave entre usar .append() y .extend()?","answerOptions":[{"text":".append() añadiría una lista de tokens como un solo elemento, mientras que .extend() añade cada token individualmente a la lista principal.","isCorrect":true,"rationale":"Para obtener una lista plana de todos los tokens del corpus, se requiere .extend() para integrar los elementos de cada documento."},{"text":".append() convierte los tokens a minúsculas, mientras que .extend() los mantiene igual.","isCorrect":false,"rationale":"La transformación de casos es una operación de strings, no una propiedad del método de lista."},{"text":".extend() solo funciona correctamente con unigramas, mientras que .append() está limitado exclusivamente a trigramas de tres elementos consecutivos.","isCorrect":false,"rationale":"Ambos métodos funcionan con cualquier tipo de objeto en Python; la diferencia es cómo se agregan."},{"text":"No hay diferencia real; ambos métodos producen el mismo resultado en la memoria de Python.","isCorrect":false,"rationale":"La diferencia estructural es decisiva: una produce una lista de listas y la otra una lista plana."}],"hint":"Piense en la estructura resultante: ¿una lista que contiene otra lista, o una lista con todos los elementos sueltos?"},{"question":"¿Qué significa que un sistema de extracción terminológica sea 'transparente' frente a uno 'neuronal'?","answerOptions":[{"text":"Que cada decisión y posición en el ranking puede explicarse mediante reglas estadísticas y lingüísticas claramente definidas.","isCorrect":true,"rationale":"En los métodos transparentes, se puede trazar el origen de un candidato (frecuencia, contraste, filtros) sin depender de procesos opacos."},{"text":"Que el sistema transparente solo puede procesar archivos de texto plano.","isCorrect":false,"rationale":"La transparencia se refiere a la interpretación de los procesos, no al formato de los archivos de entrada."},{"text":"Que el sistema neuronal es incapaz de detectar términos multipalabra sin un entrenamiento previo extenso sobre datos anotados.","isCorrect":false,"rationale":"Los modelos neuronales son muy potentes detectando n-gramas, aunque su lógica interna sea más difícil de interpretar."},{"text":"Que los métodos transparentes son siempre más precisos que los modelos de lenguaje modernos.","isCorrect":false,"rationale":"La precisión depende de muchos factores; la ventaja del método transparente es su explicabilidad, no necesariamente una precisión superior."}],"hint":"Relacione el concepto con la capacidad del analista para justificar los resultados."}];
  var QUIZ_CUADERNO = [{"question":"¿Cuál es el objetivo principal de un sistema de extracción automática de terminología?","answerOptions":[{"text":"Detectar automáticamente términos candidatos comparando un corpus especializado con uno general.","isCorrect":true,"rationale":"La esencia de este tipo de sistema es identificar palabras o secuencias que son significativamente más frecuentes en el dominio de interés que en el lenguaje común."},{"text":"Entrenar un modelo neuronal complejo para traducir documentos de forma automática.","isCorrect":false,"rationale":"No se busca construir una inteligencia artificial gigantesca ni un modelo neuronal, sino un prototipo interpretable basado en la comparación de corpus."},{"text":"Sustituir por completo el trabajo de los traductores humanos en la empresa LexiData.","isCorrect":false,"rationale":"El sistema se define como una herramienta de apoyo semiautomática para agilizar la labor humana, no para eliminarla."},{"text":"Crear una base de datos de todas las palabras existentes en el idioma español, incluidas sus variantes regionales.","isCorrect":false,"rationale":"El enfoque no es el léxico general, sino la detección de términos característicos de dominios especializados como la medicina o el derecho."}],"hint":"Fíjate en la técnica de contraste que utiliza dos tipos de conjuntos de textos."},{"question":"En el proceso de limpieza y preprocesamiento, ¿qué función cumplen las 'stopwords'?","answerOptions":[{"text":"Son palabras muy frecuentes pero con poco valor terminológico que deben filtrarse para reducir el ruido.","isCorrect":true,"rationale":"Artículos, preposiciones y conjunciones aparecen mucho en cualquier texto pero no definen un dominio especializado."},{"text":"Son términos especializados que deben resaltarse en el glosario final.","isCorrect":false,"rationale":"Las stopwords son palabras vacías de contenido terminológico, justo lo opuesto a los términos especializados."},{"text":"Son unidades lingüísticas que ayudan a detectar el sentimiento del texto.","isCorrect":false,"rationale":"El análisis de sentimiento no es el objetivo de este pipeline, que se centra en la extracción de terminología técnica."},{"text":"Son marcadores que indican el inicio y el fin de cada n-grama dentro del corpus ya procesado y filtrado.","isCorrect":false,"rationale":"Aunque afectan a la formación de n-gramas si se eliminan, su definición principal es la de palabras funcionales frecuentes."}],"hint":"Piensa en palabras como 'de', 'la', 'el' o 'y'."},{"question":"Si a la expresión 'modelo de lenguaje' se le aplica un preprocesamiento simple que elimina las stopwords y conserva el resto de palabras en su mismo orden, ¿en qué se convierte?","answerOptions":[{"text":"modelo lenguaje","isCorrect":true,"rationale":"Al eliminar la stopword 'de', el n-grama resultante une los tokens con significado léxico restantes."},{"text":"lenguaje modelo","isCorrect":false,"rationale":"El sistema mantiene el orden secuencial original de los tokens supervivientes, no los invierte."},{"text":"modelo_de_lenguaje","isCorrect":false,"rationale":"Este preprocesamiento utiliza la eliminación de palabras vacías y la división por espacios, no la unión con guiones bajos."},{"text":"modelo","isCorrect":false,"rationale":"Esto sería un unigrama; la formación de bigramas tras el filtrado conserva dos palabras consecutivas."}],"hint":"Considera qué sucede cuando se elimina una palabra funcional entre dos sustantivos."},{"question":"¿Cuál es la utilidad de utilizar la frecuencia relativa en lugar de la frecuencia absoluta al comparar dos corpus?","answerOptions":[{"text":"Permite comparar corpus de diferentes tamaños de forma justa.","isCorrect":true,"rationale":"La frecuencia relativa normaliza los datos dividiendo el número de apariciones por el total de tokens, evitando sesgos por la extensión del texto."},{"text":"Es más fácil de calcular manualmente que la frecuencia absoluta.","isCorrect":false,"rationale":"Requiere una operación matemática adicional (división), por lo que técnicamente es un paso más que el simple conteo."},{"text":"Elimina automáticamente todas las palabras que no son sustantivos.","isCorrect":false,"rationale":"La frecuencia relativa es una medida estadística de probabilidad, no un filtro gramatical o de categoría de palabra."},{"text":"Asegura que los términos aparezcan siempre en orden alfabético.","isCorrect":false,"rationale":"El orden alfabético es independiente de las métricas de frecuencia utilizadas para el ranking."}],"hint":"Piensa en lo que sucede si comparas un libro de mil páginas con un artículo de una página."},{"question":"La medida de contraste denominada 'weirdness' se calcula mediante la fórmula:","answerOptions":[{"text":"weirdness(t) = (f_esp(t) / N_esp) / (f_gen(t) / N_gen + epsilon)","isCorrect":true,"rationale":"Esta fórmula representa la proporción de la frecuencia relativa del término en el corpus especializado frente al general, con un factor epsilon para evitar errores."},{"text":"weirdness(t) = f_esp(t) - f_gen(t)","isCorrect":false,"rationale":"Una simple resta de frecuencias absolutas no tiene en cuenta el tamaño total de los corpus (N)."},{"text":"weirdness(t) = N_esp / N_gen, sin tener en cuenta la frecuencia del término","isCorrect":false,"rationale":"Esta fórmula solo compararía el tamaño total de los textos, no la representatividad de un término específico."},{"text":"weirdness(t) = log(f_esp(t) × f_gen(t))","isCorrect":false,"rationale":"La multiplicación no permitiría identificar qué términos son 'raros' o únicos en comparación con el corpus general."}],"hint":"Busca la relación entre las frecuencias relativas del corpus especializado y el general."},{"question":"¿Qué es un n-grama en el contexto del procesamiento de lenguaje natural?","answerOptions":[{"text":"Una secuencia de n tokens o palabras consecutivas.","isCorrect":true,"rationale":"Los n-gramas permiten capturar unidades multipalabra (bigramas, trigramas) que a menudo funcionan como términos únicos."},{"text":"Un tipo de gráfico para visualizar la frecuencia de las letras.","isCorrect":false,"rationale":"Aunque suene similar a 'diagrama', se refiere a unidades de texto, no a representaciones gráficas."},{"text":"Un modelo neuronal especializado en detectar errores gramaticales.","isCorrect":false,"rationale":"Es una técnica estadística y estructural básica de PLN, no un modelo de aprendizaje profundo por sí mismo."},{"text":"Una lista de palabras que deben ser eliminadas del corpus.","isCorrect":false,"rationale":"Esa descripción corresponde a las 'stopwords' o 'listas negras', no a los n-gramas."}],"hint":"El término proviene de la lingüística computacional y se refiere a cadenas de unidades."},{"question":"En un sistema de extracción de terminología que prioriza la transparencia y la interpretabilidad de cada candidato, ¿por qué requiere la generación de concordancias KWIC (Keyword in Context)?","answerOptions":[{"text":"Para permitir que un experto humano valide si el candidato tiene sentido como término real.","isCorrect":true,"rationale":"Ver el entorno inmediato de la palabra ayuda a confirmar si su uso es técnico o puramente accidental."},{"text":"Para traducir automáticamente los términos candidatos a otros idiomas.","isCorrect":false,"rationale":"El sistema es un detector de terminología para extracción, no un traductor automático."},{"text":"Para reducir el tamaño del archivo de salida y ahorrar memoria.","isCorrect":false,"rationale":"Las concordancias KWIC en realidad aumentan la cantidad de información presentada en el glosario."},{"text":"Para eliminar los números y URLs que hayan quedado en el texto.","isCorrect":false,"rationale":"Esa tarea se realiza en la fase inicial de limpieza y tokenización, no en la fase de KWIC."}],"hint":"Considera la necesidad de que cada candidato a término pueda revisarse y justificarse ante una persona experta."},{"question":"En el filtrado de candidatos, ¿qué criterio se suele aplicar para evitar que el ranking se llene de errores tipográficos o coincidencias únicas?","answerOptions":[{"text":"Filtro de frecuencia mínima (umbral).","isCorrect":true,"rationale":"Si una unidad aparece solo una vez, es probable que sea ruido o un error; establecer un umbral de frecuencia mínima asegura representatividad."},{"text":"Filtro de frecuencia máxima.","isCorrect":false,"rationale":"Eliminar palabras muy frecuentes podría quitar términos clave del dominio; lo que se busca es eliminar lo poco frecuente."},{"text":"Ordenamiento por longitud de caracteres.","isCorrect":false,"rationale":"La longitud de la palabra no garantiza su relevancia terminológica en comparación con su frecuencia de uso."},{"text":"Uso exclusivo de diccionarios de la RAE.","isCorrect":false,"rationale":"Los términos especializados a menudo no están en diccionarios generales, por lo que este filtro sería contraproducente."}],"hint":"Se trata de decidir cuántas veces debe aparecer algo para ser 'tomado en serio'."},{"question":"¿Cuál es una limitación reconocida del pipeline de extracción simple cuando se eliminan stopwords antes de crear n-gramas?","answerOptions":[{"text":"Produce candidatos deformados lingüísticamente como 'lingüística corpus'.","isCorrect":true,"rationale":"Al quitar las preposiciones, se pierden los nexos naturales del español, lo que genera términos que requieren interpretación humana adicional."},{"text":"Aumenta demasiado el tiempo de procesamiento del ordenador.","isCorrect":false,"rationale":"Eliminar stopwords en realidad reduce la cantidad de datos y acelera el proceso computacional."},{"text":"Impide que el sistema pueda leer correctamente archivos guardados en formato PDF.","isCorrect":false,"rationale":"El procesamiento lingüístico es independiente de la extensión del archivo, siempre que el texto sea extraído previamente."},{"text":"Hace que todos los términos resultantes sean obligatoriamente unigramas.","isCorrect":false,"rationale":"El sistema sigue permitiendo crear bigramas o trigramas, solo que estos carecerán de las palabras funcionales eliminadas."}],"hint":"Piensa en el 'conflicto profesional' mencionado sobre la forma de los términos multi-palabra."},{"question":"En el contexto de LexiData Solutions, el prototipo debe entregar un 'mini-glosario' que incluya:","answerOptions":[{"text":"Candidatos, frecuencias, puntuación de relevancia y ejemplos de uso.","isCorrect":true,"rationale":"Esta información permite al equipo humano revisar, justificar y decidir qué unidades entran en la base terminológica final."},{"text":"Código fuente en Python y una lista de todas las URLs eliminadas.","isCorrect":false,"rationale":"Aunque el código es necesario para el equipo de PLN, el producto final para los traductores debe ser una tabla de resultados."},{"text":"Una traducción automática completa de todo el corpus especializado.","isCorrect":false,"rationale":"El encargo es de extracción terminológica, no de traducción de documentos."},{"text":"Un ranking de los traductores más eficientes de toda la empresa de traducción.","isCorrect":false,"rationale":"El sistema analiza textos para extraer términos, no evalúa el desempeño del personal humano."}],"hint":"Busca los elementos que componen la tabla final del encargo."}];
  var IM_DATA = {"manual_interactivo":{"header":{"kicker":"Tema 7.","title":"Extracción automática de terminología","subtitle":"Candidatos terminológicos, n-gramas, weidness, KWIC y miniglosarios con Python","meta":"Material teórico | Programación para PLN | Universidad Pontificia Comillas","narrative":"Detectar terminología especializada: de leer documentos a construir candidatos de glosario con Python."},"sections":[{"id":"contexto-profesional","title":"Contexto profesional","blocks":[],"subsections":[{"id":"encargo-apoyar-la-creacion-de-glosarios-en-lexidata-solution","title":"Encargo: apoyar la creación de glosarios en LexiData Solutions","blocks":[{"type":"p","text":"Imagina que formas parte de LexiData Solutions, una empresa especializada en traducción, localización, documentación técnica y gestión terminológica. Sus clientes trabajan en ámbitos institucionales, científicos, jurídicos, sanitarios y tecnológicos. En todos esos sectores aparece el mismo problema: los equipos de traducción y revisión necesitan glosarios fiables, pero los documentos crecen más rápido que la capacidad humana para leerlos desde cero."},{"type":"p","text":"Hasta ahora, la empresa elaboraba muchos glosarios de forma manual. Una terminóloga o un traductor especializado leía documentos, subrayaba unidades importantes, buscaba ejemplos, comprobaba si esas unidades designaban conceptos del dominio y decidía cuáles entraban en la base terminológica. Ese procedimiento sigue siendo necesario, porque la validación terminológica final requiere criterio experto. Pero ya no basta como primer filtro: cada semana llegan manuales, informes, páginas web, memorias institucionales, normativas y documentación multilingüe."},{"type":"p","text":"La dirección de LexiData decide crear un prototipo de apoyo. No quiere una herramienta opaca que sustituya al equipo humano. Quiere una herramienta interpretable que genere una lista priorizada de candidatos a término. El objetivo profesional es ahorrar tiempo en la fase inicial: localizar palabras y expresiones que parecen propias de un dominio especializado para que una persona experta pueda revisarlas."}]},{"id":"el-caso-de-trabajo","title":"El caso de trabajo","blocks":[{"type":"p","text":"El equipo define una simulación de trabajo muy concreta: comparar un corpus especializado con un corpus general. Si una unidad aparece con frecuencia relativa alta en el corpus especializado y aparece poco o nada en el corpus general, puede ser un buen candidato terminológico. Esta idea no garantiza que la unidad sea un término, pero ayuda a priorizar."},{"type":"p","text":"El prototipo se basa en métodos transparentes:"},{"type":"ol","items":["Preparar dos corpus: uno especializado y otro general.","Limpiar y tokenizar los textos.","Extraer unigramas, bigramas y trigramas.","Filtrar candidatos por frecuencia y stopwords.","Calcular frecuencia relativa.","Rankear candidatos mediante una medida contrastiva sencilla, weirdness.","Crear un miniglosario con ejemplos KWIC para facilitar la validación humana."]},{"type":"p","text":"La pregunta profesional no es «¿puede Python saber qué términos son correctos?». La pregunta es más útil: «¿puede Python ordenar indicios para que una especialista revise primero los candidatos más prometedores?»."},{"type":"p","text":"En esta unidad aprenderás a construir esa primera capa de apoyo terminológico. El resultado no será un glosario final, sino una lista razonada de candidatos. La diferencia importa: un candidato puede ser interesante, ruidoso, incompleto o estar deformado por el preprocesamiento. La validación lingüística y terminológica sigue siendo el centro del trabajo."}]}],"navTitle":"Contexto profesional"},{"id":"que-vas-a-aprender-en-esta-unidad","title":"Qué vas a aprender en esta unidad","blocks":[{"type":"p","text":"Al finalizar esta unidad, deberías ser capaz de:"},{"type":"ul","items":["explicar qué es un término y por qué no toda palabra frecuente es terminología;","distinguir entre término, candidato a término, palabra clave y expresión recurrente;","comprender la diferencia entre frecuencia absoluta y frecuencia relativa;","explicar por qué se comparan corpus especializados y corpus generales;","entender qué es un n-grama y por qué muchos términos son multipalabra;","relacionar termhood y unithood con la extracción automática de terminología;","implementar un tokenizador simple y transparente con expresiones regulares;","aplicar stopwords y comprender sus ventajas y riesgos;","extraer unigramas, bigramas y trigramas con Python;","contar frecuencias con Counter;","filtrar candidatos por frecuencia mínima;","calcular weirdness como medida contrastiva;","unificar candidatos de distinta longitud en una tabla común;","depurar candidatos mediante listas negras o heurísticas lingüísticas;","generar ejemplos KWIC para validar candidatos en contexto;","explicar por qué un miniglosario automático necesita revisión humana."]}],"subsections":[],"navTitle":"Qué vas a aprender"},{"id":"mapa-conceptual-de-la-unidad","title":"Mapa conceptual de la unidad","blocks":[{"type":"table","rows":[["Bloque","Concepto lingüístico","Operación en Python","Resultado"],["Corpus especializado","Lenguaje propio de un dominio","Lista de textos o columna textual","Textos del ámbito que interesa"],["Corpus general","Lenguaje de referencia","Lista de textos comparables","Fondo para contrastar"],["Tokenización","Unidad mínima de análisis","simple_tokenize()","Lista de tokens"],["Stopwords","Palabras frecuentes poco informativas","remove_stopwords()","Tokens más orientados a contenido"],["N-gramas","Secuencias de palabras","get_ngrams(tokens, n)","Unigramas, bigramas y trigramas"],["Frecuencia absoluta","Apariciones directas","Counter","Conteos por candidato"],["Frecuencia relativa","Frecuencia normalizada por tamaño","freq / N","Comparación más justa entre corpus"],["Weirdness","Rareza relativa o especificidad de dominio","Cociente entre frecuencias relativas","Ranking contrastivo"],["Heurísticas","Reglas interpretables de depuración","Umbral, blacklist, bordes","Candidatos menos ruidosos"],["KWIC","Contexto de uso","Ventana izquierda/derecha","Ejemplos para validar"]],"title":"Al finalizar esta unidad, deberías ser capaz de"},{"type":"image","src":"img/fig_pipeline.svg","alt":"De los corpus a los candidatos terminológicos","caption":"Figura elaborada a partir del mapa conceptual de la unidad."}],"subsections":[],"navTitle":"Mapa conceptual"},{"id":"1-marco-teorico","title":"1. Marco teórico","blocks":[],"subsections":[{"id":"1-1-que-es-un-termino","title":"1.1. Qué es un término","blocks":[{"type":"p","text":"En terminología, un término no es simplemente una palabra difícil. Un término es una unidad lingüística que designa un concepto dentro de un dominio especializado. Puede ser una sola palabra, como tokenización, o una expresión multipalabra, como modelo de lenguaje, etiquetado morfosintáctico o frecuencia relativa."},{"type":"p","text":"{{cite:cabre1999}}Cabré (1999){{/cite}} entiende la terminología como un campo que conecta lenguaje, conocimiento especializado, comunicación profesional y documentación. Desde esta perspectiva, los términos no existen aislados: funcionan dentro de situaciones comunicativas concretas, comunidades expertas, prácticas de traducción, clasificación conceptual y circulación de conocimiento. {{cite:cabre2003}}Cabré (2003){{/cite}} insiste además en que una teoría de la terminología debe explicar no solo la dimensión conceptual, sino también la lingüística y la comunicativa."},{"type":"p","text":"Esta idea es esencial para PLN. Un sistema automático puede contar formas y detectar patrones, pero no comprende por sí solo el concepto especializado que una unidad designa. Por eso hablamos de candidatos a término. La extracción automática propone unidades que parecen terminológicas; la validación humana decide si realmente lo son."},{"type":"table","rows":[["Unidad","Puede aparecer en un corpus especializado","¿Es necesariamente término?"],["lenguaje","Sí","No siempre: puede ser palabra general"],["modelo de lenguaje","Sí","Muy probablemente en PLN"],["sistema","Sí","Depende del contexto"],["procesamiento del lenguaje natural","Sí","Sí, si designa el campo o técnica"],["paso fundamental","Sí","Normalmente no: expresión descriptiva"]],"title":"Unidad · Puede aparecer en un corpus especializado · ¿Es necesariamente término?"},{"type":"p","text":"La extracción terminológica automática trabaja justo en esta zona intermedia: transforma un corpus en una lista priorizada de unidades que merecen revisión."}]},{"id":"1-2-terminologia-traduccion-y-gestion-del-conocimiento","title":"1.2. Terminología, traducción y gestión del conocimiento","blocks":[{"type":"p","text":"La terminología tiene un papel central en traducción especializada, localización, documentación técnica, normalización y gestión del conocimiento. Un glosario no es solo una lista de palabras: es una herramienta para mantener coherencia conceptual, evitar ambigüedades, facilitar equivalencias multilingües y reducir costes de revisión."},{"type":"p","text":"En un proyecto real, un término puede necesitar:"},{"type":"ul","items":["forma principal;","variantes;","categoría gramatical;","definición;","dominio;","equivalencias en otras lenguas;","ejemplos de uso;","fuente documental;","nota de uso;","estado de validación."]},{"type":"p","text":"El prototipo de esta unidad no crea toda esa ficha terminológica. Produce una primera macroestructura: una lista de candidatos que pueden convertirse en entradas de glosario. Esta distinción está también en herramientas recientes como Termout, que plantea la producción semiautomática de bases terminológicas a partir de procesamiento de corpus, extracción de terminología y posterior población de datos gramaticales y semánticos {{cite:nazar2023}}(Nazar & Acosta, 2023){{/cite}}."},{"type":"p","text":"Para una estudiante de lingüística, esta unidad muestra cómo el PLN puede integrarse en un flujo profesional real: no sustituye la terminología, pero acelera la fase de localización y priorización."}]},{"id":"1-3-extraccion-automatica-de-terminos-ate-y-atr","title":"1.3. Extracción automática de términos: ATE y ATR","blocks":[{"type":"p","text":"La literatura utiliza expresiones como Automatic Term Extraction (ATE), Automatic Term Recognition (ATR) o automatic terminology extraction. En términos generales, se trata de localizar y rankear unidades lingüísticas que son relevantes para describir un dominio especializado. {{cite:kageura1996}}Kageura y Umino (1996){{/cite}} ya planteaban que los métodos de reconocimiento automático de términos deben apoyarse en una comprensión adecuada de la naturaleza de los términos. No basta con contar palabras."},{"type":"p","text":"{{cite:tran2023}}Tran et al. (2023){{/cite}} definen la extracción automática de términos como una tarea de PLN que reduce el esfuerzo de identificar manualmente términos en corpus de dominio, generando listas de candidatos. También señalan que los términos extraídos son útiles para tareas terminográficas y para aplicaciones posteriores como recuperación de información, traducción automática, detección de temas o análisis de opinión."},{"type":"p","text":"La unidad se sitúa dentro de los métodos no supervisados y transparentes. No entrena un clasificador ni usa modelos neuronales. El procedimiento se basa en frecuencia, comparación de corpus, n-gramas y reglas explícitas. Esto es especialmente adecuado para alumnado de Humanidades porque cada decisión puede discutirse."}]},{"id":"1-4-termhood-y-unithood","title":"1.4. Termhood y unithood","blocks":[{"type":"p","text":"Dos conceptos clásicos en extracción terminológica son termhood y unithood. {{cite:kageura1996}}Kageura y Umino (1996){{/cite}} los presentan como dimensiones centrales para reconocer términos."},{"type":"p","text":"Termhood se refiere al grado en que una unidad es propia o relevante para un dominio especializado. Por ejemplo, tokenización puede tener alta termhood en un corpus de PLN porque aparece más en ese dominio que en textos generales."},{"type":"p","text":"Unithood se refiere al grado en que una secuencia de palabras funciona como una unidad estable. Por ejemplo, modelo de lenguaje es más que la suma casual de modelo y lenguaje: es una expresión estable que designa un concepto técnico."},{"type":"table","rows":[["Concepto","Pregunta","Ejemplo"],["Termhood","¿Esta unidad es propia del dominio?","tokenización frente a reunión"],["Unithood","¿Esta secuencia funciona como unidad?","modelo de lenguaje frente a lenguaje necesita"],["Candidato","¿Conviene revisarla como posible término?","traducción automática neuronal"]],"title":"Concepto · Pregunta · Ejemplo"},{"type":"p","text":"El cuaderno de PLN7 trabaja de forma simplificada con ambos conceptos. La comparación entre corpus aproxima termhood. La extracción de bigramas y trigramas aproxima unithood, aunque sin análisis sintáctico profundo."}]},{"id":"1-5-corpus-especializado-y-corpus-general","title":"1.5. Corpus especializado y corpus general","blocks":[{"type":"p","text":"La comparación entre un corpus especializado y un corpus general es una estrategia clásica en extracción de términos. La intuición es sencilla: una unidad terminológica suele aparecer con más densidad en textos del dominio que en textos generales. Esa diferencia permite calcular medidas de especificidad."},{"type":"p","text":"Sin embargo, la comparación solo tiene sentido si los corpus están bien pensados. El corpus especializado debe representar el dominio que se quiere estudiar. El corpus general debe funcionar como fondo de contraste. Si el corpus general es demasiado pequeño, demasiado distinto o temáticamente sesgado, la puntuación puede inflarse o distorsionarse."},{"type":"p","text":"{{cite:verberne2016}}Verberne et al. (2016){{/cite}} muestran que el tamaño de la colección y la importancia de los términos multipalabra afectan de forma clara al rendimiento de métodos de puntuación terminológica. Su estudio también recuerda que los métodos de extracción no se comportan igual en todos los tipos de colección. Esta advertencia encaja con la unidad: en corpus pequeños, los rankings son didácticos, pero pueden ser inestables."},{"type":"p","text":"Por eso, cuando se escribe un informe terminológico, conviene documentar:"},{"type":"ul","items":["qué textos forman el corpus especializado;","qué textos forman el corpus general;","cuántos documentos hay en cada corpus;","cuántos tokens tiene cada corpus;","de qué fechas, géneros y fuentes proceden;","por qué esos textos son comparables;","qué limitaciones tiene la muestra."]}]},{"id":"1-6-frecuencia-absoluta-y-frecuencia-relativa","title":"1.6. Frecuencia absoluta y frecuencia relativa","blocks":[{"type":"p","text":"La frecuencia absoluta es el número de veces que aparece una unidad. Si tokenización aparece 25 veces, su frecuencia absoluta es 25. Esta medida es fácil de entender, pero puede ser engañosa cuando comparamos corpus de distinto tamaño."},{"type":"p","text":"La frecuencia relativa corrige ese problema dividiendo la frecuencia por el tamaño del corpus:"},{"type":"p","text":"frecuencia relativa = frecuencia / total de tokens"},{"type":"p","text":"Si una palabra aparece 25 veces en 10.000 tokens y 25 veces en 100.000 tokens, no tiene el mismo peso. En el primer corpus ocupa una proporción mucho mayor. Por eso, el código de esta unidad calcula N_esp y N_gen, es decir, el tamaño del corpus especializado y del corpus general."},{"type":"p","text":"La frecuencia relativa no resuelve todos los problemas, pero permite una comparación más justa que la frecuencia absoluta. En extracción terminológica, esta normalización es la puerta de entrada a medidas contrastivas como weirdness."}]},{"id":"1-7-weirdness-rareza-relativa-y-especificidad-de-dominio","title":"1.7. Weirdness: rareza relativa y especificidad de dominio","blocks":[{"type":"p","text":"Weirdness es una medida contrastiva. Compara la frecuencia relativa de una unidad en el corpus especializado con su frecuencia relativa en el corpus general. La fórmula didáctica utilizada en la unidad es:"},{"type":"p","text":"`weirdness(t) = (f_esp(t) / N_esp) / ((f_gen(t) / N_gen) + epsilon)`"},{"type":"p","text":"El término epsilon es un número muy pequeño que evita la división entre cero. Si una unidad aparece en el corpus especializado y no aparece en el corpus general, el denominador sería cero. Añadir epsilon permite calcular la puntuación sin romper el programa."},{"type":"p","text":"La idea de rareza o especificidad se relaciona con enfoques contrastivos de extracción de términos, como el weirdness indexing de Ahmad, Gillam y Tostevin (1999), recogido en revisiones de extracción automática de terminología {{cite:heylen2015}}(Heylen & De Hertog, 2015){{/cite}}. También se conecta con la noción de informativeness: una unidad es informativa si ayuda a describir el corpus de dominio mejor que el fondo general."},{"type":"p","text":"Weirdness es fácil de explicar y por eso resulta útil en docencia. Pero también tiene límites:"},{"type":"ul","items":["puede inflar términos que no aparecen en el corpus general;","depende mucho del tamaño de ambos corpus;","no mide estabilidad sintáctica;","no distingue automáticamente términos de nombres propios o expresiones raras;","puede producir rankings inestables en corpus pequeños."]},{"type":"p","text":"La puntuación debe verse como una ayuda para ordenar, no como una validación terminológica."},{"type":"image_modal","src":"img/fig_weirdness.svg","alt":"Weirdness: fórmula didáctica de la unidad","label":"Ver la fórmula desglosada","sub":"Qué mide cada parte de weirdness","caption":"Figura elaborada a partir del apartado 1.7 de la unidad."}]},{"id":"1-8-n-gramas-y-terminos-multipalabra","title":"1.8. N-gramas y términos multipalabra","blocks":[{"type":"p","text":"Un n-grama es una secuencia de n tokens consecutivos. Si n = 1, hablamos de unigramas. Si n = 2, de bigramas. Si n = 3, de trigramas. En terminología, los n-gramas son útiles porque muchos términos no son palabras aisladas:"},{"type":"ul","items":["modelo de lenguaje;","procesamiento del lenguaje natural;","traducción automática neuronal;","etiquetado morfosintáctico;","frecuencia relativa;","corpus paralelo."]},{"type":"p","text":"La extracción de n-gramas es una aproximación simple a los términos multipalabra. No necesita análisis sintáctico, pero puede generar ruido. Si se eliminan stopwords antes de crear n-gramas, modelo de lenguaje puede convertirse en modelo lenguaje. Esa forma puede seguir siendo interpretable, pero no es la forma terminológica natural."},{"type":"p","text":"{{cite:frantzi2000}}Frantzi et al. (2000){{/cite}}, con C-value/NC-value, mostraron la importancia de tratar términos multipalabra y términos anidados. Un término como procesamiento del lenguaje natural contiene unidades menores que también pueden ser candidatas. Los métodos más avanzados intentan ponderar estos casos. En esta unidad no se implementa C-value, pero sí se prepara la intuición: los términos multipalabra son centrales y no basta con contar palabras sueltas."}]},{"id":"1-9-filtrado-frecuencia-minima-stopwords-y-listas-negras","title":"1.9. Filtrado: frecuencia mínima, stopwords y listas negras","blocks":[{"type":"p","text":"La extracción automática genera mucho ruido. Por eso, después de generar candidatos se aplican filtros. Los filtros de esta unidad son sencillos:"},{"type":"ul","items":["frecuencia mínima;","eliminación de stopwords;","longitud mínima;","conversión de n-gramas a texto;","lista negra de unidades demasiado generales."]},{"type":"p","text":"La frecuencia mínima elimina candidatos que solo aparecen una vez. En corpus grandes esto suele mejorar la precisión, aunque puede eliminar términos raros pero importantes. Las stopwords eliminan palabras funcionales frecuentes. La lista negra permite descartar candidatos que la persona analista considera poco útiles para el dominio, como sistema, texto o análisis si aparecen de forma demasiado general."},{"type":"p","text":"{{cite:pazienza2005}}Pazienza et al. (2005){{/cite}} subrayan que la extracción terminológica combina enfoques lingüísticos y estadísticos. Esta unidad sigue esa lógica en versión ligera: las estadísticas ordenan candidatos, pero las heurísticas lingüísticas corrigen ruido."}]},{"id":"1-10-metodos-transparentes-frente-a-metodos-neuronales","title":"1.10. Métodos transparentes frente a métodos neuronales","blocks":[{"type":"p","text":"La extracción terminológica contemporánea incluye métodos basados en reglas, estadística, aprendizaje automático, modelos neuronales y enfoques híbridos. {{cite:tran2023}}Tran et al. (2023){{/cite}} revisan avances recientes, y Blandón Andrade et al. (2026) muestran en un mapeo sistemático que los enfoques híbridos son muy frecuentes en la literatura reciente, combinando componentes lingüísticos y estadísticos."},{"type":"p","text":"Entonces, ¿por qué esta unidad empieza con un método frecuencial? Porque es interpretable. Si un candidato aparece arriba en el ranking, podemos explicar:"},{"type":"ul","items":["cuántas veces aparece en el corpus especializado;","cuántas veces aparece en el corpus general;","cuál es su frecuencia relativa;","qué n-grama lo generó;","qué filtro lo mantuvo;","qué ejemplos KWIC lo respaldan."]},{"type":"p","text":"Para aprender PLN desde Lingüística, esa transparencia es fundamental. Antes de usar modelos más complejos, conviene comprender qué significa representar un texto como tokens, contar n-gramas, normalizar por tamaño y contrastar corpus."}]},{"id":"1-11-kwic-y-validacion-humana","title":"1.11. KWIC y validación humana","blocks":[{"type":"p","text":"KWIC significa Key Word In Context. Una concordancia KWIC muestra una unidad con algunas palabras a la izquierda y a la derecha. En extracción terminológica, KWIC ayuda a decidir si un candidato funciona como término en contexto."},{"type":"p","text":"Por ejemplo, si el candidato es modelo lenguaje, el KWIC puede revelar que la forma real en el texto era modelo de lenguaje y que la preposición se perdió al eliminar stopwords. Si el candidato es traducción automática, el KWIC puede mostrar si aparece como concepto técnico estable o como combinación casual."},{"type":"p","text":"La validación humana debe revisar al menos:"},{"type":"ul","items":["si el candidato designa un concepto especializado;","si la forma está completa;","si hay variantes;","si aparece en contextos coherentes;","si se necesita una definición;","si hay equivalencias o traducciones relevantes;","si el término debe entrar en glosario o solo en una lista de palabras clave."]},{"type":"p","text":"{{cite:nazar2023}}Nazar y Acosta (2023){{/cite}} plantean justamente una producción semiautomática de bases terminológicas: la máquina propone y organiza, pero la terminología final exige decisiones humanas."}]},{"id":"1-12-evaluacion-y-limites-de-la-extraccion-automatica","title":"1.12. Evaluación y límites de la extracción automática","blocks":[{"type":"p","text":"Evaluar una lista de candidatos terminológicos no es trivial. La precisión pregunta cuántos candidatos recuperados son realmente términos. El recall pregunta cuántos términos reales del dominio ha recuperado el sistema. Pero para calcular recall hace falta saber previamente cuáles son todos los términos correctos del corpus, y eso exige una anotación humana muy costosa. En la práctica docente, la evaluación puede empezar con preguntas cualitativas:"},{"type":"ul","items":["¿Los candidatos top parecen propios del dominio?","¿Hay expresiones incompletas?","¿Se han perdido términos raros?","¿El corpus general distorsiona la comparación?","¿El filtrado por stopwords elimina partes necesarias?","¿Los ejemplos KWIC apoyan la interpretación?"]},{"type":"p","text":"Herramientas recientes como TermoUD integran análisis lingüístico con Universal Dependencies y ranking por C-value, mostrando que la investigación actual busca métodos más robustos y multilingües sin perder la corrección lingüística de los candidatos {{cite:marciniak2023}}(Marciniak et al., 2023){{/cite}}. La unidad, en cambio, trabaja una versión inicial: más sencilla, pero suficientemente clara para entender la arquitectura del problema."}]}],"navTitle":"Marco teórico"},{"id":"2-extraccion-automatica-de-terminologia-con-python","title":"2. Extracción automática de terminología con Python","blocks":[],"subsections":[{"id":"2-1-preparar-el-entorno","title":"2.1. Preparar el entorno","blocks":[{"type":"p","text":"La unidad comienza importando librerías ligeras:"},{"type":"code","code":"import re\nfrom collections import Counter, defaultdict\nfrom math import log\nfrom typing import List, Tuple, Dict\nimport pandas as pd"},{"type":"p","text":"re permite usar expresiones regulares para limpiar texto. Counter permite contar tokens y n-gramas. defaultdict se importa como estructura útil para acumulaciones, aunque el pipeline principal puede resolverse con Counter. log queda disponible para métricas que usan logaritmos, aunque la medida central de la unidad es weirdness. List, Tuple y Dict se usan en anotaciones de tipo: ayudan a leer qué recibe y qué devuelve cada función. pandas permite construir tablas de resultados."},{"type":"p","text":"Esta combinación muestra una decisión docente: trabajar con herramientas comprensibles y ejecutables en casi cualquier entorno. El objetivo no es depender de una pila pesada de PLN, sino entender el proceso."}]},{"id":"2-2-representar-los-corpus","title":"2.2. Representar los corpus","blocks":[{"type":"p","text":"El código trabaja con dos listas de textos:"},{"type":"code","code":"corpus_especializado = [\n    \"Texto del dominio especializado...\",\n    \"Otro texto del dominio...\"\n]\n\ncorpus_general = [\n    \"Texto general de contraste...\",\n    \"Otro texto general...\"\n]"},{"type":"p","text":"Cada elemento de la lista representa un documento o fragmento. La separación entre corpus especializado y corpus general es la base del análisis. Si ambos se mezclaran, no podríamos calcular especificidad de dominio."},{"type":"p","text":"En un proyecto real, esas listas podrían venir de archivos .txt, columnas de un .csv, resultados de una extracción web o documentos ya segmentados. El formato de lista es didáctico: permite centrarse en el pipeline sin cargar todavía con lectura de archivos."}]},{"id":"2-3-tokenizacion-simple","title":"2.3. Tokenización simple","blocks":[{"type":"p","text":"La función simple_tokenize convierte un texto en una lista de tokens:"},{"type":"code","code":"def simple_tokenize(text: str) -> List[str]:\n    text = text.lower()\n    text = re.sub(r\"https?://\\S+|www\\.\\S+\", \" \", text)\n    text = re.sub(r\"[^a-záéíóúüñ\\s]\", \" \", text)\n    text = re.sub(r\"\\s+\", \" \", text).strip()\n    tokens = text.split(\" \")\n    tokens = [t for t in tokens if len(t) >= 2]\n    return tokens"},{"type":"p","text":"Primero, el texto pasa a minúsculas. Después se eliminan URLs. La expresión regular r\"[^a-záéíóúüñ\\s]\" reemplaza por espacios todo lo que no sea una letra española básica o un espacio. Esto elimina puntuación, números y símbolos. Luego se colapsan espacios repetidos y se divide por espacios."},{"type":"p","text":"La línea final elimina tokens de un solo carácter. Es una heurística simple para reducir ruido. En otros dominios podría ser problemática: una letra puede ser relevante en química, genética o matemáticas. De nuevo, limpiar es decidir."}]},{"id":"2-4-stopwords-y-filtrado-funcional","title":"2.4. Stopwords y filtrado funcional","blocks":[{"type":"p","text":"La unidad define una lista básica de stopwords en español:"},{"type":"code","code":"STOPWORDS_ES = {\n    \"de\", \"la\", \"que\", \"el\", \"en\", \"y\", \"a\", \"los\", \"del\",\n    \"se\", \"las\", \"por\", \"un\", \"para\", \"con\", \"no\", \"una\"\n}\n\ndef remove_stopwords(tokens: List[str], stopwords=STOPWORDS_ES) -> List[str]:\n    return [t for t in tokens if t not in stopwords]"},{"type":"p","text":"La función recibe una lista de tokens y devuelve otra lista sin palabras funcionales. La comprensión de listas se lee así: conserva cada token t si t no está en stopwords."},{"type":"p","text":"En extracción terminológica, este paso suele mejorar los rankings de unigramas, porque evita que palabras como de, la o que dominen los conteos. Pero para términos multipalabra en español puede generar formas incompletas. Por eso la ampliación de la unidad propone conservar stopwords en el interior de los n-gramas y filtrar solo los bordes."}]},{"id":"2-5-preprocesar-un-corpus-completo","title":"2.5. Preprocesar un corpus completo","blocks":[{"type":"p","text":"La función preprocess_corpus transforma una lista de textos en una lista plana de tokens:"},{"type":"code","code":"def preprocess_corpus(corpus: List[str]) -> List[str]:\n    all_tokens = []\n    for doc in corpus:\n        toks = simple_tokenize(doc)\n        toks = remove_stopwords(toks)\n        all_tokens.extend(toks)\n    return all_tokens"},{"type":"p","text":"all_tokens empieza vacío. El bucle recorre cada documento. Para cada documento, tokeniza, elimina stopwords y añade los tokens a la lista general mediante .extend(). La diferencia entre .append() y .extend() es importante: .append() añadiría la lista completa como un elemento; .extend() añade sus elementos uno a uno."},{"type":"p","text":"Después se aplica a los dos corpus:"},{"type":"code","code":"tokens_esp = preprocess_corpus(corpus_especializado)\ntokens_gen = preprocess_corpus(corpus_general)"},{"type":"p","text":"tokens_esp y tokens_gen son las representaciones limpias sobre las que se calculan frecuencias y n-gramas."}]},{"id":"2-6-extraer-n-gramas","title":"2.6. Extraer n-gramas","blocks":[{"type":"p","text":"La función get_ngrams crea secuencias de n tokens consecutivos:"},{"type":"code","code":"def get_ngrams(tokens: List[str], n: int) -> List[Tuple[str, ...]]:\n    return [tuple(tokens[i:i+n]) for i in range(len(tokens)-n+1)]"},{"type":"p","text":"Si los tokens son [\"modelo\", \"lenguaje\", \"grande\"] y n = 2, el resultado es:"},{"type":"code","code":"[(\"modelo\", \"lenguaje\"), (\"lenguaje\", \"grande\")]"},{"type":"p","text":"Los n-gramas se guardan como tuplas porque una tupla es inmutable y puede usarse como clave en un Counter. Una lista no podría usarse igual porque es mutable."},{"type":"p","text":"Esta función es corta, pero muy potente. Permite generar candidatos de distinta longitud sin escribir tres funciones diferentes."}]},{"id":"2-7-contar-n-gramas-con-counter","title":"2.7. Contar n-gramas con Counter","blocks":[{"type":"p","text":"La función count_ngrams combina extracción y conteo:"},{"type":"code","code":"def count_ngrams(tokens: List[str], n: int) -> Counter:\n    ngrams = get_ngrams(tokens, n)\n    return Counter(ngrams)"},{"type":"p","text":"Después se aplica a ambos corpus y a varios tamaños:"},{"type":"code","code":"freq1_esp = count_ngrams(tokens_esp, 1)\nfreq2_esp = count_ngrams(tokens_esp, 2)\nfreq3_esp = count_ngrams(tokens_esp, 3)\n\nfreq1_gen = count_ngrams(tokens_gen, 1)\nfreq2_gen = count_ngrams(tokens_gen, 2)\nfreq3_gen = count_ngrams(tokens_gen, 3)"},{"type":"p","text":"Los nombres son sistemáticos. freq1_esp significa frecuencias de unigramas en el corpus especializado. freq2_gen significa frecuencias de bigramas en el corpus general. Nombrar bien las variables es parte del trabajo profesional: ayuda a interpretar el código sin perderse."}]},{"id":"2-8-convertir-n-gramas-a-texto","title":"2.8. Convertir n-gramas a texto","blocks":[{"type":"p","text":"Los n-gramas se cuentan como tuplas, pero para mostrarlos en tablas conviene convertirlos en texto:"},{"type":"code","code":"def ngram_to_text(ng: Tuple[str, ...]) -> str:\n    return \" \".join(ng)"},{"type":"p","text":"La función une los elementos de la tupla con espacios. Así, (\"modelo\", \"lenguaje\") se convierte en \"modelo lenguaje\"."},{"type":"p","text":"Esta conversión es necesaria porque la tabla final debe ser legible para una persona terminóloga. El sistema puede trabajar con tuplas; el informe debe presentar formas comprensibles."}]},{"id":"2-9-filtrar-por-frecuencia-minima","title":"2.9. Filtrar por frecuencia mínima","blocks":[{"type":"p","text":"Antes de rankear, el código filtra candidatos poco frecuentes:"},{"type":"code","code":"def filter_by_min_freq(counter: Counter, min_freq: int) -> Dict[str, int]:\n    out = {}\n    for ng, f in counter.items():\n        if f >= min_freq:\n            out[ngram_to_text(ng)] = f\n    return out"},{"type":"p","text":"La función recorre un Counter. Si la frecuencia f alcanza el umbral min_freq, convierte el n-grama a texto y lo guarda en un diccionario."},{"type":"p","text":"Después se aplica por separado:"},{"type":"code","code":"cand1_esp = filter_by_min_freq(freq1_esp, min_freq=2)\ncand2_esp = filter_by_min_freq(freq2_esp, min_freq=2)\ncand3_esp = filter_by_min_freq(freq3_esp, min_freq=2)"},{"type":"p","text":"El umbral 2 es didáctico. En corpus reales, podría ser 3, 5 o más, según tamaño y objetivo. Subir el umbral aumenta precisión pero puede perder candidatos raros. Bajar el umbral aumenta cobertura pero introduce más ruido."}]},{"id":"2-10-calcular-tamanos-de-corpus-y-frecuencia-relativa","title":"2.10. Calcular tamaños de corpus y frecuencia relativa","blocks":[{"type":"p","text":"El tamaño de cada corpus se calcula con len():"},{"type":"code","code":"N_esp = len(tokens_esp)\nN_gen = len(tokens_gen)"},{"type":"p","text":"Después se define una función para frecuencia relativa:"},{"type":"code","code":"def rel_freq(freq: int, N: int) -> float:\n    return freq / N if N > 0 else 0.0"},{"type":"p","text":"La condición evita dividir entre cero. Si N es 0, devuelve 0.0. Esta precaución parece pequeña, pero enseña una práctica importante: el código debe prever datos vacíos o mal preparados."},{"type":"p","text":"La frecuencia relativa permite comparar unidades aunque los corpus tengan tamaños distintos. Sin esta normalización, un corpus más grande tendería a producir frecuencias absolutas mayores simplemente por su tamaño."}]},{"id":"2-11-calcular-weirdness","title":"2.11. Calcular weirdness","blocks":[{"type":"p","text":"La función central del ranking es compute_weirdness:"},{"type":"code","code":"def compute_weirdness(\n    cand_esp: Dict[str, int],\n    freq_gen_counter: Counter,\n    N_esp: int,\n    N_gen: int,\n    epsilon: float = 1e-9\n) -> pd.DataFrame:\n    rows = []\n    gen_text_freq = {ngram_to_text(k): v for k, v in freq_gen_counter.items()}\n\n    for term, f_esp in cand_esp.items():\n        f_gen = gen_text_freq.get(term, 0)\n        r_esp = rel_freq(f_esp, N_esp)\n        r_gen = rel_freq(f_gen, N_gen)\n        w = r_esp / (r_gen + epsilon)\n        rows.append((term, f_esp, r_esp, f_gen, r_gen, w))\n\n    df = pd.DataFrame(rows, columns=[\"term\", \"freq_esp\", \"rel_esp\", \"freq_gen\", \"rel_gen\", \"weirdness\"])\n    df = df.sort_values(\"weirdness\", ascending=False).reset_index(drop=True)\n    return df"},{"type":"p","text":"La función recibe candidatos del corpus especializado y frecuencias del corpus general. Primero convierte las claves del Counter general a texto para poder compararlas con los candidatos. Luego calcula frecuencia absoluta, frecuencia relativa y weirdness para cada término."},{"type":"p","text":"La salida es un DataFrame. Sus columnas son:"},{"type":"table","rows":[["Columna","Significado"],["term","Candidato a término"],["freq_esp","Frecuencia absoluta en corpus especializado"],["rel_esp","Frecuencia relativa en corpus especializado"],["freq_gen","Frecuencia absoluta en corpus general"],["rel_gen","Frecuencia relativa en corpus general"],["weirdness","Puntuación contrastiva"]],"title":"La salida es un DataFrame. Sus columnas son"},{"type":"p","text":"La tabla se ordena de mayor a menor weirdness. Eso permite revisar primero los candidatos más característicos del corpus especializado según esta medida."}]},{"id":"2-12-aplicar-weirdness-a-unigramas-bigramas-y-trigramas","title":"2.12. Aplicar weirdness a unigramas, bigramas y trigramas","blocks":[{"type":"p","text":"La función se aplica tres veces:"},{"type":"code","code":"df_uni = compute_weirdness(cand1_esp, freq1_gen, N_esp, N_gen)\ndf_bi = compute_weirdness(cand2_esp, freq2_gen, N_esp, N_gen)\ndf_tri = compute_weirdness(cand3_esp, freq3_gen, N_esp, N_gen)"},{"type":"p","text":"Cada tabla contiene candidatos de una longitud distinta. df_uni contiene unigramas, df_bi bigramas y df_tri trigramas."},{"type":"p","text":"Separar primero por longitud ayuda a observar diferencias. Los unigramas suelen ser más frecuentes, pero pueden ser más ambiguos. Los bigramas y trigramas suelen ser más informativos, pero aparecen menos. En terminología, muchas unidades relevantes son multipalabra, así que no conviene quedarse solo con unigramas."}]},{"id":"2-13-unificar-candidatos-de-distinta-longitud","title":"2.13. Unificar candidatos de distinta longitud","blocks":[{"type":"p","text":"Para crear un ranking general se añade una columna n:"},{"type":"code","code":"def add_ngram_size(df: pd.DataFrame, n: int) -> pd.DataFrame:\n    df = df.copy()\n    df[\"n\"] = n\n    return df"},{"type":"p","text":"df.copy() evita modificar el DataFrame original. La columna n indica si el candidato procede de unigramas, bigramas o trigramas. Después se concatenan las tablas:"},{"type":"code","code":"df_all = pd.concat([\n    add_ngram_size(df_uni, 1),\n    add_ngram_size(df_bi, 2),\n    add_ngram_size(df_tri, 3),\n], ignore_index=True)\n\ndf_all_sorted = df_all.sort_values(\"weirdness\", ascending=False).reset_index(drop=True)"},{"type":"p","text":"pd.concat une varias tablas. ignore_index=True crea un índice nuevo. La ordenación final produce una lista única de candidatos."}]},{"id":"2-14-refinar-con-una-lista-negra","title":"2.14. Refinar con una lista negra","blocks":[{"type":"p","text":"La unidad incorpora una heurística simple:"},{"type":"code","code":"BLACKLIST = {\n    \"paso\", \"importante\", \"sistema\", \"cantidad\",\n    \"texto\", \"comparación\", \"corpus\", \"uso\", \"métricas\"\n}\n\ndef contains_blacklisted(term: str, blacklist=BLACKLIST) -> bool:\n    toks = term.split()\n    return all(t in blacklist for t in toks)"},{"type":"p","text":"La función divide el candidato en palabras y comprueba si todas están en la lista negra. Si todas son demasiado generales, el candidato se elimina:"},{"type":"code","code":"df_clean = df_all_sorted[\n    ~df_all_sorted[\"term\"].apply(contains_blacklisted)\n].reset_index(drop=True)"},{"type":"p","text":"El símbolo ~ niega la condición. Es decir, conserva las filas para las que contains_blacklisted es falso."},{"type":"p","text":"Esta heurística no es universal. En un dominio, corpus puede ser un término válido; en otro, puede ser demasiado general. La lista negra debe ajustarse al dominio y justificarse."}]},{"id":"2-15-construir-kwic-para-candidatos","title":"2.15. Construir KWIC para candidatos","blocks":[{"type":"p","text":"La función KWIC busca una secuencia exacta dentro de tokens:"},{"type":"code","code":"def kwic(tokens: List[str], term_tokens: List[str], window: int = 5, max_examples: int = 5) -> List[str]:\n    examples = []\n    n = len(term_tokens)\n    for i in range(len(tokens) - n + 1):\n        if tokens[i:i+n] == term_tokens:\n            left = \" \".join(tokens[max(0, i-window):i])\n            hit = \" \".join(tokens[i:i+n])\n            right = \" \".join(tokens[i+n:i+n+window])\n            examples.append(f\"{left} >>{hit}<< {right}\".strip())\n            if len(examples) >= max_examples:\n                break\n    return examples"},{"type":"p","text":"term_tokens es la forma del candidato separada en palabras. Si el candidato es modelo lenguaje, term_tokens será [\"modelo\", \"lenguaje\"]. La función recorre todas las posiciones posibles y compara segmentos de longitud n."},{"type":"p","text":"Cuando encuentra una coincidencia, toma contexto izquierdo y derecho. El término aparece marcado entre >> y <<. Este formato permite localizar visualmente el candidato dentro de su entorno."},{"type":"p","text":"El KWIC ayuda a pasar del ranking automático a la validación terminológica. Un candidato con score alto pero contextos extraños debe revisarse con cautela."}]},{"id":"2-16-crear-un-miniglosario-automatico","title":"2.16. Crear un miniglosario automático","blocks":[{"type":"p","text":"La función build_mini_glossary transforma el ranking en una tabla más útil:"},{"type":"code","code":"def build_mini_glossary(df_ranked: pd.DataFrame, tokens_esp: List[str], top_n: int = 15) -> pd.DataFrame:\n    rows = []\n    for _, row in df_ranked.head(top_n).iterrows():\n        term = row[\"term\"]\n        term_tokens = term.split()\n        examples = kwic(tokens_esp, term_tokens, window=5, max_examples=3)\n        rows.append({\n            \"term\": term,\n            \"n\": row[\"n\"],\n            \"weirdness\": row[\"weirdness\"],\n            \"freq_esp\": row[\"freq_esp\"],\n            \"freq_gen\": row[\"freq_gen\"],\n            \"kwic_examples\": examples\n        })\n    return pd.DataFrame(rows)"},{"type":"p","text":"La función recorre los primeros candidatos del ranking. Para cada candidato, recupera su tamaño, puntuación, frecuencias y ejemplos KWIC. El resultado es una tabla que se parece más a una primera ficha de glosario."},{"type":"p","text":"No es una base terminológica final. Le faltan definiciones, equivalencias, variantes, notas y validación. Pero sí ofrece una estructura inicial muy útil para una terminóloga."}]},{"id":"2-17-imprimir-el-glosario-de-forma-legible","title":"2.17. Imprimir el glosario de forma legible","blocks":[{"type":"p","text":"La función print_glossary prepara una salida más fácil de leer:"},{"type":"code","code":"def print_glossary(glossary_df: pd.DataFrame):\n    for i, row in glossary_df.iterrows():\n        print(f\"#{i+1} {row['term']} (n={row['n']})\")\n        print(f\"weirdness={row['weirdness']:.2f} | esp={row['freq_esp']} | gen={row['freq_gen']}\")\n        for ex in row[\"kwic_examples\"]:\n            print(\"-\", ex)"},{"type":"p","text":"iterrows() recorre las filas del DataFrame. Las cadenas con f\"...\" permiten insertar valores de variables dentro del texto. La expresión {row['weirdness']:.2f} muestra la puntuación con dos decimales."},{"type":"p","text":"La presentación importa. Una lista terminológica no solo debe calcularse; debe leerse. Si el equipo humano no entiende la salida, no podrá validarla."}]},{"id":"2-18-conservar-stopwords-dentro-de-terminos","title":"2.18. Conservar stopwords dentro de términos","blocks":[{"type":"p","text":"La ampliación opcional introduce una mejora metodológica: no eliminar stopwords antes de crear n-gramas, pero sí filtrar candidatos que empiezan o terminan con stopword."},{"type":"p","text":"La razón es lingüística. En español, muchos términos multipalabra incluyen conectores internos:"},{"type":"ul","items":["modelo de lenguaje;","procesamiento del lenguaje natural;","extracción de términos;","lingüística de corpus;","análisis de colocaciones."]},{"type":"p","text":"Si eliminamos de, del o la antes de formar n-gramas, el candidato queda truncado. La ampliación propone:"},{"type":"code","code":"def ngram_good_edges(ng_text: str, stopwords=STOPWORDS_ES) -> bool:\n    toks = ng_text.split()\n    return (toks[0] not in stopwords) and (toks[-1] not in stopwords)"},{"type":"p","text":"La función acepta candidatos que no empiezan ni terminan con stopword, aunque puedan contener stopwords en el interior. Es una heurística simple y bastante realista para español."},{"type":"p","text":"Esta mejora muestra una lección central: el preprocesamiento no es una receta fija. Debe adaptarse al objetivo lingüístico. Para unigramas, eliminar stopwords puede ser razonable. Para términos multipalabra, conservar algunas puede ser necesario."}]},{"id":"2-19-como-leer-los-resultados-sin-adelantar-la-practica","title":"2.19. Cómo leer los resultados sin adelantar la práctica","blocks":[{"type":"p","text":"Antes de aplicar el código en clase, el alumnado debe saber cómo leer sus salidas:"},{"type":"ul","items":["Un ranking alto indica prioridad de revisión, no verdad terminológica.","Una frecuencia alta puede deberse a repetición temática, no necesariamente a valor terminológico.","Un candidato multipalabra puede estar incompleto por la limpieza.","Un término raro puede quedar fuera si el umbral de frecuencia es alto.","Un corpus general pequeño puede inflar weirdness.","El KWIC debe revisarse antes de aceptar una entrada de glosario."]},{"type":"p","text":"El informe profesional debe formular resultados con prudencia. En vez de escribir «estos son los términos del dominio», es mejor escribir «estos son candidatos priorizados por frecuencia relativa y contraste con corpus general». Esa frase es más larga, pero mucho más correcta."}]}],"navTitle":"Python para PLN"},{"id":"errores-frecuentes-de-aprendizaje","title":"Errores frecuentes de aprendizaje","blocks":[{"type":"ul","items":["Confundir término con palabra frecuente.","Pensar que weirdness valida automáticamente una entrada terminológica.","Comparar frecuencias absolutas entre corpus de tamaños distintos.","Olvidar que un corpus general pequeño puede inflar puntuaciones.","Eliminar stopwords antes de formar n-gramas sin revisar si se deforman términos en español.","Creer que todos los términos relevantes aparecen muchas veces.","No distinguir unigramas, bigramas y trigramas al interpretar rankings.","Aceptar candidatos sin mirar ejemplos KWIC.","Usar una lista negra sin justificarla.","Presentar un miniglosario automático como glosario final validado."]}],"subsections":[],"navTitle":"Errores frecuentes"},{"id":"sintesis-final","title":"Síntesis final","blocks":[{"type":"p","text":"Esta unidad introduce la extracción automática de terminología como una tarea de apoyo al trabajo terminológico humano. El objetivo no es que Python decida por sí solo qué unidades son términos, sino que genere candidatos razonables a partir de datos observables."},{"type":"p","text":"El marco teórico ha mostrado que la terminología combina lengua, conocimiento especializado y comunicación profesional. También ha situado la extracción automática en una tradición de investigación que distingue termhood, unithood, frecuencia, especificidad, n-gramas, C-value/NC-value, weirdness y validación humana."},{"type":"p","text":"La parte de Python enseña un pipeline transparente: preparar corpus, tokenizar, filtrar stopwords, extraer n-gramas, contar frecuencias, normalizar por tamaño, calcular weirdness, unificar rankings, depurar candidatos y generar ejemplos KWIC. Cada bloque produce una representación distinta del corpus y exige decisiones lingüísticas."},{"type":"p","text":"El aprendizaje más importante es metodológico: una lista automática de candidatos no es un glosario. Es una herramienta de priorización. Su valor depende de la calidad de los corpus, de los filtros, de las métricas y de la revisión experta."}],"subsections":[],"navTitle":"Síntesis"},{"id":"cierre-narrativo","title":"Cierre narrativo","blocks":[{"type":"p","text":"Al terminar la simulación, LexiData Solutions no entrega al cliente una base terminológica cerrada. Entrega un primer detector de candidatos: transparente, explicable y revisable. El equipo puede enseñar por qué un candidato aparece arriba en el ranking, cuántas veces aparece en el corpus especializado, si aparece en el corpus general y qué contextos KWIC lo respaldan."},{"type":"p","text":"La terminóloga humana sigue tomando la decisión final. Pero ahora no empieza desde una página en blanco. Tiene una lista priorizada, ejemplos de uso y una justificación cuantitativa inicial. Esa es la aportación real del PLN en este escenario: no sustituir la lectura experta, sino hacerla más eficiente, más trazable y más documentada."},{"type":"p","text":"En el aula, los casos prácticos permitirán modificar umbrales, sustituir corpus y discutir qué candidatos merecen entrar en un glosario. Este manual te prepara para leer el código antes de hacerlo: entender qué mide cada función, qué presupone cada filtro y qué tipo de afirmación puede sostener cada salida."}],"subsections":[],"navTitle":"Cierre narrativo"}],"references":[{"key":"ahmad1999","text":"Ahmad, K., Gillam, L. y Tostevin, L. (1999). Weirdness indexing for logical document extrapolation and retrieval (WILDER). In E. M. Voorhees & D. K. Harman (Eds.), *The Eighth Text Retrieval Conference (TREC-8)* (pp. 717-724). National Institute of Standards and Technology."},{"key":"blandonandrade2026","text":"Blandón Andrade, J. C., Medina Otálvaro, C. M., Zapata Jaramillo, C. M. y Morales Ríos, A. (2026). Approaches, tools, algorithms, and methods for automatic term extraction: A systematic literature mapping. *Journal of Intelligent & Fuzzy Systems, 50*(6), 1803-1823. https://doi.org/10.1177/18758967251392652"},{"key":"cabre1999","text":"Cabré, M. T. (1999). *Terminology: Theory, methods and applications*. John Benjamins. https://doi.org/10.1075/tlrp.1"},{"key":"cabre2003","text":"Cabré, M. T. (2003). Theories of terminology: Their description, prescription and explanation. *Terminology, 9*(2), 163-199. https://doi.org/10.1075/term.9.2.03cab"},{"key":"frantzi2000","text":"Frantzi, K. T., Ananiadou, S. y Mima, H. (2000). Automatic recognition of multi-word terms: The C-value/NC-value method. *International Journal on Digital Libraries, 3*(2), 115-130. https://doi.org/10.1007/s007999900023"},{"key":"heylen2015","text":"Heylen, K. y De Hertog, D. (2015). Automatic term extraction. En H. J. Kockaert y F. Steurs (Eds.), *Handbook of terminology* (Vol. 1). John Benjamins. https://doi.org/10.1075/hot.1.aut1"},{"key":"kageura1996","text":"Kageura, K. y Umino, B. (1996). Methods of automatic term recognition: A review. *Terminology, 3*(2), 259-289. https://doi.or   function sha256Hex(text) {
    var enc = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", enc).then(function(buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function(b) {
        return b.toString(16).padStart(2, "0");
      }).join("");
    });
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function startQuiz() {
    var fromManual = shuffle(QUIZ_MANUAL).slice(0, 5);

    quizState = { questions: shuffle(fromManual.concat(fromCuaderno)), index: 0, score: 0 };
    renderQuizQuestion();
  }

  function renderQuizQuestion() {
    var root = document.getElementById("quiz-root");
    var total = quizState.questions.length;
    if (quizState.index >= total) {
      root.innerHTML =
        '<div class="quiz-result">' +
        '<div class="quiz-score">' + quizState.score + ' / ' + total + '</div>' +
        '<p>Puntuación de este intento.</p>' +
        '<button class="quiz-btn" id="quiz-retry">Volver a intentar</button>' +
        '</div>';
      document.getElementById("quiz-retry").addEventListener("click", startQuiz);
      return;
    }
    var q = quizState.questions[quizState.index];
    var opts = shuffle(q.answerOptions);
    var html = '<div class="quiz-progress">Pregunta ' + (quizState.index + 1) + ' de ' + total + ' · Puntuación provisional: ' + quizState.score + '</div>';
    html += '<div class="quiz-q"><h3>' + q.question + '</h3>';
    opts.forEach(function(opt, i) {
      html += '<button class="quiz-opt" data-idx="' + i + '">' + opt.text + '</button>';
    });
    html += '<div class="quiz-feedback" id="quiz-feedback" hidden></div>';
    html += '</div>';
    root.innerHTML = html;
    var buttons = root.querySelectorAll(".quiz-opt");
    buttons.forEach(function(btn, i) {
      btn.addEventListener("click", function() {
        buttons.forEach(function(b) { b.disabled = true; });
        var chosen = opts[i];
        if (chosen.isCorrect) { btn.classList.add("correct"); quizState.score++; }
        else {
          btn.classList.add("incorrect");
          buttons.forEach(function(b2, j) { if (opts[j].isCorrect) b2.classList.add("correct"); });
        }
        var fb = document.getElementById("quiz-feedback");
        fb.hidden = false;
        fb.textContent = chosen.rationale || (chosen.isCorrect ? "Correcto." : "Incorrecto.");
        var next = document.createElement("button");
        next.className = "quiz-btn";
        next.style.marginTop = "14px";
        next.textContent = quizState.index + 1 < total ? "Siguiente" : "Ver puntuación";
        next.addEventListener("click", function() { quizState.index++; renderQuizQuestion(); });
        root.querySelector(".quiz-q").appendChild(next);
      });
    });
  }

  function imFormatInline(raw) {
    var re = /{{cite:([^}]*)}}([\s\S]*?){{\/cite}}/g;
    var out = "", last = 0, m;
    while ((m = re.exec(raw))) {
      out += imFormatBackticks(raw.slice(last, m.index));
      out += '<span class="im-cite" data-refs="' + m[1] + '">' + imFormatBackticks(m[2]) + ' <span aria-hidden="true">ⓘ</span></span>';
      last = re.lastIndex;
    }
    out += imFormatBackticks(raw.slice(last));
    return out;
  }
  function imLinkify(text) {
    var re = /(https?:\/\/[^\s]+)/g;
    var out = "", last = 0, m;
    while ((m = re.exec(text))) {
      out += imEsc(text.slice(last, m.index));
      var url = m[1].replace(/[.,;]+$/, "");
      out += '<a href="' + imEsc(url) + '" target="_blank" rel="noopener">' + imEsc(url) + "</a>";
      last = m.index + url.length;
    }
    out += imEsc(text.slice(last));
    return out;
  }
  function imBibText(text) {
    // *word* marks an APA-italicized container title (book/journal name+volume/etc.)
    return text.split(/(\*[^*]+\*)/g).map(function(part) {

        return "<em>" + imLinkify(part.slice(1, -1)) + "</em>";
      }
      return imLinkify(part);
    }).join("");
  }
