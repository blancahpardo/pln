<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tema 7 — PLN</title>
<style>

:root {
  --azul: #003B5C;
  --azul-d: #00283F;
  --amar: #F4C542;
  --gris: #34484F;
  --claro: #F3F3F4;
  --humo: #9FB1BA;
  --verde: #2E7D32;
  --rojo: #B00020;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: var(--gris); background:#fff; }
a { color: inherit; }

#gate { position:fixed; inset:0; background:var(--azul); display:flex; align-items:center; justify-content:center; padding:24px; z-index:999; }
#gate .box { max-width:380px; width:100%; text-align:center; }
#gate .kicker { color:var(--amar); font-size:12px; font-weight:bold; letter-spacing:2.5px; text-transform:uppercase; margin-bottom:10px; }
#gate h1 { color:#fff; font-size:26px; margin:0 0 10px; }
#gate p { color:var(--humo); font-size:14px; margin:0 0 26px; }
#gate input { width:100%; padding:13px 16px; border-radius:8px; border:none; font-size:15px; font-family:Arial,Helvetica,sans-serif; margin-bottom:14px; outline:2px solid transparent; }
#gate input:focus { outline:2px solid var(--amar); }
#gate button.submit { width:100%; padding:13px 16px; border-radius:8px; border:none; background:var(--amar); color:var(--azul-d); font-size:15px; font-weight:bold; font-family:Arial,Helvetica,sans-serif; cursor:pointer; }
#gate button.submit:hover { filter:brightness(1.06); }
#gate .error { color:#FFB3B3; font-size:13px; margin-top:12px; min-height:18px; }
#page { display:none; }
main { max-width:980px; margin:0 auto; padding:48px 6vw 60px; }
.kicker { color:var(--amar); font-size:12px; font-weight:bold; letter-spacing:2.5px; text-transform:uppercase; margin-bottom:8px; }
.view > h1 { color:var(--azul); font-size:32px; margin:0 0 34px; }
.hub-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; margin-bottom:30px; }
.hub-btn { display:flex; flex-direction:column; align-items:flex-start; gap:6px; background:var(--claro); border:none; border-radius:12px; padding:26px 22px; cursor:pointer; text-align:left; box-shadow:0 2px 10px rgba(159,177,186,.28); font-family:Arial,Helvetica,sans-serif; position:relative; }
.hub-btn:hover { background:#E9ECEE; }
.hub-icon { font-size:30px; margin-bottom:4px; }
.hub-label { font-size:17px; font-weight:bold; color:var(--azul); }
.hub-desc { font-size:12.5px; color:var(--humo); }
.back-home { font-size:13px; color:var(--humo); text-decoration:none; }
.back-home:hover { color:var(--azul); }
.sub-view h2 { color:var(--azul); font-size:24px; margin:18px 0 4px; }
.sub-view .section-note { font-size:13px; color:var(--humo); margin:0 0 24px; }
.back-btn { background:none; border:1.5px solid var(--azul); color:var(--azul); font-size:13px; font-weight:bold; padding:6px 14px; border-radius:20px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.back-btn:hover { background:var(--azul); color:#fff; }
.dl-big { display:inline-block; background:var(--amar); color:var(--azul-d); font-weight:bold; font-size:14px; text-decoration:none; padding:10px 20px; border-radius:20px; margin-bottom:18px; }
.pdf-frame { width:100%; height:78vh; border:none; border-radius:8px; box-shadow:0 2px 10px rgba(159,177,186,.28); }
.img-frame { display:block; width:100%; height:auto; border-radius:8px; box-shadow:0 2px 10px rgba(159,177,186,.28); }
.ref-intro { color:var(--azul); font-size:16px; margin:0 0 16px; }
.ref-item { font-size:13.5px; color:var(--gris); line-height:1.6; margin:0 0 16px; padding-left:28px; text-indent:-28px; }
.ref-item a { color:var(--azul); word-break:break-all; }
.ref-item em { font-style:italic; }
.notice { font-size:12px; color:var(--humo); font-style:italic; margin-top:10px; }
/* quiz */
.quiz-start { background:var(--claro); border-radius:12px; padding:26px; }
.quiz-start p { font-size:14px; margin:0 0 18px; }
.quiz-btn { background:var(--azul); color:#fff; border:none; border-radius:20px; padding:11px 22px; font-size:14px; font-weight:bold; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.quiz-btn:hover { filter:brightness(1.15); }
.quiz-progress { font-size:12px; color:var(--humo); margin-bottom:6px; }
.quiz-q { background:var(--claro); border-radius:12px; padding:24px; margin-bottom:18px; }
.quiz-q h3 { color:var(--azul); font-size:17px; margin:0 0 18px; }
.quiz-opt { display:block; width:100%; text-align:left; background:#fff; border:1.5px solid var(--humo); border-radius:8px; padding:12px 16px; margin-bottom:10px; font-size:14px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; color:var(--gris); }
.quiz-opt:hover { border-color:var(--azul); }
.quiz-opt.correct { border-color:var(--verde); background:#EAF6EB; font-weight:bold; }
.quiz-opt.incorrect { border-color:var(--rojo); background:#FBEAEC; }
.quiz-opt[disabled] { cursor:default; }
.quiz-feedback { font-size:13px; color:var(--gris); background:#fff; border-radius:8px; padding:12px 16px; margin-top:4px; margin-bottom:16px; border-left:3px solid var(--azul); }
.quiz-score { font-size:26px; font-weight:bold; color:var(--azul); margin-bottom:8px; }
.quiz-result { background:var(--claro); border-radius:12px; padding:30px; text-align:center; }
/* interactive manual */
.im-root { margin-top:0; }
.im-hero { position:relative; background:linear-gradient(135deg, var(--azul) 0%, var(--azul-d) 100%); border-radius:16px; padding:34px 26px 30px; margin-bottom:22px; overflow:hidden; }
.im-hero::before { content:""; position:absolute; top:-46px; right:-46px; width:190px; height:190px; border-radius:50%; background:rgba(244,197,66,.12); }
.im-hero::after { content:""; position:absolute; bottom:-60px; left:30%; width:160px; height:160px; border-radius:50%; background:rgba(255,255,255,.05); }
.im-hero-dl { position:absolute; top:16px; right:16px; background:var(--amar); color:var(--azul-d); border:none; border-radius:20px; padding:9px 16px; font-size:12px; font-weight:bold; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:6px; font-family:Arial,Helvetica,sans-serif; z-index:1; }
.im-hero-dl:hover { filter:brightness(1.08); }
.im-hero-kicker { color:var(--amar); font-size:12.5px; font-weight:bold; letter-spacing:.4px; margin:0 0 8px; position:relative; z-index:1; }
.im-hero-title { color:#fff; font-size:clamp(21px,3.2vw,30px); line-height:1.28; margin:0; max-width:620px; position:relative; z-index:1; }
.im-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
.im-card { text-align:left; background:var(--claro); border:none; border-radius:12px; padding:20px 20px 18px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; box-shadow:0 2px 10px rgba(159,177,186,.28); transition:transform .12s ease, background .12s ease; opacity:0; transform:translateY(10px); animation:imCardIn .35s ease forwards; }
.im-card:hover { background:#E9ECEE; transform:translateY(-2px); }
.im-card.im-card-bib { background:var(--azul); }
.im-card.im-card-bib .im-card-title, .im-card.im-card-bib .im-card-meta { color:#fff; }
.im-card-icon { font-size:24px; }
.im-card-title { display:block; font-size:16px; font-weight:bold; color:var(--azul); line-height:1.3; margin-top:10px; }
.im-card-meta { display:block; font-size:12px; color:var(--humo); margin-top:6px; }
@keyframes imCardIn { to { opacity:1; transform:translateY(0); } }
.im-rail { display:flex; gap:6px; overflow-x:auto; padding:2px 2px 14px; margin-bottom:18px; border-bottom:1px solid #E3E7E9; }
.im-rail-btn { flex:none; display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; cursor:pointer; padding:6px 9px; border-radius:10px; font-family:Arial,Helvetica,sans-serif; opacity:.5; transition:opacity .15s ease, background .15s ease; }
.im-rail-btn:hover { opacity:.85; }
.im-rail-btn.active { opacity:1; background:var(--claro); }
.im-rail-icon { font-size:16px; }
.im-rail-label { font-size:9.5px; font-weight:bold; color:var(--gris); max-width:62px; text-align:center; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.im-rail-btn.active .im-rail-label { color:var(--azul); }
.im-chapter { animation:imFadeIn .25s ease; }
@keyframes imFadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
.im-crumb { background:none; border:none; color:var(--humo); font-size:13px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; padding:0; margin-bottom:16px; text-decoration:underline; }
.im-crumb:hover { color:var(--azul); }
.im-chapter-title { color:var(--azul); font-size:23px; margin:0 0 16px; }
.im-block-p { font-size:14.5px; line-height:1.7; color:var(--gris); margin:0 0 14px; }
.im-block-ul, .im-block-ol { margin:0 0 14px; padding-left:22px; }
.im-block-ul li, .im-block-ol li { font-size:14.5px; line-height:1.65; color:var(--gris); margin-bottom:6px; }
.im-sub { border-top:1px solid #E3E7E9; }
.im-sub:first-child { border-top:none; }
.im-sub-head { width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; background:none; border:none; text-align:left; padding:16px 4px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.im-sub-head:hover .im-sub-title { color:var(--azul-d); }
.im-sub-title { font-size:15.5px; font-weight:bold; color:var(--azul); }
.im-sub-arrow { color:var(--humo); font-size:13px; transition:transform .15s ease; flex:none; }
.im-sub.open .im-sub-arrow { transform:rotate(90deg); }
.im-sub-body { max-height:0; overflow:hidden; padding:0 4px; transition:max-height .3s ease; }
.im-sub.open .im-sub-body { max-height:none; padding-bottom:14px; }
.im-code-toggle { display:inline-flex; align-items:center; gap:6px; background:#fff; border:1.5px dashed var(--humo); color:var(--azul); font-size:12.5px; font-weight:bold; border-radius:20px; padding:7px 14px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; margin:2px 0 14px; }
.im-code-toggle:hover { border-color:var(--azul); }
.im-code-box { display:none; background:#F2F4F5; border-radius:8px; padding:14px 16px; margin:0 0 14px; overflow-x:auto; animation:imFadeIn .2s ease; }
.im-code-box.open { display:block; }
.im-code-box pre { margin:0; font-family:"Courier New",monospace; font-size:13px; line-height:1.55; color:#1c2a30; white-space:pre-wrap; word-break:break-word; }
.im-table-toggle { display:inline-flex; align-items:center; gap:6px; background:#fff; border:1.5px solid var(--azul); color:var(--azul); font-size:12.5px; font-weight:bold; border-radius:20px; padding:7px 14px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; margin:2px 0 14px; }
.im-table-toggle:hover { background:var(--azul); color:#fff; }
.im-table-bare { overflow-x:auto; margin:0 0 16px; border-radius:8px; box-shadow:0 2px 10px rgba(159,177,186,.28); }
.im-table-bare table, .im-modal table { border-collapse:collapse; width:100%; font-size:13px; }
.im-table-bare th, .im-modal th { background:var(--azul); color:#fff; text-align:left; padding:9px 12px; font-size:12.5px; }
.im-table-bare td, .im-modal td { padding:9px 12px; border-bottom:1px solid #E3E7E9; color:var(--gris); }
.im-table-bare tr:nth-child(even) td, .im-modal tr:nth-child(even) td { background:var(--claro); }
.im-modal-overlay { position:fixed; inset:0; background:rgba(10,20,26,.55); display:flex; align-items:center; justify-content:center; padding:5vh 4vw; z-index:500; animation:imFadeIn .15s ease; }
.im-modal { background:#fff; border-radius:14px; max-width:760px; width:100%; max-height:90vh; display:flex; flex-direction:column; box-shadow:0 12px 40px rgba(0,0,0,.3); }
.im-modal.im-modal-wide { max-width:min(1500px, 96vw); }
.im-modal-body img { display:block; max-width:100%; max-height:72vh; width:auto; height:auto; margin:0 auto; border-radius:8px; object-fit:contain; }
.im-modal-head { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid #E3E7E9; flex:none; }
.im-modal-head h4 { margin:0; color:var(--azul); font-size:15.5px; }
.im-modal-close { background:var(--claro); border:none; width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:14px; color:var(--gris); flex:none; }
.im-modal-close:hover { background:#E3E7E9; }
.im-modal-body { flex:1; min-height:0; overflow:auto; padding:16px 20px 20px; text-align:center; }
.im-figure { margin:6px 0 20px; }
.im-figure-img { display:block; width:auto; max-width:100%; height:auto; max-height:82vh; margin:0 auto; border-radius:10px; box-shadow:0 4px 16px rgba(159,177,186,.35); cursor:zoom-in; }
.im-figure-caption { font-size:12px; color:var(--humo); text-align:center; margin-top:8px; font-style:italic; }
@media (min-width:860px) {
  .im-figure { width:min(1300px, 92vw); margin-left:calc(50% - min(650px, 46vw)); margin-right:calc(50% - min(650px, 46vw)); }
}
.im-img-btn { display:flex; align-items:center; gap:14px; width:100%; max-width:420px; background:var(--claro); border:none; border-radius:14px; padding:10px; margin:4px 0 20px; cursor:pointer; text-align:left; font-family:Arial,Helvetica,sans-serif; box-shadow:0 2px 10px rgba(159,177,186,.28); transition:transform .12s ease, background .12s ease; }
.im-img-btn:hover { background:#E9ECEE; transform:translateY(-2px); }
.im-img-btn-thumb { flex:none; width:64px; height:64px; border-radius:10px; background-size:cover; background-position:center; position:relative; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
.im-img-btn-thumb::after { content:"🔍"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:18px; background:rgba(11,44,66,.35); border-radius:10px; }
.im-img-btn-text { display:flex; flex-direction:column; gap:2px; }
.im-img-btn-label { font-size:13.5px; font-weight:bold; color:var(--azul); }
.im-img-btn-sub { font-size:11.5px; color:var(--humo); }
.im-reveal-toggle { display:inline-flex; align-items:center; gap:6px; background:#fff; border:1.5px dashed var(--humo); color:var(--azul); font-size:12.5px; font-weight:bold; border-radius:20px; padding:7px 14px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; margin:2px 0 14px; }
.im-reveal-toggle:hover { border-color:var(--azul); }
.im-reveal-box { display:none; margin:0 0 16px; }
.im-reveal-box.open { display:block; animation:imFadeIn .25s ease; }
.im-reveal-box img { display:block; width:100%; border-radius:10px; box-shadow:0 4px 16px rgba(159,177,186,.35); }
.im-errorlist { list-style:none; padding:0; margin:0 0 6px; }
.im-errorlist li { background:var(--claro); border-left:3px solid var(--rojo); border-radius:0 8px 8px 0; padding:12px 16px; margin-bottom:10px; }
.im-errorlist .im-error-term { display:block; font-weight:bold; color:var(--azul); font-size:14px; margin-bottom:4px; }
.im-errorlist .im-error-desc { font-size:13.5px; color:var(--gris); line-height:1.6; }
.im-cite { color:var(--azul); font-weight:bold; cursor:pointer; border-bottom:1.5px dotted var(--azul); white-space:normal; }
.im-cite:hover { color:var(--azul-d); }
.im-cite-pop { display:none; background:var(--azul-d); color:#fff; border-radius:8px; padding:12px 16px; font-size:12.5px; line-height:1.6; margin:6px 0 14px; }
.im-cite-pop.open { display:block; }
.im-cite-pop p { margin:0 0 8px; }
.im-cite-pop p:last-child { margin-bottom:0; }
.im-cite-pop a { color:var(--amar); }
.im-bib-list { margin-top:6px; }
.im-bib-item.im-bib-highlight { background:#FDF1C7; border-radius:8px; padding:10px 14px; margin-left:-14px; margin-right:-14px; }
code.im-inline { background:#F2F4F5; padding:1px 6px; border-radius:4px; font-family:"Courier New",monospace; font-size:.93em; }
/* teacher panel */
.teacher-banner { background:var(--azul-d); color:#fff; border-radius:12px; padding:18px 22px; margin-bottom:24px; }
.teacher-banner strong { color: var(--amar); }
.teacher-banner p { font-size:13px; margin:6px 0 0; color:var(--humo); }
.teacher-token-row { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
.teacher-token-row input { flex:1; min-width:220px; padding:9px 12px; border-radius:8px; border:none; font-size:13px; font-family:Arial,Helvetica,sans-serif; }
.teacher-token-row button { background:var(--amar); color:var(--azul-d); border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:bold; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.teacher-status { font-size:12px; margin-top:10px; min-height:16px; }
.teacher-toggle-list { list-style:none; padding:0; margin:16px 0 0; display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; }
.teacher-toggle-list li { background:rgba(255,255,255,.08); border-radius:8px; padding:10px 14px; display:flex; align-items:center; gap:10px; font-size:13px; }
.teacher-toggle-list input { width:18px; height:18px; }
.hub-btn .teacher-hint { position:absolute; top:10px; right:12px; font-size:10px; font-weight:bold; padding:2px 8px; border-radius:10px; }
.hub-btn .teacher-hint.on { background:#DFF3E0; color:var(--verde); }
.hub-btn .teacher-hint.off { background:#FBEAEC; color:var(--rojo); }
footer { text-align:center; padding:26px 6vw 40px; font-size:11px; color:var(--humo); font-style:italic; }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <div class="kicker">Tema 7</div>
    <h1>PLN</h1>
    <p>Contenido protegido. Introduce la contraseña facilitada en clase.</p>
    <input type="password" id="pw" placeholder="Contraseña" autofocus>
    <button class="submit" id="enter">Acceder</button>
    <div class="error" id="err"></div>
  </div>
</div>

<div id="page">
  <main id="content"></main>
  <footer>

  </footer>
</div>

  var QUIZ_MANUAL = [{"question":"¿Cuál es la distinción fundamental entre un término y una palabra de uso general según la teoría de Cabré?","answerOptions":[{"text":"Un término designa un concepto específico dentro de un dominio de conocimiento especializado.","isCorrect":true,"rationale":"La terminología se define por la conexión entre la unidad lingüística y un campo de especialidad concreto."},{"text":"Un término es necesariamente una unidad léxica de baja frecuencia en cualquier tipo de texto.","isCorrect":false,"rationale":"La frecuencia absoluta no define el estatus terminológico; un término puede ser muy frecuente dentro de su dominio especializado."},{"text":"Los términos solo existen en forma de expresiones multipalabra complejas.","isCorrect":false,"rationale":"Los términos pueden ser unigramas (una sola palabra) o multipalabra (n-gramas)."},{"text":"Un término es cualquier palabra que resulta difícil de entender para un hablante no nativo.","isCorrect":false,"rationale":"La dificultad de comprensión no es el criterio técnico, sino la designación de un concepto en un área profesional o científica."}],"hint":"Considere la relación entre el lenguaje y el ámbito de especialidad."},{"question":"En el contexto de la extracción terminológica, ¿qué mide específicamente el concepto de 'termhood'?","answerOptions":[{"text":"La probabilidad de que una unidad sea propia o relevante para un dominio especializado.","isCorrect":true,"rationale":"El termhood cuantifica la especificidad de una unidad respecto a un campo temático frente a un corpus general."},{"text":"El grado de estabilidad sintáctica de una combinación específica de palabras en una oración.","isCorrect":false,"rationale":"Esta descripción corresponde a la unithood, que se centra en la cohesión de la unidad."},{"text":"La cantidad de variantes gramaticales que presenta un término en un corpus.","isCorrect":false,"rationale":"La variación es un fenómeno terminológico, pero no es lo que define el grado de pertenencia al dominio."},{"text":"La velocidad con la que un sistema de PLN procesa los tokens de un documento.","isCorrect":false,"rationale":"La eficiencia del procesamiento es una cuestión técnica de computación, no una propiedad lingüística de los términos."}],"hint":"Piense en la relevancia de una palabra para un área del conocimiento específica."},{"question":"Si un corpus especializado tiene 10 000 tokens en total y el término 'tokenización' aparece 50 veces, ¿cuál es su frecuencia relativa?","answerOptions":[{"text":"0.005","isCorrect":true,"rationale":"La frecuencia relativa se calcula dividiendo la frecuencia absoluta entre el total de tokens: 50 / 10000 = 0.005."},{"text":"200","isCorrect":false,"rationale":"Este resultado se obtiene dividiendo el total de tokens por la frecuencia, lo cual es el proceso inverso al cálculo de la frecuencia relativa."},{"text":"0.05","isCorrect":false,"rationale":"Este valor implicaría una frecuencia absoluta de 500 apariciones en lugar de 50 para el tamaño de corpus dado."},{"text":"500.000","isCorrect":false,"rationale":"Este valor es el producto de la frecuencia por el tamaño del corpus, no su proporción."}],"hint":"Aplique la fórmula de normalización por tamaño de corpus."},{"question":"En la fórmula de 'weirdness' aplicada en la unidad, ¿cuál es la función del parámetro epsilon?","answerOptions":[{"text":"Evitar el error de división por cero cuando un candidato no aparece en el corpus general.","isCorrect":true,"rationale":"Si la frecuencia relativa en el corpus general es cero, añadir un valor mínimo permite realizar la división sin romper el programa."},{"text":"Aumentar artificialmente la frecuencia de los términos en el corpus general.","isCorrect":false,"rationale":"No busca alterar las frecuencias, sino proteger la integridad del cálculo matemático."},{"text":"Eliminar automáticamente las stopwords del ranking final.","isCorrect":false,"rationale":"El filtrado de stopwords es un proceso de preprocesamiento independiente de la fórmula de especificidad."},{"text":"Calcular el logaritmo natural de la frecuencia absoluta antes de aplicar cualquier otro filtro.","isCorrect":false,"rationale":"Epsilon es una constante de suavizado, no un operador logarítmico."}],"hint":"Piense en qué sucede matemáticamente si el denominador de una fracción es cero."},{"question":"¿Por qué se utilizan tuplas en Python para representar n-gramas antes de contarlos con un objeto Counter?","answerOptions":[{"text":"Porque las tuplas son inmutables y, por lo tanto, pueden usarse como claves en un diccionario o Counter.","isCorrect":true,"rationale":"En Python, los objetos mutables como las listas no pueden ser claves de diccionarios; se requiere una estructura inmutable como la tupla."},{"text":"Porque las tuplas permiten almacenar más información que las listas simples.","isCorrect":false,"rationale":"El problema no es la capacidad de almacenamiento, sino las propiedades de la estructura de datos."},{"text":"Porque las tuplas eliminan automáticamente los espacios en blanco al construir cada secuencia de tokens.","isCorrect":false,"rationale":"La limpieza de espacios se realiza durante la tokenización, no por el simple hecho de usar tuplas."},{"text":"Porque facilitan la conversión de todos los tokens a minúsculas.","isCorrect":false,"rationale":"La conversión a minúsculas es un paso previo que se aplica a los strings antes de generar los n-gramas."}],"hint":"Considere los requisitos técnicos para que un objeto sea 'hashable' en Python."},{"question":"Al extraer términos multipalabra en español, ¿cuál es el riesgo de eliminar todas las stopwords antes de generar los n-gramas?","answerOptions":[{"text":"Que se pierdan conectores internos esenciales, produciendo candidatos incompletos como 'modelo lenguaje' en lugar de 'modelo de lenguaje'.","isCorrect":true,"rationale":"Muchas unidades terminológicas en español dependen de preposiciones internas; eliminarlas deforma el término natural."},{"text":"Que el sistema no pueda contar la frecuencia absoluta correctamente en ningún nivel del corpus, incluidos unigramas, bigramas y trigramas.","isCorrect":false,"rationale":"La frecuencia se puede contar igual, el problema reside en la integridad estructural del término."},{"text":"Que el corpus especializado se vuelva más grande que el corpus general.","isCorrect":false,"rationale":"El filtrado de palabras funcionales reduce el tamaño de ambos corpus, pero no invierte su relación de tamaño."},{"text":"Que las expresiones regulares dejen de funcionar para la limpieza de URLs.","isCorrect":false,"rationale":"La limpieza de URLs ocurre normalmente antes de la gestión de stopwords y n-gramas."}],"hint":"Piense en cómo se forman los términos técnicos en nuestra lengua."},{"question":"¿Cuál es la utilidad primordial de una herramienta KWIC (Key Word In Context) para una persona terminóloga?","answerOptions":[{"text":"Permitir la validación de un candidato al observar cómo se utiliza en su entorno lingüístico real.","isCorrect":true,"rationale":"El contexto proporcionado por el KWIC ayuda a decidir si una unidad es un concepto estable o una combinación casual."},{"text":"Sustituir la necesidad de un corpus general de contraste.","isCorrect":false,"rationale":"El KWIC no sustituye el contraste estadístico; sirve para la validación cualitativa posterior."},{"text":"Calcular automáticamente el valor de precisión y recall del sistema.","isCorrect":false,"rationale":"La evaluación de precisión y recall requiere una comparación con un estándar de oro, no solo la visualización de contextos."},{"text":"Reducir el tiempo de ejecución de la función de tokenización sobre corpus de gran tamaño.","isCorrect":false,"rationale":"El KWIC es una función de visualización y análisis, no un optimizador del rendimiento del código."}],"hint":"Imagine que tiene una lista de palabras y necesita saber si realmente funcionan como términos."},{"question":"Al aplicar una 'lista negra' (blacklist) en el refinamiento de candidatos, ¿qué criterio se sugiere para eliminar una unidad?","answerOptions":[{"text":"Eliminar candidatos compuestos exclusivamente por palabras consideradas demasiado generales o ruidosas por el analista.","isCorrect":true,"rationale":"Las listas negras permiten descartar unidades como 'sistema' o 'uso' que, aunque frecuentes, no aportan valor específico al glosario."},{"text":"Eliminar cualquier palabra que aparezca más de diez veces en el corpus especializado.","isCorrect":false,"rationale":"La alta frecuencia suele ser un indicador de termhood; eliminarla por sistema sería contraproducente."},{"text":"Descartar términos que tengan menos de cinco caracteres, sin importar su frecuencia real ni su relevancia en el dominio.","isCorrect":false,"rationale":"La longitud del string no determina su valor terminológico; hay términos cortos muy importantes."},{"text":"Filtrar todos los términos que ya existan en un diccionario de la Real Academia Española.","isCorrect":false,"rationale":"Muchos términos especializados están en diccionarios generales, pero siguen siendo relevantes para el dominio estudiado."}],"hint":"Considere cómo reducir el ruido provocado por palabras procedimentales comunes."},{"question":"Al construir la lista de tokens de un corpus en Python, ¿cuál es la diferencia clave entre usar .append() y .extend()?","answerOptions":[{"text":".append() añadiría una lista de tokens como un solo elemento, mientras que .extend() añade cada token individualmente a la lista principal.","isCorrect":true,"rationale":"Para obtener una lista plana de todos los tokens del corpus, se requiere .extend() para integrar los elementos de cada documento."},{"text":".append() convierte los tokens a minúsculas, mientras que .extend() los mantiene igual.","isCorrect":false,"rationale":"La transformación de casos es una operación de strings, no una propiedad del método de lista."},{"text":".extend() solo funciona correctamente con unigramas, mientras que .append() está limitado exclusivamente a trigramas de tres elementos consecutivos.","isCorrect":false,"rationale":"Ambos métodos funcionan con cualquier tipo de objeto en Python; la diferencia es cómo se agregan."},{"text":"No hay diferencia real; ambos métodos producen el mismo resultado en la memoria de Python.","isCorrect":false,"rationale":"La diferencia estructural es decisiva: una produce una lista de listas y la otra una lista plana."}],"hint":"Piense en la estructura resultante: ¿una lista que contiene otra lista, o una lista con todos los elementos sueltos?"},{"question":"¿Qué significa que un sistema de extracción terminológica sea 'transparente' frente a uno 'neuronal'?","answerOptions":[{"text":"Que cada decisión y posición en el ranking puede explicarse mediante reglas estadísticas y lingüísticas claramente definidas.","isCorrect":true,"rationale":"En los métodos transparentes, se puede trazar el origen de un candidato (frecuencia, contraste, filtros) sin depender de procesos opacos."},{"text":"Que el sistema transparente solo puede procesar archivos de texto plano.","isCorrect":false,"rationale":"La transparencia se refiere a la interpretación de los procesos, no al formato de los archivos de entrada."},{"text":"Que el sistema neuronal es incapaz de detectar términos multipalabra sin un entrenamiento previo extenso sobre datos anotados.","isCorrect":false,"rationale":"Los modelos neuronales son muy potentes detectando n-gramas, aunque su lógica interna sea más difícil de interpretar."},{"text":"Que los métodos transparentes son siempre más precisos que los modelos de lenguaje modernos.","isCorrect":false,"rationale":"La precisión depende de muchos factores; la ventaja del método transparente es su explicabilidad, no necesariamente una precisión superior."}],"hint":"Relacione el concepto con la capacidad del analista para justificar los resultados."}];
  var QUIZ_CUADERNO = [{"question":"¿Cuál es el objetivo principal de un sistema de extracción automática de terminología?","answerOptions":[{"text":"Detectar automáticamente términos candidatos comparando un corpus especializado con uno general.","isCorrect":true,"rationale":"La esencia de este tipo de sistema es identificar palabras o secuencias que son significativamente más frecuentes en el dominio de interés que en el lenguaje común."},{"text":"Entrenar un modelo neuronal complejo para traducir documentos de forma automática.","isCorrect":false,"rationale":"No se busca construir una inteligencia artificial gigantesca ni un modelo neuronal, sino un prototipo interpretable basado en la comparación de corpus."},{"text":"Sustituir por completo el trabajo de los traductores humanos en la empresa LexiData.","isCorrect":false,"rationale":"El sistema se define como una herramienta de apoyo semiautomática para agilizar la labor humana, no para eliminarla."},{"text":"Crear una base de datos de todas las palabras existentes en el idioma español, incluidas sus variantes regionales.","isCorrect":false,"rationale":"El enfoque no es el léxico general, sino la detección de términos característicos de dominios especializados como la medicina o el derecho."}],"hint":"Fíjate en la técnica de contraste que utiliza dos tipos de conjuntos de textos."},{"question":"En el proceso de limpieza y preprocesamiento, ¿qué función cumplen las 'stopwords'?","answerOptions":[{"text":"Son palabras muy frecuentes pero con poco valor terminológico que deben filtrarse para reducir el ruido.","isCorrect":true,"rationale":"Artículos, preposiciones y conjunciones aparecen mucho en cualquier texto pero no definen un dominio especializado."},{"text":"Son términos especializados que deben resaltarse en el glosario final.","isCorrect":false,"rationale":"Las stopwords son palabras vacías de contenido terminológico, justo lo opuesto a los términos especializados."},{"text":"Son unidades lingüísticas que ayudan a detectar el sentimiento del texto.","isCorrect":false,"rationale":"El análisis de sentimiento no es el objetivo de este pipeline, que se centra en la extracción de terminología técnica."},{"text":"Son marcadores que indican el inicio y el fin de cada n-grama dentro del corpus ya procesado y filtrado.","isCorrect":false,"rationale":"Aunque afectan a la formación de n-gramas si se eliminan, su definición principal es la de palabras funcionales frecuentes."}],"hint":"Piensa en palabras como 'de', 'la', 'el' o 'y'."},{"question":"Si a la expresión 'modelo de lenguaje' se le aplica un preprocesamiento simple que elimina las stopwords y conserva el resto de palabras en su mismo orden, ¿en qué se convierte?","answerOptions":[{"text":"modelo lenguaje","isCorrect":true,"rationale":"Al eliminar la stopword 'de', el n-grama resultante une los tokens con significado léxico restantes."},{"text":"lenguaje modelo","isCorrect":false,"rationale":"El sistema mantiene el orden secuencial original de los tokens supervivientes, no los invierte."},{"text":"modelo_de_lenguaje","isCorrect":false,"rationale":"Este preprocesamiento utiliza la eliminación de palabras vacías y la división por espacios, no la unión con guiones bajos."},{"text":"modelo","isCorrect":false,"rationale":"Esto sería un unigrama; la formación de bigramas tras el filtrado conserva dos palabras consecutivas."}],"hint":"Considera qué sucede cuando se elimina una palabra funcional entre dos sustantivos."},{"question":"¿Cuál es la utilidad de utilizar la frecuencia relativa en lugar de la frecuencia absoluta al comparar dos corpus?","answerOptions":[{"text":"Permite comparar corpus de diferentes tamaños de forma justa.","isCorrect":true,"rationale":"La frecuencia relativa normaliza los datos dividiendo el número de apariciones por el total de tokens, evitando sesgos por la extensión del texto."},{"text":"Es más fácil de calcular manualmente que la frecuencia absoluta.","isCorrect":false,"rationale":"Requiere una operación matemática adicional (división), por lo que técnicamente es un paso más que el simple conteo."},{"text":"Elimina automáticamente todas las palabras que no son sustantivos.","isCorrect":false,"rationale":"La frecuencia relativa es una medida estadística de probabilidad, no un filtro gramatical o de categoría de palabra."},{"text":"Asegura que los términos aparezcan siempre en orden alfabético.","isCorrect":false,"rationale":"El orden alfabético es independiente de las métricas de frecuencia utilizadas para el ranking."}],"hint":"Piensa en lo que sucede si comparas un libro de mil páginas con un artículo de una página."},{"question":"La medida de contraste denominada 'weirdness' se calcula mediante la fórmula:","answerOptions":[{"text":"weirdness(t) = (f_esp(t) / N_esp) / (f_gen(t) / N_gen + epsilon)","isCorrect":true,"rationale":"Esta fórmula representa la proporción de la frecuencia relativa del término en el corpus especializado frente al general, con un factor epsilon para evitar errores."},{"text":"weirdness(t) = f_esp(t) - f_gen(t)","isCorrect":false,"rationale":"Una simple resta de frecuencias absolutas no tiene en cuenta el tamaño total de los corpus (N)."},{"text":"weirdness(t) = N_esp / N_gen, sin tener en cuenta la frecuencia del término","isCorrect":false,"rationale":"Esta fórmula solo compararía el tamaño total de los textos, no la representatividad de un término específico."},{"text":"weirdness(t) = log(f_esp(t) × f_gen(t))","isCorrect":false,"rationale":"La multiplicación no permitiría identificar qué términos son 'raros' o únicos en comparación con el corpus general."}],"hint":"Busca la relación entre las frecuencias relativas del corpus especializado y el general."},{"question":"¿Qué es un n-grama en el contexto del procesamiento de lenguaje natural?","answerOptions":[{"text":"Una secuencia de n tokens o palabras consecutivas.","isCorrect":true,"rationale":"Los n-gramas permiten capturar unidades multipalabra (bigramas, trigramas) que a menudo funcionan como términos únicos."},{"text":"Un tipo de gráfico para visualizar la frecuencia de las letras.","isCorrect":false,"rationale":"Aunque suene similar a 'diagrama', se refiere a unidades de texto, no a representaciones gráficas."},{"text":"Un modelo neuronal especializado en detectar errores gramaticales.","isCorrect":false,"rationale":"Es una técnica estadística y estructural básica de PLN, no un modelo de aprendizaje profundo por sí mismo."},{"text":"Una lista de palabras que deben ser eliminadas del corpus.","isCorrect":false,"rationale":"Esa descripción corresponde a las 'stopwords' o 'listas negras', no a los n-gramas."}],"hint":"El término proviene de la lingüística computacional y se refiere a cadenas de unidades."},{"question":"En un sistema de extracción de terminología que prioriza la transparencia y la interpretabilidad de cada candidato, ¿por qué requiere la generación de concordancias KWIC (Keyword in Context)?","answerOptions":[{"text":"Para permitir que un experto humano valide si el candidato tiene sentido como término real.","isCorrect":true,"rationale":"Ver el entorno inmediato de la palabra ayuda a confirmar si su uso es técnico o puramente accidental."},{"text":"Para traducir automáticamente los términos candidatos a otros idiomas.","isCorrect":false,"rationale":"El sistema es un detector de terminología para extracción, no un traductor automático."},{"text":"Para reducir el tamaño del archivo de salida y ahorrar memoria.","isCorrect":false,"rationale":"Las concordancias KWIC en realidad aumentan la cantidad de información presentada en el glosario."},{"text":"Para eliminar los números y URLs que hayan quedado en el texto.","isCorrect":false,"rationale":"Esa tarea se realiza en la fase inicial de limpieza y tokenización, no en la fase de KWIC."}],"hint":"Considera la necesidad de que cada candidato a término pueda revisarse y justificarse ante una persona experta."},{"question":"En el filtrado de candidatos, ¿qué criterio se suele aplicar para evitar que el ranking se llene de errores tipográficos o coincidencias únicas?","answerOptions":[{"text":"Filtro de frecuencia mínima (umbral).","isCorrect":true,"rationale":"Si una unidad aparece solo una vez, es probable que sea ruido o un error; establecer un umbral de frecuencia mínima asegura representatividad."},{"text":"Filtro de frecuencia máxima.","isCorrect":false,"rationale":"Eliminar palabras muy frecuentes podría quitar términos clave del dominio; lo que se busca es eliminar lo poco frecuente."},{"text":"Ordenamiento por longitud de caracteres.","isCorrect":false,"rationale":"La longitud de la palabra no garantiza su relevancia terminológica en comparación con su frecuencia de uso."},{"text":"Uso exclusivo de diccionarios de la RAE.","isCorrect":false,"rationale":"Los términos especializados a menudo no están en diccionarios generales, por lo que este filtro sería contraproducente."}],"hint":"Se trata de decidir cuántas veces debe aparecer algo para ser 'tomado en serio'."},{"question":"¿Cuál es una limitación reconocida del pipeline de extracción simple cuando se eliminan stopwords antes de crear n-gramas?","answerOptions":[{"text":"Produce candidatos deformados lingüísticamente como 'lingüística corpus'.","isCorrect":true,"rationale":"Al quitar las preposiciones, se pierden los nexos naturales del español, lo que genera términos que requieren interpretación humana adicional."},{"text":"Aumenta demasiado el tiempo de procesamiento del ordenador.","isCorrect":false,"rationale":"Eliminar stopwords en realidad reduce la cantidad de datos y acelera el proceso computacional."},{"text":"Impide que el sistema pueda leer correctamente archivos guardados en formato PDF.","isCorrect":false,"rationale":"El procesamiento lingüístico es independiente de la extensión del archivo, siempre que el texto sea extraído previamente."},{"text":"Hace que todos los términos resultantes sean obligatoriamente unigramas.","isCorrect":false,"rationale":"El sistema sigue permitiendo crear bigramas o trigramas, solo que estos carecerán de las palabras funcionales eliminadas."}],"hint":"Piensa en el 'conflicto profesional' mencionado sobre la forma de los términos multi-palabra."},{"question":"En el contexto de LexiData Solutions, el prototipo debe entregar un 'mini-glosario' que incluya:","answerOptions":[{"text":"Candidatos, frecuencias, puntuación de relevancia y ejemplos de uso.","isCorrect":true,"rationale":"Esta información permite al equipo humano revisar, justificar y decidir qué unidades entran en la base terminológica final."},{"text":"Código fuente en Python y una lista de todas las URLs eliminadas.","isCorrect":false,"rationale":"Aunque el código es necesario para el equipo de PLN, el producto final para los traductores debe ser una tabla de resultados."},{"text":"Una traducción automática completa de todo el corpus especializado.","isCorrect":false,"rationale":"El encargo es de extracción terminológica, no de traducción de documentos."},{"text":"Un ranking de los traductores más eficientes de toda la empresa de traducción.","isCorrect":false,"rationale":"El sistema analiza textos para extraer términos, no evalúa el desempeño del personal humano."}],"hint":"Busca los elementos que componen la tabla final del encargo."}];

  function sha256Hex(text) {
    var enc = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", enc).then(function(buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function(b) {
        return b.toString(16).padStart(2, "0");
      }).join("");
    });
  }

  function showView(id) {
    document.querySelectorAll(".view").forEach(function(v) { v.hidden = true; });
    var el = document.getElementById(id) || document.getElementById("view-" + id);
    if (el) el.hidden = false;
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  var quizState = null;

  function renderQuizStart() {
    var root = document.getElementById("quiz-root");
    if (!root) return;
    root.innerHTML =
      '<div class="quiz-start">' +
      '<p>10 preguntas: 5 elegidas al azar del banco del manual y 5 del banco del cuaderno. Puedes repetir el intento tantas veces como quieras — cada vez se vuelven a elegir y reordenar las preguntas.</p>' +
      '<button class="quiz-btn" id="quiz-begin">Empezar</button>' +
      '</div>';
    document.getElementById("quiz-begin").addEventListener("click", startQuiz);
  }

  function startQuiz() {
    var fromManual = shuffle(QUIZ_MANUAL).slice(0, 5);
    var fromCuaderno = shuffle(QUIZ_CUADERNO).slice(0, 5);
    quizState = { questions: shuffle(fromManual.concat(fromCuaderno)), index: 0, score: 0 };
    renderQuizQuestion();
  }

  function renderQuizQuestion() {
    var root = document.getElementById("quiz-root");
    var total = quizState.questions.length;
    if (quizState.index >= total) {
      root.innerHTML =
        '<div class="quiz-result">' +
        '<div class="quiz-score">' + quizState.score + ' / ' + total + '</div>' +
        '<p>Puntuación de este intento.</p>' +
        '<button class="quiz-btn" id="quiz-retry">Volver a intentar</button>' +
        '</div>';
      document.getElementById("quiz-retry").addEventListener("click", startQuiz);
      return;
    }
    var q = quizState.questions[quizState.index];
    var opts = shuffle(q.answerOptions);
    var html = '<div class="quiz-progress">Pregunta ' + (quizState.index + 1) + ' de ' + total + ' · Puntuación provisional: ' + quizState.score + '</div>';
    html += '<div class="quiz-q"><h3>' + q.question + '</h3>';
    opts.forEach(function(opt, i) {
      html += '<button class="quiz-opt" data-idx="' + i + '">' + opt.text + '</button>';
    });
    html += '<div class="quiz-feedback" id="quiz-feedback" hidden></div>';
    html += '</div>';
    root.innerHTML = html;
    var buttons = root.querySelectorAll(".quiz-opt");
    buttons.forEach(function(btn, i) {
      btn.addEventListener("click", function() {
        buttons.forEach(function(b) { b.disabled = true; });
        var chosen = opts[i];
        if (chosen.isCorrect) { btn.classList.add("correct"); quizState.score++; }
        else {
          btn.classList.add("incorrect");
          buttons.forEach(function(b2, j) { if (opts[j].isCorrect) b2.classList.add("correct"); });
        }
        var fb = document.getElementById("quiz-feedback");
        fb.hidden = false;
        fb.textContent = chosen.rationale || (chosen.isCorrect ? "Correcto." : "Incorrecto.");
        var next = document.createElement("button");
        next.className = "quiz-btn";
        next.style.marginTop = "14px";
        next.textContent = quizState.index + 1 < total ? "Siguiente" : "Ver puntuación";
        next.addEventListener("click", function() { quizState.index++; renderQuizQuestion(); });
        root.querySelector(".quiz-q").appendChild(next);
      });
    });
  }

  function imEsc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function imFormatBackticks(s) {
    var parts = s.split("`"), out = "";
    for (var i = 0; i < parts.length; i++) out += (i % 2 === 1) ? '<code class="im-inline">' + imEsc(parts[i]) + "</code>" : imEsc(parts[i]);
    return out;
  }
  function imFormatInline(raw) {
    var re = /{{cite:([^}]*)}}([\s\S]*?){{\/cite}}/g;
    var out = "", last = 0, m;
    while ((m = re.exec(raw))) {
      out += imFormatBackticks(raw.slice(last, m.index));
      out += '<span class="im-cite" data-refs="' + m[1] + '">' + imFormatBackticks(m[2]) + ' <span aria-hidden="true">ⓘ</span></span>';
      last = re.lastIndex;
    }
    out += imFormatBackticks(raw.slice(last));
    return out;
  }
  function imLinkify(text) {
    var re = /(https?:\/\/[^\s]+)/g;
    var out = "", last = 0, m;
    while ((m = re.exec(text))) {
      out += imEsc(text.slice(last, m.index));
      var url = m[1].replace(/[.,;]+$/, "");
      out += '<a href="' + imEsc(url) + '" target="_blank" rel="noopener">' + imEsc(url) + "</a>";
      last = m.index + url.length;
    }
    out += imEsc(text.slice(last));
    return out;
  }
  function imBibText(text) {
    // *word* marks an APA-italicized container title (book/journal name+volume/etc.)
    return text.split(/(\*[^*]+\*)/g).map(function(part) {
      if (part.charAt(0) === "*" && part.charAt(part.length - 1) === "*" && part.length > 1) {
        return "<em>" + imLinkify(part.slice(1, -1)) + "</em>";
      }
      return imLinkify(part);
    }).join("");
  }
  function imRefLookup(data) {
    var m = {};
    data.references.forEach(function(r) { m[r.key] = r.text; });
    return m;
  }
  function imOpenModal(title, bodyHtml, wide) {
    var overlay = document.createElement("div");
    overlay.className = "im-modal-overlay";
    overlay.innerHTML = '<div class="im-modal' + (wide ? " im-modal-wide" : "") + '"><div class="im-modal-head"><h4>' + imEsc(title) +
      '</h4><button class="im-modal-close" aria-label="Cerrar">✕</button></div><div class="im-modal-body">' + bodyHtml + "</div></div>";
    document.body.appendChild(overlay);
    function close() { overlay.remove(); document.removeEventListener("keydown", onKey); }
    overlay.addEventListener("click", function(e) { if (e.target === overlay) close(); });
    overlay.querySelector(".im-modal-close").addEventListener("click", close);
    function onKey(e) { if (e.key === "Escape") close(); }
    document.addEventListener("keydown", onKey);
  }
  function imTableHtml(b) {
    var head = b.rows[0], body = b.rows.slice(1);
    return "<table><thead><tr>" + head.map(function(h) { return "<th>" + imFormatInline(h) + "</th>"; }).join("") + "</tr></thead><tbody>" +
      body.map(function(r) { return "<tr>" + r.map(function(c) { return "<td>" + imFormatInline(c) + "</td>"; }).join("") + "</tr>"; }).join("") +
      "</tbody></table>";
  }
  function imRenderTable(b, key, bare) {
    var t = imTableHtml(b);
    if (bare) return '<div class="im-table-bare">' + t + "</div>";
    var title = b.title || "Tabla";
    return '<button class="im-table-toggle" data-im-table="' + key + '" data-im-table-title="' + imEsc(title) + '">▤ Ver tabla: ' + imEsc(title) + "</button>" +
      '<template data-im-table-src="' + key + '">' + t + "</template>";
  }
  function imRenderBlocks(blocks, keyPrefix) {
    var html = "";
    var bareTable = blocks.length === 1 && blocks[0].type === "table";
    blocks.forEach(function(b, i) {
      var key = keyPrefix + "-" + i;
      if (b.type === "p") html += '<p class="im-block-p">' + imFormatInline(b.text) + "</p>";
      else if (b.type === "ul") html += '<ul class="im-block-ul">' + b.items.map(function(t) { return "<li>" + imFormatInline(t) + "</li>"; }).join("") + "</ul>";
      else if (b.type === "ol") html += '<ol class="im-block-ol">' + b.items.map(function(t) { return "<li>" + imFormatInline(t) + "</li>"; }).join("") + "</ol>";
      else if (b.type === "code") html += '<button class="im-code-toggle" data-im-code="' + key + '">🔎 Descubre el código</button>' +
        '<div class="im-code-box" id="im-code-' + key + '"><pre>' + imEsc(b.code) + "</pre></div>";
      else if (b.type === "table") html += imRenderTable(b, key, bareTable);
      else if (b.type === "image") html += '<figure class="im-figure"><img class="im-figure-img" src="' + imEsc(b.src) + '" alt="' + imEsc(b.alt || "") + '">' +
        (b.caption ? '<figcaption class="im-figure-caption">' + imFormatInline(b.caption) + "</figcaption>" : "") + "</figure>";
      else if (b.type === "image_modal") html += '<button class="im-img-btn" data-im-img-modal="' + key + '" data-im-img-title="' + imEsc(b.alt || "") + '">' +
        '<span class="im-img-btn-thumb" style="background-image:url(' + imEsc(b.src) + ')"></span>' +
        '<span class="im-img-btn-text"><span class="im-img-btn-label">' + imEsc(b.label || "Ver infografía") + '</span>' +
        (b.sub ? '<span class="im-img-btn-sub">' + imEsc(b.sub) + "</span>" : "") + "</span></button>" +
        '<template data-im-img-src="' + key + '"><img src="' + imEsc(b.src) + '" alt="' + imEsc(b.alt || "") + '">' +
        (b.caption ? '<figcaption class="im-figure-caption">' + imFormatInline(b.caption) + "</figcaption>" : "") + "</template>";
      else if (b.type === "image_reveal") html += '<button class="im-reveal-toggle" data-im-reveal="' + key + '">' + (b.labelClosed || "🔎 Descubre la infografía") + "</button>" +
        '<div class="im-reveal-box" id="im-reveal-' + key + '"><img src="' + imEsc(b.src) + '" alt="' + imEsc(b.alt || "") + '">' +
        (b.caption ? '<figcaption class="im-figure-caption">' + imFormatInline(b.caption) + "</figcaption>" : "") + "</div>";
      else if (b.type === "errorlist") html += '<ul class="im-errorlist">' + b.items.map(function(it) {
        return '<li><span class="im-error-term">' + imFormatInline(it.term) + '</span><span class="im-error-desc">' + imFormatInline(it.desc) + "</span></li>";
      }).join("") + "</ul>";
    });
    return html;
  }
  function imWireCommon(root, data) {
    root.querySelectorAll(".im-figure-img").forEach(function(img) {
      img.addEventListener("click", function() {
        imOpenModal(img.alt || "Infografía", '<img src="' + img.src + '" alt="' + img.alt.replace(/"/g, "&quot;") + '">', true);
      });
    });
    root.querySelectorAll("[data-im-img-modal]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var tpl = root.querySelector('[data-im-img-src="' + btn.dataset.imImgModal + '"]');
        if (tpl) imOpenModal(btn.dataset.imImgTitle || "Infografía", tpl.innerHTML, true);
      });
    });
    root.querySelectorAll("[data-im-reveal]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var box = document.getElementById("im-reveal-" + btn.dataset.imReveal);
        box.classList.toggle("open");
      });
    });
    root.querySelectorAll("[data-im-code]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var box = document.getElementById("im-code-" + btn.dataset.imCode);
        var open = box.classList.toggle("open");
        btn.textContent = open ? "🔽 Ocultar el código" : "🔎 Descubre el código";
      });
    });
    root.querySelectorAll("[data-im-table]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var tpl = root.querySelector('[data-im-table-src="' + btn.dataset.imTable + '"]');
        if (tpl) imOpenModal(btn.dataset.imTableTitle, tpl.innerHTML);
      });
    });
    root.querySelectorAll(".im-cite").forEach(function(span) {
      span.addEventListener("click", function() {
        var existing = span.nextElementSibling;
        if (existing && existing.classList && existing.classList.contains("im-cite-pop")) {
          existing.classList.toggle("open");
          return;
        }
        var refs = imRefLookup(data);
        var keys = span.dataset.refs.split(",");
        var pop = document.createElement("div");
        pop.className = "im-cite-pop open";
        pop.innerHTML = keys.map(function(k) { return "<p>" + imBibText(refs[k] || k) + "</p>"; }).join("") +
          '<p><a href="#" data-im-goto-bib="' + keys[0] + '">Ver en Bibliografía →</a></p>';
        span.parentNode.insertBefore(pop, span.nextSibling);
        pop.querySelector("[data-im-goto-bib]").addEventListener("click", function(e) {
          e.preventDefault();
          imShowBib(root, data, this.dataset.imGotoBib);
        });
      });
    });
  }
  function imRailHtml(data, activeIdx) {
    var items = '<button class="im-rail-btn" data-im-rail-home="1"><span class="im-rail-icon">🏠</span><span class="im-rail-label">Índice</span></button>';
    items += data.sections.map(function(sec, i) {
      var icon = IM_ICONS[sec.navTitle] || "📖";
      return '<button class="im-rail-btn' + (activeIdx === i ? " active" : "") + '" data-im-rail-chapter="' + i + '">' +
        '<span class="im-rail-icon">' + icon + '</span><span class="im-rail-label">' + imEsc(sec.navTitle) + "</span></button>";
    }).join("");
    items += '<button class="im-rail-btn' + (activeIdx === "bib" ? " active" : "") + '" data-im-rail-bib="1">' +
      '<span class="im-rail-icon">📖</span><span class="im-rail-label">Bibliografía</span></button>';
    return '<div class="im-rail">' + items + "</div>";
  }
  function imWireRail(root, data) {
    var homeBtn = root.querySelector("[data-im-rail-home]");
    if (homeBtn) homeBtn.addEventListener("click", function() { imShowIndex(root, data); });
    root.querySelectorAll("[data-im-rail-chapter]").forEach(function(btn) {
      btn.addEventListener("click", function() { imShowChapter(root, data, parseInt(btn.dataset.imRailChapter, 10)); });
    });
    var railBib = root.querySelector("[data-im-rail-bib]");
    if (railBib) railBib.addEventListener("click", function() { imShowBib(root, data, null); });
  }
  function imShowBib(root, data, highlightKey) {
    var html = imRailHtml(data, "bib");
    html += '<div class="im-chapter"><h3 class="im-chapter-title">📖 Bibliografía</h3>';
    html += '<h4 class="ref-intro">Referencias en formato APA (7ª edición)</h4>';
    html += '<div class="im-bib-list">' + data.references.map(function(r) {
      var cls = "ref-item im-bib-item" + (r.key === highlightKey ? " im-bib-highlight" : "");
      return '<p class="' + cls + '" id="im-bib-' + r.key + '">' + imBibText(r.text) + "</p>";
    }).join("") + "</div></div>";
    root.innerHTML = html;
    imWireRail(root, data);
    if (highlightKey) {
      var el = document.getElementById("im-bib-" + highlightKey);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }
  function imShowChapter(root, data, idx) {
    var sec = data.sections[idx];
    var icon = IM_ICONS[sec.navTitle] || "📖";
    var html = imRailHtml(data, idx);
    html += '<div class="im-chapter"><h3 class="im-chapter-title">' + icon + " " + imFormatInline(sec.title) + "</h3>";
    html += imRenderBlocks(sec.blocks, idx + "-i");
    sec.subsections.forEach(function(sub, j) {
      html += '<div class="im-sub" data-im-sub="' + j + '">' +
        '<button class="im-sub-head"><span class="im-sub-title">' + imFormatInline(sub.title) + '</span><span class="im-sub-arrow">▶</span></button>' +
        '<div class="im-sub-body">' + imRenderBlocks(sub.blocks, idx + "-" + j) + "</div></div>";
    });
    html += "</div>";
    root.innerHTML = html;
    imWireCommon(root, data);
    imWireRail(root, data);
    root.querySelectorAll(".im-sub-head").forEach(function(head) {
      head.addEventListener("click", function() {
        var thisSub = head.parentElement;
        var wasOpen = thisSub.classList.contains("open");
        root.querySelectorAll(".im-sub.open").forEach(function(s) { s.classList.remove("open"); });
        if (!wasOpen) thisSub.classList.add("open");
      });
    });
  }
  function imShowIndex(root, data) {
    var pdf = root.dataset.pdf;
    var cards = data.sections.map(function(sec, i) {
      var icon = IM_ICONS[sec.navTitle] || "📖";
      return '<button class="im-card" data-im-chapter="' + i + '" style="animation-delay:' + (i * 0.04) + 's">' +
        '<span class="im-card-icon">' + icon + '</span>' +
        '<span class="im-card-title">' + imEsc(sec.navTitle) + "</span>" +
        (sec.subsections.length ? '<span class="im-card-meta">' + sec.subsections.length + " apartados</span>" : "") +
        "</button>";
    }).join("");
    var bibCard = '<button class="im-card im-card-bib" data-im-bib="1" style="animation-delay:' + (data.sections.length * 0.04) + 's">' +
      '<span class="im-card-icon">📖</span><span class="im-card-title">Bibliografía</span>' +
      '<span class="im-card-meta">' + data.references.length + ' referencias en APA 7ª ed.</span></button>';
    var hero = '<div class="im-hero">' +
      (pdf ? '<a class="im-hero-dl" href="' + imEsc(pdf) + '" download>⬇ Descargar manual en PDF</a>' : "") +
      '<div class="im-hero-kicker">' + imEsc(data.header.kicker) + " · " + imEsc(data.header.title) + "</div>" +
      '<h1 class="im-hero-title">' + imEsc(data.header.subtitle) + "</h1></div>";
    root.innerHTML = hero + '<div class="im-grid">' + cards + bibCard + "</div>";
    root.querySelectorAll("[data-im-chapter]").forEach(function(btn) {
      btn.addEventListener("click", function() { imShowChapter(root, data, parseInt(btn.dataset.imChapter, 10)); });
    });
    var bibBtn = root.querySelector("[data-im-bib]");
    if (bibBtn) bibBtn.addEventListener("click", function() { imShowBib(root, data, null); });
  }
  function renderInteractiveManual(viewKey) {
    if (imRendered[viewKey]) return;
    imRendered[viewKey] = true;
    var data = IM_DATA[viewKey];
    if (!data) return;
    var root = document.getElementById("im-root-" + viewKey);
    if (!root) return;
    imShowIndex(root, data);
  }

  function wireNav() {
    document.querySelectorAll(".hub-btn").forEach(function(btn) {
      btn.addEventListener("click", function() {
        showView(btn.dataset.view);
        if (btn.dataset.view === "quiz") renderQuizStart();
        if (IM_DATA[btn.dataset.view]) renderInteractiveManual(btn.dataset.view);
      });
    });
    document.querySelectorAll("[data-back]").forEach(function(btn) {
      btn.addEventListener("click", function() { showView(btn.dataset.back); });
    });
  }

  function applyStudentVisibility(config) {
    document.querySelectorAll(".hub-btn[data-type]").forEach(function(btn) {
      var t = btn.dataset.type;
      btn.style.display = config[t] ? "" : "none";
    });
  }

  function applyTeacherHints(config) {
    document.querySelectorAll(".teacher-hint[data-hint]").forEach(function(span) {
      var t = span.dataset.hint;
      var on = !!config[t];
      span.textContent = on ? "visible" : "oculto";
      span.className = "teacher-hint " + (on ? "on" : "off");
    });
    document.querySelectorAll("#teacher-panel input[type=checkbox][data-type]").forEach(function(chk) {
      chk.checked = !!config[chk.dataset.type];
    });
  }

  function fetchConfig() {
    return fetch(LOCAL_CONFIG + "?t=" + Date.now()).then(function(r) { return r.json(); });
  }

  function ghHeaders(token) {
    return { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" };
  }

  function ghGetFile(token) {
    return fetch("https://api.github.com/repos/" + REPO + "/contents/" + GH_CONFIG_PATH, { headers: ghHeaders(token) })
      .then(function(r) {
        if (!r.ok) throw new Error("No se pudo leer el fichero (" + r.status + ")");
        return r.json();
      })
      .then(function(data) {
        configSha = data.sha;
        return JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\n/g, "")))));
      });
  }

  function ghSaveFile(token, configObj) {
    var content = btoa(unescape(encodeURIComponent(JSON.stringify(configObj, null, 2) + "\n")));
    return fetch("https://api.github.com/repos/" + REPO + "/contents/" + GH_CONFIG_PATH, {
      method: "PUT",
      headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders(token)),
      body: JSON.stringify({
        message: "Modo profesora: actualizar visibilidad de materiales (" + GH_CONFIG_PATH + ")",
        content: content,
        sha: configSha
      })
    }).then(function(r) {
      if (!r.ok) return r.text().then(function(t) { throw new Error("Error al guardar (" + r.status + "): " + t); });
      return r.json();
    }).then(function(data) {
      configSha = data.content.sha;
    });
  }

  function getToken() {
    try { return sessionStorage.getItem("gh_pat") || ""; } catch (e) { return ""; }
  }
  function setToken(t) {
    try { sessionStorage.setItem("gh_pat", t); } catch (e) {}
  }

  function setStatus(msg, isError) {
    var el = document.getElementById("teacher-status");
    if (!el) return;
    el.textContent = msg;
    el.style.color = isError ? "#FFB3B3" : "#9FE6A0";
  }

  function initTeacherPanel() {
    document.getElementById("teacher-panel").hidden = false;
    var tokenInput = document.getElementById("gh-token");
    tokenInput.value = getToken();

    document.getElementById("gh-token-save").addEventListener("click", function() {
      setToken(tokenInput.value.trim());
      setStatus(tokenInput.value.trim() ? "Token guardado para esta sesión." : "Token borrado.");
      refreshFromGithub();
    });

    document.querySelectorAll("#teacher-panel input[type=checkbox][data-type]").forEach(function(chk) {
      chk.addEventListener("change", function() {
        var token = getToken();
        if (!token) { setStatus("Pega primero tu token de GitHub.", true); chk.checked = !chk.checked; return; }
        setStatus("Guardando...");
        ghGetFile(token).then(function(current) {
          current[chk.dataset.type] = chk.checked;
          return ghSaveFile(token, current).then(function() { return current; });
        }).then(function(current) {
          applyTeacherHints(current);
          setStatus("Guardado ✓ — el alumnado lo verá en 1-2 minutos.");
        }).catch(function(err) {
          chk.checked = !chk.checked;
          setStatus(err.message, true);
        });
      });
    });

    refreshFromGithub();

    function refreshFromGithub() {
      var token = getToken();
      if (!token) { fetchConfig().then(applyTeacherHints); return; }
      setStatus("Cargando estado actual...");
      ghGetFile(token).then(function(current) {
        applyTeacherHints(current);
        setStatus("Conectado. Puedes marcar/desmarcar materiales.");
      }).catch(function(err) { setStatus(err.message, true); fetchConfig().then(applyTeacherHints); });
    }
  }

  function reveal(teacherMode) {
    isTeacher = teacherMode;
    document.getElementById("content").innerHTML = decodeURIComponent(escape(atob(PAYLOAD)));
    document.getElementById("gate").style.display = "none";
    document.getElementById("page").style.display = "block";
    wireNav();
    if (teacherMode) {
      document.querySelectorAll(".hub-btn[data-type]").forEach(function(btn) { btn.style.display = ""; });
      initTeacherPanel();
    } else {
      fetchConfig().then(applyStudentVisibility);
    }
    try { sessionStorage.setItem(SESSION_KEY, teacherMode ? "teacher" : "1"); } catch (e) {}
  }

  function tryUnlock() {
    var val = document.getElementById("pw").value;
    sha256Hex(val).then(function(hex) {
      if (hex === TEACHER_HASH) { reveal(true); return; }
      if (hex === HASH) {
        fetch(ROOT_CONFIG + "?t=" + Date.now()).then(function(r) { return r.json(); }).then(function(rootCfg) {
          if (rootCfg[TEMA_KEY] === false) {
            document.getElementById("err").textContent = "Este tema no está disponible por el momento.";
          } else {
            reveal(false);
          }
        }).catch(function() { reveal(false); });
        return;
      }
      document.getElementById("err").textContent = "Contraseña incorrecta.";
    });
  }

  document.getElementById("enter").addEventListener("click", tryUnlock);
  document.getElementById("pw").addEventListener("keydown", function(e) { if (e.key === "Enter") tryUnlock(); });

  try {
    var saved = sessionStorage.getItem(SESSION_KEY);
    if (saved === "teacher") reveal(true);
    else if (saved === "1") reveal(false);
  } catch (e) {}
})();
</script>
</body>
</html>
