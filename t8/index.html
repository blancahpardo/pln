<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tema 8 — PLN</title>
<style>

:root {
  --azul: #003B5C;
  --azul-d: #00283F;
  --amar: #F4C542;
  --gris: #34484F;
  --claro: #F3F3F4;
  --humo: #9FB1BA;
  --verde: #2E7D32;
  --rojo: #B00020;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: var(--gris); background:#fff; }
a { color: inherit; }

#gate { position:fixed; inset:0; background:var(--azul); display:flex; align-items:center; justify-content:center; padding:24px; z-index:999; }
#gate .box { max-width:380px; width:100%; text-align:center; }
#gate .kicker { color:var(--amar); font-size:12px; font-weight:bold; letter-spacing:2.5px; text-transform:uppercase; margin-bottom:10px; }
#gate h1 { color:#fff; font-size:26px; margin:0 0 10px; }
#gate p { color:var(--humo); font-size:14px; margin:0 0 26px; }
#gate input { width:100%; padding:13px 16px; border-radius:8px; border:none; font-size:15px; font-family:Arial,Helvetica,sans-serif; margin-bottom:14px; outline:2px solid transparent; }
#gate input:focus { outline:2px solid var(--amar); }
#gate button.submit { width:100%; padding:13px 16px; border-radius:8px; border:none; background:var(--amar); color:var(--azul-d); font-size:15px; font-weight:bold; font-family:Arial,Helvetica,sans-serif; cursor:pointer; }
#gate button.submit:hover { filter:brightness(1.06); }
#gate .error { color:#FFB3B3; font-size:13px; margin-top:12px; min-height:18px; }
#page { display:none; }
main { max-width:980px; margin:0 auto; padding:48px 6vw 60px; }
.kicker { color:var(--amar); font-size:12px; font-weight:bold; letter-spacing:2.5px; text-transform:uppercase; margin-bottom:8px; }
.view > h1 { color:var(--azul); font-size:32px; margin:0 0 34px; }
.hub-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; margin-bottom:30px; }
.hub-btn { display:flex; flex-direction:column; align-items:flex-start; gap:6px; background:var(--claro); border:none; border-radius:12px; padding:26px 22px; cursor:pointer; text-align:left; box-shadow:0 2px 10px rgba(159,177,186,.28); font-family:Arial,Helvetica,sans-serif; position:relative; }
.hub-btn:hover { background:#E9ECEE; }
.hub-icon { font-size:30px; margin-bottom:4px; }
.hub-label { font-size:17px; font-weight:bold; color:var(--azul); }
.hub-desc { font-size:12.5px; color:var(--humo); }
.back-home { font-size:13px; color:var(--humo); text-decoration:none; }
.back-home:hover { color:var(--azul); }
.sub-view h2 { color:var(--azul); font-size:24px; margin:18px 0 4px; }
.sub-view .section-note { font-size:13px; color:var(--humo); margin:0 0 24px; }
.back-btn { background:none; border:1.5px solid var(--azul); color:var(--azul); font-size:13px; font-weight:bold; padding:6px 14px; border-radius:20px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.back-btn:hover { background:var(--azul); color:#fff; }
.dl-big { display:inline-block; background:var(--amar); color:var(--azul-d); font-weight:bold; font-size:14px; text-decoration:none; padding:10px 20px; border-radius:20px; margin-bottom:18px; }
.pdf-frame { width:100%; height:78vh; border:none; border-radius:8px; box-shadow:0 2px 10px rgba(159,177,186,.28); }
.img-frame { display:block; width:100%; height:auto; border-radius:8px; box-shadow:0 2px 10px rgba(159,177,186,.28); }
.ref-intro { color:var(--azul); font-size:16px; margin:0 0 16px; }
.ref-item { font-size:13.5px; color:var(--gris); line-height:1.6; margin:0 0 16px; padding-left:28px; text-indent:-28px; }
.ref-item a { color:var(--azul); word-break:break-all; }
.ref-item em { font-style:italic; }
.notice { font-size:12px; color:var(--humo); font-style:italic; margin-top:10px; }
/* quiz */
.quiz-start { background:var(--claro); border-radius:12px; padding:26px; }
.quiz-start p { font-size:14px; margin:0 0 18px; }
.quiz-btn { background:var(--azul); color:#fff; border:none; border-radius:20px; padding:11px 22px; font-size:14px; font-weight:bold; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.quiz-btn:hover { filter:brightness(1.15); }
.quiz-progress { font-size:12px; color:var(--humo); margin-bottom:6px; }
.quiz-q { background:var(--claro); border-radius:12px; padding:24px; margin-bottom:18px; }
.quiz-q h3 { color:var(--azul); font-size:17px; margin:0 0 18px; }
.quiz-opt { display:block; width:100%; text-align:left; background:#fff; border:1.5px solid var(--humo); border-radius:8px; padding:12px 16px; margin-bottom:10px; font-size:14px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; color:var(--gris); }
.quiz-opt:hover { border-color:var(--azul); }
.quiz-opt.correct { border-color:var(--verde); background:#EAF6EB; font-weight:bold; }
.quiz-opt.incorrect { border-color:var(--rojo); background:#FBEAEC; }
.quiz-opt[disabled] { cursor:default; }
.quiz-feedback { font-size:13px; color:var(--gris); background:#fff; border-radius:8px; padding:12px 16px; margin-top:4px; margin-bottom:16px; border-left:3px solid var(--azul); }
.quiz-score { font-size:26px; font-weight:bold; color:var(--azul); margin-bottom:8px; }
.quiz-result { background:var(--claro); border-radius:12px; padding:30px; text-align:center; }
/* interactive manual (prueba) */
.im-root { margin-top:0; }
.im-hero { position:relative; background:linear-gradient(135deg, var(--azul) 0%, var(--azul-d) 100%); border-radius:16px; padding:34px 26px 30px; margin-bottom:22px; overflow:hidden; }
.im-hero::before { content:""; position:absolute; top:-46px; right:-46px; width:190px; height:190px; border-radius:50%; background:rgba(244,197,66,.12); }
.im-hero::after { content:""; position:absolute; bottom:-60px; left:30%; width:160px; height:160px; border-radius:50%; background:rgba(255,255,255,.05); }
.im-hero-dl { position:absolute; top:16px; right:16px; background:var(--amar); color:var(--azul-d); border:none; border-radius:20px; padding:9px 16px; font-size:12px; font-weight:bold; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:6px; font-family:Arial,Helvetica,sans-serif; z-index:1; }
.im-hero-dl:hover { filter:brightness(1.08); }
.im-hero-pill { display:inline-block; background:rgba(255,255,255,.14); color:#fff; font-size:10.5px; font-weight:bold; letter-spacing:1px; text-transform:uppercase; padding:4px 10px; border-radius:20px; margin-bottom:14px; position:relative; z-index:1; }
.im-hero-kicker { color:var(--amar); font-size:12.5px; font-weight:bold; letter-spacing:.4px; margin:0 0 8px; position:relative; z-index:1; }
.im-hero-title { color:#fff; font-size:clamp(21px,3.2vw,30px); line-height:1.28; margin:0; max-width:620px; position:relative; z-index:1; }
.im-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
.im-card { text-align:left; background:var(--claro); border:none; border-radius:12px; padding:20px 20px 18px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; box-shadow:0 2px 10px rgba(159,177,186,.28); transition:transform .12s ease, background .12s ease; opacity:0; transform:translateY(10px); animation:imCardIn .35s ease forwards; }
.im-card:hover { background:#E9ECEE; transform:translateY(-2px); }
.im-card.im-card-bib { background:var(--azul); }
.im-card.im-card-bib .im-card-title, .im-card.im-card-bib .im-card-meta { color:#fff; }
.im-card-icon { font-size:24px; }
.im-card-title { display:block; font-size:16px; font-weight:bold; color:var(--azul); line-height:1.3; margin-top:10px; }
.im-card-meta { display:block; font-size:12px; color:var(--humo); margin-top:6px; }
@keyframes imCardIn { to { opacity:1; transform:translateY(0); } }
.im-rail { display:flex; gap:6px; overflow-x:auto; padding:2px 2px 14px; margin-bottom:18px; border-bottom:1px solid #E3E7E9; }
.im-rail-btn { flex:none; display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; cursor:pointer; padding:6px 9px; border-radius:10px; font-family:Arial,Helvetica,sans-serif; opacity:.5; transition:opacity .15s ease, background .15s ease; }
.im-rail-btn:hover { opacity:.85; }
.im-rail-btn.active { opacity:1; background:var(--claro); }
.im-rail-icon { font-size:16px; }
.im-rail-label { font-size:9.5px; font-weight:bold; color:var(--gris); max-width:62px; text-align:center; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.im-rail-btn.active .im-rail-label { color:var(--azul); }
.im-chapter { animation:imFadeIn .25s ease; }
@keyframes imFadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
.im-crumb { background:none; border:none; color:var(--humo); font-size:13px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; padding:0; margin-bottom:16px; text-decoration:underline; }
.im-crumb:hover { color:var(--azul); }
.im-chapter-title { color:var(--azul); font-size:23px; margin:0 0 16px; }
.im-block-p { font-size:14.5px; line-height:1.7; color:var(--gris); margin:0 0 14px; }
.im-block-ul, .im-block-ol { margin:0 0 14px; padding-left:22px; }
.im-block-ul li, .im-block-ol li { font-size:14.5px; line-height:1.65; color:var(--gris); margin-bottom:6px; }
.im-sub { border-top:1px solid #E3E7E9; }
.im-sub:first-child { border-top:none; }
.im-sub-head { width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; background:none; border:none; text-align:left; padding:16px 4px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.im-sub-head:hover .im-sub-title { color:var(--azul-d); }
.im-sub-title { font-size:15.5px; font-weight:bold; color:var(--azul); }
.im-sub-arrow { color:var(--humo); font-size:13px; transition:transform .15s ease; flex:none; }
.im-sub.open .im-sub-arrow { transform:rotate(90deg); }
.im-sub-body { max-height:0; overflow:hidden; padding:0 4px; transition:max-height .3s ease; }
.im-sub.open .im-sub-body { max-height:none; padding-bottom:14px; }
.im-code-toggle { display:inline-flex; align-items:center; gap:6px; background:#fff; border:1.5px dashed var(--humo); color:var(--azul); font-size:12.5px; font-weight:bold; border-radius:20px; padding:7px 14px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; margin:2px 0 14px; }
.im-code-toggle:hover { border-color:var(--azul); }
.im-code-box { display:none; background:#F2F4F5; border-radius:8px; padding:14px 16px; margin:0 0 14px; overflow-x:auto; animation:imFadeIn .2s ease; }
.im-code-box.open { display:block; }
.im-code-box pre { margin:0; font-family:"Courier New",monospace; font-size:13px; line-height:1.55; color:#1c2a30; white-space:pre-wrap; word-break:break-word; }
.im-table-toggle { display:inline-flex; align-items:center; gap:6px; background:#fff; border:1.5px solid var(--azul); color:var(--azul); font-size:12.5px; font-weight:bold; border-radius:20px; padding:7px 14px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; margin:2px 0 14px; }
.im-table-toggle:hover { background:var(--azul); color:#fff; }
.im-table-bare { overflow-x:auto; margin:0 0 16px; border-radius:8px; box-shadow:0 2px 10px rgba(159,177,186,.28); }
.im-table-bare table, .im-modal table { border-collapse:collapse; width:100%; font-size:13px; }
.im-table-bare th, .im-modal th { background:var(--azul); color:#fff; text-align:left; padding:9px 12px; font-size:12.5px; }
.im-table-bare td, .im-modal td { padding:9px 12px; border-bottom:1px solid #E3E7E9; color:var(--gris); }
.im-table-bare tr:nth-child(even) td, .im-modal tr:nth-child(even) td { background:var(--claro); }
.im-modal-overlay { position:fixed; inset:0; background:rgba(10,20,26,.55); display:flex; align-items:center; justify-content:center; padding:5vh 4vw; z-index:500; animation:imFadeIn .15s ease; }
.im-modal { background:#fff; border-radius:14px; max-width:760px; width:100%; max-height:90vh; display:flex; flex-direction:column; box-shadow:0 12px 40px rgba(0,0,0,.3); }
.im-modal.im-modal-wide { max-width:min(1500px, 96vw); }
.im-modal-body img { display:block; max-width:100%; max-height:72vh; width:auto; height:auto; margin:0 auto; border-radius:8px; object-fit:contain; }
.im-modal-head { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid #E3E7E9; flex:none; }
.im-modal-head h4 { margin:0; color:var(--azul); font-size:15.5px; }
.im-modal-close { background:var(--claro); border:none; width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:14px; color:var(--gris); flex:none; }
.im-modal-close:hover { background:#E3E7E9; }
.im-modal-body { flex:1; min-height:0; overflow:auto; padding:16px 20px 20px; text-align:center; }
.im-figure { margin:6px 0 20px; }
.im-figure-img { display:block; width:auto; max-width:100%; height:auto; max-height:82vh; margin:0 auto; border-radius:10px; box-shadow:0 4px 16px rgba(159,177,186,.35); cursor:zoom-in; }
.im-figure-caption { font-size:12px; color:var(--humo); text-align:center; margin-top:8px; font-style:italic; }
@media (min-width:860px) {
  .im-figure { width:min(1300px, 92vw); margin-left:calc(50% - min(650px, 46vw)); margin-right:calc(50% - min(650px, 46vw)); }
}
.im-img-btn { display:flex; align-items:center; gap:14px; width:100%; max-width:420px; background:var(--claro); border:none; border-radius:14px; padding:10px; margin:4px 0 20px; cursor:pointer; text-align:left; font-family:Arial,Helvetica,sans-serif; box-shadow:0 2px 10px rgba(159,177,186,.28); transition:transform .12s ease, background .12s ease; }
.im-img-btn:hover { background:#E9ECEE; transform:translateY(-2px); }
.im-img-btn-thumb { flex:none; width:64px; height:64px; border-radius:10px; background-size:cover; background-position:center; position:relative; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
.im-img-btn-thumb::after { content:"🔍"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:18px; background:rgba(11,44,66,.35); border-radius:10px; }
.im-img-btn-text { display:flex; flex-direction:column; gap:2px; }
.im-img-btn-label { font-size:13.5px; font-weight:bold; color:var(--azul); }
.im-img-btn-sub { font-size:11.5px; color:var(--humo); }
.im-reveal-toggle { display:inline-flex; align-items:center; gap:6px; background:#fff; border:1.5px dashed var(--humo); color:var(--azul); font-size:12.5px; font-weight:bold; border-radius:20px; padding:7px 14px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; margin:2px 0 14px; }
.im-reveal-toggle:hover { border-color:var(--azul); }
.im-reveal-box { display:none; margin:0 0 16px; }
.im-reveal-box.open { display:block; animation:imFadeIn .25s ease; }
.im-reveal-box img { display:block; width:100%; border-radius:10px; box-shadow:0 4px 16px rgba(159,177,186,.35); }
.im-errorlist { list-style:none; padding:0; margin:0 0 6px; }
.im-errorlist li { background:var(--claro); border-left:3px solid var(--rojo); border-radius:0 8px 8px 0; padding:12px 16px; margin-bottom:10px; }
.im-errorlist .im-error-term { display:block; font-weight:bold; color:var(--azul); font-size:14px; margin-bottom:4px; }
.im-errorlist .im-error-desc { font-size:13.5px; color:var(--gris); line-height:1.6; }
.im-cite { color:var(--azul); font-weight:bold; cursor:pointer; border-bottom:1.5px dotted var(--azul); white-space:normal; }
.im-cite:hover { color:var(--azul-d); }
.im-cite-pop { display:none; background:var(--azul-d); color:#fff; border-radius:8px; padding:12px 16px; font-size:12.5px; line-height:1.6; margin:6px 0 14px; }
.im-cite-pop.open { display:block; }
.im-cite-pop p { margin:0 0 8px; }
.im-cite-pop p:last-child { margin-bottom:0; }
.im-cite-pop a { color:var(--amar); }
.im-bib-list { margin-top:6px; }
.im-bib-item.im-bib-highlight { background:#FDF1C7; border-radius:8px; padding:10px 14px; margin-left:-14px; margin-right:-14px; }
code.im-inline { background:#F2F4F5; padding:1px 6px; border-radius:4px; font-family:"Courier New",monospace; font-size:.93em; }
/* teacher panel */
.teacher-banner { background:var(--azul-d); color:#fff; border-radius:12px; padding:18px 22px; margin-bottom:24px; }
.teacher-banner strong { color: var(--amar); }
.teacher-banner p { font-size:13px; margin:6px 0 0; color:var(--humo); }
.teacher-token-row { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
.teacher-token-row input { flex:1; min-width:220px; padding:9px 12px; border-radius:8px; border:none; font-size:13px; font-family:Arial,Helvetica,sans-serif; }
.teacher-token-row button { background:var(--amar); color:var(--azul-d); border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:bold; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.teacher-status { font-size:12px; margin-top:10px; min-height:16px; }
.teacher-toggle-list { list-style:none; padding:0; margin:16px 0 0; display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; }
.teacher-toggle-list li { background:rgba(255,255,255,.08); border-radius:8px; padding:10px 14px; display:flex; align-items:center; gap:10px; font-size:13px; }
.teacher-toggle-list input { width:18px; height:18px; }
.hub-btn .teacher-hint { position:absolute; top:10px; right:12px; font-size:10px; font-weight:bold; padding:2px 8px; border-radius:10px; }
.hub-btn .teacher-hint.on { background:#DFF3E0; color:var(--verde); }
.hub-btn .teacher-hint.off { background:#FBEAEC; color:var(--rojo); }
footer { text-align:center; padding:26px 6vw 40px; font-size:11px; color:var(--humo); font-style:italic; }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <div class="kicker">Tema 8</div>
    <h1>PLN</h1>
    <p>Contenido protegido. Introduce la contraseña facilitada en clase.</p>
    <input type="password" id="pw" placeholder="Contraseña" autofocus>
    <button class="submit" id="enter">Acceder</button>
    <div class="error" id="err"></div>
  </div>
</div>

<div id="page">
  <main id="content"></main>
  <footer>

  </footer>
</div>

  var QUIZ_MANUAL = [{"question":"¿Cuál es la principal ventaja de utilizar la similitud coseno en lugar de contar simplemente las palabras compartidas entre dos documentos?","answerOptions":[{"text":"Normaliza los vectores para que la longitud del texto no determine la similitud.","isCorrect":true,"rationale":"La similitud coseno utiliza la norma de los vectores en el denominador para evitar que los textos más largos parezcan más similares solo por tener más palabras."},{"text":"Permite capturar el orden sintáctico completo de las palabras en la oración analizada.","isCorrect":false,"rationale":"El modelo de bolsa de palabras utilizado en la unidad pierde por definición el orden sintáctico y discursivo."},{"text":"Identifica automáticamente sinónimos y relaciones semánticas complejas.","isCorrect":false,"rationale":"Este método se basa en la coincidencia léxica literal y no detecta sinónimos a menos que se incluyan directamente en los prototipos."},{"text":"Garantiza que las palabras comunes como las 'stopwords' tengan más peso.","isCorrect":false,"rationale":"Las 'stopwords' suelen eliminarse en el preprocesamiento porque aportan poco valor distintivo a la clasificación temática."}],"hint":"Piense en qué sucede cuando comparamos un documento muy breve con uno muy extenso."},{"question":"Al preprocesar un texto con spaCy antes de clasificarlo, ¿qué se almacena finalmente en la lista de tokens para su posterior conteo?","answerOptions":[{"text":"Los lemas de los tokens que son alfabéticos, no son 'stopwords' y tienen longitud mínima.","isCorrect":true,"rationale":"El código utiliza el atributo `tok.lemma_` tras aplicar filtros de tipo de carácter, pertenencia a lista de parada y longitud."},{"text":"El texto original en minúsculas sin ningún otro cambio.","isCorrect":false,"rationale":"El preprocesamiento implica filtrar palabras y transformar su morfología, no solo cambiar la capitalización."},{"text":"Únicamente las palabras que aparecen en el diccionario de palabras clave.","isCorrect":false,"rationale":"Se procesa todo el texto del documento para generar su vector, aunque luego se compare con los prototipos."},{"text":"Las etiquetas de categoría gramatical (POS tags) de cada palabra del texto, sin ningún filtrado adicional.","isCorrect":false,"rationale":"Aunque spaCy puede extraer categorías gramaticales, este proceso utiliza lemas para la clasificación temática."}],"hint":"Considere la función que permite agrupar variantes como 'leyes' y 'ley' bajo una misma forma."},{"question":"¿Cuál es el propósito de la medida IDF (Inverse Document Frequency) al ponderar los términos de un documento?","answerOptions":[{"text":"Reducir el peso de términos generales y resaltar términos que son más específicos o raros.","isCorrect":true,"rationale":"IDF asume que una palabra es más informativa si aparece en pocos documentos de un corpus."},{"text":"Contar cuántas veces aparece un término dentro de un solo documento específico.","isCorrect":false,"rationale":"Esa es la definición de TF (Term Frequency), no de IDF."},{"text":"Aumentar el peso de las palabras que aparecen en casi todos los documentos de la colección.","isCorrect":false,"rationale":"IDF hace lo contrario: penaliza las palabras que son demasiado comunes en toda la colección porque son menos informativas."},{"text":"Determinar la longitud euclidiana de un vector de texto.","isCorrect":false,"rationale":"La longitud del vector se calcula mediante la norma, mientras que IDF es un factor de ponderación de términos."}],"hint":"Reflexione sobre por qué palabras como 'documento' podrían ser menos útiles que 'cláusula' en una colección mixta."},{"question":"En un sistema de clasificación temática que compara cada texto con perfiles de clase construidos a partir de palabras clave, ¿cómo se define conceptualmente un 'prototipo temático'?","answerOptions":[{"text":"Un vector de frecuencias construido a partir de una lista de palabras clave seleccionadas manualmente.","isCorrect":true,"rationale":"Los prototipos se crean preprocesando y vectorizando las palabras clave que definen cada clase (jurídico, técnico, etc.)."},{"text":"Un modelo neuronal de caja negra entrenado con miles de ejemplos etiquetados por un equipo de anotadores.","isCorrect":false,"rationale":"El sistema se aleja deliberadamente de los modelos opacos para priorizar la explicabilidad humana."},{"text":"El centroide matemático de todos los documentos clasificados previamente.","isCorrect":false,"rationale":"Aunque se menciona la relación con los clasificadores de centroides, en esta unidad los prototipos se construyen de forma manual y pedagógica."},{"text":"Una regla lógica de tipo 'si-entonces' basada en la posición de las palabras.","isCorrect":false,"rationale":"El sistema utiliza un modelo de espacio vectorial, no un sistema de reglas de producción gramatical."}],"hint":"Se trata de la representación vectorial de las categorías que el analista desea identificar."},{"question":"En la implementación de la similitud coseno, ¿qué ocurre si el numerador (producto escalar) es igual a 0?","answerOptions":[{"text":"Significa que los dos vectores no comparten ningún término relevante del vocabulario.","isCorrect":true,"rationale":"El producto escalar suma los productos de las frecuencias de términos comunes; si no hay comunes, la suma es cero."},{"text":"La similitud es máxima (1.0) porque no existe ninguna interferencia posible entre los textos.","isCorrect":false,"rationale":"Un producto escalar de 0 indica ausencia de coincidencia, lo cual implica similitud nula, no máxima."},{"text":"El sistema asigna automáticamente la clase 'divulgativo' por defecto en estos casos.","isCorrect":false,"rationale":"La clasificación depende del cálculo matemático de todas las clases; no hay una asignación por defecto sin evidencia."},{"text":"Indica que uno de los documentos es exactamente el doble de largo que el otro.","isCorrect":false,"rationale":"La longitud relativa no se determina por el producto escalar, sino por la comparación de las normas."}],"hint":"Piense en la operación matemática que multiplica las frecuencias de las palabras que aparecen en ambos vectores."},{"question":"Señale un límite lingüístico importante del enfoque de clasificación basado en 'bolsa de palabras' y similitud coseno.","answerOptions":[{"text":"No puede distinguir el sentido de palabras polisémicas que cambian según el contexto.","isCorrect":true,"rationale":"Al perder el orden y el contexto sintáctico, palabras como 'artículo' (jurídico vs. periodístico) pueden causar confusión."},{"text":"Es incapaz de procesar correctamente textos en español debido a su compleja morfología verbal.","isCorrect":false,"rationale":"El uso de spaCy y la lematización permiten manejar eficazmente la morfología del español."},{"text":"Requiere obligatoriamente el uso de GPU para realizar los cálculos vectoriales.","isCorrect":false,"rationale":"La similitud coseno y el conteo de frecuencias son operaciones ligeras que se ejecutan fácilmente en CPU."},{"text":"Obliga a que todos los documentos tengan exactamente el mismo número de palabras.","isCorrect":false,"rationale":"La normalización del coseno permite comparar documentos de longitudes muy distintas."}],"hint":"Considere qué ocurre cuando una misma palabra tiene significados distintos en diferentes dominios."},{"question":"En el contexto de la 'clasificación responsable', ¿qué función cumplen las evidencias léxicas?","answerOptions":[{"text":"Permiten que una persona audite y comprenda qué términos específicos justifican la etiqueta asignada.","isCorrect":true,"rationale":"Mostrar los lemas compartidos entre el texto y el prototipo permite validar o discutir la decisión del sistema."},{"text":"Sirven para ocultar los errores del algoritmo ante el usuario final.","isCorrect":false,"rationale":"Las evidencias buscan la transparencia, no ocultar los fallos del sistema."},{"text":"Son necesarias para calcular la raíz cuadrada de la norma del vector.","isCorrect":false,"rationale":"El cálculo de la norma es una operación matemática previa e independiente de la generación de informes de evidencia."},{"text":"Garantizan que el sistema siempre acierte en su clasificación final, incluso en textos ambiguos.","isCorrect":false,"rationale":"Las evidencias explican la decisión, pero no eliminan la posibilidad de error si el prototipo está mal diseñado."}],"hint":"Recuerde el encargo del Centro Atlas sobre la necesidad de justificar las decisiones de archivo."},{"question":"¿Cuál es la fórmula correcta de la similitud coseno entre dos vectores A y B?","answerOptions":[{"text":"coseno(A, B) = (A · B) / (||A|| × ||B||)","isCorrect":true,"rationale":"Esta fórmula representa el producto escalar de los vectores dividido por el producto de sus normas (longitudes)."},{"text":"coseno(A, B) = A · B - (||A|| + ||B||)","isCorrect":false,"rationale":"La similitud coseno se basa en una división para normalizar, no en una resta de longitudes."},{"text":"coseno(A, B) = √(A² + B²)","isCorrect":false,"rationale":"Esta fórmula se asemeja más al cálculo de una hipotenusa o distancia euclidiana, no a una medida de ángulo entre vectores."},{"text":"coseno(A, B) = (||A|| × ||B||) / (A · B)","isCorrect":false,"rationale":"En esta opción los términos están invertidos; el producto escalar debe estar en el numerador."}],"hint":"La medida busca evaluar la orientación de los vectores independientemente de su magnitud."},{"question":"Al construir un clasificador con Python, ¿por qué se utiliza la clase `Counter` de la librería `collections`?","answerOptions":[{"text":"Para representar vectores dispersos de forma eficiente, guardando solo las palabras presentes.","isCorrect":true,"rationale":"Un `Counter` solo almacena las palabras que aparecen en el texto, lo que ahorra memoria frente a matrices completas de vocabulario."},{"text":"Para cifrar el contenido de los textos por motivos de seguridad.","isCorrect":false,"rationale":"La seguridad no es el objetivo de `Counter`; su función es el análisis estadístico simple de frecuencias."},{"text":"Para traducir automáticamente los términos del español al inglés antes de clasificarlos en su categoría.","isCorrect":false,"rationale":"El conteo de frecuencias no implica traducción de idiomas."},{"text":"Para eliminar permanentemente todas las palabras del sistema una vez clasificadas.","isCorrect":false,"rationale":"El objetivo es representar el texto para su análisis, no borrar la información."}],"hint":"Piense en cómo se representa un texto donde la inmensa mayoría de las palabras del idioma no aparecen."},{"question":"Si un texto trata sobre un 'manual para configurar un dispositivo', pero la clase 'técnico' solo tiene palabras clave como 'instalar' y 'puerto', ¿qué limitación podría presentarse?","answerOptions":[{"text":"Un problema de sinonimia o falta de cobertura en el prototipo.","isCorrect":true,"rationale":"Si las señales del texto no coinciden con las del prototipo (aunque el tema sea el mismo), la similitud será baja."},{"text":"Un error de polisemia, ya que la misma palabra podría pertenecer a varias clases distintas.","isCorrect":false,"rationale":"La polisemia ocurre cuando una palabra tiene varios significados, no cuando faltan palabras en el perfil."},{"text":"Un exceso de 'stopwords' en el texto.","isCorrect":false,"rationale":"El problema descrito se refiere a términos de contenido técnico que no están mapeados, no a palabras funcionales."},{"text":"Un fallo en la normalización del coseno.","isCorrect":false,"rationale":"La normalización funciona correctamente; el problema es que el producto escalar será 0 por falta de términos comunes."}],"hint":"Reflexione sobre la importancia de la calidad y variedad de la lista de palabras clave manuales."}];

  function sha256Hex(text) {
    var enc = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", enc).then(function(buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function(b) {
        return b.toString(16).padStart(2, "0");
      }).join("");
    });
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function renderQuizStart() {
    var root = document.getElementById("quiz-root");
    if (!root) return;
    root.innerHTML =
      '<div class="quiz-start">' +
      '<p>10 preguntas: 5 elegidas al azar del banco del manual y 5 del banco del cuaderno. Puedes repetir el intento tantas veces como quieras — cada vez se vuelven a elegir y reordenar las preguntas.</p>' +

  function startQuiz() {
    var fromManual = shuffle(QUIZ_MANUAL).slice(0, 5);
    var fromCuaderno = shuffle(QUIZ_CUADERNO).slice(0, 5);
    quizState = { questions: shuffle(fromManual.concat(fromCuaderno)), index: 0, score: 0 };
    renderQuizQuestion();
  }

  function renderQuizQuestion() {
    var root = document.getElementById("quiz-root");
    var total = quizState.questions.length;
    if (quizState.index >= total) {
      root.innerHTML =
        '<div class="quiz-result">' +
        '<div class="quiz-score">' + quizState.score + ' / ' + total + '</div>' +
        '<p>Puntuación de este intento.</p>' +
        '<button class="quiz-btn" id="quiz-retry">Volver a intentar</button>' +
        '</div>';
      document.getElementById("quiz-retry").addEventListener("click", startQuiz);
      return;
    }
    var q = quizState.questions[quizState.index];
    var opts = shuffle(q.answerOptions);
    var html = '<div class="quiz-progress">Pregunta ' + (quizState.index + 1) + ' de ' + total + ' · Puntuación provisional: ' + quizState.score + '</div>';
    html += '<div class="quiz-q"><h3>' + q.question + '</h3>';
    opts.forEach(function(opt, i) {
      html += '<button class="quiz-opt" data-idx="' + i + '">' + opt.text + '</button>';
    });
    html += '<div class="quiz-feedback" id="quiz-feedback" hidden></div>';
    html += '</div>';
    root.innerHTML = html;
    var buttons = root.querySelectorAll(".quiz-opt");
    buttons.forEach(function(btn, i) {
      btn.addEventListener("click", function() {
        buttons.forEach(function(b) { b.disabled = true; });
        var chosen = opts[i];
        if (chosen.isCorrect) { btn.classList.add("correct"); quizState.score++; }
        else {
          btn.classList.add("incorrect");
          buttons.forEach(function(b2, j) { if (opts[j].isCorrect) b2.classList.add("correct"); });
        }
        var fb = document.getElementById("quiz-feedback");
        fb.hidden = false;
        fb.textContent = chosen.rationale || (chosen.isCorrect ? "Correcto." : "Incorrecto.");
        var next = document.createElement("button");
        next.className = "quiz-btn";
        next.style.marginTop = "14px";
        next.textContent = quizState.index + 1 < total ? "Siguiente" : "Ver puntuación";
        next.addEventListener("click", function() { quizState.index++; renderQuizQuestion(); });
        root.querySelector(".quiz-q").appendChild(next);
      });
    });
  }

  function imEsc(s) {

  function imFormatBackticks(s) {
    var parts = s.split("`"), out = "";
    for (var i = 0; i < parts.length; i++) out += (i % 2 === 1) ? '<code class="im-inline">' + imEsc(parts[i]) + "</code>" : imEsc(parts[i]);
    return out;
  }
  function imFormatInline(raw) {
    var re = /{{cite:([^}]*)}}([\s\S]*?){{\/cite}}/g;
    var out = "", last = 0, m;
    while ((m = re.exec(raw))) {
      out += imFormatBackticks(raw.slice(last, m.index));
      out += '<span class="im-cite" data-refs="' + m[1] + '">' + imFormatBackticks(m[2]) + ' <span aria-hidden="true">ⓘ</span></span>';
      last = re.lastIndex;
    }
    out += imFormatBackticks(raw.slice(last));
    return out;
  }
  function imLinkify(text) {
    var re = /(https?:\/\/[^\s]+)/g;
    var out = "", last = 0, m;
    while ((m = re.exec(text))) {
      out += imEsc(text.slice(last, m.index));
      var url = m[1].replace(/[.,;]+$/, "");
      out += '<a href="' + imEsc(url) + '" target="_blank" rel="noopener">' + imEsc(url) + "</a>";
      last = m.index + url.length;
    }
    out += imEsc(text.slice(last));
    return out;
  }
  function imBibText(text) {
    // *word* marks an APA-italicized container title (book/journal name+volume/etc.)
    return text.split(/(\*[^*]+\*)/g).map(function(part) {
      if (part.charAt(0) === "*" && part.charAt(part.length - 1) === "*" && part.length > 1) {
        return "<em>" + imLinkify(part.slice(1, -1)) + "</em>";
      }
      return imLinkify(part);
    }).join("");
  }

        var box = document.getElementById("im-code-" + btn.dataset.imCode);
        var open = box.classList.toggle("open");
        btn.textContent = open ? "🔽 Ocultar el código" : "🔎 Descubre el código";
      });
    });
    root.querySelectorAll("[data-im-table]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var tpl = root.querySelector('[data-im-table-src="' + btn.dataset.imTable + '"]');
        if (tpl) imOpenModal(btn.dataset.imTableTitle, tpl.innerHTML);
      });
    });
    root.querySelectorAll(".im-cite").forEach(function(span) {
      span.addEventListener("click", function() {
        var existing = span.nextElementSibling;
        if (existing && existing.classList && existing.classList.contains("im-cite-pop")) {
          existing.classList.toggle("open");
          return;
        }
        var refs = imRefLookup(data);
        var keys = span.dataset.refs.split(",");
        var pop = document.createElement("div");
        pop.className = "im-cite-pop open";
        pop.innerHTML = keys.map(function(k) { return "<p>" + imBibText(refs[k] || k) + "</p>"; }).join("") +
          '<p><a href="#" data-im-goto-bib="' + keys[0] + '">Ver en Bibliografía →</a></p>';
        span.parentNode.insertBefore(pop, span.nextSibling);
        pop.querySelector("[data-im-goto-bib]").addEventListener("click", function(e) {
          e.preventDefault();
          imShowBib(root, data, this.dataset.imGotoBib);
        });
      });
    });
  }
  function imRailHtml(data, activeIdx) {
    var items = '<button class="im-rail-btn" data-im-rail-home="1"><span class="im-rail-icon">🏠</span><span class="im-rail-label">Índice</span></button>';
    items += data.sections.map(function(sec, i) {
      var icon = IM_ICONS[sec.navTitle] || "📖";
      return '<button class="im-rail-btn' + (activeIdx === i ? " active" : "") + '" data-im-rail-chapter="' + i + '">' +
        '<span class="im-rail-icon">' + icon + '</span><span class="im-rail-label">' + imEsc(sec.navTitle) + "</span></button>";
    }).join("");
    items += '<button class="im-rail-btn' + (activeIdx === "bib" ? " active" : "") + '" data-im-rail-bib="1">' +
      '<span class="im-rail-icon">📖</span><span class="im-rail-label">Bibliografía</span></button>';
    return '<div class="im-rail">' + items + "</div>";
  }
  function imWireRail(root, data) {
    var homeBtn = root.querySelector("[data-im-rail-home]");
    if (homeBtn) homeBtn.addEventListener("click", function() { imShowIndex(root, data); });
    root.querySelectorAll("[data-im-rail-chapter]").forEach(function(btn) {
      btn.addEventListener("click", function() { imShowChapter(root, data, parseInt(btn.dataset.imRailChapter, 10)); });
    });
    var railBib = root.querySelector("[data-im-rail-bib]");
    if (railBib) railBib.addEventListener("click", function() { imShowBib(root, data, null); });
  }
  function imShowBib(root, data, highlightKey) {
    var html = imRailHtml(data, "bib");
    html += '<div class="im-chapter"><h3 class="im-chapter-title">📖 Bibliografía</h3>';
    html += '<h4 class="ref-intro">Referencias en formato APA (7ª edición)</h4>';
    html += '<div class="im-bib-list">' + data.references.map(function(r) {
      var cls = "ref-item im-bib-item" + (r.key === highlightKey ? " im-bib-highlight" : "");
      return '<p class="' + cls + '" id="im-bib-' + r.key + '">' + imBibText(r.text) + "</p>";
    }).join("") + "</div></div>";
    root.innerHTML = html;
    imWireRail(root, data);
    if (highlightKey) {
      var el = document.getElementById("im-bib-" + highlightKey);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }
  function imShowChapter(root, data, idx) {
    var sec = data.sections[idx];
    var icon = IM_ICONS[sec.navTitle] || "📖";
    var html = imRailHtml(data, idx);
    html += '<div class="im-chapter"><h3 class="im-chapter-title">' + icon + " " + imFormatInline(sec.title) + "</h3>";
    html += imRenderBlocks(sec.blocks, idx + "-i");
    sec.subsections.forEach(function(sub, j) {
      html += '<div class="im-sub" data-im-sub="' + j + '">' +
        '<button class="im-sub-head"><span class="im-sub-title">' + imFormatInline(sub.title) + '</span><span class="im-sub-arrow">▶</span></button>' +
        '<div class="im-sub-body">' + imRenderBlocks(sub.blocks, idx + "-" + j) + "</div></div>";
    });
    html += "</div>";
    root.innerHTML = html;
    imWireCommon(root, data);
    imWireRail(root, data);
    root.querySelectorAll(".im-sub-head").forEach(function(head) {
      head.addEventListener("click", function() {
        var thisSub = head.parentElement;
        var wasOpen = thisSub.classList.contains("open");
        root.querySelectorAll(".im-sub.open").forEach(function(s) { s.classList.remove("open"); });
        if (!wasOpen) thisSub.classList.add("open");
      });
    });
  }
  function imShowIndex(root, data) {
    var pdf = root.dataset.pdf;
    var cards = data.sections.map(function(sec, i) {
      var icon = IM_ICONS[sec.navTitle] || "📖";
      return '<button class="im-card" data-im-chapter="' + i + '" style="animation-delay:' + (i * 0.04) + 's">' +
        '<span class="im-card-icon">' + icon + '</span>' +
        '<span class="im-card-title">' + imEsc(sec.navTitle) + "</span>" +
        (sec.subsections.length ? '<span class="im-card-meta">' + sec.subsections.length + " apartados</span>" : "") +
        "</button>";
    }).join("");
    var bibCard = '<button class="im-card im-card-bib" data-im-bib="1" style="animation-delay:' + (data.sections.length * 0.04) + 's">' +
      '<span class="im-card-icon">📖</span><span class="im-card-title">Bibliografía</span>' +
      '<span class="im-card-meta">' + data.references.length + ' referencias en APA 7ª ed.</span></button>';
    var hero = '<div class="im-hero">' +
      (pdf ? '<a class="im-hero-dl" href="' + imEsc(pdf) + '" download>⬇ Descargar manual en PDF</a>' : "") +
      '<div class="im-hero-pill">Versión interactiva · prueba</div>' +
      '<div class="im-hero-kicker">' + imEsc(data.header.kicker) + " · " + imEsc(data.header.title) + "</div>" +
      '<h1 class="im-hero-title">' + imEsc(data.header.subtitle) + "</h1></div>";
    root.innerHTML = hero + '<div class="im-grid">' + cards + bibCard + "</div>";
    root.querySelectorAll("[data-im-chapter]").forEach(function(btn) {
      btn.addEventListener("click", function() { imShowChapter(root, data, parseInt(btn.dataset.imChapter, 10)); });
    });
    var bibBtn = root.querySelector("[data-im-bib]");
    if (bibBtn) bibBtn.addEventListener("click", function() { imShowBib(root, data, null); });
  }
  function renderInteractiveManual(viewKey) {
    if (imRendered[viewKey]) return;
    imRendered[viewKey] = true;
    var data = IM_DATA[viewKey];
    if (!data) return;
    var root = document.getElementById("im-root-" + viewKey);
    if (!root) return;
    imShowIndex(root, data);
  }

  function wireNav() {
    document.querySelectorAll(".hub-btn").forEach(function(btn) {
      btn.addEventListener("click", function() {
        showView(btn.dataset.view);
        if (btn.dataset.view === "quiz") renderQuizStart();
        if (IM_DATA[btn.dataset.view]) renderInteractiveManual(btn.dataset.view);
      });
    });
    document.querySelectorAll("[data-back]").forEach(function(btn) {
      btn.addEventListener("click", function() { showView(btn.dataset.back); });
    });
  }

  function applyStudentVisibility(config) {
    document.querySelectorAll(".hub-btn[data-type]").forEach(function(btn) {
      var t = btn.dataset.type;
      btn.style.display = config[t] ? "" : "none";
    });
  }

  function applyTeacherHints(config) {
    document.querySelectorAll(".teacher-hint[data-hint]").forEach(function(span) {
      var t = span.dataset.hint;
      var on = !!config[t];
      span.textContent = on ? "visible" : "oculto";
      span.className = "teacher-hint " + (on ? "on" : "off");
    });
    document.querySelectorAll("#teacher-panel input[type=checkbox][data-type]").forEach(function(chk) {
      chk.checked = !!config[chk.dataset.type];
    });
  }

  function fetchConfig() {
    return fetch(LOCAL_CONFIG + "?t=" + Date.now()).then(function(r) { return r.json(); });
  }

  function ghHeaders(token) {
    return { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" };
  }

  function ghGetFile(token) {
    return fetch("https://api.github.com/repos/" + REPO + "/contents/" + GH_CONFIG_PATH, { headers: ghHeaders(token) })
      .then(function(r) {
        if (!r.ok) throw new Error("No se pudo leer el fichero (" + r.status + ")");
        return r.json();
      })
      .then(function(data) {
        configSha = data.sha;
        return JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\n/g, "")))));
      });
  }

  function ghSaveFile(token, configObj) {
    var content = btoa(unescape(encodeURIComponent(JSON.stringify(configObj, null, 2) + "\n")));
    return fetch("https://api.github.com/repos/" + REPO + "/contents/" + GH_CONFIG_PATH, {
      method: "PUT",
      headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders(token)),
      body: JSON.stringify({
        message: "Modo profesora: actualizar visibilidad de materiales (" + GH_CONFIG_PATH + ")",
        content: content,
        sha: configSha
      })
    }).then(function(r) {
      if (!r.ok) return r.text().then(function(t) { throw new Error("Error al guardar (" + r.status + "): " + t); });
      return r.json();
    }).then(function(data) {
      configSha = data.content.sha;
    });
  }

  function getToken() {
    try { return sessionStorage.getItem("gh_pat") || ""; } catch (e) { return ""; }
  }
  function setToken(t) {
    try { sessionStorage.setItem("gh_pat", t); } catch (e) {}
  }

  function setStatus(msg, isError) {
    var el = document.getElementById("teacher-status");
    if (!el) return;
    el.textContent = msg;
    el.style.color = isError ? "#FFB3B3" : "#9FE6A0";
  }

  function initTeacherPanel() {
    document.getElementById("teacher-panel").hidden = false;
    var tokenInput = document.getElementById("gh-token");
    tokenInput.value = getToken();

    document.getElementById("gh-token-save").addEventListener("click", function() {
      setToken(tokenInput.value.trim());
      setStatus(tokenInput.value.trim() ? "Token guardado para esta sesión." : "Token borrado.");
      refreshFromGithub();
    });

    document.querySelectorAll("#teacher-panel input[type=checkbox][data-type]").forEach(function(chk) {
      chk.addEventListener("change", function() {
        var token = getToken();
        if (!token) { setStatus("Pega primero tu token de GitHub.", true); chk.checked = !chk.checked; return; }
        setStatus("Guardando...");
        ghGetFile(token).then(function(current) {
          current[chk.dataset.type] = chk.checked;
          return ghSaveFile(token, current).then(function() { return current; });
        }).then(function(current) {
          applyTeacherHints(current);
          setStatus("Guardado ✓ — el alumnado lo verá en 1-2 minutos.");
        }).catch(function(err) {
          chk.checked = !chk.checked;
          setStatus(err.message, true);
        });
      });
    });

    refreshFromGithub();

    function refreshFromGithub() {
      var token = getToken();
      if (!token) { fetchConfig().then(applyTeacherHints); return; }
      setStatus("Cargando estado actual...");
      ghGetFile(token).then(function(current) {
        applyTeacherHints(current);
        setStatus("Conectado. Puedes marcar/desmarcar materiales.");
      }).catch(function(err) { setStatus(err.message, true); fetchConfig().then(applyTeacherHints); });
    }
  }

  function reveal(teacherMode) {
    isTeacher = teacherMode;
    document.getElementById("content").innerHTML = decodeURIComponent(escape(atob(PAYLOAD)));
    document.getElementById("gate").style.display = "none";
    document.getElementById("page").style.display = "block";
    wireNav();
    if (teacherMode) {
      document.querySelectorAll(".hub-btn[data-type]").forEach(function(btn) { btn.style.display = ""; });
      initTeacherPanel();
    } else {
      fetchConfig().then(applyStudentVisibility);
    }
    try { sessionStorage.setItem(SESSION_KEY, teacherMode ? "teacher" : "1"); } catch (e) {}
  }

  function tryUnlock() {
    var val = document.getElementById("pw").value;
    sha256Hex(val).then(function(hex) {
      if (hex === TEACHER_HASH) { reveal(true); return; }
      if (hex === HASH) {
        fetch(ROOT_CONFIG + "?t=" + Date.now()).then(function(r) { return r.json(); }).then(function(rootCfg) {
          if (rootCfg[TEMA_KEY] === false) {
            document.getElementById("err").textContent = "Este tema no está disponible por el momento.";
          } else {
            reveal(false);
          }
        }).catch(function() { reveal(false); });
        return;
      }
      document.getElementById("err").textContent = "Contraseña incorrecta.";
    });
  }

  document.getElementById("enter").addEventListener("click", tryUnlock);
  document.getElementById("pw").addEventListener("keydown", function(e) { if (e.key === "Enter") tryUnlock(); });

  try {
    var saved = sessionStorage.getItem(SESSION_KEY);
    if (saved === "teacher") reveal(true);
    else if (saved === "1") reveal(false);
  } catch (e) {}
})();
</script>
</body>
</html>
