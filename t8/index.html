  var QUIZ_MANUAL = [{"question":"¿Cuál es la principal ventaja de utilizar la similitud coseno en lugar de contar simplemente las palabras compartidas entre dos documentos?","answerOptions":[{"text":"Normaliza los vectores para que la longitud del texto no determine la similitud.","isCorrect":true,"rationale":"La similitud coseno utiliza la norma de los vectores en el denominador para evitar que los textos más largos parezcan más similares solo por tener más palabras."},{"text":"Permite capturar el orden sintáctico completo de las palabras en la oración analizada.","isCorrect":false,"rationale":"El modelo de bolsa de palabras utilizado en la unidad pierde por definición el orden sintáctico y discursivo."},{"text":"Identifica automáticamente sinónimos y relaciones semánticas complejas.","isCorrect":false,"rationale":"Este método se basa en la coincidencia léxica literal y no detecta sinónimos a menos que se incluyan directamente en los prototipos."},{"text":"Garantiza que las palabras comunes como las 'stopwords' tengan más peso.","isCorrect":false,"rationale":"Las 'stopwords' suelen eliminarse en el preprocesamiento porque aportan poco valor distintivo a la clasificación temática."}],"hint":"Piense en qué sucede cuando comparamos un documento muy breve con uno muy extenso."},{"question":"Al preprocesar un texto con spaCy antes de clasificarlo, ¿qué se almacena finalmente en la lista de tokens para su posterior conteo?","answerOptions":[{"text":"Los lemas de los tokens que son alfabéticos, no son 'stopwords' y tienen longitud mínima.","isCorrect":true,"rationale":"El código utiliza el atributo `tok.lemma_` tras aplicar filtros de tipo de carácter, pertenencia a lista de parada y longitud."},{"text":"El texto original en minúsculas sin ningún otro cambio.","isCorrect":false,"rationale":"El preprocesamiento implica filtrar palabras y transformar su morfología, no solo cambiar la capitalización."},{"text":"Únicamente las palabras que aparecen en el diccionario de palabras clave.","isCorrect":false,"rationale":"Se procesa todo el texto del documento para generar su vector, aunque luego se compare con los prototipos."},{"text":"Las etiquetas de categoría gramatical (POS tags) de cada palabra del texto, sin ningún filtrado adicional.","isCorrect":false,"rationale":"Aunque spaCy puede extraer categorías gramaticales, este proceso utiliza lemas para la clasificación temática."}],"hint":"Considere la función que permite agrupar variantes como 'leyes' y 'ley' bajo una misma forma."},{"question":"¿Cuál es el propósito de la medida IDF (Inverse Document Frequency) al ponderar los términos de un documento?","answerOptions":[{"text":"Reducir el peso de términos generales y resaltar términos que son más específicos o raros.","isCorrect":true,"rationale":"IDF asume que una palabra es más informativa si aparece en pocos documentos de un corpus."},{"text":"Contar cuántas veces aparece un término dentro de un solo documento específico.","isCorrect":false,"rationale":"Esa es la definición de TF (Term Frequency), no de IDF."},{"text":"Aumentar el peso de las palabras que aparecen en casi todos los documentos de la colección.","isCorrect":false,"rationale":"IDF hace lo contrario: penaliza las palabras que son demasiado comunes en toda la colección porque son menos informativas."},{"text":"Determinar la longitud euclidiana de un vector de texto.","isCorrect":false,"rationale":"La longitud del vector se calcula mediante la norma, mientras que IDF es un factor de ponderación de términos."}],"hint":"Reflexione sobre por qué palabras como 'documento' podrían ser menos útiles que 'cláusula' en una colección mixta."},{"question":"En un sistema de clasificación temática que compara cada texto con perfiles de clase construidos a partir de palabras clave, ¿cómo se define conceptualmente un 'prototipo temático'?","answerOptions":[{"text":"Un vector de frecuencias construido a partir de una lista de palabras clave seleccionadas manualmente.","isCorrect":true,"rationale":"Los prototipos se crean preprocesando y vectorizando las palabras clave que definen cada clase (jurídico, técnico, etc.)."},{"text":"Un modelo neuronal de caja negra entrenado con miles de ejemplos etiquetados por un equipo de anotadores.","isCorrect":false,"rationale":"El sistema se aleja deliberadamente de los modelos opacos para priorizar la explicabilidad humana."},{"text":"El centroide matemático de todos los documentos clasificados previamente.","isCorrect":false,"rationale":"Aunque se menciona la relación con los clasificadores de centroides, en esta unidad los prototipos se construyen de forma manual y pedagógica."},{"text":"Una regla lógica de tipo 'si-entonces' basada en la posición de las palabras.","isCorrect":false,"rationale":"El sistema utiliza un modelo de espacio vectorial, no un sistema de reglas de producción gramatical."}],"hint":"Se trata de la representación vectorial de las categorías que el analista desea identificar."},{"question":"En la implementación de la similitud coseno, ¿qué ocurre si el numerador (producto escalar) es igual a 0?","answerOptions":[{"text":"Significa que los dos vectores no comparten ningún término relevante del vocabulario.","isCorrect":true,"rationale":"El producto escalar suma los productos de las frecuencias de términos comunes; si no hay comunes, la suma es cero."},{"text":"La similitud es máxima (1.0) porque no existe ninguna interferencia posible entre los textos.","isCorrect":false,"rationale":"Un producto escalar de 0 indica ausencia de coincidencia, lo cual implica similitud nula, no máxima."},{"text":"El sistema asigna automáticamente la clase 'divulgativo' por defecto en estos casos.","isCorrect":false,"rationale":"La clasificación depende del cálculo matemático de todas las clases; no hay una asignación por defecto sin evidencia."},{"text":"Indica que uno de los documentos es exactamente el doble de largo que el otro.","isCorrect":false,"rationale":"La longitud relativa no se determina por el producto escalar, sino por la comparación de las normas."}],"hint":"Piense en la operación matemática que multiplica las frecuencias de las palabras que aparecen en ambos vectores."},{"question":"Señale un límite lingüístico importante del enfoque de clasificación basado en 'bolsa de palabras' y similitud coseno.","answerOptions":[{"text":"No puede distinguir el sentido de palabras polisémicas que cambian según el contexto.","isCorrect":true,"rationale":"Al perder el orden y el contexto sintáctico, palabras como 'artículo' (jurídico vs. periodístico) pueden causar confusión."},{"text":"Es incapaz de procesar correctamente textos en español debido a su compleja morfología verbal.","isCorrect":false,"rationale":"El uso de spaCy y la lematización permiten manejar eficazmente la morfología del español."},{"text":"Requiere obligatoriamente el uso de GPU para realizar los cálculos vectoriales.","isCorrect":false,"rationale":"La similitud coseno y el conteo de frecuencias son operaciones ligeras que se ejecutan fácilmente en CPU."},{"text":"Obliga a que todos los documentos tengan exactamente el mismo número de palabras.","isCorrect":false,"rationale":"La normalización del coseno permite comparar documentos de longitudes muy distintas."}],"hint":"Considere qué ocurre cuando una misma palabra tiene significados distintos en diferentes dominios."},{"question":"En el contexto de la 'clasificación responsable', ¿qué función cumplen las evidencias léxicas?","answerOptions":[{"text":"Permiten que una persona audite y comprenda qué términos específicos justifican la etiqueta asignada.","isCorrect":true,"rationale":"Mostrar los lemas compartidos entre el texto y el prototipo permite validar o discutir la decisión del sistema."},{"text":"Sirven para ocultar los errores del algoritmo ante el usuario final.","isCorrect":false,"rationale":"Las evidencias buscan la transparencia, no ocultar los fallos del sistema."},{"text":"Son necesarias para calcular la raíz cuadrada de la norma del vector.","isCorrect":false,"rationale":"El cálculo de la norma es una operación matemática previa e independiente de la generación de informes de evidencia."},{"text":"Garantizan que el sistema siempre acierte en su clasificación final, incluso en textos ambiguos.","isCorrect":false,"rationale":"Las evidencias explican la decisión, pero no eliminan la posibilidad de error si el prototipo está mal diseñado."}],"hint":"Recuerde el encargo del Centro Atlas sobre la necesidad de justificar las decisiones de archivo."},{"question":"¿Cuál es la fórmula correcta de la similitud coseno entre dos vectores A y B?","answerOptions":[{"text":"coseno(A, B) = (A · B) / (||A|| × ||B||)","isCorrect":true,"rationale":"Esta fórmula representa el producto escalar de los vectores dividido por el producto de sus normas (longitudes)."},{"text":"coseno(A, B) = A · B - (||A|| + ||B||)","isCorrect":false,"rationale":"La similitud coseno se basa en una división para normalizar, no en una resta de longitudes."},{"text":"coseno(A, B) = √(A² + B²)","isCorrect":false,"rationale":"Esta fórmula se asemeja más al cálculo de una hipotenusa o distancia euclidiana, no a una medida de ángulo entre vectores."},{"text":"coseno(A, B) = (||A|| × ||B||) / (A · B)","isCorrect":false,"rationale":"En esta opción los términos están invertidos; el producto escalar debe estar en el numerador."}],"hint":"La medida busca evaluar la orientación de los vectores independientemente de su magnitud."},{"question":"Al construir un clasificador con Python, ¿por qué se utiliza la clase `Counter` de la librería `collections`?","answerOptions":[{"text":"Para representar vectores dispersos de forma eficiente, guardando solo las palabras presentes.","isCorrect":true,"rationale":"Un `Counter` solo almacena las palabras que aparecen en el texto, lo que ahorra memoria frente a matrices completas de vocabulario."},{"text":"Para cifrar el contenido de los textos por motivos de seguridad.","isCorrect":false,"rationale":"La seguridad no es el objetivo de `Counter`; su función es el análisis estadístico simple de frecuencias."},{"text":"Para traducir automáticamente los términos del español al inglés antes de clasificarlos en su categoría.","isCorrect":false,"rationale":"El conteo de frecuencias no implica traducción de idiomas."},{"text":"Para eliminar permanentemente todas las palabras del sistema una vez clasificadas.","isCorrect":false,"rationale":"El objetivo es representar el texto para su análisis, no borrar la información."}],"hint":"Piense en cómo se representa un texto donde la inmensa mayoría de las palabras del idioma no aparecen."},{"question":"Si un texto trata sobre un 'manual para configurar un dispositivo', pero la clase 'técnico' solo tiene palabras clave como 'instalar' y 'puerto', ¿qué limitación podría presentarse?","answerOptions":[{"text":"Un problema de sinonimia o falta de cobertura en el prototipo.","isCorrect":true,"rationale":"Si las señales del texto no coinciden con las del prototipo (aunque el tema sea el mismo), la similitud será baja."},{"text":"Un error de polisemia, ya que la misma palabra podría pertenecer a varias clases distintas.","isCorrect":false,"rationale":"La polisemia ocurre cuando una palabra tiene varios significados, no cuando faltan palabras en el perfil."},{"text":"Un exceso de 'stopwords' en el texto.","isCorrect":false,"rationale":"El problema descrito se refiere a términos de contenido técnico que no están mapeados, no a palabras funcionales."},{"text":"Un fallo en la normalización del coseno.","isCorrect":false,"rationale":"La normalización funciona correctamente; el problema es que el producto escalar será 0 por falta de términos comunes."}],"hint":"Reflexione sobre la importancia de la calidad y variedad de la lista de palabras clave manuales."}];
  var QUIZ_CUADERNO = [{"question":"¿Cuál es el objetivo principal de un sistema de clasificación temática basado en palabras clave y similitud coseno?","answerOptions":[{"text":"Asignar una clase temática de forma que la decisión sea explicable y auditable.","isCorrect":true,"rationale":"La meta central es clasificar textos basándose en criterios claros y evidencias visibles que un humano pueda validar."},{"text":"Entrenar redes neuronales profundas para maximizar la precisión del modelo final.","isCorrect":false,"rationale":"Este enfoque evita el uso de modelos de 'caja negra' o redes neuronales complejas en favor de la interpretabilidad."},{"text":"Eliminar por completo la necesidad de revisión humana en el archivo digital.","isCorrect":false,"rationale":"El sistema está diseñado precisamente para permitir y facilitar la revisión por parte de profesionales como archiveros o juristas."},{"text":"Utilizar embeddings opacos para capturar relaciones semánticas profundas.","isCorrect":false,"rationale":"Se evita el uso de embeddings sin explicación para mantener el sistema transparente y basado en palabras clave directas."}],"hint":"Busca el equilibrio entre la automatización y la capacidad de justificar el 'porqué' del resultado."},{"question":"En el contexto de este modelo, ¿qué representa un vector de frecuencia de términos (TF)?","answerOptions":[{"text":"Un diccionario que asocia cada lema con el número de veces que aparece en el texto.","isCorrect":true,"rationale":"La representación vectorial simple (TF) se basa en el recuento de frecuencias de las palabras importantes (lemas) tras el preprocesamiento."},{"text":"Una lista de las coordenadas espaciales de cada frase en el documento.","isCorrect":false,"rationale":"El vector TF no guarda información sobre la posición o estructura de las frases, sino sobre el conteo de términos."},{"text":"Un modelo probabilístico que predice la siguiente palabra más probable.","isCorrect":false,"rationale":"Predecir la siguiente palabra es una tarea de modelos de lenguaje, no de una representación simple de bolsa de palabras para clasificación."},{"text":"Un índice de la dificultad gramatical del texto analizado.","isCorrect":false,"rationale":"Aunque la frecuencia puede dar pistas sobre el registro, el vector TF se usa aquí para identificar la temática, no la complejidad gramatical."}],"hint":"Piensa en cómo se traduce un texto a números basándose únicamente en el recuento de palabras."},{"question":"¿Cómo se interpreta conceptualmente una similitud coseno con valor de 1 entre un texto y un prototipo?","answerOptions":[{"text":"Ambos comparten las mismas palabras importantes en proporciones muy similares.","isCorrect":true,"rationale":"Un valor cercano a 1 indica una alta coincidencia en el vocabulario y en la distribución de las palabras clave."},{"text":"Los textos no comparten ninguna palabra en absoluto.","isCorrect":false,"rationale":"Un valor de 0 indicaría que no hay ninguna relación léxica o vocabulario compartido entre los vectores."},{"text":"El texto tiene exactamente la misma longitud que el prototipo.","isCorrect":false,"rationale":"La similitud coseno es independiente de la longitud del texto; mide el ángulo entre los vectores de frecuencia, no su magnitud."},{"text":"El texto es un fragmento literario con muchas metáforas.","isCorrect":false,"rationale":"El valor de la similitud es una medida matemática de parecido léxico, no una etiqueta temática por sí misma."}],"hint":"Recuerda la analogía del 'ángulo' entre dos flechas que apuntan en la misma dirección."},{"question":"¿Cuál es la función de la lematización dentro del pipeline de preprocesamiento con spaCy?","answerOptions":[{"text":"Agrupar variantes de una palabra, como 'ley' y 'leyes', bajo una forma común.","isCorrect":true,"rationale":"Normalizar las palabras a su lema permite que el sistema reconozca que diferentes formas flexivas pertenecen al mismo concepto temático."},{"text":"Traducir términos técnicos complejos a un lenguaje más divulgativo.","isCorrect":false,"rationale":"La lematización no cambia el registro del lenguaje, sino que reduce las palabras a su forma base o de diccionario."},{"text":"Identificar y corregir errores ortográficos automáticamente.","isCorrect":false,"rationale":"La lematización asume que las palabras están correctamente escritas para encontrar su raíz lingüística; no es un corrector."},{"text":"Eliminar palabras comunes como preposiciones, artículos y conjunciones del texto.","isCorrect":false,"rationale":"Esa función corresponde específicamente a la eliminación de 'stopwords', no a la lematización."}],"hint":"Considera cómo podrías hacer que el sistema entienda que 'cantamos' y 'cantó' se refieren a la misma acción."},{"question":"¿Qué constituye una 'evidencia léxica' en el informe final de clasificación?","answerOptions":[{"text":"Los lemas del texto que coinciden con el prototipo de la clase ganadora.","isCorrect":true,"rationale":"Las evidencias son las palabras clave detectadas que 'empujaron' la similitud hacia una categoría determinada, permitiendo la justificación."},{"text":"La mención de la fuente bibliográfica original y completa del texto analizado.","isCorrect":false,"rationale":"Aunque citar la fuente es importante para la autenticidad, no es una evidencia técnica utilizada por el clasificador."},{"text":"El tiempo total que el algoritmo tardó en procesar el documento.","isCorrect":false,"rationale":"La eficiencia temporal no explica por qué se eligió una etiqueta temática específica."},{"text":"El número de signos de puntuación y exclamaciones detectados.","isCorrect":false,"rationale":"El preprocesamiento suele filtrar los signos de puntuación, centrándose solo en caracteres alfabéticos para la clasificación temática."}],"hint":"Es el rastro de palabras que justifica la decisión del sistema ante un revisor humano."},{"question":"¿Por qué el sistema podría fallar al clasificar un texto que utiliza mucha ironía o lenguaje indirecto?","answerOptions":[{"text":"Porque el método se basa en la presencia literal de palabras clave y no en el sentido figurado.","isCorrect":true,"rationale":"Al ser un modelo de 'bolsa de palabras', solo detecta la aparición de términos, perdiendo el matiz del contexto o la intención del autor."},{"text":"Porque la ironía aumenta demasiado la frecuencia de las 'stopwords'.","isCorrect":false,"rationale":"Las 'stopwords' se eliminan siempre; el problema de la ironía radica en el significado, no en las palabras comunes."},{"text":"Porque los textos irónicos siempre son demasiado cortos para generar vectores TF.","isCorrect":false,"rationale":"La longitud no es el factor determinante, sino la discrepancia entre las palabras usadas y la intención real detrás de ellas."},{"text":"Porque la librería spaCy no puede procesar textos que no sean estrictamente formales.","isCorrect":false,"rationale":"spaCy puede procesar cualquier texto; la limitación está en la regla de decisión basada en frecuencias simples."}],"hint":"Piensa en lo que sucede cuando las palabras dicen una cosa pero el autor quiere decir lo contrario."},{"question":"Si dos temáticas diferentes comparten mucho vocabulario (por ejemplo, 'sistema' en técnica y divulgación), ¿qué fenómeno explica que un clasificador basado en palabras clave pueda confundirlas?","answerOptions":[{"text":"Ambigüedad léxica que puede derivar en un sesgo de diseño del modelo.","isCorrect":true,"rationale":"Cuando los términos se solapan, el resultado depende de qué tan bien haya seleccionado el humano las palabras clave para diferenciar las clases."},{"text":"Sinonimia perfecta entre categorías profesionales.","isCorrect":false,"rationale":"Que compartan vocabulario no significa que las categorías sean iguales, sino que el lenguaje es compartido."},{"text":"Necesidad obligatoria de usar redes neuronales para separar los textos.","isCorrect":false,"rationale":"Aunque es un reto, el enfoque explicable busca resolverlo ajustando los prototipos, no cambiando a modelos opacos."},{"text":"Error de tokenización por parte de la librería spaCy.","isCorrect":false,"rationale":"La tokenización es correcta; el problema es semántico y de distribución de frecuencias en la clasificación."}],"hint":"Considera cómo las decisiones del 'ingeniero' al elegir palabras clave afectan la neutralidad del sistema."},{"question":"En el desarrollo práctico, ¿qué función cumple la variable `class_keywords`?","answerOptions":[{"text":"Definir los perfiles o 'prototipos' de cada temática mediante palabras señal.","isCorrect":true,"rationale":"Esta variable actúa como el conocimiento experto que el sistema usa para comparar los nuevos textos."},{"text":"Almacenar el texto completo que se desea clasificar.","isCorrect":false,"rationale":"El texto a clasificar se guarda usualmente en variables como `texts_to_classify`."},{"text":"Listar todas las palabras que el sistema debe ignorar (stopwords).","isCorrect":false,"rationale":"Las palabras a ignorar se gestionan internamente en el pipeline de spaCy o mediante listas de 'stopwords'."},{"text":"Guardar los resultados finales de las similitudes calculadas.","isCorrect":false,"rationale":"Los resultados se suelen almacenar en un DataFrame o una lista de diccionarios tras ejecutar la clasificación."}],"hint":"Es el conjunto de 'pistas' que representan a cada grupo temático."},{"question":"¿Cuál es una ventaja competitiva de este enfoque en el ámbito de las Humanidades?","answerOptions":[{"text":"Que permite discutir y argumentar los criterios de clasificación basándose en datos visibles.","isCorrect":true,"rationale":"La interpretabilidad permite que un investigador humano valide, cuestione y ajuste el modelo con lógica lingüística."},{"text":"Que procesa millones de documentos por segundo en tiempo real.","isCorrect":false,"rationale":"Aunque es rápido, su ventaja principal en Humanidades no es la velocidad bruta, sino la transparencia."},{"text":"Que sustituye la necesidad de conocimientos lingüísticos por parte del analista.","isCorrect":false,"rationale":"Al contrario, requiere que el analista defina buenos perfiles temáticos basados en su conocimiento del lenguaje."},{"text":"Que no requiere ningún tipo de preprocesamiento de los datos antes de aplicar el modelo de clasificación final.","isCorrect":false,"rationale":"El preprocesamiento es una etapa fundamental y obligatoria para que la representación vectorial sea útil."}],"hint":"Piensa en la importancia de poder 'explicar' un resultado en una investigación académica."},{"question":"Al aplicar el filtro `tok.is_alpha` en spaCy, ¿qué elementos estamos excluyendo del análisis?","answerOptions":[{"text":"Números, signos de puntuación y símbolos especiales.","isCorrect":true,"rationale":"`is_alpha` devuelve verdadero solo para tokens que consisten únicamente en letras, limpiando el ruido del vector TF."},{"text":"Solo las palabras que están escritas completamente en mayúsculas.","isCorrect":false,"rationale":"Las mayúsculas se suelen manejar convirtiendo el texto a minúsculas (`lower()`), no con `is_alpha`."},{"text":"Los verbos conjugados y los adverbios de modo.","isCorrect":false,"rationale":"Tanto verbos como adverbios son alfabéticos y se mantienen si no son 'stopwords'."},{"text":"Las palabras que tienen menos de tres letras.","isCorrect":false,"rationale":"La longitud de la palabra se controla con una condición adicional como `len(tok) >= 2`."}],"hint":"Considera qué partes de un texto no son estrictamente 'letras del alfabeto'."}];
  var IM_DATA = {"manual_interactivo":{"header":{"kicker":"Tema 8.","title":"Clasificación temática de textos","subtitle":"Palabras clave, vectores TF, similitud del coseno y clasificación textual con Python","meta":"Material teórico | Programación para PLN | Universidad Pontificia Comillas","narrative":"Clasificar textos con evidencias: cuando Python no solo decide, sino que muestra sus razones."},"sections":[{"id":"contexto-profesional","title":"Contexto profesional","blocks":[],"subsections":[{"id":"encargo-organizar-un-archivo-textual-heterogeneo","title":"Encargo: organizar un archivo textual heterogéneo","blocks":[{"type":"p","text":"Imagina que te incorporas como analista junior de PLN al Centro Atlas de Documentación Textual, una institución pública que gestiona colecciones digitales procedentes de administraciones, bibliotecas, servicios técnicos, medios culturales y repositorios educativos. Cada semana llegan documentos muy distintos: fragmentos jurídicos, manuales técnicos, textos divulgativos, materiales literarios y documentos híbridos que no siempre encajan de forma limpia en una sola categoría."},{"type":"p","text":"El equipo de archivo necesita clasificar esos textos antes de indexarlos, derivarlos a especialistas o incorporarlos a una base documental. El problema no es solo asignar una etiqueta. El equipo necesita justificar la decisión: si un texto se archiva como jurídico, técnico, divulgativo o literario, la persona responsable debe poder explicar qué señales lingüísticas han llevado a esa clasificación."},{"type":"p","text":"La institución no quiere empezar con un modelo neuronal opaco. No dispone de miles de textos etiquetados, y además trabaja con documentos sensibles donde las decisiones deben poder revisarse. Por eso encarga un sistema sencillo, auditable y pedagógicamente transparente: un clasificador temático basado en palabras clave, vectores simples de frecuencia y similitud coseno."}]},{"id":"el-caso-de-trabajo","title":"El caso de trabajo","blocks":[{"type":"p","text":"El flujo profesional se formula así:"},{"type":"ol","items":["Definir varias clases temáticas: jurídico, técnico, divulgativo y literario.","Construir un perfil o prototipo de cada clase mediante palabras clave.","Preprocesar los textos con criterios lingüísticos.","Convertir cada texto en un vector de frecuencias.","Comparar el vector del texto con cada prototipo.","Asignar la clase con mayor similitud.","Mostrar evidencias léxicas: qué palabras compartidas explican la decisión."]},{"type":"p","text":"El valor del sistema no está solo en la etiqueta final. Está en que permite decir: «este texto se parece más al prototipo jurídico porque comparte lemas como ley, contrato u obligación». Esa explicación puede discutirse, corregirse y mejorar los prototipos."},{"type":"p","text":"En esta unidad aprenderás a construir ese clasificador explicable. No se trata de competir con modelos de aprendizaje profundo. Se trata de entender una de las ideas fundamentales del PLN clásico: un texto puede representarse como un vector, y dos textos pueden compararse por la orientación de esos vectores."}]}],"navTitle":"Contexto profesional"},{"id":"que-vas-a-aprender-en-esta-unidad","title":"Qué vas a aprender en esta unidad","blocks":[{"type":"p","text":"Al finalizar esta unidad, deberías ser capaz de:"},{"type":"ul","items":["explicar qué es la clasificación temática de textos;","distinguir entre clasificación, etiquetado, indexación y agrupación temática;","entender qué papel cumplen las palabras clave como señales interpretables;","representar un texto como bolsa de palabras;","explicar qué es un vector simple de frecuencia o TF;","comprender por qué TF cuenta palabras pero no mide por sí solo especificidad;","explicar el funcionamiento de IDF y TF-IDF;","interpretar la similitud coseno como medida de parecido léxico entre vectores;","comprender qué es un prototipo temático;","explicar cómo se construyen prototipos por clase a partir de palabras clave;","aplicar tokenización, lematización y eliminación de stopwords con spaCy;","entender cómo Counter representa un vector TF;","seguir paso a paso una función de similitud coseno en Python;","justificar una decisión de clasificación mediante evidencias léxicas;","reconocer los límites del enfoque en textos híbridos, breves, irónicos o con sinonimia."]}],"subsections":[],"navTitle":"Qué vas a aprender"},{"id":"mapa-conceptual-de-la-unidad","title":"Mapa conceptual de la unidad","blocks":[{"type":"table","rows":[["Bloque","Concepto","Operación en Python","Resultado"],["Clases temáticas","Categorías de archivo o análisis","Diccionario de etiquetas","Jurídico, técnico, divulgativo, literario"],["Palabras clave","Señales léxicas de cada clase","class_keywords","Prototipos interpretables"],["Preprocesamiento","Preparar el texto lingüísticamente","spaCy: tokenizar, lematizar, filtrar","Lista de lemas"],["TF","Frecuencia de términos","Counter(tokens)","Vector simple del texto"],["TF-IDF","Frecuencia ponderada por especificidad","TF por IDF","Vector más sensible a palabras distintivas"],["Coseno","Parecido entre vectores","Producto escalar y normas","Puntuación de similitud"],["Prototipo","Perfil vectorial de una clase","Keywords preprocesadas y vectorizadas","Vector por temática"],["Clasificación","Elección de la clase más similar","max(scores, key=scores.get)","Etiqueta predicha"],["Evidencias","Rasgos que justifican la decisión","Intersección texto/prototipo","Lemas compartidos"],["Informe","Salida legible y auditable","DataFrame y print_report","Tabla y explicación"]],"title":"Al finalizar esta unidad, deberías ser capaz de"}],"subsections":[],"navTitle":"Mapa conceptual"},{"id":"1-marco-teorico","title":"1. Marco teórico","blocks":[],"subsections":[{"id":"1-1-que-es-la-clasificacion-tematica-de-textos","title":"1.1. Qué es la clasificación temática de textos","blocks":[{"type":"p","text":"La clasificación temática consiste en asignar a un texto una etiqueta que resume su tema, dominio o tipo de contenido. En esta unidad las etiquetas son jurídico, técnico, divulgativo y literario, pero el mismo enfoque podría adaptarse a noticias, reseñas, documentos administrativos, comunicaciones científicas o textos patrimoniales."},{"type":"p","text":"La clasificación de textos es una tarea central del PLN. Sebastiani (2002) la describe como la asignación automática de documentos a categorías predefinidas, una tarea que creció con la disponibilidad masiva de documentos digitales. {{cite:kowsari2019}}Kowsari et al. (2019){{/cite}} y {{cite:gasparetto2022}}Gasparetto et al. (2022){{/cite}} muestran que la clasificación textual se ha abordado con métodos muy variados: reglas, bolsas de palabras, TF-IDF, Naive Bayes, SVM, árboles, redes neuronales y transformadores."},{"type":"p","text":"La unidad se sitúa deliberadamente en el lado interpretable de esa tradición. No entrena un modelo complejo. Usa clases definidas por personas, palabras clave visibles y una medida de similitud calculable a mano si fuera necesario. Esto permite que el alumnado entienda la lógica de la clasificación antes de pasar a modelos más opacos."},{"type":"p","text":"Una clasificación temática no es una lectura total del texto. Es una decisión operativa. Un fragmento puede tener rasgos técnicos y divulgativos al mismo tiempo; un texto literario puede mencionar una ley; un texto jurídico puede tener una introducción divulgativa. Por eso la etiqueta debe acompañarse de evidencias."}]},{"id":"1-2-clasificacion-palabras-clave-e-indexacion","title":"1.2. Clasificación, palabras clave e indexación","blocks":[{"type":"p","text":"Las palabras clave son unidades léxicas que condensan información temática. En un texto jurídico pueden aparecer ley, artículo, cláusula u obligación. En un texto técnico, dispositivo, puerto, controlador o configurar. En un texto literario, memoria, noche, viajero o metáfora. Estas palabras no son mágicas: son señales. Su valor depende del contexto y del sistema de clases."},{"type":"p","text":"La extracción de palabras clave y la clasificación temática están relacionadas. Las palabras clave ayudan a describir un texto; la clasificación usa esas señales para decidir una etiqueta. {{cite:rose2010}}Rose et al. (2010){{/cite}} presentan RAKE como un método de extracción automática de palabras clave desde documentos individuales, y {{cite:papagiannopoulou2023}}Papagiannopoulou y Tsoumakas (2023){{/cite}} revisan la extracción de palabras clave desde perspectivas estadísticas, de recuperación de información, PLN y enfoques neuronales."},{"type":"p","text":"En esta unidad no se extraen automáticamente las palabras clave: se definen manualmente como perfiles de clase. Esta decisión es pedagógica y profesionalmente útil. Permite ver con claridad qué considera el sistema como señal temática. Si una categoría falla, se puede revisar su lista de palabras clave."},{"type":"table","rows":[["Concepto","Función","Ejemplo"],["Palabra clave","Señal léxica de un tema","ley, contrato, controlador"],["Perfil temático","Conjunto de señales de una clase","lista jurídica o técnica"],["Prototipo","Perfil convertido en vector","Counter de lemas"],["Evidencia","Coincidencia que apoya la decisión","texto y prototipo comparten ley"]],"title":"Concepto · Función · Ejemplo"}]},{"id":"1-3-representar-textos-como-vectores","title":"1.3. Representar textos como vectores","blocks":[{"type":"p","text":"Una de las ideas más influyentes de la recuperación de información clásica es el modelo de espacio vectorial. Salton, Wong y Yang (1975) propusieron representar documentos como vectores, de modo que cada dimensión corresponde a un término y cada valor indica el peso de ese término en el documento. Desde ese punto de vista, un texto deja de ser solo una secuencia lineal de palabras y se convierte en un punto o dirección dentro de un espacio."},{"type":"p","text":"Para estudiantes de lingüística, puede imaginarse así: si el vocabulario relevante contiene ley, contrato, puerto, dispositivo y memoria, cada texto puede representarse con cinco posiciones. Si aparece ley dos veces, la posición de ley vale 2. Si no aparece puerto, la posición de puerto vale 0."},{"type":"table","rows":[["Término","Texto jurídico","Texto técnico"],["ley","2","0"],["contrato","1","0"],["puerto","0","1"],["dispositivo","0","2"],["memoria","0","0"]],"title":"Término · Texto jurídico · Texto técnico"},{"type":"p","text":"Este enfoque se conoce también como bag-of-words o bolsa de palabras. La metáfora es útil: metemos las palabras en una bolsa, contamos cuántas hay de cada tipo y perdemos el orden. Eso simplifica mucho el problema, pero también pierde información sintáctica, narrativa y discursiva."}]},{"id":"1-4-tf-frecuencia-de-terminos","title":"1.4. TF: frecuencia de términos","blocks":[{"type":"p","text":"TF significa term frequency, frecuencia de término. En su versión más sencilla, TF cuenta cuántas veces aparece una palabra en un texto. Si un texto contiene ley dos veces y contrato una vez, su vector TF incluye ley: 2 y contrato: 1."},{"type":"p","text":"En Python, esta idea se implementa con Counter:"},{"type":"code","code":"Counter([\"ley\", \"contrato\", \"ley\"])"},{"type":"p","text":"El resultado conceptual es:"},{"type":"code","code":"{\"ley\": 2, \"contrato\": 1}"},{"type":"p","text":"TF es intuitivo y transparente. Una persona puede revisar qué términos han contado. Sin embargo, TF tiene un problema: favorece palabras frecuentes dentro del texto aunque no sean necesariamente distintivas. En un corpus grande, palabras como sistema, documento o información pueden aparecer en muchas clases. Por eso, TF suele combinarse con otras ponderaciones."},{"type":"p","text":"En esta unidad, el código principal usa TF porque el objetivo es comprender la mecánica de la representación vectorial. Antes de ponderar, conviene entender qué se está ponderando."}]},{"id":"1-5-idf-y-tf-idf","title":"1.5. IDF y TF-IDF","blocks":[{"type":"p","text":"IDF significa inverse document frequency, frecuencia inversa de documento. La idea, formulada de manera clásica por Spärck Jones (1972), es que una palabra es más informativa si aparece en pocos documentos y menos informativa si aparece en casi todos. {{cite:robertson2004}}Robertson (2004){{/cite}} ofrece argumentos teóricos sobre por qué IDF funciona en recuperación de información."},{"type":"p","text":"La intuición es sencilla:"},{"type":"ul","items":["si una palabra aparece en todos los documentos, ayuda poco a distinguirlos;","si una palabra aparece en pocos documentos, puede ser más específica;","si una palabra aparece muchas veces en un texto y poco en el resto, puede ser especialmente relevante para ese texto."]},{"type":"p","text":"TF-IDF combina ambas ideas:"},{"type":"p","text":"TF-IDF(t, d) = TF(t, d) * IDF(t)"},{"type":"p","text":"Donde t es el término y d es el documento. En formulaciones habituales:"},{"type":"p","text":"IDF(t) = log(N / df(t))"},{"type":"p","text":"N es el número total de documentos y df(t) es el número de documentos que contienen el término. Muchas implementaciones añaden suavizado para evitar divisiones problemáticas. La documentación de scikit-learn explica que TfidfVectorizer convierte documentos en matrices TF-IDF y que, en la práctica, se combina un conteo de términos con una transformación IDF {{cite:scikitlearndeveloper2026}}(scikit-learn developers, 2026){{/cite}}."},{"type":"p","text":"En PLN8, el pipeline principal usa TF para mantener la explicación al nivel más transparente. Pero TF-IDF es el siguiente paso natural: permite que palabras comunes entre clases pesen menos y que términos distintivos pesen más."}]},{"id":"1-6-similitud-lexica-y-similitud-coseno","title":"1.6. Similitud léxica y similitud coseno","blocks":[{"type":"p","text":"Una vez que los textos son vectores, necesitamos compararlos. La similitud coseno mide el parecido entre dos vectores por su orientación, no por su tamaño absoluto. En términos intuitivos: dos textos son parecidos si apuntan hacia direcciones léxicas similares."},{"type":"p","text":"La fórmula es:"},{"type":"p","text":"coseno(A, B) = (A · B) / (||A|| * ||B||)"},{"type":"p","text":"El numerador, A · B, es el producto escalar. En el código, se calcula multiplicando los valores de los términos comunes y sumando. Si dos vectores no comparten términos, el producto escalar será 0."},{"type":"p","text":"El denominador multiplica las normas o longitudes de los vectores. Esta normalización evita que un texto más largo sea automáticamente más parecido solo porque tiene más palabras. {{cite:manning2008}}Manning et al. (2008){{/cite}} presentan la similitud coseno como una medida central del modelo vectorial para recuperación de información y comparación documental."},{"type":"p","text":"La interpretación didáctica es:"},{"type":"ul","items":["1: vectores muy similares;","cercano a 0: poca coincidencia léxica;","0: sin términos compartidos relevantes."]},{"type":"p","text":"En esta unidad, el coseno mide similitud léxica, no comprensión semántica profunda. Si un texto usa sinónimos que no están en el prototipo, la similitud puede ser baja aunque el tema sea correcto."}]},{"id":"1-7-prototipos-tematicos-y-clasificacion-por-cercania","title":"1.7. Prototipos temáticos y clasificación por cercanía","blocks":[{"type":"p","text":"El cuaderno utiliza una estrategia basada en prototipos. Cada clase se representa mediante un conjunto de palabras clave. Esas palabras se preprocesan y se convierten en un vector TF. Después, cada texto se compara con cada prototipo. Gana la clase más similar."},{"type":"p","text":"Esta idea se relaciona con los clasificadores de centroides y con el algoritmo de Rocchio en recuperación de información, donde una clase o una consulta puede representarse como un vector prototípico dentro del espacio vectorial {{cite:manning2008}}(Manning et al., 2008){{/cite}}. En esta unidad no se calcula un centroide a partir de muchos documentos etiquetados, sino un prototipo manual construido con palabras clave. La lógica, sin embargo, es parecida: comparar el texto nuevo con representaciones de clases."},{"type":"p","text":"La ventaja es la explicabilidad. Si el prototipo jurídico contiene ley, artículo, obligación y contrato, el sistema tiene un criterio visible. La desventaja es que depende mucho de la calidad de esas listas. Una clase pobremente representada será débil; una clase con palabras demasiado generales puede atraer textos que no le corresponden."},{"type":"image","src":"img/fig_prototipos.svg","alt":"Clasificación por prototipos temáticos","caption":"Figura elaborada a partir del apartado 1.7 y del mapa conceptual de la unidad."}]},{"id":"1-8-preprocesamiento-linguistico-con-spacy","title":"1.8. Preprocesamiento lingüístico con spaCy","blocks":[{"type":"p","text":"El preprocesamiento convierte el texto bruto en unidades comparables. En esta unidad se usa spaCy, una librería profesional de PLN, para tokenizar, lematizar, eliminar stopwords y filtrar tokens alfabéticos. La documentación de spaCy describe el procesamiento lingüístico como una forma de pasar de texto crudo a un objeto Doc con anotaciones como tokens, lemas y atributos {{cite:explosionai2026}}(Explosion AI, 2026){{/cite}}."},{"type":"p","text":"Los pasos principales son:"},{"type":"ul","items":["pasar el texto a minúsculas;","dividirlo en tokens;","conservar solo tokens alfabéticos;","eliminar stopwords;","conservar lemas;","filtrar tokens demasiado cortos."]},{"type":"p","text":"La lematización es clave en español. Permite agrupar variantes como leyes y ley, contratos y contrato, instalar e instalación en la medida en que el modelo pueda analizarlas correctamente. No es perfecta, pero ayuda a reducir variación morfológica."},{"type":"p","text":"Eliminar stopwords también tiene coste. Palabras como por, en, de o que suelen ser poco distintivas, pero algunas expresiones temáticas pueden contenerlas. En esta unidad la prioridad es que los vectores recojan señales léxicas de contenido. En tareas más finas, habría que revisar si ciertas palabras funcionales deben conservarse."}]},{"id":"1-9-explicabilidad-evidencias-lexicas","title":"1.9. Explicabilidad: evidencias léxicas","blocks":[{"type":"p","text":"La clasificación explicable busca que una persona pueda entender por qué se ha tomado una decisión. En modelos complejos, técnicas como LIME {{cite:ribeiro2016}}(Ribeiro et al., 2016){{/cite}} o SHAP {{cite:lundberg2017}}(Lundberg & Lee, 2017){{/cite}} intentan explicar predicciones mostrando qué rasgos han contribuido. Esta unidad no necesita esas técnicas porque el modelo ya es interpretable por diseño."},{"type":"p","text":"La explicación se basa en evidencias léxicas:"},{"type":"ul","items":["el texto se convierte en un vector;","el prototipo ganador tiene su propio vector;","se identifican términos compartidos;","se ordenan por una contribución simple;","se muestran al usuario."]},{"type":"p","text":"Esto permite decir: «la clase técnica gana porque el texto comparte dispositivo, puerto y controlador con el prototipo técnico». No es una explicación perfecta, pero sí una explicación inspeccionable. El alumnado puede discutir si esas palabras clave son adecuadas, si falta alguna, si sobran otras o si conviene usar TF-IDF."}]},{"id":"1-10-clasificacion-tematica-frente-a-modelos-neuronales","title":"1.10. Clasificación temática frente a modelos neuronales","blocks":[{"type":"p","text":"Los modelos modernos de clasificación textual pueden lograr resultados muy superiores en muchos escenarios. {{cite:minaee2021}}Minaee et al. (2021){{/cite}} revisan más de 150 modelos de aprendizaje profundo para clasificación textual, y {{cite:li2020}}Li et al. (2020){{/cite}} muestran la evolución desde métodos superficiales hasta enfoques profundos. Sin embargo, esos modelos requieren datos, entrenamiento, evaluación y suelen ser menos transparentes."},{"type":"p","text":"El enfoque de PLN8 es útil cuando:"},{"type":"ul","items":["hay pocos datos etiquetados;","se necesita una primera solución rápida;","importa justificar cada decisión;","el dominio requiere auditoría humana;","el objetivo es didáctico;","las clases se pueden describir mediante palabras clave."]},{"type":"p","text":"No es el enfoque ideal cuando:"},{"type":"ul","items":["las clases dependen de significado implícito;","hay mucha sinonimia;","los textos son muy largos y heterogéneos;","las categorías son abstractas;","el vocabulario cambia mucho;","se necesita alto rendimiento en producción."]},{"type":"p","text":"Aprender este enfoque no es retroceder frente a la IA moderna. Es aprender la arquitectura conceptual que está debajo de muchas técnicas más avanzadas: representación, ponderación, similitud y decisión."}]},{"id":"1-11-limites-linguisticos-del-metodo","title":"1.11. Límites lingüísticos del método","blocks":[{"type":"p","text":"Un clasificador por palabras clave y coseno funciona bien cuando las clases tienen vocabulario característico. Pero presenta varios límites:"},{"type":"table","rows":[["Límite","Qué ocurre","Ejemplo"],["Sinonimia","No se detecta una idea si usa otra palabra","normativa frente a ley"],["Polisemia","Una palabra puede pertenecer a varias clases","artículo jurídico o artículo divulgativo"],["Textos híbridos","Dos clases comparten señales","divulgación técnica"],["Textos breves","Hay pocas evidencias","una frase muy corta"],["Metáfora e ironía","El sentido no está en palabras literales","estilo literario indirecto"],["Prototipos sesgados","La lista de keywords decide el criterio","clase técnica con más keywords que las demás"]],"title":"Límite · Qué ocurre · Ejemplo"},{"type":"p","text":"Para mejorar sin perder interpretabilidad se puede:"},{"type":"ul","items":["ampliar palabras clave con variantes y sinónimos;","usar TF-IDF en lugar de TF simple;","conservar bigramas o expresiones;","revisar stopwords por dominio;","añadir umbrales de confianza;","permitir etiqueta «indeterminado»;","mostrar siempre evidencias y puntuaciones;","validar con ejemplos humanos."]}]},{"id":"1-12-que-significa-clasificar-con-responsabilidad","title":"1.12. Qué significa «clasificar con responsabilidad»","blocks":[{"type":"p","text":"Clasificar textos no es solo aplicar una fórmula. Es crear una regla de decisión que tendrá consecuencias: archivar un documento, priorizar revisión, sugerir metadatos o enviar un texto a un equipo especializado. En instituciones públicas, bibliotecas digitales o entornos educativos, la transparencia importa."},{"type":"p","text":"Un informe responsable no debería decir simplemente «el sistema ha acertado». Debería indicar:"},{"type":"ul","items":["qué clases estaban disponibles;","qué palabras clave definían cada clase;","cómo se preprocesaron los textos;","qué medida de similitud se usó;","qué puntuación obtuvo cada clase;","qué evidencias léxicas apoyaron la decisión;","qué límites tiene el resultado."]},{"type":"p","text":"Esa forma de informar convierte el código en una herramienta lingüística auditada. La decisión no queda escondida: se puede revisar, corregir y mejorar."}]}],"navTitle":"Marco teórico"},{"id":"2-clasificacion-tematica-explicable-con-python","title":"2. Clasificación temática explicable con Python","blocks":[],"subsections":[{"id":"2-1-preparar-el-entorno","title":"2.1. Preparar el entorno","blocks":[{"type":"p","text":"La unidad importa herramientas ligeras y comprensibles:"},{"type":"code","code":"import re\nfrom collections import Counter\nfrom math import sqrt\nfrom typing import List, Dict, Tuple\nimport pandas as pd"},{"type":"p","text":"re permite trabajar con expresiones regulares, aunque en la parte principal el preprocesamiento se apoya en spaCy. Counter representa vectores TF contando lemas. sqrt calcula raíces cuadradas para la norma de los vectores en la similitud coseno. List, Dict y Tuple ayudan a documentar tipos. pandas permite construir tablas de resultados."},{"type":"p","text":"Después se importa spaCy y se carga el modelo de español:"},{"type":"code","code":"import spacy\nnlp = spacy.load(\"es_core_news_sm\")"},{"type":"p","text":"nlp es el pipeline lingüístico. Cuando se aplica a un texto, devuelve un objeto con tokens, lemas, marcas de stopword y otros atributos."}]},{"id":"2-2-textos-para-clasificar","title":"2.2. Textos para clasificar","blocks":[{"type":"p","text":"El código trabaja con una lista de textos:"},{"type":"code","code":"texts_to_classify = [\n    \"Texto jurídico...\",\n    \"Texto técnico...\",\n    \"Texto divulgativo...\",\n    \"Texto literario...\"\n]"},{"type":"p","text":"Cada elemento es un documento que el sistema debe clasificar. En la actividad práctica, esos textos se sustituyen por fragmentos reales. En el manual no se resuelven esos casos; lo importante es comprender la estructura: una lista de documentos entra en el sistema y una tabla de clasificaciones sale al final."},{"type":"p","text":"En una versión con identificadores, la estructura puede ser:"},{"type":"code","code":"(\"JUR_1\", \"Texto jurídico...\")"},{"type":"p","text":"Así se conserva un ID junto con el texto. Esto facilita crear informes y rastrear decisiones."}]},{"id":"2-3-perfiles-tematicos-mediante-palabras-clave","title":"2.3. Perfiles temáticos mediante palabras clave","blocks":[{"type":"p","text":"Las clases se definen con un diccionario:"},{"type":"code","code":"class_keywords = {\n    \"jurídico\": [\"artículo\", \"ley\", \"cláusula\", \"contrato\"],\n    \"técnico\": [\"instalar\", \"dispositivo\", \"puerto\", \"manual\"],\n    \"divulgativo\": [\"explicar\", \"sencillo\", \"concepto\", \"introducción\"],\n    \"literario\": [\"noche\", \"memoria\", \"horizonte\", \"metáfora\"]\n}"},{"type":"p","text":"Cada clave del diccionario es una etiqueta de clase. Cada valor es una lista de palabras representativas. Esta estructura hace visible el criterio del sistema: si una palabra no está en el perfil, no podrá contribuir directamente a esa clase."},{"type":"p","text":"El diseño de keywords es una tarea lingüística. Conviene que sean:"},{"type":"ul","items":["específicas de la clase;","suficientemente frecuentes en textos reales;","no excesivamente generales;","revisables por especialistas;","equilibradas entre clases."]}]},{"id":"2-4-preprocesamiento-con-spacy","title":"2.4. Preprocesamiento con spaCy","blocks":[{"type":"p","text":"La función principal es:"},{"type":"code","code":"def preprocess(text: str) -> List[str]:\n    doc = nlp(text.lower())\n    tokens = [\n        tok.lemma_\n        for tok in doc\n        if tok.is_alpha and not tok.is_stop and len(tok) >= 2\n    ]\n    return tokens"},{"type":"p","text":"Primero, text.lower() pasa el texto a minúsculas. Después, nlp(...) aplica el pipeline de spaCy. La comprensión de listas recorre cada token y conserva solo los que cumplen tres condiciones:"},{"type":"ul","items":["tok.is_alpha: el token está formado por letras;","not tok.is_stop: no es stopword;","len(tok) >= 2: tiene al menos dos caracteres."]},{"type":"p","text":"La forma que se guarda es tok.lemma_, es decir, el lema. Esto ayuda a comparar variantes morfológicas. La salida de la función no es texto, sino una lista de lemas."}]},{"id":"2-5-vectorizacion-tf-con-counter","title":"2.5. Vectorización TF con Counter","blocks":[{"type":"p","text":"La función de vectorización es mínima:"},{"type":"code","code":"def tf_vector(tokens: List[str]) -> Counter:\n    return Counter(tokens)"},{"type":"p","text":"Recibe una lista de tokens o lemas y devuelve un contador. Si el texto produce [\"ley\", \"contrato\", \"ley\"], el vector será Counter({\"ley\": 2, \"contrato\": 1})."},{"type":"p","text":"Este Counter funciona como vector disperso. Solo guarda términos que aparecen. Los términos ausentes se comportan como si tuvieran frecuencia cero."},{"type":"p","text":"Este diseño es muy cómodo para textos: no hace falta crear una lista gigantesca con todas las palabras posibles. Solo se almacenan las que están presentes."}]},{"id":"2-6-similitud-coseno-en-python","title":"2.6. Similitud coseno en Python","blocks":[{"type":"p","text":"La función de similitud coseno es:"},{"type":"code","code":"def cosine_similarity(v1: Counter, v2: Counter) -> float:\n    common = set(v1.keys()) & set(v2.keys())\n    dot = sum(v1[t] * v2[t] for t in common)\n    norm1 = sqrt(sum(v**2 for v in v1.values()))\n    norm2 = sqrt(sum(v**2 for v in v2.values()))\n    if norm1 == 0 or norm2 == 0:\n        return 0.0\n    return dot / (norm1 * norm2)"},{"type":"p","text":"common calcula los términos compartidos entre los dos vectores. El operador & obtiene la intersección de conjuntos."},{"type":"p","text":"dot calcula el producto escalar. Para cada término común, multiplica la frecuencia en el primer vector por la frecuencia en el segundo y suma."},{"type":"p","text":"norm1 y norm2 calculan la longitud de cada vector. Elevan cada frecuencia al cuadrado, suman y aplican raíz cuadrada."},{"type":"p","text":"Si alguna norma es cero, significa que uno de los vectores está vacío. En ese caso, la similitud devuelve 0.0 para evitar división entre cero."},{"type":"p","text":"La función devuelve un número entre 0 y 1 en este tipo de vectores no negativos."}]},{"id":"2-7-construir-prototipos-tematicos","title":"2.7. Construir prototipos temáticos","blocks":[{"type":"p","text":"Las palabras clave de cada clase se convierten en prototipos vectoriales:"},{"type":"code","code":"def build_class_prototypes(class_keywords: dict) -> dict:\n    prototypes = {}\n    for label, keywords in class_keywords.items():\n        tokens = []\n        for kw in keywords:\n            tokens.extend(preprocess(kw))\n        prototypes[label] = tf_vector(tokens)\n    return prototypes"},{"type":"p","text":"La función recorre cada etiqueta y su lista de keywords. Cada keyword se preprocesa, y sus lemas se añaden a una lista. Después esa lista se convierte en vector TF."},{"type":"p","text":"El resultado es un diccionario de prototipos:"},{"type":"code","code":"prototypes = {\n    \"jurídico\": Counter(...),\n    \"técnico\": Counter(...),\n    \"divulgativo\": Counter(...),\n    \"literario\": Counter(...)\n}"},{"type":"p","text":"Cada clase ya no es solo una lista de palabras, sino un vector comparable con cualquier texto."}]},{"id":"2-8-evidencias-lexicas","title":"2.8. Evidencias léxicas","blocks":[{"type":"p","text":"La función de evidencias identifica qué lemas del texto aparecen también en el prototipo ganador:"},{"type":"code","code":"def top_evidence_terms(text_vec: Counter, proto_vec: Counter, top_k: int = 8):\n    contrib = []\n    for t, f in text_vec.items():\n        if t in proto_vec:\n            contrib.append((t, f * proto_vec[t]))\n    contrib.sort(key=lambda x: x[1], reverse=True)\n    return contrib[:top_k]"},{"type":"p","text":"La contribución simple se calcula como frecuencia del término en el texto por frecuencia del término en el prototipo. Si una palabra aparece varias veces y además está presente en el prototipo, tendrá más peso."},{"type":"p","text":"La salida es una lista de pares:"},{"type":"code","code":"[(\"ley\", 2), (\"contrato\", 1)]"},{"type":"p","text":"Esto permite presentar evidencia legible. La explicación no dice «el modelo pensó esto», sino «la coincidencia léxica que más apoya esta clase es esta»."}]},{"id":"2-9-clasificar-un-texto","title":"2.9. Clasificar un texto","blocks":[{"type":"p","text":"La función classify_text reúne todo el pipeline:"},{"type":"code","code":"def classify_text(text: str, prototypes: dict) -> dict:\n    tokens = preprocess(text)\n    vec = tf_vector(tokens)\n    scores = {\n        label: cosine_similarity(vec, proto)\n        for label, proto in prototypes.items()\n    }\n    best_label = max(scores, key=scores.get)\n    evidence = top_evidence_terms(vec, prototypes[best_label])\n    return {\n        \"text\": text,\n        \"tokens\": tokens,\n        \"predicted_label\": best_label,\n        \"scores\": scores,\n        \"evidence\": evidence\n    }"},{"type":"p","text":"Primero preprocesa el texto. Después lo vectoriza. Luego calcula una similitud por cada prototipo. scores es un diccionario donde cada clase tiene su puntuación."},{"type":"p","text":"max(scores, key=scores.get) devuelve la etiqueta con puntuación más alta. Por último, se calculan evidencias frente al prototipo ganador."},{"type":"p","text":"La función devuelve un diccionario completo, no solo la etiqueta. Esta es una buena práctica: conserva datos, puntuaciones y explicación."}]},{"id":"2-10-clasificar-varios-textos-y-crear-una-tabla","title":"2.10. Clasificar varios textos y crear una tabla","blocks":[{"type":"p","text":"Para aplicar el sistema a todos los textos se usa una comprensión de listas:"},{"type":"code","code":"results = [classify_text(t, prototypes) for t in texts_to_classify]"},{"type":"p","text":"Después se construye una tabla:"},{"type":"code","code":"rows = []\nfor r in results:\n    row = {\n        \"predicted_label\": r[\"predicted_label\"],\n        \"text\": r[\"text\"]\n    }\n    for label, score in r[\"scores\"].items():\n        row[f\"sim_{label}\"] = score\n    rows.append(row)\n\ndf_scores = pd.DataFrame(rows)"},{"type":"p","text":"Cada fila contiene texto, clase predicha y puntuaciones de similitud. Las columnas sim_jurídico, sim_técnico, sim_divulgativo y sim_literario permiten comparar por qué gana una clase y no otra."},{"type":"p","text":"La tabla es parte de la explicabilidad. No solo muestra el resultado final, sino también alternativas y diferencias de puntuación."}]},{"id":"2-11-informe-de-clasificacion","title":"2.11. Informe de clasificación","blocks":[{"type":"p","text":"La función print_report convierte los resultados en una salida narrativa:"},{"type":"code","code":"def print_report(results):\n    for i, r in enumerate(results, 1):\n        print(f\"TEXTO #{i}\")\n        print(r[\"text\"])\n        print(f\"Clase predicha: {r['predicted_label']}\")\n        for label, score in sorted(r[\"scores\"].items(), key=lambda x: x[1], reverse=True):\n            print(f\"{label}: {score:.3f}\")\n        print(\"Evidencias:\", r[\"evidence\"])"},{"type":"p","text":"El informe ordena similitudes de mayor a menor y muestra evidencias. Para una persona no técnica, esto es más útil que una tabla de números sin explicación."},{"type":"p","text":"En un entorno profesional, este informe podría convertirse en una ficha de revisión: clase sugerida, confianza aproximada, evidencias y comentario humano."}]},{"id":"2-12-donde-entraria-tf-idf","title":"2.12. Dónde entraría TF-IDF","blocks":[{"type":"p","text":"El cuaderno principal utiliza TF simple. Una versión ampliada podría sustituir o complementar esos vectores con TF-IDF. En scikit-learn, el patrón general sería:"},{"type":"code","code":"from sklearn.feature_extraction.text import TfidfVectorizer\n\nvectorizer = TfidfVectorizer()\nX = vectorizer.fit_transform(textos)"},{"type":"p","text":"La idea sería que palabras demasiado comunes pesaran menos. Por ejemplo, si sistema aparece en textos técnicos y divulgativos, TF-IDF puede reducir su peso frente a palabras más distintivas. Sin embargo, en un sistema de prototipos manuales hay que decidir con cuidado sobre qué colección se calcula IDF: documentos reales, prototipos, textos de entrenamiento o una mezcla. Esa decisión cambia las ponderaciones."},{"type":"p","text":"Para esta unidad, basta con entender la diferencia:"},{"type":"table","rows":[["Representación","Qué mide","Ventaja","Límite"],["TF","Frecuencia dentro del texto","Muy interpretable","No penaliza palabras comunes"],["IDF","Especificidad en la colección","Reduce peso de términos generales","Depende del corpus de referencia"],["TF-IDF","Frecuencia ponderada por especificidad","Más útil en colecciones grandes","Menos transparente que TF puro"]],"title":"Para esta unidad, basta con entender la diferencia"}]},{"id":"2-13-como-leer-los-resultados-antes-de-la-practica","title":"2.13. Cómo leer los resultados antes de la práctica","blocks":[{"type":"p","text":"Cuando ejecutes el cuaderno, no mires solo la etiqueta. Observa:"},{"type":"ul","items":["qué tokens produjo preprocess;","qué palabras clave definían cada prototipo;","qué similitud obtuvo cada clase;","cuánto margen hay entre la clase ganadora y la segunda;","qué evidencias aparecen;","qué evidencias faltan;","si el texto podría ser híbrido;","si una palabra clave demasiado general está influyendo demasiado."]},{"type":"p","text":"Una clasificación responsable se formula así: «el sistema asigna la clase técnico porque el vector del texto comparte estos lemas con el prototipo técnico y obtiene mayor similitud que las demás clases». Esa frase es más precisa que «el texto es técnico»."}]}],"navTitle":"Python para PLN"},{"id":"errores-frecuentes-de-aprendizaje","title":"Errores frecuentes de aprendizaje","blocks":[{"type":"ul","items":["Confundir palabras clave con significado completo del texto.","Pensar que TF-IDF entiende semántica, cuando solo pondera términos.","Interpretar coseno alto como comprensión profunda.","Olvidar que bag-of-words pierde el orden de las palabras.","Creer que el prototipo temático es neutral: lo diseña una persona.","Comparar puntuaciones sin mirar evidencias.","No revisar si las stopwords eliminadas eran importantes.","Usar keywords demasiado generales, como sistema o información, sin control.","No distinguir textos híbridos de errores del clasificador.","Presentar la etiqueta predicha sin explicar el criterio."]}],"subsections":[],"navTitle":"Errores frecuentes"},{"id":"sintesis-final","title":"Síntesis final","blocks":[{"type":"p","text":"Esta unidad introduce la clasificación temática explicable desde la base: palabras clave, vectores simples, frecuencia, similitud coseno y evidencias léxicas. El objetivo no es ocultar la decisión dentro de un modelo complejo, sino aprender cómo se construye una decisión automática revisable."},{"type":"p","text":"El marco teórico conecta el cuaderno con el modelo de espacio vectorial, TF, IDF, TF-IDF, prototipos temáticos, clasificación textual e interpretabilidad. Estos conceptos forman una base imprescindible para entender métodos posteriores más sofisticados, incluidos clasificadores supervisados y modelos neuronales."},{"type":"p","text":"La parte de Python muestra un pipeline completo: cargar spaCy, preprocesar textos, convertir lemas en vectores TF, construir prototipos por clase, calcular similitud coseno, elegir la clase con mayor puntuación y mostrar evidencias. Cada bloque puede explicarse lingüísticamente."},{"type":"p","text":"La idea principal es que clasificar no es solo etiquetar. Clasificar con responsabilidad significa definir criterios, mostrar puntuaciones, ofrecer evidencias y permitir revisión humana."}],"subsections":[],"navTitle":"Síntesis"},{"id":"cierre-narrativo","title":"Cierre narrativo","blocks":[{"type":"p","text":"Al terminar la simulación, el Centro Atlas de Documentación Textual no recibe una caja negra. Recibe un prototipo transparente. Puede revisar las palabras clave de cada clase, ver cómo se procesan los textos, observar qué similitud tiene cada documento con cada perfil y comprobar qué lemas explican la decisión. Ese es el valor profesional de esta unidad. Una lingüista computacional no solo ejecuta código: diseña criterios de clasificación, detecta ambigüedades, interpreta evidencias y comunica límites. Si un documento se clasifica como jurídico, técnico, divulgativo o literario, la decisión debe poder contarse con palabras."},{"type":"p","text":"En clase se trabajarán los casos concretos. Este manual prepara el terreno: cuando ejecutes el cuaderno, ya sabrás qué significa cada vector, por qué importa cada palabra clave y qué está midiendo realmente el coseno."}],"subsections":[],"navTitle":"Cierre narrativo"},{"id":"para-saber-mas-preparacion-previa-a-la-practica","title":"Para saber más: Preparación previa a la práctica","blocks":[{"type":"biblist","items":["Ali, M. (2024, 3 de mayo). Clasificación de textos en Python. DataCamp. https://www.datacamp.com/es/tutorial/text-classification-python","Alura Latam. (s. f.). ¿Qué es Bag of Words? #AluraMás [vídeo]. YouTube. https://www.youtube.com/watch?v=NKy59utXjcg&t=194s","Barnard, J. (s. f.). ¿Qué son las incrustaciones de palabras? IBM. https://www.ibm.com/es-es/think/topics/word-embeddings","Gutiérrez, O. [Codigo Maquina]. (s. f.). TF-IDF: Vectorización de Documentos para NLP con Python [vídeo]. YouTube. https://www.youtube.com/watch?v=4QsG4oNcGpM&t=583s","Krantz, T. y Jonker, A. (s. f.). ¿Qué es la similitud de coseno? IBM. https://www.ibm.com/es-es/think/topics/cosine-similarity","Murel, J. y Kavlakoglu, E. (s. f.). ¿Qué es la bolsa de palabras? IBM. https://www.ibm.com/es-es/think/topics/bag-of-words","Starmer, J. [StatQuest with Josh Starmer]. (s. f.). Cosine Similarity, Clearly Explained!!! [vídeo]. YouTube. https://www.youtube.com/watch?v=e9U0QAFbfLI&t=131s"]}],"subsections":[],"navTitle":"Para saber más"}],"references":[{"key":"explosionai2026","text":"Explosion AI. (2026). *Linguistic features*. spaCy usage documentation. https://spacy.io/usage/linguistic-features"},{"key":"gasparetto2022","text":"Gasparetto, A., Marcuzzo, M., Zangari, A. y Albarelli, A. (2022). A survey on text classification algorithms: From text to predictions. *Information, 13*(2), 83. https://doi.org/10.3390/info13020083"},{"key":"kowsari2019","text":"Kowsari, K., Jafari Meimandi, K., Heidarysafa, M., Mendu, S., Barnes, L. y Brown, D. (2019). Text classification algorithms: A survey. *Information, 10*(4), 150. https://doi.org/10.3390/info10040150"},{"key":"li2020","text":"Li, Q., Peng, H., Li, J., Xia, C., Yang, R., Sun, L., Yu, P. S. y He, L. (2020). *A survey on text classification: From shallow to deep learning*. arXiv. https://arxiv.org/abs/2008.00364"},{"key":"lundberg2017","text":"Lundberg, S. M. y Lee, S.-I. (2017). A unified approach to interpreting model predictions. In *Advances in Neural Information Processing Systems, 30*. https://papers.nips.cc/paper/7062-a-unified-approach-to-interpreting-model-predictions"},{"key":"manning2008","text":"Manning, C. D., Raghavan, P. y Schütze, H. (2008). *Introduction to information retrieval*. Cambridge University Press. https://nlp.stanford.edu/IR-book/"},{"key":"minaee2021","text":"Minaee, S., Kalchbrenner, N., Cambria, E., Nikzad, N., Chenaghlu, M. y Gao, J. (2021). Deep learning-based text classification: A comprehensive review. *ACM Computing Surveys, 54*(3), Article 62. https://doi.org/10.1145/3439726"},{"key":"papagiannopoulou2023","text":"Papagiannopoulou, E. y Tsoumakas, G. (2023). Keyword extraction: A modern perspective. *SN Computer Science, 4*, Article 92. https://doi.org/10.1007/s42979-022-01481-7"},{"key":"ribeiro2016","text":"Ribeiro, M. T., Singh, S. y Guestrin, C. (2016). Why should I trust you? Explaining the predictions of any classifier. In *Proceedings of the 22nd ACM SIGKDD International Conference on Knowledge Discovery and Data Mining* (pp. 1135-1144). ACM. https://doi.org/10.1145/2939672.2939778"},{"key":"robertson2004","text":"Robertson, S. (2004). Understanding inverse document frequency: On theoretical arguments for IDF. *Journal of Documentation, 60*(5), 503-520. https://doi.org/10.1108/00220410410560582"},{"key":"rose2010","text":"Rose, S., Engel, D., Cramer, N. y Cowley, W. (2010). Automatic keyword extraction from individual documents. En M. W. Berry y J. Kogan (Eds.), *Text mining: Applications and theory* (pp. 1-20). Wiley. https://doi.org/10.1002/9780470689646.ch1"},{"key":"salton1975","text":"Salton, G., Wong, A. y Yang, C. S. (1975). A vector space model for automatic indexing. *Communications of the ACM, 18*(11), 613-620. https://doi.org/10.1145/361219.361220"},{"key":"scikitlearndeveloper2026","text":"scikit-learn developers. (2026). *TfidfVectorizer*. scikit-learn documentation. https://scikit-learn.org/stable/modules/generated/sklearn.feature_extraction.text.TfidfVectorizer.html   function sha256Hex(text) {
    var enc = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", enc).then(function(buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function(b) {
        return b.toString(16).padStart(2, "0");
      }).join("");
    });
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function renderQuizStart() {
    var root = document.getElementById("quiz-root");
    if (!root) return;
    root.innerHTML =
      '<div class="quiz-start">' +
      '<p>10 preguntas: 5 elegidas al azar del banco del manual y 5 del banco del cuaderno. Puedes repetir el intento tantas veces como quieras — cada vez se vuelven a elegir y reordenar las preguntas.</p>' +
      '<button class="quiz-btn" id="quiz-begin">Empezar</button>' +
      '</div>';
    document.getElementById("quiz-begin").addEventListener("click", startQuiz);

  function startQuiz() {
    var fromManual = shuffle(QUIZ_MANUAL).slice(0, 5);
    var fromCuaderno = shuffle(QUIZ_CUADERNO).slice(0, 5);
    quizState = { questions: shuffle(fromManual.concat(fromCuaderno)), index: 0, score: 0 };
    renderQuizQuestion();
  }

  function renderQuizQuestion() {
    var root = document.getElementById("quiz-root");
    var total = quizState.questions.length;
    if (quizState.index >= total) {
      root.innerHTML =
        '<div class="quiz-result">' +
        '<div class="quiz-score">' + quizState.score + ' / ' + total + '</div>' +
        '<p>Puntuación de este intento.</p>' +
        '<button class="quiz-btn" id="quiz-retry">Volver a intentar</button>' +
        '</div>';
      document.getElementById("quiz-retry").addEventListener("click", startQuiz);
      return;
    }
    var q = quizState.questions[quizState.index];
    var opts = shuffle(q.answerOptions);
    var html = '<div class="quiz-progress">Pregunta ' + (quizState.index + 1) + ' de ' + total + ' · Puntuación provisional: ' + quizState.score + '</div>';
    html += '<div class="quiz-q"><h3>' + q.question + '</h3>';
    opts.forEach(function(opt, i) {
      html += '<button class="quiz-opt" data-idx="' + i + '">' + opt.text + '</button>';
    });
    html += '<div class="quiz-feedback" id="quiz-feedback" hidden></div>';
    html += '</div>';
    root.innerHTML = html;
    var buttons = root.querySelectorAll(".quiz-opt");
    buttons.forEach(function(btn, i) {
      btn.addEventListener("click", function() {
        buttons.forEach(function(b) { b.disabled = true; });
        var chosen = opts[i];
        if (chosen.isCorrect) { btn.classList.add("correct"); quizState.score++; }
        else {
          btn.classList.add("incorrect");
          buttons.forEach(function(b2, j) { if (opts[j].isCorrect) b2.classList.add("correct"); });
        }
        var fb = document.getElementById("quiz-feedback");
        fb.hidden = false;
        fb.textContent = chosen.rationale || (chosen.isCorrect ? "Correcto." : "Incorrecto.");
        var next = document.createElement("button");
        next.className = "quiz-btn";
        next.style.marginTop = "14px";
        next.textContent = quizState.index + 1 < total ? "Siguiente" : "Ver puntuación";
        next.addEventListener("click", function() { quizState.index++; renderQuizQuestion(); });
        root.querySelector(".quiz-q").appendChild(next);
      });
    });
  }

  function imEsc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function imFormatBackticks(s) {
    var parts = s.split("`"), out = "";
    for (var i = 0; i < parts.length; i++) out += (i % 2 === 1) ? '<code class="im-inline">' + imEsc(parts[i]) + "</code>" : imEsc(parts[i]);
    return out;
  }
  function imFormatInline(raw) {
    var re = /{{cite:([^}]*)}}([\s\S]*?){{\/cite}}/g;
    var out = "", last = 0, m;
    while ((m = re.exec(raw))) {
      out += imFormatBackticks(raw.slice(last, m.index));
      out += '<span class="im-cite" data-refs="' + m[1] + '">' + imFormatBackticks(m[2]) + ' <span aria-hidden="true">ⓘ</span></span>';
      last = re.lastIndex;
    }
    out += imFormatBackticks(raw.slice(last));
    return out;
  }
  function imLinkify(text) {
    var re = /(https?:\/\/[^\s]+)/g;
    var out = "", last = 0, m;
    while ((m = re.exec(text))) {
      out += imEsc(text.slice(last, m.index));
      var url = m[1].replace(/[.,;]+$/, "");
      out += '<a href="' + imEsc(url) + '" target="_blank" rel="noopener">' + imEsc(url) + "</a>";
      last = m.index + url.length;
    }
    out += imEsc(text.slice(last));
    return out;
  }
  function imBibText(text) {
    // *word* marks an APA-italicized container title (book/journal name+volume/etc.)
    return text.split(/(\*[^*]+\*)/g).map(function(part) {
      if (part.charAt(0) === "*" && part.charAt(part.length - 1) === "*" && part.length > 1) {
        return "<em>" + imLinkify(part.slice(1, -1)) + "</em>";
      }
      return imLinkify(part);
    }).join("");
  }

  function imTableHtml(b) {

      body.map(function(r) { return "<tr>" + r.map(function(c) { return "<td>" + imFormatInline(c) + "</td>"; }).join("") + "</tr>"; }).join("") +

  function imRenderBlocks(blocks, keyPrefix) {

      else if (b.type === "ol") html += '<ol class="im-block-ol">' + b.items.map(function(t) { return "<li>" + imFormatInline(t) + "</li>"; }).join("") + "</ol>";
      else if (b.type === "code") html += '<button class="im-code-toggle" data-im-code="' + key + '">🔎 Descubre el código</button>' +
        '<div class="im-code-box" id="im-code-' + key + '"><pre>' + imEsc(b.code) + "</pre></div>";
      else if (b.type === "table") html += imRenderTable(b, key, bareTable);
      else if (b.type === "image") html += '<figure class="im-figure"><img class="im-figure-img" src="' + imEsc(b.src) + '" alt="' + imEsc(b.alt || "") + '">' +
        (b.caption ? '<figcaption class="im-figure-caption">' + imFormatInline(b.caption) + "</figcaption>" : "") + "</figure>";

      else if (b.type === "biblist") html += '<ul class="im-biblist">' + b.items.map(function(t) { return "<li>" + imBibText(t) + "</li>"; }).join("") + "</ul>";
