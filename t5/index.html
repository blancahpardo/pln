<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tema 5 — PLN</title>
<style>

:root {
  --azul: #003B5C;
  --azul-d: #00283F;
  --amar: #F4C542;
  --gris: #34484F;
  --claro: #F3F3F4;
  --humo: #9FB1BA;
  --verde: #2E7D32;
  --rojo: #B00020;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: var(--gris); background:#fff; }
a { color: inherit; }

#gate { position:fixed; inset:0; background:var(--azul); display:flex; align-items:center; justify-content:center; padding:24px; z-index:999; }
#gate .box { max-width:380px; width:100%; text-align:center; }
#gate .kicker { color:var(--amar); font-size:12px; font-weight:bold; letter-spacing:2.5px; text-transform:uppercase; margin-bottom:10px; }
#gate h1 { color:#fff; font-size:26px; margin:0 0 10px; }
#gate p { color:var(--humo); font-size:14px; margin:0 0 26px; }
#gate input { width:100%; padding:13px 16px; border-radius:8px; border:none; font-size:15px; font-family:Arial,Helvetica,sans-serif; margin-bottom:14px; outline:2px solid transparent; }
#gate input:focus { outline:2px solid var(--amar); }
#gate button.submit { width:100%; padding:13px 16px; border-radius:8px; border:none; background:var(--amar); color:var(--azul-d); font-size:15px; font-weight:bold; font-family:Arial,Helvetica,sans-serif; cursor:pointer; }
#gate button.submit:hover { filter:brightness(1.06); }
#gate .error { color:#FFB3B3; font-size:13px; margin-top:12px; min-height:18px; }
#page { display:none; }
main { max-width:980px; margin:0 auto; padding:48px clamp(20px,6vw,48px) 60px; }
.kicker { color:var(--amar); font-size:12px; font-weight:bold; letter-spacing:2.5px; text-transform:uppercase; margin-bottom:8px; }
.view > h1 { color:var(--azul); font-size:32px; margin:0 0 34px; }
.hub-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; margin-bottom:30px; }
.hub-btn { display:flex; flex-direction:column; align-items:flex-start; gap:6px; background:var(--claro); border:none; border-radius:12px; padding:26px 22px; cursor:pointer; text-align:left; box-shadow:0 2px 10px rgba(159,177,186,.28); font-family:Arial,Helvetica,sans-serif; position:relative; }
.hub-btn:hover { background:#E9ECEE; }
.hub-icon { font-size:30px; margin-bottom:4px; }
.hub-label { font-size:17px; font-weight:bold; color:var(--azul); }
.hub-desc { font-size:12.5px; color:var(--humo); }
.back-home { font-size:13px; color:var(--humo); text-decoration:none; }
.back-home:hover { color:var(--azul); }
.sub-view h2 { color:var(--azul); font-size:24px; margin:18px 0 4px; }
.work-notice { background:#FFF7DD; border:1.5px solid var(--amar); border-radius:8px; padding:10px 14px; margin:0 0 14px; font-size:13.5px; color:var(--gris); line-height:1.5; }
.sub-view .section-note { font-size:13px; color:var(--humo); margin:0 0 24px; }
.back-btn { background:none; border:1.5px solid var(--azul); color:var(--azul); font-size:13px; font-weight:bold; padding:6px 14px; border-radius:20px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.back-btn:hover { background:var(--azul); color:#fff; }
.dl-big { display:inline-block; background:var(--amar); color:var(--azul-d); font-weight:bold; font-size:14px; text-decoration:none; padding:10px 20px; border-radius:20px; margin-bottom:18px; }
.pdf-frame { width:100%; height:78vh; border:none; border-radius:8px; box-shadow:0 2px 10px rgba(159,177,186,.28); }
.dl-row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
.dl-row .dl-big { margin-bottom:0; }
.dl-alt { background:#fff; color:var(--azul); border:2px solid var(--azul); padding:8px 18px; }
.pdf-frame-xl { width:min(1300px,96vw); margin-left:calc(50% - min(650px,48vw)); height:calc(100vh - 150px); min-height:560px; }
.img-frame { display:block; width:100%; height:auto; border-radius:8px; box-shadow:0 2px 10px rgba(159,177,186,.28); }
.img-caption { font-size:11px; color:var(--humo); text-align:center; margin-top:10px; font-style:italic; }
.img-caption em { font-style:italic; }
.img-caption a { color:var(--humo); }
.ref-intro { color:var(--azul); font-size:16px; margin:0 0 16px; }
.ref-item { font-size:13.5px; color:var(--gris); line-height:1.6; margin:0 0 16px; padding-left:28px; text-indent:-28px; }
.ref-item a { color:var(--azul); word-break:break-all; }
.ref-item em { font-style:italic; }
.ref-img-block { margin:0 0 16px; }
.ref-img-block .ref-img { display:block; width:100%; height:auto; border-radius:8px; box-shadow:0 2px 10px rgba(159,177,186,.28); margin-bottom:8px; }
.ref-img-block .ref-item { padding-left:0; text-indent:0; }
.notice { font-size:12px; color:var(--humo); font-style:italic; margin-top:10px; }
/* quiz */
.quiz-start { background:var(--claro); border-radius:12px; padding:26px; }
.quiz-start p { font-size:14px; margin:0 0 18px; }
.quiz-btn { background:var(--azul); color:#fff; border:none; border-radius:20px; padding:11px 22px; font-size:14px; font-weight:bold; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.quiz-btn:hover { filter:brightness(1.15); }
.quiz-progress { font-size:12px; color:var(--humo); margin-bottom:6px; }
.quiz-q { background:var(--claro); border-radius:12px; padding:24px; margin-bottom:18px; }
.quiz-q h3 { color:var(--azul); font-size:17px; margin:0 0 18px; }
.quiz-opt { display:block; width:100%; text-align:left; background:#fff; border:1.5px solid var(--humo); border-radius:8px; padding:12px 16px; margin-bottom:10px; font-size:14px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; color:var(--gris); }
.quiz-opt:hover { border-color:var(--azul); }
.quiz-opt.correct { border-color:var(--verde); background:#EAF6EB; font-weight:bold; }
.quiz-opt.incorrect { border-color:var(--rojo); background:#FBEAEC; }
.quiz-opt[disabled] { cursor:default; }
.quiz-feedback { font-size:13px; color:var(--gris); background:#fff; border-radius:8px; padding:12px 16px; margin-top:4px; margin-bottom:16px; border-left:3px solid var(--azul); }
.quiz-score { font-size:26px; font-weight:bold; color:var(--azul); margin-bottom:8px; }
.quiz-result { background:var(--claro); border-radius:12px; padding:30px; text-align:center; }
/* interactive manual */
.im-root { margin-top:0; }
.im-view .im-root { width:min(1320px, 96vw); margin-left:calc(50% - min(660px, 48vw)); }
.im-root:fullscreen { width:100%; margin:0; background:#fff; overflow:auto; padding:22px clamp(16px,4vw,56px) 40px; box-sizing:border-box; }
.im-root:-webkit-full-screen { width:100%; margin:0; background:#fff; overflow:auto; padding:22px clamp(16px,4vw,56px) 40px; box-sizing:border-box; }
.im-hero-tools { position:absolute; top:16px; right:16px; display:flex; gap:8px; z-index:1; flex-wrap:wrap; justify-content:flex-end; }
.im-hero-tools .im-hero-dl { position:static; }
.im-fs-btn { background:rgba(255,255,255,.14); color:#fff; border:1.5px solid rgba(255,255,255,.55); border-radius:20px; padding:8px 14px; font-size:12px; font-weight:bold; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.im-fs-btn:hover { background:rgba(255,255,255,.26); }
.im-rail .im-fs-rail { margin-left:auto; }
.im-hero-lema { color:#fff; opacity:.86; font-style:italic; font-size:14.5px; line-height:1.5; margin:12px 0 0; max-width:720px; position:relative; z-index:1; }
.im-card { position:relative; }
.im-card.visited::after { content:"✓ leído"; position:absolute; top:12px; right:12px; font-size:10.5px; font-weight:bold; color:var(--verde); background:#DFF3E0; border-radius:10px; padding:2px 8px; }
.im-progress { font-size:12.5px; color:var(--humo); margin:-8px 0 14px; }
.im-docimg { margin:8px 0 18px; text-align:center; }
.im-docimg img { max-width:100%; max-height:60vh; height:auto; cursor:zoom-in; border-radius:6px; }
.im-biblist { list-style:none; padding:0; margin:0 0 8px; }
.im-biblist li { background:var(--claro); border-left:3px solid var(--amar); border-radius:0 8px 8px 0; padding:10px 14px; margin-bottom:8px; font-size:13.5px; line-height:1.55; color:var(--gris); }
.im-biblist a { color:var(--azul); word-break:break-word; }
.im-check { list-style:none; padding:0; margin:0 0 14px; }
.im-check li { margin-bottom:8px; }
.im-check label { display:flex; gap:10px; align-items:flex-start; cursor:pointer; font-size:14.5px; line-height:1.55; color:var(--gris); background:var(--claro); border-radius:10px; padding:10px 14px; }
.im-check input { margin-top:4px; accent-color:var(--azul); width:16px; height:16px; flex:none; }
.im-check input:checked + span { text-decoration:line-through; text-decoration-color:var(--humo); color:var(--humo); }
.im-check-hint { font-size:12.5px; color:var(--humo); margin:0 0 10px; font-style:italic; }
.im-errorlist li.im-err-reveal { cursor:pointer; }
.im-errorlist li.im-err-reveal .im-error-desc { display:none; }
.im-errorlist li.im-err-reveal.open .im-error-desc { display:block; animation:imFadeIn .2s ease; }
.im-errorlist li.im-err-reveal .im-err-cta { display:inline-block; font-size:11.5px; font-weight:bold; color:var(--azul); margin-top:4px; }
.im-errorlist li.im-err-reveal.open .im-err-cta { display:none; }
.im-pager { display:flex; justify-content:space-between; gap:12px; margin:30px 0 6px; flex-wrap:wrap; }
.im-pager button { background:#fff; border:1.5px solid var(--azul); color:var(--azul); border-radius:22px; padding:9px 16px; font-size:13px; font-weight:bold; cursor:pointer; font-family:Arial,Helvetica,sans-serif; max-width:48%; }
.im-pager button:hover { background:var(--azul); color:#fff; }
.im-pager .im-next { margin-left:auto; }
.im-hero { position:relative; background:linear-gradient(135deg, var(--azul) 0%, var(--azul-d) 100%); border-radius:16px; padding:34px 26px 30px; margin-bottom:22px; overflow:hidden; }
.im-hero::before { content:""; position:absolute; top:-46px; right:-46px; width:190px; height:190px; border-radius:50%; background:rgba(244,197,66,.12); }
.im-hero::after { content:""; position:absolute; bottom:-60px; left:30%; width:160px; height:160px; border-radius:50%; background:rgba(255,255,255,.05); }
.im-hero-dl { position:absolute; top:16px; right:16px; background:var(--amar); color:var(--azul-d); border:none; border-radius:20px; padding:9px 16px; font-size:12px; font-weight:bold; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:6px; font-family:Arial,Helvetica,sans-serif; z-index:1; }
.im-hero-dl:hover { filter:brightness(1.08); }
.im-hero-kicker { color:var(--amar); font-size:12.5px; font-weight:bold; letter-spacing:.4px; margin:0 0 8px; position:relative; z-index:1; }
.im-hero-title { color:#fff; font-size:clamp(21px,3.2vw,30px); line-height:1.28; margin:0; max-width:620px; position:relative; z-index:1; }
@media (max-width:600px) {
  /* Absolute top-right placement overlaps the kicker/title on narrow
     screens (confirmed on a real phone-width viewport) -> drop it back into
     normal flow above them instead, full-width so it's easy to tap. */
  .im-hero-tools { position:static; margin:0 0 14px; justify-content:stretch; }
  .im-hero-tools > * { flex:1; text-align:center; justify-content:center; }
  .im-hero-dl { position:static; display:flex; justify-content:center; width:100%; margin:0 0 16px; box-sizing:border-box; }
}
.im-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
.im-card { text-align:left; background:var(--claro); border:none; border-radius:12px; padding:20px 20px 18px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; box-shadow:0 2px 10px rgba(159,177,186,.28); transition:transform .12s ease, background .12s ease; opacity:0; transform:translateY(10px); animation:imCardIn .35s ease forwards; }
.im-card:hover { background:#E9ECEE; transform:translateY(-2px); }
.im-card.im-card-bib { background:var(--azul); }
.im-card.im-card-bib .im-card-title, .im-card.im-card-bib .im-card-meta { color:#fff; }
.im-card-icon { font-size:24px; }
.im-card-title { display:block; font-size:16px; font-weight:bold; color:var(--azul); line-height:1.3; margin-top:10px; }
.im-card-meta { display:block; font-size:12px; color:var(--humo); margin-top:6px; }
@keyframes imCardIn { to { opacity:1; transform:translateY(0); } }
.im-rail { display:flex; gap:6px; overflow-x:auto; overflow-y:hidden; padding:12px 2px 16px; margin-bottom:18px; border-bottom:1px solid #E3E7E9; scrollbar-width:thin; scrollbar-color:var(--humo) transparent; }
.im-rail::-webkit-scrollbar { height:6px; }
.im-rail::-webkit-scrollbar-thumb { background:var(--humo); border-radius:3px; }
.im-rail::-webkit-scrollbar-track { background:transparent; }
.im-rail-btn { flex:none; display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; cursor:pointer; padding:6px 9px; border-radius:10px; font-family:Arial,Helvetica,sans-serif; opacity:.5; transition:opacity .15s ease, background .15s ease; }
.im-rail-btn:hover { opacity:.85; }
.im-rail-btn.active { opacity:1; background:var(--claro); }
.im-rail-icon { font-size:16px; line-height:1.4; }
.im-rail-label { font-size:9.5px; font-weight:bold; color:var(--gris); max-width:62px; text-align:center; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.im-rail-btn.active .im-rail-label { color:var(--azul); }
.im-chapter { animation:imFadeIn .25s ease; }
@keyframes imFadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
.im-crumb { background:none; border:none; color:var(--humo); font-size:13px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; padding:0; margin-bottom:16px; text-decoration:underline; }
.im-crumb:hover { color:var(--azul); }
.im-chapter-title { color:var(--azul); font-size:23px; margin:0 0 16px; }
.im-block-p { font-size:14.5px; line-height:1.7; color:var(--gris); margin:0 0 14px; }
.im-block-h4 { font-size:15px; font-weight:bold; color:var(--azul); margin:20px 0 8px; }
.im-sub-body .im-block-h4:first-child { margin-top:0; }
.im-block-ul, .im-block-ol { margin:0 0 14px; padding-left:22px; }
.im-block-ul li, .im-block-ol li { font-size:14.5px; line-height:1.65; color:var(--gris); margin-bottom:6px; }
.im-sub { border-top:1px solid #E3E7E9; }
.im-sub:first-child { border-top:none; }
.im-sub-head { width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; background:none; border:none; text-align:left; padding:16px 4px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.im-sub-head:hover .im-sub-title { color:var(--azul-d); }
.im-sub-title { font-size:15.5px; font-weight:bold; color:var(--azul); }
.im-sub-arrow { color:var(--humo); font-size:13px; transition:transform .15s ease; flex:none; }
.im-sub.open .im-sub-arrow { transform:rotate(90deg); }
.im-sub-body { max-height:0; overflow:hidden; padding:0 4px; transition:max-height .3s ease; }
.im-sub.open .im-sub-body { max-height:none; padding-bottom:14px; }
.im-code-toggle { display:inline-flex; align-items:center; gap:6px; background:#fff; border:1.5px dashed var(--humo); color:var(--azul); font-size:12.5px; font-weight:bold; border-radius:20px; padding:7px 14px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; margin:2px 0 14px; }
.im-code-toggle:hover { border-color:var(--azul); }
.im-code-box { display:none; background:#F2F4F5; border-radius:8px; padding:14px 16px; margin:0 0 14px; overflow-x:auto; animation:imFadeIn .2s ease; }
.im-code-box.open { display:block; }
.im-code-box pre { margin:0; font-family:"Courier New",monospace; font-size:13px; line-height:1.55; color:#1c2a30; white-space:pre-wrap; word-break:break-word; }
.im-table-toggle { display:inline-flex; align-items:center; gap:6px; background:#fff; border:1.5px solid var(--azul); color:var(--azul); font-size:12.5px; font-weight:bold; border-radius:20px; padding:7px 14px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; margin:2px 0 14px; }
.im-table-toggle:hover { background:var(--azul); color:#fff; }
.im-table-bare { overflow-x:auto; margin:0 0 16px; border-radius:8px; box-shadow:0 2px 10px rgba(159,177,186,.28); scrollbar-width:thin; scrollbar-color:var(--humo) transparent; }
.im-table-bare::-webkit-scrollbar, .im-code-box::-webkit-scrollbar, .im-modal table::-webkit-scrollbar { height:6px; }
.im-table-bare::-webkit-scrollbar-thumb, .im-code-box::-webkit-scrollbar-thumb { background:var(--humo); border-radius:3px; }
.im-table-bare::-webkit-scrollbar-track, .im-code-box::-webkit-scrollbar-track { background:transparent; }
.im-table-bare table, .im-modal table { border-collapse:collapse; width:100%; font-size:13px; }
.im-table-bare th, .im-modal th { background:var(--azul); color:#fff; text-align:left; padding:9px 12px; font-size:12.5px; }
.im-table-bare td, .im-modal td { padding:9px 12px; border-bottom:1px solid #E3E7E9; color:var(--gris); }
.im-table-bare tr:nth-child(even) td, .im-modal tr:nth-child(even) td { background:var(--claro); }
.im-modal-overlay { position:fixed; inset:0; background:rgba(10,20,26,.55); display:flex; align-items:center; justify-content:center; padding:5vh 4vw; z-index:500; animation:imFadeIn .15s ease; }
.im-modal { background:#fff; border-radius:14px; max-width:760px; width:100%; max-height:90vh; min-width:0; display:flex; flex-direction:column; box-shadow:0 12px 40px rgba(0,0,0,.3); }
.im-modal.im-modal-wide { max-width:min(1500px, 96vw); }
.im-modal-body img { display:block; max-width:100%; max-height:72vh; width:auto; height:auto; margin:0 auto; border-radius:8px; object-fit:contain; }
.im-modal-head { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid #E3E7E9; flex:none; }
.im-modal-head h4 { margin:0; color:var(--azul); font-size:15.5px; }
.im-modal-close { background:var(--claro); border:none; width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:14px; color:var(--gris); flex:none; }
.im-modal-close:hover { background:#E3E7E9; }
.im-modal-body { flex:1; min-height:0; min-width:0; overflow:auto; padding:16px 20px 20px; text-align:center; }
.im-modal-body table { min-width:max-content; }
.im-figure { margin:6px 0 20px; }
.im-figure-img { display:block; width:auto; max-width:100%; height:auto; max-height:82vh; margin:0 auto; border-radius:10px; box-shadow:0 4px 16px rgba(159,177,186,.35); cursor:zoom-in; }
.im-figure-caption { font-size:12px; color:var(--humo); text-align:center; margin-top:8px; font-style:italic; }
@media (min-width:860px) {
  .im-figure { width:min(1300px, 92vw); margin-left:calc(50% - min(650px, 46vw)); margin-right:calc(50% - min(650px, 46vw)); }
}
.im-img-btn { display:flex; align-items:center; gap:14px; width:100%; max-width:420px; background:var(--claro); border:none; border-radius:14px; padding:10px; margin:4px 0 20px; cursor:pointer; text-align:left; font-family:Arial,Helvetica,sans-serif; box-shadow:0 2px 10px rgba(159,177,186,.28); transition:transform .12s ease, background .12s ease; }
.im-img-btn:hover { background:#E9ECEE; transform:translateY(-2px); }
.im-img-btn-thumb { flex:none; width:64px; height:64px; border-radius:10px; background-size:cover; background-position:center; position:relative; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
.im-img-btn-thumb::after { content:"🔍"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:18px; background:rgba(11,44,66,.35); border-radius:10px; }
.im-img-btn-text { display:flex; flex-direction:column; gap:2px; }
.im-img-btn-label { font-size:13.5px; font-weight:bold; color:var(--azul); }
.im-img-btn-sub { font-size:11.5px; color:var(--humo); }
.im-reveal-toggle { display:inline-flex; align-items:center; gap:6px; background:#fff; border:1.5px dashed var(--humo); color:var(--azul); font-size:12.5px; font-weight:bold; border-radius:20px; padding:7px 14px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; margin:2px 0 14px; }
.im-reveal-toggle:hover { border-color:var(--azul); }
.im-reveal-box { display:none; margin:0 0 16px; }
.im-reveal-box.open { display:block; animation:imFadeIn .25s ease; }
.im-reveal-box img { display:block; width:100%; border-radius:10px; box-shadow:0 4px 16px rgba(159,177,186,.35); }
.im-errorlist { list-style:none; padding:0; margin:0 0 6px; }
.im-errorlist li { background:var(--claro); border-left:3px solid var(--rojo); border-radius:0 8px 8px 0; padding:12px 16px; margin-bottom:10px; }
.im-errorlist .im-error-term { display:block; font-weight:bold; color:var(--azul); font-size:14px; margin-bottom:4px; }
.im-errorlist .im-error-desc { font-size:13.5px; color:var(--gris); line-height:1.6; }
.im-cite { color:var(--azul); font-weight:bold; cursor:pointer; border-bottom:1.5px dotted var(--azul); white-space:normal; }
.im-cite:hover { color:var(--azul-d); }
.im-cite-pop { display:none; background:var(--azul-d); color:#fff; border-radius:8px; padding:12px 16px; font-size:12.5px; line-height:1.6; margin:6px 0 14px; }
.im-cite-pop.open { display:block; }
.im-cite-pop p { margin:0 0 8px; }
.im-cite-pop p:last-child { margin-bottom:0; }
.im-cite-pop a { color:var(--amar); }
.im-bib-list { margin-top:6px; }
.im-bib-item.im-bib-highlight { background:#FDF1C7; border-radius:8px; padding:10px 14px; margin-left:-14px; margin-right:-14px; }
code.im-inline { background:#F2F4F5; padding:1px 6px; border-radius:4px; font-family:"Courier New",monospace; font-size:.93em; }
/* teacher panel */
.teacher-banner { background:var(--azul-d); color:#fff; border-radius:12px; padding:18px 22px; margin-bottom:24px; }
.teacher-banner strong { color: var(--amar); }
.teacher-banner p { font-size:13px; margin:6px 0 0; color:var(--humo); }
.teacher-token-row { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
.teacher-token-row input { flex:1; min-width:220px; padding:9px 12px; border-radius:8px; border:none; font-size:13px; font-family:Arial,Helvetica,sans-serif; }
.teacher-token-row button { background:var(--amar); color:var(--azul-d); border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:bold; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
.teacher-status { font-size:12px; margin-top:10px; min-height:16px; }
.teacher-toggle-list { list-style:none; padding:0; margin:16px 0 0; display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; }
.teacher-toggle-list li { background:rgba(255,255,255,.08); border-radius:8px; padding:10px 14px; display:flex; align-items:center; gap:10px; font-size:13px; }
.teacher-toggle-list input { width:18px; height:18px; }
.hub-btn .teacher-hint { position:absolute; top:10px; right:12px; font-size:10px; font-weight:bold; padding:2px 8px; border-radius:10px; }
.hub-btn .teacher-hint.on { background:#DFF3E0; color:var(--verde); }
.hub-btn .teacher-hint.off { background:#FBEAEC; color:var(--rojo); }
footer { text-align:center; padding:26px clamp(20px,6vw,48px) 40px; font-size:11px; color:var(--humo); font-style:italic; }
</style>

  var QUIZ_MANUAL = [{"question":"¿Cuál es el objetivo principal del *recall* léxico en el contexto de la evaluación de traducción automática?","answerOptions":[{"text":"Medir qué proporción de las palabras de la referencia humana han sido recuperadas por la hipótesis.","isCorrect":true,"rationale":"El recall se centra en la cobertura, asegurando que la información esperada en la traducción humana esté presente en la salida del sistema."},{"text":"Calcular el porcentaje de palabras de la traducción automática que son correctas según la referencia.","isCorrect":false,"rationale":"Esta descripción corresponde a la precisión léxica, que observa la exactitud de lo producido en lugar de la cobertura de la referencia."},{"text":"Determinar si la hipótesis y la referencia son idénticas carácter por carácter.","isCorrect":false,"rationale":"La identidad total es el dominio de la métrica Exact Match, no de una medida proporcional como el recall."},{"text":"Evaluar la fluidez gramatical de la frase generada sin considerar el texto original.","isCorrect":false,"rationale":"El recall léxico es una métrica de comparación con una referencia, no una evaluación intrínseca de la fluidez del lenguaje meta."}],"hint":"Piensa en si la métrica se enfoca en lo que el sistema 'ha logrado capturar' de lo que un humano escribió."},{"question":"En el cálculo del F1-score léxico, ¿por qué se utiliza la media armónica entre precisión y recall?","answerOptions":[{"text":"Para penalizar los desequilibrios extremos entre la exactitud y la cobertura.","isCorrect":true,"rationale":"La media armónica asegura que si una de las dos métricas es muy baja, el valor de F1 también lo sea, promoviendo un rendimiento equilibrado."},{"text":"Para dar siempre más peso a la precisión que al recall en tareas de traducción.","isCorrect":false,"rationale":"El F1-score estándar trata ambas métricas por igual; existen variantes ponderadas (F-beta) para asignar pesos diferentes."},{"text":"Porque es matemáticamente más sencilla de calcular que la media aritmética.","isCorrect":false,"rationale":"La media aritmética es más sencilla, pero no refleja adecuadamente el rendimiento cuando hay valores cercanos a cero."},{"text":"Para eliminar la necesidad de realizar una limpieza previa de los textos.","isCorrect":false,"rationale":"La fórmula matemática es independiente del proceso de normalización o limpieza de los datos de entrada."}],"hint":"Considera qué sucede con el resultado final si la precisión es muy alta pero el recall es casi cero."},{"question":"¿Cuál es una limitación fundamental de la métrica Exact Match en la evaluación de traducciones?","answerOptions":[{"text":"Es demasiado estricta, ya que penaliza variaciones válidas como el uso de sinónimos o cambios menores en el orden.","isCorrect":true,"rationale":"La traducción es una tarea abierta donde múltiples respuestas pueden ser correctas; Exact Match solo acepta la identidad total."},{"text":"Requiere un entrenamiento previo con modelos de lenguaje masivos entrenados sobre corpus muy extensos.","isCorrect":false,"rationale":"Exact Match es una comparación booleana simple que no requiere inteligencia artificial ni modelos preentrenados."},{"text":"Solo se puede aplicar a textos en inglés debido a sus dependencias lingüísticas.","isCorrect":false,"rationale":"Es una métrica universalmente aplicable a cualquier cadena de caracteres, independientemente del idioma."},{"text":"No permite detectar si una palabra ha sido omitida en la traducción.","isCorrect":false,"rationale":"Cualquier omisión rompe la igualdad de las cadenas, por lo que Exact Match detectaría la diferencia inmediatamente."}],"hint":"Recuerda que en traducción, una misma idea puede expresarse de varias formas correctas."},{"question":"Si definimos el conjunto A como las palabras de la referencia y el conjunto B como las de la hipótesis, ¿cómo se calcula el índice Jaccard?","answerOptions":[{"text":"|A ∩ B| / |A ∪ B|","isCorrect":true,"rationale":"El índice Jaccard mide el solapamiento dividiendo la intersección de los conjuntos entre su unión."},{"text":"|A ∪ B| / |A ∩ B|","isCorrect":false,"rationale":"Esta fórmula es la inversa de Jaccard y produciría valores mayores a 1, lo cual no es estándar para una métrica de similitud."},{"text":"|A ∩ B| × |A ∪ B|","isCorrect":false,"rationale":"Multiplicar la intersección por la unión no normaliza el resultado entre 0 y 1, lo que dificulta la comparación entre frases de distinta longitud."},{"text":"|A| - |B|","isCorrect":false,"rationale":"Restar el tamaño de los conjuntos solo indicaría la diferencia de longitud, ignorando por completo qué palabras coinciden."}],"hint":"Esta métrica busca la proporción de elementos compartidos respecto al total de elementos únicos en ambas versiones."},{"question":"¿Qué representa un bigrama en el análisis de n-gramas aplicado a la evaluación de traducciones?","answerOptions":[{"text":"Una secuencia de dos palabras consecutivas en el texto.","isCorrect":true,"rationale":"Los n-gramas capturan información sobre el orden; en el caso de los bigramas, el valor de n es 2."},{"text":"Una palabra que aparece dos veces dentro de la misma frase.","isCorrect":false,"rationale":"Eso se refiere a la frecuencia de un unigrama, no a una secuencia de elementos adyacentes."},{"text":"Una traducción que ha sido revisada por dos personas distintas.","isCorrect":false,"rationale":"El término bigrama es un concepto computacional de segmentación de texto, no un procedimiento de revisión humana."},{"text":"El uso de dos sinónimos para una misma palabra del texto fuente.","isCorrect":false,"rationale":"Aunque se relacione con el léxico, los bigramas se definen por la contigüidad posicional, no por la relación semántica de sinonimia."}],"hint":"El prefijo 'bi-' indica el número de elementos que conforman la secuencia."},{"question":"¿Por qué la métrica BLEU incorpora una 'penalización por brevedad' (*brevity penalty*)?","answerOptions":[{"text":"Para evitar que traducciones muy cortas obtengan una precisión artificialmente alta al omitir información difícil.","isCorrect":true,"rationale":"Sin esta penalización, un sistema podría traducir solo las dos palabras de las que está seguro y obtener un 1.0 en precisión de n-gramas."},{"text":"Para incentivar que el sistema genere textos más largos que la referencia original.","isCorrect":false,"rationale":"BLEU no busca que la traducción sea más larga, sino que tenga una longitud similar a la de las referencias humanas."},{"text":"Para corregir errores derivados del uso de sinónimos en la hipótesis generada por el sistema automático.","isCorrect":false,"rationale":"La penalización por brevedad se basa únicamente en la longitud de las cadenas, no en la semántica o elección de palabras."},{"text":"Para reducir el tiempo de procesamiento necesario para calcular la métrica.","isCorrect":false,"rationale":"La penalización es un ajuste matemático al final del cálculo y no afecta significativamente al rendimiento computacional."}],"hint":"Considera qué pasaría si un sistema solo traduce la primera palabra de una frase larga y esa palabra es correcta."},{"question":"¿Cuál es la principal ventaja de chrF sobre métricas basadas exclusivamente en palabras como BLEU?","answerOptions":[{"text":"Es más capaz de detectar similitudes parciales y parentescos formales en lenguas con mucha variación morfológica.","isCorrect":true,"rationale":"Al trabajar con n-gramas de caracteres, chrF reconoce raíces compartidas entre palabras con diferentes desinencias de género, número o tiempo."},{"text":"Garantiza que la traducción sea semánticamente perfecta aunque cambie la forma.","isCorrect":false,"rationale":"Como métrica superficial, chrF sigue basándose en la forma física de los caracteres y no comprende el significado profundo."},{"text":"No requiere una traducción humana de referencia para realizar la evaluación.","isCorrect":false,"rationale":"Al igual que BLEU, chrF es una métrica de referencia y necesita un texto humano para comparar la hipótesis."},{"text":"Ignora por completo el orden de las palabras en la frase, tratándolas como un conjunto sin secuencia definida.","isCorrect":false,"rationale":"Aunque trabaje con caracteres, estos siguen una secuencia, y la variante chrF++ incluso incorpora n-gramas de palabras para captar el orden léxico."}],"hint":"Piensa en idiomas donde las palabras cambian de forma según el género o el número (como el español)."},{"question":"¿Qué característica distingue a METEOR en su intento de correlacionar mejor con los juicios humanos?","answerOptions":[{"text":"Permite coincidencias flexibles mediante el uso de raíces (*stemming*) y diccionarios de sinónimos.","isCorrect":true,"rationale":"METEOR va más allá de la coincidencia exacta de cadenas, permitiendo que 'correr' y 'corrió' se consideren aciertos."},{"text":"Utiliza únicamente modelos neuronales de última generación para comparar vectores.","isCorrect":false,"rationale":"METEOR es una métrica clásica que utiliza recursos lingüísticos definidos de antemano (como WordNet), no necesariamente modelos de embeddings neuronales."},{"text":"Se basa exclusivamente en la precisión de los unigramas, sin considerar en absoluto el orden de las palabras.","isCorrect":false,"rationale":"METEOR incluye una penalización por fragmentación para tener en cuenta si las palabras coincidentes están en un orden coherente."},{"text":"Evalúa la calidad de la traducción sin necesidad de preprocesamiento o limpieza previa.","isCorrect":false,"rationale":"Como todas las métricas, METEOR se beneficia y a menudo requiere etapas de normalización para funcionar correctamente con sus recursos lingüísticos."}],"hint":"Busca una función que le permita reconocer que 'médico' y 'doctor' están relacionados."},{"question":"¿Cómo utiliza BERTScore los modelos de lenguaje para evaluar la similitud entre frases?","answerOptions":[{"text":"Compara la similitud de los *embeddings* contextuales de cada *token* de la hipótesis con los de la referencia.","isCorrect":true,"rationale":"Al usar modelos tipo BERT, la representación de cada palabra cambia según su contexto, permitiendo comparaciones semánticas más precisas."},{"text":"Cuenta cuántas veces aparece la palabra 'BERT' en el texto fuente y en la traducción.","isCorrect":false,"rationale":"El nombre de la métrica proviene del modelo utilizado (Bidirectional Encoder Representations from Transformers), no de la búsqueda de esa palabra clave."},{"text":"Genera una nueva traducción automática y la compara con la original mediante Jaccard.","isCorrect":false,"rationale":"BERTScore es una métrica de evaluación que utiliza representaciones vectoriales preexistentes, no un motor de traducción que genere nuevo texto."},{"text":"Mide el tiempo que tarda un modelo neuronal en procesar la frase de referencia antes de devolver cualquier puntuación.","isCorrect":false,"rationale":"La métrica se enfoca en la calidad lingüística y semántica del contenido, no en la eficiencia computacional o latencia del modelo."}],"hint":"Esta métrica sustituye la coincidencia de letras por la coincidencia de vectores que representan el significado en contexto."},{"question":"¿Qué innovación fundamental introduce la métrica COMET respecto a métricas tradicionales como BLEU o chrF?","answerOptions":[{"text":"Es capaz de incorporar información del texto fuente, además de la hipótesis y la referencia.","isCorrect":true,"rationale":"COMET utiliza un marco multilingüe que permite evaluar la adecuación de la traducción respecto al original, no solo su parecido con la referencia."},{"text":"Es la única métrica que no requiere el uso de Python para su ejecución en ningún entorno de programación.","isCorrect":false,"rationale":"COMET es un marco de trabajo altamente tecnológico que se implementa y ejecuta típicamente en entornos de programación como Python."},{"text":"Reduce drásticamente el coste computacional al no utilizar redes neuronales.","isCorrect":false,"rationale":"Al contrario, COMET es más exigente computacionalmente porque se basa en modelos neuronales profundos para codificar los textos."},{"text":"Se basa exclusivamente en reglas gramaticales codificadas a mano por lingüistas.","isCorrect":false,"rationale":"Es una métrica aprendida que se entrena con grandes volúmenes de datos y juicios humanos, alejándose de los sistemas basados puramente en reglas."}],"hint":"Piensa en qué elemento del proceso de traducción (fuente → destino) suelen ignorar las métricas que solo miran la referencia humana."},{"question":"En el preprocesamiento de textos con Python, ¿por qué es común aplicar el método `.lower()` antes de comparar cadenas?","answerOptions":[{"text":"Para evitar que la métrica considere como diferentes palabras que solo varían en el uso de mayúsculas (como al inicio de frase).","isCorrect":true,"rationale":"La normalización a minúsculas reduce el ruido superficial, permitiendo que 'Árbol' y 'árbol' se identifiquen como la misma unidad léxica."},{"text":"Porque las métricas automáticas como BLEU solo funcionan con textos en minúsculas por diseño técnico.","isCorrect":false,"rationale":"Las métricas pueden procesar cualquier carácter; el paso a minúsculas es una decisión metodológica del evaluador, no una restricción de la fórmula."},{"text":"Para aumentar artificialmente la puntuación de las traducciones de baja calidad sin mejorar realmente su fidelidad al original.","isCorrect":false,"rationale":"El objetivo es la consistencia y la eliminación de diferencias irrelevantes, no la manipulación de los resultados de calidad."},{"text":"Porque el lenguaje Python no permite comparar un string con mayúsculas y otro con minúsculas.","isCorrect":false,"rationale":"Python puede compararlos perfectamente, pero el operador `==` devolverá `False` si hay diferencias de caja, lo cual no siempre es deseable en evaluación lingüística."}],"hint":"Considera la diferencia entre 'La' al principio de una frase y 'la' en medio de ella desde un punto de vista léxico."},{"question":"¿Cuál es la función del parámetro `smoothing_function` al calcular BLEU con la biblioteca NLTK?","answerOptions":[{"text":"Evitar que la puntuación sea cero en frases cortas cuando no hay coincidencias de n-gramas de mayor orden.","isCorrect":true,"rationale":"El suavizado asigna un valor pequeño a los niveles sin coincidencia para que el promedio geométrico no colapse a cero."},{"text":"Traducir automáticamente los términos que el sistema no ha sabido procesar.","isCorrect":false,"rationale":"BLEU es una métrica de evaluación pasiva; no tiene capacidad para generar o corregir traducciones."},{"text":"Eliminar automáticamente los signos de puntuación y las palabras vacías (*stop words*).","isCorrect":false,"rationale":"La limpieza y el filtrado de palabras son pasos de preprocesamiento manual; el smoothing es un ajuste estadístico del cálculo."},{"text":"Aumentar la velocidad de cálculo de la métrica en corpus de gran tamaño mediante paralelización interna.","isCorrect":false,"rationale":"El smoothing añade una pequeña complejidad adicional al cálculo, por lo que no está diseñado para la optimización de la velocidad."}],"hint":"Recuerda que BLEU combina la precisión de 1-gramas, 2-gramas, 3-gramas y 4-gramas mediante una multiplicación."}];
  var QUIZ_CUADERNO = [{"question":"¿Cuál es el objetivo principal de realizar un preprocesamiento que incluya la eliminación de signos de puntuación y la conversión a minúsculas antes de evaluar una traducción?","answerOptions":[{"text":"Garantizar que el sistema no penalice palabras idénticas por diferencias puramente ortotipográficas.","isCorrect":true,"rationale":"El preprocesamiento asegura que palabras como 'Mi' y 'mi' se cuenten como la misma unidad, evitando que la métrica de precisión sea artificialmente baja."},{"text":"Aumentar artificialmente la puntuación BLEU para que los resultados parezcan mejores de lo que son.","isCorrect":false,"rationale":"El objetivo es la consistencia en el recuento, no la manipulación de los resultados finales para inflar la calidad del sistema."},{"text":"Reducir el tiempo de ejecución de las funciones de Python al procesar menos caracteres.","isCorrect":false,"rationale":"Aunque se eliminan caracteres, el impacto en el rendimiento computacional es insignificante comparado con la necesidad de precisión léxica."},{"text":"Permitir que el sistema reconozca automáticamente los sinónimos mediante la eliminación de símbolos.","isCorrect":false,"rationale":"La limpieza del texto solo ayuda con la coincidencia literal de formas, no otorga al sistema la capacidad de entender la semántica de los sinónimos."}],"hint":"Piensa en qué ocurriría si comparas 'Casa.' con 'casa' sin realizar ninguna limpieza."},{"question":"En el contexto de la evaluación de traducciones, ¿cómo se define la métrica de Precision (precisión léxica)?","answerOptions":[{"text":"La proporción de palabras de la traducción automática que coinciden con la traducción de referencia.","isCorrect":true,"rationale":"La precisión mide cuántas de las palabras generadas por el sistema son correctas según la referencia humana, usando el total de la automática como denominador."},{"text":"La proporción de palabras en la traducción humana que fueron recuperadas por la automática.","isCorrect":false,"rationale":"Esta descripción corresponde al Recall, que se centra en la cobertura de la frase de referencia y no en el acierto de la máquina."},{"text":"El promedio geométrico de los n-gramas coincidentes entre dos oraciones.","isCorrect":false,"rationale":"Esta es una característica clave del cálculo de BLEU, no de la precisión léxica simple de palabras individuales."},{"text":"La suma total de palabras únicas dividida por el total de palabras de ambos textos.","isCorrect":false,"rationale":"Este concepto se acerca más a la lógica del índice Jaccard, que trata las palabras como conjuntos no ordenados."}],"hint":"Recuerda que esta métrica se pregunta: ¿Cuántas de las palabras que 'ha dicho' la máquina son correctas?"},{"question":"Si una traducción automática genera la frase 'Los perros corren' y la referencia humana es 'Los perros corren rápido', ¿cuál es el valor del Recall?","answerOptions":[{"text":"0.75","isCorrect":true,"rationale":"El Recall se calcula dividiendo las palabras coincidentes (3) entre el total de palabras de la referencia humana (4), resultando en 3/4 = 0.75."},{"text":"0.50","isCorrect":false,"rationale":"Esto implicaría que solo la mitad de la referencia fue capturada, pero en este caso se recuperaron tres de cuatro palabras."},{"text":"1.00","isCorrect":false,"rationale":"El valor máximo solo se alcanza si todas las palabras de la referencia humana están presentes en la automática."},{"text":"0.33","isCorrect":false,"rationale":"Este valor no se corresponde con ninguna de las proporciones léxicas directas de este ejemplo."}],"hint":"Para el Recall, el denominador siempre es el número total de palabras en la traducción humana de referencia."},{"question":"¿Cuál es la principal limitación de la métrica 'Exact Match' en tareas de traducción natural?","answerOptions":[{"text":"Cualquier pequeña variación léxica o de orden resulta en un valor negativo, aunque el significado sea idéntico.","isCorrect":true,"rationale":"Al comparar la igualdad total de las cadenas, un simple sinónimo hace que la métrica falle, lo cual no refleja la calidad real del lenguaje natural."},{"text":"Es demasiado permisiva con el uso de sinónimos.","isCorrect":false,"rationale":"Al contrario, es una métrica extremadamente rígida que no permite ninguna variación respecto a la referencia."},{"text":"No considera la longitud de la frase original ni el contexto comunicativo en el que se produjo.","isCorrect":false,"rationale":"Aunque esto es cierto, su principal limitación es la incapacidad de validar traducciones que son correctas pero diferentes en forma."},{"text":"Requiere obligatoriamente que el texto esté en formato JSON para funcionar.","isCorrect":false,"rationale":"Exact Match es una comparación booleana simple de cadenas o listas que no depende de formatos de archivo específicos."}],"hint":"Considera qué pasaría si una máquina traduce 'enormes' y el humano escribió 'grandes'."},{"question":"¿Por qué la puntuación BLEU suele ser drásticamente más baja que la precisión léxica cuando hay un error al final de una frase?","answerOptions":[{"text":"Debido a que utiliza el promedio geométrico de n-gramas (1 a 4), y si un n-grama largo no coincide, la puntuación cae con fuerza.","isCorrect":true,"rationale":"Al fallar una palabra al final, se rompen secuencias de pares, tríos y cuartetos de palabras, afectando múltiples niveles de precisión simultáneamente."},{"text":"Porque BLEU solo tiene en cuenta la primera palabra de la frase y descarta el resto de la traducción.","isCorrect":false,"rationale":"BLEU analiza toda la frase, pero su estructura multigramática es la que causa la sensibilidad al orden y las secuencias."},{"text":"Porque BLEU no permite el uso de funciones de suavizado (smoothing).","isCorrect":false,"rationale":"De hecho, BLEU permite funciones de suavizado precisamente para evitar que la puntuación llegue a cero absoluto en frases cortas."},{"text":"Porque BLEU ignora los unigramas y solo cuenta grupos de cuatro palabras.","isCorrect":false,"rationale":"BLEU combina unigramas, bigramas, trigramas y 4-gramas de forma equilibrada mediante su promedio."}],"hint":"BLEU no mira palabras sueltas únicamente; mira 'cadenas' de palabras de distintos tamaños."},{"question":"¿Cuál es una ventaja clave de la métrica chrF frente a BLEU?","answerOptions":[{"text":"chrF puede detectar similitudes parciales entre palabras con variaciones morfológicas mediante n-gramas de caracteres.","isCorrect":true,"rationale":"Al trabajar con fragmentos de caracteres, chrF reconoce raíces comunes (ej. 'traducir' vs 'traducción') que BLEU ignoraría por no ser palabras exactas."},{"text":"chrF es la única métrica que garantiza una comprensión semántica profunda del texto.","isCorrect":false,"rationale":"Ninguna métrica formal como chrF comprende el significado; solo analizan patrones superficiales de caracteres."},{"text":"chrF siempre devuelve un valor entre 0 y 1, facilitando su lectura frente a la escala 0-100 de BLEU.","isCorrect":false,"rationale":"Es al revés: BLEU suele presentarse entre 0 y 1, mientras que las implementaciones de chrF en librerías como 'evaluate' usan la escala 0-100."},{"text":"chrF no requiere una traducción de referencia para ser calculada, a diferencia de BLEU y otras métricas clásicas.","isCorrect":false,"rationale":"Al ser una métrica de coincidencia formal, chrF necesita obligatoriamente una referencia humana para realizar la comparación."}],"hint":"Piensa en palabras que comparten la misma raíz pero tienen diferentes terminaciones."},{"question":"¿Qué mide específicamente el índice Jaccard en la evaluación de textos?","answerOptions":[{"text":"La similitud entre conjuntos de palabras únicas, comparando la intersección frente a la unión.","isCorrect":true,"rationale":"Se calcula dividiendo el número de palabras compartidas entre el número total de palabras distintas que aparecen en ambos textos sumados."},{"text":"La secuencia exacta de palabras respetando el orden sintáctico.","isCorrect":false,"rationale":"Jaccard es una métrica de conjuntos que ignora por completo el orden de los elementos."},{"text":"La media armónica entre la precisión y el recall, calculada palabra por palabra en cada segmento traducido.","isCorrect":false,"rationale":"Esta es la definición del F1-score, que busca un equilibrio entre acierto y cobertura."},{"text":"La cantidad de errores gramaticales cometidos por el motor de traducción.","isCorrect":false,"rationale":"Jaccard solo observa la presencia o ausencia de léxico, no evalúa la corrección gramatical de las frases."}],"hint":"Imagina las palabras como elementos de un saco donde el orden en que se sacan no importa."},{"question":"En el cálculo de BLEU, ¿qué es la 'Brevity Penalty' (penalización por brevedad)?","answerOptions":[{"text":"Un ajuste que castiga a las traducciones automáticas que son mucho más cortas que la referencia humana.","isCorrect":true,"rationale":"Esta penalización evita que los sistemas obtengan puntuaciones altas simplemente por generar frases muy cortas con palabras fáciles de acertar."},{"text":"Un proceso que elimina las palabras más cortas del texto (como preposiciones) antes del cálculo.","isCorrect":false,"rationale":"BLEU no elimina palabras por su longitud; la penalización se aplica a la longitud total de la frase generada."},{"text":"Una técnica para acelerar el cálculo de la métrica en ordenadores con pocos recursos.","isCorrect":false,"rationale":"El término se refiere a una penalización estadística sobre la calidad de la traducción, no a una optimización de software."},{"text":"Un error común en Python que ocurre cuando la lista de palabras está vacía.","isCorrect":false,"rationale":"Es un componente diseñado de la fórmula matemática de BLEU, no un error de programación o excepción de código."}],"hint":"Piensa en por qué una traducción de una sola palabra correcta no debería tener un 100% de éxito si la referencia tiene diez palabras."},{"question":"Si una traducción automática y una humana tienen un F1-score de 0.85, pero un Exact Match de 'No', ¿cuál es la interpretación más probable?","answerOptions":[{"text":"Hay una alta coincidencia de vocabulario, pero existe al menos una diferencia en palabras o en su orden.","isCorrect":true,"rationale":"El F1 refleja la similitud léxica general, mientras que el Exact Match es binario y falla ante cualquier discrepancia mínima."},{"text":"El sistema ha fallado completamente y la traducción no es útil.","isCorrect":false,"rationale":"Un F1-score de 0.85 es muy alto, lo que indica que la traducción es de gran calidad a pesar de no ser idéntica."},{"text":"La traducción automática es idéntica pero el código de Python tiene un error de comparación.","isCorrect":false,"rationale":"Si el Exact Match es 'No', es porque los objetos comparados no son iguales, lo cual es lo normal en traducciones válidas pero diferentes."},{"text":"El valor del F1-score es incorrecto porque nunca puede ser superior al índice Jaccard en ningún caso.","isCorrect":false,"rationale":"Es común que el F1 sea superior al índice Jaccard, ya que este último es matemáticamente más exigente al considerar la unión total del vocabulario."}],"hint":"Recuerda que existen muchas formas correctas de traducir la misma idea."},{"question":"¿Para qué sirve el parámetro 'smoothing_function' en la función sentence_bleu de NLTK?","answerOptions":[{"text":"Para evitar que la puntuación sea 0 cuando no hay coincidencias en n-gramas de orden superior en frases cortas.","isCorrect":true,"rationale":"En frases cortas, es fácil que no haya coincidencias de 4 palabras seguidas; el suavizado asigna un valor pequeño para que el promedio geométrico no se anule."},{"text":"Para corregir automáticamente la ortografía de la traducción automática.","isCorrect":false,"rationale":"Las métricas evalúan el texto tal como es, no tienen capacidad de edición o corrección del contenido evaluado."},{"text":"Para redondear el resultado final a dos decimales de forma automática antes de mostrarlo por pantalla.","isCorrect":false,"rationale":"El redondeo se hace con funciones de formato de salida, mientras que el smoothing es un ajuste matemático interno del cálculo."},{"text":"Para que la métrica ignore las mayúsculas y minúsculas sin necesidad de preprocesamiento.","isCorrect":false,"rationale":"BLEU sigue comparando tokens exactos; el preprocesamiento manual sigue siendo necesario independientemente del suavizado."}],"hint":"Considera qué sucede al multiplicar varios números si uno de ellos es exactamente cero."}];
  var IM_DATA = {"manual_interactivo":{"header":{"kicker":"Tema 5.","title":"Evaluación automática de traducciones","subtitle":"Métricas léxicas, BLEU, chrF, METEOR y métricas neuronales: cálculo e interpretación de resultados para PLN","meta":"Material teórico | Programación para PLN | Universidad Pontificia Comillas","narrative":"Evaluación automática de traducciones: medir, interpretar y decidir con criterio lingüístico."},"sections":[{"id":"contexto-profesional","title":"Contexto profesional","blocks":[],"subsections":[{"id":"encargo-auditoria-rapida-de-traduccion-automatica","title":"Encargo: auditoría rápida de traducción automática","blocks":[{"type":"p","text":"Imagina que te incorporas al equipo de evaluación lingüística de NexaLingua Quality Lab, una consultora especializada en control de calidad lingüística, evaluación de traducción automática y diseño de flujos de revisión para organizaciones multilingües. La empresa trabaja con instituciones públicas, editoriales científicas y departamentos de comunicación internacional que necesitan publicar textos fiables en varias lenguas."},{"type":"p","text":"NexaLingua no se presenta como una agencia que sustituye a traductores y revisores, sino como un laboratorio de evaluación aplicada: su trabajo consiste en medir, comparar y explicar la calidad de distintas salidas lingüísticas para que los equipos humanos puedan tomar mejores decisiones. En esta unidad, la empresa recibe un encargo concreto: un cliente institucional quiere explorar un flujo mixto de traducción automática más revisión humana."},{"type":"p","text":"El cliente no pide una respuesta abstracta sobre si la traducción automática es «buena» o «mala». Necesita una decisión operativa:"},{"type":"ul","items":["Qué motor de traducción parece producir resultados más próximos a la referencia humana.","Qué tipos de errores se detectan con métricas automáticas.","Qué puntuaciones son útiles para priorizar la revisión.","Qué limitaciones tienen esas puntuaciones.","Qué casos siguen necesitando evaluación humana."]},{"type":"p","text":"Tu tarea consiste en construir un pequeño informe de evaluación. El equipo te proporciona un texto fuente, una traducción humana de referencia y una traducción automática. A partir de ahí, debes calcular varias métricas y, sobre todo, interpretarlas."},{"type":"p","text":"El valor profesional de este trabajo no está solo en obtener números. Está en saber leerlos. Una precisión de 0.75 no significa automáticamente «traducción excelente». Un BLEU de 0.40 no significa automáticamente «traducción inútil». Cada métrica mide una dimensión concreta y deja fuera otras."}]},{"id":"el-caso-de-trabajo","title":"El caso de trabajo","blocks":[{"type":"p","text":"El caso inicial es deliberadamente sencillo:"},{"type":"table","rows":[["Papel","Texto"],["Texto fuente","Those trees were big."],["Referencia humana","Esos árboles eran enormes."],["Traducción automática","Esos árboles eran grandes."]],"title":"El caso inicial es deliberadamente sencillo"},{"type":"p","text":"La traducción automática no es absurda. Grandes y enormes están relacionadas semánticamente, aunque no sean idénticas. Por eso este caso es perfecto para aprender evaluación automática: las métricas basadas en coincidencia formal detectarán una diferencia, pero una lingüista deberá interpretar si esa diferencia es grave, aceptable o dependiente del contexto."},{"type":"p","text":"La simulación se puede formular como una pregunta profesional:"},{"type":"p","text":"> Si una traducción automática se parece mucho a la referencia, pero cambia una palabra por otra próxima, ¿cómo reaccionan las métricas automáticas?"},{"type":"p","text":"Esta pregunta acompaña toda la unidad."}]}],"navTitle":"Contexto profesional"},{"id":"que-vas-a-aprender-en-esta-unidad","title":"Qué vas a aprender en esta unidad","blocks":[{"type":"p","text":"Al terminar este tema, deberías poder explicar y aplicar los siguientes conocimientos:"},{"type":"ol","items":["Qué es una traducción automática y por qué hay que evaluarla.","Qué diferencia hay entre texto fuente, hipótesis y referencia.","Por qué una traducción puede ser correcta aunque no coincida exactamente con una referencia.","Cómo limpiar textos antes de compararlos.","Cómo convertir una frase en una lista de palabras procesadas.","Cómo calcular precisión léxica con Python.","Cómo calcular recall léxico.","Cómo combinar precision y recall mediante F1-score.","Cómo comprobar Exact Match.","Cómo calcular índice Jaccard con conjuntos.","Cómo interpretar un conjunto de métricas léxicas.","Qué mide BLEU y por qué utiliza n-gramas.","Por qué BLEU puede bajar mucho en frases cortas.","Para qué sirve el suavizado o smoothing en BLEU.","Qué mide chrF y por qué compara caracteres.","Por qué chrF puede complementar a BLEU.","Qué mide METEOR y por qué su resultado depende de recursos lingüísticos.","Cómo usar bibliotecas como deep-translator, nltk y evaluate.","Cómo redactar una interpretación crítica de resultados automáticos."]}],"subsections":[],"navTitle":"Qué vas a aprender"},{"id":"mapa-conceptual-de-la-unidad","title":"Mapa conceptual de la unidad","blocks":[{"type":"table","rows":[["Concepto","En Python","En evaluación lingüística"],["Referencia","Variable con traducción humana","Punto de comparación"],["Hipótesis","Variable con traducción automática","Salida que queremos evaluar"],["Limpieza",".lower(), .strip(), eliminación de puntuación","Evita diferencias irrelevantes"],["Tokenización básica",".split()","Divide el texto en palabras"],["Precision","Coincidencias sobre total generado","Exactitud léxica de lo producido"],["Recall","Coincidencias sobre total de referencia","Cobertura respecto a lo esperado"],["F1-score","Fórmula con precision y recall","Equilibrio entre exactitud y cobertura"],["Exact Match","==","Coincidencia total palabra por palabra"],["Jaccard","Intersección sobre unión de conjuntos","Solapamiento léxico"],["BLEU","sentence_bleu()","Coincidencia de n-gramas"],["chrF","evaluate.load(\"chrf\")","Similitud formal por caracteres"],["METEOR","meteor_score()","Coincidencias flexibles y orden"],["Interpretación","Texto argumentado","Juicio lingüístico sobre las puntuaciones"]],"title":"Concepto · En Python · En evaluación lingüística"}],"subsections":[],"navTitle":"Mapa conceptual"},{"id":"1-marco-teorico","title":"1. Marco teórico","blocks":[],"subsections":[{"id":"1-1-por-que-necesitamos-metricas-automaticas","title":"1.1. Por qué necesitamos métricas automáticas","blocks":[{"type":"p","text":"En procesamiento del lenguaje natural y, de forma muy especial, en traducción automática, necesitamos valorar hasta qué punto la salida producida por un sistema se parece a una traducción humana de calidad. Cuando un motor traduce una frase, no basta con comprobar que haya generado una secuencia gramatical. También debemos preguntarnos si conserva el contenido del texto fuente, si respeta la estructura informativa, si utiliza un vocabulario adecuado, si mantiene la terminología esperada y si resulta natural en la lengua de llegada."},{"type":"p","text":"La evaluación ideal sería siempre una evaluación humana realizada por traductores, lingüistas o anotadores expertos. Una persona puede detectar matices que una fórmula no ve: ambigüedad, ironía, estilo, adecuación pragmática, errores de sentido o problemas terminológicos. Sin embargo, la evaluación humana tiene límites prácticos. Es costosa, requiere tiempo, puede variar según el criterio de cada evaluador y no siempre resulta viable cuando se comparan muchos sistemas o grandes volúmenes de traducciones."},{"type":"p","text":"Por esa razón se utilizan métricas automáticas: procedimientos que asignan una puntuación cuantitativa a una traducción de forma rápida, reproducible y relativamente barata. Estas métricas permiten comparar sistemas, detectar tendencias, analizar experimentos y decidir qué traducciones necesitan más revisión humana."},{"type":"p","text":"Ahora bien, una métrica automática no debe confundirse con una verdad absoluta. Una puntuación es un indicador, no una explicación completa de la calidad. La competencia lingüística sigue siendo necesaria para interpretar qué mide esa puntuación, qué deja fuera y en qué contexto puede utilizarse con sentido."}]},{"id":"1-2-texto-fuente-hipotesis-y-referencia","title":"1.2. Texto fuente, hipótesis y referencia","blocks":[{"type":"p","text":"En evaluación automática de traducción se suelen comparar tres elementos:"},{"type":"table","rows":[["Elemento","Definición","Ejemplo"],["Texto fuente","Texto original que se quería traducir","The child opened the window."],["Hipótesis o traducción candidata","Traducción generada por el sistema","El menor abrió la ventana."],["Referencia","Traducción humana considerada válida","El niño abrió la ventana."]],"title":"Elemento · Definición · Ejemplo"},{"type":"p","text":"Muchas métricas clásicas comparan únicamente la hipótesis con la referencia. Es decir, no evalúan directamente si la hipótesis expresa correctamente el texto fuente, sino si se parece a una traducción humana disponible. Esta idea es crucial, porque la traducción es una tarea abierta: una misma frase puede traducirse de varias formas aceptables."},{"type":"p","text":"Por ejemplo:"},{"type":"table","rows":[["Texto fuente","Referencia","Hipótesis"],["The child opened the window.","El niño abrió la ventana.","El menor abrió la ventana."]],"title":"Por ejemplo"},{"type":"p","text":"Desde el punto de vista lingüístico, la hipótesis puede ser adecuada en muchos contextos. Sin embargo, una métrica basada en coincidencias exactas de palabras penalizará la diferencia entre niño y menor. El ejemplo muestra uno de los problemas centrales de la evaluación automática: las métricas son útiles, pero no «entienden» la traducción del mismo modo que una persona."},{"type":"p","text":"Tener varias referencias humanas suele mejorar la evaluación, porque permite reconocer más de una traducción válida:"},{"type":"table","rows":[["Texto fuente","Referencia 1","Referencia 2"],["The trees are tall.","Los árboles son altos.","Los árboles tienen mucha altura."]],"title":"Texto fuente · Referencia 1 · Referencia 2"},{"type":"p","text":"Si solo existe la primera referencia, una hipótesis como Los árboles tienen mucha altura podría ser penalizada aunque sea correcta. Por eso la dependencia de una única referencia es una de las grandes limitaciones de muchas métricas clásicas."}]},{"id":"1-3-que-tipos-de-similitud-puede-observar-una-metrica","title":"1.3. Qué tipos de similitud puede observar una métrica","blocks":[{"type":"p","text":"No todas las métricas observan lo mismo. Algunas comparan palabras exactas; otras comparan secuencias; otras se fijan en caracteres; otras intentan aproximarse al significado mediante modelos neuronales."},{"type":"table","rows":[["Tipo de similitud","Qué observa","Ejemplo"],["Similitud superficial","Coincidencia de palabras o caracteres","altos = altos"],["Similitud estructural","Coincidencia de secuencias u orden","los árboles son"],["Similitud semántica","Coincidencia de significado","coche ≈ automóvil"],["Adecuación traductológica","Fidelidad al texto fuente","¿La traducción expresa lo mismo?"],["Fluidez","Naturalidad en la lengua meta","¿Suena bien en español?"]],"title":"Tipo de similitud · Qué observa · Ejemplo"},{"type":"p","text":"Las métricas clásicas suelen medir sobre todo similitud superficial y estructural. Las métricas neuronales intentan aproximarse mejor a la similitud semántica y, en algunos casos, a la adecuación respecto al texto fuente."},{"type":"p","text":"La conclusión inicial es sencilla: no existe una métrica que evalúe por sí sola todos los aspectos de una traducción. Por eso conviene combinar varias métricas e interpretarlas con prudencia."},{"type":"image","src":"img/fig_metricas.svg","alt":"Qué observa cada métrica: similitud superficial, estructural y semántica","caption":"Figura elaborada a partir de los apartados 1.3 y 1.11 y del mapa conceptual de la unidad."}]},{"id":"1-4-matrices-de-confusion-base-conceptual-de-precision-recal","title":"1.4. Matrices de confusión: base conceptual de precision, recall y F1","blocks":[{"type":"p","text":"Las matrices de confusión se usan sobre todo en tareas de clasificación, pero son muy útiles para entender tres conceptos que aparecerán continuamente en evaluación: precision, recall y F1-score."},{"type":"p","text":"En una tarea de clasificación, un sistema puede acertar o equivocarse de varias maneras:"},{"type":"table","rows":[["Caso","Significado"],["TP — True Positives","El sistema predice «positivo» y acierta"],["FP — False Positives","El sistema predice «positivo», pero se equivoca"],["FN — False Negatives","El sistema debería haber predicho «positivo», pero no lo hace"],["TN — True Negatives","El sistema predice correctamente «negativo»"]],"title":"Caso · Significado"},{"type":"docimg","src":"img/doc_01.jpg","alt":"Figura del manual","w":469},{"type":"p","text":"A partir de estos valores se calculan medidas como:"},{"type":"docimg","src":"img/doc_02.png","alt":"Figura del manual","w":185},{"type":"p","text":"La precision responde a la pregunta: de todo lo que el sistema ha marcado como positivo, ¿cuánto era realmente correcto?"},{"type":"p","text":"El recall responde a otra pregunta: de todo lo que debería haber encontrado, ¿cuánto ha encontrado realmente?"},{"type":"p","text":"El F1-score combina precision y recall mediante una media armónica. Se utiliza cuando queremos una sola medida que tenga en cuenta tanto los aciertos producidos como los elementos que faltan."},{"type":"p","text":"En traducción automática no hablamos de verdaderos positivos y falsos positivos exactamente igual que en clasificación. Sin embargo, podemos trasladar la intuición: una traducción puede producir palabras correctas, omitir palabras importantes o añadir palabras innecesarias."}]},{"id":"1-5-metricas-lexicas-basadas-en-palabras","title":"1.5. Métricas léxicas basadas en palabras","blocks":[{"type":"p","text":"Las métricas léxicas comparan la traducción candidata con la referencia a partir de las palabras que aparecen en cada una. Son fáciles de interpretar, pero tienen una limitación importante: normalmente no comprenden el significado. Cuentan coincidencias."},{"type":"h4","text":"1.5.1. Precisión léxica"},{"type":"p","text":"La precisión léxica mide qué proporción de las palabras producidas por el sistema aparecen también en la referencia."},{"type":"docimg","src":"img/doc_03.png","alt":"Figura del manual","w":283},{"type":"p","text":"Ejemplo:"},{"type":"table","rows":[["Referencia","Hipótesis"],["los árboles son altos","los árboles son grandes"]],"title":"Ejemplo"},{"type":"p","text":"Coinciden los, árboles y son. La hipótesis tiene cuatro palabras. Por tanto:"},{"type":"docimg","src":"img/doc_04.png","alt":"Figura del manual","w":131},{"type":"p","text":"La precisión indica que el 75 % de las palabras producidas por el sistema coincide con la referencia. Pero no nos dice si la palabra diferente cambia mucho o poco el significado. En este caso, grandes se parece parcialmente a altos, pero no son equivalentes en todos los contextos."},{"type":"p","text":"La precisión puede ser engañosa cuando la hipótesis es demasiado corta:"},{"type":"table","rows":[["Referencia","Hipótesis"],["los árboles son altos","los árboles"]],"title":"Referencia · Hipótesis"},{"type":"p","text":"Todas las palabras de la hipótesis aparecen en la referencia, pero la traducción está incompleta. Por eso necesitamos también recall."},{"type":"h4","text":"1.5.2. Recall léxico"},{"type":"p","text":"El recall léxico mide qué proporción de las palabras de la referencia han sido recuperadas por la hipótesis."},{"type":"docimg","src":"img/doc_05.png","alt":"Figura del manual","w":203},{"type":"p","text":"Si la referencia es los árboles son altos y la hipótesis es los árboles, el recall es:"},{"type":"docimg","src":"img/doc_06.png","alt":"Figura del manual","w":109},{"type":"p","text":"El recall muestra que la hipótesis solo cubre la mitad de la referencia. Esta métrica ayuda a detectar omisiones: si el sistema deja sin traducir información importante, el recall baja."},{"type":"p","text":"La diferencia entre precision y recall puede explicarse así:"},{"type":"table","rows":[["Situación","Precision","Recall"],["Traducción muy breve con palabras correctas","Puede ser alta","Suele ser bajo"],["Traducción larga con información añadida","Puede bajar","Puede ser alto"],["Traducción equilibrada","Refleja exactitud de lo producido","Refleja cobertura de lo esperado"]],"title":"La diferencia entre precision y recall puede explicarse así"},{"type":"p","text":"Es decir:"},{"type":"table","rows":[["Métrica","Pregunta principal"],["Precision","De lo que ha dicho el sistema, ¿cuánto coincide con la referencia?"],["Recall","De lo que decía la referencia, ¿cuánto ha recuperado el sistema?"]],"title":"Es decir"},{"type":"h4","text":"1.5.3. F1-score léxico"},{"type":"p","text":"El F1-score combina precision y recall en una sola puntuación:"},{"type":"docimg","src":"img/doc_07.png","alt":"Figura del manual","w":165},{"type":"p","text":"La media armónica penaliza los desequilibrios. Si una traducción tiene una precisión muy alta pero un recall muy bajo, el F1 no será alto. Por eso resulta útil cuando queremos una medida equilibrada."},{"type":"p","text":"Si precision y recall valen 0.75, entonces:"},{"type":"docimg","src":"img/doc_08.png","alt":"Figura del manual","w":132},{"type":"p","text":"El F1 léxico es más informativo que precision o recall por separado, pero sigue dependiendo de coincidencias de palabras. No entiende sinonimia, paráfrasis, estilo ni adecuación contextual."},{"type":"h4","text":"1.5.4. Exact Match"},{"type":"p","text":"Exact Match comprueba si la hipótesis coincide exactamente con la referencia. Es una métrica booleana:"},{"type":"docimg","src":"img/doc_09.png","alt":"Figura del manual","w":353},{"type":"table","rows":[["Referencia","Hipótesis","Exact Match"],["los árboles son altos","los árboles son altos","1"],["los árboles son altos","los árboles son muy altos","0"],["los árboles son altos","los árboles tienen gran altura","0"]],"title":"Referencia · Hipótesis · Exact Match"},{"type":"p","text":"Exact Match es muy fácil de entender, pero demasiado estricta para traducción automática. En tareas abiertas, una respuesta puede ser válida aunque no coincida palabra por palabra con la referencia. Por eso Exact Match solo suele ser adecuada en tareas cerradas, donde se espera una respuesta exacta, breve y normalizada."},{"type":"h4","text":"1.5.5. Índice Jaccard"},{"type":"p","text":"El índice Jaccard mide la similitud entre dos conjuntos. Si consideramos el conjunto de palabras de la referencia y el conjunto de palabras de la hipótesis, Jaccard se calcula así:"},{"type":"docimg","src":"img/doc_10.png","alt":"Figura del manual","w":117},{"type":"p","text":"Donde:"},{"type":"ul","items":["A es el conjunto de palabras de la referencia.","B es el conjunto de palabras de la hipótesis.","A ∩ B es la intersección: las palabras compartidas.","A ∪ B es la unión: todas las palabras distintas que aparecen en uno u otro texto."]},{"type":"p","text":"Ejemplo:"},{"type":"table","rows":[["Referencia","Hipótesis"],["los árboles son altos","los árboles son grandes"]],"title":"Ejemplo"},{"type":"code","code":"Referencia = {los, árboles, son, altos}\nHipótesis = {los, árboles, son, grandes}\nIntersección = {los, árboles, son} -> 3\nUnión = {los, árboles, son, altos, grandes} -> 5\n\n            3\nJaccard = ----- = 0.60\n            5"},{"type":"p","text":"Jaccard es intuitivo porque mide solapamiento léxico. Sin embargo, ignora el orden y las repeticiones. Por tanto, no distingue bien entre una frase gramaticalmente correcta y una secuencia desordenada que contenga las mismas palabras."}]},{"id":"1-6-de-palabras-aisladas-a-secuencias-n-gramas","title":"1.6. De palabras aisladas a secuencias: n-gramas","blocks":[{"type":"p","text":"Para evaluar traducción automática no basta con saber si aparecen las mismas palabras. También importa el orden. La frase el perro muerde al hombre no significa lo mismo que el hombre muerde al perro, aunque contenga casi las mismas palabras."},{"type":"p","text":"Un n-grama es una secuencia de n elementos consecutivos. En evaluación de traducción, esos elementos suelen ser palabras, aunque también pueden ser caracteres."},{"type":"p","text":"Con la frase el gato duerme, obtenemos:"},{"type":"table","rows":[["Tipo","N-gramas"],["Unigramas","el / gato / duerme"],["Bigramas","el gato / gato duerme"],["Trigrama","el gato duerme"]],"title":"Con la frase el gato duerme, obtenemos"},{"type":"p","text":"Cuanto mayor es el valor de n, más información sobre el orden se incorpora. Los unigramas miran palabras individuales. Los bigramas observan pares consecutivos. Los trigramas y 4-gramas captan fragmentos más largos de estructura."},{"type":"p","text":"Los n-gramas se utilizan en muchas áreas del PLN: modelado de lenguaje, análisis estadístico, detección de patrones, corrección ortográfica, clasificación textual y evaluación automática. En traducción automática son especialmente importantes porque permiten medir no solo qué palabras aparecen, sino también si aparecen en una secuencia similar a la referencia."}]},{"id":"1-7-bleu-la-metrica-clasica-basada-en-n-gramas","title":"1.7. BLEU: la métrica clásica basada en n-gramas","blocks":[{"type":"p","text":"BLEU, sigla de Bilingual Evaluation Understudy, es una de las métricas más influyentes en la historia de la traducción automática. Fue propuesta por {{cite:papineni2002}}Papineni et al. (2002){{/cite}} como una forma automática, rápida y económica de evaluar sistemas de traducción mediante la comparación entre traducciones generadas y traducciones humanas de referencia."},{"type":"p","text":"BLEU se basa en una idea sencilla: una buena traducción automática debería compartir muchos n-gramas con una o varias traducciones humanas de referencia. Por eso BLEU calcula coincidencias de n-gramas, normalmente desde unigramas hasta 4-gramas."},{"type":"p","text":"Sin embargo, BLEU no cuenta simplemente todas las coincidencias. Utiliza una forma de precisión modificada, que evita que un sistema obtenga una puntuación artificialmente alta repitiendo muchas veces una palabra que aparece en la referencia."},{"type":"p","text":"Ejemplo:"},{"type":"table","rows":[["Referencia","Hipótesis mala"],["el gato duerme en casa","el el el el el"]],"title":"Ejemplo"},{"type":"p","text":"Si contáramos coincidencias de forma ingenua, la palabra el aparecería muchas veces en la hipótesis y podría producir una puntuación engañosa. BLEU limita las coincidencias según la frecuencia máxima observada en las referencias."},{"type":"p","text":"BLEU incorpora además una penalización por brevedad. Esta penalización evita que una traducción demasiado corta obtenga una puntuación alta solo porque las pocas palabras que contiene coinciden con la referencia."},{"type":"table","rows":[["Referencia","Hipótesis"],["los árboles son altos y frondosos","los árboles"]],"title":"Referencia · Hipótesis"},{"type":"p","text":"La hipótesis contiene palabras correctas, pero omite información. Sin penalización por brevedad, podría recibir una precisión relativamente alta. BLEU reduce la puntuación cuando la hipótesis es mucho más corta que la referencia."},{"type":"p","text":"Un ejemplo conceptual:"},{"type":"table","rows":[["Tipo de n-grama","Referencia: esos árboles eran enormes","Hipótesis: esos árboles eran grandes","Coincidencias"],["Unigramas","esos, árboles, eran, enormes","esos, árboles, eran, grandes","3 de 4"],["Bigramas","esos árboles, árboles eran, eran enormes","esos árboles, árboles eran, eran grandes","2 de 3"],["Trigramas","esos árboles eran, árboles eran enormes","esos árboles eran, árboles eran grandes","1 de 2"],["4-gramas","esos árboles eran enormes","esos árboles eran grandes","0 de 1"]],"title":"Un ejemplo conceptual"},{"type":"p","text":"Este ejemplo muestra un aspecto fundamental de BLEU: un solo cambio léxico puede afectar a varios n-gramas. La sustitución de enormes por grandes afecta al unigrama, al bigrama, al trigrama y al 4-grama que contienen esa posición."},{"type":"p","text":"BLEU tiene ventajas claras:"},{"type":"table","rows":[["Ventaja","Explicación"],["Es rápida","Puede calcularse automáticamente sobre grandes corpus"],["Es reproducible","Permite comparar sistemas bajo las mismas condiciones"],["Es sensible al orden","Los n-gramas captan parte de la secuencia de palabras"],["Ha sido muy utilizada","Durante años fue una referencia estándar en traducción automática"]],"title":"BLEU tiene ventajas claras"},{"type":"p","text":"Pero también presenta limitaciones importantes:"},{"type":"table","rows":[["Limitación","Explicación"],["No entiende el significado","Solo compara coincidencias superficiales de n-gramas"],["Penaliza sinónimos y paráfrasis","Traducciones correctas pueden recibir puntuaciones bajas"],["Es poco fiable a nivel de frase","Funciona mejor como medida agregada sobre corpus"],["Depende de la referencia","Si solo hay una referencia, muchas traducciones válidas quedan penalizadas"],["Puede ocultar errores graves","Una traducción puede compartir n-gramas y aun así alterar el sentido"]],"title":"Pero también presenta limitaciones importantes"},{"type":"p","text":"BLEU debe entenderse como una herramienta útil para comparar sistemas en condiciones controladas, no como una medida absoluta de «buena traducción»."},{"type":"p","text":"La investigación posterior ha mostrado que la relación entre métricas automáticas y evaluación humana puede ser sensible a los datos, al dominio, al tipo de sistema evaluado y a la presencia de valores atípicos. {{cite:mathur2020}}Mathur et al. (2020){{/cite}}, por ejemplo, subrayan que la comparación entre métricas automáticas y juicios humanos no debe reducirse a una conclusión simple del tipo «esta métrica siempre es mejor». Para un uso responsable, BLEU debe interpretarse como una señal cuantitativa agregada y no como un veredicto completo sobre cada frase individual."}]},{"id":"1-8-chrf-y-chrf","title":"1.8. chrF y chrF++","blocks":[{"type":"p","text":"chrF es una métrica propuesta por {{cite:popovic2015}}Popović (2015){{/cite}} que evalúa traducciones mediante n-gramas de caracteres en lugar de n-gramas de palabras. Esta diferencia es importante porque permite detectar similitudes parciales entre palabras."},{"type":"p","text":"Mientras BLEU compara palabras o secuencias de palabras completas, chrF compara fragmentos de caracteres. Por ejemplo, entre traducir, traducción y traducido hay diferencias léxicas, pero también una raíz formal compartida. Una métrica basada en caracteres puede captar parte de esa relación."},{"type":"p","text":"Ejemplo:"},{"type":"table","rows":[["Referencia","Hipótesis"],["internacionalización","internacionalizacion"]],"title":"Ejemplo"},{"type":"p","text":"Aunque falta la tilde, las dos formas comparten casi todos sus caracteres. Una métrica basada en palabras podría tratarlas como tokens distintos. chrF, en cambio, reconocería una alta similitud formal."},{"type":"p","text":"chrF resulta especialmente interesante para lenguas con variación morfológica, porque las palabras pueden cambiar por género, número, caso, persona, tiempo verbal o derivación."},{"type":"table","rows":[["Referencia","Hipótesis"],["los investigadores analizaron los resultados","las investigadoras analizaron el resultado"]],"title":"Referencia · Hipótesis"},{"type":"p","text":"Hay diferencias de género y número, pero también mucho solapamiento formal entre investigadores e investigadoras, y entre resultados y resultado. chrF puede captar parte de esa proximidad formal, aunque no determine por sí sola si la traducción es correcta."},{"type":"p","text":"Sus ventajas principales son:"},{"type":"table","rows":[["Ventaja","Explicación"],["Capta similitud
