es parciales","No exige que las palabras coincidan exactamente"],["Es menos dependiente de la tokenización","Trabaja con caracteres"],["Puede funcionar bien en lenguas morfológicamente complejas","Reconoce parentescos formales entre variantes"],["Es fácil de aplicar","No requiere entrenamiento de modelos neuronales"]],"title":"Sus ventajas principales son"},{"type":"p","text":"También tiene límites:"},{"type":"table","rows":[["Limitación","Explicación"],["Sigue siendo superficial","No comprende realmente el significado"],["Puede premiar palabras formalmente parecidas pero semánticamente distintas","La forma parecida no garantiza equivalencia"],["No evalúa adecuación respecto al texto fuente","Como muchas métricas con referencia, compara sobre todo hipótesis y referencia"]],"title":"También tiene límites"},{"type":"p","text":"chrF++ incorpora también n-gramas de palabras. Es decir, no solo mira fragmentos de caracteres, sino también secuencias léxicas. Puede resultar útil cuando queremos añadir algo de sensibilidad al orden de palabras, pero para una introducción es menos transparente porque mezcla dos niveles: caracteres y palabras."}]},{"id":"1-9-meteor-coincidencias-flexibles-y-penalizacion-por-desord","title":"1.9. METEOR: coincidencias flexibles y penalización por desorden","blocks":[{"type":"p","text":"METEOR, sigla de Metric for Evaluation of Translation with Explicit ORdering, fue propuesta por {{cite:banerjee2005}}Banerjee y Lavie (2005){{/cite}}. Su objetivo era mejorar la correlación con juicios humanos respecto a métricas basadas exclusivamente en precisión de n-gramas."},{"type":"p","text":"La idea principal de METEOR es comparar hipótesis y referencia mediante correspondencias más flexibles que la coincidencia exacta. En su formulación clásica, METEOR puede considerar:"},{"type":"ul","items":["coincidencias exactas;","coincidencias por raíz o stemming;","coincidencias mediante sinónimos;","penalizaciones cuando las palabras coincidentes aparecen en un orden muy fragmentado."]},{"type":"p","text":"Esto la acerca más a la forma en que una persona podría comparar dos frases. No solo pregunta «¿son iguales las palabras?», sino también «¿hay palabras relacionadas?» y «¿aparecen en un orden razonable?»."},{"type":"p","text":"METEOR se inspira en precision y recall, pero no los utiliza de forma tan simple como las métricas léxicas básicas. Da especial importancia al recall, porque en traducción es fundamental que no se pierda información relevante."},{"type":"p","text":"El cálculo de METEOR puede entenderse en tres pasos:"},{"type":"ul","items":["Alineación. Se emparejan las palabras de la hipótesis con las de la referencia: primero las idénticas, después las que comparten raíz y, por último, los sinónimos. Cada palabra solo puede emparejarse una vez.","Media ponderada de precision y recall. Con las palabras emparejadas se calculan precision y recall y se combinan dando más peso al recall.","Penalización por fragmentación. Se comprueba si las palabras emparejadas aparecen agrupadas y en el mismo orden que en la referencia, o dispersas."]},{"type":"p","text":"La media ponderada se denomina Fmean:"},{"type":"docimg","src":"img/doc_11.png","alt":"Figura del manual","w":246},{"type":"p","text":"El parámetro α controla el equilibrio entre precision y recall. En la formulación original y en NLTK, α = 0.9, de modo que el recall pesa nueve veces más que la precision. Por eso la fórmula clásica se escribe a veces como 10·P·R / (R + 9·P)."},{"type":"p","text":"Para medir el desorden, METEOR cuenta fragmentos (chunks): grupos de palabras emparejadas que aparecen contiguas y en el mismo orden en la hipótesis y en la referencia. Si todas las coincidencias forman un solo bloque, hay un fragmento; si están completamente dispersas, hay tantos fragmentos como coincidencias."},{"type":"docimg","src":"img/doc_12.png","alt":"Figura del manual","w":226},{"type":"p","text":"Con los valores habituales, γ = 0.5 y β = 3, la penalización nunca supera 0.5. La puntuación final combina ambos elementos y se expresa en escala 0–1:"},{"type":"docimg","src":"img/doc_13.png","alt":"Figura del manual","w":239},{"type":"p","text":"Veamos el cálculo con el ejemplo de recall del apartado 1.5.2:"},{"type":"table","rows":[["Referencia","Hipótesis"],["los árboles son altos","los árboles"]],"title":"Veamos el cálculo con el ejemplo de recall del apartado 1.5.2"},{"type":"p","text":"Hay dos coincidencias (los y árboles), que forman un único fragmento:"},{"type":"docimg","src":"img/doc_14.png","alt":"Figura del manual","w":254},{"type":"p","text":"El F1 léxico de esta misma pareja sería 0.67. METEOR baja hasta 0.49 porque da mucho más peso al recall: la hipótesis es correcta en lo que dice, pero omite la mitad de la referencia."},{"type":"p","text":"Ejemplo de coincidencia por sinónimos:"},{"type":"table","rows":[["Referencia","Hipótesis"],["the doctor examined the patient","the physician examined the patient"]],"title":"Ejemplo de coincidencia por sinónimos"},{"type":"p","text":"Una métrica estrictamente léxica penalizaría doctor frente a physician. METEOR puede reconocer esa relación si dispone del recurso léxico adecuado, como WordNet para inglés."},{"type":"p","text":"Con la implementación de NLTK, que usa WordNet, la hipótesis con physician obtiene 0.996, exactamente lo mismo que una hipótesis idéntica a la referencia: el emparejamiento por sinónimo cuenta como coincidencia completa."},{"type":"p","text":"Además, METEOR penaliza el desorden:"},{"type":"table","rows":[["Referencia","Hipótesis A","Hipótesis B"],["the child opened the window","the child opened the window","window the opened child the"]],"title":"Además, METEOR penaliza el desorden"},{"type":"p","text":"Las dos hipótesis pueden compartir palabras con la referencia, pero solo la primera respeta el orden sintáctico. Desde un punto de vista lingüístico, esta penalización es relevante porque el orden de palabras afecta a la gramaticalidad, a la interpretación semántica y a la estructura informativa."},{"type":"p","text":"En números, la hipótesis A obtiene 0.996: sus cinco coincidencias forman un único fragmento y la penalización es mínima, 0.5 × (1/5)³ = 0.004. La hipótesis B tiene las mismas cinco coincidencias, pero ninguna aparece contigua y en el orden de la referencia: cinco fragmentos, penalización 0.5 × (5/5)³ = 0.5 y METEOR = 0.50."},{"type":"p","text":"Este ejemplo también muestra que METEOR casi nunca llega exactamente a 1: incluso una hipótesis idéntica a la referencia recibe una pequeña penalización, porque siempre hay al menos un fragmento."},{"type":"p","text":"Una cuestión importante es que muchas implementaciones de METEOR han estado especialmente desarrolladas para inglés, entre otras razones por la disponibilidad de recursos como WordNet. Esto no significa que la idea no sea aplicable a otras lenguas, sino que su rendimiento depende de los recursos lingüísticos disponibles."},{"type":"p","text":"En la práctica, la configuración por defecto de NLTK usa el stemmer de Porter, diseñado para inglés, y el WordNet inglés para los sinónimos. En textos en español, METEOR se apoya casi solo en coincidencias exactas y en la penalización por orden. En el apartado 2.11 se verá cómo sustituir el stemmer por uno para español."},{"type":"p","text":"Para estudiantes con perfil lingüístico, esta observación es especialmente útil. Una métrica no es solo una fórmula matemática; también depende de decisiones lingüísticas previas, como la lematización, el stemming, la sinonimia o la disponibilidad de bases léxicas. Por eso dos implementaciones de una misma métrica pueden comportarse de forma distinta en función de la lengua, del dominio y de los recursos que utilicen."},{"type":"p","text":"Las ventajas principales de METEOR pueden resumirse así:"},{"type":"table","rows":[["Ventaja","Explicación"],["Es más flexible que una coincidencia exacta","Puede reconocer raíces o sinónimos si dispone de recursos adecuados"],["Combina precision y recall","No mira solo lo que produce la hipótesis, sino también lo que recupera de la referencia"],["Penaliza el desorden","Tiene en cuenta si las coincidencias aparecen fragmentadas o en un orden poco natural"],["Se aproxima mejor a ciertos juicios humanos","Su diseño intenta reflejar mejor diferencias lingüísticas relevantes"]],"title":"Las ventajas principales de METEOR pueden resumirse así"},{"type":"p","text":"Sus limitaciones también son importantes:"},{"type":"table","rows":[["Limitación","Explicación"],["Depende de recursos lingüísticos","Funciona mejor cuando hay analizadores, listas de raíces o bases de sinónimos disponibles"],["Puede estar sesgada hacia determinadas lenguas","Muchas versiones se desarrollaron especialmente para inglés"],["Sigue sin comprender plenamente el significado","Reconoce correspondencias más flexibles, pero no interpreta como una persona"],["Es menos inmediata que BLEU o Jaccard","Requiere más explicación y más decisiones de configuración"]],"title":"Sus limitaciones también son importantes"}]},{"id":"1-10-comparacion-general-de-metricas-clasicas","title":"1.10. Comparación general de métricas clásicas","blocks":[{"type":"p","text":"Las métricas clásicas pueden organizarse en varios grupos:"},{"type":"table","rows":[["Grupo","Métricas","Qué comparan principalmente"],["Métricas léxicas simples","Precision, recall, F1, Exact Match, Jaccard","Palabras individuales o conjuntos de palabras"],["Métricas basadas en n-gramas","BLEU","Secuencias de palabras"],["Métricas basadas en caracteres o correspondencias flexibles","chrF, METEOR","Caracteres, raíces, sinónimos y orden"]],"title":"Las métricas clásicas pueden organizarse en varios grupos"},{"type":"p","text":"Cada grupo responde a una pregunta diferente:"},{"type":"table","rows":[["Pregunta","Métrica adecuada"],["¿Cuántas palabras coinciden?","Precision, recall, F1"],["¿La traducción es exactamente igual a la referencia?","Exact Match"],["¿Cuánto solapamiento léxico hay?","Jaccard"],["¿Coinciden secuencias de palabras?","BLEU"],["¿Hay similitud formal entre palabras?","chrF"],["¿Hay coincidencias exactas, morfológicas o semánticas básicas?","METEOR"]],"title":"Cada grupo responde a una pregunta diferente"},{"type":"p","text":"La conclusión principal es que ninguna métrica clásica evalúa por sí sola todos los aspectos de una traducción. En investigación y desarrollo se recomienda interpretar varias métricas conjuntamente y, cuando sea posible, complementarlas con evaluación humana."}]},{"id":"1-11-metricas-semanticas-o-neuronales","title":"1.11. Métricas semánticas o neuronales","blocks":[{"type":"p","text":"Las métricas clásicas fueron diseñadas en una época en la que la evaluación automática dependía principalmente de coincidencias superficiales. La traducción automática neuronal ha cambiado el escenario: los sistemas actuales pueden producir paráfrasis más fluidas, reformular estructuras y alejarse de la referencia sin necesariamente ser incorrectos."},{"type":"p","text":"Ejemplo:"},{"type":"table","rows":[["Referencia","Hipótesis A","Hipótesis B","Hipótesis C"],["El comité rechazó la propuesta.","El comité no aceptó la propuesta.","La propuesta fue rechazada por el comité.","El comité aprobó la propuesta."]],"title":"Ejemplo"},{"type":"p","text":"Una métrica basada en n-gramas puede penalizar la hipótesis B porque cambia la estructura sintáctica, aunque sea semánticamente equivalente. En cambio, la hipótesis C comparte varias palabras con la referencia, pero cambia el sentido principal: rechazó frente a aprobó."},{"type":"p","text":"Este tipo de ejemplos motivó el desarrollo de métricas que no se limitaran a contar palabras, sino que utilizaran representaciones semánticas aprendidas por modelos neuronales. BERTScore, BLEURT y COMET pertenecen a esta familia."},{"type":"p","text":"Una métrica semántica o neuronal utiliza modelos de lenguaje entrenados con grandes cantidades de texto para representar palabras, frases o documentos como vectores. Estos vectores se conocen como embeddings o representaciones distribucionales. La idea básica es que si dos palabras o frases tienen significados parecidos, sus representaciones vectoriales deberían estar relativamente próximas en el espacio semántico aprendido por el modelo."},{"type":"p","text":"No obstante, conviene presentar estas métricas con prudencia. Que una métrica utilice un modelo neuronal no significa que «entienda» el texto como una persona. Sus puntuaciones dependen del modelo utilizado, de los datos de entrenamiento, de las lenguas disponibles, de la tarea y de la forma en que se haya ajustado la métrica a juicios humanos."},{"type":"h4","text":"1.11.1. BERTScore"},{"type":"p","text":"BERTScore, propuesta por {{cite:zhang2020}}Zhang et al. (2020){{/cite}}, evalúa generación textual utilizando representaciones contextuales de modelos tipo BERT. En lugar de comprobar si dos palabras son exactamente iguales, compara la similitud entre los embeddings contextuales de los tokens de la hipótesis y los tokens de la referencia."},{"type":"p","text":"La palabra contextual es fundamental. En modelos como BERT, una palabra no tiene siempre la misma representación: su vector cambia según el contexto. Banco no se representa igual en me senté en el banco que en fui al banco a sacar dinero."},{"type":"p","text":"BERTScore puede explicarse en tres pasos:"},{"type":"ol","items":["Codifica la hipótesis y la referencia con un modelo de lenguaje preentrenado.","Compara cada token de la hipótesis con los tokens de la referencia mediante similitud vectorial.","Calcula puntuaciones análogas a precision, recall y F1, pero basadas en similitud semántica."]},{"type":"p","text":"Ejemplo:"},{"type":"table","rows":[["Referencia","Hipótesis"],["El médico examinó al paciente.","El doctor revisó al paciente."]],"title":"Ejemplo"},{"type":"p","text":"Una métrica léxica solo reconocerá coincidencias como el, al y paciente. BERTScore puede asignar similitud alta entre médico y doctor, y cierta similitud entre examinó y revisó."},{"type":"p","text":"Ventajas:"},{"type":"table","rows":[["Ventaja","Explicación"],["Reconoce similitud semántica","Puede valorar palabras distintas pero relacionadas"],["Usa contexto","La representación de cada palabra depende de la frase"],["Mantiene la intuición de precision, recall y F1","Conecta con métricas ya vistas"],["Es aplicable a varias tareas de generación textual","No se limita a traducción automática"]],"title":"Ventajas"},{"type":"p","text":"Limitaciones:"},{"type":"table","rows":[["Limitación","Explicación"],["Depende del modelo preentrenado","La calidad varía según lengua y modelo"],["No siempre detecta errores críticos","Puede asignar similitud alta a frases parecidas pero opuestas"],["No evalúa necesariamente fidelidad al texto fuente","En su forma habitual compara hipótesis y referencia"],["Es menos transparente que BLEU","La puntuación depende de representaciones internas"]],"title":"Limitaciones"},{"type":"p","text":"BERTScore puede presentarse como una métrica que sustituye la pregunta «¿coinciden las palabras?» por otra más flexible: «¿se parecen las palabras en contexto?». Esa transición es importante para entender por qué las métricas modernas se alejan de la coincidencia literal y se acercan a representaciones semánticas. Aun así, BERTScore no debe interpretarse como una lectura humana del texto, sino como una comparación entre representaciones aprendidas por un modelo."},{"type":"h4","text":"1.11.2. BLEURT"},{"type":"p","text":"BLEURT, propuesta por {{cite:sellam2020}}Sellam et al. (2020){{/cite}}, es una métrica aprendida basada en BERT. A diferencia de BERTScore, que se basa principalmente en similitudes entre embeddings, BLEURT se entrena explícitamente para predecir juicios humanos de calidad."},{"type":"p","text":"Esta diferencia es importante: BLEURT no solo utiliza un modelo neuronal para representar frases, sino que aprende a asignar una puntuación que se parezca a la que darían evaluadores humanos."},{"type":"p","text":"Puede explicarse así:"},{"type":"ol","items":["Se parte de un modelo de lenguaje preentrenado, como BERT.","Se adapta el modelo a la tarea de evaluación.","El sistema aprende patrones que suelen corresponderse con buenas o malas salidas.","Ante una nueva hipótesis, produce una puntuación que intenta aproximar el juicio humano."]},{"type":"p","text":"Ejemplo:"},{"type":"table","rows":[["Referencia","Hipótesis A","Hipótesis B"],["La empresa anunció una reducción de costes.","La compañía comunicó una reducción de gastos.","La empresa anunció un aumento de costes."]],"title":"Ejemplo"},{"type":"p","text":"La hipótesis A cambia palabras, pero mantiene un significado parecido. La hipótesis B comparte más vocabulario superficial con la referencia, pero altera el sentido mediante aumento frente a reducción. BLEURT está diseñada para ser más sensible a este tipo de diferencias semánticas que una métrica puramente léxica."},{"type":"p","text":"Las ventajas de BLEURT son:"},{"type":"table","rows":[["Ventaja","Explicación"],["Aprende de juicios humanos","Intenta aproximar cómo valorarían las personas la calidad textual"],["Capta relaciones semánticas complejas","No depende solo de coincidencias de palabras"],["Puede ser robusta ante paráfrasis","Penaliza menos algunas reformulaciones válidas"],["Es útil en generación textual","Puede aplicarse a evaluación más allá de la traducción automática"]],"title":"Las ventajas de BLEURT son"},{"type":"p","text":"Sus limitaciones son:"},{"type":"table","rows":[["Limitación","Explicación"],["Es una métrica aprendida","Su comportamiento depende de los datos de entrenamiento"],["Puede heredar sesgos de los datos","Si los datos son limitados o sesgados, la métrica puede reflejarlo"],["Es menos interpretable","No siempre es fácil explicar por qué asigna una puntuación concreta"],["Puede variar entre dominios y lenguas","Una métrica entrenada en ciertos datos no siempre generaliza igual de bien"]],"title":"Sus limitaciones son"},{"type":"p","text":"BLEURT es especialmente útil para explicar que una métrica automática puede ser también un modelo supervisado: no solo aplica una fórmula, sino que aprende a evaluar a partir de ejemplos."},{"type":"h4","text":"1.11.3. COMET"},{"type":"p","text":"COMET, sigla de Crosslingual Optimized Metric for Evaluation of Translation, es una métrica neuronal diseñada específicamente para evaluación de traducción automática. Fue presentada por {{cite:rei2020}}Rei et al. (2020){{/cite}} como un marco neuronal multilingüe que puede explotar información del texto fuente, de la hipótesis y de la referencia."},{"type":"p","text":"Esta es una diferencia clave respecto a muchas métricas anteriores. BLEU, chrF, METEOR, BERTScore y BLEURT suelen centrarse principalmente en la comparación entre hipótesis y referencia. COMET puede incorporar también el texto fuente, lo que resulta muy relevante en traducción automática."},{"type":"p","text":"Ejemplo:"},{"type":"table","rows":[["Texto fuente","Referencia","Hipótesis"],["The patient did not receive the treatment.","El paciente no recibió el tratamiento.","El paciente recibió el tratamiento."]],"title":"Ejemplo"},{"type":"p","text":"La hipótesis se parece mucho a la referencia: solo falta no. Sin embargo, el error es grave porque invierte el significado. Una métrica que observe el texto fuente puede estar mejor situada para detectar problemas de adecuación."},{"type":"p","text":"COMET puede entenderse así:"},{"type":"ol","items":["Codifica el texto fuente, la hipótesis y la referencia mediante un modelo multilingüe.","Combina esas representaciones.","Predice una puntuación de calidad entrenada para correlacionar con juicios humanos."]},{"type":"p","text":"Su interés didáctico reside en que muestra una evolución clara: de comparar palabras, pasamos a comparar significados; y de comparar solo hipótesis y referencia, pasamos a incorporar también el texto fuente."},{"type":"p","text":"Las ventajas de COMET son:"},{"type":"table","rows":[["Ventaja","Explicación"],["Está diseñada para traducción automática","No es solo una métrica general de generación textual"],["Puede usar el texto fuente","Ayuda a valorar la adecuación de la traducción"],["Se entrena con juicios humanos","Busca correlacionar con evaluaciones humanas de calidad"],["Es multilingüe","Aprovecha modelos preentrenados multilingües o interlingües"]],"title":"Las ventajas de COMET son"},{"type":"p","text":"Sus limitaciones son:"},{"type":"table","rows":[["Limitación","Explicación"],["Requiere modelos complejos","Es más costosa computacionalmente que BLEU o chrF"],["Es menos transparente","Su puntuación no se explica mediante simples coincidencias de n-gramas"],["Depende de los datos de entrenamiento","Puede funcionar mejor en lenguas y dominios representados en sus datos"],["No sustituye a la evaluación humana","Puede fallar ante fenómenos pragmáticos, terminológicos o discursivos específicos"]],"title":"Sus limitaciones son"},{"type":"p","text":"Una forma sencilla de compararlas es formular la pregunta que parece hacerse cada métrica:"},{"type":"table","rows":[["Métrica","Pregunta intuitiva","Nivel recomendado en esta asignatura"],["BERTScore","«¿Se parecen semánticamente las palabras de la hipótesis y la referencia en su contexto?»","Comprensión teórica"],["BLEURT","«Según lo aprendido de evaluaciones humanas, ¿qué calidad parece tener esta salida?»","Comprensión teórica"],["COMET","«Teniendo en cuenta el texto fuente, la hipótesis y la referencia, ¿qué calidad traductológica tiene la traducción?»","Comprensión teórica"]],"title":"Métrica · Pregunta intuitiva · Nivel recomendado en esta asignatura"},{"type":"p","text":"También pueden compararse por el tipo de información que utilizan:"},{"type":"table","rows":[["Métrica","Tipo","Qué compara","Idea central"],["BERTScore","Métrica basada en embeddings contextuales","Hipótesis y referencia","Compara tokens mediante similitud semántica contextual"],["BLEURT","Métrica neuronal aprendida","Hipótesis y referencia","Aprende a predecir juicios humanos usando BERT"],["COMET","Métrica neuronal para traducción automática","Fuente, hipótesis y referencia","Predice calidad traductológica con modelos multilingües"]],"title":"También pueden compararse por el tipo de información que utilizan"}]},{"id":"1-12-como-interpretar-las-metricas","title":"1.12. Cómo interpretar las métricas","blocks":[{"type":"p","text":"Para alumnado de segundo curso, la idea más importante es que las métricas no deben interpretarse como verdades absolutas. Toda métrica simplifica la realidad. La traducción implica significado, gramática, pragmática, estilo, terminología, adecuación al encargo y naturalidad. Ninguna puntuación numérica recoge todo eso por sí sola."},{"type":"p","text":"Conviene retener cuatro ideas:"},{"type":"ol","items":["Toda métrica simplifica la realidad.","Las métricas clásicas son más transparentes, pero menos semánticas.","Las métricas neuronales son más flexibles, pero menos interpretables.","La evaluación humana sigue siendo necesaria."]},{"type":"p","text":"La evaluación automática de traducciones ha evolucionado desde métricas basadas en coincidencias superficiales hasta métricas neuronales entrenadas para aproximarse a juicios humanos. Las métricas léxicas simples introducen conceptos básicos de comparación textual. BLEU incorpora el orden mediante n-gramas. chrF añade flexibilidad al trabajar con caracteres. METEOR incorpora correspondencias más flexibles. BERTScore, BLEURT y COMET representan una transición hacia la comparación semántica."},{"type":"p","text":"Para una estudiante de Tecnologías del Lenguaje, la idea esencial es esta: evaluar traducciones no consiste solo en calcular una puntuación, sino en entender qué aspecto de la calidad mide cada métrica, qué deja fuera y en qué contexto puede utilizarse con sentido."}]}],"navTitle":"Marco teórico"},{"id":"2-evaluacion-automatica-con-python","title":"2. Evaluación automática con Python","blocks":[],"subsections":[{"id":"2-1-preparar-los-textos-antes-de-medir","title":"2.1. Preparar los textos antes de medir","blocks":[{"type":"p","text":"Antes de calcular métricas, necesitamos preparar los textos. Si no lo hacemos, diferencias irrelevantes pueden contaminar los resultados."},{"type":"p","text":"Imagina estas dos frases:"},{"type":"table","rows":[["Referencia","Hipótesis"],["Mi casa es azul","mi casa es azul."]],"title":"Imagina estas dos frases"},{"type":"p","text":"Desde el punto de vista lingüístico, son prácticamente iguales. Pero si Python compara las palabras de forma literal, puede considerar distintas Mi y mi, o azul y azul.. Para evitarlo, se aplica una limpieza mínima:"},{"type":"ul","items":["pasar todo a minúsculas;","quitar signos de puntuación;","dividir el texto en palabras."]},{"type":"p","text":"Una función sencilla para limpiar palabras puede ser:"},{"type":"code","code":"def limpiar_palabra(palabra):\n    return palabra.strip('.,;:!?\"¡¿()[]{}')"},{"type":"p","text":"Esta función recibe una palabra y elimina signos de puntuación al principio o al final. Después podemos procesar una frase completa:"},{"type":"code","code":"def procesar_texto(texto):\n    texto = texto.lower()\n    palabras = texto.split()\n    palabras = [limpiar_palabra(p) for p in palabras]\n    return palabras"},{"type":"p","text":"Aquí aparecen varias ideas importantes:"},{"type":"table","rows":[["Línea","Qué hace"],["texto.lower()","Convierte todo a minúsculas"],["texto.split()","Divide el texto por espacios"],["[limpiar_palabra(p) for p in palabras]","Limpia cada palabra de la lista"],["return palabras","Devuelve la lista procesada"]],"title":"Aquí aparecen varias ideas importantes"},{"type":"p","text":"El resultado ya no es una frase como string, sino una lista de tokens:"},{"type":"code","code":"referencia = \"Los árboles son altos.\"\ntraduccion_prueba = \"Los arboles estan grandes\"\n\nreferencia_proc = procesar_texto(referencia)\ntraduccion_prueba_proc = procesar_texto(traduccion_prueba)\n\nprint(\"Referencia:\", referencia_proc)\nprint(\"Traducción:\", traduccion_prueba_proc)"},{"type":"p","text":"La limpieza no es una operación inocente. Simplifica el texto para poder comparar. En una evaluación real, habría que decidir si se quieren conservar tildes, signos, mayúsculas, puntuación o segmentación más fina. En esta unidad usamos una limpieza básica porque permite entender la lógica de las métricas."}]},{"id":"2-2-precision-lexica-con-python","title":"2.2. Precision léxica con Python","blocks":[{"type":"p","text":"La precisión léxica pregunta: de todas las palabras que ha producido la traducción automática, ¿cuántas aparecen también en la referencia?"},{"type":"p","text":"En Python se puede calcular así:"},{"type":"code","code":"palabras_correctas = sum(\n    1\n    for palabra in traduccion_prueba_proc\n    if palabra in referencia_proc\n)\n\nprecision = palabras_correctas / len(traduccion_prueba_proc)\n\nprint(f\"Precisión: {precision:.2f}\")"},{"type":"p","text":"La expresión sum(1 for palabra in traduccion_prueba_proc if palabra in referencia_proc) recorre cada palabra de la traducción automática. Si esa palabra está también en la referencia, suma 1."},{"type":"p","text":"En el caso:"},{"type":"table","rows":[["Referencia procesada","Hipótesis procesada"],["['los', 'árboles', 'son', 'altos']","['los', 'arboles', 'estan', 'grandes']"]],"title":"En el caso"},{"type":"p","text":"solo coincide los, porque árboles y arboles no son idénticas por la tilde, son y estan son diferentes, y altos y grandes no coinciden. La precisión sería:"},{"type":"code","code":"Precision = 1 / 4 = 0.25"},{"type":"p","text":"Este resultado enseña algo importante: la métrica no sabe que árboles y arboles son variantes casi idénticas salvo por la tilde. Tampoco sabe que altos y grandes pueden estar semánticamente relacionados. Solo compara formas."}]},{"id":"2-3-traduccion-automatica-con-deep-translator","title":"2.3. Traducción automática con deep-translator","blocks":[{"type":"p","text":"Para generar una traducción automática desde Python puede usarse la biblioteca deep-translator, que permite acceder a varios motores de traducción online, entre ellos Google Translate."},{"type":"p","text":"La instalación en un entorno interactivo puede hacerse así:"},{"type":"code","code":"%pip install deep-translator"},{"type":"p","text":"Después se importa la clase GoogleTranslator:"},{"type":"code","code":"from deep_translator import GoogleTranslator"},{"type":"p","text":"Y se genera la traducción:"},{"type":"code","code":"original = \"Those trees were big.\"\n\ntradu_auto = GoogleTranslator(\n    source=\"en\",\n    target=\"es\"\n).translate(original)\n\nprint(\"Traducción automática:\", tradu_auto)"},{"type":"p","text":"Los argumentos source y target indican la lengua de origen y la lengua de destino. En este ejemplo, source=\"en\" indica inglés y target=\"es\" indica español."},{"type":"p","text":"Una vez obtenida la traducción automática, se procesan los tres textos:"},{"type":"code","code":"original_proc = procesar_texto(original)\ntradu_humana_proc = procesar_texto(tradu_humana)\ntradu_auto_proc = procesar_texto(tradu_auto)"},{"type":"p","text":"Para las métricas léxicas, normalmente compararemos tradu_auto_proc con tradu_humana_proc. El texto fuente queda como contexto traductológico, aunque algunas métricas clásicas no lo usen directamente."}]},{"id":"2-4-recall-lexico","title":"2.4. Recall léxico","blocks":[{"type":"p","text":"El recall léxico pregunta: de todas las palabras que aparecen en la referencia humana, ¿cuántas ha recuperado la traducción automática?"},{"type":"p","text":"En Python:"},{"type":"code","code":"recall = sum(\n    1\n    for palabra in tradu_humana_proc\n    if palabra in tradu_auto_proc\n) / len(tradu_humana_proc)\n\nprint(f\"Recall léxico: {recall:.2f}\")"},{"type":"p","text":"La estructura es muy parecida a la de precision, pero cambia el punto de vista. En precision recorremos la traducción automática; en recall recorremos la referencia."},{"type":"p","text":"Esta diferencia es lingüísticamente importante:"},{"type":"table","rows":[["Métrica","Punto de vista","Pregunta"],["Precision","Traducción automática","¿Cuánto de lo que produjo el sistema coincide?"],["Recall","Referencia humana","¿Cuánto de lo esperado fue recuperado?"]],"title":"Esta diferencia es lingüísticamente importante"},{"type":"p","text":"Una traducción puede tener alta precision y bajo recall si produce pocas palabras, pero correctas. También puede tener recall relativamente alto y precision más baja si produce muchas palabras añadidas."}]},{"id":"2-5-f1-score","title":"2.5. F1-score","blocks":[{"type":"p","text":"El F1-score combina precision y recall. Para evitar errores cuando ambas métricas valen cero, conviene comprobar antes que la suma sea mayor que cero:"},{"type":"code","code":"if precision + recall > 0:\n    f1 = 2 * (precision * recall) / (precision + recall)\nelse:\n    f1 = 0\n\nprint(f\"F1-score: {f1:.2f}\")"},{"type":"p","text":"La condición if precision + recall > 0 evita una división entre cero. Este detalle técnico tiene una lectura metodológica: no siempre hay coincidencias entre hipótesis y referencia. Si no hay ninguna coincidencia, el F1 debe ser cero."},{"type":"p","text":"F1 resulta útil cuando queremos una medida equilibrada. Si una traducción produce muchas palabras correctas, pero omite mucha información, el F1 no se disparará. Si recupera mucho vocabulario, pero introduce muchas palabras no presentes en la referencia, tampoco será perfecto."}]},{"id":"2-6-exact-match","title":"2.6. Exact Match","blocks":[{"type":"p","text":"Exact Match es la métrica más estricta. Comprueba si las listas procesadas son idénticas:"},{"type":"code","code":"exact_match = tradu_auto_proc == tradu_humana_proc\n\nprint(f\"Exact Match: {'Sí' if exact_match else 'No'}\")"},{"type":"p","text":"La expresión tradu_auto_proc == tradu_humana_proc devuelve True si ambas listas son exactamente iguales y False si hay cualquier diferencia."},{"type":"p","text":"Esto implica que Exact Match será No si:"},{"type":"ul","items":["cambia una palabra;","falta una tilde que no se ha normalizado;","cambia el orden;","aparece una palabra adicional;","se omite una palabra;","se usa un sinónimo."]},{"type":"p","text":"Por eso Exact Match es útil para enseñar la idea de coincidencia estricta, pero no suele ser una buena métrica para evaluar traducciones naturales. La traducción admite variación."}]},{"id":"2-7-indice-jaccard","title":"2.7. Índice Jaccard","blocks":[{"type":"p","text":"El índice Jaccard compara conjuntos de palabras. En Python, los conjuntos se crean con set():"},{"type":"code","code":"set_auto = set(tradu_auto_proc)\nset_humana = set(tradu_humana_proc)\n\njaccard = len(set_auto & set_humana) / len(set_auto | set_humana)\n\nprint(f\"Índice Jaccard: {jaccard:.2f}\")"},{"type":"p","text":"Jaccard ignora el orden y las repeticiones. Por eso puede ser útil para medir solapamiento de vocabulario, pero no para evaluar estructura sintáctica."},{"type":"p","text":"En el ejemplo Esos árboles eran enormes frente a Esos árboles eran grandes, los conjuntos son:"},{"type":"code","code":"Automática = {esos, árboles, eran, grandes}\nHumana = {esos, árboles, eran, enormes}\nIntersección = {esos, árboles, eran}\nUnión = {esos, árboles, eran, grandes, enormes}\nJaccard = 3 / 5 = 0.60"},{"type":"p","text":"La puntuación es inferior a precision y recall porque Jaccard compara el vocabulario compartido con todo el vocabulario distinto que aparece en ambas traducciones."}]},{"id":"2-8-informe-de-metricas-lexicas","title":"2.8. Informe de métricas léxicas","blocks":[{"type":"p","text":"Cuando se calculan varias métricas, conviene presentarlas juntas:"},{"type":"code","code":"print(f\"Precisión léxica: {precision:.2f}\")\nprint(f\"Recall léxico: {recall:.2f}\")\nprint(f\"F1-score: {f1:.2f}\")\nprint(f\"Exact Match: {'Sí' if exact_match else 'No'}\")\nprint(f\"Índice Jaccard: {jaccard:.2f}\")"},{"type":"p","text":"Un conjunto de resultados puede ser:"},{"type":"table","rows":[["Métrica","Valor","Lectura"],["Precisión léxica","0.75","El 75 % de las palabras generadas coincide con la referencia"],["Recall léxico","0.75","El 75 % de la referencia fue recuperado"],["F1-score","0.75","Hay equilibrio entre precision y recall"],["Jaccard","0.60","El vocabulario compartido representa el 60 % del vocabulario total único"],["Exact Match","No","Las frases no son idénticas"]],"title":"Un conjunto de resultados puede ser"},{"type":"p","text":"La interpretación profesional sería: la traducción automática es bastante buena desde el punto de vista léxico, pero no idéntica. Cambiar una palabra por otra próxima puede hacer que Exact Match sea No, aunque otras métricas sigan siendo altas."}]},{"id":"2-9-bleu-con-nltk","title":"2.9. BLEU con NLTK","blocks":[{"type":"p","text":"BLEU se puede calcular con nltk:"},{"type":"code","code":"import nltk\nfrom nltk.translate.bleu_score import sentence_bleu, SmoothingFunction"},{"type":"p","text":"Para evaluar una frase, sentence_bleu() espera una lista de referencias y una candidata:"},{"type":"code","code":"reference = [tradu_humana_proc]\ncandidate = tradu_auto_proc\n\nbleu = sentence_bleu(\n    reference,\n    candidate,\n    smoothing_function=SmoothingFunction().method1\n)\n\nprint(f\"BLEU: {bleu:.2f}\")"},{"type":"p","text":"Hay dos detalles importantes:"},{"type":"ol","items":["reference = [tradu_humana_proc] usa una lista de listas porque BLEU permite comparar una hipótesis con varias referencias.","SmoothingFunction().method1 suaviza el cálculo para evitar que BLEU sea cero en frases cortas cuando no hay coincidencias de n-gramas largos."]},{"type":"p","text":"En el caso Esos árboles eran enormes frente a Esos árboles eran grandes, el resultado puede sorprender porque la puntuación BLEU puede estar alrededor de 0.40. Las frases solo cambian en una palabra, pero esa palabra rompe varios n-gramas."},{"type":"table","rows":[["Nivel","Coincidencias"],["Unigramas","3 de 4"],["Bigramas","2 de 3"],["Trigramas","1 de 2"],["4-gramas","0 de 1"]],"title":"Nivel · Coincidencias"},{"type":"p","text":"BLEU combina estas precisiones mediante un promedio geométrico. Si un nivel tiene cero coincidencias, la puntuación baja mucho. El smoothing evita que el resultado sea cero total, pero no elimina la penalización."},{"type":"p","text":"La lectura lingüística es clara: BLEU no solo mide palabras sueltas. Mide continuidad formal. Por eso una diferencia en la última palabra afecta a toda la secuencia final."}]},{"id":"2-10-chrf-con-evaluate","title":"2.10. chrF con evaluate","blocks":[{"type":"p","text":"Para calcular chrF puede usarse la biblioteca evaluate, junto con sacrebleu:"},{"type":"code","code":"!pip install evaluate sacrebleu -q"},{"type":"p","text":"Después se carga la métrica:"},{"type":"code","code":"from evaluate import load\n\nchrf_metric = load(\"chrf\")"},{"type":"p","text":"chrF trabaja con texto completo, no con listas de palabras procesadas. Por eso conviene usar las cadenas originales:"},{"type":"code","code":"resultado_chrf = chrf_metric.compute(\n    predictions=[tradu_auto],\n    references=[tradu_humana]\n)\n\nprint(f\"chrF: {resultado_chrf['score']:.2f}\")"},{"type":"p","text":"El resultado de compute() es un diccionario. La clave score contiene la puntuación principal."},{"type":"p","text":"Es importante recordar que BLEU y METEOR aparecen en escala 0–1 en NLTK, mientras que chrF en evaluate suele aparecer en escala 0–100. Por tanto, no deben compararse los números de forma directa sin mirar la escala."},{"type":"table","rows":[["Valor de chrF","Lectura orientativa"],["Bajo","Hay poca similitud formal entre hipótesis y referencia"],["Medio","Hay coincidencias parciales, pero también diferencias"],["Alto","La hipótesis se parece mucho a la referencia en su forma lingüística"]],"title":"Valor de chrF · Lectura orientativa"},{"type":"p","text":"chrF no comprende plenamente el significado ni la calidad estilística, pero complementa a BLEU cuando hay variaciones morfológicas o pequeñas diferencias formales."}]},{"id":"2-11-meteor-con-nltk","title":"2.11. METEOR con NLTK","blocks":[{"type":"p","text":"METEOR también está disponible en nltk. Antes de usarlo hay que descargar WordNet, el recurso léxico que emplea para buscar sinónimos:"},{"type":"code","code":"import nltk\nfrom nltk.translate.meteor_score import meteor_score\n\nnltk.download(\"wordnet\")\nnltk.download(\"omw-1.4\")"},{"type":"p","text":"Como sentence_bleu(), la función meteor_score() recibe una lista de referencias y una hipótesis, ambas ya tokenizadas:"},{"type":"code","code":"meteor = meteor_score(\n    [tradu_humana_proc],\n    tradu_auto_proc\n)\n\nprint(f\"METEOR: {meteor:.2f}\")"},{"type":"p","text":"Hay dos detalles importantes:"},{"type":"ul","items":["[tradu_humana_proc] es una lista de listas, igual que en BLEU. Si se proporcionan varias referencias, METEOR se queda con la puntuación más alta.","Las entradas deben ser listas de palabras, no cadenas de texto. Si se pasa una frase sin tokenizar, las versiones recientes de NLTK producen un error (TypeError)."]},{"type":"p","text":"En el caso Esos árboles eran enormes frente a Esos árboles eran grandes, METEOR da 0.74, mientras que BLEU se quedaba en torno a 0.40:"},{"type":"table","rows":[["Métrica","Valor","Por qué"],["BLEU","0.40","La sustitución de una palabra rompe bigramas, trigramas y el 4-grama"],["METEOR","0.74","Tres de cuatro palabras coinciden y forman un único fragmento ordenado"]],"title":"Métrica · Valor · Por qué"},{"type":"p","text":"El contraste es instructivo. METEOR alinea palabras individuales y solo después mira el orden; por eso castiga menos una sustitución aislada. Pero tampoco reconoce grandes y enormes como equivalentes: en español no dispone de sinónimos."},{"type":"p","text":"METEOR en español. Por defecto, meteor_score() utiliza el stemmer de Porter, pensado para inglés, y el WordNet inglés para los sinónimos. En español, la fase de sinónimos no actúa y la de raíces solo acierta por casualidad. La fase de raíces se puede mejorar pasando un stemmer para español mediante el argumento stemmer:"},{"type":"code","code":"from nltk.stem import SnowballStemmer\n\nstemmer_es = SnowballStemmer(\"spanish\")\n\nreferencia = \"el informe muestra que la inflación baja\".split()\nhipotesis = \"los informes muestran que la inflación bajó\".split()\n\nprint(meteor_score([referencia], hipotesis))\nprint(meteor_score([referencia], hipotesis, stemmer=stemmer_es))"},{"type":"table","rows":[["Configuración","METEOR","Qué ocurre"],["Por defecto (Porter)","0.54","Solo empareja informe/informes, que Porter reduce por casualidad a la misma raíz"],["SnowballStemmer(\"spanish\")","0.86","Además empareja muestra/muestran y baja/bajó"]],"title":"Configuración · METEOR · Qué ocurre"},{"type":"p","text":"La lectura lingüística es clara: METEOR no es un número único, sino una familia de configuraciones. Al informar de un resultado conviene indicar qué stemmer y qué recurso de sinónimos se han usado."},{"type":"p","text":"Como con chrF, la escala orienta la lectura:"},{"type":"table","rows":[["Valor de METEOR","Lectura orientativa"],["Bajo","La hipótesis recupera pocas palabras de la referencia, o las recupera muy desordenadas"],["Medio","Hay coincidencias, pero faltan palabras o el orden está fragmentado"],["Alto","La hipótesis recupera casi toda la referencia en un orden parecido"]],"title":"Como con chrF, la escala orienta la lectura"},{"type":"p","text":"METEOR complementa a BLEU: es menos severo con las sustituciones aisladas y más sensible a las omisiones, porque prioriza el recall. El cuaderno de práctica sobre METEOR de esta unidad aplica la métrica a ejemplos en español de los ámbitos médico, jurídico y económico."}]},{"id":"2-12-todas-las-metricas-en-un-mismo-informe","title":"2.12. Todas las métricas en un mismo informe","blocks":[{"type":"p","text":"Una salida de evaluación completa puede reunir las métricas principales:"},{"type":"code","code":"print(f\"Precisión: {precision:.2f}\")\nprint(f\"Recall: {recall:.2f}\")\nprint(f\"F1-score: {f1:.2f}\")\nprint(f\"Jaccard: {jaccard:.2f}\")\nprint(f\"BLEU: {bleu:.2f}\")\nprint(f\"chrF: {resultado_chrf['score']:.2f}\")\nprint(f\"METEOR: {meteor:.2f}\")\nprint(f\"Exact Match: {'Sí' if exact_match else 'No'}\")"},{"type":"p","text":"El informe no debe limitarse a imprimir números. Debe incluir interpretación:"},{"type":"table","rows":[["Métrica","Pregunta interpretativa"],["Precision","¿Cuánto de lo producido por la máquina coincide?"],["Recall","¿Cuánto de la referencia se recupera?"],["F1","¿Hay equilibrio entre exactitud y cobertura?"],["Jaccard","¿Cuánto vocabulario único comparten las versiones?"],["BLEU","¿Coinciden secuencias de palabras?"],["chrF","¿Hay similitud formal por caracteres?"],["METEOR","¿Se recuperan las palabras de la referencia, aunque sea por raíz o sinónimo, y en un orden razonable?"],["Exact Match","¿Son idénticas las versiones?"]],"title":"Métrica · Pregunta interpretativa"},{"type":"p","text":"Esta interpretación es la parte lingüística del trabajo. Python calcula; la especialista explica."}]},{"id":"2-13-como-leer-casos-con-sinonimos-y-reformulacion","title":"2.13. Cómo leer casos con sinónimos y reformulación","blocks":[{"type":"p","text":"Un caso especialmente interesante es aquel en que la traducción automática usa sinónimos:"},{"type":"table","rows":[["Referencia","Hipótesis"],["Los estudiantes escuchaban atentos mientras el profesor explicaba con calma los conceptos clave del tema.","Los alumnos prestaban atención mientras el docente exponía tranquilamente las ideas principales del asunto."]],"title":"Referencia · Hipótesis"},{"type":"p","text":"Desde el punto de vista semántico, las frases pueden transmitir una idea parecida. Pero las métricas basadas en coincidencias literales bajarán mucho:"},{"type":"ul","items":["estudiantes y alumnos no son la misma cadena;","profesor y docente no coinciden formalmente;","explicaba y exponía son diferentes;","con calma y tranquilamente son expresiones distintas;","conceptos clave e ideas principales son reformulaciones."]},{"type":"p","text":"Exact Match será No. BLEU puede ser muy bajo porque las secuencias de palabras no coinciden. Jaccard también bajará porque el vocabulario compartido es reducido. chrF puede conservar algo más de información si hay fragmentos de caracteres compartidos, pero tampoco reconocerá completamente la equivalencia semántica. METEOR, que en inglés podría emparejar sinónimos gracias a WordNet, se comporta en español casi como una métrica de coincidencia exacta: en este ejemplo se queda alrededor de 0.21."},{"type":"p","text":"La conclusión profesional no debe ser «la traducción es mala» solo porque las métricas bajen. La conclusión correcta es más matizada: las métricas de coincidencia formal penalizan la sinonimia y la reformulación; por tanto, hace falta evaluación humana o métricas semánticas para valorar si el significado se conserva."}]},{"id":"2-14-buenas-practicas-para-interpretar-resultados","title":"2.14. Buenas prácticas para interpretar resultados","blocks":[{"type":"p","text":"Cuando se evalúan traducciones automáticas con Python, conviene seguir varias buenas prácticas:"},{"type":"ol","items":["No interpretar una métrica aislada. Un solo número puede ser engañoso.","Mirar qué mide cada métrica. Precision no mide lo mismo que BLEU, y BLEU no mide lo mismo que chrF.","Revisar la escala. BLEU y METEOR en NLTK usan 0–1; chrF en evaluate usa 0–100.","Distinguir forma y significado. Coincidencia formal no siempre equivale a calidad semántica.","Tener en cuenta la longitud. BLEU puede comportarse de forma inestable en frases cortas.","Documentar la configuración. METEOR cambia según el stemmer y los sinónimos disponibles; conviene indicar cuáles se han usado, sobre todo en lenguas distintas del inglés.","Explicar los resultados con ejemplos. Una interpretación sin evidencia textual queda débil.","Recordar la referencia. Si solo hay una traducción humana, muchas alternativas válidas pueden ser penalizadas.","Complementar con juicio lingüístico. Las métricas orientan, pero no sustituyen la evaluación experta."]},{"type":"p","text":"Una forma profesional de redactar una interpretación sería: La traducción automática presenta una coincidencia léxica moderada-alta con la referencia, como muestran precision, recall y F1. Sin embargo, Exact Match es negativo porque existe al menos una diferencia formal. BLEU baja más que las métricas léxicas simples porque una sustitución léxica rompe varios n-gramas. chrF permite observar si, pese a las diferencias de palabra completa, existe similitud formal por caracteres. METEOR se mantiene más alto que BLEU porque alinea palabras individuales y solo penaliza el desorden, lo que confirma que la diferencia se concentra en una sola palabra. En conjunto, los resultados sugieren una traducción aceptable desde el punto de vista formal, pero la decisión final requiere revisar si la diferencia léxica afecta al significado y al encargo traductológico."}]},{"id":"2-15-que-aporta-python-a-la-evaluacion-linguistica","title":"2.15. Qué aporta Python a la evaluación lingüística","blocks":[{"type":"p","text":"Python permite convertir una pregunta evaluativa en un procedimiento reproducible. En lugar de decir de forma vaga «esta traducción se parece bastante a la humana», podemos calcular varias medidas y justificar una interpretación."},{"type":"p","text":"La aportación de Python se resume en cuatro acciones:"},{"type":"table","rows":[["Acción","Resultado"],["Limpiar textos","Reduce ruido superficial"],["Tokenizar","Convierte frases en unidades comparables"],["Calcular métricas","Produce indicadores cuantitativos"],["Presentar resultados","Facilita una interpretación argumentada"]],"title":"La aportación de Python se resume en cuatro acciones"},{"type":"p","text":"Pero Python no decide por sí solo si una traducción es adecuada. Una métrica puede señalar que dos frases se parecen poco en la forma, aunque sean equivalentes en significado. También puede señalar que dos frases se parecen mucho, aunque una contenga un error semántico grave."},{"type":"p","text":"La competencia de una lingüista computacional consiste precisamente en ocupar ese espacio intermedio: entender el cálculo, conocer sus límites y traducir el número en una interpretación lingüística responsable."}]}],"navTitle":"Python para PLN"},{"id":"errores-frecuentes-de-aprendizaje","title":"Errores frecuentes de aprendizaje","blocks":[{"type":"ul","items":["Confundir una puntuación alta con una evaluación humana completa.","Interpretar Exact Match = No como si la traducción fuera necesariamente incorrecta.","Comparar BLEU, chrF y METEOR sin comprobar antes la escala de cada métrica.","Olvidar que la limpieza previa del texto modifica los resultados.","Usar una sola métrica para decidir la calidad global de una traducción.","No distinguir entre texto fuente, hipótesis y referencia.","Pasar por alto que los sinónimos y las paráfrasis pueden ser correctos aunque bajen las métricas formales.","Aplicar METEOR a textos en español con la configuración por defecto de NLTK sin advertir que su stemmer y sus sinónimos están pensados para inglés."]}],"subsections":[],"navTitle":"Errores frecuentes"},{"id":"sintesis-final","title":"Síntesis final","blocks":[{"type":"p","text":"La evaluación automática de traducciones permite comparar una hipótesis con una referencia y obtener puntuaciones reproducibles. Las métricas léxicas simples, como precision, recall, F1, Exact Match y Jaccard, introducen la lógica básica de coincidencia textual. BLEU añade n-gramas y penalización por brevedad. chrF compara caracteres y resulta más flexible ante variación morfológica. METEOR, BERTScore, BLEURT y COMET amplían la mirada hacia correspondencias más flexibles, similitud semántica y adecuación traductológica."},{"type":"p","text":"En Python, estas ideas se traducen en operaciones concretas: limpiar textos, dividirlos en palabras, contar coincidencias, usar conjuntos, calcular n-gramas y llamar bibliotecas especializadas. Pero el aprendizaje central es interpretativo: una métrica no es una sentencia, sino una herramienta para formular mejores preguntas sobre la calidad de una traducción."}],"subsections":[],"navTitle":"Síntesis"},{"id":"cierre-narrativo","title":"Cierre narrativo","blocks":[{"type":"p","text":"Volvamos al encargo de NexaLingua Quality Lab. El equipo ya tiene un pequeño sistema capaz de comparar una traducción automática con una referencia humana. El informe no sustituye a la revisión profesional, pero permite priorizar."},{"type":"p","text":"Si precision, recall y F1 son altos, puede haber una coincidencia léxica sólida. Si Jaccard es más bajo, puede haber variación de vocabulario. Si BLEU baja mucho, quizá las secuencias no coinciden aunque el contenido sea próximo. Si chrF es alto, puede haber similitud formal incluso cuando no todas las palabras coinciden. Si METEOR se mantiene alto aunque BLEU baje, las palabras de la referencia están presentes y en un orden razonable, aunque no formen secuencias largas idénticas. Si Exact Match es No, eso solo indica que no hay identidad total; no implica automáticamente mala traducción."},{"type":"p","text":"El equipo puede usar el informe para decidir:"},{"type":"ul","items":["qué segmentos revisar primero;","qué motor parece más consistente;","qué casos merecen evaluación humana detallada;","qué métricas conviene usar en cada tipo de texto;","qué limitaciones deben explicarse al cliente."]},{"type":"p","text":"Esta unidad, por tanto, no enseña solo a calcular métricas. Enseña a pensar como una lingüista que trabaja con herramientas computacionales: con precisión técnica, prudencia interpretativa y atención al significado."}],"subsections":[],"navTitle":"Cierre narrativo"}],"references":[{"key":"banerjee2005","text":"Banerjee, S. y Lavie, A. (2005). METEOR: An automatic metric for MT evaluation with improved correlation with human judgments. En *Proceedings of the ACL Workshop on Intrinsic and Extrinsic Evaluation Measures for Machine Translation and/or Summarization* (pp. 65-72). Association for Computational Linguistics. https://aclanthology.org/W05-0909/"},{"key":"mathur2020","text":"Mathur, N., Baldwin, T. y Cohn, T. (2020). Tangled up in BLEU: Reevaluating the evaluation of automatic machine translation evaluation metrics. En *Proceedings of the 58th Annual Meeting of the Association for Computational Linguistics* (pp. 4984-4997). Association for Computational Linguistics. https://aclanthology.org/2020.acl-main.448/"},{"key":"papineni2002","text":"Papineni, K., Roukos, S., Ward, T. y Zhu, W.-J. (2002). BLEU: A method for automatic evaluation of machine translation. En *Proceedings of the 40th Annual Meeting of the Association for Computational Linguistics* (pp. 311-318). Association for Computational Linguistics. https://aclanthology.org/P02-1040/"},{"key":"popovic2015","text":"Popović, M. (2015). chrF: Character n-gram F-score for automatic MT evaluation. En *Proceedings of the Tenth Workshop on Statistical Machine Translation* (pp. 392-395). Association for Computational Linguistics. https://aclanthology.org/W15-3049/"},{"key":"rei2020","text":"Rei, R., Stewart, C., Farinha, A. C. y Lavie, A. (2020). COMET: A neural framework for MT evaluation. En *Proceedings of the 2020 Conference on Empirical Methods in Natural Language Processing* (pp. 2685-2702). Association for Computational Linguistics. https://aclanthology.org/2020.emnlp-main.213/"},{"key":"sellam2020","text":"Sellam, T., Das, D. y Parikh, A. P. (2020). BLEURT: Learning robust metrics for text generation. En *Proceedings of the 58th Annual Meeting of the Association for Computational Linguistics* (pp. 7881-7892). Association for Computational Linguistics. https://aclanthology.org/2020.acl-main.704/"},{"key":"zhang2020","text":"Zhang, T., Kishore, V., Wu, F., Weinberger, K. Q. y Artzi, Y. (2020). BERTScore: Evaluating text generation with BERT. En *International Conference on Learning Representations*. https://openreview.net/forum?id=SkeHuCVFDr"}]}};

  function sha256Hex(text) {
    var enc = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", enc).then(function(buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function(b) {
        return b.toString(16).padStart(2, "0");
      }).join("");
    });
  }

  function showView(id) {
    document.querySelectorAll(".view").forEach(function(v) { v.hidden = true; });
    var el = document.getElementById(id) || document.getElementById("view-" + id);
    if (el) el.hidden = false;
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  var quizState = null;

  function renderQuizStart() {
    var root = document.getElementById("quiz-root");
    if (!root) return;
    root.innerHTML =
      '<div class="quiz-start">' +
      '<p>10 preguntas: 5 elegidas al azar del banco del manual y 5 del banco del cuaderno. Puedes repetir el intento tantas veces como quieras — cada vez se vuelven a elegir y reordenar las preguntas.</p>' +
      '<button class="quiz-btn" id="quiz-begin">Empezar</button>' +
      '</div>';
    document.getElementById("quiz-begin").addEventListener("click", startQuiz);
  }

  function startQuiz() {
    var fromManual = shuffle(QUIZ_MANUAL).slice(0, 5);
    var fromCuaderno = shuffle(QUIZ_CUADERNO).slice(0, 5);
    quizState = { questions: shuffle(fromManual.concat(fromCuaderno)), index: 0, score: 0 };
    renderQuizQuestion();
  }

  function renderQuizQuestion() {
    var root = document.getElementById("quiz-root");
    var total = quizState.questions.length;
    if (quizState.index >= total) {
      root.innerHTML =
        '<div class="quiz-result">' +
        '<div class="quiz-score">' + quizState.score + ' / ' + total + '</div>' +
        '<p>Puntuación de este intento.</p>' +
        '<button class="quiz-btn" id="quiz-retry">Volver a intentar</button>' +
        '</div>';
      document.getElementById("quiz-retry").addEventListener("click", startQuiz);
      return;
    }
    var q = quizState.questions[quizState.index];
    var opts = shuffle(q.answerOptions);
    var html = '<div class="quiz-progress">Pregunta ' + (quizState.index + 1) + ' de ' + total + ' · Puntuación provisional: ' + quizState.score + '</div>';
    html += '<div class="quiz-q"><h3>' + q.question + '</h3>';
    opts.forEach(function(opt, i) {
      html += '<button class="quiz-opt" data-idx="' + i + '">' + opt.text + '</button>';
    });
    html += '<div class="quiz-feedback" id="quiz-feedback" hidden></div>';
    html += '</div>';
    root.innerHTML = html;
    var buttons = root.querySelectorAll(".quiz-opt");
    buttons.forEach(function(btn, i) {
      btn.addEventListener("click", function() {
        buttons.forEach(function(b) { b.disabled = true; });
        var chosen = opts[i];
        if (chosen.isCorrect) { btn.classList.add("correct"); quizState.score++; }
        else {
          btn.classList.add("incorrect");
          buttons.forEach(function(b2, j) { if (opts[j].isCorrect) b2.classList.add("correct"); });
        }
        var fb = document.getElementById("quiz-feedback");
        fb.hidden = false;
        fb.textContent = chosen.rationale || (chosen.isCorrect ? "Correcto." : "Incorrecto.");
        var next = document.createElement("button");
        next.className = "quiz-btn";
        next.style.marginTop = "14px";
        next.textContent = quizState.index + 1 < total ? "Siguiente" : "Ver puntuación";
        next.addEventListener("click", function() { quizState.index++; renderQuizQuestion(); });
        root.querySelector(".quiz-q").appendChild(next);
      });
    });
  }

  function imEsc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function imFormatBackticks(s) {
    var parts = s.split("`"), out = "";
    for (var i = 0; i < parts.length; i++) out += (i % 2 === 1) ? '<code class="im-inline">' + imEsc(parts[i]) + "</code>" : imEsc(parts[i]);
    return out;
  }
  function imFormatInline(raw) {
    var re = /{{cite:([^}]*)}}([\s\S]*?){{\/cite}}/g;
    var out = "", last = 0, m;
    while ((m = re.exec(raw))) {
      out += imFormatBackticks(raw.slice(last, m.index));
      out += '<span class="im-cite" data-refs="' + m[1] + '">' + imFormatBackticks(m[2]) + ' <span aria-hidden="true">ⓘ</span></span>';
      last = re.lastIndex;
    }
    out += imFormatBackticks(raw.slice(last));
    return out;
  }
  function imLinkify(text) {
    var re = /(https?:\/\/[^\s]+)/g;
    var out = "", last = 0, m;
    while ((m = re.exec(text))) {
      out += imEsc(text.slice(last, m.index));
      var url = m[1].replace(/[.,;]+$/, "");
      out += '<a href="' + imEsc(url) + '" target="_blank" rel="noopener">' + imEsc(url) + "</a>";
      last = m.index + url.length;
    }
    out += imEsc(text.slice(last));
    return out;
  }
  function imBibText(text) {
    // *word* marks an APA-italicized container title (book/journal name+volume/etc.)
    return text.split(/(\*[^*]+\*)/g).map(function(part) {
      if (part.charAt(0) === "*" && part.charAt(part.length - 1) === "*" && part.length > 1) {
        return "<em>" + imLinkify(part.slice(1, -1)) + "</em>";
      }
      return imLinkify(part);
    }).join("");
  }
  function imRefLookup(data) {
    var m = {};
    data.references.forEach(function(r) { m[r.key] = r.text; });
    return m;
  }
  function imOpenModal(title, bodyHtml, wide) {

      '</h4><button class="im-modal-close" aria-label="Cerrar">✕</button></div><div class="im-modal-body">' + bodyHtml + "</div></div>";
    (document.fullscreenElement || document.webkitFullscreenElement || document.body).appendChild(overlay);

    overlay.addEventListener("click", function(e) { if (e.target === overlay) close(); });
    overlay.querySelector(".im-modal-close").addEventListener("click", close);
    function onKey(e) { if (e.key === "Escape") close(); }
    document.addEventListener("keydown", onKey);
  }
  function imTableHtml(b) {
    var head = b.rows[0], body = b.rows.slice(1);
    return "<table><thead><tr>" + head.map(function(h) { return "<th>" + imFormatInline(h) + "</th>"; }).join("") + "</tr></thead><tbody>" +
      body.map(function(r) { return "<tr>" + r.map(function(c) { return "<td>" + imFormatInline(c) + "</td>"; }).join("") + "</tr>"; }).join("") +
      "</tbody></table>";
  }
  function imRenderTable(b, key, bare) {
